<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 3D Interactiva</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #87ceeb;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* Interfaz del Joystick Virtual */
    #joystick-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #joystick-knob {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* Alerta de Audio para cumplir reglas de Chrome */
    #audio-prompt {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 100;
      pointer-events: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">
  ⬅ Volver
</button>

<div id="audio-prompt">🔊 Haz clic en la pantalla para activar el sonido</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// Configuración básica
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 6, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

// Controles de cámara
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.target.set(0, 1.5, 0);

// Iluminación
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));
const dir = new THREE.DirectionalLight(0xffffff, 2);
dir.position.set(20, 30, 10);
scene.add(dir);

// Gestión de Audio (Chrome compliance)
const listener = new THREE.AudioListener();
camera.add(listener);

const oceanSound = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();

// NOTA: Reemplaza 'mar.mp3' por la ruta de tu archivo de sonido en el repositorio
audioLoader.load('mar.mp3', (buffer) => {
  oceanSound.setBuffer(buffer);
  oceanSound.setLoop(true);
  oceanSound.setVolume(0.5);
}, undefined, (err) => console.log("Aviso: Agrega 'mar.mp3' a tu repositorio para escuchar las olas."));

// Activar audio tras interacción del usuario
window.addEventListener('click', () => {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (oceanSound.buffer && !oceanSound.isPlaying) {
    oceanSound.play();
    const prompt = document.getElementById('audio-prompt');
    if(prompt) prompt.style.display = 'none';
  }
});

// Loaders y Mixers de Animación
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       // Mixer del Avatar
let islandMixer = null; // Mixer de la Isla (Árboles/Mar)

// Cargar isla con soporte de animación propio
loader.load(
  "isla.glb",
  (gltf) => {
    scene.add(gltf.scene);
    console.log("Isla cargada");

    // Si la isla trae animaciones de Blender para árboles o agua, las activamos aquí
    if (gltf.animations && gltf.animations.length > 0) {
      islandMixer = new THREE.AnimationMixer(gltf.scene);
      gltf.animations.forEach((clip) => {
        islandMixer.clipAction(clip).play();
      });
    }
  },
  undefined,
  (err) => console.error("Error cargando isla:", err)
);

// Cargar avatar
loader.load(
  "luis-avatar2.glb",
  (gltf) => {
    avatar = gltf.scene;
    avatar.position.set(0, 0, 0);
    scene.add(avatar);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(avatar);
      gltf.animations.forEach((clip) => {
        mixer.clipAction(clip).play();
      });
    }
    console.log("Avatar cargado");
  },
  undefined,
  (err) => console.error("Error cargando avatar:", err)
);

// --- SISTEMA DE CONTROL DE MOVIMIENTO ---
const moveInput = { x: 0, y: 0 }; // Valores normalizados entre -1 y 1

// 1. Lógica del Joystick Virtual (Mobile)
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
const maxRadio = 40; // Rango máximo de movimiento del knob (px)

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  joystickStart = { x: e.clientX, y: e.clientY };
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - joystickStart.x;
  const dy = e.clientY - joystickStart.y;
  const distancia = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadio);
  const angulo = Math.atan2(dy, dx);

  const moveX = Math.cos(angulo) * distancia;
  const moveY = Math.sin(angulo) * distancia;

  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;

  // Seteamos inputs basados en la posición del joystick
  moveInput.x = moveX / maxRadio;
  moveInput.y = -moveY / maxRadio; // Invertido para que arriba sea avance (+Z forward en cálculo de cámara)
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0;
  moveInput.y = 0;
});

// 2. Lógica de Teclado Fallback (Desktop WASD)
const keys = { w: false, a: false, s: false, d: false };
window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = true;
  actualizarTeclado();
});

window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = false;
  actualizarTeclado();
});

function actualizarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    moveInput.y = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  }
}

// Render loop alternado uniformemente con Delta
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  // Actualizar animaciones de esqueleto si existen
  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);

  // Procesar movimiento del Avatar si hay entrada registrada
  if (avatar && (moveInput.x !== 0 || moveInput.y !== 0)) {
    
    // Calcular dirección horizontal de la cámara para que los controles sean relativos a la vista
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const camRight = new THREE.Vector3();
    camRight.crossVectors(camDir, camera.up).normalize();

    // Vector de movimiento final combinado
    const direccionMovimiento = new THREE.Vector3();
    direccionMovimiento.addScaledVector(camRight, moveInput.x);
    direccionMovimiento.addScaledVector(camDir, moveInput.y);
    direccionMovimiento.normalize();

    // Aplicar velocidad de traslación
    const velocidad = 4.5; 
    avatar.position.addScaledVector(direccionMovimiento, velocidad * delta);

    // Rotar el avatar de forma instantánea hacia donde camina
    const anguloRotacion = Math.atan2(direccionMovimiento.x, direccionMovimiento.z);
    avatar.rotation.y = anguloRotacion;

    // Forzar a los controles OrbitControls a seguir el paso del avatar
    controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1.5, 0));
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// Ajuste dinámico de pantalla
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
