<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);

const startCamPos = new THREE.Vector3(38.0, 16.0, 14.0);
const closeCamPos = new THREE.Vector3(18.5, 1.2, -7.8); 

const startTargetPos = new THREE.Vector3(14.895, 0.4, -11.136); 
const closeTargetPos = new THREE.Vector3(14.895, 0.4, -11.136); 

camera.position.copy(startCamPos);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));

renderer.outputColorSpace = THREE.SRGBColorSpace; 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.4;
controls.zoomSpeed = 0.6;
controls.panSpeed = 0.5;
controls.minDistance = 1;
controls.maxDistance = 100;
controls.target.copy(startTargetPos);

let isCamTransitioning = false;
let camTransitionTime = 0;
const camTransitionDuration = 2.8;

// --- ILUMINACIÓN ---
const hemiLight = new THREE.HemisphereLight(0xfffaed, 0x3d5a80, 2.0);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff2a3, 2.8);
sunLight.position.set(35, 45, 20);
scene.add(sunLight);

const sunGeo = new THREE.SphereGeometry(3, 16, 16);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffae0 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.position.copy(sunLight.position).multiplyScalar(10);
scene.add(sunMesh);

// --- AUDIO DJ ENGINE ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const playlist = ["audio/entre-tes-ombres.mp3", "audio/stade-de-nos-reves.mp3", "audio/cumbia-de-minuit.mp3"];
let currentTrackIndex = 0;
let userInteracted = false; 
let isLoadingAudio = false;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 90;
vuCanvas.height = 24;

let laraMesh = null;
let laraMixer = null; 
let laraAction = null;

function setLaraDancing(shouldDance) {
  if (!laraAction) return;
  if (shouldDance) {
    laraAction.paused = false;
    if (!laraAction.isRunning()) {
      laraAction.play();
    }
  } else {
    laraAction.paused = true;
  }
}

function cleanTrackName(filename) {
  return filename.replace(/-/g, ' ').replace('.mp3', '').toUpperCase();
}

function updateConsoleUI(filename, status) {
  const display = document.getElementById('track-display');
  const playBtn = document.getElementById('btn-play');
  const pauseBtn = document.getElementById('btn-pause');

  playlist.forEach((_, idx) => {
    const pill = document.getElementById(`pill-${idx}`);
    if (pill) {
      if (idx === currentTrackIndex) pill.classList.add('active-track');
      else pill.classList.remove('active-track');
    }
  });

  if (status === 'loading') {
    display.innerText = "MIXING...";
  } else if (status === 'playing') {
    display.innerText = cleanTrackName(filename);
    playBtn.classList.add('active-glow');
    pauseBtn.classList.remove('active-glow');
  } else if (status === 'paused') {
    display.innerText = "PAUSA";
    playBtn.classList.remove('active-glow');
    pauseBtn.classList.add('active-glow');
  }
}

function loadTrack(index, startPlaying = true) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  isLoadingAudio = true;
  updateConsoleUI(filename, 'loading');

  if (soundSource.isPlaying) soundSource.stop();
  setLaraDancing(false);

  audioLoader.load(filename, (buffer) => {
    isLoadingAudio = false;
    if (soundSource.source) soundSource.source.onended = null;

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    
    if (!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 16);
    }

    if (startPlaying || userInteracted) {
      executePlay();
    }
  }, undefined, (err) => {
    isLoadingAudio = false;
    document.getElementById('track-display').innerText = "ERROR 404";
    console.error(err);
  });
}

function executePlay() {
  const audioContext = THREE.AudioContext.getContext();
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying && !isLoadingAudio) {
    try {
      soundSource.play();
      updateConsoleUI(playlist[currentTrackIndex], 'playing');
      setLaraDancing(true);

      if (soundSource.source) {
        soundSource.source.onended = () => {
          setLaraDancing(false);
          nextTrack();
        };
      }
    } catch (e) {
      console.warn(e);
    }
  }
}

function pauseAudio() {
  if (soundSource.isPlaying) {
    if (soundSource.source) soundSource.source.onended = null;
    soundSource.pause();
    updateConsoleUI(playlist[currentTrackIndex], 'paused');
  }
  setLaraDancing(false);
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

function detenerTodoElAudio() {
  if (soundSource && soundSource.isPlaying) {
    soundSource.stop();
  }
  setLaraDancing(false);
  const ctx = THREE.AudioContext.getContext();
  if (ctx && ctx.state !== 'closed') {
    ctx.suspend();
  }
}

window.salirDeEscena = function() {
  detenerTodoElAudio();
  window.location.href = 'index.html';
};

window.addEventListener('beforeunload', detenerTodoElAudio);
window.addEventListener('pagehide', detenerTodoElAudio);

loadTrack(0, true);

document.getElementById('btn-entrar').addEventListener('click', (e) => {
  e.stopPropagation();
  userInteracted = true;
  executePlay();
  
  isCamTransitioning = true;
  camTransitionTime = 0;

  const overlay = document.getElementById('overlay-inicio');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.remove(), 600);
});

document.querySelectorAll('.track-pill').forEach(pill => {
  pill.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); 
    userInteracted = true;
    let trackIdx = parseInt(e.target.getAttribute('data-track'));
    loadTrack(trackIdx, true);
  });
});

document.getElementById("btn-play").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  userInteracted = true;
  executePlay();
});

document.getElementById("btn-pause").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  pauseAudio();
});

document.getElementById("btn-next").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  userInteracted = true;
  nextTrack();
});

function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  vuCtx.fillStyle = "rgba(10, 15, 30, 0.4)";
  vuCtx.fillRect(0, 0, vuCanvas.width, vuCanvas.height);
  vuCtx.strokeStyle = "rgba(0, 255, 102, 0.1)";
  vuCtx.lineWidth = 0.5;
  
  for (let x = 0; x < vuCanvas.width; x += 10) {
    vuCtx.beginPath(); vuCtx.moveTo(x, 0); vuCtx.lineTo(x, vuCanvas.height); vuCtx.stroke();
  }
  for (let y = 0; y < vuCanvas.height; y += 6) {
    vuCtx.beginPath(); vuCtx.moveTo(0, y); vuCtx.lineTo(vuCanvas.width, y); vuCtx.stroke();
  }

  vuCtx.lineWidth = 1.2;
  vuCtx.strokeStyle = "#00ff66"; 

  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    vuCtx.beginPath();
    const sliceWidth = vuCanvas.width / data.length;
    let x = 0;
    for (let i = 0; i < data.length; i++) {
      const value = data[i] / 255;
      const amplitude = value * (vuCanvas.height / 1.5);
      const y = (vuCanvas.height / 2) + (i % 2 === 0 ? amplitude : -amplitude) * Math.sin(i * 0.3);
      if (i === 0) vuCtx.moveTo(x, y);
      else vuCtx.lineTo(x, y);
      x += sliceWidth;
    }
    vuCtx.stroke();
  } else {
    vuCtx.strokeStyle = "rgba(0, 255, 102, 0.2)";
    vuCtx.beginPath();
    vuCtx.moveTo(0, vuCanvas.height / 2);
    vuCtx.lineTo(vuCanvas.width, vuCanvas.height / 2);
    vuCtx.stroke();
  }
}

// --- CARGA DE ARCHIVOS 3D (GLB) ---
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
loader.setDRACOLoader(dracoLoader);

const raycaster = new THREE.Raycaster();
const downVector = new THREE.Vector3(0, -1, 0);
let islaScene = null;
let luisSentadoObject = null;

const avatarContainer = new THREE.Group();
avatarContainer.position.set(14.895, -0.316, -11.136);
avatarContainer.scale.set(0.75, 0.75, 0.75);
scene.add(avatarContainer);

let modelCamina = null;
let modelHora = null;

let mixerCamina = null;
let mixerHora = null;

let avatarState = 'sentado';

function setAvatarState(newState) {
  if (avatarState === newState) return;

  if (avatarState === 'sentado' && newState === 'camina') {
    avatarContainer.position.z += 0.35; 
  }

  avatarState = newState;

  if (luisSentadoObject) {
    luisSentadoObject.visible = (newState === 'sentado');
  }

  if (modelCamina) modelCamina.visible = (newState === 'camina');
  if (modelHora) modelHora.visible = (newState === 'hora');
}

let islandMixer = null; 

// 1. ISLA
loader.load("https://huggingface.co/datasets/Luis-Fernando/isla/resolve/main/isla.glb", (gltf) => {
  islaScene = gltf.scene;

  islaScene.traverse((child) => {
    if (child.isMesh) {
      child.frustumCulled = true;
    }
    if (child.name.toLowerCase().includes("luis-playa-sentado")) {
      luisSentadoObject = child;
    }
  });

  if (!luisSentadoObject) {
    luisSentadoObject = islaScene.getObjectByName("luis-playa-sentado");
  }

  scene.add(islaScene);
  
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(islaScene);
    gltf.animations.forEach((clip) => {
      clip.tracks.forEach(track => track.setInterpolation(THREE.InterpolateLinear));
      const action = islandMixer.clipAction(clip);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.enabled = true;
      action.play();
    });
  }
});

// 2. LUIS CAMINA
loader.load("https://huggingface.co/datasets/Luis-Fernando/isla/resolve/main/luis-playa-camina.glb", (gltf) => {
  modelCamina = gltf.scene;
  modelCamina.rotation.y = 0; 
  modelCamina.visible = false; 
  avatarContainer.add(modelCamina);

  if (gltf.animations && gltf.animations.length > 0) {
    mixerCamina = new THREE.AnimationMixer(modelCamina);
    gltf.animations.forEach((clip) => {
      clip.tracks.forEach(track => track.setInterpolation(THREE.InterpolateLinear));
      const action = mixerCamina.clipAction(clip);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.enabled = true;
      action.play();
    });
  }
});

// 3. LUIS HORA
loader.load("https://huggingface.co/datasets/Luis-Fernando/isla/resolve/main/luis-playa-hora.glb", (gltf) => {
  modelHora = gltf.scene;
  modelHora.rotation.y = 0;
  modelHora.visible = false;
  avatarContainer.add(modelHora);

  if (gltf.animations && gltf.animations.length > 0) {
    mixerHora = new THREE.AnimationMixer(modelHora);
    gltf.animations.forEach((clip) => {
      clip.tracks.forEach(track => track.setInterpolation(THREE.InterpolateLinear));
      const action = mixerHora.clipAction(clip);

function resetAvatarPosition() {
  avatarContainer.position.set(14.895, -0.316, -11.136);
  avatarContainer.rotation.y = 0;

  if (modelCamina) modelCamina.rotation.y = 0;
  if (modelHora) modelHora.rotation.y = 0;

  setAvatarState('sentado');
  isCamTransitioning = false;
  camera.position.copy(closeCamPos);
  controls.target.copy(closeTargetPos);
}

document.getElementById('btn-reset').addEventListener('click', (e) => {
  e.stopPropagation();
  resetAvatarPosition();
});

// 4. LARA BAILA
loader.load("https://huggingface.co/datasets/Luis-Fernando/isla/resolve/main/lara-baila.glb", (gltf) => {
  laraMesh = gltf.scene;
  laraMesh.scale.set(0.42, 0.42, 0.42);
  laraMesh.position.set(6.2, -0.15, -4.8);
  laraMesh.rotation.y = 0.8;

  scene.add(laraMesh);

  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(laraMesh);
    const clip = gltf.animations[0];
    clip.tracks.forEach(track => track.setInterpolation(THREE.InterpolateLinear));

    laraAction = laraMixer.clipAction(clip);
    laraAction.setLoop(THREE.LoopRepeat, Infinity);
    laraAction.enabled = true;

    if (soundSource && soundSource.isPlaying) {
      laraAction.play();
      laraAction.paused = false;
    } else {
      laraAction.play();
      laraAction.paused = true;
    }
  }
});

// --- GAVIOTAS PROCEDIMENTALES ---
const gaviotas = [];
const numGaviotas = 4;

function crearBandada() {
  const materialBlanco = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const materialPico = new THREE.MeshLambertMaterial({ color: 0xffaa00 });

  for (let i = 0; i < numGaviotas; i++) {
    const gaviotaGroup = new THREE.Group();

    const cuerpoGeo = new THREE.ConeGeometry(0.06, 0.4, 4);
    cuerpoGeo.rotateX(Math.PI / 2);
    const cuerpo = new THREE.Mesh(cuerpoGeo, materialBlanco);
    gaviotaGroup.add(cuerpo);

    const picoGeo = new THREE.ConeGeometry(0.015, 0.1, 4);
    picoGeo.rotateX(Math.PI / 2);
    picoGeo.translate(0, 0, 0.23);
    const pico = new THREE.Mesh(picoGeo, materialPico);
    gaviotaGroup.add(pico);

    const alaIzquierdaGeo = new THREE.BoxGeometry(0.4, 0.01, 0.12);
    alaIzquierdaGeo.translate(-0.2, 0, 0);
    const alaIzquierda = new THREE.Mesh(alaIzquierdaGeo, materialBlanco);
    gaviotaGroup.add(alaIzquierda);

    const alaDerechaGeo = new THREE.BoxGeometry(0.4, 0.01, 0.12);
    alaDerechaGeo.translate(0.2, 0, 0);
    const alaDerecha = new THREE.Mesh(alaDerechaGeo, materialBlanco);
    gaviotaGroup.add(alaDerecha);

    const datosVuelo = {
      malla: gaviotaGroup,
      alaIzq: alaIzquierda,
      alaDer: alaDerecha,
      radio: 8 + Math.random() * 6,
      velocidad: 0.3 + Math.random() * 0.4,
      angulo: Math.random() * Math.PI * 2,
      alturaBase: 7 + Math.random() * 3,
      frecuenciaAleteo: 6 + Math.random() * 4,
      desfase: Math.random() * 100
    };

    scene.add(gaviotaGroup);
    gaviotas.push(datosVuelo);
  }
}

crearBandada();

// --- CONTROLES DE MOVIMIENTO ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let jStartX = 0;
let jStartY = 0;
const maxRadius = 30;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  jStartX = e.clientX;
  jStartY = e.clientY;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - jStartX;
  const dy = e.clientY - jStartY;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius;
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0;
  moveInput.y = 0;
});

const keys = {
  w: false, a: false, s: false, d: false,
  arrowup: false, arrowdown: false, arrowleft: false, arrowright: false
};

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = true;
  evaluarTeclado();
});

window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = false;
  evaluarTeclado();
});

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}

// --- LOOP RENDER PRINCIPAL ---
const obstacleRaycaster = new THREE.Raycaster();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.1);
  const tiempoTotal = clock.getElapsedTime();

  if (isCamTransitioning) {
    camTransitionTime += delta;
    let progress = Math.min(camTransitionTime / camTransitionDuration, 1.0);
    
    let ease = progress < 0.5
      ? 4 * progress * progress * progress
      : 1 - Math.pow(-2 * progress + 2, 3) / 2;

    camera.position.lerpVectors(startCamPos, closeCamPos, ease);
    controls.target.lerpVectors(startTargetPos, closeTargetPos, ease);

    if (progress >= 1.0) {
      isCamTransitioning = false;
    }
  }

  if (mixerCamina && avatarState === 'camina') mixerCamina.update(delta);
  if (mixerHora && avatarState === 'hora') mixerHora.update(delta);

  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta);

  drawVuMeter();

  gaviotas.forEach((pajaro) => {
    pajaro.angulo += pajaro.velocidad * delta;
    pajaro.malla.position.x = Math.cos(pajaro.angulo) * pajaro.radio;
    pajaro.malla.position.z = Math.sin(pajaro.angulo) * pajaro.radio;
    pajaro.malla.position.y = pajaro.alturaBase + Math.sin(tiempoTotal * 1.2 + pajaro.desfase) * 0.15;
    pajaro.malla.rotation.y = -pajaro.angulo + Math.PI;

    const anguloAleteo = Math.sin(tiempoTotal * pajaro.frecuenciaAleteo + pajaro.desfase) * 0.35;
    pajaro.alaIzq.rotation.z = anguloAleteo;
    pajaro.alaDer.rotation.z = -anguloAleteo;
  });

  const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);

  // AJUSTE DE CONTACTO DIRECTO CON LA ARENA
  if (islaScene && (avatarState === 'camina' || avatarState === 'hora')) {
    const origin = avatarContainer.position.clone();
    origin.y += 2.0; 

    raycaster.set(origin, downVector);
    raycaster.far = 10.0;

    const intersects = raycaster.intersectObject(islaScene, true);
    if (intersects.length > 0) {
      const terrainHits = intersects.filter(hit => {
        const name = (hit.object.name || "").toLowerCase();
        return !name.includes("silla") && !name.includes("chair") && !name.includes("luis");
      });
      if (terrainHits.length > 0) {
        // Alineación vertical exacta sobre la malla del suelo
        const targetGroundY = terrainHits[0].point.y;
        avatarContainer.position.y = THREE.MathUtils.lerp(avatarContainer.position.y, targetGroundY, 0.2);
      }
    }
  }

  if (isMoving) {
    setAvatarState('camina');

    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const camRight = new THREE.Vector3();
    camRight.crossVectors(camDir, camera.up).normalize();

    const moveDirection = new THREE.Vector3();
    moveDirection.addScaledVector(camRight, moveInput.x);
    moveDirection.addScaledVector(camDir, moveInput.y);
    moveDirection.normalize();

    const speed = 2.2;
    const prevPosition = avatarContainer.position.clone();

    let allowMovement = true;

    if (laraMesh) {
      const distToLara = avatarContainer.position.distanceTo(laraMesh.position);
      if (distToLara < 0.9) {
        allowMovement = false;
      }
    }

    if (allowMovement && islaScene) {
      const obsOrigin = avatarContainer.position.clone();
      obsOrigin.y += 0.4; 

      obstacleRaycaster.set(obsOrigin, moveDirection);
      obstacleRaycaster.far = 0.5;

      const hits = obstacleRaycaster.intersectObject(islaScene, true);
      const blockingHits = hits.filter(hit => {
        const name = (hit.object.name || "").toLowerCase();
        if (name.includes("silla") || name.includes("chair")) return false; 
        return hit.distance > 0.08 && hit.distance < 0.38 && hit.face && Math.abs(hit.face.normal.y) < 0.5;
      });

      if (blockingHits.length > 0) {
        allowMovement = false;
      }
    }

    if (allowMovement) {
      avatarContainer.position.addScaledVector(moveDirection, speed * delta);
      const deltaMove = avatarContainer.position.clone().sub(prevPosition);
      camera.position.add(deltaMove);
    }

    const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
    avatarContainer.rotation.y = targetAngle;

    controls.target.copy(avatarContainer.position).add(new THREE.Vector3(0, 1, 0));
  } else {
    if (avatarState === 'camina') {
      setAvatarState('hora');
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateMatrix();
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
