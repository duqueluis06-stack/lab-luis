<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 3D - Isla Bonita de Recuerdos</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      padding: 10px 16px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      background: rgba(9, 13, 22, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      font-weight: bold;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* CONSOLA HORIZONTAL TOP - ESTILO SEMI TRANSPARENTE DJ TIESTO */
    #media-console {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: rgba(10, 15, 30, 0.55);
      backdrop-filter: blur(12px);        
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(0, 240, 255, 0.25);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      gap: 15px;
    }

    /* Pantalla LED RGB */
    .led-display {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 6px;
      padding: 6px 12px;
      flex: 1;
      max-width: 280px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .track-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff, 0 0 12px #ff007f; /* Efecto iluminación RGB */
      white-space: nowrap;
      text-align: center;
      letter-spacing: 1px;
    }

    /* Grupo de Botones Compactos */
    .btn-group {
      display: flex;
      gap: 8px;
    }

    .dj-btn {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: rgba(31, 41, 55, 0.7);
      border-bottom: 2px solid #111827;
      transition: all 0.1s;
    }
    .dj-btn:active { transform: translateY(1px); border-bottom-width: 1px; }
    
    #btn-play { color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
    #btn-play.active-glow { box-shadow: 0 0 10px #10b981; background: #059669; color: white; }
    
    #btn-pause { color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.4); }
    #btn-pause.active-glow { box-shadow: 0 0 10px #f97316; background: #ea580c; color: white; }

    #btn-next { color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.4); }

    /* Vúmetro Integrado Fino */
    #vumeter-canvas {
      width: 140px;
      height: 32px;
      background: rgba(2, 6, 23, 0.4);
      border-radius: 6px;
      border: 1px solid rgba(30, 41, 59, 0.5);
    }

    /* OPTIMIZACIÓN RESPONSIVA PARA TELÉFONOS */
    @media (max-width: 600px) {
      #media-console {
        height: 55px;
        padding: 0 10px;
        gap: 8px;
      }
      .led-display { max-width: 150px; padding: 4px 6px; }
      .track-title { font-size: 10px; letter-spacing: 0.5px; }
      .dj-btn { padding: 6px 10px; font-size: 11px; }
      #vumeter-canvas { width: 85px; height: 26px; }
    }

    /* Joystick Virtual */
    #joystick-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-knob {
      width: 32px;
      height: 32px;
      background: rgba(0, 240, 255, 0.4);
      border: 2px solid #00f0ff;
      border-radius: 50%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">⬅ Salir</button>

<div id="media-console">
  <div class="led-display">
    <div class="track-title" id="track-display">SYSTEM ONLINE</div>
  </div>
  
  <div class="btn-group">
    <button class="dj-btn" id="btn-play">▶</button>
    <button class="dj-btn" id="btn-pause">⏸</button>
    <button class="dj-btn" id="btn-next">⏩</button>
  </div>

  <canvas id="vumeter-canvas"></canvas>
</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);


// --- CONSOLA DE AUDIO DJ AUTOMÁTICA ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const playlist = ["entre-tes-ombres.mp3", "stade-de-nos-reves.mp3", "cumbia-de-minuit.mp3"];
let currentTrackIndex = 0;
let isManualChange = false; 
let hasStartedAutoplay = false;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 140;
vuCanvas.height = 32;

// Función para limpiar los nombres (Quita guiones y extensiones)
function cleanTrackName(filename) {
  return filename.replace(/-/g, ' ').replace('.mp3', '').toUpperCase();
}

function updateConsoleUI(filename, status) {
  const display = document.getElementById('track-display');
  const playBtn = document.getElementById('btn-play');
  const pauseBtn = document.getElementById('btn-pause');

  if (status === 'loading') {
    display.innerText = "CARGANDO...";
  } else if (status === 'playing') {
    display.innerText = cleanTrackName(filename);
    playBtn.classList.add('active-glow');
    pauseBtn.classList.remove('active-glow');
  } else if (status === 'paused') {
    display.innerText = "PAUSA";
    playBtn.classList.remove('active-glow');
    pauseBtn.classList.add('active-glow');
  }
}

function loadTrack(index, startPlaying = false) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  updateConsoleUI(filename, 'loading');

  audioLoader.load(filename, (buffer) => {
    isManualChange = true;
    if (soundSource.isPlaying) soundSource.stop();
    isManualChange = false;

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    
    if(!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }

    if (startPlaying) {
      executePlay();
    } else {
      display.innerText = cleanTrackName(playlist[0]);
    }
  }, undefined, (err) => {
    document.getElementById('track-display').innerText = "ERROR 404";
    console.error(err);
  });
}

function executePlay() {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying) {
    soundSource.play();
    updateConsoleUI(playlist[currentTrackIndex], 'playing');
    
    if (soundSource.source) {
      soundSource.source.onended = () => {
        if (!isManualChange) nextTrack();
      };
    }
  }
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

// Carga inicial pasiva
loadTrack(0, false);
document.getElementById('track-display').innerText = cleanTrackName(playlist[0]);

// DETALLE HÍPER IMPORTANTE: Disparo automático al tocar cualquier punto de la pantalla
window.addEventListener('pointerdown', () => {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (!hasStartedAutoplay && soundSource.buffer && !soundSource.isPlaying) {
    hasStartedAutoplay = true;
    executePlay();
  }
});

document.getElementById("btn-play").addEventListener("click", (e) => {
  e.stopPropagation(); // Evita conflicto con disparador global
  isManualChange = false;
  hasStartedAutoplay = true;
  executePlay();
});

document.getElementById("btn-pause").addEventListener("click", (e) => {
  e.stopPropagation();
  if (soundSource.isPlaying) {
    isManualChange = true; 
    soundSource.pause();
    updateConsoleUI(playlist[currentTrackIndex], 'paused');
  }
});

document.getElementById("btn-next").addEventListener("click", (e) => {
  e.stopPropagation();
  hasStartedAutoplay = true;
  nextTrack();
});

// Vúmetro Neón DJ
function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    const barWidth = vuCanvas.width / data.length;
    
    for (let i = 0; i < data.length; i++) {
      const value = data[i];
      const barHeight = vuCanvas.height * (value / 255);
      
      let gradient = vuCtx.createLinearGradient(0, vuCanvas.height, 0, 0);
      gradient.addColorStop(0, '#00f0ff');
      gradient.addColorStop(0.6, '#a855f7');
      gradient.addColorStop(1, '#ff007f');

      vuCtx.fillStyle = gradient;
      vuCtx.fillRect(i * barWidth, vuCanvas.height - barHeight, barWidth - 1, barHeight);
    }
  } else {
    vuCtx.fillStyle = "rgba(0, 240, 255, 0.2)";
    vuCtx.fillRect(0, vuCanvas.height / 2, vuCanvas.width, 1);
  }
}


// --- ENTORNO 3D ---
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       
let islandMixer = null; 
let laraMixer = null; 

// 1. Isla
loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => islandMixer.clipAction(clip).play());
  }
});

// 2. Tu Avatar (Luis)
loader.load("luis-acostado.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0); 
  avatar.rotation.y = Math.PI; 
  scene.add(avatar);
  controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    mixer.clipAction(gltf.animations[0]).play();
  }
});

// 3. Lara Baila
loader.load("lara-baila.glb", (gltf) => {
  const lara = gltf.scene;
  lara.scale.set(0.48, 0.48, 0.48); 
  lara.position.set(1.8, 0, -1); 
  scene.add(lara);
  
  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(lara);
    laraMixer.clipAction(gltf.animations[0]).play();
  }
});

// 4. Tiki Bar
loader.load("tiki-bar.glb", (gltf) => {
  const bar = gltf.scene;
  bar.scale.set(0.022, 0.022, 0.022); 
  bar.position.set(0, 0, -4.5);       
  scene.add(bar);
});

// 5. Bambú Tiki (Carga Limpia Directa sobre Coordenada Exacta)
loader.load("Bambu-tiki.glb", (gltf) => {
  const bambu = gltf.scene;
  bambu.scale.set(0.35, 0.35, 0.35); 
  bambu.position.set(-1.5, 0, -1); // Justo a tu izquierda en el suelo arenoso
  scene.add(bambu);
  console.log("¡Bambú inyectado en escena de forma nativa!");
}, undefined, (err) => {
  console.error("Fallo de lectura en Bambu-tiki.glb: ", err);
});


// --- JOYSTICK ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let jStartX = 0, jStartY = 0;
const maxRadius = 30;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  jStartX = e.clientX; jStartY = e.clientY;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - jStartX;
  const dy = e.clientY - jStartY;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0; moveInput.y = 0;
});

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; evaluarTeclado(); });
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; evaluarTeclado(); });

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- LOOP RENDER ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta);

  drawVuMeter();

  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      const speed = 2.2; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
