<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec0ee);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);

// POSICIÓN INICIAL
const startCamPos = new THREE.Vector3(32.0, 9.0, -2.0);
const startTargetPos = new THREE.Vector3(14.895, 1.0, -11.136); 

camera.position.copy(startCamPos);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));

renderer.outputColorSpace = THREE.SRGBColorSpace; 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.6;
controls.panSpeed = 0.5;
controls.minDistance = 1.5;
controls.maxDistance = 150;

// RESTRICCIÓN VERTICAL: Evita que la cámara baje del nivel del horizonte
controls.maxPolarAngle = Math.PI / 2.05; 

controls.target.copy(startTargetPos);

// --- CONTROL DE INACTIVIDAD Y CÁMARA AUTOMÁTICA ---
let lastUserInteractionTime = Date.now();
let isAutoOrbiting = false;

function resetInteractionTimer() {
  lastUserInteractionTime = Date.now();
  if (isAutoOrbiting) {
    isAutoOrbiting = false;
    controls.autoRotate = false;
  }
}

['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(eventType => {
  window.addEventListener(eventType, resetInteractionTimer, { passive: true });
});

// --- ILUMINACIÓN ---
const hemiLight = new THREE.HemisphereLight(0xfffaed, 0x3d5a80, 2.0);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff2a3, 2.8);
sunLight.position.set(35, 45, 20);
scene.add(sunLight);

const sunGeo = new THREE.SphereGeometry(3, 16, 16);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffae0 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
sunMesh.position.copy(sunLight.position).multiplyScalar(10);
scene.add(sunMesh);

// --- AUDIO DJ ENGINE ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

// Lista de reproducción actualizada con las nuevas canciones en minúscula
const playlist = [
  "audio/entre-tes-ombres.mp3", 
  "audio/stade-de-nos-reves.mp3", 
  "audio/cumbia-de-minuit.mp3",
  "audio/amazonas.mp3",
  "audio/berimbau.mp3",
  "audio/bonefire.mp3",
  "audio/capoeira.mp3"
];
let currentTrackIndex = 0;
let userInteracted = false; 
let isLoadingAudio = false;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 100;
vuCanvas.height = 26;

let laraMesh = null;
let laraMixer = null; 
let laraAction = null;

let croftMesh = null;
let croftMixer = null;
let croftAction = null;

function setLaraDancing(shouldDance) {
  if (laraAction) {
    if (shouldDance) {
      laraAction.paused = false;
      if (!laraAction.isRunning()) {
        laraAction.play();
      }
    } else {
      laraAction.paused = true;
    }
  }

  if (croftAction) {
    if (shouldDance) {
      croftAction.paused = false;
      if (!croftAction.isRunning()) {
        croftAction.play();
      }
    } else {
      croftAction.paused = true;
    }
  }
}

function cleanTrackName(filename) {
  return filename.replace(/-/g, ' ').replace('.mp3', '').replace('audio/', '').toUpperCase();
}

function updateConsoleUI(filename, status) {
  const display = document.getElementById('track-display');
  const playBtn = document.getElementById('btn-play');
  const pauseBtn = document.getElementById('btn-pause');

  playlist.forEach((_, idx) => {
    const pill = document.getElementById(`pill-${idx}`);
    if (pill) {
      if (idx === currentTrackIndex) pill.classList.add('active-track');
      else pill.classList.remove('active-track');
    }
  });

  if (status === 'loading') {
    display.innerText = "MIXING...";
  } else if (status === 'playing') {
    display.innerText = cleanTrackName(filename);
    playBtn.classList.add('active-glow');
    pauseBtn.classList.remove('active-glow');
  } else if (status === 'paused') {
    display.innerText = "PAUSA";
    playBtn.classList.remove('active-glow');
    pauseBtn.classList.add('active-glow');
  }
}

function loadTrack(index, startPlaying = true) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  isLoadingAudio = true;
  updateConsoleUI(filename, 'loading');

  if (soundSource.isPlaying) soundSource.stop();
  setLaraDancing(false);

  audioLoader.load(filename, (buffer) => {
    isLoadingAudio = false;
    if (soundSource.source) soundSource.source.onended = null;

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    
    if (!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }

    if (startPlaying || userInteracted) {
      executePlay();
    }
  }, undefined, (err) => {
    isLoadingAudio = false;
    document.getElementById('track-display').innerText = "ERROR 404";
    console.error(err);
  });
}

function executePlay() {
  const audioContext = THREE.AudioContext.getContext();
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying && !isLoadingAudio) {
    try {
      soundSource.play();
      updateConsoleUI(playlist[currentTrackIndex], 'playing');
      setLaraDancing(true);

      if (soundSource.source) {
        soundSource.source.onended = () => {
          setLaraDancing(false);
          nextTrack();
        };
      }
    } catch (e) {
      console.warn(e);
    }
  }
}

function pauseAudio() {
  if (soundSource.isPlaying) {
    if (soundSource.source) soundSource.source.onended = null;
    soundSource.pause();
    updateConsoleUI(playlist[currentTrackIndex], 'paused');
  }
  setLaraDancing(false);
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

function detenerTodoElAudio() {
  if (soundSource && soundSource.isPlaying) {
    soundSource.stop();
  }
  setLaraDancing(false);
  const ctx = THREE.AudioContext.getContext();
  if (ctx && ctx.state !== 'closed') {
    ctx.suspend();
  }
}

window.salirDeEscena = function() {
  detenerTodoElAudio();
  window.location.href = 'index.html';
};

window.addEventListener('beforeunload', detenerTodoElAudio);
window.addEventListener('pagehide', detenerTodoElAudio);

// Cargar la primera pista al inicio, pero no reproducir automáticamente
loadTrack(0, false);

document.getElementById('btn-entrar').addEventListener('click', (e) => {
  e.stopPropagation();
  userInteracted = true;
  resetInteractionTimer();
  executePlay();

  const overlay = document.getElementById('overlay-inicio');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.remove(), 600);
});

document.querySelectorAll('.track-pill').forEach(pill => {
  pill.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); 
    userInteracted = true;
    resetInteractionTimer();
    let trackIdx = parseInt(e.target.getAttribute('data-track'));
    loadTrack(trackIdx, true);
  });
});

document.getElementById("btn-play").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  userInteracted = true;
  resetInteractionTimer();
  executePlay();
});

document.getElementById("btn-pause").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  resetInteractionTimer();
  pauseAudio();
});

document.getElementById("btn-next").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  resetInteractionTimer();
  nextTrack();
});
