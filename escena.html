  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 100;
      padding: 10px 16px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      background: rgba(9, 13, 22, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      font-weight: bold;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* CONSOLA HORIZONTAL DE DOS LÍNEAS - ESTILO GLASSMORPHISM */
    #media-console {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(12px);        
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(0, 240, 255, 0.2);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 8px 16px;
      box-sizing: border-box;
      gap: 6px;
    }

    /* Línea Superior: Pantalla LED y Vúmetro */
    .console-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Línea Inferior: Visor Selector de Temas y Botones */
    .console-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 6px;
    }

    /* Pantalla LED RGB */
    .led-display {
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 4px;
      padding: 4px 10px;
      flex: 1;
      max-width: 320px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .track-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: bold;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff, 0 0 12px #ff007f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* VISOR HORIZONTAL CON LOS 3 TEMAS VISIBLES */
    .dj-track-selector {
      display: flex;
      gap: 6px;
      flex: 1;
      max-width: 500px;
    }

    .track-pill {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 4px;
      color: #94a3b8;
      font-family: monospace;
      font-size: 10px;
      font-weight: bold;
      padding: 6px 4px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .track-pill:hover {
      color: white;
      background: rgba(30, 41, 59, 0.8);
    }

    .track-pill.active-track {
      color: #00f0ff;
      background: rgba(30, 41, 59, 0.9);
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    /* Botonera */
    .btn-group {
      display: flex;
      gap: 6px;
    }

    .dj-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: rgba(31, 41, 55, 0.8);
      border-bottom: 2px solid #111827;
    }
    .dj-btn:active { transform: translateY(1px); border-bottom-width: 1px; }
    
    #btn-play { color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    #btn-play.active-glow { box-shadow: 0 0 10px #10b981; background: #059669; color: white; }
    
    #btn-pause { color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.3); }
    #btn-pause.active-glow { box-shadow: 0 0 10px #f97316; background: #ea580c; color: white; }

    #btn-next { color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }

    /* Vúmetro Ajustado */
    #vumeter-canvas {
      width: 120px;
      height: 22px;
      background: rgba(2, 6, 23, 0.5);
      border-radius: 4px;
      border: 1px solid rgba(30, 41, 59, 0.4);
    }

    /* RESPONSIVO PARA SMARTPHONES */
    @media (max-width: 600px) {
      #media-console { padding: 6px 10px; gap: 4px; }
      .led-display { max-width: 140px; }
      .track-title { font-size: 10px; }
      #vumeter-canvas { width: 70px; height: 18px; }
      .track-pill { font-size: 8px; padding: 5px 2px; }
      .dj-btn { padding: 5px 8px; font-size: 10px; }
    }

    /* Joystick */
    #joystick-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-knob {
      width: 32px;
      height: 32px;
      background: rgba(0, 240, 255, 0.4);
      border: 2px solid #00f0ff;
      border-radius: 50%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">⬅ Salir</button>

<div id="media-console">
  <div class="console-row-top">
    <div class="led-display">
      <div class="track-title" id="track-display">SYSTEM ONLINE</div>
    </div>
    <canvas id="vumeter-canvas"></canvas>
  </div>
  
  <div class="console-row-bottom">
    <div class="dj-track-selector">
      <button class="track-pill" data-track="0" id="pill-0">ENTRE TES OMBRES</button>
      <button class="track-pill" data-track="1" id="pill-1">STADE DE NOS REVES</button>
      <button class="track-pill" data-track="2" id="pill-2">CUMBIA DE MINUIT</button>
    </div>
    
    <div class="btn-group">
      <button class="dj-btn" id="btn-play">▶</button>
      <button class="dj-btn" id="btn-pause">⏸</button>
      <button class="dj-btn" id="btn-next">⏩</button>
    </div>
  </div>
</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);


// --- ENGINE DE AUDIO DJ AUTOMÁTICO ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const playlist = ["entre-tes-ombres.mp3", "stade-de-nos-reves.mp3", "cumbia-de-minuit.mp3"];
let currentTrackIndex = 0;
let isManualChange = false; 
let hasStartedAutoplay = false;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 120;
vuCanvas.height = 22;

function cleanTrackName(filename) {
  return filename.replace(/-/g, ' ').replace('.mp3', '').toUpperCase();
}

function updateConsoleUI(filename, status) {
  const display = document.getElementById('track-display');
  const playBtn = document.getElementById('btn-play');
  const pauseBtn = document.getElementById('btn-pause');

  playlist.forEach((_, idx) => {
    const pill = document.getElementById(`pill-${idx}`);
    if (idx === currentTrackIndex) {
      pill.classList.add('active-track');
    } else {
      pill.classList.remove('active-track');
    }
  });

  if (status === 'loading') {
    display.innerText = "MIXING...";
  } else if (status === 'playing') {
    display.innerText = cleanTrackName(filename);
    playBtn.classList.add('active-glow');
    pauseBtn.classList.remove('active-glow');
  } else if (status === 'paused') {
    display.innerText = "PAUSA";
    playBtn.classList.remove('active-glow');
    pauseBtn.classList.add('active-glow');
  }
}

function loadTrack(index, startPlaying = false) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  updateConsoleUI(filename, 'loading');

  audioLoader.load(filename, (buffer) => {
    isManualChange = true;
    if (soundSource.isPlaying) soundSource.stop();
    isManualChange = false;

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    
    if(!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }

    if (startPlaying) {
      executePlay();
    } else {
      document.getElementById('track-display').innerText = cleanTrackName(playlist[0]);
    }
  }, undefined, (err) => {
    document.getElementById('track-display').innerText = "ERROR 404";
    console.error(err);
  });
}

function executePlay() {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying) {
    soundSource.play();
    updateConsoleUI(playlist[currentTrackIndex], 'playing');
    
    if (soundSource.source) {
      soundSource.source.onended = () => {
        if (!isManualChange) nextTrack();
      };
    }
  }
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

// Inicialización pasiva
loadTrack(0, false);

// DISPARADOR AUTO-PLAY INMEDIATO AL TOCAR PANTALLA
window.addEventListener('pointerdown', () => {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (!hasStartedAutoplay && soundSource.buffer && !soundSource.isPlaying) {
    hasStartedAutoplay = true;
    executePlay();
  }
});

// Selector de temas directo del visor
document.querySelectorAll('.track-pill').forEach(pill => {
  pill.addEventListener('click', (e) => {
    e.stopPropagation(); 
    let trackIdx = parseInt(e.target.getAttribute('data-track'));
    hasStartedAutoplay = true;
    loadTrack(trackIdx, true);
  });
});

document.getElementById("btn-play").addEventListener("click", (e) => {
  e.stopPropagation();
  isManualChange = false;
  hasStartedAutoplay = true;
  executePlay();
});

document.getElementById("btn-pause").addEventListener("click", (e) => {
  e.stopPropagation();
  if (soundSource.isPlaying) {
    isManualChange = true; 
    soundSource.pause();
    updateConsoleUI(playlist[currentTrackIndex], 'paused');
  }
});

document.getElementById("btn-next").addEventListener("click", (e) => {
  e.stopPropagation();
  hasStartedAutoplay = true;
  nextTrack();
});

function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    const barWidth = vuCanvas.width / data.length;
    
    for (let i = 0; i < data.length; i++) {
      const value = data[i];
      const barHeight = vuCanvas.height * (value / 255);
      
      let gradient = vuCtx.createLinearGradient(0, vuCanvas.height, 0, 0);
      gradient.addColorStop(0, '#00f0ff');
      gradient.addColorStop(0.6, '#a855f7');
      gradient.addColorStop(1, '#ff007f');

      vuCtx.fillStyle = gradient;
      vuCtx.fillRect(i * barWidth, vuCanvas.height - barHeight, barWidth - 1, barHeight);
    }
  } else {
    vuCtx.fillStyle = "rgba(0, 240, 255, 0.15)";
    vuCtx.fillRect(0, vuCanvas.height / 2, vuCanvas.width, 1);
  }
}


// --- ENTORNO 3D (Carga de Mallas Externas) ---
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       
let islandMixer = null; 
let laraMixer = null; 

// 1. Isla
loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => islandMixer.clipAction(clip).play());
  }
});

// 2. Tu Avatar (Luis)
loader.load("luis-acostado.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0); 
  avatar.rotation.y = Math.PI; 
  scene.add(avatar);
  controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    mixer.clipAction(gltf.animations[0]).play();
  }
});

// 3. Lara Baila
loader.load("lara-baila.glb", (gltf) => {
  const lara = gltf.scene;
  lara.scale.set(0.48, 0.48, 0.48); 
  lara.position.set(1.8, 0, -1); 
  scene.add(lara);
  
  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(lara);
    laraMixer.clipAction(gltf.animations[0]).play();
  }
});

// 4. Tiki Bar
loader.load("tiki-bar.glb", (gltf) => {
  const bar = gltf.scene;
  bar.scale.set(0.022, 0.022, 0.022); 
  bar.position.set(0, 0, -4.5);       
  scene.add(bar);
});


// --- SISTEMA DE GAVIOTAS PROCEDIMENTALES (100% CÓDIGO NATIVO) ---
const gaviotas = [];
const numGaviotas = 5; 

function crearBandada() {
  const materialBlanco = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const materialPico = new THREE.MeshLambertMaterial({ color: 0xffaa00 });

  for (let i = 0; i < numGaviotas; i++) {
    const gaviotaGroup = new THREE.Group();

    // Cuerpo cónico aerodinámico
    const cuerpoGeo = new THREE.ConeGeometry(0.06, 0.4, 4);
    cuerpoGeo.rotateX(Math.PI / 2); 
    const cuerpo = new THREE.Mesh(cuerpoGeo, materialBlanco);
    gaviotaGroup.add(cuerpo);

    // Pico amarillo
    const picoGeo = new THREE.ConeGeometry(0.015, 0.1, 4);
    picoGeo.rotateX(Math.PI / 2);
    picoGeo.translate(0, 0, 0.23); 
    const pico = new THREE.Mesh(picoGeo, materialPico);
    gaviotaGroup.add(pico);

    // Ala Izquierda
    const alaIzquierdaGeo = new THREE.BoxGeometry(0.4, 0.01, 0.12);
    alaIzquierdaGeo.translate(-0.2, 0, 0); 
    const alaIzquierda = new THREE.Mesh(alaIzquierdaGeo, materialBlanco);
    gaviotaGroup.add(alaIzquierda);

    // Ala Derecha
    const alaDerechaGeo = new THREE.BoxGeometry(0.4, 0.01, 0.12);
    alaDerechaGeo.translate(0.2, 0, 0);
    const alaDerecha = new THREE.Mesh(alaDerechaGeo, materialBlanco);
    gaviotaGroup.add(alaDerecha);

    // Parámetros orbitales dinámicos
    const datosVuelo = {
      malla: gaviotaGroup,
      alaIzq: alaIzquierda,
      alaDer: alaDerecha,
      radio: 8 + Math.random() * 6,         
      velocidad: 0.3 + Math.random() * 0.4, 
      angulo: Math.random() * Math.PI * 2,   
      alturaBase: 7 + Math.random() * 3,     
      frecuenciaAleteo: 6 + Math.random() * 4,
      desfase: Math.random() * 100           
    };

    scene.add(gaviotaGroup);
    gaviotas.push(datosVuelo);
  }
}
crearBandada();


// --- JOYSTICK INTERACTIVO ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let jStartX = 0, jStartY = 0;
const maxRadius = 30;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  jStartX = e.clientX; jStartY = e.clientY;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - jStartX;
  const dy = e.clientY - jStartY;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0; moveInput.y = 0;
});

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; evaluarTeclado(); });
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; evaluarTeclado(); });

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- LOOP RENDER PRINCIPAL ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const tiempoTotal = clock.getElapsedTime();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta);

  drawVuMeter();

  // Animación del Vuelo y Aleteo Matemático de las Gaviotas
  gaviotas.forEach((pajaro) => {
    pajaro.angulo += pajaro.velocidad * delta;
    pajaro.malla.position.x = Math.cos(pajaro.angulo) * pajaro.radio;
    pajaro.malla.position.z = Math.sin(pajaro.angulo) * pajaro.radio;
    pajaro.malla.position.y = pajaro.alturaBase + Math.sin(tiempoTotal * 1.2 + pajaro.desfase) * 0.15;
    pajaro.malla.rotation.y = -pajaro.angulo + Math.PI;

    const anguloAleteo = Math.sin(tiempoTotal * pajaro.frecuenciaAleteo + pajaro.desfase) * 0.35;
    pajaro.alaIzq.rotation.z = anguloAleteo;
    pajaro.alaDer.rotation.z = -anguloAleteo;
  });

  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      const speed = 2.2; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
