<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 3D - Viverse</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #87ceeb;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* Interfaz del Joystick Virtual */
    #joystick-container {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #joystick-knob {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: transform 0.05s ease;
    }

    /* Alerta de Audio Dinámica */
    #audio-prompt {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 100;
      pointer-events: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">
  ⬅ Volver
</button>

<div id="audio-prompt">🔊 Cargando entorno y sonido... Toca la pantalla.</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// Configuración de la Escena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); // Ligeramente más baja para mejor inmersión

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

// Controles de cámara fijos al objetivo
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 30;
controls.target.set(0, 1.2, 0);

// Iluminación Global
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(20, 30, 10);
scene.add(dirLight);

// --- SISTEMA DE AUDIO SEGURO CON URL EXTERNA ---
const listener = new THREE.AudioListener();
camera.add(listener);

const oceanSound = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();

let userInteracted = false;
let audioReady = false;

// Luis: He cambiado 'mar.mp3' por esta URL pública para que no necesites buscar archivo!
const oceanSoundUrl = 'https://www.w3schools.com/html/horse.mp3'; // NOTA: Esto es un sonido de caballo para probar, cámbialo por una URL de mar real si encuentras una CORS allowed. O use Mixkit.

// Use Mixkit direct embed URL if possible, otherwise use local file with better instructions
// Let's use a very reliable test sound provided by W3Schools, it's cross-origin allowed.
// It's a horse sound, but it guarantees to sound and prove the audio system works.

audioLoader.load(oceanSoundUrl, (buffer) => {
  oceanSound.setBuffer(buffer);
  oceanSound.setLoop(true);
  oceanSound.setVolume(0.4);
  audioReady = true;
  document.getElementById('audio-prompt').innerText = "🔊 Toca cualquier parte para activar el sonido (¡Oirás un caballo de prueba!)";
  intentarReproducirAudio();
}, undefined, (err) => {
  console.error("Error cargando URL de audio:", err);
  document.getElementById('audio-prompt').innerText = "❌ No se pudo cargar el audio externo.";
});

function intentarReproducirAudio() {
  if (userInteracted && audioReady && !oceanSound.isPlaying) {
    oceanSound.play();
    const promptElement = document.getElementById('audio-prompt');
    if (promptElement) promptElement.style.display = 'none';
  }
}

window.addEventListener('click', () => {
  userInteracted = true;
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume().then(() => {
      intentarReproducirAudio();
    });
  } else {
    intentarReproducirAudio();
  }
});


// --- CARGA DE MODELOS Y ANIMACIONES ---
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       // Animador Avatar
let islandMixer = null; // Animador Isla

let avatarActions = {};
let activeAction = null;
let hasWalkAnimation = false;

// Cargar Isla
loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => {
      islandMixer.clipAction(clip).play();
    });
  }
}, undefined, (err) => console.error("Error isla:", err));

// Cargar Avatar
loader.load("luis-avatar2.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0);
  scene.add(avatar);

  // --- LUIS, ATENCIÓN AQUÍ ---
  // Esta línea es crucial. Imprime en tu consola (F12) qué animaciones traes.
  // Si no ves nada aquí, tu GLB no tiene animaciones de patas móviles.
  console.log("Animaciones disponibles en tu avatar Luis:", gltf.animations.map(a => a.name));

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    
    gltf.animations.forEach((clip) => {
      const name = clip.name.toLowerCase();
      const action = mixer.clipAction(clip);
      
      // Mapeo automático inteligente
      if (name.includes('idle') || name.includes('quieto') || name.includes('espera')) {
        avatarActions['idle'] = action;
      } else if (name.includes('walk') || name.includes('caminar') || name.includes('marcha')) {
        avatarActions['walk'] = action;
        hasWalkAnimation = true;
      }
    });

    // Arrancar en estado quieto
    if (avatarActions['idle']) {
      activeAction = avatarActions['idle'];
      activeAction.play();
    } else {
      // Si no hay idle, arrancar la primera que haya
      activeAction = mixer.clipAction(gltf.animations[0]);
      activeAction.play();
    }
  }
}, undefined, (err) => console.error("Error avatar Luis:", err));

// Función para cambiar animaciones suavemente
function fadeToAction(name, duration) {
    const targetAction = avatarActions[name];
    if (activeAction === targetAction || !targetAction) return;

    targetAction.reset();
    targetAction.setEffectiveTimeScale(1);
    targetAction.setEffectiveWeight(1);
    
    if (activeAction) {
        activeAction.crossFadeTo(targetAction, duration, true);
    }
    
    targetAction.play();
    activeAction = targetAction;
}


// --- MANEJO DE ENTRADAS (Joystick + Teclado) ---
const moveInput = { x: 0, y: 0 };

const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
const maxRadius = 40;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  joystickStart = { x: e.clientX, y: e.clientY };
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - joystickStart.x;
  const dy = e.clientY - joystickStart.y;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);

  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;

  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;

  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0;
  moveInput.y = 0;
});

// Teclado WASD / Flechas
const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = true;
  evaluarTeclado();
});
window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = false;
  evaluarTeclado();
});

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- BUCLE DE ANIMACIÓN PRINCIPAL ---
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);

  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);

    if (isMoving) {
      // 1. Alternar a animación de caminar si existe, si no, se queda quieto
      if (hasWalkAnimation) {
        fadeToAction('walk', 0.2);
      }
      // He quitado el "bamboleo horrible" (avatar.position.y procedimental)

      // 2. Calcular movimiento respecto al ángulo de la cámara
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      // Mover modelo (ajustado para ser más fluido y lento, evitando el deslizamiento exagerado)
      const speed = 2.5; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      // Rotar hacia el frente de marcha
      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      // Hacer que la cámara persiga al avatar suavemente
      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1.2, 0));
    } else {
      // Estado Quieto suave
      if (hasWalkAnimation) {
        fadeToAction('idle', 0.2);
      }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// Redimensionado de Pantalla
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
