<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 3D - Isla Bonita de Recuerdos</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #87ceeb;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      font-weight: bold;
    }

    /* CONSOLA MULTIMEDIA OPTIMIZADA Y RESPONSIVA */
    #media-console {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 240px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      color: white;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .track-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #38bdf8;
    }

    .playlist-select {
      width: 100%;
      background: #334155;
      color: white;
      border: none;
      padding: 5px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 8px;
      outline: none;
    }

    .controls-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .console-btn {
      flex: 1;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: #475569;
    }
    #btn-play { background: #16a34a; }
    #btn-pause { background: #ea580c; }
    #btn-stop { background: #dc2626; }

    #vumeter-canvas {
      width: 100%;
      height: 30px;
      background: #0f172a;
      border-radius: 6px;
      display: block;
    }

    /* DISEÑO PARA TELÉFONOS MÓVILES (EVITA QUE TAPE LA PANTALLA) */
    @media (max-width: 600px) {
      #media-console {
        width: 150px;
        padding: 6px;
        top: 8px;
        right: 8px;
      }
      .track-title { font-size: 10px; }
      .playlist-select { font-size: 9px; padding: 3px; margin-bottom: 4px; }
      .console-btn { font-size: 9px; padding: 4px; }
      #vumeter-canvas { height: 20px; }
      #volver { top: 8px; left: 8px; padding: 6px 10px; font-size: 12px; }
    }

    /* Interfaz del Joystick Virtual */
    #joystick-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-knob {
      width: 35px;
      height: 35px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">⬅ Volver</button>

<div id="media-console">
  <div class="track-title" id="track-display">Pistas Locales</div>
  <select id="track-select" class="playlist-select">
    <option value="entre-tes-ombres.mp3">entre-tes-ombres.mp3</option>
    <option value="stade-de-nos-reves.mp3">stade-de-nos-reves.mp3</option>
    <option value="cumbia-de-minuit.mp3">cumbia-de-minuit.mp3</option>
  </select>
  <div class="controls-row">
    <button class="console-btn" id="btn-play">▶</button>
    <button class="console-btn" id="btn-pause">⏸</button>
    <button class="console-btn" id="btn-stop">⏹</button>
  </div>
  <canvas id="vumeter-canvas"></canvas>
</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);


// --- CONSOLA DE AUDIO LOCAL Y AUDIO ANALYSER ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 200;
vuCanvas.height = 30;

function loadTrack(filename) {
  document.getElementById('track-display').innerText = "Cargando...";
  if (soundSource.isPlaying) soundSource.stop();

  audioLoader.load(filename, (buffer) => {
    soundSource.setBuffer(buffer);
    soundSource.setLoop(true);
    soundSource.setVolume(0.5);
    document.getElementById('track-display').innerText = "🎵 " + filename;
    
    if(!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }
  }, undefined, (err) => {
    document.getElementById('track-display').innerText = "⚠ No hallado: " + filename;
    console.error("Error cargando el archivo de audio local:", err);
  });
}

// Cargar primera pista por defecto
loadTrack(document.getElementById("track-select").value);

document.getElementById("track-select").addEventListener("change", (e) => {
  loadTrack(e.target.value);
});

document.getElementById("btn-play").addEventListener("click", () => {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying) soundSource.play();
});

document.getElementById("btn-pause").addEventListener("click", () => {
  if (soundSource.isPlaying) soundSource.pause();
});

document.getElementById("btn-stop").addEventListener("click", () => {
  if (soundSource.isPlaying) soundSource.stop();
});

function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    const barWidth = vuCanvas.width / data.length;
    for (let i = 0; i < data.length; i++) {
      const value = data[i];
      const barHeight = vuCanvas.height * (value / 255);
      const hue = (i / data.length) * 120 + 200; // Espectro azul-cian neon
      vuCtx.fillStyle = `hsla(${hue}, 100%, 50%, 0.9)`;
      vuCtx.fillRect(i * barWidth, vuCanvas.height - barHeight, barWidth - 1, barHeight);
    }
  } else {
    vuCtx.strokeStyle = "rgba(255,255,255,0.1)";
    vuCtx.beginPath();
    vuCtx.moveTo(0, vuCanvas.height / 2);
    vuCtx.lineTo(vuCanvas.width, vuCanvas.height / 2);
    vuCtx.stroke();
  }
}


// --- CARGA Y CALIBRACIÓN INDIVIDUAL DE MODELOS (ISLA BONITA) ---
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       
let islandMixer = null; 
let laraMixer = null; 

// 1. Isla Base
loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => islandMixer.clipAction(clip).play());
  }
}, undefined, (err) => console.error("Error Isla:", err));

// 2. Tu Avatar Principal (luis-acostado.glb)
loader.load("luis-acostado.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0); 
  avatar.rotation.y = Math.PI; // Mirando al mar original
  scene.add(avatar);
  controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));

  // OBLIGAR A QUE SE REPRODUZCA LA ANIMACIÓN INTERNA PARA QUE DEJE LA POSE EN T
  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    const action = mixer.clipAction(gltf.animations[0]); // Activa el primer clip disponible
    action.play();
  }
}, undefined, (err) => console.error("Error Luis-avatar:", err));

// 3. Lara Baila (Corregida de escala gigante a tamaño humano normal)
loader.load("lara-baila.glb", (gltf) => {
  const lara = gltf.scene;
  
  // ESCALA CORREGIDA: Ajustada al 35% para que coincida contigo
  lara.scale.set(0.35, 0.35, 0.35); 
  
  // POSICIÓN CORREGIDA: y=0 asentada en tierra firme a tu lado
  lara.position.set(1.8, 0, -1); 
  
  scene.add(lara);
  
  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(lara);
    laraMixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (err) => console.error("Error Lara:", err));

// 4. Tiki Bar (Encogido y bajado al nivel del suelo para evitar flotes)
loader.load("tiki-bar.glb", (gltf) => {
  const bar = gltf.scene;
  bar.scale.set(0.4, 0.4, 0.4);       // Reducido a menos de la mitad
  bar.position.set(0, -0.05, -4.5);   // Bajado ligeramente en Y para anclarlo a la isla
  scene.add(bar);
}, undefined, (err) => console.error("Error Tiki Bar:", err));

// 5. Bambú Tiki (Escalado y reubicado armónicamente)
loader.load("bambu-tiki.glb", (gltf) => {
  const bambu = gltf.scene;
  bambu.scale.set(0.4, 0.4, 0.4);     // Proporcional al bar
  bambu.position.set(-2.2, 0, -3.5);  // En el suelo, junto a la cabaña
  scene.add(bambu);
}, undefined, (err) => console.error("Error Bambú:", err));


// --- ENTRADAS INTERFACES ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
const maxRadius = 35;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  joystickStart = { x: e.clientX, y: e.clientY };
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - joystickStart.x;
  const dy = e.clientY - joystickStart.y;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0; moveInput.y = 0;
});

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; evaluarTeclado(); });
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; evaluarTeclado(); });

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- LOOP RENDER PRINCIPAL ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta);

  drawVuMeter();

  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      const speed = 2.2; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
