<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// Mapeos de color estándar para respetar texturas PBR nativas de Babylon
renderer.outputColorSpace = THREE.SRGBColorSpace; 
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.target.set(0, 1, 0);

// Iluminación global neutra rica para que no ensombrezca los modelos nativos
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);


// --- ENGINE DE AUDIO DJ CON AUTOPLAY SEGURO CORREGIDO ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const playlist = ["entre-tes-ombres.mp3", "stade-de-nos-reves.mp3", "cumbia-de-minuit.mp3"];
let currentTrackIndex = 0;
let userInteracted = false; 

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 90;
vuCanvas.height = 24;

function cleanTrackName(filename) {
  return filename.replace(/-/g, ' ').replace('.mp3', '').toUpperCase();
}

function updateConsoleUI(filename, status) {
  const display = document.getElementById('track-display');
  const playBtn = document.getElementById('btn-play');
  const pauseBtn = document.getElementById('btn-pause');

  playlist.forEach((_, idx) => {
    const pill = document.getElementById(`pill-${idx}`);
    if (pill) {
      if (idx === currentTrackIndex) pill.classList.add('active-track');
      else pill.classList.remove('active-track');
    }
  });

  if (status === 'loading') {
    display.innerText = "MIXING...";
  } else if (status === 'playing') {
    display.innerText = cleanTrackName(filename);
    playBtn.classList.add('active-glow');
    pauseBtn.classList.remove('active-glow');
  } else if (status === 'paused') {
    display.innerText = "PAUSA";
    playBtn.classList.remove('active-glow');
    pauseBtn.classList.add('active-glow');
  }
}

function loadTrack(index, startPlaying = false) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  updateConsoleUI(filename, 'loading');

  if (window.laraAction) {
    window.laraAction.paused = true;
  }

  audioLoader.load(filename, (buffer) => {
    if (soundSource.source) soundSource.source.onended = null;
    if (soundSource.isPlaying) soundSource.stop();

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    
    if(!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }

    if (startPlaying || userInteracted) {
      executePlay();
    }
    
    // Si sigue sin reproducirse debido al bloqueo estricto, avisamos al display
    if (!soundSource.isPlaying && !userInteracted) {
      document.getElementById('track-display').innerText = "PULSA EN ENTRAR";
    } else if (!soundSource.isPlaying && userInteracted) {
      document.getElementById('track-display').innerText = "TOCA LA PANTALLA PARA PLAY";
    }
  }, undefined, (err) => {
    document.getElementById('track-display').innerText = "ERROR 404";
    console.error(err);
  });
}

function executePlay() {
  const audioContext = THREE.AudioContext.getContext();
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying) {
    try {
      soundSource.play();
      updateConsoleUI(playlist[currentTrackIndex], 'playing');
      
      if (window.laraAction) {
        window.laraAction.paused = false; 
        window.laraAction.play();        
      }
      
      if (soundSource.source) {
        soundSource.source.onended = () => {
          nextTrack();
        };
      }
    } catch (e) {
      console.warn("Reproducción en espera de interacción síncrona directa:", e);
    }
  }
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

loadTrack(0, false);

// Evento de clic en el botón del Overlay
document.getElementById('btn-entrar').addEventListener('click', (e) => {
  e.stopPropagation();
  userInteracted = true;
  executePlay();
  
  const overlay = document.getElementById('overlay-inicio');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.remove(), 500);
});

// Listener resiliente global (solo se remueve si el sonido se está ejecutando con éxito)
function pantallaTouchAutoplay() {
  userInteracted = true;
  executePlay();
  if (soundSource.isPlaying) {
    window.removeEventListener('click', pantallaTouchAutoplay);
    window.removeEventListener('pointerdown', pantallaTouchAutoplay);
  }
}
window.addEventListener('click', pantallaTouchAutoplay);
window.addEventListener('pointerdown', pantallaTouchAutoplay);


// --- EVENTOS DE LA CONSOLA ---
document.querySelectorAll('.track-pill').forEach(pill => {
  pill.addEventListener('click', (e) => {
    e.stopPropagation(); 
    userInteracted = true;
    let trackIdx = parseInt(e.target.getAttribute('data-track'));
    loadTrack(trackIdx, true);
  });
});

document.getElementById("btn-play").addEventListener("click", (e) => {
  e.stopPropagation();
  userInteracted = true;
  executePlay();
});

document.getElementById("btn-pause").addEventListener("click", (e) => {
  e.stopPropagation();
  if (soundSource.isPlaying) {
    if (soundSource.source) soundSource.source.onended = null;
    soundSource.pause();
    updateConsoleUI(playlist[currentTrackIndex], 'paused');
    if (window.laraAction) window.laraAction.paused = true; 
  }
});

document.getElementById("btn-next").addEventListener("click", (e) => {
  e.stopPropagation();
  userInteracted = true;
  nextTrack();
});


// --- VÚMETRO ---
function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  vuCtx.fillStyle = "rgba(10, 15, 30, 0.4)";
  vuCtx.fillRect(0, 0, vuCanvas.width, vuCanvas.height);
  vuCtx.strokeStyle = "rgba(0, 255, 102, 0.1)";
  vuCtx.lineWidth = 0.5;
  
  for (let x = 0; x < vuCanvas.width; x += 10) {
    vuCtx.beginPath(); vuCtx.moveTo(x, 0); vuCtx.lineTo(x, vuCanvas.height); vuCtx.stroke();
  }
  for (let y = 0; y < vuCanvas.height; y += 6) {
    vuCtx.beginPath(); vuCtx.moveTo(0, y); vuCtx.lineTo(vuCanvas.width, y); vuCtx.stroke();
  }

  vuCtx.lineWidth = 1.2;
  vuCtx.strokeStyle = "#00ff66"; 

  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    vuCtx.beginPath();
    const sliceWidth = vuCanvas.width / data.length;
    let x = 0;
    for (let i = 0; i < data.length; i++) {
      const value = data[i] / 255;
      const amplitude = value * (vuCanvas.height / 1.5);
      const y = (vuCanvas.height / 2) + (i % 2 === 0 ? amplitude : -amplitude) * Math.sin(i * 0.3);
      if (i === 0) vuCtx.moveTo(x, y);
      else vuCtx.lineTo(x, y);
      x += sliceWidth;
    }
    vuCtx.stroke();
  } else {
    vuCtx.strokeStyle = "rgba(0, 255, 102, 0.2)";
    vuCtx.beginPath();
    vuCtx.moveTo(0, vuCanvas.height / 2);
    vuCtx.lineTo(vuCanvas.width, vuCanvas.height / 2);
    vuCtx.stroke();
  }
}


// --- CARGA DIRECTA DE ARCHIVOS 3D NATIVOS ---
const loader = new GLTFLoader();
let avatar = null;
let michigris = null;
let mixer = null;       
let islandMixer = null; 
let laraMixer = null; 
let michigrisMixer = null;
window.laraAction = null; 

loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => islandMixer.clipAction(clip).play());
  }
});

// AVATAR A RAS DE ARENA (y = 0)
loader.load("luis-acostado.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0); 
  avatar.rotation.y = Math.PI; 
  scene.add(avatar);
  controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    mixer.clipAction(gltf.animations[0]).play();
  }
});

// MICHIGRIS.GLB OPTIMIZADO: Ajuste dinámico de mapas PBR y texturas nativas
loader.load("michigris.glb", (gltf) => {
  michigris = gltf.scene;
  michigris.position.set(1.0, 0, 0.1); 
  michigris.rotation.y = Math.PI; 
  
  michigris.traverse((child) => {
    if (child.isMesh) {
      if (child.material) {
        if (child.material.map) {
          child.material.map.colorSpace = THREE.SRGBColorSpace;
          child.material.map.needsUpdate = true;
        }
        
        if (child.material.metalness > 0.4) {
          child.material.metalness = 0.1; 
          child.material.roughness = 0.7; 
        }
      }
    }
  });

  scene.add(michigris);

  if (gltf.animations && gltf.animations.length > 0) {
    michigrisMixer = new THREE.AnimationMixer(michigris);
    michigrisMixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (error) => {
  console.error("Error cargando michigris.glb:", error);
});


loader.load("lara-baila.glb", (gltf) => {
  const lara = gltf.scene;
  lara.scale.set(0.48, 0.48, 0.48); 
  lara.position.set(1.8, 0, -1); 
  scene.add(lara);
  
  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(lara);
    window.laraAction = laraMixer.clipAction(gltf.animations[0]);
    window.laraAction.play();
    if (!soundSource.isPlaying) window.laraAction.paused = true;
  }
});

loader.load("tiki-bar.glb", (gltf) => {
  const bar = gltf.scene;
  bar.scale.set(0.022, 0.022, 0.022); 
  bar.position.set(0, 0, -4.5);       
  scene.add(bar);
});


// --- GAVIOTAS PROCEDIMENTALES ---
const gaviotas = [];
const numGaviotas = 5; 

function crearBandada() {
  const materialBlanco = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const materialPico = new THREE.MeshLambertMaterial({ color: 0xffaa00 });

  for (let i = 0; i < numGaviotas; i++) {
    const gaviotaGroup = new THREE.Group();

    const cuerpoGeo = new THREE.ConeGeometry(0.06, 0.4, 4);
    cuerpoGeo.rotateX(Math.PI / 2); 
    const cuerpo = new THREE.Mesh(cuerpoGeo, materialBlanco);
    gaviotaGroup.add(cuerpo);

    const picoGeo = new THREE.ConeGeometry(0.015, 0.1, 4);
    picoGeo.rotateX(Math.PI / 2);
    picoGeo.translate(0, 0, 0.23); 
    const pico = new THREE.Mesh(picoGeo, materialPico);
    gaviotaGroup.add(pico);

    const alaIzquierdaGeo = new THREE.BoxGeometry(0.4, 0.01, 0.12);
    alaIzquierdaGeo.translate(-0.2, 0, 0); 
    const alaIzquierda = new THREE.Mesh(alaIzquierdaGeo, materialBlanco);
    gaviotaGroup.add(alaIzquierda);

    const alaDerechaGeo = new THREE.BoxGeometry(0.4, 0.01, 0.12);
    alaDerechaGeo.translate(0.2, 0, 0);
    const alaDerecha = new THREE.Mesh(alaDerechaGeo, materialBlanco);
    gaviotaGroup.add(alaDerecha);

    const datosVuelo = {
      malla: gaviotaGroup,
      alaIzq: alaIzquierda,
      alaDer: alaDerecha,
      radio: 8 + Math.random() * 6,         
      velocidad: 0.3 + Math.random() * 0.4, 
      angulo: Math.random() * Math.PI * 2,   
      alturaBase: 7 + Math.random() * 3,     
      frecuenciaAleteo: 6 + Math.random() * 4,
      desfase: Math.random() * 100           
    };

    scene.add(gaviotaGroup);
    gaviotas.push(datosVuelo);
  }
}
crearBandada();


// --- MANADA DE DELFINES PROCEDIMENTALES (MÁS LEJOS, 3 UNIDADES, SALTO VARIADO) ---
const delfines = [];
const numDelfines = 3;

function crearManadaDelfines() {
  // Materiales de alta reflectividad para simular piel húmeda expuesta al sol
  const matDelfin = new THREE.MeshStandardMaterial({ color: 0x3a6b8c, roughness: 0.12, metalness: 0.15 });
  const matPanza = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2 });

  for (let i = 0; i < numDelfines; i++) {
    const grupoDelfin = new THREE.Group();

    // Cuerpo aerodinámico (Esfera estirada en Z)
    const cuerpoGeo = new THREE.SphereGeometry(0.35, 32, 16);
    const cuerpo = new THREE.Mesh(cuerpoGeo, matDelfin);
    cuerpo.scale.set(1, 0.8, 2.6);
    grupoDelfin.add(cuerpo);

    // Panza inferior clara
    const panzaGeo = new THREE.SphereGeometry(0.26, 16, 16);
    const panza = new THREE.Mesh(panzaGeo, matPanza);
    panza.scale.set(0.9, 0.6, 2.0);
    panza.position.set(0, -0.12, 0.1);
    grupoDelfin.add(panza);

    // Hocico característico (Hacia el frente +Z)
    const hocicoGeo = new THREE.ConeGeometry(0.08, 0.4, 12);
    hocicoGeo.rotateX(Math.PI / 2);
    const hocico = new THREE.Mesh(hocicoGeo, matDelfin);
    hocico.position.set(0, -0.05, 1.4);
    grupoDelfin.add(hocico);

    // Aleta Dorsal curva (Arriba)
    const aletaDorsalGeo = new THREE.ConeGeometry(0.07, 0.35, 8);
    aletaDorsalGeo.rotateX(-Math.PI / 3);
    const aletaDorsal = new THREE.Mesh(aletaDorsalGeo, matDelfin);
    aletaDorsal.position.set(0, 0.32, -0.2);
    grupoDelfin.add(aletaDorsal);

    // Aleta Lateral Izquierda
    const aletaIzqGeo = new THREE.BoxGeometry(0.3, 0.02, 0.15);
    const aletaIzq = new THREE.Mesh(aletaIzqGeo, matDelfin);
    aletaIzq.position.set(-0.38, -0.1, 0.3);
    aletaIzq.rotation.set(0, Math.PI / 6, -Math.PI / 6);
    grupoDelfin.add(aletaIzq);

    // Aleta Lateral Derecha
    const aletaDerGeo = new THREE.BoxGeometry(0.3, 0.02, 0.15);
    const aletaDer = new THREE.Mesh(aletaDerGeo, matDelfin);
    aletaDer.position.set(0.4, -0.1, 0.3);
    aletaDer.rotation.set(0, -Math.PI / 6, Math.PI / 6);
    grupoDelfin.add(aletaDer);

    // Cola trasera (Hacia -Z, aletas planas horizontales)
    const aletaColaGeo = new THREE.ConeGeometry(0.12, 0.35, 4);
    aletaColaGeo.rotateX(Math.PI / 2);
    aletaColaGeo.scale(2.2, 0.08, 1);
    const aletaCola = new THREE.Mesh(aletaColaGeo, matDelfin);
    aletaCola.position.set(0, 0, -1.35);
    grupoDelfin.add(aletaCola);

    // Escalado para mayor definición visual debido a la nueva lejanía
    grupoDelfin.scale.set(1.4, 1.4, 1.4);

    // Configuración independiente de órbitas y tiempos
    const datosDelfin = {
      malla: grupoDelfin,
      radio: 28 + (i * 4),                      // Radios amplios escalonados (28, 32, 36) alejados de la orilla
      velocidad: 0.4 + (i * 0.08),              // Velocidades ligeramente distintas para romper simetrías
      angulo: (Math.PI / 3) + (i * 1.8),         // Separación inicial en el círculo orbital
      alturaBase: -0.3,                          // Nivel base bajo el plano del agua
      maxAlturaSalto: 2.6 + (i * 0.4),          // Altura del arco parabólico en el aire
      frecuenciaSalto: 1.6 - (i * 0.15),        // Factor de ritmo del ciclo
      desfaseTiempo: i * 2.3                    // Desfase matemático clave para que no salten al unísono
    };

    scene.add(grupoDelfin);
    delfines.push(datosDelfin);
  }
}
crearManadaDelfines();


// --- JOYSTICK INTERACTIVO ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let jStartX = 0, jStartY = 0;
const maxRadius = 30;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  jStartX = e.clientX; jStartY = e.clientY;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - jStartX;
  const dy = e.clientY - jStartY;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0; moveInput.y = 0;
});

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; evaluarTeclado(); });
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; evaluarTeclado(); });

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- LOOP RENDER PRINCIPAL ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const tiempoTotal = clock.getElapsedTime();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta); 
  if (michigrisMixer) michigrisMixer.update(delta);

  drawVuMeter();

  // Animación Gaviotas
  gaviotas.forEach((pajaro) => {
    pajaro.angulo += pajaro.velocidad * delta;
    pajaro.malla.position.x = Math.cos(pajaro.angulo) * pajaro.radio;
    pajaro.malla.position.z = Math.sin(pajaro.angulo) * pajaro.radio;
    pajaro.malla.position.y = pajaro.alturaBase + Math.sin(tiempoTotal * 1.2 + pajaro.desfase) * 0.15;
    pajaro.malla.rotation.y = -pajaro.angulo + Math.PI;

    const anguloAleteo = Math.sin(tiempoTotal * pajaro.frecuenciaAleteo + pajaro.desfase) * 0.35;
    pajaro.alaIzq.rotation.z = anguloAleteo;
    pajaro.alaDer.rotation.z = -anguloAleteo;
  });

  // Animación Colectiva e Independiente de la Manada de Delfines
  delfines.forEach((d) => {
    d.angulo += d.velocidad * delta;
    
    // Posicionamiento XZ orbital continuo en alta mar
    d.malla.position.x = Math.cos(d.angulo) * d.radio;
    d.malla.position.z = Math.sin(d.angulo) * d.radio;
    
    // Giro de orientación hacia la tangente de su trayectoria lineal
    d.malla.rotation.y = -d.angulo;

    // Cálculo dinámico de la trayectoria del salto usando el desfase individual
    const avanceSalto = ((tiempoTotal + d.desfaseTiempo) * d.frecuenciaSalto) % (Math.PI * 2);
    const senoSalto = Math.sin(avanceSalto);
    
    if (senoSalto > 0) {
      // Fase de vuelo: arco parabólico real por encima de la superficie del mar
      d.malla.position.y = d.alturaBase + (senoSalto * d.maxAlturaSalto);
      
      // Cabeceo (Pitch): Apunta hacia arriba al emerger y se inclina abajo antes de entrar al agua
      d.malla.rotation.x = Math.cos(avanceSalto) * 0.55;
    } else {
      // Fase submarina: nado ondulado de transición sutil bajo la superficie
      d.malla.position.y = d.alturaBase + (senoSalto * 0.18);
      d.malla.rotation.x = Math.cos(avanceSalto) * 0.12;
    }
  });

  // Movimiento del Avatar Luis
  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      const speed = 2.2; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
