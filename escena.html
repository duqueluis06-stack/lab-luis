<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 3D - Isla Bonita de Recuerdos</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 16px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      background: rgba(9, 13, 22, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      font-weight: bold;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* MAXI CONSOLA DJ TIESTO - PLAYLIST VISIBLE */
    #media-console {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 260px;
      background: linear-gradient(135deg, #111827 0%, #030712 100%);
      border: 2px solid #334155;
      border-top: 3px solid #00f0ff; 
      border-radius: 16px;
      padding: 12px;
      color: white;
      z-index: 100;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Pantalla LED */
    .led-display {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
    }

    .track-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
      white-space: nowrap;
      text-align: center;
    }

    /* PLAYLIST DIRECTA EN PANTALLA (SIN DESPLEGABLES) */
    .dj-playlist {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .playlist-item {
      font-family: monospace;
      font-size: 11px;
      padding: 6px 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 4px;
      color: #64748b;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .playlist-item:hover {
      color: white;
      border-color: #475569;
    }

    .playlist-item.active-track {
      color: #00f0ff;
      background: #1e293b;
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      font-weight: bold;
    }

    /* Controles */
    .deck-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vinyl-deck {
      width: 45px;
      height: 45px;
      background: radial-gradient(circle, #00f0ff 4%, #111 6%, #222 25%, #111 30%, #333 60%, #000 70%);
      border-radius: 50%;
      border: 1px solid #475569;
      flex-shrink: 0;
    }
    
    .vinyl-spinning {
      animation: spin 2s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-grow: 1;
    }

    .dj-btn {
      flex: 1;
      border: none;
      padding: 10px 4px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: #1f2937;
      border-bottom: 3px solid #111827;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dj-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
    
    #btn-play { background: #065f46; color: #34d399; }
    #btn-play.active-glow { box-shadow: 0 0 12px #10b981; background: #059669; color: white; }
    
    #btn-pause { background: #9a3412; color: #fb923c; }
    #btn-pause.active-glow { box-shadow: 0 0 12px #f97316; background: #ea580c; color: white; }

    #btn-next { background: #1e3a8a; color: #60a5fa; }

    #vumeter-canvas {
      width: 100%;
      height: 28px;
      background: #020617;
      border-radius: 6px;
      display: block;
      border: 1px solid #1e293b;
    }

    /* AJUSTE MÓVIL PANTALLA VERTICAL */
    @media (max-width: 600px) {
      #media-console {
        width: 190px;
        padding: 8px;
        top: 8px;
        right: 8px;
        gap: 6px;
      }
      .vinyl-deck { display: none; }
      .track-title { font-size: 10px; }
      .playlist-item { font-size: 9px; padding: 4px; }
      .dj-btn { font-size: 11px; padding: 8px 2px; }
      #vumeter-canvas { height: 18px; }
      #volver { top: 8px; left: 8px; padding: 6px 10px; font-size: 11px; }
    }

    /* Joystick */
    #joystick-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-knob {
      width: 32px;
      height: 32px;
      background: rgba(0, 240, 255, 0.5);
      border: 2px solid #00f0ff;
      border-radius: 50%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">⬅ Salir</button>

<div id="media-console">
  <div class="led-display">
    <div class="track-title" id="track-display">SYSTEM READY</div>
  </div>
  
  <div class="dj-playlist" id="playlist-box">
    <div class="playlist-item" data-track="0" id="item-0">entre-tes-ombres.mp3</div>
    <div class="playlist-item" data-track="1" id="item-1">stade-de-nos-reves.mp3</div>
    <div class="playlist-item" data-track="2" id="item-2">cumbia-de-minuit.mp3</div>
  </div>

  <div class="deck-row">
    <div id="vinyl" class="vinyl-deck"></div>
    <div class="btn-group">
      <button class="dj-btn" id="btn-play">▶</button>
      <button class="dj-btn" id="btn-pause">⏸</button>
      <button class="dj-btn" id="btn-next">⏩</button>
    </div>
  </div>

  <canvas id="vumeter-canvas"></canvas>
</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);


// --- ENGINE DE AUDIO DJ ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const playlist = ["entre-tes-ombres.mp3", "stade-de-nos-reves.mp3", "cumbia-de-minuit.mp3"];
let currentTrackIndex = 0;
let isManualChange = false; 
let hasStartedAutoplay = false;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 240;
vuCanvas.height = 28;

function updateConsoleUI(filename, status) {
  const display = document.getElementById('track-display');
  const vinyl = document.getElementById('vinyl');
  const playBtn = document.getElementById('btn-play');
  const pauseBtn = document.getElementById('btn-pause');

  // Actualizar indicador luminoso de la lista activa
  playlist.forEach((_, idx) => {
    const item = document.getElementById(`item-${idx}`);
    if(idx === currentTrackIndex) {
      item.classList.add('active-track');
    } else {
      item.classList.remove('active-track');
    }
  });

  if (status === 'loading') {
    display.innerText = "LOAD: " + filename;
    display.style.color = "#ff007f";
  } else if (status === 'playing') {
    display.innerText = filename;
    display.style.color = "#00f0ff";
    vinyl.classList.add('vinyl-spinning');
    playBtn.classList.add('active-glow');
    pauseBtn.classList.remove('active-glow');
  } else if (status === 'paused') {
    display.innerText = "PAUSED";
    display.style.color = "#fb923c";
    vinyl.classList.remove('vinyl-spinning');
    playBtn.classList.remove('active-glow');
    pauseBtn.classList.add('active-glow');
  }
}

function loadTrack(index, startPlaying = false) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  updateConsoleUI(filename, 'loading');

  audioLoader.load(filename, (buffer) => {
    isManualChange = true;
    if (soundSource.isPlaying) soundSource.stop();
    isManualChange = false;

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    
    if(!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }

    if (startPlaying) {
      executePlay();
    } else {
      updateConsoleUI(filename, 'paused');
    }
  }, undefined, (err) => {
    document.getElementById('track-display').innerText = "404: NOT FOUND";
    console.error(err);
  });
}

function executePlay() {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying) {
    soundSource.play();
    updateConsoleUI(playlist[currentTrackIndex], 'playing');
    
    if (soundSource.source) {
      soundSource.source.onended = () => {
        if (!isManualChange) nextTrack();
      };
    }
  }
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

// Inicializar primer track en espera
loadTrack(0, false);

// Eventos de selección directa en la pantalla táctil de la consola
document.querySelectorAll('.playlist-item').forEach(item => {
  item.addEventListener('click', (e) => {
    let trackIdx = parseInt(e.target.getAttribute('data-track'));
    hasStartedAutoplay = true;
    loadTrack(trackIdx, true);
  });
});

document.getElementById("btn-play").addEventListener("click", () => {
  isManualChange = false;
  hasStartedAutoplay = true;
  executePlay();
});

document.getElementById("btn-pause").addEventListener("click", () => {
  if (soundSource.isPlaying) {
    isManualChange = true; 
    soundSource.pause();
    updateConsoleUI(playlist[currentTrackIndex], 'paused');
  }
});

document.getElementById("btn-next").addEventListener("click", () => {
  hasStartedAutoplay = true;
  nextTrack();
});

window.addEventListener('click', () => {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (!hasStartedAutoplay && soundSource.buffer && !soundSource.isPlaying) {
    hasStartedAutoplay = true;
    executePlay();
  }
});

function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    const barWidth = vuCanvas.width / data.length;
    
    for (let i = 0; i < data.length; i++) {
      const value = data[i];
      const barHeight = vuCanvas.height * (value / 255);
      
      let gradient = vuCtx.createLinearGradient(0, vuCanvas.height, 0, 0);
      gradient.addColorStop(0, '#00f0ff');
      gradient.addColorStop(0.7, '#a855f7');
      gradient.addColorStop(1, '#ff007f');

      vuCtx.fillStyle = gradient;
      vuCtx.fillRect(i * barWidth, vuCanvas.height - barHeight, barWidth - 2, barHeight);
    }
  } else {
    vuCtx.fillStyle = "#1e293b";
    vuCtx.fillRect(0, vuCanvas.height / 2 - 1, vuCanvas.width, 2);
  }
}


// --- GESTIÓN DE MODELOS 3D ---
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       
let islandMixer = null; 
let laraMixer = null; 

// 1. Isla
loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => islandMixer.clipAction(clip).play());
  }
}, undefined, (err) => console.error("Error Isla:", err));

// 2. Tu Avatar (Luis)
loader.load("luis-acostado.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0); 
  avatar.rotation.y = Math.PI; 
  scene.add(avatar);
  controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    mixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (err) => console.error("Error Luis-avatar:", err));

// 3. Lara Baila
loader.load("lara-baila.glb", (gltf) => {
  const lara = gltf.scene;
  lara.scale.set(0.48, 0.48, 0.48); 
  lara.position.set(1.8, 0, -1); 
  scene.add(lara);
  
  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(lara);
    laraMixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (err) => console.error("Error Lara:", err));

// 4. Tiki Bar
loader.load("tiki-bar.glb", (gltf) => {
  const bar = gltf.scene;
  bar.scale.set(0.022, 0.022, 0.022); 
  bar.position.set(0, 0, -4.5);       
  scene.add(bar);
}, undefined, (err) => console.error("Error Tiki Bar:", err));

// 5. Bambú Tiki (¡LLAMADA RECTIFICADA CON MAYÚSCULA 'Bambu-tiki.glb'!)
loader.load("Bambu-tiki.glb", (gltf) => {
  const bambu = gltf.scene;
  
  // Fuerza recentrado matemático por si el pivote vino roto de origen
  const box = new THREE.Box3().setFromObject(bambu);
  const center = new THREE.Vector3();
  box.getCenter(center);
  bambu.position.sub(center); 

  const bambuGroup = new THREE.Group();
  bambuGroup.add(bambu);
  
  // Tamaño gigante y posición justo enfrente del jugador para verlo sí o sí
  bambuGroup.scale.set(1.2, 1.2, 1.2); 
  bambuGroup.position.set(-1.6, 0.8, -0.5); 
  
  scene.add(bambuGroup);
  console.log("¡Bambú cargado con éxito gracias al cambio de mayúscula!");
}, undefined, (err) => {
  console.error("Error Bambú crítico:", err);
  // Alerta en pantalla si GitHub sigue sin encontrar el archivo
  document.getElementById('track-display').innerText = "ERROR GLB: CHECK NAME";
});


// --- CONTROLES INTERFACES ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let jStartX = 0, jStartY = 0;
const maxRadius = 30;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  jStartX = e.clientX; 
  jStartY = e.clientY;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - jStartX;
  const dy = e.clientY - jStartY;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0; moveInput.y = 0;
});

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; evaluarTeclado(); });
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; evaluarTeclado(); });

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- LOOP PRINCIPAL DE ANIMACIÓN ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta);

  drawVuMeter();

  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      const speed = 2.2; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
