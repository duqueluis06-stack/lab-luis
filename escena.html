<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 3D - Isla Bonita de Recuerdos</title>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #87ceeb;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #volver {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      font-weight: bold;
      color: #1e293b;
    }

    /* MINI CONSOLA CRISTALINA SEMI TRANSPARENTE */
    #media-console {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 210px;
      background: rgba(15, 23, 42, 0.45); 
      backdrop-filter: blur(10px);        
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px;
      color: white;
      z-index: 100;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .track-title {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #38bdf8;
      text-align: center;
    }

    .playlist-select {
      width: 100%;
      background: rgba(51, 65, 85, 0.5);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px;
      border-radius: 6px;
      font-size: 10px;
      margin-bottom: 6px;
      outline: none;
    }

    .controls-row {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }

    .console-btn {
      flex: 1;
      border: none;
      padding: 5px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: rgba(71, 85, 105, 0.6);
      transition: background 0.2s;
    }
    .console-btn:active { background: rgba(255, 255, 255, 0.3); }
    #btn-play { background: rgba(22, 163, 74, 0.6); }
    #btn-pause { background: rgba(234, 88, 12, 0.6); }
    #btn-next { background: rgba(56, 189, 248, 0.6); } 

    #vumeter-canvas {
      width: 100%;
      height: 24px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 6px;
      display: block;
    }

    /* PANTALLAS MÓVILES */
    @media (max-width: 600px) {
      #media-console {
        width: 140px;
        padding: 5px;
        top: 8px;
        right: 8px;
      }
      .track-title { font-size: 9px; }
      .playlist-select { font-size: 8px; padding: 2px; margin-bottom: 4px; }
      .console-btn { font-size: 9px; padding: 3px; }
      #vumeter-canvas { height: 16px; }
      #volver { top: 8px; left: 8px; padding: 5px 8px; font-size: 11px; }
    }

    /* Joystick Virtual */
    #joystick-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 100;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joystick-knob {
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<button id="volver" onclick="window.location.href='index.html'">⬅ Volver</button>

<div id="media-console">
  <div class="track-title" id="track-display">Cargando tracks...</div>
  <select id="track-select" class="playlist-select">
    <option value="entre-tes-ombres.mp3">entre-tes-ombres.mp3</option>
    <option value="stade-de-nos-reves.mp3">stade-de-nos-reves.mp3</option>
    <option value="cumbia-de-minuit.mp3">cumbia-de-minuit.mp3</option>
  </select>
  <div class="controls-row">
    <button class="console-btn" id="btn-play" title="Play">▶</button>
    <button class="console-btn" id="btn-pause" title="Pausa">⏸</button>
    <button class="console-btn" id="btn-next" title="Siguiente">⏩</button>
  </div>
  <canvas id="vumeter-canvas"></canvas>
</div>

<div id="joystick-container">
  <div id="joystick-knob"></div>
</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 4, 10); 

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(20, 40, 15);
scene.add(dirLight);


// --- CONSOLA MULTIMEDIA ---
const listener = new THREE.AudioListener();
camera.add(listener);

const soundSource = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
let audioAnalyser = null;

const playlist = ["entre-tes-ombres.mp3", "stade-de-nos-reves.mp3", "cumbia-de-minuit.mp3"];
let currentTrackIndex = 0;
let isManualChange = false; 
let hasStartedAutoplay = false;

const vuCanvas = document.getElementById("vumeter-canvas");
const vuCtx = vuCanvas.getContext("2d");
vuCanvas.width = 200;
vuCanvas.height = 24;

function loadTrack(index, startPlaying = false) {
  currentTrackIndex = index;
  const filename = playlist[currentTrackIndex];
  document.getElementById('track-display').innerText = "Cargando...";
  document.getElementById('track-select').value = filename;

  audioLoader.load(filename, (buffer) => {
    isManualChange = true;
    if (soundSource.isPlaying) soundSource.stop();
    isManualChange = false;

    soundSource.setBuffer(buffer);
    soundSource.setLoop(false); 
    soundSource.setVolume(0.5);
    document.getElementById('track-display').innerText = "🎵 " + filename;
    
    if(!audioAnalyser) {
      audioAnalyser = new THREE.AudioAnalyser(soundSource, 32);
    }

    if (startPlaying) {
      executePlay();
    }
  }, undefined, (err) => {
    document.getElementById('track-display').innerText = "⚠ No hallado";
    console.error(err);
  });
}

function executePlay() {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (soundSource.buffer && !soundSource.isPlaying) {
    soundSource.play();
    
    if (soundSource.source) {
      soundSource.source.onended = () => {
        if (!isManualChange) {
          nextTrack();
        }
      };
    }
  }
}

function nextTrack() {
  let nextIndex = (currentTrackIndex + 1) % playlist.length;
  loadTrack(nextIndex, true);
}

loadTrack(0, false);

document.getElementById("track-select").addEventListener("change", (e) => {
  let targetIndex = playlist.indexOf(e.target.value);
  hasStartedAutoplay = true; 
  loadTrack(targetIndex, true);
});

document.getElementById("btn-play").addEventListener("click", () => {
  isManualChange = false;
  hasStartedAutoplay = true;
  executePlay();
});

document.getElementById("btn-pause").addEventListener("click", () => {
  if (soundSource.isPlaying) {
    isManualChange = true; 
    soundSource.pause();
  }
});

document.getElementById("btn-next").addEventListener("click", () => {
  hasStartedAutoplay = true;
  nextTrack();
});

window.addEventListener('click', () => {
  if (THREE.AudioContext.getContext().state === 'suspended') {
    THREE.AudioContext.getContext().resume();
  }
  if (!hasStartedAutoplay && soundSource.buffer && !soundSource.isPlaying) {
    hasStartedAutoplay = true;
    executePlay();
  }
});

function drawVuMeter() {
  vuCtx.clearRect(0, 0, vuCanvas.width, vuCanvas.height);
  if (audioAnalyser && soundSource.isPlaying) {
    const data = audioAnalyser.getFrequencyData();
    const barWidth = vuCanvas.width / data.length;
    for (let i = 0; i < data.length; i++) {
      const value = data[i];
      const barHeight = vuCanvas.height * (value / 255);
      const hue = (i / data.length) * 120 + 200; 
      vuCtx.fillStyle = `hsla(${hue}, 100%, 55%, 0.85)`;
      vuCtx.fillRect(i * barWidth, vuCanvas.height - barHeight, barWidth - 1, barHeight);
    }
  } else {
    vuCtx.strokeStyle = "rgba(255,255,255,0.08)";
    vuCtx.beginPath();
    vuCtx.moveTo(0, vuCanvas.height / 2);
    vuCtx.lineTo(vuCanvas.width, vuCanvas.height / 2);
    vuCtx.stroke();
  }
}


// --- CARGA Y CALIBRACIÓN DE MODELOS GLTF ---
const loader = new GLTFLoader();
let avatar = null;
let mixer = null;       
let islandMixer = null; 
let laraMixer = null; 

// 1. Isla
loader.load("isla.glb", (gltf) => {
  scene.add(gltf.scene);
  if (gltf.animations && gltf.animations.length > 0) {
    islandMixer = new THREE.AnimationMixer(gltf.scene);
    gltf.animations.forEach((clip) => islandMixer.clipAction(clip).play());
  }
}, undefined, (err) => console.error("Error Isla:", err));

// 2. Tu Avatar (Luis)
loader.load("luis-acostado.glb", (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0); 
  avatar.rotation.y = Math.PI; 
  scene.add(avatar);
  controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(avatar);
    mixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (err) => console.error("Error Luis-avatar:", err));

// 3. Lara Baila
loader.load("lara-baila.glb", (gltf) => {
  const lara = gltf.scene;
  lara.scale.set(0.48, 0.48, 0.48); 
  lara.position.set(1.8, 0, -1); 
  scene.add(lara);
  
  if (gltf.animations && gltf.animations.length > 0) {
    laraMixer = new THREE.AnimationMixer(lara);
    laraMixer.clipAction(gltf.animations[0]).play();
  }
}, undefined, (err) => console.error("Error Lara:", err));

// 4. Tiki Bar (¡RECALIBRADO A 0.022 PARA EL TAMAÑO IDEAL!)
loader.load("tiki-bar.glb", (gltf) => {
  const bar = gltf.scene;
  bar.scale.set(0.022, 0.022, 0.022); 
  bar.position.set(0, 0, -4.5);       
  scene.add(bar);
}, undefined, (err) => console.error("Error Tiki Bar:", err));

// 5. Bambú Tiki (¡RESCATADO! Escala ampliada y reubicado justo a tu izquierda)
loader.load("bambu-tiki.glb", (gltf) => {
  const bambu = gltf.scene;
  bambu.scale.set(0.06, 0.06, 0.06); 
  bambu.position.set(-1.2, 0, -1.5); // Al lado de tu avatar, imposible perderlo
  scene.add(bambu);
}, undefined, (err) => console.error("Error Bambú:", err));


// --- ENTRADAS INTERFACES ---
const moveInput = { x: 0, y: 0 };
const joystick = document.getElementById('joystick-container');
const knob = document.getElementById('joystick-knob');
let joystickActive = false;
let jStartX = 0, jStartY = 0;
const maxRadius = 30;

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  jStartX = e.clientX; jStartY = e.clientY;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener('pointermove', (e) => {
  if (!joystickActive) return;
  const dx = e.clientX - jStartX;
  const dy = e.clientY - jStartY;
  const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxRadius);
  const angle = Math.atan2(dy, dx);
  const moveX = Math.cos(angle) * distance;
  const moveY = Math.sin(angle) * distance;
  knob.style.transform = `translate(${moveX}px, ${moveY}px)`;
  moveInput.x = moveX / maxRadius;
  moveInput.y = -moveY / maxRadius; 
});

joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  knob.style.transform = 'translate(0px, 0px)';
  moveInput.x = 0; moveInput.y = 0;
});

const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; evaluarTeclado(); });
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; evaluarTeclado(); });

function evaluarTeclado() {
  if (!joystickActive) {
    moveInput.x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    moveInput.y = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  }
}


// --- LOOP RENDER PRINCIPAL ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);
  if (islandMixer) islandMixer.update(delta);
  if (laraMixer) laraMixer.update(delta);

  drawVuMeter();

  if (avatar) {
    const isMoving = (moveInput.x !== 0 || moveInput.y !== 0);
    if (isMoving) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();

      const camRight = new THREE.Vector3();
      camRight.crossVectors(camDir, camera.up).normalize();

      const moveDirection = new THREE.Vector3();
      moveDirection.addScaledVector(camRight, moveInput.x);
      moveDirection.addScaledVector(camDir, moveInput.y);
      moveDirection.normalize();

      const speed = 2.2; 
      avatar.position.addScaledVector(moveDirection, speed * delta);

      const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
      avatar.rotation.y = targetAngle;

      controls.target.copy(avatar.position).add(new THREE.Vector3(0, 1, 0));
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
