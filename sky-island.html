<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isla del Cielo - Recepción</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* Reset básico y bloqueo de scroll */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #020208;
    }

    /* El lienzo donde se renderizará el espacio 3D */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Interfaz de usuario (UI) superpuesta al 3D */
    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* Permite que el ratón interactúe con el fondo si es necesario */
    }

    /* Tarjeta futurista efecto Cristal (Glassmorphism) */
    .welcome-card {
      background: rgba(10, 20, 40, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 50px 40px;
      border-radius: 24px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                  0 0 40px rgba(74, 163, 255, 0.1) inset;
      pointer-events: auto; /* Reactiva los clicks dentro de la tarjeta */
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1 {
      color: #ffffff;
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(74, 163, 255, 0.6);
    }

    p {
      color: #8da2fb;
      font-size: 1.1rem;
      margin-bottom: 40px;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Botón portal inmersivo hiper-reactivo */
    .btn-portal {
      display: inline-block;
      position: relative;
      padding: 18px 45px;
      background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
      background-size: 200% auto;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 50px;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(67, 100, 247, 0.5);
      transition: all 0.4s ease;
      overflow: hidden;
    }

    .btn-portal:hover {
      background-position: right center;
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 40px rgba(111, 177, 252, 0.8);
    }

    .btn-portal:active {
      transform: scale(0.98) translateY(1px);
    }

    /* Efecto de destello interno en el botón */
    .btn-portal::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 100%);
      transform: skewX(-25deg);
      transition: 0.75s;
    }

    .btn-portal:hover::before {
      left: 150%;
    }

    /* Animación de entrada suave */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-container">
    <div class="welcome-card">
      <h1>Isla del Cielo</h1>
      <p>Estás a punto de ascender a una experiencia virtual interactiva en Viverse. Prepara tu avatar.</p>
      
      <a class="btn-portal" href="https://create.viverse.com/Bg6wvVg" target="_blank">
        INICIAR ASCENSO
      </a>
    </div>
  </div>

  <script>
    let scene, camera, renderer, stars, starGeo;
    const container = document.getElementById('canvas-container');

    function init() {
      // 1. Escena y Niebla de fondo cósmico
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020208, 0.0015);

      // 2. Cámara
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.z = 1;
      camera.rotation.x = Math.PI/2;

      // 3. Renderizador
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // 4. Creación del Campo de Estrellas (Partículas)
      starGeo = new THREE.BufferGeometry();
      const starCount = 6000;
      const positions = new Float32Array(starCount * 3);

      for(let i=0; i<starCount*3; i+=3) {
        // Distribución en un cubo gigante en el espacio
        positions[i] = (Math.random() - 0.5) * 600;     // X
        positions[i+1] = (Math.random() - 0.5) * 600;   // Y
        positions[i+2] = (Math.random() - 0.5) * 600;   // Z
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      // Textura estilizada de estrella (generada por código para evitar enlaces caídos)
      const mat = new THREE.PointsMaterial({
        color: 0xaaaaff,
        size: 0.9,
        transparent: true,
        opacity: 0.8
      });

      stars = new THREE.Points(starGeo, mat);
      scene.add(stars);

      // 5. Eventos
      window.addEventListener('resize', onWindowResize, false);
      document.addEventListener('mousemove', onMouseMove, false);

      animate();
    }

    // Efecto interactivo: mover ligeramente la cámara con el ratón
    let mouseX = 0, mouseY = 0;
    function onMouseMove(event) {
      mouseX = (event.clientX - window.innerWidth / 2) * 0.0005;
      mouseY = (event.clientY - window.innerHeight / 2) * 0.0005;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Loop de animación (Efecto de velocidad hiperespacial continua)
    function animate() {
      requestAnimationFrame(animate);

      // Movimiento de las estrellas hacia el frente
      const positions = starGeo.attributes.position.array;
      for (let i = 1; i < positions.length; i += 3) {
        positions[i] -= 0.18; // Velocidad de caída/acercamiento en Y
        
        if (positions[i] < -300) {
          positions[i] = 300; // Reseteo al fondo al salir de pantalla
        }
      }
      starGeo.attributes.position.needsUpdate = true;

      // Rotación suave guiada por el mouse del usuario
      stars.rotation.y += 0.0008 + mouseX * 0.1;
      stars.rotation.x += 0.0002 + mouseY * 0.1;

      renderer.render(scene, camera);
    }

    // Inicializar al cargar
    init();
  </script>
</body>
</html>
