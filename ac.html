<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SIMULADOR DE CORRIENTE ALTERNA - TRUE-SPICE</title>

<style>
    body {
        margin: 0;
        background: #020408;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
    }

    header {
        height: 40px;
        background: #080c16;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        border-bottom: 2px solid #161f3d;
    }

    .btn {
        background: #050711;
        border: 1px solid #00f2fe;
        color: #00f2fe;
        padding: 6px 10px;
        font-size: 11px;
        cursor: pointer;
    }

    #workspace {
        position: relative;
        width: 100%;
        height: calc(100vh - 40px);
        background: radial-gradient(circle, #030a12, #000);
    }

    #waveCanvas {
        width: 100%;
        height: 200px;
        background: #010204;
        border-top: 1px solid #161f3d;
        position: absolute;
        bottom: 0;
    }

    .panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(10,15,25,0.9);
        border: 1px solid #00f2fe;
        padding: 10px;
        border-radius: 6px;
    }

    input {
        width: 120px;
        background: #000;
        border: 1px solid #333;
        color: #00f2fe;
        margin-top: 5px;
    }

    label {
        font-size: 10px;
        color: #aaa;
    }
</style>
</head>

<body>

<header>
    <div>⚡ AC LAB - FREQUENCY DOMAIN</div>
    <button class="btn" onclick="goBack()">⬅ BACK DC</button>
</header>

<div id="workspace">

    <div class="panel">
        <label>Frecuencia (Hz)</label><br>
        <input type="number" id="freq" value="50"><br><br>

        <label>Amplitud (V)</label><br>
        <input type="number" id="amp" value="5"><br><br>

        <button class="btn" onclick="startAC()">RUN</button>
    </div>

    <canvas id="waveCanvas"></canvas>
</div>

<script>

let canvas = document.getElementById("waveCanvas");
let ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 200;
}
resize();
window.addEventListener("resize", resize);

let t = 0;
let running = false;
let freq = 50;
let amp = 5;

function draw() {

    if (!running) return;

    ctx.fillStyle = "#010204";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "#00f2fe";
    ctx.beginPath();

    let mid = canvas.height / 2;

    for (let x = 0; x < canvas.width; x++) {
        let y = mid + Math.sin((x + t) * 0.02 * freq) * amp * 10;
        ctx.lineTo(x, y);
    }

    ctx.stroke();

    t += 2;
    requestAnimationFrame(draw);
}

function startAC() {
    freq = parseFloat(document.getElementById("freq").value);
    amp = parseFloat(document.getElementById("amp").value);
    running = true;
    draw();
}

function goBack() {
    window.location.href = "index.html";
}

</script>

</body>
</html>
