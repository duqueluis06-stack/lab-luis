<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIMULADOR DE CORRIENTE ALTERNA - TRUE-SPICE</title>

<style>
:root{
    --bg:#03050a;
    --panel:#081018;
    --cyan:#00f2fe;
    --green:#39ff14;
    --yellow:#ffee00;
    --orange:#ff7b00;
    --red:#ff073a;
    --purple:#b026ff;
    --border:#18263f;
    --text:#f1f5f9;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:monospace;
    user-select:none;
    -webkit-user-select: none;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

header{
    height:45px;
    background:#050912;
    border-bottom:2px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    flex-shrink: 0;
}

.title{
    color:var(--cyan);
    font-weight:bold;
    text-shadow:0 0 8px var(--cyan);
    font-size:11px;
}

.exit-btn{
    background:#14040a;
    color:var(--red);
    border:1px solid var(--red);
    padding:6px 12px;
    border-radius:5px;
    font-weight:bold;
    font-size:11px;
    cursor: pointer;
}

#viewport{
    flex:1;
    position:relative;
    overflow:hidden;
    background:#010204;
    touch-action: none;
}

#sandbox{
    position:absolute;
    width:2000px;
    height:2000px;
    background-image:
    linear-gradient(to right, rgba(0,242,254,0.02) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,242,254,0.02) 1px, transparent 1px);
    background-size:25px 25px;
}

#wire-layer{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events: auto;
}

.wire{
    stroke:var(--cyan);
    stroke-width:4;
    fill:none;
    cursor: pointer;
    filter:drop-shadow(0 0 4px var(--cyan));
    pointer-events: stroke;
}
.wire:hover{
    stroke: var(--red);
    filter:drop-shadow(0 0 6px var(--red));
}

.toolbox{
    background:#071018;
    border-top:2px solid var(--border);
    padding:8px;
    flex-shrink: 0;
}

.row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling: touch;
}

.btn{
    background:#02050a;
    border:1px solid var(--border);
    color:white;
    padding:8px 14px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
    flex-shrink:0;
    touch-action: manipulation;
}

.spice-node{
    position:absolute;
    z-index:50;
    touch-action: none;
}

.comp-body{
    position:relative;
    background: rgba(8, 16, 24, 0.8);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
}

.net-pin{
    position:absolute;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 60;
    touch-action: manipulation;
    cursor: pointer;
}

.net-pin::after{
    content:'';
    width:12px;
    height:12px;
    border-radius:50%;
    border:2px solid #556b82;
    background:#091018;
}

.net-pin.connected::after{
    border-color: var(--cyan);
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
}

.pwr-btn {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #200505;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 8px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
    cursor: pointer;
    z-index: 70;
}
.pwr-btn.on {
    background: #05200b;
    border: 1px solid var(--green);
    color: var(--green);
    box-shadow: 0 0 5px var(--green);
}

.telemetry{
    background:rgba(0,0,0,0.9);
    border:1px solid var(--border);
    margin-top:24px;
    padding:3px;
    border-radius:4px;
    text-align:center;
    color:#556b82;
    font-size:9px;
    font-weight: bold;
}
.telemetry.on{
    color: var(--green);
    text-shadow: 0 0 4px var(--green);
    border-color: var(--green);
}

.scope-panel{
    background:#040910;
    border-top:2px solid var(--border);
    padding:8px;
    display: flex;
    flex-direction: column;
    gap:6px;
    flex-shrink: 0;
}

.scope-controls{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.scope-btn{
    padding: 4px 10px;
    font-size: 10px;
    background: #100404;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 4px;
    font-weight: bold;
}
.scope-btn.active{
    background: #041006;
    border: 1px solid var(--green);
    color: var(--green);
}

.knob-container{
    display: flex;
    gap: 15px;
    align-items: center;
}

.knob-label{
    font-size: 10px;
    color: #8fa0b3;
}

.knob-label select{
    background: #02050a;
    color: var(--cyan);
    border: 1px solid var(--border);
    font-size: 10px;
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
    margin-left: 4px;
}

.scope-box{
    border: 2px solid #102e15;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
}

canvas{
    width:100%;
    height:95px;
    display:block;
    background:#000d02;
}

.modal {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.8);
    align-items: center;
    justify-content: center;
}
.modal-content {
    background: var(--panel);
    border: 2px solid var(--cyan);
    padding: 20px;
    border-radius: 8px;
    width: 280px;
    text-align: center;
}
.modal-content input {
    width: 100%;
    padding: 8px;
    background: #02050a;
    border: 1px solid var(--border);
    color: white;
    margin-bottom: 15px;
    font-family: monospace;
    text-align: center;
}
.modal-actions {
    display: flex;
    gap: 10px;
}
.modal-actions button {
    flex: 1;
    padding: 8px;
    font-family: monospace;
    font-weight: bold;
    border-radius: 4px;
    border: none;
}
</style>
</head>
<body>

<header>
<div class="title">⚡ TRUE-SPICE AC ENGINE v2.5</div>
<button class="exit-btn" onclick="volverDC()">🚪 VOLVER DC</button>
</header>

<div id="viewport">
<div id="sandbox">
<svg id="wire-layer"></svg>
</div>
</div>

<div class="toolbox">
<div class="row">
<button class="btn" onclick="addComponent('ac_power')">⚡ FUENTE AC</button>
<button class="btn" onclick="addComponent('disyuntor')">🔌 DISYUNTOR</button>
<button class="btn" onclick="addComponent('transformador')">🧲 TRANSFORMADOR</button>
<button class="btn" onclick="addComponent('motor_ac')">🌀 MOTOR AC</button>
<button class="btn" onclick="addComponent('capacitor')">🔵 CAPACITOR</button>
<button class="btn" onclick="addComponent('resistor')">🟫 RESISTENCIA</button>
<button class="btn" onclick="addComponent('bombilla')">💡 BOMBILLA</button>
</div>
</div>

<div class="scope-panel">
<div class="scope-controls">
    <button id="scopeToggle" class="scope-btn active" onclick="toggleScope()">OSCILOSCOPIO: ON</button>
    <div class="knob-container">
        <label class="knob-label">VOLT/DIV:
            <select id="scopeVolt" onchange="updateScopeParams()">
                <option value="0.5">0.5V</option>
                <option value="1" selected>1.0V</option>
                <option value="2">2.0V</option>
            </select>
        </label>
        <label class="knob-label">TIMEBASE:
            <select id="scopeTime" onchange="updateScopeParams()">
                <option value="0.03">X2</option>
                <option value="0.06" selected>X1</option>
                <option value="0.12">X0.5</option>
            </select>
        </label>
    </div>
</div>
<div class="scope-box">
<canvas id="scope"></canvas>
</div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Editar Parámetro</h3>
        <input type="number" id="paramInput" step="any">
        <div class="modal-actions">
            <button style="background:var(--green); color:black;" onclick="saveParam()">GUARDAR</button>
            <button style="background:var(--red); color:white;" onclick="closeModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
function volverDC(){
    window.location.href = 'simulador-electronica.html';
}

const sandbox = document.getElementById('sandbox');
const wireLayer = document.getElementById('wire-layer');

let components = [];
let wires = [];
let selectedPin = null;
let globalId = 0;
let phase = 0;

let scopeOn = true;
let scopeVoltScale = 1;
let scopeTimeScale = 0.06;
let editingComponent = null;

const ARCH = {
ac_power:{
w:120, h:90,
render:(n)=>`
<div class="comp-body">
<svg width="100" height="70" viewBox="0 0 100 70">
<rect x="10" y="10" width="80" height="50" rx="8" fill="#071018" stroke="var(--cyan)" stroke-width="2"/>
<path d="M25 35 Q37 15 50 35 Q62 55 75 35" stroke="var(--cyan)" stroke-width="3" fill="none"/>
<text x="50" y="54" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.v} VAC</text>
</svg>
<button class="pwr-btn ${n.isOn ? 'on' : ''}" id="pwr_${n.id}" onclick="toggleFuente('${n.id}')">${n.isOn ? 'POWER: ON' : 'POWER: OFF'}</button>
<div class="net-pin" id="pin_${n.id}_a" style="left:-14px; top:22px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-14px; top:22px"></div>
</div>`
},
disyuntor:{
w:110, h:90,
render:(n)=>`
<div class="comp-body" style="padding-bottom:12px;">
<svg width="90" height="60" viewBox="0 0 90 60" style="cursor:pointer;" onclick="toggleDisyuntor('${n.id}')">
<rect x="10" y="5" width="70" height="50" rx="4" fill="#0b1521" stroke="#4b6b94" stroke-width="2"/>
<line x1="10" y1="30" x2="30" y2="30" stroke="#fff" stroke-width="3"/>
<line x1="60" y1="30" x2="80" y2="30" stroke="#fff" stroke-width="3"/>
<line id="sw_${n.id}" x1="30" y1="30" x2="58" y2="${n.closed ? '30':'12'}" stroke="${n.closed ? 'var(--green)':'var(--red)'}" stroke-width="4"/>
<text x="45" y="48" fill="#fff" font-size="8" text-anchor="middle" id="state_${n.id}">${n.closed ? 'BREAKER IN':'BREAKER OUT'}</text>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-14px; top:16px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-14px; top:16px"></div>
</div>`
},
transformador:{
w:160, h:110,
render:(n)=>`
<div class="comp-body">
<svg width="140" height="90" viewBox="0 0 140 90">
<rect x="61" y="10" width="18" height="70" fill="#223147"/>
${Array.from({length:6},(_,i)=>`<circle cx="38" cy="${18+i*10}" r="6" fill="none" stroke="orange" stroke-width="2"/>`).join('')}
${Array.from({length:6},(_,i)=>`<circle cx="102" cy="${18+i*10}" r="6" fill="none" stroke="var(--yellow)" stroke-width="2"/>`).join('')}
<text x="70" y="5" fill="#8fa0b3" font-size="8" text-anchor="middle" id="val_${n.id}">Ratio: ${n.ratio}</text>
</svg>
<div class="net-pin" id="pin_${n.id}_p1" style="left:-14px; top:18px"></div>
<div class="net-pin" id="pin_${n.id}_p2" style="left:-14px; top:52px"></div>
<div class="net-pin" id="pin_${n.id}_s1" style="right:-14px; top:18px"></div>
<div class="net-pin" id="pin_${n.id}_s2" style="right:-14px; top:52px"></div>
</div>`
},
motor_ac:{
w:100, h:100,
render:(n)=>`
<div class="comp-body">
<svg width="80" height="80" viewBox="0 0 80 80">
<circle cx="40" cy="40" r="28" fill="#08131f" stroke="var(--cyan)" stroke-width="2"/>
<g id="fan_${n.id}" style="transform-origin:40px 40px;">
<path d="M40 40 L40 12 Q50 20 45 32 Z" fill="var(--cyan)"/>
<path d="M40 40 L68 40 Q60 50 48 45 Z" fill="var(--cyan)"/>
<path d="M40 40 L40 68 Q30 60 35 48 Z" fill="var(--cyan)"/>
<path d="M40 40 L12 40 Q20 30 32 35 Z" fill="var(--cyan)"/>
</g>
<circle cx="40" cy="40" r="5" fill="#fff"/>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-14px; top:25px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-14px; top:25px"></div>
</div>`
},
capacitor:{
w:90, h:70,
render:(n)=>`
<div class="comp-body">
<svg width="80" height="50">
<rect x="18" y="10" width="44" height="28" rx="5" fill="#0f2b5c" stroke="#00f2fe" stroke-width="2"/>
<line x1="34" y1="14" x2="34" y2="34" stroke="#fff" stroke-width="2"/>
<line x1="46" y1="14" x2="46" y2="34" stroke="#fff" stroke-width="2"/>
<text x="40" y="48" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.uf} uF</text>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-14px; top:12px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-14px; top:12px"></div>
</div>`
},
resistor:{
w:90, h:60,
render:(n)=>`
<div class="comp-body">
<svg width="80" height="30">
<rect x="15" y="6" width="50" height="18" rx="4" fill="#4a3200" stroke="var(--yellow)" stroke-width="1.5"/>
<path d="M20 15 L25 9 L32 21 L39 9 L46 21 L53 9 L60 15" fill="none" stroke="orange" stroke-width="2"/>
<text x="40" y="34" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.r} Ω</text>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-14px; top:2px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-14px; top:2px"></div>
</div>`
},
bombilla:{
w:90, h:80,
render:(n)=>`
<div class="comp-body">
<svg width="70" height="60">
<circle id="lamp_${n.id}" cx="35" cy="22" r="16" fill="rgba(255,255,0,0.05)" stroke="#777" stroke-width="2"/>
<path d="M30 26 L33 18 L37 18 L40 26" fill="none" stroke="#fff" stroke-width="1"/>
<rect x="29" y="38" width="12" height="8" fill="#555"/>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-14px; top:18px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-14px; top:18px"></div>
</div>`
}
};

function addComponent(type){
    globalId++;
    const c = {
        id:type+'_'+globalId,
        type,
        x: 60 + (globalId % 3) * 40,
        y: 80 + (globalId % 3) * 35,
        v: 220, r: 100, uf: 47, ratio: 0.5,
        closed: false, isOn: false, powered: false
    };
    components.push(c);
    renderComponent(c);
}

function renderComponent(c){
    const div = document.createElement('div');
    div.className = 'spice-node';
    div.id = c.id;
    div.style.left = c.x + 'px';
    div.style.top = c.y + 'px';

    div.innerHTML = ARCH[c.type].render(c) + `<div class="telemetry" id="tel_${c.id}">OFF</div>`;
    sandbox.appendChild(div);

    makeDraggable(div, c);
    setupPins(div, c);

    div.addEventListener('dblclick', () => openConfig(c));
}

function toggleFuente(id){
    const comp = components.find(c => c.id === id);
    if(!comp) return;
    comp.isOn = !comp.isOn;
    const btn = document.getElementById(`pwr_${id}`);
    if(comp.isOn){
        btn.innerText = "POWER: ON";
        btn.classList.add('on');
    } else {
        btn.innerText = "POWER: OFF";
        btn.classList.remove('on');
    }
    analizarCircuito();
}

function toggleDisyuntor(id){
    const comp = components.find(c => c.id === id);
    if(!comp) return;
    comp.closed = !comp.closed;
    
    const line = document.getElementById(`sw_${id}`);
    const stateText = document.getElementById(`state_${id}`);
    
    if(comp.closed){
        line.setAttribute('y2', '30');
        line.setAttribute('stroke', 'var(--green)');
        stateText.innerText = 'BREAKER IN';
    } else {
        line.setAttribute('y2', '12');
        line.setAttribute('stroke', 'var(--red)');
        stateText.innerText = 'BREAKER OUT';
    }
    analizarCircuito();
}

function setupPins(div, c){
    const pins = div.querySelectorAll('.net-pin');
    pins.forEach(pin => {
        pin.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!selectedPin){
                selectedPin = pin;
                selectedPin.style.transform = 'scale(1.3)';
            } else {
                if(selectedPin.id !== pin.id){
                    wires.push({ id: 'w_' + Date.now(), a: selectedPin.id, b: pin.id });
                    selectedPin.style.transform = 'scale(1)';
                    selectedPin = null;
                    drawWires();
                    analizarCircuito();
                } else {
                    selectedPin.style.transform = 'scale(1)';
                    selectedPin = null;
                }
            }
        });
    });
}

function drawWires(){
    wireLayer.innerHTML = '';
    document.querySelectorAll('.net-pin').forEach(p => p.classList.remove('connected'));

    wires.forEach(w => {
        const pinA = document.getElementById(w.a);
        const pinB = document.getElementById(w.b);
        if(!pinA || !pinB) return;

        pinA.classList.add('connected');
        pinB.classList.add('connected');

        const r1 = pinA.getBoundingClientRect();
        const r2 = pinB.getBoundingClientRect();
        const s = sandbox.getBoundingClientRect();

        const x1 = r1.left - s.left + 14;
        const y1 = r1.top - s.top + 14;
        const x2 = r2.left - s.left + 14;
        const y2 = r2.top - s.top + 14;

        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        const dx = Math.abs(x2 - x1) * 0.3;
        const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        
        path.setAttribute('d', d);
        path.setAttribute('class', 'wire');
        
        path.addEventListener('click', (e) => {
            e.stopPropagation();
            wires = wires.filter(item => item.id !== w.id);
            drawWires();
            analizarCircuito();
        });

        wireLayer.appendChild(path);
    });
}

function makeDraggable(div, obj){
    let dx = 0, dy = 0;
    div.addEventListener('pointerdown', (e) => {
        // Permitir clicks limpios en pines, selectores o botones de encendido
        if(e.target.classList.contains('net-pin') || e.target.classList.contains('pwr-btn') || e.target.closest('svg')) {
            return; 
        }
        
        dx = e.clientX - obj.x;
        dy = e.clientY - obj.y;
        div.setPointerCapture(e.pointerId);

        function move(ev){
            obj.x = ev.clientX - dx;
            obj.y = ev.clientY - dy;
            div.style.left = obj.x + 'px';
            div.style.top = obj.y + 'px';
            drawWires();
        }

        function up(){
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
        }
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
    });
}

// MOTOR SPICE REAL: Rastreo de mallas interconectadas por cables
function analizarCircuito(){
    // Resetear estados energizados
    components.forEach(c => c.powered = false);

    // Buscar si hay alguna fuente activa
    const fuentesActivas = components.filter(c => c.type === 'ac_power' && c.isOn);

    fuentesActivas.forEach(fuente => {
        // Encontrar todos los componentes accesibles desde esta fuente a través de los cables
        let visitados = new Set();
        let queue = [`pin_${fuente.id}_a`, `pin_${fuente.id}_b`];

        while(queue.length > 0) {
            let currPin = queue.shift();
            if(visitados.has(currPin)) continue;
            visitados.add(currPin);

            // Obtener el ID del componente dueño del pin
            let compId = currPin.split('_')[1] + '_' + currPin.split('_')[2];
            let comp = components.find(c => c.id === compId);

            if(comp) {
                // Si el componente es un disyuntor abierto, bloquea el paso por dentro de él
                if(comp.type === 'disyuntor' && !comp.closed) {
                    // No propaga hacia su otro pin
                } else {
                    // Propaga la energía a todos los pines del mismo componente
                    let todosLosPines = Array.from(document.querySelectorAll(`[id^="pin_${comp.id}_"]`)).map(p => p.id);
                    todosLosPines.forEach(p => {
                        if(!visitados.has(p)) {
                            // Encontrar cables conectados a este pin externo
                            wires.forEach(w => {
                                if(w.a === p) queue.push(w.b);
                                if(w.b === p) queue.push(w.a);
                            });
                        }
                    });
                }
            }
        }

        // Marcar componentes energizados si sus pines fueron alcanzados por la red de la fuente
        components.forEach(c => {
            let pinesComp = Array.from(document.querySelectorAll(`[id^="pin_${c.id}_"]`)).map(p => p.id);
            let alcanzado = pinesComp.some(p => visitados.has(p));
            if(alcanzado && (c.type !== 'ac_power')) {
                // Para que un componente consuma corriente AC real, debe estar tocado por la malla
                c.powered = true;
            }
        });
    });

    // Actualizar visualización en telemetrías
    components.forEach(c => {
        const tel = document.getElementById(`tel_${c.id}`);
        if(!tel) return;

        if(c.type === 'ac_power' && c.isOn) {
            tel.innerText = "LIVE SRC";
            tel.className = "telemetry on";
        } else if(c.powered) {
            tel.innerText = "ENERGIZED";
            tel.className = "telemetry on";
        } else {
            tel.innerText = "OFF";
            tel.className = "telemetry";
        }
    });
}

function openConfig(c){
    editingComponent = c;
    const modal = document.getElementById('editModal');
    const title = document.getElementById('modalTitle');
    const input = document.getElementById('paramInput');
    modal.style.display = 'flex';
    
    if(c.type === 'ac_power'){ title.innerText = "VAC Fuente"; input.value = c.v; }
    else if(c.type === 'resistor' || c.type === 'bombilla'){ title.innerText = "Ohms Ω"; input.value = c.r; }
    else if(c.type === 'capacitor'){ title.innerText = "uF Capacitor"; input.value = c.uf; }
    else if(c.type === 'transformador'){ title.innerText = "Ratio K"; input.value = c.ratio; }
    else { closeModal(); }
}

function saveParam(){
    if(!editingComponent) return;
    const inputVal = parseFloat(document.getElementById('paramInput').value);
    if(!isNaN(inputVal)){
        if(editingComponent.type === 'ac_power'){
            editingComponent.v = inputVal;
            document.getElementById(`val_${editingComponent.id}`).textContent = inputVal + " VAC";
        } else if(editingComponent.type === 'resistor' || editingComponent.type === 'bombilla'){
            editingComponent.r = inputVal;
            const el = document.getElementById(`val_${editingComponent.id}`);
            if(el) el.textContent = inputVal + " Ω";
        } else if(editingComponent.type === 'capacitor'){
            editingComponent.uf = inputVal;
            document.getElementById(`val_${editingComponent.id}`).textContent = inputVal + " uF";
        } else if(editingComponent.type === 'transformador'){
            editingComponent.ratio = inputVal;
            document.getElementById(`val_${editingComponent.id}`).textContent = "Ratio: " + inputVal;
        }
    }
    closeModal();
    analizarCircuito();
}

function closeModal(){
    document.getElementById('editModal').style.display = 'none';
    editingComponent = null;
}

function toggleScope(){
    scopeOn = !scopeOn;
    const btn = document.getElementById('scopeToggle');
    if(scopeOn){ btn.innerText = "OSCILOSCOPIO: ON"; btn.className = "scope-btn active"; }
    else { btn.innerText = "OSCILOSCOPIO: OFF"; btn.className = "scope-btn"; }
}

function updateScopeParams(){
    scopeVoltScale = parseFloat(document.getElementById('scopeVolt').value);
    scopeTimeScale = parseFloat(document.getElementById('scopeTime').value);
}

const canvas = document.getElementById('scope');
const ctx = canvas.getContext('2d');
function resizeScope(){ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
resizeScope();
window.addEventListener('resize', resizeScope);

let wave = [];

function renderScope(){
    requestAnimationFrame(renderScope);
    const w = canvas.width; const h = canvas.height;
    ctx.fillStyle = '#010a02'; ctx.fillRect(0,0,w,h);

    ctx.strokeStyle = '#05240a'; ctx.lineWidth = 1;
    for(let i=0; i<w; i+=30){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
    for(let j=0; j<h; j+=20){ ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }

    if(!scopeOn){
        ctx.fillStyle = '#ff073a'; ctx.font = '10px monospace';
        ctx.fillText('POWER OFF', w/2 - 25, h/2 + 4);
        return;
    }

    // El osciloscopio solo dibuja la onda si detecta que hay una fuente encendida en el sandbox
    let algunaFuenteOn = components.some(c => c.type === 'ac_power' && c.isOn);
    phase += scopeTimeScale;
    
    let amplitud = algunaFuenteOn ? (32 / scopeVoltScale) : 0; 
    let y = h/2 + Math.sin(phase) * amplitud;

    wave.push(y);
    if(wave.length > w) wave.shift();

    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 10; ctx.shadowColor = '#39ff14';
    ctx.beginPath();
    wave.forEach((v, i) => { if(i === 0) ctx.moveTo(i, v); else ctx.lineTo(i, v); });
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#39ff14'; ctx.font = '10px monospace';
    let fuente = components.find(c => c.type === 'ac_power' && c.isOn);
    ctx.fillText(`RMS: ${fuente ? fuente.v : 0}V | Freq: 60Hz`, 10, 15);
    
    animateComponents();
}

function animateComponents(){
    components.forEach(c => {
        if(c.type === 'motor_ac'){
            const fan = document.getElementById('fan_'+c.id);
            if(fan && c.powered){
                const rot = performance.now() * 0.4;
                fan.style.transform = `rotate(${rot}deg)`;
            }
        }
        if(c.type === 'bombilla'){
            const lamp = document.getElementById('lamp_'+c.id);
            if(lamp){
                if(c.powered){
                    const glow = 0.5 + Math.sin(phase * 2.5) * 0.5;
                    lamp.style.filter = `drop-shadow(0 0 ${10 + glow * 12}px #ffee00)`;
                    lamp.setAttribute('fill', `rgba(255,238,0,${0.4 + glow * 0.6})`);
                    lamp.setAttribute('stroke', '#ffcc00');
                } else {
                    lamp.style.filter = 'none';
                    lamp.setAttribute('fill', 'rgba(255,255,0,0.05)');
                    lamp.setAttribute('stroke', '#777');
                }
            }
        }
    });
}

renderScope();
</script>
