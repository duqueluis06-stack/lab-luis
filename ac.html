<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIMULADOR AC - EDICIÓN PROFESIONAL</title>

<style>
:root{
    --bg:#03050a;
    --panel:#081018;
    --cyan:#00f2fe;
    --green:#39ff14;
    --yellow:#ffee00;
    --orange:#ff7b00;
    --red:#ff073a;
    --border:#18263f;
    --text:#f1f5f9;
}

*{
    box-sizing:border-box;
    margin:0; padding:0;
    font-family:monospace;
    user-select:none;
    -webkit-user-select: none;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

header{
    height:45px;
    background:#050912;
    border-bottom:2px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
}

.title{
    color:var(--cyan);
    font-weight:bold;
    text-shadow:0 0 8px var(--cyan);
    font-size:11px;
}

.exit-btn{
    background:#14040a;
    color:var(--red);
    border:1px solid var(--red);
    padding:6px 12px;
    border-radius:5px;
    font-weight:bold;
    font-size:11px;
    cursor: pointer;
}

#viewport{
    flex:1;
    position:relative;
    overflow:hidden;
    background:#010204;
    touch-action: none;
}

#sandbox{
    position:absolute;
    width:2000px; height:2000px;
    background-image:
    linear-gradient(to right, rgba(0,242,254,0.02) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,242,254,0.02) 1px, transparent 1px);
    background-size:25px 25px;
}

#wire-layer{
    position:absolute;
    width:100%; height:100%;
    pointer-events: auto;
}

.wire{
    stroke:var(--cyan);
    stroke-width:5;
    fill:none;
    cursor: pointer;
    filter:drop-shadow(0 0 4px var(--cyan));
    pointer-events: stroke;
}

.toolbox{
    background:#071018;
    border-top:2px solid var(--border);
    padding:8px;
}

.row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling: touch;
}

.btn{
    background:#02050a;
    border:1px solid var(--border);
    color:white;
    padding:8px 14px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
    flex-shrink:0;
}

.spice-node{
    position:absolute;
    z-index:50;
    touch-action: none;
    padding:25px 10px 10px 10px;
}

.comp-body{
    position:relative;
    background: rgba(8, 16, 24, 0.95);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    transition: transform 0.2s ease;
}

/* MINI BOTONES DE ACCIÓN RÁPIDA */
.action-bar {
    position: absolute;
    top: -2px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    z-index: 80;
}

.mini-btn {
    background: #02050a;
    border: 1px solid var(--border);
    color: #fff;
    font-size: 10px;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
.mini-btn.del { color: var(--red); border-color: var(--red); }
.mini-btn.rot { color: var(--cyan); border-color: var(--cyan); }
.mini-btn.cfg { color: var(--yellow); border-color: var(--yellow); }

.net-pin{
    position:absolute;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 90;
    cursor: pointer;
}

.net-pin::after{
    content:'';
    width:14px; height:14px;
    border-radius:50%;
    border:2px solid #556b82;
    background:#091018;
}

.net-pin.connected::after{
    border-color: var(--cyan);
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
}

.pwr-btn {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #200505;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 8px;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 3px;
    cursor: pointer;
    z-index: 75;
}
.pwr-btn.on {
    background: #05200b;
    border: 1px solid var(--green);
    color: var(--green);
    box-shadow: 0 0 5px var(--green);
}

.telemetry{
    background:rgba(0,0,0,0.9);
    border:1px solid var(--border);
    margin-top:22px;
    padding:4px;
    border-radius:4px;
    text-align:center;
    color:#556b82;
    font-size:9px;
    font-weight: bold;
}
.telemetry.on{
    color: var(--green);
    text-shadow: 0 0 4px var(--green);
    border-color: var(--green);
}

.scope-panel{
    background:#040910;
    border-top:2px solid var(--border);
    padding:8px;
    display: flex;
    flex-direction: column;
    gap:6px;
}

.scope-box{
    border: 2px solid #102e15;
    border-radius: 5px;
    overflow: hidden;
}

canvas{
    width:100%; height:90px;
    display:block;
    background:#000d02;
}

.modal {
    display: none;
    position: fixed;
    z-index: 500;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.85);
    align-items: center; justify-content: center;
}
.modal-content {
    background: var(--panel);
    border: 2px solid var(--cyan);
    padding: 20px;
    border-radius: 8px;
    width: 280px;
}
.modal-content input {
    width: 100%; padding: 10px;
    background: #02050a;
    border: 1px solid var(--border);
    color: white; margin: 15px 0;
    text-align: center; font-size:16px;
}
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex:1; padding:10px; font-weight:bold; border-radius:4px; border:none; }
</style>
</head>
<body>

<header>
<div class="title">⚡ TRUE-SPICE AC ENGINE v2.8</div>
<button class="exit-btn" onclick="volverDC()">🚪 VOLVER DC</button>
</header>

<div id="viewport">
<div id="sandbox">
<svg id="wire-layer"></svg>
</div>
</div>

<div class="toolbox">
<div class="row">
<button class="btn" onclick="addComponent('ac_power')">⚡ FUENTE AC</button>
<button class="btn" onclick="addComponent('disyuntor')">🔌 DISYUNTOR</button>
<button class="btn" onclick="addComponent('motor_ac')">🌀 MOTOR AC</button>
<button class="btn" onclick="addComponent('resistor')">🟫 RESISTENCIA</button>
<button class="btn" onclick="addComponent('bombilla')">💡 BOMBILLA</button>
</div>
</div>

<div class="scope-panel">
<div class="scope-box"><canvas id="scope"></canvas></div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="text-align:center;">Editar Valor</h3>
        <input type="number" id="paramInput" step="any">
        <div class="modal-actions">
            <button style="background:var(--green); color:black;" onclick="saveParam()">GUARDAR</button>
            <button style="background:var(--red); color:white;" onclick="closeModal()">VOLVER</button>
        </div>
    </div>
</div>

<script>
function volverDC(){ window.location.href = 'index.html'; }

const sandbox = document.getElementById('sandbox');
const wireLayer = document.getElementById('wire-layer');

let components = [];
let wires = [];
let selectedPin = null;
let globalId = 0;
let phase = 0;
let editingComponent = null;

const ARCH = {
ac_power:{
render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="100" height="60" viewBox="0 0 100 60">
<rect x="10" y="5" width="80" height="50" rx="8" fill="#071018" stroke="var(--cyan)" stroke-width="2"/>
<path d="M25 30 Q37 10 50 30 Q62 50 75 30" stroke="var(--cyan)" stroke-width="3" fill="none"/>
<text x="50" y="48" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.v} VAC</text>
</svg>
<button class="pwr-btn ${n.isOn ? 'on' : ''}" id="pwr_${n.id}" onclick="toggleFuente(event, '${n.id}')">${n.isOn ? 'POWER: ON' : 'POWER: OFF'}</button>
<div class="net-pin" id="pin_${n.id}_a" style="left:-15px; top:20px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-15px; top:20px"></div>
</div>`
},
disyuntor:{
render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg); padding-bottom:10px;">
<svg width="90" height="55" viewBox="0 0 90 55" style="cursor:pointer;" onclick="toggleDisyuntor(event, '${n.id}')">
<rect x="10" y="5" width="70" height="45" rx="4" fill="#0b1521" stroke="#4b6b94" stroke-width="2"/>
<line x1="10" y1="27" x2="30" y2="27" stroke="#fff" stroke-width="3"/>
<line x1="60" y1="27" x2="80" y2="27" stroke="#fff" stroke-width="3"/>
<line id="sw_${n.id}" x1="30" y1="27" x2="58" y2="${n.closed ? '27':'10'}" stroke="${n.closed ? 'var(--green)':'var(--red)'}" stroke-width="4"/>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-15px; top:16px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-15px; top:16px"></div>
</div>`
},
motor_ac:{
render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="80" height="80" viewBox="0 0 80 80">
<circle cx="40" cy="40" r="28" fill="#08131f" stroke="var(--cyan)" stroke-width="2"/>
<g id="fan_${n.id}" style="transform-origin:40px 40px;">
<path d="M40 40 L40 15 Q50 22 45 32 Z" fill="var(--cyan)"/>
<path d="M40 40 L65 40 Q58 50 48 45 Z" fill="var(--cyan)"/>
<path d="M40 40 L40 65 Q30 58 35 48 Z" fill="var(--cyan)"/>
<path d="M40 40 L15 40 Q22 30 32 35 Z" fill="var(--cyan)"/>
</g>
<circle cx="40" cy="40" r="5" fill="#fff"/>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-15px; top:25px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-15px; top:25px"></div>
</div>`
},
resistor:{
render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="80" height="30">
<rect x="15" y="6" width="50" height="18" rx="4" fill="#4a3200" stroke="var(--yellow)" stroke-width="1.5"/>
<path d="M20 15 L25 9 L32 21 L39 9 L46 21 L53 9 L60 15" fill="none" stroke="orange" stroke-width="2"/>
<text x="40" y="34" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.r} Ω</text>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-15px; top:2px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-15px; top:2px"></div>
</div>`
},
bombilla:{
render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="70" height="60">
<circle id="lamp_${n.id}" cx="35" cy="22" r="16" fill="rgba(255,255,0,0.05)" stroke="#777" stroke-width="2"/>
<path d="M30 26 L33 18 L37 18 L40 26" fill="none" stroke="#fff" stroke-width="1"/>
<rect x="29" y="38" width="12" height="8" fill="#555"/>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-15px; top:18px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-15px; top:18px"></div>
</div>`
}
};

function addComponent(type){
    globalId++;
    const c = {
        id: type + '_' + globalId,
        type, x: 50, y: 60,
        v: 220, r: 100, rotation: 0,
        closed: false, isOn: false, powered: false
    };
    components.push(c);
    renderComponent(c);
}

function renderComponent(c){
    const div = document.createElement('div');
    div.className = 'spice-node';
    div.id = c.id;
    div.style.left = c.x + 'px';
    div.style.top = c.y + 'px';

    // Inyectar barra de herramientas y cuerpo gráfico
    div.innerHTML = `
        <div class="action-bar">
            <div class="mini-btn rot" onclick="rotarComponente(event, '${c.id}')">🔄</div>
            <div class="mini-btn cfg" onclick="configComponente(event, '${c.id}')">⚙️</div>
            <div class="mini-btn del" onclick="eliminarComponente(event, '${c.id}')">🗑️</div>
        </div>
        ${ARCH[c.type].render(c)}
        <div class="telemetry" id="tel_${c.id}">OFF</div>
    `;

    sandbox.appendChild(div);
    makeDraggable(div, c);
    setupPins(div, c);
}

function rotarComponente(e, id){
    e.stopPropagation();
    const c = components.find(item => item.id === id);
    if(!c) return;
    c.rotation = (c.rotation + 90) % 360;
    document.getElementById(`body_${id}`).style.transform = `rotate(${c.rotation}deg)`;
    drawWires();
}

function configComponente(e, id){
    e.stopPropagation();
    const c = components.find(item => item.id === id);
    if(!c) return;
    editingComponent = c;
    
    const modal = document.getElementById('editModal');
    const title = document.getElementById('modalTitle');
    const input = document.getElementById('paramInput');
    modal.style.display = 'flex';
    
    if(c.type === 'ac_power'){ title.innerText = "VAC Fuente"; input.value = c.v; }
    else if(c.type === 'resistor' || c.type === 'bombilla'){ title.innerText = "Ohms Ω"; input.value = c.r; }
    else { closeModal(); }
}

function saveParam(){
    if(!editingComponent) return;
    const val = parseFloat(document.getElementById('paramInput').value);
    if(!isNaN(val)){
        if(editingComponent.type === 'ac_power'){
            editingComponent.v = val;
            document.getElementById(`val_${editingComponent.id}`).textContent = val + " VAC";
        } else if(editingComponent.type === 'resistor' || editingComponent.type === 'bombilla'){
            editingComponent.r = val;
            const el = document.getElementById(`val_${editingComponent.id}`);
            if(el) el.textContent = val + " Ω";
        }
    }
    closeModal();
    analizarCircuito();
}

function closeModal(){
    document.getElementById('editModal').style.display = 'none';
    editingComponent = null;
}

function eliminarComponente(e, id){
    e.stopPropagation();
    // Limpiar cables del componente caído
    wires = wires.filter(w => !w.a.includes(id) && !w.b.includes(id));
    // Quitar del DOM
    document.getElementById(id).remove();
    // Quitar del array lógico
    components = components.filter(c => c.id !== id);
    drawWires();
    analizarCircuito();
}

function toggleFuente(e, id){
    e.stopPropagation();
    const comp = components.find(c => c.id === id);
    if(!comp) return;
    comp.isOn = !comp.isOn;
    const btn = document.getElementById(`pwr_${id}`);
    if(comp.isOn){
        btn.innerText = "POWER: ON"; btn.classList.add('on');
    } else {
        btn.innerText = "POWER: OFF"; btn.classList.remove('on');
    }
    analizarCircuito();
}

function toggleDisyuntor(e, id){
    e.stopPropagation();
    const comp = components.find(c => c.id === id);
    if(!comp) return;
    comp.closed = !comp.closed;
    
    const line = document.getElementById(`sw_${id}`);
    if(comp.closed){
        line.setAttribute('y2', '27'); line.setAttribute('stroke', 'var(--green)');
    } else {
        line.setAttribute('y2', '10'); line.setAttribute('stroke', 'var(--red)');
    }
    analizarCircuito();
}

function setupPins(div, c){
    const pins = div.querySelectorAll('.net-pin');
    pins.forEach(pin => {
        pin.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!selectedPin){
                selectedPin = pin;
                selectedPin.style.transform = 'scale(1.4)';
            } else {
                if(selectedPin.id !== pin.id){
                    wires.push({ id: 'w_' + Date.now(), a: selectedPin.id, b: pin.id });
                    selectedPin.style.transform = 'scale(1)';
                    selectedPin = null;
                    drawWires();
                    analizarCircuito();
                } else {
                    selectedPin.style.transform = 'scale(1)';
                    selectedPin = null;
                }
            }
        });
    });
}

function drawWires(){
    wireLayer.innerHTML = '';
    document.querySelectorAll('.net-pin').forEach(p => p.classList.remove('connected'));

    wires.forEach(w => {
        const pinA = document.getElementById(w.a);
        const pinB = document.getElementById(w.b);
        if(!pinA || !pinB) return;

        pinA.classList.add('connected');
        pinB.classList.add('connected');

        const r1 = pinA.getBoundingClientRect();
        const r2 = pinB.getBoundingClientRect();
        const s = sandbox.getBoundingClientRect();

        const x1 = r1.left - s.left + 15;
        const y1 = r1.top - s.top + 15;
        const x2 = r2.left - s.left + 15;
        const y2 = r2.top - s.top + 15;

        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        const dx = Math.abs(x2 - x1) * 0.4;
        const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        
        path.setAttribute('d', d);
        path.setAttribute('class', 'wire');
        
        path.addEventListener('click', (e) => {
            e.stopPropagation();
            wires = wires.filter(item => item.id !== w.id);
            drawWires();
            analizarCircuito();
        });
        wireLayer.appendChild(path);
    });
}

function makeDraggable(div, obj){
    let dx = 0, dy = 0;
    div.addEventListener('pointerdown', (e) => {
        if(e.target.classList.contains('net-pin') || 
           e.target.classList.contains('pwr-btn') || 
           e.target.classList.contains('mini-btn') ||
           e.target.closest('svg')) {
            return; 
        }
        
        dx = e.clientX - obj.x;
        dy = e.clientY - obj.y;
        div.setPointerCapture(e.pointerId);

        function move(ev){
            obj.x = ev.clientX - dx;
            obj.y = ev.clientY - dy;
            div.style.left = obj.x + 'px';
            div.style.top = obj.y + 'px';
            drawWires();
        }

        function up(){
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
        }
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
    });
}

// MOTOR DE DETECCIÓN AC OPTIMIZADO PARA MÓVIL
function analizarCircuito(){
    components.forEach(c => c.powered = false);

    const fuentesActivas = components.filter(c => c.type === 'ac_power' && c.isOn);
    
    // Verificamos si los disyuntores intermedios están cerrados
    let disyuntoresAbiertos = components.filter(c => c.type === 'disyuntor' && !c.closed).map(c => c.id);

    fuentesActivas.forEach(fuente => {
        let nodosActivos = new Set();
        let queue = [`pin_${fuente.id}_a`, `pin_${fuente.id}_b`];

        while(queue.length > 0){
            let pinActual = queue.shift();
            if(nodosActivos.has(pinActual)) continue;
            nodosActivos.add(pinActual);

            let tokens = pinActual.split('_');
            let compId = tokens[1] + '_' + tokens[2];

            // Si pasa por un disyuntor abierto, se frena esa rama
            if(disyuntoresAbiertos.includes(compId)) continue;

            // Propagar a pines vecinos mediante cables
            wires.forEach(w => {
                if(w.a === pinActual) queue.push(w.b);
                if(w.b === pinActual) queue.push(w.a);
            });

            // Propagar internamente a través de los pines del mismo componente
            let pinesDelComp = Array.from(document.querySelectorAll(`[id^="pin_${compId}_"]`)).map(p => p.id);
            pinesDelComp.forEach(p => {
                if(!nodosActivos.has(p)) queue.push(p);
            });
        }

        // Si el pin de cualquier componente fue tocado por la red de la fuente, ¡ENCIENDE!
        components.forEach(c => {
            if(c.type !== 'ac_power'){
                let pines = Array.from(document.querySelectorAll(`[id^="pin_${c.id}_"]`)).map(p => p.id);
                if(pines.some(p => nodosActivos.has(p))) {
                    c.powered = true;
                }
            }
        });
    });

    // Pintar telemetrías
    components.forEach(c => {
        const tel = document.getElementById(`tel_${c.id}`);
        if(!tel) return;
        if(c.type === 'ac_power' && c.isOn){ tel.innerText = "LIVE SRC"; tel.className = "telemetry on"; }
        else if(c.powered){ tel.innerText = "ENERGIZED"; tel.className = "telemetry on"; }
        else { tel.innerText = "OFF"; tel.className = "telemetry"; }
    });
}

// OSCILOSCOPIO Y ANIMACIONES
const canvas = document.getElementById('scope');
const ctx = canvas.getContext('2d');
let wave = [];
canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;

function renderScope(){
    requestAnimationFrame(renderScope);
    const w = canvas.width; const h = canvas.height;
    ctx.fillStyle = '#010a02'; ctx.fillRect(0,0,w,h);

    let fuenteOn = components.some(c => c.type === 'ac_power' && c.isOn);
    phase += 0.06;
    let amplitud = fuenteOn ? 30 : 0;
    let y = h/2 + Math.sin(phase) * amplitud;

    wave.push(y);
    if(wave.length > w) wave.shift();

    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 2;
    ctx.beginPath();
    wave.forEach((v, i) => { if(i === 0) ctx.moveTo(i, v); else ctx.lineTo(i, v); });
    ctx.stroke();

    // Animaciones de componentes en tiempo real
    components.forEach(c => {
        if(c.type === 'motor_ac'){
            const fan = document.getElementById('fan_'+c.id);
            if(fan && c.powered) fan.style.transform = `rotate(${performance.now() * 0.5}deg)`;
        }
        if(c.type === 'bombilla'){
            const lamp = document.getElementById('lamp_'+c.id);
            if(lamp){
                if(c.powered){
                    let glow = 0.4 + (Math.sin(phase * 2) * 0.4);
                    lamp.setAttribute('fill', `rgba(255,238,0,${glow})`);
                    lamp.style.filter = "drop-shadow(0 0 8px #ffea00)";
                } else {
                    lamp.setAttribute('fill', 'rgba(255,255,0,0.05)');
                    lamp.style.filter = "none";
                }
            }
        }
    });
}
renderScope();
</script>
