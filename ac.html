<html lang="es">

    <meta property="og:title" content="⚡ TRUE-SPICE AC ENGINE v4.0 - DuqueMartini">

    <meta property="og:type" content="website">

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-MB642KNJ');

    <style>
        :root{
            --bg:#020408;
            --panel:#080c16;
            --cyan:#00f2fe;
            --green:#39ff14;
            --yellow:#ffee00;
            --orange:#ff7b00;
            --red:#ff073a;
            --border:#161f3d;
            --text:#f1f5f9;
        }

        *{
            box-sizing:border-box; margin:0; padding:0;
            font-family:monospace; user-select:none;
            -webkit-user-select: none;
        }

        body{
            background:var(--bg); color:var(--text);
            height:100vh; height:100dvh; overflow:hidden;
            display:flex; flex-direction:column;
            padding-top: env(safe-area-inset-top, 0px);
        }

        header{
            height:54px; background:#080c16;
            border-bottom:2px solid var(--border);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 8px; flex-shrink: 0; z-index: 1000;
        }

        .airport-ticker { display: flex; gap: 1px; }
        .airport-char {
            background: #111; color: var(--cyan); font-weight: bold; font-size: 11px;
            padding: 3px 5px; border-radius: 2px; border: 1px solid #1f2d5a;
            text-shadow: 0 0 3px var(--cyan);
        }

        .header-controls { display: flex; align-items: center; gap: 6px; }

        .exit-btn{
            background:#110307; border: 1.5px solid var(--red); color:var(--red); 
            cursor: pointer; text-shadow: 0 0 3px var(--red);
            height: 40px; min-width: 58px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; border-radius: 5px;
        }
        .exit-btn .exit-icon { font-size: 13px; }
        .exit-btn span { font-size: 8px; color: #7284b0; font-weight: bold; margin-top: 1px; }

        #viewport{
            flex:1; position:relative; overflow:hidden;
            background:#010204; touch-action: none;
            border-bottom: 2px solid var(--border);
        }

        #sandbox{
            position:absolute; width:2000px; height:2000px;
            background-image:
            linear-gradient(to right, rgba(0,242,254,0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0,242,254,0.02) 1px, transparent 1px);
            background-size:20px 20px;
        }

        #wire-layer{
            position:absolute; width:100%; height:100%;
            pointer-events: auto; z-index: 10;
        }

        .wire{
            stroke:var(--cyan); stroke-width:5; fill:none; cursor: pointer;
            filter:drop-shadow(0 0 3px var(--cyan)); pointer-events: stroke;
        }
        .wire:hover{ stroke: var(--red); stroke-width:7; filter:drop-shadow(0 0 5px var(--red)); }

        .toolbox{ background:#080c16; border-bottom:2px solid var(--border); padding:6px 10px; flex-shrink:0; }
        .platform-label { font-size: 10px; font-weight: bold; color: var(--yellow); margin-bottom: 4px; letter-spacing: 0.5px; }
        .row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling: touch; }
        .btn{
            background:#050711; border:1px solid var(--border); color:white;
            padding:8px 12px; border-radius:4px; font-size:10px; font-weight:bold; flex-shrink:0;
        }

        .spice-node{
            position:absolute; z-index:50; touch-action: none;
            padding:22px 14px 14px 14px; cursor: move;
        }

        .comp-body{
            position:relative; background: rgba(8, 12, 22, 0.96);
            border: 2px solid var(--border); border-radius: 8px; padding: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .action-bar {
            position: absolute; top: 1px; left: 14px; right: 14px;
            display: flex; justify-content: space-between; z-index: 120;
        }

        .mini-btn {
            background: #02050a; border: 1px solid var(--border); color: #fff;
            font-size: 9px; width: 22px; height: 18px; border-radius: 3px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .mini-btn.del { color: var(--red); border-color: var(--red); }
        .mini-btn.rot { color: var(--cyan); border-color: var(--cyan); }
        .mini-btn.cfg { color: var(--yellow); border-color: var(--yellow); }

        .net-pin{
            position:absolute; width:32px; height:32px;
            display:flex; align-items:center; justify-content:center; z-index: 110; cursor: pointer;
        }
        .net-pin::after{
            content:''; width:12px; height:12px; border-radius:50%;
            border:2px solid #556b82; background:#091018; transition: transform 0.12s;
        }
        .net-pin.connected::after{
            border-color: var(--cyan); background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
        }

        .pwr-btn {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            background: #200505; border: 1px solid var(--red); color: var(--red);
            font-size: 8px; font-weight: bold; padding: 3px 6px; border-radius: 3px; cursor: pointer; z-index: 95;
        }
        .pwr-btn.on { background: #05200b; border: 1px solid var(--green); color: var(--green); box-shadow: 0 0 5px var(--green); }

        .telemetry{
            background:rgba(0,0,0,0.95); border:1px solid var(--border); margin-top:22px;
            padding:3px; border-radius:4px; text-align:center; color:#556b82; font-size:8.5px; font-weight: bold;
            white-space: pre-line; line-height: 11px;
        }
        .telemetry.on{ color: var(--green); text-shadow: 0 0 3px var(--green); border-color: var(--green); }
        .telemetry.burn{ color: var(--red); text-shadow: 0 0 5px var(--red); border-color: var(--red); animation: blink 0.5s infinite alternate; }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

        .scope-panel{ background:#010204; padding:4px; display: flex; flex-direction: column; gap:4px; flex-shrink: 0; height: 135px; }
        .scope-container-layout { display: flex; flex: 1; gap: 4px; overflow: hidden; }
        .scope-controls{ display: flex; justify-content: space-between; align-items: center; gap: 10px; background: rgba(9, 12, 26, 0.9); border: 1.5px solid var(--border); padding: 4px; border-radius: 4px 4px 0 0;}
        .scope-btn{ padding: 4px 8px; font-size: 10px; background: #22050b; border: 1px solid var(--red); color: #ff9999; border-radius: 4px; font-weight: bold; }
        .scope-btn.active{ background: #05220b; border: 1px solid var(--green); color: #99ff99; }
        .knob-container{ display: flex; gap: 10px; align-items: center; }
        .knob-label{ font-size: 10px; color: #8fa0b3; }
        .knob-label select{ background: #02050a; color: var(--cyan); border: 1px solid var(--border); font-size: 10px; padding: 2px; border-radius: 3px; margin-left: 2px; }
        .scope-box{ border: 1.5px solid #143d1a; border-radius: 0 0 4px 4px; overflow: hidden; position: relative; background: #000502; flex:2;}
        
        /* DISEÑO MONITOR SERIE COMPACTO */
        .serial-box {
            flex: 1; border: 1.5px solid #1e2d5a; background: #020612;
            border-radius: 0 0 4px 4px; padding: 4px; font-size: 8.5px;
            color: var(--cyan); overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
            box-shadow: inset 0 0 8px rgba(0,242,254,0.1);
        }
        .serial-line { border-bottom: 1px solid rgba(22,31,61,0.5); padding-bottom: 1px; color: #7284b0; }
        .serial-line.active { color: var(--green); text-shadow: 0 0 2px var(--green); }

        canvas{ width:100%; height:100%; display:block; }

        .ios-safe-buffer-grid {
            height: calc(16px + env(safe-area-inset-bottom, 0px));
            background-color: #030611; border-top: 1px dashed #1e2d5a;
            width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .buffer-status-line { font-size: 8px; color: #2e437e; letter-spacing: 1px; font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); border: 2px solid var(--cyan); padding: 20px; border-radius: 8px; width: 280px; text-align: center; box-shadow: 0 0 15px var(--cyan); }
        .modal-content input { width: 100%; padding: 8px; background: #02050a; border: 1px solid var(--border); color: white; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 14px;}
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 8px; font-weight: bold; border-radius: 4px; border: none; }

        @media (max-width: 768px) {
            .spice-node {
                transform: scale(0.82);
            }
        }
    </style>
</head>
<body>

<header>
    <div class="airport-ticker" id="headerTicker"></div>
    <div class="header-controls">
        <button class="exit-btn" onpointerdown="window.location.href='simulador-electronica.html';">
            <div class="exit-icon">🚪</div>
            <span>Volver</span>

    </div>
</header>

</div>

        <button class="btn" style="border-color: var(--yellow);" onclick="addComponent('bombilla')">💡 FOCO</button>

</div>

<div class="scope-panel">
    <div class="scope-controls">
        <button id="scopeToggle" class="scope-btn active" onclick="toggleScope()">OSCILOSCOPIO Y SERIAL</button>
        <div class="knob-container">
            <label class="knob-label">V/DIV:
                <select id="scopeVolt" onchange="updateScopeParams()">
                    <option value="0.5">0.5V</option>

                </select>
            </label>
        </div>
    </div>
    <div class="scope-container-layout">
        <div class="scope-box"><canvas id="scope"></canvas></div>
        <div class="serial-box" id="serial-monitor">
            <div class="serial-line">> TRUE-SPICE TELEMETRY READY...</div>
        </div>
    </div>
</div>

<div class="ios-safe-buffer-grid">
    <div class="buffer-status-line">✦ ENGINE MOBILE LAB v4.0 ✦</div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="color:var(--cyan); margin-bottom:10px; font-size:14px;">Editar Parámetro</h3>
        <input type="number" id="paramInput" step="any">
        <div class="modal-actions">
            <button style="background:var(--green); color:black;" onclick="saveParam()">GUARDAR</button>
            <button style="background:var(--red); color:white;" onclick="closeModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>

const wireLayer = document.getElementById('wire-layer');

let components = [];
let wires = [];
let selectedPin = null;
let globalId = 0;
let phase = 0;

let scopeOn = true;
let scopeVoltScale = 1;
let scopeTimeScale = 0.06;
let editingComponent = null;

function initAirportTicker() {
    const txt = "SPICE.AC";
    const container = document.getElementById('headerTicker');
    container.innerHTML = '';
    [...txt].forEach((char) => {
        let div = document.createElement('div');
        div.className = 'airport-char'; div.innerText = char;
        container.appendChild(div);
    });
}

const ARCH = {

</svg>
<button class="pwr-btn ${n.isOn ? 'on' : ''}" id="pwr_${n.id}" onpointerdown="toggleFuente(event, '${n.id}')">${n.isOn ? 'POWER: ON' : 'POWER: OFF'}</button>
<div class="net-pin" id="pin_${n.id}_a" style="left:-16px; top:18px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-16px; top:18px"></div>

},

render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg); padding-bottom:10px;">

<rect x="10" y="5" width="70" height="45" rx="4" fill="#0b1521" stroke="#4b6b94" stroke-width="2"/>
<line x1="10" y1="27" x2="30" y2="27" stroke="#fff" stroke-width="3"/>

</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-16px; top:13px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-16px; top:13px"></div>
</div>`
},

render:(n)=>`
<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="130" height="80" viewBox="0 0 130 80">
<rect x="56" y="10" width="18" height="60" fill="#223147"/>
${Array.from({length:5},(_,i)=>`<circle cx="35" cy="${18+i*11}" r="6" fill="none" stroke="var(--orange)" stroke-width="2.5"/>`).join('')}
${Array.from({length:5},(_,i)=>`<circle cx="95" cy="${18+i*11}" r="6" fill="none" stroke="var(--yellow)" stroke-width="2.5"/>`).join('')}
<text x="65" y="5" fill="#8fa0b3" font-size="8" text-anchor="middle" id="val_${n.id}">Ratio: ${n.ratio}</text>
</svg>
<div class="net-pin" id="pin_${n.id}_p1" style="left:-16px; top:11px"></div>
<div class="net-pin" id="pin_${n.id}_p2" style="left:-16px; top:44px"></div>
<div class="net-pin" id="pin_${n.id}_s1" style="right:-16px; top:11px"></div>
<div class="net-pin" id="pin_${n.id}_s2" style="right:-16px; top:44px"></div>
</div>`
},

<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="80" height="80" viewBox="0 0 80 80">
<circle cx="40" cy="40" r="28" fill="#08131f" stroke="var(--cyan)" stroke-width="2"/>

<path d="M40 40 L40 15 Q50 22 45 32 Z" fill="var(--cyan)"/>

</g>

<line x1="44" y1="10" x2="44" y2="26" stroke="#fff" stroke-width="2.5"/>
<text x="40" y="42" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.uf} nF</text>
</svg>
<div class="net-pin" id="pin_${n.id}_a" style="left:-16px; top:8px"></div>
<div class="net-pin" id="pin_${n.id}_b" style="right:-16px; top:8px"></div>
</div>`
},

<div class="comp-body" id="body_${n.id}" style="transform: rotate(${n.rotation}deg);">
<svg width="80" height="35">

<text x="40" y="34" fill="#fff" font-size="9" text-anchor="middle" id="val_${n.id}">${n.r} Ω</text>
</svg>

render:(n)=>`

<rect x="29" y="38" width="12" height="8" fill="#555"/>
</svg>

<div class="net-pin" id="pin_${n.id}_a" style="left:-16px; top:16px"></div>

};

function guardarCircuito(){
    const data = { components, wires, globalId };
    localStorage.setItem('TRUESPICE_AC_SAVE_V40', JSON.stringify(data));
}

function cargarCircuito(){
    const saved = localStorage.getItem('TRUESPICE_AC_SAVE_V40');
    if(!saved) return;
    try {
        const data = JSON.parse(saved);
        globalId = data.globalId || 0;
        components = data.components || [];
        wires = data.wires || [];
        components.forEach(c => renderComponent(c));
        drawWires(); analizarCircuito();
    } catch(err) { console.error(err); }
}

function addComponent(type){
    globalId++;
    const c = {
        id:type+'_'+globalId, type, x: 80, y: 80,
        v: 220, r: 100, uf: 100, ratio: 0.5, w_nom: 60, max_rpm: 3000, rotation: 0,
        closed: false, isOn: false, powered: false, burned: false, heatTimer: 0, current_rpm: 0
    };
    components.push(c); renderComponent(c); analizarCircuito(); guardarCircuito();
}

function renderComponent(c){
    const viejo = document.getElementById(c.id); if(viejo) viejo.remove();
    const div = document.createElement('div');
    div.className = 'spice-node'; div.id = c.id;
    div.style.left = c.x + 'px'; div.style.top = c.y + 'px';

    div.innerHTML = `
        <div class="action-bar">
            <div class="mini-btn rot" onpointerdown="rotarComponente(event, '${c.id}')">🔄</div>
            <div class="mini-btn cfg" onpointerdown="configComponente(event, '${c.id}')">⚙️</div>
            <div class="mini-btn del" onpointerdown="eliminarComponente(event, '${c.id}')">🗑️</div>
        </div>
        ${ARCH[c.type].render(c)}
        <div class="telemetry" id="tel_${c.id}">OFF</div>
    `;
    sandbox.appendChild(div);
    makeDraggable(div, c);
    setupPins(div, c);
}

function rotarComponente(e, id){
    e.stopPropagation(); e.preventDefault();
    const c = components.find(item => item.id === id); if(!c) return;
    c.rotation = (c.rotation + 90) % 360;
    document.getElementById(`body_${id}`).style.transform = `rotate(${c.rotation}deg)`;
    drawWires(); guardarCircuito();
}

function configComponente(e, id){
    e.stopPropagation(); e.preventDefault();
    const c = components.find(item => item.id === id); if(!c) return;
    editingComponent = c;
    const modal = document.getElementById('editModal');
    const title = document.getElementById('modalTitle');
    const input = document.getElementById('paramInput');
    modal.style.display = 'flex';
    
    if(c.type === 'ac_power'){ title.innerText = "VAC Fuente"; input.value = c.v; }
    else if(c.type === 'resistor'){ title.innerText = "Ohms Ω Resistencia"; input.value = c.r; }
    else if(c.type === 'bombilla'){ title.innerText = "Watts W de Potencia"; input.value = c.w_nom; }
    else if(c.type === 'motor_ac'){ title.innerText = "RPM Máximas del Motor"; input.value = c.max_rpm; }
    else if(c.type === 'capacitor_cer'){ title.innerText = "Nanofaradios nF (Capacitor Cerámico)"; input.value = c.uf; }
    else if(c.type === 'transformador'){ title.innerText = "Ratio (Vout/Vin)"; input.value = c.ratio; }
}

function saveParam(){
    if(!editingComponent) return;
    const val = parseFloat(document.getElementById('paramInput').value);
    if(!isNaN(val)){
        if(editingComponent.type === 'ac_power'){ editingComponent.v = val; document.getElementById(`val_${editingComponent.id}`).textContent = val + " VAC"; }
        else if(editingComponent.type === 'resistor'){ editingComponent.r = val; document.getElementById(`val_${editingComponent.id}`).textContent = val + " Ω"; }
        else if(editingComponent.type === 'bombilla'){ editingComponent.w_nom = val; document.getElementById(`val_${editingComponent.id}`).textContent = val + " W"; }
        else if(editingComponent.type === 'motor_ac'){ editingComponent.max_rpm = val; document.getElementById(`val_${editingComponent.id}`).textContent = val + " RPM Max"; }
        else if(editingComponent.type === 'capacitor_cer'){ editingComponent.uf = val; document.getElementById(`val_${editingComponent.id}`).textContent = val + " nF"; }
        else if(editingComponent.type === 'transformador'){ editingComponent.ratio = val; document.getElementById(`val_${editingComponent.id}`).textContent = "Ratio: " + val; }
    }
    closeModal(); analizarCircuito(); guardarCircuito();
}

function closeModal(){ document.getElementById('editModal').style.display = 'none'; editingComponent = null; }

function eliminarComponente(e, id){
    e.stopPropagation(); e.preventDefault();
    wires = wires.filter(w => !w.a.includes(id) && !w.b.includes(id));
    document.getElementById(id).remove();
    components = components.filter(c => c.id !== id);
    drawWires(); analizarCircuito(); guardarCircuito();
}

function toggleFuente(e, id){
    e.stopPropagation(); e.preventDefault();
    const comp = components.find(c => c.id === id); if(!comp || comp.burned) return;
    comp.isOn = !comp.isOn;
    const btn = document.getElementById(`pwr_${id}`);
    if(comp.isOn){ btn.innerText = "POWER: ON"; btn.classList.add('on'); } 
    else { btn.innerText = "POWER: OFF"; btn.classList.remove('on'); }
    analizarCircuito();
}

function toggleDisyuntor(e, id){
    e.stopPropagation(); e.preventDefault();
    const comp = components.find(c => c.id === id); if(!comp || comp.burned) return;
    comp.closed = !comp.closed;
    const line = document.getElementById(`sw_${id}`);
    if(comp.closed){ line.setAttribute('y2', '27'); line.setAttribute('stroke', 'var(--green)'); } 
    else { line.setAttribute('y2', '10'); line.setAttribute('stroke', 'var(--red)'); }
    analizarCircuito();
}

function setupPins(div, c){
    div.querySelectorAll('.net-pin').forEach(pin => {
        pin.onpointerdown = (e) => {
            e.stopPropagation(); e.preventDefault(); if(c.burned) return;
            if(!selectedPin){ 
                selectedPin = pin; selectedPin.style.transform = 'scale(1.3)'; 
            } else {
                if(selectedPin.id !== pin.id){
                    wires.push({ id: 'w_' + Date.now(), a: selectedPin.id, b: pin.id });
                    selectedPin.style.transform = 'scale(1)'; selectedPin = null;
                    drawWires(); analizarCircuito(); guardarCircuito();
                } else { selectedPin.style.transform = 'scale(1)'; selectedPin = null; }
            }
        };
    });
}

function drawWires(){
    wireLayer.innerHTML = '';
    document.querySelectorAll('.net-pin').forEach(p => p.classList.remove('connected'));
    wires.forEach(w => {
        const pinA = document.getElementById(w.a); const pinB = document.getElementById(w.b);
        if(!pinA || !pinB) return;
        pinA.classList.add('connected'); pinB.classList.add('connected');
        const r1 = pinA.getBoundingClientRect(); const r2 = pinB.getBoundingClientRect();
        const s = sandbox.getBoundingClientRect();
        
        const x1 = r1.left - s.left + 16; const y1 = r1.top - s.top + 16;
        const x2 = r2.left - s.left + 16; const y2 = r2.top - s.top + 16;

        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        const dx = Math.abs(x2 - x1) * 0.3;
        path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
        path.setAttribute('class', 'wire');
        path.onpointerdown = (e) => {
            e.stopPropagation(); e.preventDefault(); wires = wires.filter(item => item.id !== w.id);
            drawWires(); analizarCircuito(); guardarCircuito();
        };
        wireLayer.appendChild(path);
    });
}

function makeDraggable(div, obj){
    let dx = 0, dy = 0;
    div.onpointerdown = (e) => {
        const targetClass = e.target.className;
        if(e.target.classList.contains('net-pin') || e.target.classList.contains('pwr-btn') || e.target.classList.contains('mini-btn') || e.target.tagName === 'svg' || e.target.tagName === 'line' || e.target.tagName === 'rect') {
            if(!e.target.classList.contains('spice-node') && !e.target.classList.contains('comp-body')) return;
        }
        
        dx = e.clientX - obj.x; dy = e.clientY - obj.y;
        div.setPointerCapture(e.pointerId);
        
        div.onpointermove = (ev) => { 
            obj.x = ev.clientX - dx; 
            obj.y = ev.clientY - dy; 
            div.style.left = obj.x + 'px'; 
            div.style.top = obj.y + 'px'; 
            drawWires(); 
        };
        div.onpointerup = () => { div.onpointermove = null; div.onpointerup = null; guardarCircuito(); };
    };
}

function analizarCircuito(){
    components.forEach(c => { if(!c.burned) { c.powered = false; c.v_input = 0; } });
    
    const fuentesActivas = components.filter(c => c.type === 'ac_power' && c.isOn && !c.burned);
    if(fuentesActivas.length === 0) return;

    fuentesActivas.forEach(fuente => {
        const pinSrcA = `pin_${fuente.id}_a`;
        const pinSrcB = `pin_${fuente.id}_b`;

        components.forEach(c => {
            if(c.type === 'ac_power' || c.burned) return;

            let pA = `pin_${c.id}_a`; let pB = `pin_${c.id}_b`;
            if(c.type === 'transformador') { pA = `pin_${c.id}_p1`; pB = `pin_${c.id}_p2`; }

            let conectadoAlPoloA = verificarRutaNodo(pinSrcA, pA);
            let conectadoAlPoloB = verificarRutaNodo(pinSrcB, pB);

            if(!(conectadoAlPoloA && conectadoAlPoloB)){
                conectadoAlPoloA = verificarRutaNodo(pinSrcA, pB);
                conectadoAlPoloB = verificarRutaNodo(pinSrcB, pA);
            }

            if(conectadoAlPoloA && conectadoAlPoloB){
                c.powered = true;
                c.v_input = fuente.v;
            }
        });
    });
}

function verificarRutaNodo(nodoInicio, nodoDestino){
    let visitados = new Set();
    let queue = [nodoInicio];

    while(queue.length > 0){
        let actual = queue.shift();
        if(actual === nodoDestino) return true;
        if(visitados.has(actual)) continue;
        visitados.add(actual);

        let tokens = actual.split('_');
        let compId = tokens[1] + '_' + tokens[2];
        let comp = components.find(i => i.id === compId);

        if(comp && comp.type === 'disyuntor' && !comp.closed) {
            inyectarCablesExternos(actual, queue, visitados);
            continue;
        }

        if(comp){
            let todosLosPines = Array.from(document.querySelectorAll(`[id^="pin_${compId}_"]`)).map(p => p.id);
            todosLosPines.forEach(p => { if(!visitados.has(p)) queue.push(p); });
        }

        inyectarCablesExternos(actual, queue, visitados);
    }
    return false;
}

function inyectarCablesExternos(pinActual, queue, visitados){
    wires.forEach(w => {
        if(w.a === pinActual && !visitados.has(w.b)) queue.push(w.b);
        if(w.b === pinActual && !visitados.has(w.a)) queue.push(w.a);
    });
}

function toggleScope(){
    scopeOn = !scopeOn;
    const btn = document.getElementById('scopeToggle');
    btn.innerText = scopeOn ? "OSCILOSCOPIO Y SERIAL: ON" : "OSCILOSCOPIO Y SERIAL: OFF";
    btn.className = scopeOn ? "scope-btn active" : "scope-btn";
}

function updateScopeParams(){
    scopeVoltScale = parseFloat(document.getElementById('scopeVolt').value);
    scopeTimeScale = parseFloat(document.getElementById('scopeTime').value);
    wave = []; 
}

const canvas = document.getElementById('scope'); const ctx = canvas.getContext('2d');
let wave = [];
canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;

let serialTimer = 0;
function updateSerialMonitor(v, watts, rpm, isMotorActive) {
    serialTimer++;
    if(serialTimer % 15 !== 0) return; 
    const monitor = document.getElementById('serial-monitor');
    if(!monitor) return;

    let amperes = v > 0 ? (watts / v).toFixed(2) : "0.00";
    let dutyCycle = isMotorActive ? Math.min(100, Math.round((v / 220) * 100)) : 0;

    monitor.innerHTML = `
        <div class="serial-line">> COM3 - BAUDRATE 115200</div>
        <div class="serial-line ${isMotorActive?'active':''}">[VOLTAJE] : ${v} V_RMS</div>
        <div class="serial-line ${isMotorActive?'active':''}">[POTENCIA]: ${watts} W</div>
        <div class="serial-line ${isMotorActive?'active':''}">[CORRIENTE]: ${amperes} A</div>
        <div class="serial-line ${isMotorActive?'active':''}">[PWM_DUTY]: ${dutyCycle}%</div>
        <div class="serial-line ${isMotorActive?'active':''}">[SPEED]   : ${rpm} RPM</div>
    `;
    monitor.scrollTop = monitor.scrollHeight;
}

function renderScope(){
    requestAnimationFrame(renderScope);
    const w = canvas.width; const h = canvas.height;
    ctx.fillStyle = '#010a02'; ctx.fillRect(0,0,w,h);

    ctx.strokeStyle = '#05240a'; ctx.lineWidth = 1;
    for(let i=0; i<w; i+=30){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
    for(let j=0; j<h; j+=20){ ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }

    let fuente = components.find(c => c.type === 'ac_power' && c.isOn && !c.burned);
    let motor = components.find(c => c.type === 'motor_ac' && c.powered && !c.burned);
    
    if(scopeOn){
        phase += scopeTimeScale;
        let amplitud = fuente ? (28 / scopeVoltScale) : 0;
        
        let y = h/2;
        if (motor) {
            let threshold = Math.sin(phase * 4);
            let duty = (motor.v_input / 220); 
            y = (Math.sin(phase * 25) > (1 - duty * 2)) ? (h/2 - amplitud) : (h/2 + amplitud);
        } else {
            y = h/2 + Math.sin(phase) * amplitud;
        }

        wave.push(y); 
        if(wave.length > w) wave.shift();

        ctx.strokeStyle = motor ? '#00f2fe' : '#39ff14'; 
        ctx.lineWidth = 2.5;
        ctx.beginPath(); 
        wave.forEach((v, i) => { if(i === 0) ctx.moveTo(i, v); else ctx.lineTo(i, v); }); 
        ctx.stroke();
        
        ctx.fillStyle = motor ? '#00f2fe' : '#39ff14'; ctx.font = '10px monospace';
        ctx.fillText(`MODE: ${motor ? 'PWM OUT':'AC SINE'} | Freq: 60Hz`, 10, 15);
    } else {
        wave = []; 
        ctx.fillStyle = '#ff073a'; ctx.font = '10px monospace'; ctx.fillText('MONITOR DISCONNECTED', w/2 - 55, h/2 + 4);
    }
    
    monitorizarComponentes();
}

function monitorizarComponentes(){
    let activeVolt = 0;
    let activeWatts = 0;
    let activeRpm = 0;
    let isMotorOn = false;

    components.forEach(c => {
        const tel = document.getElementById(`tel_${c.id}`); if(!tel) return;

        if(c.burned){ tel.innerText = "💥 BURNED\n💥 OVERLOAD"; tel.className = "telemetry burn"; return; }

        if(c.type === 'ac_power' && c.isOn) {
            tel.innerText = `${c.v}VAC\nLIVE SOURCE`; tel.className = "telemetry on";
        } else if(c.powered) {
            let v = c.v_input || 220;
            let watts = 0;

            if(c.type === 'bombilla') {
                let r_dinamica = (220 * 220) / c.w_nom;
                watts = Math.round((v * v) / r_dinamica);
            } else if(c.type === 'resistor') {
                watts = Math.round((v * v) / c.r);
            } else if(c.type === 'capacitor_cer') {
                let faradios = c.uf * 1e-9;
                let xc = 1 / (2 * Math.PI * 60 * faradios);
                if(xc < 1) xc = 1; 
                watts = Math.round((v * v) / xc);
            } else if(c.type === 'motor_ac') {
                watts = Math.round((v * v) / 60); 
            } else if(c.type === 'transformador') {
                watts = Math.round((v * v) / 150);
            }

            if(watts > 500) {
                c.heatTimer++;
                tel.innerText = `⚠️ OVERLOAD\n${watts}W`; tel.className = "telemetry burn";
                if(c.heatTimer > 80) { c.burned = true; c.powered = false; analizarCircuito(); guardarCircuito(); }
            } else {
                c.heatTimer = Math.max(0, c.heatTimer - 1);
                if(c.type === 'motor_ac'){
                    c.current_rpm = Math.round((v / 220) * c.max_rpm);
                    tel.innerText = `${v}V | ${watts}W\n🌀 ${c.current_rpm} RPM`;
                    activeVolt = v; activeWatts = watts; activeRpm = c.current_rpm; isMotorOn = true;
                } else if(c.type === 'capacitor_cer') {
                    tel.innerText = `${v}V\n🟠 CAP. CERÁMICO\nConsumo: ${watts}W`;
                } else {
                    tel.innerText = `${v}V\n⚡ ${watts}W`;
                }
                tel.className = "telemetry on";
            }
        } else {
            if(c.type === 'motor_ac') c.current_rpm = 0;
            tel.innerText = "OFF\n0V | 0W"; tel.className = "telemetry";
        }

        if(c.type === 'motor_ac' && c.powered && !c.burned){
            const fan = document.getElementById('fan_'+c.id);
            if(fan) fan.style.transform = `rotate(${performance.now() * (c.current_rpm / 4000)}deg)`;
        }
        if(c.type === 'bombilla' && !c.burned){
            const lamp = document.getElementById('lamp_'+c.id);
            if(lamp){
                if(c.powered){
                    let factorBrillo = Math.min(1, (c.w_nom / 300));
                    let oscilacion = 0.3 + Math.sin(phase * 3) * 0.15;
                    lamp.setAttribute('fill', `rgba(255,238,0, ${oscilacion * factorBrillo + 0.3})`);
                    lamp.style.filter = `drop-shadow(0 0 ${12 * factorBrillo}px #ffee00)`;
                } else { lamp.setAttribute('fill', 'rgba(255,255,0,0.05)'); lamp.style.filter = "none"; }
            }
        }
    });

    if(scopeOn) {
        updateSerialMonitor(activeVolt, activeWatts, activeRpm, isMotorOn);
    }
}

window.onload = () => { 
    initAirportTicker();
    localStorage.removeItem('TRUESPICE_AC_SAVE_V38'); 
    cargarCircuito(); 
};
renderScope();
