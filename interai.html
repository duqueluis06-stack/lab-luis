<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InterAI - Panel Cinemático Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; 
            background-color: #030308; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
        
        /* UI DE CARGA MATRICIAL */
        #loading-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0c0c1f 0%, #030308 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: #00ffcc; font-family: 'Courier New', Courier, monospace;
        }
        .loader-box {
            border: 1px solid #00ffcc; padding: 30px; background: rgba(0, 20, 30, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); border-radius: 4px; text-align: center;
            max-width: 450px; width: 90%;
        }
        #progress-bar { width: 100%; background: #111; height: 4px; margin-top: 15px; border-radius: 2px; }
        #progress-fill { width: 0%; background: #00ffcc; height: 100%; transition: width 0.3s; }
        
        #start-btn {
            display: none; margin-top: 25px; padding: 15px 30px;
            background: #00ffcc; border: none; color: #000; font-weight: bold;
            cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        /* UI CINEMÁTICA (CÓMIC) */
        #comic-container {
            position: absolute; bottom: 30px; left: 5%; width: 90%;
            display: flex; justify-content: space-between; gap: 20px;
            z-index: 100; pointer-events: none;
        }
        .comic-cloud {
            flex: 1; background: #fff; color: #000; border: 3px solid #000;
            border-radius: 20px; padding: 15px; font-size: 14px; font-weight: 800;
            box-shadow: 8px 8px 0px #000; opacity: 0; transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .comic-cloud.active { opacity: 1; transform: translateY(0); }
        .speaker-tag { font-size: 10px; text-transform: uppercase; margin-bottom: 5px; font-family: monospace; }
        #bubble-agente .speaker-tag { color: #00a372; }
        #bubble-luis .speaker-tag { color: #df7300; }

        /* BOTONES DE CONTROL */
        .control-btn {
            position: absolute; top: 20px; padding: 12px 20px;
            font-size: 11px; font-weight: bold; border: 2px solid #000;
            cursor: pointer; z-index: 500; box-shadow: 4px 4px 0px #000;
            text-transform: uppercase; font-family: monospace;
        }
        #reset-cam-btn { left: 20px; background: #00ffcc; color: #000; }
        #exit-btn { right: 20px; background: #ff3e3e; color: #fff; }

        @media (max-width: 768px) {
            #comic-container { flex-direction: column; bottom: 20px; }
            .comic-cloud { font-size: 12px; padding: 10px; }
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <div class="loader-box">
            <h2 style="margin:0 0 10px 0; font-size:16px;">CONEXIÓN NEURAL</h2>
            <p id="status-text" style="font-size:11px; color:#fff; opacity:0.7;">INICIALIZANDO ENTIDADES 3D...</p>
            <div id="progress-bar"><div id="progress-fill"></div></div>
            <button id="start-btn" onclick="desbloquearAudioYComenzar()">⚡ INICIAR TRANSMISIÓN</button>
        </div>
    </div>

    <button id="reset-cam-btn" class="control-btn" onclick="resetCamara()">🎥 CENTRAR</button>
    <button id="exit-btn" class="control-btn" onclick="regresar()">🚪 SALIR</button>

    <div id="comic-container">
        <div id="bubble-agente" class="comic-cloud">
            <div class="speaker-tag">● AGENTE IA</div>
            <div id="text-agente">...</div>
        </div>
        <div id="bubble-luis" class="comic-cloud">
            <div class="speaker-tag">● LUIS AVATAR</div>
            <div id="text-luis">...</div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // ================================================================
        // ===== CONFIGURACIÓN Y CONSTANTES =====
        // ================================================================
        const CONFIG = {
            WORKER_URL: "https://little-salad-1611.duqueluis06.workers.dev",
            COORD_AGENTE: { x: -1, y: 0, z: 3.5 },
            COORD_LUIS: { x: 1, y: 0, z: 3.5 },
            FALLBACK_LUIS: ["La presión en el reactor es nominal.", "He ajustado los sensores de la red."],
            FALLBACK_AGENTE: ["Excelente, Luis. Procedo con el escaneo.", "Entendido, mantendré la vigilancia."]
        };

        let engine, scene, camera, glowLayer;
        let agenteModel = null, luisModel = null;
        let mouthTargetsAgente = [], mouthTargetsLuis = [];
        let isSpeaking = null;
        let currentVol = 0;
        let history = [];

        // ================================================================
        // ===== INIT ENGINE & SCENE SETUP =====
        // ================================================================
        const canvas = document.getElementById("renderCanvas");
        
        function initEngine() {
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);
            
            // Niebla nocturna
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = new BABYLON.Color3(0, 0, 0.05);
            scene.fogDensity = 0.02;

            // ===== CAMERA SYSTEM =====
            camera = new BABYLON.ArcRotateCamera("cinematicCam", -Math.PI / 2, Math.PI / 2.2, 4.5, new BABYLON.Vector3(0, 1.5, 3.5), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 2;
            camera.upperRadiusLimit = 10;
            camera.panningSensibility = 0;

            // ===== LIGHTING SYSTEM =====
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.3;

            const spot1 = new BABYLON.SpotLight("spot1", new BABYLON.Vector3(-2, 4, 6), new BABYLON.Vector3(0.5, -0.5, -1), Math.PI/3, 2, scene);
            spot1.diffuse = new BABYLON.Color3(0, 1, 0.8);
            spot1.intensity = 2;

            const spot2 = new BABYLON.SpotLight("spot2", new BABYLON.Vector3(2, 4, 6), new BABYLON.Vector3(-0.5, -0.5, -1), Math.PI/3, 2, scene);
            spot2.diffuse = new BABYLON.Color3(1, 0.5, 0);
            spot2.intensity = 2;

            glowLayer = new BABYLON.GlowLayer("glow", scene);
            glowLayer.intensity = 0.8;

            // Suelo reflectante
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
            const groundMat = new BABYLON.StandardMaterial("gMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.15);
            groundMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            ground.material = groundMat;

            crearCiudadNeon();
            cargarModelos();
        }

        function crearCiudadNeon() {
            for(let i=0; i<40; i++) {
                let h = Math.random() * 10 + 5;
                let box = BABYLON.MeshBuilder.CreateBox("b"+i, {height: h, width: 3, depth: 3}, scene);
                box.position.x = (Math.random()-0.5) * 40;
                box.position.z = Math.random() * 20 + 10;
                box.position.y = h/2;
                
                let mat = new BABYLON.StandardMaterial("bm"+i, scene);
                mat.diffuseColor = new BABYLON.Color3(0,0,0);
                mat.emissiveColor = new BABYLON.Color3(Math.random(), Math.random(), 1);
                mat.emissiveColor.scaleInPlace(0.2);
                box.material = mat;
            }
        }

        // ================================================================
        // ===== AVATAR LOADING & CONTINGENCIA =====
        // ================================================================
        function cargarModelos() {
            const fill = document.getElementById("progress-fill");
            const status = document.getElementById("status-text");

            status.innerText = "CARGANDO AGENTE...";
            fill.style.width = "20%";

            BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, 
                (meshes) => {
                    agenteModel = meshes[0];
                    agenteModel.position = new BABYLON.Vector3(CONFIG.COORD_AGENTE.x, 0, CONFIG.COORD_AGENTE.z);
                    detectarBoca(agenteModel, mouthTargetsAgente);
                    cargarLuis();
                }, 
                null, 
                () => {
                    console.warn("Agente GLB no encontrado, usando contingencia.");
                    agenteModel = crearAvatarDummy("AgenteIA", new BABYLON.Color3(0, 1, 0.7), CONFIG.COORD_AGENTE, mouthTargetsAgente);
                    cargarLuis();
                }
            );

            function cargarLuis() {
                fill.style.width = "60%";
                status.innerText = "CARGANDO LUIS...";
                BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, 
                    (meshes) => {
                        luisModel = meshes[0];
                        luisModel.position = new BABYLON.Vector3(CONFIG.COORD_LUIS.x, 0, CONFIG.COORD_LUIS.z);
                        detectarBoca(luisModel, mouthTargetsLuis);
                        finalizar();
                    }, 
                    null, 
                    () => {
                        console.warn("Luis GLB no encontrado, usando contingencia.");
                        luisModel = crearAvatarDummy("Luis", new BABYLON.Color3(1, 0.5, 0), CONFIG.COORD_LUIS, mouthTargetsLuis);
                        finalizar();
                    }
                );
            }

            function finalizar() {
                fill.style.width = "100%";
                status.innerText = "SISTEMA LISTO";
                document.getElementById("start-btn").style.display = "block";
            }
        }

        function crearAvatarDummy(nombre, color, pos, targetArr) {
            const root = new BABYLON.TransformNode(nombre, scene);
            const body = BABYLON.MeshBuilder.CreateCylinder(nombre+"_body", {height: 1.6, diameterTop: 0.2, diameterBottom: 0.5}, scene);
            body.position.y = 0.8;
            body.parent = root;
            const bMat = new BABYLON.StandardMaterial(nombre+"_mat", scene);
            bMat.diffuseColor = color;
            body.material = bMat;

            const head = BABYLON.MeshBuilder.CreateSphere(nombre+"_head", {diameter: 0.4}, scene);
            head.position.y = 1.7;
            head.parent = root;

            const jaw = BABYLON.MeshBuilder.CreateBox(nombre+"_jaw", {width: 0.2, height: 0.05, depth: 0.1}, scene);
            jaw.position.set(0, 1.55, 0.15);
            jaw.parent = root;
            targetArr.push({type: "mesh", mesh: jaw, originalY: 1.55});

            root.position.set(pos.x, pos.y, pos.z);
            return root;
        }

        function detectarBoca(root, array) {
            root.getChildMeshes().forEach(m => {
                if (m.morphTargetManager) {
                    for (let i=0; i<m.morphTargetManager.numTargets; i++) {
                        let t = m.morphTargetManager.getTarget(i);
                        if (t.name.toLowerCase().includes("mouth") || t.name.toLowerCase().includes("jaw")) {
                            array.push({type: "morph", target: t});
                        }
                    }
                }
                if (m.name.toLowerCase().includes("mouth") || m.name.toLowerCase().includes("jaw")) {
                    array.push({type: "scale", mesh: m, originalS: m.scaling.y});
                }
            });
        }

        // ================================================================
        // ===== ANIMATION & LIP SYNC ENGINE =====
        // ================================================================
        let desvioAgente = new BABYLON.Vector3(0,0,0);
        let desvioLuis = new BABYLON.Vector3(0,0,0);

        scene.registerBeforeRender(() => {
            const t = Date.now();
            
            // Lip Sync basado en amplitud simulada
            if (isSpeaking) {
                currentVol = Math.abs(Math.sin(t * 0.02) * 0.6) + (Math.random() * 0.4);
                let targets = (isSpeaking === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                targets.forEach(o => {
                    if (o.type === "morph") o.target.influence = currentVol;
                    if (o.type === "mesh") o.mesh.position.y = o.originalY - (currentVol * 0.05);
                    if (o.type === "scale") o.mesh.scaling.y = o.originalS + (currentVol * 0.2);
                });
            } else {
                [mouthTargetsAgente, mouthTargetsLuis].forEach(arr => {
                    arr.forEach(o => {
                        if (o.type === "morph") o.target.influence = 0;
                        if (o.type === "mesh") o.mesh.position.y = o.originalY;
                    });
                });
            }

            // Look At suave
            if (agenteModel && luisModel) {
                // El agente mira a Luis (con un poco de ruido idle)
                let lookAgente = luisModel.position.add(new BABYLON.Vector3(0, 1.6, 0));
                agenteModel.lookAt(lookAgente);
                agenteModel.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);

                let lookLuis = agenteModel.position.add(new BABYLON.Vector3(0, 1.6, 0));
                luisModel.lookAt(lookLuis);
                luisModel.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
            }
        });

        // ================================================================
        // ===== VOICE & DIALOGUE SYSTEM =====
        // ================================================================
        function desbloquearAudioYComenzar() {
            document.getElementById("loading-ui").style.display = "none";
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(u);
            bucleDialogo();
        }

        async function bucleDialogo() {
            let turno = "Agente";
            let msg = "Hola Luis, ¿reporte de sistemas?";

            while (true) {
                actualizarUI(turno, msg);
                await hablar(msg, turno);
                
                turno = (turno === "Agente") ? "Luis" : "Agente";
                
                // Intentar Worker, si no, Fallback
                let prompt = `Eres ${turno}. Responde brevemente a: ${msg}`;
                let respuesta = await fetchWorker(prompt);
                
                if (!respuesta) {
                    respuesta = (turno === "Luis") ? CONFIG.FALLBACK_LUIS[Math.floor(Math.random()*2)] : CONFIG.FALLBACK_AGENTE[Math.floor(Math.random()*2)];
                }
                msg = respuesta;
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        function actualizarUI(hablante, texto) {
            const bAgente = document.getElementById("bubble-agente");
            const bLuis = document.getElementById("bubble-luis");
            if (hablante === "Agente") {
                bAgente.classList.add("active");
                bLuis.classList.remove("active");
                document.getElementById("text-agente").innerText = texto;
            } else {
                bLuis.classList.add("active");
                bAgente.classList.remove("active");
                document.getElementById("text-luis").innerText = texto;
            }
        }

        async function hablar(texto, avatar) {
            return new Promise(resolve => {
                const utter = new SpeechSynthesisUtterance(texto);
                const voices = window.speechSynthesis.getVoices();
                
                // Selección inteligente de voces
                if (avatar === "Luis") {
                    utter.voice = voices.find(v => v.name.toLowerCase().includes("male") || v.name.includes("David") || v.name.includes("Mexico")) || voices[0];
                    utter.pitch = 0.8;
                    utter.rate = 0.9;
                } else {
                    utter.voice = voices.find(v => v.name.toLowerCase().includes("female") || v.name.includes("Helena") || v.name.includes("Spain")) || voices[1] || voices[0];
                    utter.pitch = 1.2;
                    utter.rate = 1.0;
                }

                utter.onstart = () => isSpeaking = avatar;
                utter.onend = () => { isSpeaking = null; resolve(); };
                window.speechSynthesis.speak(utter);
                
                // Fallback si no hay voces (ej. algunos móviles)
                if (voices.length === 0) setTimeout(() => { isSpeaking = null; resolve(); }, 3000);
            });
        }

        async function fetchWorker(p) {
            try {
                const res = await fetch(CONFIG.WORKER_URL, {
                    method: "POST",
                    body: JSON.stringify({ message: p, context: history })
                });
                const data = await res.json();
                return data.reply;
            } catch (e) { return null; }
        }

        // ================================================================
        // ===== UI CONTROLS =====
        // ================================================================
        function resetCamara() {
            camera.alpha = -Math.PI / 2;
            camera.beta = Math.PI / 2.2;
            camera.radius = 4.5;
            camera.setTarget(new BABYLON.Vector3(0, 1.5, 3.5));
        }

        function regresar() {
            window.speechSynthesis.cancel();
            window.location.href = "index.html";
        }

        // Inicialización
        window.addEventListener("DOMContentLoaded", initEngine);
        window.addEventListener("resize", () => engine.resize());

    </script>
</body>
</html>
