<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterAI - Entorno de Pruebas Tácticas</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: monospace;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            background: rgba(5, 5, 12, 0.95);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            z-index: 10;
            width: 260px;
        }
        #hud-console {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: 280px;
            background: rgba(5, 5, 12, 0.95);
            border: 1px solid #00a2ff;
            border-radius: 4px;
            color: #00a2ff;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.2);
            z-index: 100;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .hud-header {
            font-weight: bold;
            color: #ffb703;
            font-size: 11px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 162, 255, 0.3);
            padding-bottom: 4px;
        }
        #hud-log {
            font-size: 11px;
            color: #fff;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        #instructions-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(2, 2, 8, 0.85);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(0, 255, 229, 0.4);
            z-index: 9;
        }
        #reset-camera-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            background: linear-gradient(90deg, #00a2ff, #00ffe5);
            padding: 11px 22px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
            z-index: 10;
            transition: all 0.2s ease;
        }
        #reset-camera-btn:hover {
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.6);
            transform: translateY(-2px);
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h3 style="margin:0 0 8px 0; font-size:14px; letter-spacing:1px;">⚙️ NEUROLAB COGNITIVE</h3>
        <p id="status" style="margin:0; font-size:11px; color:#fff;">Sincronizando orientaciones y mallas...</p>
    </div>

    <div id="hud-console">
        <div class="hud-header">📡 MONITOR DE FRECUENCIAS (DOS CANALES MASCULINOS)</div>
        <div id="hud-log">Esperando acoplamiento de telemetría...</div>
    </div>

    <div id="instructions-ui">
        💾 <b>Clic Izquierdo:</b> Rotar | 🎡 <b>Zoom</b> | 🖱️ <b>Clic Derecho:</b> Desplazamiento orbital
    </div>

    <button id="reset-camera-btn" onclick="resetCamaraOrigen()">🎥 ENFOCAR AVATARES</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        // =======================================================================
        // 🛠️ PANEL DE CONTROL DE POSICIONES (Frente a frente corregido)
        // =======================================================================
        const COORDENADAS = {
            agente: { x: -0.8, y: 0.05, z: 3.0 },
            luisavatar: { x: 0.8, y: 0.05, z: 3.0 }
        };

        const WORKER_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [];
        let mouthTargetsAgente = [];
        let mouthTargetsLuis = [];
        let agentAnimations = [];
        let luisAnimations = [];
        let currentSpeaker = null; 

        // Variables de control de mirada procedural (Evita rigidez de cuello)
        let desvioMiradaAgente = new BABYLON.Vector3(0, 0, 0);
        let desvioMiradaLuis = new BABYLON.Vector3(0, 0, 0);
        let proximoCambioGaze = 0;

        const hudLog = document.getElementById("hud-log");
        function reportHUD(avatar, msg, color = "#fff") {
            const div = document.createElement("div");
            div.style.color = color;
            div.style.marginBottom = "8px";
            div.innerText = `[${avatar.toUpperCase()}]: ${msg}`;
            hudLog.appendChild(div);
            document.getElementById("hud-console").scrollTop = document.getElementById("hud-console").scrollHeight;
        }

        async function consultarGroqWorker(promptText) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: promptText,
                        context: historialDialogo,
                        lang: "es-ES"
                    })
                });
                const data = await response.json();
                return data.reply || "...";
            } catch (error) {
                console.error("Error en enlace Worker-Groq:", error);
                return "Fluctuación menor en el enlace de datos de laboratorio. Reajustando receptores...";
            }
        }

        async function generarYReproducirVoz(texto, avatar) {
            try {
                // Configuración de envío: Ambos marcados como masculinos
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: texto, voice: "male", speaker: avatar })
                });

                if (response.ok && response.headers.get("content-type")?.includes("audio")) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);

                    return new Promise((resolve) => {
                        audio.onplay = () => { currentSpeaker = avatar; };
                        const endHandler = () => {
                            currentSpeaker = null;
                            URL.revokeObjectURL(audioUrl);
                            resolve();
                        };
                        audio.onended = endHandler;
                        audio.onerror = endHandler;
                        audio.play().catch(() => { currentSpeaker = null; resolve(); });
                    });
                } else {
                    // Fallback nativo diferenciado para dos hombres (Grave e Ingeniería vs Analítico y Rápido)
                    return new Promise((resolve) => {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(texto.replace(/[*#_`]/g, ""));
                        const voices = window.speechSynthesis.getVoices();
                        const esVoices = voices.filter(v => v.lang.startsWith("es"));
                        const maleVoices = esVoices.filter(v => v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("google"));

                        if (avatar === "Luis") {
                            utterance.voice = maleVoices[0] || esVoices[0];
                            utterance.pitch = 0.80; // Voz grave de Luis
                            utterance.rate = 0.92;
                        } else {
                            utterance.voice = maleVoices[1] || maleVoices[0] || esVoices[0];
                            utterance.pitch = 1.05; // Voz analítica del Agente
                            utterance.rate = 1.05;
                        }

                        utterance.onstart = () => { currentSpeaker = avatar; };
                        const endHandler = () => { currentSpeaker = null; setTimeout(resolve, 400); };
                        utterance.onend = endHandler;
                        utterance.onerror = endHandler;
                        window.speechSynthesis.speak(utterance);
                    });
                }
            } catch (error) {
                console.error("Error en procesador de fonemas de voz:", error);
            }
        }

        // Rastreador Kinetofonético Facial Extendido
        function setupMouthTrackingBabylon(rootMesh, targetArray) {
            if (!rootMesh) return;
            const childMeshes = rootMesh.getChildMeshes();
            
            childMeshes.forEach(mesh => {
                const name = (mesh.name || "").toLowerCase();
                
                if (mesh.morphTargetManager) {
                    const manager = mesh.morphTargetManager;
                    for (let i = 0; i < manager.numTargets; i++) {
                        const targetName = manager.getTarget(i).name.toLowerCase();
                        if (targetName.includes("mouth") || targetName.includes("jaw") || targetName.includes("lip") || targetName.includes("viseme") || targetName.includes("open")) {
                            targetArray.push({ type: "morph", manager: manager, target: manager.getTarget(i) });
                        }
                    }
                }
                if (name.includes("mouth") || name.includes("jaw") || name.includes("head") || name.includes("lip")) {
                    if (!targetArray.some(t => t.mesh === mesh)) {
                        targetArray.push({ type: "mesh", mesh: mesh, originalScaleY: mesh.scaling.y });
                    }
                }
            });
        }

        async function iniciarInteraccionAvatares() {
            hudLog.innerText = "";
            let hablanteActual = "Agente";
            let ultimoMensaje = "Hola Luis. Sistemas calibrados, el entorno de pruebas electrónicas y monitorización astrofísica está en línea. ¿Qué vector de análisis abrimos hoy?";
            
            reportHUD(hablanteActual, ultimoMensaje, "#00ffcc");
            historialDialogo.push({ role: "user", content: `Agente: ${ultimoMensaje}` });
            
            await generarYReproducirVoz(ultimoMensaje, hablanteActual);

            while (true) {
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                
                let contextoPrompt = "";
                if (hablanteActual === "Luis") {
                    contextoPrompt = `[Eres Luis, ingeniero senior de pruebas físicas electrónicas y astrofísica. Responde con un enfoque innovador, directo y técnico usando de 2 a 4 frases realistas]: ${ultimoMensaje}`;
                } else {
                    contextoPrompt = `[Eres el Agente, una IA de laboratorio avanzada. Aporta datos analíticos computacionales de soporte al planteamiento de Luis, corto y preciso]: ${ultimoMensaje}`;
                }

                let respuesta = await consultarGroqWorker(contextoPrompt);

                if (respuesta) {
                    ultimoMensaje = respuesta;
                    let colorHUD = (hablanteActual === "Luis") ? "#00a2ff" : "#00ffcc";
                    
                    reportHUD(hablanteActual, ultimoMensaje, colorHUD);
                    historialDialogo.push({ role: "user", content: `${hablanteActual}: ${ultimoMensaje}` });
                    
                    if (historialDialogo.length > 14) historialDialogo.splice(0, 2);
                    
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                }
                
                await new Promise(resolve => setTimeout(resolve, 1400));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let camera; 
        let agenteRoot, luisRoot;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 4.5, new BABYLON.Vector3(0, 1.2, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.0; 
            camera.upperRadiusLimit = 80; 
            camera.panningSensibility = 1200; 

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.9;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(5, 12, 5);
            dirLight.intensity = 0.7;

            const statusText = document.getElementById("status");

            // 1. Ciudad
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Ciudad acoplada. Configurando Agente Masculino...";

                // 2. Agente
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, particleSystems, skeletons, animationGroups) {
                    statusText.innerText = "Agente en línea. Cargando perfil LuisAvatar...";
                    
                    agenteRoot = agentMeshes[0];
                    agentAnimations = animationGroups;

                    if(agenteRoot) {
                        agenteRoot.rotationQuaternion = null; 
                        agenteRoot.position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        setupMouthTrackingBabylon(agenteRoot, mouthTargetsAgente);
                    }

                    if (agentAnimations.length > 0) {
                        agentAnimations.forEach(group => group.start(true));
                    }

                    // 3. Tu Avatar
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, readyParticles, readySkeletons, animationGroups) {
                        statusText.innerText = "Simulación neuronal lista. Rompiendo monotonía de bucles...";
                        
                        luisRoot = luisMeshes[0];
                        luisAnimations = animationGroups;

                        if(luisRoot) {
                            luisRoot.rotationQuaternion = null; 
                            luisRoot.position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            setupMouthTrackingBabylon(luisRoot, mouthTargetsLuis);
                        }

                        if (luisAnimations.length > 0) {
                            luisAnimations.forEach(anim => anim.start(true));
                        }

                        setTimeout(() => {
                            document.getElementById("loading-ui").style.display = "none";
                            iniciarInteraccionAvatares();
                        }, 1200);
                    });
                });
            }, null, function (scene, message, exception) {
                statusText.innerText = "Error crítico de inicialización de entornos.";
                console.error(message, exception);
            });

            // --- BUCLE DINÁMICO DE CONTROL: ROTACIÓN, MIRADAS Y ANIMACIÓN INTELIGENTE ---
            scene.registerBeforeRender(() => {
                let ahora = Date.now();

                // 🧠 CONTROL DE VELOCIDAD DE BRAZOS (Rompe repetición de Luis y Agente)
                if (luisAnimations.length > 0) {
                    luisAnimations.forEach(anim => {
                        // Si Luis habla, se mueve normal; si calla, se ralentiza al 15% simulando respiración estática
                        anim.speedRatio = (currentSpeaker === "Luis") ? 0.85 : 0.15;
                    });
                }
                if (agentAnimations.length > 0) {
                    agentAnimations.forEach(anim => {
                        anim.speedRatio = (currentSpeaker === "Agente") ? 0.85 : 0.15;
                    });
                }

                // 👀 GENERADOR DE MIRADAS NATURALES (Mirar a los lados esporádicamente)
                if (ahora > proximoCambioGaze) {
                    proximoCambioGaze = ahora + 3000 + Math.random() * 4000; // Cada 3-7 seg cambia el foco
                    
                    if (Math.random() > 0.65) {
                        // Desvía la mirada a los lados temporalmente
                        desvioMiradaAgente = new BABYLON.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.3);
                        desvioMiradaLuis = new BABYLON.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.3);
                    } else {
                        // Mirada directa fija face-to-face
                        desvioMiradaAgente.setAll(0);
                        desvioMiradaLuis.setAll(0);
                    }
                }

                // 🔄 ORIENTACIÓN CARA A CARA REAL (Ajuste compensatorio de espaldas con Math.PI)
                if (agenteRoot && luisRoot) {
                    let baseTargetAgente = new BABYLON.Vector3(luisRoot.position.x, agenteRoot.position.y, luisRoot.position.z);
                    let baseTargetLuis = new BABYLON.Vector3(agenteRoot.position.x, luisRoot.position.y, agenteRoot.position.z);

                    // Inyectar desvíos sutiles en la mirada/cabeza
                    baseTargetAgente.addInPlace(desvioMiradaAgente);
                    baseTargetLuis.addInPlace(desvioMiradaLuis);

                    // lookAt orienta el eje +Z, añadimos rotación local de 180 grados para ponerlos de frente
                    agenteRoot.lookAt(baseTargetAgente);
                    agenteRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);

                    luisRoot.lookAt(baseTargetLuis);
                    luisRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
                }

                // 👄 MODULACIÓN DINÁMICA DE LABIOS (LIP-SYNC SIMULADO)
                if (currentSpeaker) {
                    let targets = (currentSpeaker === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                    let wave = Math.abs(Math.sin(ahora * 0.022)) * 0.7 + Math.random() * 0.25;

                    targets.forEach(t => {
                        if (t.type === "morph") {
                            t.target.influence = wave;
                        } else if (t.type === "mesh") {
                            t.mesh.scaling.y = t.originalScaleY - (wave * 0.05); // Movimiento mecánico alternativo
                        }
                    });
                } else {
                    // Cierre total en reposo
                    [mouthTargetsAgente, mouthTargetsLuis].forEach(targets => {
                        targets.forEach(t => {
                            if (t.type === "morph") t.target.influence = 0;
                            if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY;
                        });
                    });
                }
            });

            return scene;
        };

        const scene = createScene();

        function resetCamaraOrigen() {
            if(camera) {
                camera.alpha = -Math.PI / 2;
                camera.beta = Math.PI / 2.3;
                camera.radius = 4.5;
                camera.target = new BABYLON.Vector3(0, 1.2, 3);
            }
        }

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
