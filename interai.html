<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color-scale=1.0, user-scalable=no">
    <title>InterAI - Entorno de Pruebas Tácticas</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: monospace;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        /* 🔋 PANTALLA DE INICIO Y DESBLOQUEO DE AUDIO PARA IOS */
        #loading-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #00ffcc;
            background: rgba(4, 4, 10, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }
        #start-btn {
            display: none;
            margin-top: 20px;
            padding: 16px 32px;
            background: linear-gradient(90deg, #00ffcc, #00a2ff);
            border: none;
            border-radius: 4px;
            color: #000;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            letter-spacing: 1px;
        }
        
        /* 📡 CONSOLA HUD DESPLAZADA ABAJO EN MÓVILES PARA NO TAPAR LAS CABEZAS */
        #hud-console {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: 280px;
            background: rgba(5, 5, 12, 0.95);
            border: 1px solid #00a2ff;
            border-radius: 4px;
            color: #00a2ff;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.2);
            z-index: 100;
            overflow-y: auto;
        }
        .hud-header {
            font-weight: bold;
            color: #ffb703;
            font-size: 11px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 162, 255, 0.3);
            padding-bottom: 4px;
        }
        #hud-log {
            font-size: 11px;
            color: #fff;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        /* 📱 INSTRUCCIONES EN EL BORDE SUPERIOR EXTERIOR */
        #instructions-ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(2, 2, 8, 0.85);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(0, 255, 229, 0.4);
            z-index: 9;
            white-space: nowrap;
        }
        .mobile-ins { display: none; }
        
        .control-btn {
            position: absolute;
            bottom: 20px;
            padding: 12px 22px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }
        #reset-camera-btn {
            right: 200px;
            color: #ffffff;
            background: linear-gradient(90deg, #00a2ff, #00ffe5);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }
        #exit-btn {
            right: 20px;
            color: #ffffff;
            background: linear-gradient(90deg, #d90429, #ef233c);
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.3);
        }

        /* 📱 MEDIA QUERIES REDISEÑADAS TÁCTICAMENTE PARA TU IPHONE */
        @media (max-width: 768px) {
            #instructions-ui {
                top: 12px;
                bottom: auto;
                left: 12px;
                right: 12px;
                transform: none;
                width: auto;
                font-size: 10px;
                padding: 8px;
                white-space: normal;
            }
            /* Consola enviada abajo, despejando la visual de los Avatares */
            #hud-console {
                top: auto;
                bottom: 75px; 
                left: 12px;
                right: 12px;
                width: auto;
                max-height: 115px;
                padding: 10px;
            }
            .desktop-ins { display: none; }
            .mobile-ins { display: inline; }
            .control-btn {
                bottom: 15px;
                padding: 14px 10px;
                font-size: 10px;
                width: 45%;
                text-align: center;
            }
            #reset-camera-btn { left: 12px; right: auto; }
            #exit-btn { right: 12px; }
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h2 id="load-title" style="margin:0 0 10px 0; font-size:16px; letter-spacing:1px; color:#00ffcc;">⚙️ CONECTANDO MATRIZ INTERAI</h2>
        <p id="status" style="margin:0; font-size:12px; color:#fff;">Sincronizando mallas y geometrías...</p>
        <button id="start-btn" onclick="desbloquearAudioYComenzar()">⚡ ENTRAR AL ENTORNO (ACTIVAR VOZ)</button>
    </div>

    <div id="hud-console">
        <div class="hud-header">📡 MONITOR DE AUDIO (DOS CANALES MASCULINOS)</div>
        <div id="hud-log">Esperando inicialización de hardware...</div>
    </div>

    <div id="instructions-ui">
        <span class="desktop-ins">💾 <b>Clic Izquierdo:</b> Rotar | 🎡 <b>Zoom</b> | 🖱️ <b>Clic Derecho:</b> Desplazamiento</span>
        <span class="mobile-ins">📱 <b>1 Dedo:</b> Rotar | 🤏 <b>Pellizco:</b> Zoom | ✋ <b>2 Dedos:</b> Ajustar Cámara</span>
    </div>

    <button id="reset-camera-btn" class="control-btn" onclick="resetCamaraOrigen()">🎥 ENFOCAR AVATARES</button>
    <button id="exit-btn" class="control-btn" onclick="regresarAlIndex()">🚪 INICIO (INDEX)</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        const COORDENADAS = {
            agente: { x: -0.8, y: 0.05, z: 3.0 },
            luisavatar: { x: 0.8, y: 0.05, z: 3.0 }
        };

        const WORKER_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [];
        let mouthTargetsAgente = [];
        let mouthTargetsLuis = [];
        let agentAnimations = [];
        let luisAnimations = [];
        let currentSpeaker = null; 

        let desvioMiradaAgente = new BABYLON.Vector3(0, 0, 0);
        let desvioMiradaLuis = new BABYLON.Vector3(0, 0, 0);
        let actualTargetAgente = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.agente.y, COORDENADAS.luisavatar.z);
        let actualTargetLuis = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.luisavatar.y, COORDENADAS.agente.z);
        let proximoCambioGaze = Date.now() + 8000; 

        const hudLog = document.getElementById("hud-log");
        function reportHUD(avatar, msg, color = "#fff") {
            const div = document.createElement("div");
            div.style.color = color;
            div.style.marginBottom = "8px";
            div.innerText = `[${avatar.toUpperCase()}]: ${msg}`;
            hudLog.appendChild(div);
            document.getElementById("hud-console").scrollTop = document.getElementById("hud-console").scrollHeight;
        }

        // Ejecución tras el toque del usuario en iPhone para romper las restricciones de Apple
        function desbloquearAudioYComenzar() {
            if (typeof window.speechSynthesis !== 'undefined') {
                window.speechSynthesis.cancel();
                // Inyección de fonema vacío para abrir compuertas de audio nativas
                let desbloqueo = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(desbloqueo);
            }
            document.getElementById("loading-ui").style.display = "none";
            iniciarInteraccionAvatares();
        }

        async function consultarGroqWorker(promptText) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: promptText,
                        context: historialDialogo,
                        lang: "es-ES"
                    })
                });
                const data = await response.json();
                return data.reply || "...";
            } catch (error) {
                console.error("Error en enlace Worker-Groq:", error);
                return "Sincronizando canales alternativos de telemetría...";
            }
        }

        async function generarYReproducirVoz(texto, avatar) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: texto, voice: "male", speaker: avatar })
                });

                if (response.ok && response.headers.get("content-type")?.includes("audio")) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);

                    return new Promise((resolve) => {
                        audio.onplay = () => { currentSpeaker = avatar; };
                        const endHandler = () => {
                            currentSpeaker = null;
                            URL.revokeObjectURL(audioUrl);
                            resolve();
                        };
                        audio.onended = endHandler;
                        audio.onerror = endHandler;
                        audio.play().catch(() => { currentSpeaker = null; resolve(); });
                    });
                } else {
                    return new Promise((resolve) => {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(texto.replace(/[*#_`]/g, ""));
                        const voices = window.speechSynthesis.getVoices();
                        const esVoices = voices.filter(v => v.lang.startsWith("es"));
                        
                        const filtrosMasculinos = ["raul", "david", "jorge", "juan", "pablo", "mateo", "carlos", "enrique", "male"];
                        const maleVoices = esVoices.filter(v => 
                            filtrosMasculinos.some(firma => v.name.toLowerCase().includes(firma))
                        );

                        if (avatar === "Luis") {
                            utterance.voice = maleVoices[0] || esVoices[1] || esVoices[0];
                            utterance.pitch = 0.60; 
                            utterance.rate = 0.90;
                        } else {
                            utterance.voice = maleVoices[1] || maleVoices[0] || esVoices[0];
                            utterance.pitch = 0.85; 
                            utterance.rate = 1.02;
                        }

                        utterance.onstart = () => { currentSpeaker = avatar; };
                        const endHandler = () => { currentSpeaker = null; setTimeout(resolve, 400); };
                        utterance.onend = endHandler;
                        utterance.onerror = endHandler;
                        window.speechSynthesis.speak(utterance);
                    });
                }
            } catch (error) {
                console.error("Error en procesador de voz:", error);
            }
        }

        function setupMouthTrackingBabylon(rootMesh, targetArray) {
            if (!rootMesh) return;
            const childMeshes = rootMesh.getChildMeshes();
            
            childMeshes.forEach(mesh => {
                const name = (mesh.name || "").toLowerCase();
                if (mesh.morphTargetManager) {
                    const manager = mesh.morphTargetManager;
                    for (let i = 0; i < manager.numTargets; i++) {
                        const targetName = manager.getTarget(i).name.toLowerCase();
                        if (targetName.includes("mouth") || targetName.includes("jaw") || targetName.includes("lip") || targetName.includes("viseme") || targetName.includes("open")) {
                            targetArray.push({ type: "morph", manager: manager, target: manager.getTarget(i) });
                        }
                    }
                }
                if (name.includes("mouth") || name.includes("jaw") || name.includes("head") || name.includes("lip")) {
                    if (!targetArray.some(t => t.mesh === mesh)) {
                        targetArray.push({ type: "mesh", mesh: mesh, originalScaleY: mesh.scaling.y });
                    }
                }
            });
        }

        async function iniciarInteraccionAvatares() {
            hudLog.innerText = "";
            let hablanteActual = "Agente";
            let ultimoMensaje = "Hola Luis. Sistemas móviles e interfaz cinemática sincronizados perfectamente. El canal de voz masculino está abierto. ¿Qué pruebas iniciamos?";
            
            reportHUD(hablanteActual, ultimoMensaje, "#00ffcc");
            historialDialogo.push({ role: "user", content: `Agente: ${ultimoMensaje}` });
            
            await generarYReproducirVoz(ultimoMensaje, hablanteActual);

            while (true) {
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                
                let contextoPrompt = "";
                if (hablanteActual === "Luis") {
                    contextoPrompt = `[Eres Luis, ingeniero senior de pruebas físicas electrónicas. Responde con un enfoque innovador, directo y conciso de 2 a 4 frases técnicas realistas]: ${ultimoMensaje}`;
                } else {
                    contextoPrompt = `[Eres el Agente, una IA analítica avanzada masculina. Da soporte y datos breves a Luis]: ${ultimoMensaje}`;
                }

                let respuesta = await consultarGroqWorker(contextoPrompt);

                if (respuesta) {
                    ultimoMensaje = respuesta;
                    let colorHUD = (hablanteActual === "Luis") ? "#00a2ff" : "#00ffcc";
                    
                    reportHUD(hablanteActual, ultimoMensaje, colorHUD);
                    historialDialogo.push({ role: "user", content: `${hablanteActual}: ${ultimoMensaje}` });
                    
                    if (historialDialogo.length > 14) historialDialogo.splice(0, 2);
                    
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                }
                await new Promise(resolve => setTimeout(resolve, 1400));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let camera; 
        let agenteRoot, luisRoot;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 4.5, new BABYLON.Vector3(0, 1.2, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.0; 
            camera.upperRadiusLimit = 80; 
            camera.panningSensibility = 1500; 

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.9;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(5, 12, 5);
            dirLight.intensity = 0.7;

            const statusText = document.getElementById("status");

            // 1. Entorno Ciudad
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Ciudad en línea. Acoplando Agente...";

                // 2. Modelo Agente
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, particleSystems, skeletons, animationGroups) {
                    statusText.innerText = "Agente listo. Cargando Avatar de Luis...";
                    
                    agenteRoot = agentMeshes[0];
                    agentAnimations = animationGroups;

                    if(agenteRoot) {
                        agenteRoot.rotationQuaternion = null; 
                        agenteRoot.position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        setupMouthTrackingBabylon(agenteRoot, mouthTargetsAgente);
                    }

                    if (agentAnimations.length > 0) {
                        agentAnimations.forEach(group => group.start(true));
                    }

                    // 3. Tu Avatar Luis
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, readyParticles, readySkeletons, animationGroups) {
                        luisRoot = luisMeshes[0];
                        luisAnimations = animationGroups;

                        if(luisRoot) {
                            luisRoot.rotationQuaternion = null; 
                            luisRoot.position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            setupMouthTrackingBabylon(luisRoot, mouthTargetsLuis);
                        }

                        if (luisAnimations.length > 0) {
                            luisAnimations.forEach(anim => anim.start(true));
                        }

                        // Cambio de estado para habilitar el botón de desbloqueo táctil
                        document.getElementById("load-title").innerText = "⚙️ SISTEMA INTERAI COMPLETO";
                        statusText.innerText = "Listo para iniciar transmisiones de laboratorio.";
                        document.getElementById("start-btn").style.display = "block";
                    });
                });
            }, null, function (scene, message, exception) {
                statusText.innerText = "Error de inicialización de entornos.";
                console.error(message, exception);
            });

            // --- BUCLE CINEMÁTICO ADAPTADO ---
            scene.registerBeforeRender(() => {
                let ahora = Date.now();

                // Freno cinemático en extremidades para evitar braceos mecánicos continuos
                if (luisAnimations.length > 0) {
                    luisAnimations.forEach(anim => {
                        anim.speedRatio = (currentSpeaker === "Luis") ? 0.30 : 0.03;
                    });
                }
                if (agentAnimations.length > 0) {
                    agentAnimations.forEach(anim => {
                        anim.speedRatio = (currentSpeaker === "Agente") ? 0.30 : 0.03;
                    });
                }

                // Cabeceo procedural amortiguado de ~30 segundos
                if (ahora > proximoCambioGaze) {
                    proximoCambioGaze = ahora + 25000 + Math.random() * 10000;
                    
                    if (Math.random() > 0.35) {
                        desvioMiradaAgente.set((Math.random() - 0.5) * 0.25, (Math.random() - 0.4) * 0.12, (Math.random() - 0.5) * 0.15);
                        desvioMiradaLuis.set((Math.random() - 0.5) * 0.25, (Math.random() - 0.4) * 0.12, (Math.random() - 0.5) * 0.15);
                    } else {
                        desvioMiradaAgente.setAll(0);
                        desvioMiradaLuis.setAll(0);
                    }
                }

                // Interpolación fluida de mirada (Lerp) para erradicar tirones
                if (agenteRoot && luisRoot) {
                    let objetivoAgente = new BABYLON.Vector3(luisRoot.position.x, agenteRoot.position.y, luisRoot.position.z).add(desvioMiradaAgente);
                    let objetivoLuis = new BABYLON.Vector3(COORDENADAS.agente.x, luisRoot.position.y, COORDENADAS.agente.z).add(desvioMiradaLuis);

                    actualTargetAgente = BABYLON.Vector3.Lerp(actualTargetAgente, objetivoAgente, 0.025);
                    actualTargetLuis = BABYLON.Vector3.Lerp(actualTargetLuis, objetivoLuis, 0.025);

                    agenteRoot.lookAt(actualTargetAgente);
                    agenteRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);

                    luisRoot.lookAt(actualTargetLuis);
                    luisRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
                }

                // Ondas senoidales estables para modulación de labios
                if (currentSpeaker) {
                    let targets = (currentSpeaker === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                    let wave = Math.abs(Math.sin(ahora * 0.015) * 0.6 + Math.sin(ahora * 0.035) * 0.4);

                    targets.forEach(t => {
                        if (t.type === "morph") {
                            t.target.influence = wave;
                        } else if (t.type === "mesh") {
                            t.mesh.scaling.y = t.originalScaleY - (wave * 0.05);
                        }
                    });
                } else {
                    [mouthTargetsAgente, mouthTargetsLuis].forEach(targets => {
                        targets.forEach(t => {
                            if (t.type === "morph") t.target.influence = 0;
                            if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY;
                        });
                    });
                }
            });

            return scene;
        };

        const scene = createScene();

        function resetCamaraOrigen() {
            if(camera) {
                camera.alpha = -Math.PI / 2;
                camera.beta = Math.PI / 2.3;
                camera.radius = 4.5;
                camera.target = new BABYLON.Vector3(0, 1.2, 3);
            }
        }

        function regresarAlIndex() {
            window.speechSynthesis.cancel();
            window.location.href = "index.html"; 
        }

        window.addEventListener("resize", function () {
            engine.resize();
        });

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
