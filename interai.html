<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterAI - Entorno de Pruebas</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        #instructions-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 162, 255, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            text-align: center;
            border: 1px solid #00ffe5;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h3>Sistema InterAI</h3>
        <p id="status">Cargando elementos del entorno...</p>
    </div>

    <div id="instructions-ui">
        Anclados en zona despejada. 🖱️ <b>Clic Derecho:</b> Desplazarse por la ciudad | 🎡 <b>Rueda:</b> Zoom
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // =======================================================================
        // 🛠️ PANEL DE CONTROL DE POSICIONES (Modifica estos números fácilmente)
        // =======================================================================
        const COORDENADAS = {
            agente: {
                x: -2.5,       // Movido más a la izquierda para librar el poste
                y: 0.02,       // BAJADO de 0.25 a 0.02 para que pise el suelo
                z: 3.0,        // Movido hacia adelante (eje Z) para sacarlo del poste por completo
                rotacion: -Math.PI / 2  // Girado 180° respecto al anterior para que mire a Luis
            },
            luisavatar: {
                x: 2.5,        // Movido más a la derecha frente al agente
                y: 0.02,       // BAJADO de 0.25 a 0.02 para que pise el suelo
                z: 3.0,        // Alineado en el mismo eje Z despejado
                rotacion: Math.PI / 2   // Girado para mirar de frente al agente
            }
        };
        // =======================================================================

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.04, 1);

            // Cámara con paneo habilitado para explorar libremente
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 15, new BABYLON.Vector3(0, 1, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.5; 
            camera.upperRadiusLimit = 300; 
            camera.panningSensibility = 1000; // Clic derecho para arrastrar la cámara por las calles

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.85;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(5, 10, 5);
            dirLight.intensity = 0.6;

            const statusText = document.getElementById("status");

            // 1. Cargar la Ciudad (city2.glb)
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Ciudad cargada. Trayendo avatares...";

                // 2. Cargar Agente (agent.glb)
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, particleSystems, skeletons, animationGroups) {
                    statusText.innerText = "Agente cargado...";
                    
                    if(agentMeshes[0]) {
                        agentMeshes[0].rotationQuaternion = null; // Desbloquear rotación
                        
                        // Aplicar los valores del Panel de Control superior
                        agentMeshes[0].position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        agentMeshes[0].rotation = new BABYLON.Vector3(0, COORDENADAS.agente.rotacion, 0);
                    }

                    if (animationGroups.length > 0) {
                        animationGroups[0].start(true); 
                    }

                    // 3. Cargar tu Avatar (luisavatar4.glb)
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, readyParticles, readySkeletons, luisAnimations) {
                        statusText.innerText = "Sistema listo. Entorno y Avatares activos.";
                        
                        setTimeout(() => {
                            document.getElementById("loading-ui").style.display = "none";
                        }, 2000);

                        if(luisMeshes[0]) {
                            luisMeshes[0].rotationQuaternion = null; // Desbloquear rotación
                            
                            // Aplicar los valores del Panel de Control superior
                            luisMeshes[0].position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            luisMeshes[0].rotation = new BABYLON.Vector3(0, COORDENADAS.luisavatar.rotacion, 0);
                        }

                        if (luisAnimations.length > 0) {
                            luisAnimations[0].start(true);
                        }
                    });
                });
            }, null, function (scene, message, exception) {
                statusText.innerText = "Error al cargar los modelos. Revisa los archivos.";
                console.error(message, exception);
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
