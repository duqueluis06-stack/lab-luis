<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InterAI - Normalización Geométrica</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background-color: #030308; font-family: 'Arial', sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }
        
        #loading-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            color: #00ffcc; background: #06060f; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; padding: 20px; text-align: center; font-family: monospace;
        }
        #start-btn {
            display: none; margin-top: 20px; padding: 16px 32px;
            background: linear-gradient(90deg, #00ffcc, #00a2ff); border: 2px solid #fff;
            color: #000; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        
        #comic-container { position: absolute; bottom: 12px; left: 4%; width: 92%; display: flex; justify-content: space-between; gap: 12px; z-index: 100; pointer-events: none; }
        .comic-cloud { flex: 1; background: #ffffff; color: #000000; border: 2.5px solid #000000; border-radius: 16px; padding: 10px 14px; font-size: 11.5px; font-weight: bold; box-shadow: 4px 4px 0px rgba(0, 0, 0, 1); opacity: 0.15; transition: all 0.25s ease-out; }
        .comic-cloud.active { opacity: 1 !important; transform: scale(1) translateY(-2px); }

        #joystick-container { position: absolute; top: 20px; left: 20px; z-index: 150; width: 76px; height: 76px; background: rgba(6, 6, 15, 0.65); border: 2px solid #00ffcc; border-radius: 50%; display: flex; justify-content: center; align-items: center; touch-action: none; }
        #joystick-knob { width: 28px; height: 28px; background: #00ffcc; border-radius: 50%; }

        .control-btn { position: absolute; top: 20px; padding: 10px 14px; font-size: 10px; font-weight: bold; font-family: monospace; border: 2px solid #000; border-radius: 6px; cursor: pointer; z-index: 150; }
        #reset-camera-btn { right: 90px; color: #000; background: #00ffcc; }
        #exit-btn { right: 15px; color: #fff; background: #d90429; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h2 id="load-title" style="margin:0 0 10px 0; font-size:15px; color:#00ffcc;">⚙️ FORZADO DE MATRICES GEOMÉTRICAS</h2>
        <p id="status" style="margin:0; font-size:12px; color:#fff;">ANALIZANDO ESTRUCTURA DE COMPONENTES...</p>
        <button id="start-btn" onclick="desbloquearAudioYComenzar()">⚡ ENTRAR A LA SIMULACIÓN</button>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <button id="reset-camera-btn" class="control-btn" onclick="resetCamaraOrigen()">🎥 CENTRAR</button>
    <button id="exit-btn" class="control-btn" onclick="regresarAlIndex()">🚪 SALIR</button>

    <div id="comic-container">
        <div id="bubble-agente" class="comic-cloud"><div id="text-agente">...</div></div>
        <div id="bubble-luis" class="comic-cloud"><div id="text-luis">...</div></div>
    </div>

    <canvas id="renderCanvas" tabindex="0"></canvas>

    <script>
        const COORDENADAS_BASE = {
            agente: { x: -2.84, y: 0.01, z: 3.0 },
            luisavatar: { x: -2.66, y: 0.01, z: 3.0 }
        };

        const CALIBRACION_FIJA = { x: 1.30, y: 0.0, z: -2.10, escala: 0.08 };
        const WORKER_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [];
        let mouthTargetsAgente = [], mouthTargetsLuis = [];
        let agentAnimations = [], luisAnimations = [];
        let currentSpeaker = null, activeUtterance = null; 

        let dodgeRoot = null, caspitaRoot = null;
        let desvioMiradaAgente = new BABYLON.Vector3(0,0,0), desvioMiradaLuis = new BABYLON.Vector3(0,0,0);
        let actualTargetAgente = new BABYLON.Vector3(COORDENADAS_BASE.luisavatar.x, COORDENADAS_BASE.agente.y, COORDENADAS_BASE.luisavatar.z);
        let actualTargetLuis = new BABYLON.Vector3(COORDENADAS_BASE.agente.x, COORDENADAS_BASE.luisavatar.y, COORDENADAS_BASE.agente.z);
        let proximoCambioGaze = Date.now() + 6000;

        const boxAgente = document.getElementById("bubble-agente"), boxLuis = document.getElementById("bubble-luis");
        const textAgente = document.getElementById("text-agente"), textLuis = document.getElementById("text-luis");

        function precargarVoces() {
            if (typeof speechSynthesis !== 'undefined') {
                window.speechSynthesis.getVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
                }
            }
        }
        precargarVoces();

        function actualizarViñetasUI(hablante, texto) {
            if (hablante === "Agente") {
                boxAgente.classList.add("active"); boxLuis.classList.remove("active");
                textAgente.innerText = `● AGENTE IA:\n${texto}`;
            } else {
                boxLuis.classList.add("active"); boxAgente.classList.remove("active");
                textLuis.innerText = `● LUIS AVATAR:\n${texto}`;
            }
        }

        function desbloquearAudioYComenzar() {
            document.getElementById("loading-ui").style.display = "none";
            iniciarInteraccionAvatares();
        }

        async function consultarGroqWorker(promptText) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: promptText, context: historialDialogo, lang: "es-ES" })
                });
                const data = await response.json();
                return data.reply || "...";
            } catch (e) { return "Interrupción de enlace neuronal..."; }
        }

        async function generarYReproducirVoz(texto, avatar) {
            return new Promise((resolve) => {
                let yaResuelto = false;
                const liberarBucle = () => { if (!yaResuelto) { yaResuelto = true; currentSpeaker = null; clearTimeout(timeoutSeguridad); setTimeout(resolve, 150); } };
                const timeoutSeguridad = setTimeout(liberarBucle, (texto.length * 85) + 2500);
                try {
                    if (typeof window.speechSynthesis === 'undefined') { liberarBucle(); return; }
                    window.speechSynthesis.cancel();
                    let limpio = texto.replace(/[*#_`]/g, "");
                    activeUtterance = new SpeechSynthesisUtterance(limpio);
                    activeUtterance.lang = "es-MX"; 
                    let voces = window.speechSynthesis.getVoices();
                    let esVoces = voces.filter(v => /^es/i.test(v.lang));
                    if (esVoces.length > 0) activeUtterance.voice = esVoces[0];
                    activeUtterance.onstart = () => { currentSpeaker = avatar; };
                    activeUtterance.onend = liberarBucle; activeUtterance.onerror = liberarBucle;
                    window.speechSynthesis.speak(activeUtterance);
                } catch (err) { liberarBucle(); }
            });
        }

        function setupMouthTrackingBabylon(rootMesh, targetArray) {
            if (!rootMesh) return;
            rootMesh.getChildMeshes().forEach(mesh => {
                if (mesh.morphTargetManager) {
                    const m = mesh.morphTargetManager;
                    for (let i = 0; i < m.numTargets; i++) {
                        let tn = m.getTarget(i).name.toLowerCase();
                        if (tn.includes("mouth") || tn.includes("jaw") || tn.includes("lip") || tn.includes("open")) {
                            targetArray.push({ type: "morph", manager: m, target: m.getTarget(i) });
                        }
                    }
                }
            });
        }

        async function iniciarInteraccionAvatares() {
            let hablanteActual = "Agente";
            let ultimoMensaje = "El cubo de calibración responde bien, Luis. El problema del Dodge parece ser un colapso de escala molecular en su archivo de origen.";
            actualizarViñetasUI(hablanteActual, ultimoMensaje);
            while (true) {
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                let promptText = `Genera una continuación muy breve sobre reparar la simulación para: "${ultimoMensaje}"`;
                let respuesta = await consultarGroqWorker(promptText);
                if (respuesta && respuesta !== "...") {
                    ultimoMensaje = respuesta;
                    actualizarViñetasUI(hablanteActual, ultimoMensaje);
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                }
                await new Promise(r => setTimeout(r, 2800));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let camera, scene, agenteRoot, luisRoot;

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.2, 1.40, new BABYLON.Vector3(-0.24, 0.1, 0.90), scene);
            camera.attachControl(canvas, true);

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.95;

            // 🟩 CUBO DE DIAGNÓSTICO
            let debugBox = BABYLON.MeshBuilder.CreateBox("debugBox", {size: 0.3}, scene);
            debugBox.position.set(-1.7, 0.15, 0.2); 
            let debugMat = new BABYLON.StandardMaterial("debugMat", scene);
            debugMat.emissiveColor = new BABYLON.Color3(0, 1, 0); 
            debugMat.wireframe = true;
            debugBox.material = debugMat;

            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function () {
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, p, s, animationGroups) {
                    agenteRoot = agentMeshes[0]; agentAnimations = animationGroups;
                    if(agenteRoot) { agenteRoot.rotationQuaternion = null; setupMouthTrackingBabylon(agenteRoot, mouthTargetsAgente); }
                    if (agentAnimations.length > 0) agentAnimations.forEach(g => g.start(true));

                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, rp, rs, anims) {
                        luisRoot = luisMeshes[0]; luisAnimations = anims;
                        if(luisRoot) { luisRoot.rotationQuaternion = null; setupMouthTrackingBabylon(luisRoot, mouthTargetsLuis); }
                        if (luisAnimations.length > 0) luisAnimations.forEach(anim => anim.start(true));

                        let modelosRestantes = 2;
                        const verificarCargaCompleta = () => {
                            modelosRestantes--;
                            if (modelosRestantes === 0) {
                                document.getElementById("status").innerText = "SISTEMA OPERATIVO - NORMALIZACIÓN INTEGRADA";
                                document.getElementById("start-btn").style.display = "block";
                                aplicarPosicionesFijas();
                            }
                        };

                        // 1. Cáspita
                        BABYLON.SceneLoader.ImportMesh("", "./", "caspita.glb", scene, function (cMeshes) {
                            caspitaRoot = cMeshes[0];
                            caspitaRoot.position.set(-1.7, 0.0, 1.45); 
                            caspitaRoot.scaling.set(0.12, 0.12, 0.12);
                            verificarCargaCompleta();
                        }, null, function() { verificarCargaCompleta(); });

                        // 2. Dodge con Reparador de Jerarquías y Escalas en Caliente
                        BABYLON.SceneLoader.ImportMesh("", "./", "dodge.glb", scene, function (dMeshes) {
                            dodgeRoot = dMeshes[0];
                            
                            // Asegurar visibilidad absoluta de todas las sub-mallas nativas
                            dMeshes.forEach(mesh => {
                                mesh.setEnabled(true);
                                mesh.isVisible = true;
                                if (mesh.material) mesh.material.backFaceCulling = false; // Evita normales invertidas invisibles
                            });

                            // ⚡ ALGORITMO DE NORMALIZACIÓN DINÁMICA:
                            // Forzamos a Babylon a calcular la caja de impacto real de todo el objeto combinado
                            dodgeRoot.refreshBoundingInfo(true);
                            let hierarchyBounds = dodgeRoot.getHierarchyBoundingVectors(true);
                            let size = hierarchyBounds.max.subtract(hierarchyBounds.min);
                            let maxDimension = Math.max(size.x, size.y, size.z);
                            
                            // Si el tamaño detectado es coherente, recalculamos la escala para que encaje con el entorno (objetivo ~0.3 unidades)
                            if (maxDimension > 0) {
                                let factorEscalaDeseado = 0.3 / maxDimension;
                                dodgeRoot.scaling.set(factorEscalaDeseado, factorEscalaDeseado, factorEscalaDeseado);
                            } else {
                                // Fallback por si la jerarquía root rompe el cálculo
                                dodgeRoot.scaling.set(0.12, 0.12, 0.12);
                            }

                            // Posicionar exactamente dentro de las coordenadas del cubo verde
                            dodgeRoot.position.set(-1.7, 0.15, 0.2); 
                            
                            console.log("📐 Telemetría Dodge - Escala calculada:", dodgeRoot.scaling.toString());
                            verificarCargaCompleta();
                        }, null, function(s, msg) {
                            document.getElementById("status").innerHTML = `<span style="color:#ff4444;">⚠️ ERROR CRÍTICO FILE: ${msg}</span>`;
                            verificarCargaCompleta();
                        });
                    });
                });
            });

            scene.registerBeforeRender(() => {
                let ahora = Date.now();
                if (joystickActive) { camera.alpha += joystickMoveX * 0.025; camera.beta += joystickMoveY * 0.018; }
                if (currentSpeaker) {
                    let targets = (currentSpeaker === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                    let wave = Math.abs(Math.sin(ahora * 0.02) * 0.8);
                    targets.forEach(t => { if (t.type === "morph") t.target.influence = wave; });
                }
            });

            return scene;
        };

        function aplicarPosicionesFijas() {
            if (agenteRoot) {
                agenteRoot.position.set(COORDENADAS_BASE.agente.x + CALIBRACION_FIJA.x, COORDENADAS_BASE.agente.y + CALIBRACION_FIJA.y, COORDENADAS_BASE.agente.z + CALIBRACION_FIJA.z);
                agenteRoot.scaling.set(CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala);
            }
            if (luisRoot) {
                luisRoot.position.set(COORDENADAS_BASE.luisavatar.x + CALIBRACION_FIJA.x, COORDENADAS_BASE.luisavatar.y + CALIBRACION_FIJA.y, COORDENADAS_BASE.luisavatar.z + CALIBRACION_FIJA.z);
                luisRoot.scaling.set(CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala);
            }
        }

        let joystickContainer = document.getElementById("joystick-container"), joystickKnob = document.getElementById("joystick-knob");
        let joystickActive = false, joystickStartX = 0, joystickStartY = 0, joystickMoveX = 0, joystickMoveY = 0;

        joystickContainer.addEventListener("pointerdown", (e) => { joystickActive = true; joystickStartX = e.clientX; joystickStartY = e.clientY; joystickContainer.setPointerCapture(e.pointerId); });
        joystickContainer.addEventListener("pointermove", (e) => {
            if (!joystickActive) return;
            let dx = e.clientX - joystickStartX, dy = e.clientY - joystickStartY;
            let dist = Math.sqrt(dx*dx + dy*dy), maxRadius = 22;
            if (dist > maxRadius) { dx = (dx/dist)*maxRadius; dy = (dy/dist)*maxRadius; }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickMoveX = dx / maxRadius; joystickMoveY = dy / maxRadius;
        });
        const detenerJoystick = () => { joystickActive = false; joystickKnob.style.transform = "translate(0px, 0px)"; joystickMoveX = 0; joystickMoveY = 0; };
        joystickContainer.addEventListener("pointerup", detenerJoystick); joystickContainer.addEventListener("pointercancel", detenerJoystick);

        createScene();

        function resetCamaraOrigen() { if(camera) { camera.alpha = -Math.PI / 2; camera.beta = Math.PI / 2.2; camera.radius = 1.40; } }
        function regresarAlIndex() { if (typeof window.speechSynthesis !== 'undefined') window.speechSynthesis.cancel(); window.location.href = "index.html"; }

        engine.runRenderLoop(() => { if (scene && scene.activeCamera) scene.render(); });
        window.addEventListener("resize", function () { engine.resize(); });
    </script>
</body>
</html>
