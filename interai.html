<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterAI - Entorno de Pruebas</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        #instructions-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 162, 255, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            text-align: center;
            border: 1px solid #00ffe5;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h3>Sistema InterAI</h3>
        <p id="status">Cargando elementos del entorno...</p>
    </div>

    <div id="instructions-ui">
        🖱️ <b>Clic Izquierdo:</b> Rotar cámara | 🎡 <b>Rueda:</b> Zoom | 🖱️ <b>Clic Derecho:</b> Desplazarse por la ciudad
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.04, 1);

            // CÁMARA MEJORADA: Se aumentó el límite de alejamiento a 250 para explorar toda la ciudad
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 12, new BABYLON.Vector3(0, 1, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.5; 
            camera.upperRadiusLimit = 250; // Permite un zoom out masivo
            camera.panningSensibility = 1000; // Activa y suaviza el movimiento libre por el mapa (Clic derecho)

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.85;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(5, 10, 5);
            dirLight.intensity = 0.6;

            const statusText = document.getElementById("status");

            // 1. Cargar el Entorno (city2.glb)
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Ciudad cargada. Trayendo avatares...";

                // 2. Cargar Agente (agent.glb)
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, particleSystems, skeletons, animationGroups) {
                    statusText.innerText = "Agente cargado...";
                    
                    if(agentMeshes[0]) {
                        // Forzar a Babylon a ignorar quaternions nativos para permitir rotación manual limpia
                        agentMeshes[0].rotationQuaternion = null;
                        
                        // CORRECCIÓN: Y aumentado a 0.25 para sacar los pies del cemento
                        agentMeshes[0].position = new BABYLON.Vector3(-1.8, 0.25, 0);
                        
                        // CORRECCIÓN: Rotación fijada para mirar hacia el frente (+X)
                        agentMeshes[0].rotation = new BABYLON.Vector3(0, Math.PI / 2, 0);
                    }

                    if (animationGroups.length > 0) {
                        animationGroups[0].start(true); 
                    }

                    // 3. Cargar tu Avatar (luisavatar4.glb)
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, readyParticles, readySkeletons, luisAnimations) {
                        statusText.innerText = "Sistema listo. Entorno y Avatares activos.";
                        
                        setTimeout(() => {
                            document.getElementById("loading-ui").style.display = "none";
                        }, 2500);

                        if(luisMeshes[0]) {
                            // Forzar a Babylon a ignorar quaternions nativos
                            luisMeshes[0].rotationQuaternion = null;
                            
                            // CORRECCIÓN: Y aumentado a 0.25 para sacar los pies del cemento
                            luisMeshes[0].position = new BABYLON.Vector3(1.8, 0.25, 0);
                            
                            // CORRECCIÓN: Rotación invertida para mirar directamente al agente (-X)
                            luisMeshes[0].rotation = new BABYLON.Vector3(0, -Math.PI / 2, 0);
                        }

                        if (luisAnimations.length > 0) {
                            luisAnimations[0].start(true);
                        }
                    });
                });
            }, null, function (scene, message, exception) {
                statusText.innerText = "Error al cargar los modelos. Revisa los archivos.";
                console.error(message, exception);
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
