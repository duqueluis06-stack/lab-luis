<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InterAI - Entorno de Pruebas Tácticas</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: monospace;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        /* PANTALLA DE INICIO Y DESBLOQUEO DE AUDIO */
        #loading-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #00ffcc;
            background: rgba(4, 4, 10, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }
        #start-btn {
            display: none;
            margin-top: 20px;
            padding: 16px 32px;
            background: linear-gradient(90deg, #00ffcc, #00a2ff);
            border: none;
            border-radius: 4px;
            color: #000;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            letter-spacing: 1px;
        }
        
        /* CONSOLA HUD INFERIOR EXCLUSIVA PARA MÓVILES */
        #hud-console {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            max-height: 280px;
            background: rgba(5, 5, 12, 0.95);
            border: 1px solid #00a2ff;
            border-radius: 4px;
            color: #00a2ff;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.2);
            z-index: 100;
            overflow-y: auto;
        }
        .hud-header {
            font-weight: bold;
            color: #ffb703;
            font-size: 11px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 162, 255, 0.3);
            padding-bottom: 4px;
        }
        #hud-log {
            font-size: 11px;
            color: #fff;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        #instructions-ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(2, 2, 8, 0.85);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(0, 255, 229, 0.4);
            z-index: 9;
            white-space: nowrap;
        }
        .mobile-ins { display: none; }
        
        .control-btn {
            position: absolute;
            bottom: 20px;
            padding: 12px 22px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }
        #reset-camera-btn {
            right: 200px;
            color: #ffffff;
            background: linear-gradient(90deg, #00a2ff, #00ffe5);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }
        #exit-btn {
            right: 20px;
            color: #ffffff;
            background: linear-gradient(90deg, #d90429, #ef233c);
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.3);
        }

        @media (max-width: 768px) {
            #instructions-ui {
                top: 12px;
                bottom: auto;
                left: 12px;
                right: 12px;
                transform: none;
                width: auto;
                font-size: 10px;
                padding: 8px;
                white-space: normal;
            }
            #hud-console {
                top: auto;
                bottom: 75px; 
                left: 12px;
                right: 12px;
                width: auto;
                max-height: 110px;
                padding: 10px;
            }
            .desktop-ins { display: none; }
            .mobile-ins { display: inline; }
            .control-btn {
                bottom: 15px;
                padding: 14px 10px;
                font-size: 10px;
                width: 45%;
                text-align: center;
            }
            #reset-camera-btn { left: 12px; right: auto; }
            #exit-btn { right: 12px; }
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h2 id="load-title" style="margin:0 0 10px 0; font-size:16px; letter-spacing:1px; color:#00ffcc;">⚙️ CONECTANDO MATRIZ INTERAI</h2>
        <p id="status" style="margin:0; font-size:12px; color:#fff;">Inicializando hardware gráfico móvil...</p>
        <button id="start-btn" onclick="desbloquearAudioYComenzar()">⚡ ENTRAR AL ENTORNO (ACTIVAR VOZ)</button>
    </div>

    <div id="hud-console">
        <div class="hud-header">📡 MONITOR DE AUDIO (DOS CANALES MASCULINOS)</div>
        <div id="hud-log">Esperando transceptores...</div>
    </div>

    <div id="instructions-ui">
        <span class="desktop-ins">💾 <b>Clic Izquierdo:</b> Rotar | 🎡 <b>Zoom</b></span>
        <span class="mobile-ins">📱 <b>1 Dedo:</b> Rotar | 🤏 <b>Pellizco:</b> Zoom (Cabezas despejadas)</span>
    </div>

    <button id="reset-camera-btn" class="control-btn" onclick="resetCamaraOrigen()">🎥 ENFOCAR AVATARES</button>
    <button id="exit-btn" class="control-btn" onclick="regresarAlIndex()">🚪 INICIO (INDEX)</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        const COORDENADAS = {
            agente: { x: -0.8, y: 0.05, z: 3.0 },
            luisavatar: { x: 0.8, y: 0.05, z: 3.0 }
        };

        const WORKER_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [];
        let mouthTargetsAgente = [];
        let mouthTargetsLuis = [];
        let agentAnimations = [];
        let luisAnimations = [];
        let currentSpeaker = null; 

        let desvioMiradaAgente = new BABYLON.Vector3(0, 0, 0);
        let desvioMiradaLuis = new BABYLON.Vector3(0, 0, 0);
        let actualTargetAgente = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.agente.y, COORDENADAS.luisavatar.z);
        let actualTargetLuis = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.luisavatar.y, COORDENADAS.agente.z);
        let proximoCambioGaze = Date.now() + 8000; 

        const statusText = document.getElementById("status");
        const hudLog = document.getElementById("hud-log");

        function reportHUD(avatar, msg, color = "#fff") {
            const div = document.createElement("div");
            div.style.color = color;
            div.style.marginBottom = "8px";
            div.innerText = `[${avatar.toUpperCase()}]: ${msg}`;
            hudLog.appendChild(div);
            document.getElementById("hud-console").scrollTop = document.getElementById("hud-console").scrollHeight;
        }

        function desbloquearAudioYComenzar() {
            if (typeof window.speechSynthesis !== 'undefined') {
                window.speechSynthesis.cancel();
                let desbloqueo = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(desbloqueo);
            }
            document.getElementById("loading-ui").style.display = "none";
            iniciarInteraccionAvatares();
        }

        async function consultarGroqWorker(promptText) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: promptText, context: historialDialogo, lang: "es-ES" })
                });
                const data = await response.json();
                return data.reply || "...";
            } catch (error) {
                return "Sincronizando canales de telemetría de respaldo...";
            }
        }

        async function generarYReproducirVoz(texto, avatar) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: texto, voice: "male", speaker: avatar })
                });

                if (response.ok && response.headers.get("content-type")?.includes("audio")) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);

                    return new Promise((resolve) => {
                        audio.onplay = () => { currentSpeaker = avatar; };
                        const endHandler = () => { currentSpeaker = null; URL.revokeObjectURL(audioUrl); resolve(); };
                        audio.onended = endHandler; audio.onerror = endHandler;
                        audio.play().catch(() => { currentSpeaker = null; resolve(); });
                    });
                } else {
                    // Fallback estricto de iOS - Exclusión de voces femeninas Apple
                    return new Promise((resolve) => {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(texto.replace(/[*#_`]/g, ""));
                        const voices = window.speechSynthesis.getVoices();
                        const esVoices = voices.filter(v => v.lang.startsWith("es"));
                        
                        // Lista negra explícita para evitar que iOS asigne una mujer por defecto
                        const nombresFemeninos = ["monica", "marisol", "helena", "paula", "sara", "siri", "female", "mujer", "carmen", "lucia"];
                        const maleVoices = esVoices.filter(v => 
                            !nombresFemeninos.some(femenino => v.name.toLowerCase().includes(femenino))
                        );

                        // Asignación segura
                        if (avatar === "Luis") {
                            utterance.voice = maleVoices[0] || esVoices.find(v => v.name.toLowerCase().includes("jorge")) || esVoices[0];
                            utterance.pitch = 0.60; 
                            utterance.rate = 0.90;
                        } else {
                            utterance.voice = maleVoices[1] || maleVoices[0] || esVoices[0];
                            utterance.pitch = 0.82; 
                            utterance.rate = 1.02;
                        }

                        utterance.onstart = () => { currentSpeaker = avatar; };
                        const endHandler = () => { currentSpeaker = null; setTimeout(resolve, 400); };
                        utterance.onend = endHandler; utterance.onerror = endHandler;
                        window.speechSynthesis.speak(utterance);
                    });
                }
            } catch (error) {
                console.error("Fallo de audio:", error);
            }
        }

        function setupMouthTrackingBabylon(rootMesh, targetArray) {
            if (!rootMesh) return;
            rootMesh.getChildMeshes().forEach(mesh => {
                const name = (mesh.name || "").toLowerCase();
                if (mesh.morphTargetManager) {
                    const manager = mesh.morphTargetManager;
                    for (let i = 0; i < manager.numTargets; i++) {
                        const targetName = manager.getTarget(i).name.toLowerCase();
                        if (targetName.includes("mouth") || targetName.includes("jaw") || targetName.includes("lip") || targetName.includes("viseme") || targetName.includes("open")) {
                            targetArray.push({ type: "morph", manager: manager, target: manager.getTarget(i) });
                        }
                    }
                }
                if (name.includes("mouth") || name.includes("jaw") || name.includes("head") || name.includes("lip")) {
                    if (!targetArray.some(t => t.mesh === mesh)) {
                        targetArray.push({ type: "mesh", mesh: mesh, originalScaleY: mesh.scaling.y });
                    }
                }
            });
        }

        async function iniciarInteraccionAvatares() {
            hudLog.innerText = "";
            let hablanteActual = "Agente";
            let ultimoMensaje = "Hola Luis. Canal gráfico y de audio sincronizados en iPhone sin oclusión visual. ¿Iniciamos el protocolo de pruebas?";
            
            reportHUD(hablanteActual, ultimoMensaje, "#00ffcc");
            historialDialogo.push({ role: "user", content: `Agente: ${ultimoMensaje}` });
            await generarYReproducirVoz(ultimoMensaje, hablanteActual);

            while (true) {
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                let contextoPrompt = (hablanteActual === "Luis") 
                    ? `[Eres Luis, ingeniero de pruebas físicas electrónicas. Responde innovador y conciso en 2 frases]: ${ultimoMensaje}`
                    : `[Eres el Agente, una IA analítica masculina. Da soporte breve a Luis]: ${ultimoMensaje}`;

                let respuesta = await consultarGroqWorker(contextoPrompt);
                if (respuesta) {
                    ultimoMensaje = respuesta;
                    let colorHUD = (hablanteActual === "Luis") ? "#00a2ff" : "#00ffcc";
                    reportHUD(hablanteActual, ultimoMensaje, colorHUD);
                    historialDialogo.push({ role: "user", content: `${hablanteActual}: ${ultimoMensaje}` });
                    if (historialDialogo.length > 10) historialDialogo.splice(0, 2);
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                }
                await new Promise(resolve => setTimeout(resolve, 1400));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        // 🚨 CONFIGURACIÓN ANTIALIAS EN FALSE: Clave absoluta para evitar pantallas negras en iOS por falta de RAM
        const engine = new BABYLON.Engine(canvas, false, { adaptToDeviceRatio: true });
        let camera; 
        let agenteRoot, luisRoot;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 4.5, new BABYLON.Vector3(0, 1.2, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.0; camera.upperRadiusLimit = 40;
            camera.panningSensibility = 1800; 

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.9;

            // CONTROLADOR GLOBAL DE ERRORES DE CARGA GLB
            const errorHandler = (meshName) => (scene, msg, exc) => {
                statusText.style.color = "#ff3366";
                statusText.innerText = `⚠️ Fallo en hardware: No se encontró o falló ${meshName}`;
                console.error(msg, exc);
            };

            statusText.innerText = "Cargando mapa urbano base...";
            
            // 1. Ciudad
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Mapa acoplado. Descargando Agente...";

                // 2. Agente
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, p, s, animationGroups) {
                    statusText.innerText = "Agente en memoria. Descargando LuisAvatar4...";
                    agenteRoot = agentMeshes[0];
                    agentAnimations = animationGroups;

                    if(agenteRoot) {
                        agenteRoot.rotationQuaternion = null; 
                        agenteRoot.position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        setupMouthTrackingBabylon(agenteRoot, mouthTargetsAgente);
                    }
                    if (agentAnimations.length > 0) agentAnimations.forEach(g => g.start(true));

                    // 3. Tu Avatar Luis
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, rp, rs, animationGroups) {
                        luisRoot = luisMeshes[0];
                        luisAnimations = animationGroups;

                        if(luisRoot) {
                            luisRoot.rotationQuaternion = null; 
                            luisRoot.position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            setupMouthTrackingBabylon(luisRoot, mouthTargetsLuis);
                        }
                        if (luisAnimations.length > 0) luisAnimations.forEach(anim => anim.start(true));

                        document.getElementById("load-title").innerText = "⚙️ SISTEMA SESS-MÓVIL ONLINE";
                        statusText.innerText = "Memoria gráfica optimizada. Listo para iniciar.";
                        document.getElementById("start-btn").style.display = "block";
                    }, null, errorHandler("luisavatar4.glb"));
                }, null, errorHandler("agent.glb"));
            }, null, errorHandler("city2.glb"));

            // BUCLE DE SIMULACIÓN INTEGRAL SUAVIZADA
            scene.registerBeforeRender(() => {
                let ahora = Date.now();

                if (luisAnimations.length > 0) {
                    luisAnimations.forEach(anim => { anim.speedRatio = (currentSpeaker === "Luis") ? 0.30 : 0.03; });
                }
                if (agentAnimations.length > 0) {
                    agentAnimations.forEach(anim => { anim.speedRatio = (currentSpeaker === "Agente") ? 0.30 : 0.03; });
                }

                if (ahora > proximoCambioGaze) {
                    proximoCambioGaze = ahora + 25000 + Math.random() * 10000;
                    if (Math.random() > 0.35) {
                        desvioMiradaAgente.set((Math.random() - 0.5) * 0.23, (Math.random() - 0.4) * 0.11, (Math.random() - 0.5) * 0.13);
                        desvioMiradaLuis.set((Math.random() - 0.5) * 0.23, (Math.random() - 0.4) * 0.11, (Math.random() - 0.5) * 0.13);
                    } else {
                        desvioMiradaAgente.setAll(0); desvioMiradaLuis.setAll(0);
                    }
                }

                if (agenteRoot && luisRoot) {
                    let objetivoAgente = new BABYLON.Vector3(luisRoot.position.x, agenteRoot.position.y, luisRoot.position.z).add(desvioMiradaAgente);
                    let objetivoLuis = new BABYLON.Vector3(COORDENADAS.agente.x, luisRoot.position.y, COORDENADAS.agente.z).add(desvioMiradaLuis);

                    actualTargetAgente = BABYLON.Vector3.Lerp(actualTargetAgente, objetivoAgente, 0.025);
                    actualTargetLuis = BABYLON.Vector3.Lerp(actualTargetLuis, objetivoLuis, 0.025);

                    agenteRoot.lookAt(actualTargetAgente); agenteRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
                    luisRoot.lookAt(actualTargetLuis); luisRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
                }

                if (currentSpeaker) {
                    let targets = (currentSpeaker === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                    let wave = Math.abs(Math.sin(ahora * 0.015) * 0.6 + Math.sin(ahora * 0.035) * 0.4);
                    targets.forEach(t => {
                        if (t.type === "morph") t.target.influence = wave;
                        else if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY - (wave * 0.05);
                    });
                } else {
                    [mouthTargetsAgente, mouthTargetsLuis].forEach(targets => {
                        targets.forEach(t => {
                            if (t.type === "morph") t.target.influence = 0;
                            if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY;
                        });
                    });
                }
            });

            return scene;
        };

        const scene = createScene();

        function resetCamaraOrigen() {
            if(camera) {
                camera.alpha = -Math.PI / 2; camera.beta = Math.PI / 2.3; camera.radius = 4.5;
                camera.target = new BABYLON.Vector3(0, 1.2, 3);
            }
        }

        function regresarAlIndex() {
            window.speechSynthesis.cancel();
            window.location.href = "index.html"; 
        }

        engine.runRenderLoop(function () { scene.render(); });
        window.addEventListener("resize", function () { engine.resize(); });

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
