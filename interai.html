<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InterAI - Panel de Viñetas Cinemáticas</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #04040a;
            font-family: 'Courier New', Courier, monospace;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        /* PANTALLA DE AJUSTES INICIALES */
        #loading-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #00ffcc;
            background: #06060f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }
        #start-btn {
            display: none;
            margin-top: 20px;
            padding: 16px 32px;
            background: linear-gradient(90deg, #00ffcc, #00a2ff);
            border: 2px solid #fff;
            border-radius: 0px;
            color: #000;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            letter-spacing: 1px;
        }
        
        /* CONTENEDOR DE VIÑETAS ESTILO CÓMIC AÑOS 80 */
        #comic-container {
            position: absolute;
            bottom: 25px;
            left: 5%;
            width: 90%;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            z-index: 100;
            pointer-events: none;
        }
        
        .vignette {
            flex: 1;
            background: rgba(3, 3, 8, 0.92);
            border: 3px solid #333;
            padding: 14px;
            color: #fff;
            font-size: 13px;
            line-height: 1.4;
            transition: all 0.3s ease;
            opacity: 0.4;
            transform: scale(0.98);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.5);
        }
        
        /* Viñeta Izquierda - AGENTE */
        #vignette-agente {
            border-color: #00ffcc;
        }
        #vignette-agente .character-title {
            color: #00ffcc;
            font-weight: bold;
            border-bottom: 2px solid #00ffcc;
            margin-bottom: 6px;
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        /* Viñeta Derecha - LUIS */
        #vignette-luis {
            border-color: #ffb703;
        }
        #vignette-luis .character-title {
            color: #ffb703;
            font-weight: bold;
            border-bottom: 2px solid #ffb703;
            margin-bottom: 6px;
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        /* Estado Activo cuando el personaje habla */
        .vignette.active {
            opacity: 1 !important;
            transform: scale(1) translateY(-4px);
            background: rgba(10, 10, 25, 0.96);
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.7);
        }

        .control-btn {
            position: absolute;
            top: 20px;
            padding: 10px 18px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            border: 2px solid #fff;
            cursor: pointer;
            z-index: 10;
        }
        #reset-camera-btn {
            left: 20px;
            color: #000;
            background: #00ffcc;
        }
        #exit-btn {
            right: 20px;
            color: #fff;
            background: #d90429;
        }

        /* DISEÑO ADAPTADO PARA TU IPHONE */
        @media (max-width: 768px) {
            #comic-container {
                flex-direction: column;
                bottom: 15px;
                gap: 10px;
                left: 15px;
                width: calc(100% - 30px);
            }
            .vignette {
                padding: 10px;
                font-size: 11px;
            }
            .control-btn {
                top: auto;
                bottom: 240px; /* Sube los botones arriba de las viñetas */
                padding: 12px;
                width: 45%;
            }
            #reset-camera-btn { left: 15px; }
            #exit-btn { right: 15px; }
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h2 id="load-title" style="margin:0 0 10px 0; font-size:15px; color:#00ffcc;">⚙️ OPTIMIZANDO TRANSMISIÓN MULTICANAL</h2>
        <p id="status" style="margin:0; font-size:12px; color:#fff;">Ajustando búfer de texturas...</p>
        <button id="start-btn" onclick="desbloquearAudioYComenzar()">⚡ INICIAR PROTOCOLO DE VOZ</button>
    </div>

    <!-- 📺 DOS VIÑETAS INDEPENDIENTES ESTILO CÓMIC 80s -->
    <div id="comic-container">
        <div id="vignette-agente" class="vignette">
            <div class="character-title">🔴 TRANSMISIÓN: AGENTE IA</div>
            <div id="text-agente">Sincronizando modulación...</div>
        </div>
        
        <div id="vignette-luis" class="vignette">
            <div class="character-title">🔵 TRANSMISIÓN: LUIS (PROYECTO)</div>
            <div id="text-luis">En espera de respuesta táctica...</div>
        </div>
    </div>

    <button id="reset-camera-btn" class="control-btn" onclick="resetCamaraOrigen()">🎥 CENTRAR CÁMARA</button>
    <button id="exit-btn" class="control-btn" onclick="regresarAlIndex()">🚪 SALIR</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        const COORDENADAS = {
            agente: { x: -0.8, y: 0.05, z: 3.0 },
            luisavatar: { x: 0.8, y: 0.05, z: 3.0 }
        };

        const WORKER_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [];
        let mouthTargetsAgente = [];
        let mouthTargetsLuis = [];
        let agentAnimations = [];
        let luisAnimations = [];
        let currentSpeaker = null; 

        let desvioMiradaAgente = new BABYLON.Vector3(0, 0, 0);
        let desvioMiradaLuis = new BABYLON.Vector3(0, 0, 0);
        let actualTargetAgente = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.agente.y, COORDENADAS.luisavatar.z);
        let actualTargetLuis = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.luisavatar.y, COORDENADAS.agente.z);
        let proximoCambioGaze = Date.now() + 6000; 

        const statusText = document.getElementById("status");
        const boxAgente = document.getElementById("vignette-agente");
        const boxLuis = document.getElementById("vignette-luis");
        const textAgente = document.getElementById("text-agente");
        const textLuis = document.getElementById("text-luis");

        function actualizarViñetasUI(hablante, texto) {
            if (hablante === "Agente") {
                boxAgente.classList.add("active");
                boxLuis.classList.remove("active");
                textAgente.innerText = texto;
            } else if (hablante === "Luis") {
                boxLuis.classList.add("active");
                boxAgente.classList.remove("active");
                textLuis.innerText = texto;
            }
        }

        function desbloquearAudioYComenzar() {
            if (typeof window.speechSynthesis !== 'undefined') {
                window.speechSynthesis.cancel();
                let desbloqueo = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(desbloqueo);
            }
            document.getElementById("loading-ui").style.display = "none";
            iniciarInteraccionAvatares();
        }

        async function consultarGroqWorker(promptText) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: promptText, context: historialDialogo, lang: "es-ES" })
                });
                const data = await response.json();
                return data.reply || "...";
            } catch (error) {
                return "Restableciendo comunicación cuántica de respaldo...";
            }
        }

        async function generarYReproducirVoz(texto, avatar) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: texto, voice: "male", speaker: avatar })
                });

                if (response.ok && response.headers.get("content-type")?.includes("audio")) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);

                    return new Promise((resolve) => {
                        audio.onplay = () => { currentSpeaker = avatar; };
                        const endHandler = () => { currentSpeaker = null; URL.revokeObjectURL(audioUrl); resolve(); };
                        audio.onended = endHandler; audio.onerror = endHandler;
                        audio.play().catch(() => { currentSpeaker = null; resolve(); });
                    });
                } else {
                    // BLINDAJE DE SÍNTESIS DE VOZ PARA EVITAR ERRORES DE LOCALIZACIÓN FRANCESA/FEMENINA
                    return new Promise((resolve) => {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(texto.replace(/[*#_`]/g, ""));
                        
                        const voices = window.speechSynthesis.getVoices();
                        // Filtro 1: Forzar únicamente canales que inicien con código de lenguaje Español
                        const esVoices = voices.filter(v => v.lang.toLowerCase().startsWith("es"));
                        
                        // Filtro 2: Lista de exclusión estricta de perfiles femeninos y franceses
                        const nombresExcluidos = ["monica", "marisol", "helena", "paula", "sara", "siri", "female", "mujer", "amelie", "thomas", "fr-fr"];
                        const maleEsVoices = esVoices.filter(v => 
                            !nombresExcluidos.some(ex => v.name.toLowerCase().includes(ex))
                        );

                        // Selección refinada
                        if (avatar === "Luis") {
                            // Voz masculina primaria de pruebas
                            utterance.voice = maleEsVoices[0] || esVoices.find(v => v.name.toLowerCase().includes("jorge")) || esVoices[0];
                            utterance.pitch = 0.70; 
                            utterance.rate = 0.92;
                        } else {
                            // Segunda voz masculina para el Agente
                            utterance.voice = maleEsVoices[1] || maleEsVoices[0] || esVoices[0];
                            utterance.pitch = 0.88; 
                            utterance.rate = 1.00;
                        }

                        utterance.onstart = () => { currentSpeaker = avatar; };
                        const endHandler = () => { currentSpeaker = null; setTimeout(resolve, 350); };
                        utterance.onend = endHandler; utterance.onerror = endHandler;
                        window.speechSynthesis.speak(utterance);
                    });
                }
            } catch (error) {
                console.error("Inestabilidad de audio:", error);
            }
        }

        function setupMouthTrackingBabylon(rootMesh, targetArray) {
            if (!rootMesh) return;
            rootMesh.getChildMeshes().forEach(mesh => {
                const name = (mesh.name || "").toLowerCase();
                if (mesh.morphTargetManager) {
                    const manager = mesh.morphTargetManager;
                    for (let i = 0; i < manager.numTargets; i++) {
                        const targetName = manager.getTarget(i).name.toLowerCase();
                        if (targetName.includes("mouth") || targetName.includes("jaw") || targetName.includes("lip") || targetName.includes("viseme") || targetName.includes("open")) {
                            targetArray.push({ type: "morph", manager: manager, target: manager.getTarget(i) });
                        }
                    }
                }
                if (name.includes("mouth") || name.includes("jaw") || name.includes("head") || name.includes("lip")) {
                    if (!targetArray.some(t => t.mesh === mesh)) {
                        targetArray.push({ type: "mesh", mesh: mesh, originalScaleY: mesh.scaling.y });
                    }
                }
            });
        }

        async function iniciarInteraccionAvatares() {
            let hablanteActual = "Agente";
            let ultimoMensaje = "Hola Luis. Modulación de movimiento e interfaz de viñetas sincronizados. ¿Iniciamos la verificación electrónica?";
            
            actualizarViñetasUI(hablanteActual, ultimoMensaje);
            historialDialogo.push({ role: "user", content: `Agente: ${ultimoMensaje}` });
            await generarYReproducirVoz(ultimoMensaje, hablanteActual);

            while (true) {
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                let contextoPrompt = (hablanteActual === "Luis") 
                    ? `[Eres Luis, ingeniero senior de pruebas físicas electrónicas. Responde con soluciones innovadoras y concisas en 2 frases cortas]: ${ultimoMensaje}`
                    : `[Eres el Agente, una IA analítica de laboratorio. Dale soporte preciso a Luis en 2 frases]: ${ultimoMensaje}`;

                let respuesta = await consultarGroqWorker(contextoPrompt);
                if (respuesta) {
                    ultimoMensaje = respuesta;
                    actualizarViñetasUI(hablanteActual, ultimoMensaje);
                    historialDialogo.push({ role: "user", content: `${hablanteActual}: ${ultimoMensaje}` });
                    if (historialDialogo.length > 8) historialDialogo.splice(0, 2);
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                }
                await new Promise(resolve => setTimeout(resolve, 1500));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, false, { adaptToDeviceRatio: true });
        let camera; 
        let agenteRoot, luisRoot;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.2, 4.2, new BABYLON.Vector3(0, 1.2, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.0; camera.upperRadiusLimit = 30;
            camera.panningSensibility = 1800; 

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.95;

            const errorHandler = (meshName) => (scene, msg, exc) => {
                statusText.style.color = "#ff3366";
                statusText.innerText = `⚠️ Error crítico de carga de malla: ${meshName}`;
            };

            statusText.innerText = "Construyendo entorno urbano...";
            
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Escenario acoplado. Importando Agente...";

                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, p, s, animationGroups) {
                    statusText.innerText = "Agente en memoria. Vinculando LuisAvatar4...";
                    agenteRoot = agentMeshes[0];
                    agentAnimations = animationGroups;

                    if(agenteRoot) {
                        agenteRoot.rotationQuaternion = null; 
                        agenteRoot.position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        setupMouthTrackingBabylon(agenteRoot, mouthTargetsAgente);
                    }
                    if (agentAnimations.length > 0) agentAnimations.forEach(g => g.start(true));

                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, rp, rs, animationGroups) {
                        luisRoot = luisMeshes[0];
                        luisAnimations = animationGroups;

                        if(luisRoot) {
                            luisRoot.rotationQuaternion = null; 
                            luisRoot.position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            setupMouthTrackingBabylon(luisRoot, mouthTargetsLuis);
                        }
                        if (luisAnimations.length > 0) luisAnimations.forEach(anim => anim.start(true));

                        document.getElementById("load-title").innerText = "⚙️ TRANSMISIÓN SINCRO COMPLETA";
                        statusText.innerText = "Dispositivo móvil verificado con éxito.";
                        document.getElementById("start-btn").style.display = "block";
                    }, null, errorHandler("luisavatar4.glb"));
                }, null, errorHandler("agent.glb"));
            }, null, errorHandler("city2.glb"));

            // ⚡ VELOCIDADES DE ANIMACIÓN ELEVADAS PARA ELIMINAR EL EFECTO "DORMIDO"
            scene.registerBeforeRender(() => {
                let ahora = Date.now();

                if (luisAnimations.length > 0) {
                    luisAnimations.forEach(anim => { 
                        // Hablando: velocidad fluida natural | Esperando: respiración activa visible
                        anim.speedRatio = (currentSpeaker === "Luis") ? 0.85 : 0.25; 
                    });
                }
                if (agentAnimations.length > 0) {
                    agentAnimations.forEach(anim => { 
                        anim.speedRatio = (currentSpeaker === "Agente") ? 0.85 : 0.25; 
                    });
                }

                if (ahora > proximoCambioGaze) {
                    proximoCambioGaze = ahora + 18000 + Math.random() * 8000;
                    if (Math.random() > 0.35) {
                        desvioMiradaAgente.set((Math.random() - 0.5) * 0.20, (Math.random() - 0.4) * 0.10, (Math.random() - 0.5) * 0.12);
                        desvioMiradaLuis.set((Math.random() - 0.5) * 0.20, (Math.random() - 0.4) * 0.10, (Math.random() - 0.5) * 0.12);
                    } else {
                        desvioMiradaAgente.setAll(0); desvioMiradaLuis.setAll(0);
                    }
                }

                if (agenteRoot && luisRoot) {
                    let objetivoAgente = new BABYLON.Vector3(luisRoot.position.x, agenteRoot.position.y, luisRoot.position.z).add(desvioMiradaAgente);
                    let objetivoLuis = new BABYLON.Vector3(COORDENADAS.agente.x, luisRoot.position.y, COORDENADAS.agente.z).add(desvioMiradaLuis);

                    actualTargetAgente = BABYLON.Vector3.Lerp(actualTargetAgente, objetivoAgente, 0.03);
                    actualTargetLuis = BABYLON.Vector3.Lerp(actualTargetLuis, objetivoLuis, 0.03);

                    agenteRoot.lookAt(actualTargetAgente); agenteRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
                    luisRoot.lookAt(actualTargetLuis); luisRoot.rotate(BABYLON.Axis.Y, Math.PI, BABYLON.Space.LOCAL);
                }

                if (currentSpeaker) {
                    let targets = (currentSpeaker === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                    let wave = Math.abs(Math.sin(ahora * 0.018) * 0.6 + Math.sin(ahora * 0.038) * 0.4);
                    targets.forEach(t => {
                        if (t.type === "morph") t.target.influence = wave;
                        else if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY - (wave * 0.06);
                    });
                } else {
                    [mouthTargetsAgente, mouthTargetsLuis].forEach(targets => {
                        targets.forEach(t => {
                            if (t.type === "morph") t.target.influence = 0;
                            if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY;
                        });
                    });
                }
            });

            return scene;
        };

        const scene = createScene();

        function resetCamaraOrigen() {
            if(camera) {
                camera.alpha = -Math.PI / 2; camera.beta = Math.PI / 2.2; camera.radius = 4.2;
                camera.target = new BABYLON.Vector3(0, 1.2, 3);
            }
        }

        function regresarAlIndex() {
            window.speechSynthesis.cancel();
            window.location.href = "index.html"; 
        }

        engine.runRenderLoop(function () { scene.render(); });
        window.addEventListener("resize", function () { engine.resize(); });

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
