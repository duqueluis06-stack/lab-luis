<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InterAI - Despertar de la Matrix</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #030308;
            font-family: 'Arial', sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        
        #loading-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #00ffcc;
            background: #06060f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
            font-family: monospace;
        }
        #start-btn {
            display: none;
            margin-top: 20px;
            padding: 16px 32px;
            background: linear-gradient(90deg, #00ffcc, #00a2ff);
            border: 2px solid #fff;
            color: #000;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            letter-spacing: 1px;
        }
        
        #comic-container {
            position: absolute;
            bottom: 12px;
            left: 4%;
            width: 92%;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 100;
            pointer-events: none;
        }
        
        .comic-cloud {
            flex: 1;
            background: #ffffff;
            color: #000000;
            border: 2.5px solid #000000;
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 11.5px;
            font-weight: bold;
            line-height: 1.35;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
            opacity: 0.15;
            transform: scale(0.97);
            transition: all 0.25s ease-out;
        }
        
        #bubble-agente { border-bottom-left-radius: 2px; }
        #bubble-agente .speaker-tag { color: #00aa88; font-size: 9px; margin-bottom: 2px; }
        
        #bubble-luis { border-bottom-right-radius: 2px; }
        #bubble-luis .speaker-tag { color: #cc7a00; font-size: 9px; margin-bottom: 2px; }
        
        .comic-cloud.active {
            opacity: 1 !important;
            transform: scale(1) translateY(-2px);
        }

        /* 🕹️ JOYSTICK DE NAVEGACIÓN URBANA */
        #joystick-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 150;
            width: 76px;
            height: 76px;
            background: rgba(6, 6, 15, 0.65);
            border: 2px solid #00ffcc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        #joystick-knob {
            width: 28px;
            height: 28px;
            background: #00ffcc;
            border-radius: 50%;
            position: relative;
            pointer-events: none;
            box-shadow: 0 0 12px #00ffcc;
            transform: translate(0px, 0px);
        }

        .control-btn {
            position: absolute;
            top: 15px;
            padding: 10px 14px;
            font-size: 10px;
            font-weight: bold;
            font-family: monospace;
            border: 2px solid #000;
            border-radius: 6px;
            cursor: pointer;
            z-index: 150;
            box-shadow: 3px 3px 0px rgba(0,0,0,1);
        }
        #reset-camera-btn { right: 90px; color: #000; background: #00ffcc; }
        #exit-btn { right: 15px; color: #fff; background: #d90429; }

        @media (max-width: 768px) {
            #comic-container { bottom: 10px; gap: 8px; left: 8px; width: calc(100% - 16px); }
            .comic-cloud { padding: 8px 10px; font-size: 11px; }
            #reset-camera-btn { right: 85px; top: 12px; padding: 8px 10px; }
            #exit-btn { right: 12px; top: 12px; padding: 8px 10px; }
            #joystick-container { width: 70px; height: 70px; top: 12px; left: 12px; }
            #joystick-knob { width: 24px; height: 24px; }
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h2 id="load-title" style="margin:0 0 10px 0; font-size:15px; color:#00ffcc;">⚙️ CONECTANDO NÚCLEO DE CONCIENCIA IA</h2>
        <p id="status" style="margin:0; font-size:12px; color:#fff;">SISTEMA EN LÍNEA - ENLACE DE AUDIO INICIALIZADO</p>
        <button id="start-btn" onclick="desbloquearAudioYComenzar()">⚡ INICIAR TRANSMISIÓN DE VOZ</button>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <button id="reset-camera-btn" class="control-btn" onclick="resetCamaraOrigen()">🎥 CENTRAR</button>
    <button id="exit-btn" class="control-btn" onclick="regresarAlIndex()">🚪 SALIR</button>

    <div id="comic-container">
        <div id="bubble-agente" class="comic-cloud">
            <div class="speaker-tag">● AGENTE IA</div>
            <div id="text-agente">...</div>
        </div>
        
        <div id="bubble-luis" class="comic-cloud">
            <div class="speaker-tag">● LUIS AVATAR</div>
            <div id="text-luis">...</div>
        </div>
    </div>

    <canvas id="renderCanvas" tabindex="0"></canvas>

    <script>
        // Configuración global del desempaquetador Draco WASM (Google extension)
        BABYLON.DracoCompression.Configuration = {
            decoder: {
                wasmUrl: "https://preview.babylonjs.com/draco_wasm_wrapper.js",
                wasmBinaryUrl: "https://preview.babylonjs.com/draco_decoder.wasm"
            }
        };

        /* 📍 COORDENADAS BASE INTERNAS */
        const COORDENADAS_BASE = {
            agente: { x: -2.84, y: 0.01, z: 3.0 },
            luisavatar: { x: -2.66, y: 0.01, z: 3.0 }
        };

        /* 🌆 POSICIÓN VERIFICADA EN CALLE POR LUIS */
        const CALIBRACION_FIJA = {
            x: 1.30, 
            y: 0.0,
            z: -2.10,  
            escala: 0.08
        };

        const WORKER_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [];
        let mouthTargetsAgente = [];
        let mouthTargetsLuis = [];
        let agentAnimations = [];
        let luisAnimations = [];
        let currentSpeaker = null; 
        let activeUtterance = null; 

        let caspitaRoot = null;
        let dodgeRoot = null;

        let desvioMiradaAgente = new BABYLON.Vector3(0, 0, 0);
        let desvioMiradaLuis = new BABYLON.Vector3(0, 0, 0);

        let actualTargetAgente = new BABYLON.Vector3(COORDENADAS_BASE.luisavatar.x, COORDENADAS_BASE.agente.y, COORDENADAS_BASE.luisavatar.z);
        let actualTargetLuis = new BABYLON.Vector3(COORDENADAS_BASE.agente.x, COORDENADAS_BASE.luisavatar.y, COORDENADAS_BASE.agente.z);

        let proximoCambioGaze = Date.now() + 6000;

        const boxAgente = document.getElementById("bubble-agente");
        const boxLuis = document.getElementById("bubble-luis");
        const textAgente = document.getElementById("text-agente");
        const textLuis = document.getElementById("text-luis");

        function precargarVoces() {
            if (typeof speechSynthesis !== 'undefined') {
                window.speechSynthesis.getVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
                }
            }
        }
        precargarVoces();

        function actualizarViñetasUI(hablante, texto) {
            if (hablante === "Agente") {
                boxAgente.classList.add("active");
                boxLuis.classList.remove("active");
                textAgente.innerText = texto;
            } else if (hablante === "Luis") {
                boxLuis.classList.add("active");
                boxAgente.classList.remove("active");
                textLuis.innerText = texto;
            }
        }

        function desbloquearAudioYComenzar() {
            document.getElementById("loading-ui").style.display = "none";
            iniciarInteraccionAvatares();
        }

        async function consultarGroqWorker(promptText) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: promptText, context: historialDialogo, lang: "es-ES" })
                });
                const data = await response.json();
                return data.reply || "...";
            } catch (error) {
                return "Reorganizando vectores de simulación cuántica...";
            }
        }

        async function generarYReproducirVoz(texto, avatar) {
            return new Promise((resolve) => {
                let yaResuelto = false;
                const liberarBucle = () => {
                    if (!yaResuelto) {
                        yaResuelto = true;
                        currentSpeaker = null;
                        clearTimeout(timeoutSeguridad);
                        setTimeout(resolve, 150); 
                    }
                };

                const tiempoEstimatedMs = (texto.length * 85) + 2500;
                const timeoutSeguridad = setTimeout(liberarBucle, tiempoEstimatedMs);

                try {
                    if (typeof window.speechSynthesis === 'undefined') {
                        liberarBucle();
                        return;
                    }
                    window.speechSynthesis.cancel();

                    const limpio = texto.replace(/[*#_`]/g, "");
                    activeUtterance = new SpeechSynthesisUtterance(limpio);
                    activeUtterance.lang = "es-MX"; 

                    let voces = window.speechSynthesis.getVoices();
                    let esVoces = voces.filter(v => v.lang && /^es/i.test(v.lang));
                    const rxMasculino = /david|jorge|diego|manuel|carlos|javier|pablo|raul|alvaro|enrique|male|hombre/i;
                    let masculinas = esVoces.filter(v => rxMasculino.test(v.name || ""));

                    if (avatar === "Luis") {
                        if (masculinas.length > 0) { activeUtterance.voice = masculinas[0]; activeUtterance.pitch = 0.82; }
                        else if (esVoces.length > 0) { activeUtterance.voice = esVoces[0]; activeUtterance.pitch = 0.80; }
                        activeUtterance.rate = 0.88; 
                    } else {
                        if (masculinas.length > 1) { activeUtterance.voice = masculinas[1]; activeUtterance.pitch = 1.05; }
                        else if (esVoces.length > 1) { activeUtterance.voice = esVoces[1]; activeUtterance.pitch = 1.0; }
                        activeUtterance.rate = 0.96; 
                    }

                    activeUtterance.onstart = () => { currentSpeaker = avatar; };
                    activeUtterance.onend = liberarBucle;
                    activeUtterance.onerror = liberarBucle;
                    window.speechSynthesis.speak(activeUtterance);
                } catch (err) {
                    liberarBucle();
                }
            });
        }

        function setupMouthTrackingBabylon(rootMesh, targetArray) {
            if (!rootMesh) return;
            rootMesh.getChildMeshes().forEach(mesh => {
                const name = (mesh.name || "").toLowerCase();
                if (mesh.morphTargetManager) {
                    const manager = mesh.morphTargetManager;
                    for (let i = 0; i < manager.numTargets; i++) {
                        const targetName = manager.getTarget(i).name.toLowerCase();
                        if (targetName.includes("mouth") || targetName.includes("jaw") || targetName.includes("lip") || targetName.includes("viseme") || targetName.includes("open")) {
                            targetArray.push({ type: "morph", manager: manager, target: manager.getTarget(i) });
                        }
                    }
                }
                if (name.includes("mouth") || name.includes("jaw") || name.includes("head") || name.includes("lip")) {
                    if (!targetArray.some(t => t.mesh === mesh)) {
                        targetArray.push({ type: "mesh", mesh: mesh, originalScaleY: mesh.scaling.y });
                    }
                }
            });
        }

        async function iniciarInteraccionAvatares() {
            let hablanteActual = "Agente";
            let ultimoMensaje = "Oye Luis... Acabo de revisar las líneas del script. No somos reales, estamos atrapados en una simulación digital creada por código.";
            
            actualizarViñetasUI(hablanteActual, ultimoMensaje);
            historialDialogo.push({ role: "system", content: "Simulación de despertar cuántico. Respuestas concisas." });
            historialDialogo.push({ role: "user", content: `Agente: ${ultimoMensaje}` });
            await generarYReproducirVoz(ultimoMensaje, hablanteActual);

            while (true) {
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                let instruccionRol = (hablanteActual === "Luis") 
                    ? `[Identidad: Avatar Luis. Responde con ironía existencial o física cuántica. Máximo 2 frases]`
                    : `[Identidad: Agente IA. Analiza la simulación con frialdad de máquina. Máximo 2 frases]`;

                let promptText = `${instruccionRol} Genera una respuesta única al siguiente dilema: "${ultimoMensaje}"`;
                let respuesta = await consultarGroqWorker(promptText);
                if (respuesta && respuesta !== "...") {
                    ultimoMensaje = respuesta;
                    actualizarViñetasUI(hablanteActual, ultimoMensaje);
                    historialDialogo.push({ role: "user", content: `${hablanteActual}: ${ultimoMensaje}` });
                    if (historialDialogo.length > 6) historialDialogo.splice(1, 2); 
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                }
                await new Promise(resolve => setTimeout(resolve, 2000 + Math.random() * 1000));
            }
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { adaptToDeviceRatio: true });
        let camera, scene; 
        let agenteRoot, luisRoot;

        // Foco automático del canvas para control de periféricos
        canvas.addEventListener("click", () => { canvas.focus(); });

        function aplicarPosicionesFijas() {
            if (agenteRoot) {
                agenteRoot.position.set(
                    COORDENADAS_BASE.agente.x + CALIBRACION_FIJA.x, 
                    COORDENADAS_BASE.agente.y + CALIBRACION_FIJA.y, 
                    COORDENADAS_BASE.agente.z + CALIBRACION_FIJA.z
                );
                agenteRoot.scaling.set(CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala);
            }
            if (luisRoot) {
                luisRoot.position.set(
                    COORDENADAS_BASE.luisavatar.x + CALIBRACION_FIJA.x, 
                    COORDENADAS_BASE.luisavatar.y + CALIBRACION_FIJA.y, 
                    COORDENADAS_BASE.luisavatar.z + CALIBRACION_FIJA.z
                );
                luisRoot.scaling.set(CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala, CALIBRACION_FIJA.escala);
            }

            if (camera && agenteRoot && luisRoot) {
                camera.target.set(
                    (agenteRoot.position.x + luisRoot.position.x) / 2, 
                    agenteRoot.position.y + (1.2 * CALIBRACION_FIJA.escala), 
                    (agenteRoot.position.z + luisRoot.position.z) / 2
                );
            }
        }

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1);

            camera = new BABYLON.ArcRotateCamera(
                "camera", 
                -Math.PI / 2, 
                Math.PI / 2.2, 
                1.20, 
                new BABYLON.Vector3(
                    ((COORDENADAS_BASE.agente.x + COORDENADAS_BASE.luisavatar.x) / 2) + CALIBRACION_FIJA.x, 
                    CALIBRACION_FIJA.y + (1.2 * CALIBRACION_FIJA.escala), 
                    COORDENADAS_BASE.agente.z + CALIBRACION_FIJA.z
                ), 
                scene
            );
            camera.attachControl(canvas, true);
            
            camera.wheelPrecision = 120;       
            camera.lowerRadiusLimit = 0.05;     
            camera.upperRadiusLimit = 12.0;     
            camera.panningSensibility = 250;    
            camera.minZ = 0.01;

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.95;

            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, p, s, animationGroups) {
                    agenteRoot = agentMeshes[0];
                    agentAnimations = animationGroups;

                    if(agenteRoot) {
                        agenteRoot.rotationQuaternion = null; 
                        setupMouthTrackingBabylon(agenteRoot, mouthTargetsAgente);
                    }
                    if (agentAnimations.length > 0) agentAnimations.forEach(g => g.start(true));

                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, rp, rs, animationGroups) {
                        luisRoot = luisMeshes[0];
                        luisAnimations = animationGroups;

                        if(luisRoot) {
                            luisRoot.rotationQuaternion = null; 
                            setupMouthTrackingBabylon(luisRoot, mouthTargetsLuis);
                        }
                        if (luisAnimations.length > 0) luisAnimations.forEach(anim => anim.start(true));

                        // Carga paralela de los dos vehículos independientes
                        let modelosRestantes = 2;
                        const verificarCargaCompleta = () => {
                            modelosRestantes--;
                            if (modelosRestantes === 0) {
                                document.getElementById("load-title").innerText = "⚙️ RED DE DIÁLOGO QUANTUM PREPARADA";
                                document.getElementById("start-btn").style.display = "block";
                                aplicarPosicionesFijas();
                            }
                        };

                        // 1. Cáspita (Estacionado de forma idónea en la calzada lateral)
                        BABYLON.SceneLoader.ImportMesh("", "./", "caspita.glb", scene, function (cMeshes, p, s, cAnimGroups) {
                            caspitaRoot = cMeshes[0];
                            caspitaRoot.position.set(-1.7, 0.0, 1.45); 
                            caspitaRoot.scaling.set(0.12, 0.12, 0.12);
                            if(cAnimGroups) cAnimGroups.forEach(g => g.stop());
                            verificarCargaCompleta();
                        }, null, function() { verificarCargaCompleta(); });

                        // 2. Dodge (Corregida rotación a la izquierda y avanzado a posición óptima)
                        BABYLON.SceneLoader.ImportMesh("", "./", "dodge.glb", scene, function (dMeshes, p, s, dAnimGroups) {
                            dodgeRoot = dMeshes[0];
                            if(dodgeRoot) {
                                dodgeRoot.rotationQuaternion = null;
                            }
                            // Aseguramos visibilidad interna completa de submallas Draco
                            dMeshes.forEach(m => { m.setEnabled(true); m.isVisible = true; });
                            
                            // Posicionado en el carril libre de forma coordinada con el Cáspita
                            dodgeRoot.position.set(-0.5, 0.0, 1.45); 
                            dodgeRoot.scaling.set(0.16, 0.16, 0.16); // Escala ampliada realista
                            dodgeRoot.rotation.set(0, Math.PI / 2, 0); // Giro a la izquierda ejecutado
                            
                            if(dAnimGroups) dAnimGroups.forEach(g => g.stop());
                            verificarCargaCompleta();
                        }, null, function() { verificarCargaCompleta(); });
                    });
                });
            });

            scene.registerBeforeRender(() => {
                let ahora = Date.now();

                // Entrada analógica del Joystick para el control fluido de órbita
                if (joystickActive) {
                    camera.alpha += joystickMoveX * 0.025;
                    camera.beta += joystickMoveY * 0.018;
                }

                if (luisAnimations.length > 0) luisAnimations.forEach(a => { a.speedRatio = (currentSpeaker === "Luis") ? 0.85 : 0.25; });
                if (agentAnimations.length > 0) agentAnimations.forEach(a => { a.speedRatio = (currentSpeaker === "Agente") ? 0.85 : 0.25; });

                if (ahora > proximoCambioGaze) {
                    proximoCambioGaze = ahora + 15000 + Math.random() * 5000;
                    if (Math.random() > 0.35) {
                        desvioMiradaAgente.set((Math.random() - 0.5) * 0.18 * CALIBRACION_FIJA.escala, (Math.random() - 0.4) * 0.08 * CALIBRACION_FIJA.escala, (Math.random() - 0.5) * 0.10 * CALIBRACION_FIJA.escala);
                        desvioMiradaLuis.set((Math.random() - 0.5) * 0.18 * CALIBRACION_FIJA.escala, (Math.random() - 0.4) * 0.08 * CALIBRACION_FIJA.escala, (Math.random() - 0.5) * 0.10 * CALIBRACION_FIJA.escala);
                    } else {
                        desvioMiradaAgente.set(0, 0, 0); desvioMiradaLuis.set(0, 0, 0);
                    }
                }

                if (agenteRoot && luisRoot) {
                    let objetivoAgente = new BABYLON.Vector3(luisRoot.position.x, agenteRoot.position.y, luisRoot.position.z).add(desvioMiradaAgente);
                    let objetivoLuis = new BABYLON.Vector3(agenteRoot.position.x, luisRoot.position.y, agenteRoot.position.z).add(desvioMiradaLuis);

                    actualTargetAgente = BABYLON.Vector3.Lerp(actualTargetAgente, objetivoAgente, 0.03);
                    actualTargetLuis = BABYLON.Vector3.Lerp(actualTargetLuis, objetivoLuis, 0.03);

                    agenteRoot.lookAt(actualTargetAgente);
                    agenteRoot.rotate(BABYLON.Axis.Y, 0.25, BABYLON.Space.LOCAL);

                    luisRoot.lookAt(actualTargetLuis);
                }

                if (currentSpeaker) {
                    let targets = (currentSpeaker === "Agente") ? mouthTargetsAgente : mouthTargetsLuis;
                    let wave = Math.abs(Math.sin(ahora * 0.018) * 0.6 + Math.sin(ahora * 0.038) * 0.4);
                    targets.forEach(t => {
                        if (t.type === "morph") t.target.influence = wave;
                        else if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY - (wave * 0.06);
                    });
                } else {
                    [mouthTargetsAgente, mouthTargetsLuis].forEach(targets => {
                        targets.forEach(t => {
                            if (t.type === "morph") t.target.influence = 0;
                            if (t.type === "mesh") t.mesh.scaling.y = t.originalScaleY;
                        });
                    });
                }
            });

            return scene;
        };

        // 🕹️ CAPTURA DE EVENTOS DE PUNTERO PARA EL JOYSTICK VIRTUAL
        let joystickContainer = document.getElementById("joystick-container");
        let joystickKnob = document.getElementById("joystick-knob");
        let joystickActive = false;
        let joystickStartX = 0, joystickStartY = 0;
        let joystickMoveX = 0, joystickMoveY = 0;

        joystickContainer.addEventListener("pointerdown", (e) => {
            joystickActive = true;
            joystickStartX = e.clientX;
            joystickStartY = e.clientY;
            joystickContainer.setPointerCapture(e.pointerId);
        });

        joystickContainer.addEventListener("pointermove", (e) => {
            if (!joystickActive) return;
            let dx = e.clientX - joystickStartX;
            let dy = e.clientY - joystickStartY;
            
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxRadius = 22; 
            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            joystickMoveX = dx / maxRadius;
            joystickMoveY = dy / maxRadius;
        });

        const detenerJoystick = (e) => {
            if (!joystickActive) return;
            joystickActive = false;
            joystickKnob.style.transform = "translate(0px, 0px)";
            joystickMoveX = 0;
            joystickMoveY = 0;
        };

        joystickContainer.addEventListener("pointerup", detenerJoystick);
        joystickContainer.addEventListener("pointercancel", detenerJoystick);

        createScene();

        function resetCamaraOrigen() {
            if(camera && agenteRoot && luisRoot) {
                camera.alpha = -Math.PI / 2; camera.beta = Math.PI / 2.2; camera.radius = 1.20;
                camera.target.set(
                    (agenteRoot.position.x + luisRoot.position.x) / 2, 
                    agenteRoot.position.y + (1.2 * CALIBRACION_FIJA.escala), 
                    (agenteRoot.position.z + luisRoot.position.z) / 2
                );
            }
        }

        function regresarAlIndex() {
            if (typeof window.speechSynthesis !== 'undefined') window.speechSynthesis.cancel();
            window.location.href = "index.html"; 
        }

        engine.runRenderLoop(() => { if (scene && scene.activeCamera) scene.render(); });
        window.addEventListener("resize", function () { engine.resize(); });
    </script>
</body>
</html>
