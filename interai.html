<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterAI - Entorno de Pruebas</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        #instructions-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(2, 2, 8, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(0, 255, 229, 0.4);
            z-index: 9;
        }
        /* 🎯 BOTÓN FLOTANTE REGRESAR CÁMARA */
        #reset-camera-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            background: linear-gradient(90deg, #00a2ff, #00ffe5);
            padding: 11px 22px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
            z-index: 10;
            transition: all 0.2s ease;
        }
        #reset-camera-btn:hover {
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.6);
            transform: translateY(-2px);
        }
        #reset-camera-btn:active {
            transform: scale(0.95);
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h3>Sistema InterAI</h3>
        <p id="status">Cargando elementos del entorno...</p>
    </div>

    <div id="instructions-ui">
        🖱️ <b>Clic Izquierdo:</b> Rotar | 🎡 <b>Rueda:</b> Zoom | 🖱️ <b>Clic Derecho:</b> Desplazarse por calles
    </div>

    <button id="reset-camera-btn" onclick="resetCamaraOrigen()">🎥 ENFOCAR AVATARES</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        // =======================================================================
        // 🛠️ PANEL DE CONTROL DE POSICIONES (Calibrado cara a cara y altura rasa)
        // =======================================================================
        const COORDENADAS = {
            agente: {
                x: -1.0,       // CORRECCIÓN: Más cerca del centro
                y: 0.05,       // CORRECCIÓN: Elevado medio milímetro a ras de suelo
                z: 3.0,        
                rotacion: -Math.PI / 2  // Mirando a Luis
            },
            luisavatar: {
                x: 1.0,        // CORRECCIÓN: Más cerca de frente al agente
                y: 0.05,       // CORRECCIÓN: Elevado medio milímetro a ras de suelo
                z: 3.0,        
                rotacion: Math.PI / 2   // Mirando al agente
            }
        };
        // =======================================================================

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let camera; // Variable global para acceder desde el botón

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.04, 1);

            // Inicialización de cámara enfocando el punto medio de la conversación (Z: 3.0)
            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 7, new BABYLON.Vector3(0, 0.9, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.2; 
            camera.upperRadiusLimit = 250; 
            camera.panningSensibility = 1000; 

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.85;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(5, 10, 5);
            dirLight.intensity = 0.6;

            const statusText = document.getElementById("status");

            // 1. Cargar la Ciudad (city2.glb)
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Ciudad cargada. Trayendo avatares...";

                // 2. Cargar Agente (agent.glb)
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, particleSystems, skeletons, animationGroups) {
                    statusText.innerText = "Agente cargado...";
                    
                    if(agentMeshes[0]) {
                        agentMeshes[0].rotationQuaternion = null; 
                        agentMeshes[0].position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        agentMeshes[0].rotation = new BABYLON.Vector3(0, COORDENADAS.agente.rotacion, 0);
                    }

                    // CORRECCIÓN AGENTE: Forzar la ejecución en bucle de TODAS sus capas de animación del GLB
                    if (animationGroups.length > 0) {
                        animationGroups.forEach(group => {
                            group.start(true);
                        });
                    }

                    // 3. Cargar tu Avatar (luisavatar4.glb)
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, readyParticles, readySkeletons, luisAnimations) {
                        statusText.innerText = "Sistema listo. Entorno y Avatares activos.";
                        
                        setTimeout(() => {
                            document.getElementById("loading-ui").style.display = "none";
                        }, 2000);

                        if(luisMeshes[0]) {
                            luisMeshes[0].rotationQuaternion = null; 
                            luisMeshes[0].position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            luisMeshes[0].rotation = new BABYLON.Vector3(0, COORDENADAS.luisavatar.rotacion, 0);
                        }

                        // CORRECCIÓN LUIS: Ralentizar velocidad de animación para evitar repeticiones robóticas graciosas
                        if (luisAnimations.length > 0) {
                            luisAnimations.forEach(anim => {
                                anim.start(true);
                                anim.speedRatio = 0.7; // Velocidad suavizada al 70%
                            });
                        }
                    });
                });
            }, null, function (scene, message, exception) {
                statusText.innerText = "Error al cargar los modelos. Revisa los archivos.";
                console.error(message, exception);
            });

            return scene;
        };

        const scene = createScene();

        // 🎯 FUNCIÓN DE RETORNO AL PUNTO ORIGEN
        function resetCamaraOrigen() {
            if(camera) {
                // Resetea ángulos, distancia focal y el objetivo central exacto entre ambos avatares
                camera.alpha = -Math.PI / 2;
                camera.beta = Math.PI / 2.3;
                camera.radius = 7;
                camera.target = new BABYLON.Vector3(0, 0.9, 3);
            }
        }

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
