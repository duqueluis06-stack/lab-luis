<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterAI - Entorno de Pruebas</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        #instructions-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(2, 2, 8, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(0, 255, 229, 0.4);
            z-index: 9;
        }
        /* 🎯 BOTÓN FLOTANTE REGRESAR CÁMARA */
        #reset-camera-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            background: linear-gradient(90deg, #00a2ff, #00ffe5);
            padding: 11px 22px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
            z-index: 10;
            transition: all 0.2s ease;
        }
        #reset-camera-btn:hover {
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.6);
            transform: translateY(-2px);
        }
        #reset-camera-btn:active {
            transform: scale(0.95);
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

    <div id="loading-ui">
        <h3>Sistema InterAI</h3>
        <p id="status">Cargando elementos del entorno...</p>
    </div>

    <div id="instructions-ui">
        💾 <b>Clic Izquierdo:</b> Rotar | 🎡 <b>Rueda:</b> Zoom | 🖱️ <b>Clic Derecho:</b> Desplazarse por calles
    </div>

    <button id="reset-camera-btn" onclick="resetCamaraOrigen()">🎥 ENFOCAR AVATARES</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        // =======================================================================
        // 🛠️ PANEL DE CONTROL DE POSICIONES (Calibrado cara a cara y altura rasa)
        // =======================================================================
        const COORDENADAS = {
            agente: {
                x: -1.0,       // CORRECCIÓN: Más cerca del centro
                y: 0.05,       // CORRECCIÓN: Elevado medio milímetro a ras de suelo
                z: 3.0,        
                rotacion: -Math.PI / 2  // Mirando a Luis
            },
            luisavatar: {
                x: 1.0,        // CORRECCIÓN: Más cerca de frente al agente
                y: 0.05,       // CORRECCIÓN: Elevado medio milímetro a ras de suelo
                z: 3.0,        
                rotacion: Math.PI / 2   // Mirando al agente
            }
        };

        // =======================================================================
        // 🔑 CONFIGURACIÓN CONEXIÓN GROQ Y VOZ REAL (WORKER)
        // =======================================================================
        const GROQ_API_KEY = "TU_KEY_DE_GROQ_AQUI"; 
        const GROQ_MODEL = "llama3-8b-8192"; 
        const WORKER_VOZ_URL = "https://little-salad-1611.duqueluis06.workers.dev";

        let historialDialogo = [
            { 
                role: "system", 
                content: "Simula una conversación técnica, fluida e innovadora entre dos entidades en un entorno virtual: 'Agente' (un asistente de IA avanzado) y 'Luis' (un ingeniero experto en pruebas físicas electrónicas y astrofísica). Mantén las respuestas cortas, dinámicas y directas de un turno a otro." 
            }
        ];

        // Función para consultar a Groq el texto del diálogo
        async function consultarGroq(contextoPrompt) {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: historialDialogo.concat([{ role: "user", content: contextoPrompt }]),
                        max_tokens: 100,
                        temperature: 0.7
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content.trim();
            } catch (error) {
                console.error("Error en la conexión con Groq:", error);
                return null;
            }
        }

        // 🎙️ Función para enviar el texto al Worker, obtener el audio y reproducirlo
        async function generarYReproducirVoz(texto, avatar) {
            try {
                const response = await fetch(WORKER_VOZ_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        text: texto,
                        voice: avatar === "Luis" ? "male" : "female" // Opcional: por si tu worker distingue voces
                    })
                });

                if (!response.ok) throw new Error("Error en la respuesta del Worker de voz.");

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);

                // Retorna una promesa para que el bucle espere a que termine de hablar antes del siguiente turno
                return new Promise((resolve) => {
                    audio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                        resolve();
                    };
                    audio.onerror = () => {
                        resolve();
                    };
                    audio.play().catch(err => {
                        console.warn("La reproducción automática requiere interacción previa del usuario en pantalla.", err);
                        resolve();
                    });
                });
            } catch (error) {
                console.error("Error al procesar el audio del Worker:", error);
            }
        }

        // Bucle continuo de interacción con Voz Real
        async function iniciarInteraccionAvatares() {
            if (GROQ_API_KEY === "TU_KEY_DE_GROQ_AQUI") {
                console.warn("⚠️ Groq: Introduce una API Key válida en el código para iniciar la conversación.");
                return;
            }

            let hablanteActual = "Agente";
            let ultimoMensaje = "Hola Luis. El entorno InterAI está estable y los sistemas de análisis listos. ¿Qué proyecto o prueba de laboratorio monitorizamos hoy?";
            
            console.log(`%c[${hablanteActual}]: ${ultimoMensaje}`, "color: #00ffcc; font-weight: bold;");
            historialDialogo.push({ role: "assistant", content: `[${hablanteActual}]: ${ultimoMensaje}` });
            
            // Reproducir el saludo inicial
            await generarYReproducirVoz(ultimoMensaje, hablanteActual);

            while (true) {
                // Alternar turno
                hablanteActual = (hablanteActual === "Agente") ? "Luis" : "Agente";
                
                let instruccionTurno = `Responde ahora bajo la identidad de ${hablanteActual} de forma natural al último mensaje: "${ultimoMensaje}".`;
                let respuesta = await consultarGroq(instruccionTurno);

                if (respuesta) {
                    ultimoMensaje = respuesta;
                    let colorConsola = (hablanteActual === "Luis") ? "#00a2ff" : "#00ffcc";
                    console.log(`%c[${hablanteActual}]: ${ultimoMensaje}`, `color: ${colorConsola}; font-weight: bold;`);
                    
                    historialDialogo.push({ role: "assistant", content: `[${hablanteActual}]: ${ultimoMensaje}` });
                    
                    // 🗣️ Los avatares hablan usando tu URL del Worker
                    await generarYReproducirVoz(ultimoMensaje, hablanteActual);
                    
                    if (historialDialogo.length > 15) {
                        historialDialogo.splice(1, 2);
                    }
                }
                
                // Pequeña pausa natural de 1.5 segundos entre réplicas una vez terminado el audio
                await new Promise(resolve => setTimeout(resolve, 1500));
            }
        }
        // =======================================================================

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let camera; 

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.04, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.3, 7, new BABYLON.Vector3(0, 0.9, 3), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 1.2; 
            camera.upperRadiusLimit = 250; 
            camera.panningSensibility = 1000; 

            const ambientLight = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.85;
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(5, 10, 5);
            dirLight.intensity = 0.6;

            const statusText = document.getElementById("status");

            // 1. Cargar la Ciudad (city2.glb)
            BABYLON.SceneLoader.ImportMesh("", "./", "city2.glb", scene, function (meshes) {
                statusText.innerText = "Ciudad cargada. Trayendo avatares...";

                // 2. Cargar Agente (agent.glb)
                BABYLON.SceneLoader.ImportMesh("", "./", "agent.glb", scene, function (agentMeshes, particleSystems, skeletons, animationGroups) {
                    statusText.innerText = "Agente cargado...";
                    
                    if(agentMeshes[0]) {
                        agentMeshes[0].rotationQuaternion = null; 
                        agentMeshes[0].position = new BABYLON.Vector3(COORDENADAS.agente.x, COORDENADAS.agente.y, COORDENADAS.agente.z);
                        agentMeshes[0].rotation = new BABYLON.Vector3(0, COORDENADAS.agente.rotacion, 0);
                    }

                    if (animationGroups.length > 0) {
                        animationGroups.forEach(group => {
                            group.start(true);
                        });
                    }

                    // 3. Cargar tu Avatar (luisavatar4.glb)
                    BABYLON.SceneLoader.ImportMesh("", "./", "luisavatar4.glb", scene, function (luisMeshes, readyParticles, readySkeletons, luisAnimations) {
                        statusText.innerText = "Sistema listo. Entorno y Avatares activos.";
                        
                        setTimeout(() => {
                            document.getElementById("loading-ui").style.display = "none";
                            // 🚀 Comienza la interacción por consola con llamada de voz al Worker
                            iniciarInteraccionAvatares();
                        }, 2000);

                        if(luisMeshes[0]) {
                            luisMeshes[0].rotationQuaternion = null; 
                            luisMeshes[0].position = new BABYLON.Vector3(COORDENADAS.luisavatar.x, COORDENADAS.luisavatar.y, COORDENADAS.luisavatar.z);
                            luisMeshes[0].rotation = new BABYLON.Vector3(0, COORDENADAS.luisavatar.rotacion, 0);
                        }

                        if (luisAnimations.length > 0) {
                            luisAnimations.forEach(anim => {
                                anim.start(true);
                                anim.speedRatio = 0.7; 
                            });
                        }
                    });
                });
            }, null, function (scene, message, exception) {
                statusText.innerText = "Error al cargar los modelos. Revisa los archivos.";
                console.error(message, exception);
            });

            return scene;
        };

        const scene = createScene();

        function resetCamaraOrigen() {
            if(camera) {
                camera.alpha = -Math.PI / 2;
                camera.beta = Math.PI / 2.3;
                camera.radius = 7;
                camera.target = new BABYLON.Vector3(0, 0.9, 3);
            }
        }

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
