<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSN Command Sub-Console - Lab Luis</title>
    <style>
        :root {
            --matrix-green: #00ff41;
            --radar-blue: #00a8ff;
            --warning-red: #ff3333;
            --panel-bg: rgba(2, 6, 12, 0.95);
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #010306;
            background-image: 
                linear-gradient(rgba(18, 24, 38, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 24, 38, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Courier New', monospace;
            color: var(--matrix-green);
            overflow: hidden;
            touch-action: none;
        }

        /* --- INTERFAZ TIPO SUBMARINO / BUNKER --- */
        .sub-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 50px 1fr 170px;
            z-index: 10;
            pointer-events: none;
        }
        .sub-interface * { pointer-events: auto; }

        header {
            background: #000;
            border-bottom: 2px solid var(--matrix-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 4px 15px rgba(0, 255, 65, 0.2);
        }

        .btn-exit {
            background: var(--warning-red);
            color: #fff;
            border: 1px solid #fff;
            padding: 6px 12px;
            font-size: 10px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 3px;
            box-shadow: 0 0 8px var(--warning-red);
        }

        /* --- ÁREA RADAR CENTRAL --- */
        #space-bunker {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        /* El Sol de 1.4M KM (Representación de escala masiva de energía) */
        .colossal-sun {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #fff 10%, #ff3300 50%, transparent 75%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: solar-waves 6s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes solar-waves {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; box-shadow: 0 0 40px #ff3300, 0 0 70px #ff7700; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; box-shadow: 0 0 60px #ff0000, 0 0 110px #ffaa00; }
        }

        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(0, 255, 65, 0.12);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Nodos de Telemetría Militar (Planetas) */
        .telemetry-node {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .node-hardware {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #000;
            border: 2px solid var(--radar-blue);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }
        .node-hardware.selected {
            border-color: var(--warning-red) !important;
            box-shadow: 0 0 12px var(--warning-red);
        }

        /* Satélite Militar Integrado */
        .spy-probe {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border: 1px solid var(--matrix-green);
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Nombres fijos en HUD de Submarino */
        .hud-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #fff;
            white-space: nowrap;
            background: #000;
            border: 1px solid var(--matrix-green);
            padding: 1px 3px;
        }

        #vector-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- DECK DE MANDOS INFERIOR (Submarino Style) --- */
        .bunker-deck {
            background: #020204;
            border-top: 3px solid var(--matrix-green);
            padding: 8px;
            display: grid;
            grid-template-columns: 1fr 90px;
            gap: 8px;
            box-shadow: 0 -4px 20px rgba(0, 255, 65, 0.15);
        }

        .terminal-screen {
            background: #000;
            border: 1px solid rgba(0, 255, 65, 0.4);
            border-radius: 4px;
            padding: 6px;
            font-size: 10px;
            overflow-y: auto;
            line-height: 1.3;
        }

        /* Joystick de Fósforo Físico */
        .joystick-panel {
            background: #05080c;
            border: 1px solid var(--radar-blue);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .joy-ring {
            width: 55px;
            height: 55px;
            border: 2px solid var(--radar-blue);
            border-radius: 50%;
            position: relative;
            background: #000;
        }

        .joy-core {
            width: 20px;
            height: 20px;
            background: var(--matrix-green);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px var(--matrix-green);
            cursor: move;
        }

        .btn-militar {
            background: #0d1b10;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            font-family: inherit;
            font-size: 9px;
            font-weight: bold;
            padding: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
        }
        .btn-militar:active { background: var(--matrix-green); color: #000; }

        .flex-buttons { display: flex; gap: 4px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="space-bunker">
        <canvas id="vector-canvas"></canvas>
        <div class="colossal-sun"></div>
        <div id="radar-mesh"></div>
    </div>

    <div class="sub-interface">
        <header>
            <div>
                <span style="font-weight:bold; letter-spacing:1px;">⚠️ DSN COM-SUB SYSTEM</span>
                <span style="font-size:9px; color:#888; margin-left:10px;">REF: SOL (Ø 1.4M KM)</span>
            </div>
            <a href="index.html" class="btn-exit">DISCONNECT</a>
        </header>

        <div></div>

        <footer class="bunker-deck">
            <div class="terminal-screen">
                <div style="display:flex; justify-content:space-between; color:#fff; border-bottom:1px solid rgba(0,255,65,0.3); padding-bottom:2px;">
                    <span>SISTEMA: ONLINE</span>
                    <span id="sub-clock">00:00:00</span>
                </div>
                <div id="terminal-log" style="margin-top:4px;">
                    SELECCIONE UN NODO DE PLANETA EN EL RADAR PARA APUNTAR LAS ANTENAS DE ALTA GANANCIA...
                </div>
                
                <div class="flex-buttons">
                    <button class="btn-militar" onclick="setSpeed(0)">⏸ PAUSA</button>
                    <button class="btn-militar" onclick="setSpeed(0.1)">🎚️ CRUCERO</button>
                    <button class="btn-militar" onclick="setSpeed(1)">⚡ WARP 1</button>
                    <button class="btn-militar" style="border-color:var(--radar-blue); color:var(--radar-blue)" onclick="fireInterplanetaryLaser()">🛰️ TRANSMITIR LÁSER</button>
                </div>
            </div>

            <div class="joystick-panel">
                <span style="font-size:8px; color:var(--radar-blue); margin-bottom:2px;">APUNTAR</span>
                <div class="joy-ring" id="joyRing">
                    <div class="joy-core" id="joyCore"></div>
                </div>
                <button class="btn-militar" style="font-size:7px; padding:2px;" onclick="changeTransmissionMode()">MODE: VIDEO</button>
            </div>
        </footer>
    </div>

    <script>
        // Configuración Física y de Órbitas Limpias (Escala del Sol Ajustada para Visibilidad en iPhone)
        const NODES = [
            { id: 'mercurio', name: 'MERCURIO', r: 80, speed: 0.015, color: '#888888', comp: 'ROCOSO' },
            { id: 'venus', name: 'VENUS', r: 110, speed: 0.009, color: '#cc9933', comp: 'GASES ACIDOS' },
            { id: 'tierra', name: 'TIERRA (BASE)', r: 140, speed: 0.007, color: '#3366cc', comp: 'ROCOSO/ATM' },
            { id: 'marte', name: 'MARTE', r: 170, speed: 0.005, color: '#cc3300', comp: 'ROCOSO OXIDO' },
            { id: 'jupiter', name: 'JÚPITER', r: 210, speed: 0.002, color: '#ffcc66', comp: 'GASEOSO MASIVO' },
            { id: 'saturno', name: 'SATURNO', r: 250, speed: 0.001, color: '#ffff99', comp: 'GASEOSO/ANILLOS' },
            { id: 'urano', name: 'URANO', r: 280, speed: 0.0006, color: '#66ccff', comp: 'GAS HELADO' },
            { id: 'neptuno', name: 'NEPTUNO', r: 310, speed: 0.0004, color: '#3333ff', comp: 'GAS METANO' },
            { id: 'pluton', name: 'PLUTÓN (DL)', r: 340, speed: 0.0002, color: '#aa9988', comp: 'HIELO/ROCA' }
        ];

        let timeFactor = 0.1; // Velocidad de rotación lenta por defecto solicitada
        let angles = {};
        let activePlanet = NODES[8]; // Plutón seleccionado por defecto de entrada
        let modeIndex = 0;
        const modes = ['VIDEO HD CASCADA', 'BARRIDO FRECUENCIA GASES', 'TELEMETRÍA FRAGMENTO METEORITO'];

        const radarMesh = document.getElementById('radar-mesh');
        const canvas = document.getElementById('vector-canvas');
        const ctx = canvas.getContext('2d');

        function buildRadarSystem() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            NODES.forEach(n => {
                angles[n.id] = Math.random() * Math.PI * 2;

                // Anillo de Órbita de Fósforo
                const ring = document.createElement('div');
                ring.className = 'orbit-ring';
                ring.style.width = `${n.r * 2}px`;
                ring.style.height = `${n.r * 2}px`;
                radarMesh.appendChild(ring);

                // Contenedor Vectorial
                const container = document.createElement('div');
                container.className = 'telemetry-node';
                container.id = `node-${n.id}`;

                // El dispositivo físico (bolita refinada a nodo electrónico)
                const hardware = document.createElement('div');
                hardware.className = 'node-hardware';
                hardware.id = `hw-${n.id}`;
                hardware.style.borderColor = n.color;
                hardware.style.left = `${n.r}px`;

                // Sonda
                const spy = document.createElement('div');
                spy.className = 'spy-probe';
                hardware.appendChild(spy);

                // HUD Texto Antirrotación
                const label = document.createElement('div');
                label.className = 'hud-label';
                label.id = `lbl-${n.id}`;
                label.innerText = n.name;
                hardware.appendChild(label);

                hardware.onclick = (e) => {
                    e.stopPropagation();
                    selectNode(n);
                };

                container.appendChild(hardware);
                radarMesh.appendChild(container);
            });

            selectNode(activePlanet);
        }

        function selectNode(node) {
            activePlanet = node;
            NODES.forEach(n => {
                document.getElementById(`hw-${n.id}`).classList.remove('selected');
            });
            document.getElementById(`hw-${node.id}`).classList.add('selected');
            printTelemetry(node);
        }

        function printTelemetry(node) {
            const log = document.getElementById('terminal-log');
            log.innerHTML = `
                <span style="color:var(--radar-blue)">[NODO FIJADO]: ${node.name}</span><br>
                • COMPOSICIÓN ATMOSFÉRICA: ${node.comp}<br>
                • DETECTOR DE FRAGMENTOS ATMOSFÉRICOS: <span style="color:var(--matrix-green)">ESCANER MODULANDO</span><br>
                • EJE HELIOCÉNTRICO RADIAL: ${(node.r * 1.49).toFixed(1)}M KM AL SOL.
            `;
        }

        function changeTransmissionMode() {
            modeIndex = (modeIndex + 1) % modes.length;
            event.target.innerText = `MODE: ${modes[modeIndex].split(' ')[0]}`;
            printTelemetry(activePlanet);
        }

        function setSpeed(val) {
            timeFactor = val;
        }

        // Simulación de disparo de láser y matemáticas de puentes en cascada
        let isTransmitting = false;
        let transmitProgress = 0;

        function fireInterplanetaryLaser() {
            if(isTransmitting) return;
            isTransmitting = true;
            transmitProgress = 0;
            
            const log = document.getElementById('terminal-log');
            log.innerHTML = `<span style="color:yellow; font-weight:bold;">[DISPARANDO PULSO LÁSER EN CASCADA DESDE ${activePlanet.name}]</span><br>Calculando enrutamiento dinámico evitando las olas térmicas del Sol...`;
        }

        function getNodeScreenPos(id) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const n = NODES.find(x => x.id === id);
            return {
                x: cx + Math.cos(angles[id]) * n.r,
                y: cy + Math.sin(angles[id]) * n.r
            };
        }

        // Bucle de renderizado militar optimizado para móviles
        function runBunkerLoop() {
            ctx.clearRect(0,0,canvas.width,canvas.height);

            NODES.forEach(n => {
                angles[n.id] += n.speed * timeFactor;
                const container = document.getElementById(`node-${n.id}`);
                container.style.transform = `rotate(${angles[n.id]}rad)`;

                // Corrección de giro de texto HUD
                const lbl = document.getElementById(`lbl-${n.id}`);
                if (lbl) lbl.style.transform = `translateX(-50%) rotate(${-angles[n.id]}rad)`;
            });

            // Si hay transmisión láser activa, dibujamos las líneas de enlace de datos
            if (isTransmitting) {
                transmitProgress += 0.08;
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ff3333';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff3333';

                let idx = NODES.findIndex(x => x.id === activePlanet.id);
                let earthIdx = NODES.findIndex(x => x.id === 'tierra');
                
                // Generar camino de puentes automáticos entre el planeta emisor y la Tierra
                let path = [];
                if (idx > earthIdx) {
                    for(let i = idx; i >= earthIdx; i--) path.push(NODES[i].id);
                } else {
                    for(let i = idx; i <= earthIdx; i++) path.push(NODES[i].id);
                }

                for(let i = 0; i < path.length - 1; i++) {
                    let p1 = getNodeScreenPos(path[i]);
                    let p2 = getNodeScreenPos(path[i+1]);
                    ctx.canvas.getContext('2d');
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }

                if (transmitProgress >= 5) {
                    isTransmitting = false;
                    // Mostrar resultados matemáticos comparativos en el monitor de órdenes
                    const log = document.getElementById('terminal-log');
                    const distSim = (Math.abs(activePlanet.r - 140) * 0.15).toFixed(2);
                    log.innerHTML = `
                        <span style="color:var(--matrix-green); font-weight:bold;">[ANÁLISIS DE ENLACE DE DATOS TERMINADO]</span><br>
                        • MODO TRANSMITIDO: <span style="color:#fff">${modes[modeIndex]}</span><br>
                        • RED DE PUENTES (SONDAS): Éxito. Pérdida de paquetes: 0%. Contraste de Imagen intacto.<br>
                        • VÍA ANTENA DIRECTA: Bloqueo parcial por corona solar. Ruido electromagnético alto.
                    `;
                }
            }

            document.getElementById('sub-clock').innerText = new Date().toTimeString().split(' ')[0];
            requestAnimationFrame(runBunkerLoop);
        }

        // Lógica Touch del Joystick de Apuntamiento Mecánico
        const joyCore = document.getElementById('joyCore');
        const joyRing = document.getElementById('joyRing');

        joyCore.addEventListener('touchmove', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const ringRect = joyRing.getBoundingClientRect();
            const cx = ringRect.left + ringRect.width / 2;
            const cy = ringRect.top + ringRect.height / 2;
            
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const distance = Math.sqrt(dx*dx + dy*dy);
            if(distance > 15) {
                // Al mover el joystick fuerte, simula escaneo manual rápido
                document.getElementById('terminal-log').innerText = "CALIBRANDO FRECUENCIA DE ANTENA MANUALMENTE DESDE EL COMANDO INTERNO...";
            }
            joyCore.style.left = `calc(50% + ${Math.max(-15, Math.min(15, dx))}px)`;
            joyCore.style.top = `calc(50% + ${Math.max(-15, Math.min(15, dy))}px)`;
        });

        joyCore.addEventListener('touchend', () => {
            joyCore.style.left = '50%';
            joyCore.style.top = '50%';
            printTelemetry(activePlanet);
        });

        window.onload = () => {
            buildRadarSystem();
            runBunkerLoop();
        };
    </script>
</body>
</html>
