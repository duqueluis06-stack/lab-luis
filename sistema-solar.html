<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Space Network - Luis Duque</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-blue: #00ffff;
            --neon-pink: #ff00ff;
            --dark-bg: #030712;
        }

        body {
            margin: 0;
            height: 100vh;
            background: var(--dark-bg);
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: var(--neon-blue);
            touch-action: none;
        }

        /* Interfaz Superior Compacta */
        .header-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .header-ui * { pointer-events: auto; }

        .btn-exit {
            background: #000;
            color: #fff;
            border: 2px solid #ff00ff;
            padding: 8px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* Contenedor del Cosmos */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: absolute;
            transform-origin: center;
        }

        .sun {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fff, #ff7700);
            border-radius: 50%;
            box-shadow: 0 0 30px #ff5500;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(0, 255, 255, 0.05);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Planetas y Sondas */
        .planet-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
        }

        .planet-body {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.8);
        }

        /* Sondas Ultra Visibles */
        .probe-satellite {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border: 1px solid var(--neon-blue);
            border-radius: 2px;
            box-shadow: 0 0 8px #fff;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* TEXTO CORREGIDO: Siempre horizontal */
        .fixed-label {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #fff;
            white-space: nowrap;
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid rgba(0,255,255,0.2);
        }

        #laser-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Consola de Comando Inferior */
        .control-console {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .telemetry-screen {
            flex: 1;
            background: rgba(3, 7, 18, 0.9);
            border: 2px solid var(--neon-green);
            border-radius: 6px;
            padding: 8px;
            font-size: 10px;
            height: 130px;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(0,255,102,0.15);
        }

        /* Joystick Analógico */
        .joystick-area {
            width: 85px;
            height: 130px;
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid var(--neon-blue);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .joy-pad {
            width: 50px;
            height: 50px;
            background: #111;
            border: 2px dashed var(--neon-blue);
            border-radius: 50%;
            position: relative;
            margin-top: 5px;
        }

        .joy-stick {
            width: 22px;
            height: 22px;
            background: var(--neon-pink);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px var(--neon-pink);
            cursor: pointer;
        }

        .time-controls {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .btn-time {
            background: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: 9px;
            padding: 2px 6px;
            cursor: pointer;
        }

        .row-tel { display: flex; justify-content: space-between; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header-ui">
        <div>
            <div style="font-size:12px; color:var(--neon-green); font-weight:bold;">LAB LUIS • TELEMETRÍA MÓVIL</div>
            <div style="font-size:9px; color:#888;">Control de Retraso de Vídeo de Alta Definición</div>
        </div>
        <a href="index.html" class="btn-exit">🛸 SALIR AL INDEX</a>
    </div>

    <div id="viewport">
        <canvas id="laser-canvas"></canvas>
        <div class="sun"></div>
        <div id="orbit-layers"></div>
    </div>

    <div class="control-console">
        <div class="telemetry-screen">
            <div class="row-tel">
                <span style="color:var(--neon-pink)">[RELOJ RELATIVISTA]: <span id="clock-digital">00:00:00</span></span>
                <span id="speed-indicator" style="color:yellow">Velocidad: 1x</span>
            </div>
            <div id="telemetry-log" style="color:#a0c0e0; margin-top:4px; line-height: 1.2;">
                Mueve el Joystick analógico o presiona los botones temporales para cambiar el análisis del vector de barrido profundo.
            </div>
            <div class="time-controls">
                <button class="btn-time" onclick="changeTimeSpeed(0)">⏸️ PAUSA</button>
                <button class="btn-time" onclick="changeTimeSpeed(0.2)">⏳ LENTO</button>
                <button class="btn-time" onclick="changeTimeSpeed(1)">▶️ 1X</button>
                <button class="btn-time" onclick="changeTimeSpeed(5)">⏩ 5X</button>
                <button class="btn-time" style="border-color:red; color:red" onclick="triggerPlutoScan()">📡 ESCANEAR PLUTÓN</button>
            </div>
        </div>

        <div class="joystick-area">
            <span style="font-size:8px; color:var(--neon-blue)">JOYSTICK</span>
            <div class="joy-pad" id="joyPad">
                <div class="joy-stick" id="joyStick"></div>
            </div>
            <span style="font-size:8px; color:#888; margin-top:4px;">REDIRECCIÓN</span>
        </div>
    </div>

    <script>
        const PLANETS = [
            { id: 'mercurio', name: 'Mercurio', r: 40, size: 6, speed: 0.02, color: '#9e9e9e' },
            { id: 'venus', name: 'Venus', r: 65, size: 9, speed: 0.012, color: '#e3bb76' },
            { id: 'tierra', name: 'Tierra', r: 95, size: 10, speed: 0.008, color: '#2b82c9' },
            { id: 'marte', name: 'Marte', r: 125, size: 7, speed: 0.006, color: '#c1440e' },
            { id: 'jupiter', name: 'Júpiter', r: 165, size: 16, speed: 0.003, color: '#b07f35' },
            { id: 'saturno', name: 'Saturno', r: 205, size: 13, speed: 0.0015, color: '#ead2ac' },
            { id: 'urano', name: 'Urano', r: 245, size: 11, speed: 0.0008, color: '#aae6f0' },
            { id: 'neptuno', name: 'Neptuno', r: 285, size: 10, speed: 0.0005, color: '#4b70dd' },
            { id: 'pluton', name: 'Plutón', r: 325, size: 5, speed: 0.0003, color: '#9c8e7d' }
        ];

        let timeMultiplier = 1;
        let angles = {};
        const orbitLayers = document.getElementById('orbit-layers');
        const canvas = document.getElementById('laser-canvas');
        const ctx = canvas.getContext('2d');
        let activeLaserIndex = -1;
        let useBridges = true;

        // Construcción limpia y optimizada para móvil
        function buildCosmos() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            PLANETS.forEach(p => {
                angles[p.id] = Math.random() * Math.PI * 2;

                // Órbita lineal fija
                const orb = document.createElement('div');
                orb.className = 'orbit';
                orb.style.width = `${p.r * 2}px`;
                orb.style.height = `${p.r * 2}px`;
                orbitLayers.appendChild(orb);

                // Contenedor rotatorio del planeta
                const container = document.createElement('div');
                container.className = 'planet-container';
                container.id = `container-${p.id}`;

                // Esfera del Planeta
                const body = document.createElement('div');
                body.className = 'planet-body';
                body.style.width = `${p.size}px`;
                body.style.height = `${p.size}px`;
                body.style.backgroundColor = p.color;
                body.style.left = `${p.r}px`;

                // Sonda Física Súper Visible
                const probe = document.createElement('div');
                probe.className = 'probe-satellite';
                body.appendChild(probe);

                // Etiqueta de texto fija
                const label = document.createElement('div');
                label.className = 'fixed-label';
                label.id = `label-${p.id}`;
                label.innerText = p.name;
                body.appendChild(label);

                container.appendChild(body);
                orbitLayers.appendChild(container);
            });
        }

        // Bucle de física fluida en procesadores ARM de móviles
        function loop() {
            PLANETS.forEach(p => {
                angles[p.id] += p.speed * timeMultiplier;
                const container = document.getElementById(`container-${p.id}`);
                container.style.transform = `rotate(${angles[p.id]}rad)`;

                // ANTIRROTACIÓN INVERSA: Mantiene las etiquetas derechas siempre
                const label = document.getElementById(`label-${p.id}`);
                if (label) {
                    label.style.transform = `translateX(-50%) rotate(${-angles[p.id]}rad)`;
                }
            });

            renderLaserTracks();
            document.getElementById('clock-digital').innerText = new Date().toTimeString().split(' ')[0];
            requestAnimationFrame(loop);
        }

        function changeTimeSpeed(val) {
            timeMultiplier = val;
            document.getElementById('speed-indicator').innerText = `Velocidad: ${val}x`;
        }

        function getProbeScreenPos(id) {
            const container = document.getElementById(`container-${id}`);
            if (!container) return {x:0,y:0};
            const p = PLANETS.find(x => x.id === id);
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            return {
                x: cx + Math.cos(angles[id]) * p.r,
                y: cy + Math.sin(angles[id]) * p.r
            };
        }

        // Simulación y Comparación de Telecomunicación Cuántica
        function triggerPlutoScan() {
            activeLaserIndex = 0;
            useBridges = true;
            runDataAnalysisLog();
        }

        function runDataAnalysisLog() {
            const log = document.getElementById('telemetry-log');
            
            // Cálculos comparativos de pérdida de contraste y latencia
            const tiempoDirectoAntena = "4.2 Horas (Antena DSN)";
            const tiempoConPuentes = "4.4 Horas (Cascada Láser)";
            
            log.innerHTML = `
                <span style="color:yellow; font-weight:bold;">[COMANDO EMITIDO DESDE LA TIERRA]</span><br>
                • Destino: Sonda Plutón (Mapeo de Gases y Fragmentos)<br>
                <span style="color:var(--neon-green)">• VÍA PUENTES SATELITALES:</span> Datos íntegros. Contraste de Vídeo HD: 100% (Filtrado por Sondas Nodos). Latencia total acumulada: <b>${tiempoConPuentes}</b>.<br>
                <span style="color:red">• VÍA ANTENA DIRECTA:</span> Pérdida del 42% por distorsión y viento solar. Contraste degradado a ruido gris. Latencia directa: <b>${tiempoDirectoAntena}</b>.
            `;
        }

        function renderLaserTracks() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if (activeLaserIndex === -1) return;

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ff00ff';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff00ff';

            // Dibuja el puente en cascada de atrás hacia adelante (Plutón -> Neptuno -> Urano...)
            for(let i = PLANETS.length - 1; i > 2; i--) {
                const p1 = getProbeScreenPos(PLANETS[i].id);
                const p2 = getProbeScreenPos(PLANETS[i-1].id);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        // Lógica Táctil del Joystick Analógico para Móviles
        const joyStick = document.getElementById('joyStick');
        const joyPad = document.getElementById('joyPad');

        joyStick.addEventListener('touchmove', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const padRect = joyPad.getBoundingClientRect();
            const centerX = padRect.left + padRect.width / 2;
            const centerY = padRect.top + padRect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 20;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyStick.style.left = `calc(50% + ${dx}px)`;
            joyStick.style.top = `calc(50% + ${dy}px)`;

            // Acción simulada por comando al mover el Joystick
            if(dist > 10) {
                activeLaserIndex = 1;
                document.getElementById('telemetry-log').innerHTML = `
                    <span style="color:var(--neon-blue)">[COMANDO DE JOYSTICK ACTIVO]</span><br>
                    Redirigiendo antenas locales. Apuntamiento vectorial corregido mediante reajuste giroscópico manual de las sondas de control.
                `;
            }
        });

        joyStick.addEventListener('touchend', function() {
            joyStick.style.left = '50%';
            joyStick.style.top = '50%';
        });

        window.onload = () => {
            buildCosmos();
            loop();
        };
    </script>
</body>
</html>
