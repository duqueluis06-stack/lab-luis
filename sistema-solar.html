<style>
    :root {
        --bg-bunker: #020408;
        --panel-metal: rgba(7, 12, 22, 0.96);
        --panel-border: #00d4ff;
        --glow-neon: rgba(0, 212, 255, 0.25);
        --green-phosphor: #33ff33;
        --amber-glow: #ffaa00;
        --red-alert: #ff1155;
        --font-console: 'Consolas', 'Courier New', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
    }

    body, html {
        width: 100%;
        height: 100%;
        background-color: var(--bg-bunker);
        color: #ffffff;
        font-family: var(--font-console);
        overflow: hidden;
        position: relative;
    }

    #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    .hud-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: grid;
        grid-template-columns: 330px 1fr 360px;
        grid-template-rows: auto 1fr auto;
        grid-template-areas: 
            "header header header"
            "left-panel center-space right-panel"
            "bottom-panel bottom-panel right-panel";
        padding: 15px;
        gap: 15px;
    }

    .interactive { pointer-events: auto; }

    .btn-escape-bunker {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 1000;
        padding: 8px 14px;
        background: #09101d;
        color: var(--red-alert);
        text-decoration: none;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 2px;
        border: 2px solid var(--red-alert);
        box-shadow: 0 0 10px rgba(255,17,85,0.3);
        text-transform: uppercase;
    }
    .btn-escape-bunker:hover {
        background: var(--red-alert);
        color: #000;
        box-shadow: 0 0 20px var(--red-alert);
    }

    header {
        grid-area: header;
        background: var(--panel-metal);
        border: 2px solid rgba(0, 212, 255, 0.4);
        border-radius: 6px;
        padding: 10px 20px;
        box-shadow: inset 0 0 15px var(--glow-neon);
        margin-top: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    header h1 {
        font-size: 13px;
        letter-spacing: 3px;
        color: #fff;
        text-shadow: 0 0 8px var(--panel-border);
    }
    .system-status-indicator {
        font-size: 10px;
        color: var(--green-phosphor);
        text-shadow: 0 0 5px var(--green-phosphor);
    }

 </head>
