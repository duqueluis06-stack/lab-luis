<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSN Deep Space Terminal - Luis Duque</title>
    <style>
        :root {
            --phosphor-green: #00ff41;
            --radar-blue: #00d2ff;
            --alert-red: #ff3333;
            --hull-black: #020406;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            color: var(--phosphor-green);
            user-select: none;
            touch-action: none;
        }

        /* HUD MILITAR TIPO SUBMARINO DE EXPLORACIÓN */
        .bunker-hud {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100;
            pointer-events: none;
            display: grid;
            grid-template-rows: 50px 1fr 180px;
            box-sizing: border-box;
        }

        .bunker-hud * { pointer-events: auto; }

        header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--phosphor-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        #webgl-viewport {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* DECK DE COMANDOS INFERIOR */
        .deck-console {
            background: rgba(2, 4, 8, 0.98);
            border-top: 2px solid var(--phosphor-green);
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 8px;
            padding: 8px;
        }

        .crt-terminal {
            background: #000;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            padding: 6px;
            font-size: 10px;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .log-screen {
            height: 65px;
            overflow-y: auto;
            color: #a0e0a0;
        }

        /* BOTONERA TÁCTIL DE SELECCIÓN DE PLANETAS */
        .selector-grid {
            background: #040812;
            border: 1px solid var(--radar-blue);
            border-radius: 4px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            overflow-y: auto;
        }

        .btn-militar {
            background: #09170c;
            border: 1px solid var(--phosphor-green);
            color: var(--phosphor-green);
            font-family: inherit;
            font-size: 8px;
            font-weight: bold;
            padding: 4px 2px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }
        .btn-militar:active, .btn-militar.active { 
            background: var(--phosphor-green); 
            color: #000; 
        }

        .btn-action {
            border-color: var(--radar-blue);
            color: var(--radar-blue);
        }

        /* ETIQUETAS HUD FLOTANTES EN 3D */
        .space-tag {
            position: absolute;
            color: #fff;
            font-size: 8px;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--phosphor-green);
            padding: 1px 4px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            z-index: 50;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-viewport"></div>
    <div id="hud-labels-container"></div>

    <div class="bunker-hud">
        <header>
            <div style="font-size: 11px; font-weight: bold; letter-spacing: 1px;">⚠️ DSN SUB-SURFACE CONSOLE // MÓVIL OPTIMIZADO</div>
            <div style="font-size: 10px; color: var(--radar-blue);" id="sub-timer">00:00:00</div>
        </header>

        <div></div>

        <footer class="deck-console">
            <div class="crt-terminal">
                <div id="terminal-stream" class="log-screen">
                    SISTEMA MATRICIAL ONLINE. TEXTURAS PROCEDURALES VECTORIALES GENERADAS POR GPU. CINTURÓN DE KUIPER DEPURADO.
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px;">
                    <button class="btn-militar" onclick="setSpeed(0)">⏸ PAUSA</button>
                    <button class="btn-militar" onclick="setSpeed(0.15)">⏳ LENTO</button>
                    <button class="btn-militar" onclick="setSpeed(1)">⚡ REAL</button>
                    <button class="btn-militar btn-action" onclick="fireLaserNetwork()">🛰️ RETRANSMISIÓN CASCADA</button>
                </div>
            </div>

            <div class="selector-grid" id="target-grid">
                </div>
        </footer>
    </div>

    <script>
        // BASE DE DATOS CIENTÍFICA COMPLETA DEL SISTEMA SOLAR
        const COSMIC_DATA = [
            { id: 'sun', name: 'SOL (CENTRO)', r: 0, size: 14, speed: 0, color: 0xff4500, type: 'star', comp: 'Plasma denso - Olas de fuego de 1.4M km' },
            { id: 'mercurio', name: 'MERCURIO', r: 32, size: 1.4, speed: 0.02, color: 0x7f8c8d, type: 'planet', comp: 'Núcleo de Hierro Sólido' },
            { id: 'venus', name: 'VENUS', r: 46, size: 2.2, speed: 0.014, color: 0xd35400, type: 'planet', comp: 'Gases de Invernadero e Hidrocarburos' },
            { id: 'tierra', name: 'TIERRA (BASE)', r: 64, size: 2.5, speed: 0.01, color: 0x2980b9, type: 'planet', comp: 'Estación Base DSN - Nitrógeno/Oxígeno' },
            { id: 'marte', name: 'MARTE', r: 80, size: 1.7, speed: 0.008, color: 0xc0392b, type: 'planet', comp: 'Óxido Férrico - Sondas de Superficie' },
            { id: 'jupiter', name: 'JÚPITER', r: 115, size: 6.2, speed: 0.004, color: 0xe67e22, type: 'planet', comp: 'Hidrógeno Líquido Metálico Vórtice' },
            { id: 'saturno', name: 'SATURNO', r: 155, size: 5.0, speed: 0.002, color: 0xf1c40f, type: 'planet', comp: 'Gaseoso - Complejo de Anillos Criosféricos', hasRings: true },
            { id: 'urano', name: 'URANO', r: 190, size: 3.5, speed: 0.001, color: 0x1abc9c, type: 'planet', comp: 'Hielo Cuántico - Metano Atmosférico' },
            { id: 'neptuno', name: 'NEPTUNO', r: 220, size: 3.3, speed: 0.0006, color: 0x34495e, type: 'planet', comp: 'Núcleo Rocoso - Vientos de Metano' },
            { id: 'pluton', name: 'PLUTÓN', r: 250, size: 1.0, speed: 0.0003, color: 0x95a5a6, type: 'planet', comp: 'Frontera de Red - Metano y Nitrógeno Sólido' }
        ];

        let scene, camera, renderer;
        let planets3D = {};
        let orbitsAngles = {};
        let timeMultiplier = 0.15;
        let selectedNode = COSMIC_DATA[9]; // Plutón por defecto
        let laserLines = [];
        let networkIsActive = false;

        // --- GENERADOR MATEMÁTICO DE TEXTURAS (PROCEDURAL SIN IMÁGENES) ---
        function createProceduralTexture(type, baseColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Color base
            ctx.fillStyle = baseColorHex;
            ctx.fillRect(0, 0, 128, 128);

            // Inyección de ruido visual/cráteres/olas térmicas mediante patrones matemáticos
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * 128;
                const y = Math.random() * 128;
                const r = Math.random() * 6;
                
                if (type === 'star') { // Olas de fuego del Sol
                    ctx.fillStyle = Math.random() > 0.5 ? '#ffaa00' : '#ff0000';
                } else if (type === 'tierra') { // Continentes simulados
                    ctx.fillStyle = Math.random() > 0.4 ? '#27ae60' : '#f1c40f';
                } else { // Cráteres y bandas gaseosas para el resto
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                }
                
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function initEngine() {
            const container = document.getElementById('webgl-viewport');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010204, 0.002);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
            camera.position.set(0, 200, 220);
            camera.lookAt(0, 0, -20);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Luces del búnker científico
            const ambient = new THREE.AmbientLight(0x444455);
            scene.add(ambient);

            const sunLight = new THREE.PointLight(0xffffff, 3, 600);
            scene.add(sunLight);

            // FONDO DE ESTRELLAS FIJAS
            const starsGeo = new THREE.BufferGeometry();
            const starPositions = new Float32Array(1000 * 3);
            for(let i=0; i<3000; i++) starPositions[i] = (Math.random() - 0.5) * 800;
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
            scene.add(new THREE.Points(starsGeo, starsMat));

            buildCosmos3D();
            buildBunkerInterface();
            window.addEventListener('resize', onWindowResize);
        }

        function buildCosmos3D() {
            COSMIC_DATA.forEach(data => {
                orbitsAngles[data.id] = Math.random() * Math.PI * 2;

                // Dibujar órbitas estables
                if(data.r > 0) {
                    const points = [];
                    for (let i = 0; i <= 64; i++) {
                        const theta = (i / 64) * Math.PI * 2;
                        points.push(new THREE.Vector3(Math.cos(theta) * data.r, 0, Math.sin(theta) * data.r));
                    }
                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ff41, transparent: true, opacity: 0.07 });
                    scene.add(new THREE.Line(orbitGeo, orbitMat));
                }

                const pivot = new THREE.Group();
                scene.add(pivot);

                // Configurar esfera con su textura procedural inmune a bloqueos
                const geo = new THREE.SphereGeometry(data.size, 24, 24);
                let mat;
                const texturizado = createProceduralTexture(data.id, '#' + data.color.toString(16).padStart(6, '0'));

                if(data.type === 'star') {
                    mat = new THREE.MeshBasicMaterial({ map: texturizado });
                } else {
                    mat = new THREE.MeshStandardMaterial({ map: texturizado, roughness: 0.7 });
                }

                const mesh = new THREE.Mesh(geo, mat);
                if(data.r > 0) mesh.position.x = data.r;
                pivot.add(mesh);

                // Anillos de Saturno matemáticos
                if(data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size + 1.5, data.size + 4, 32);
                    ringGeo.rotateX(Math.PI / 2);
                    const ringMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.x = data.r;
                    pivot.add(ringMesh);
                }

                // Nodo Antena Sonda Repetidora
                let probeMesh = null;
                if(data.r > 0) {
                    const probeGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                    const probeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                    probeMesh = new THREE.Mesh(probeGeo, probeMat);
                    probeMesh.position.set(data.r, data.size + 1.0, 0);
                    pivot.add(probeMesh);
                }

                planets3D[data.id] = { pivot: pivot, mesh: mesh, probe: probeMesh, data: data };

                // Crear etiqueta de texto HUD física
                const label = document.createElement('div');
                label.className = 'space-tag';
                label.id = `tag-${data.id}`;
                label.innerText = data.name;
                document.getElementById('hud-labels-container').appendChild(label);
            });

            // --- INTERSECCIÓN 1: CINTURÓN DE ASTEROIDES INTERNO (ENTRE MARTE Y JÚPITER) ---
            const asteroidCount = 250;
            const asteroidGeo = new THREE.BufferGeometry();
            const astPositions = new Float32Array(asteroidCount * 3);
            for(let i=0; i<asteroidCount; i++) {
                const radius = 95 + Math.random() * 12; // Ubicación exacta radial
                const theta = Math.random() * Math.PI * 2;
                astPositions[i*3] = Math.cos(theta) * radius;
                astPositions[i*3+1] = (Math.random() - 0.5) * 1.5;
                astPositions[i*3+2] = Math.sin(theta) * radius;
            }
            asteroidGeo.setAttribute('position', new THREE.BufferAttribute(astPositions, 3));
            const astMat = new THREE.PointsMaterial({ color: 0x887766, size: 0.6 });
            scene.add(new THREE.Points(asteroidGeo, astMat));

            // --- INTERSECCIÓN 2: CINTURÓN DE KUIPER DE EXTREMO PERIMETRAL ---
            const kuiperCount = 400;
            const kuiperGeo = new THREE.BufferGeometry();
            const kuiperPositions = new Float32Array(kuiperCount * 3);
            for(let i=0; i<kuiperCount; i++) {
                const radius = 270 + Math.random() * 35; // Perímetro externo más allá de Plutón
                const theta = Math.random() * Math.PI * 2;
                kuiperPositions[i*3] = Math.cos(theta) * radius;
                kuiperPositions[i*3+1] = (Math.random() - 0.5) * 3;
                kuiperPositions[i*3+2] = Math.sin(theta) * radius;
            }
            kuiperGeo.setAttribute('position', new THREE.BufferAttribute(kuiperPositions, 3));
            const kuiperMat = new THREE.PointsMaterial({ color: 0x7f8c8d, size: 0.5 });
            scene.add(new THREE.Points(kuiperGeo, kuiperMat));
        }

        // CONSTRUCCIÓN DINÁMICA DE LA BOTONERA MILITAR
        function buildBunkerInterface() {
            const grid = document.getElementById('target-grid');
            COSMIC_DATA.forEach(data => {
                if(data.id === 'sun') return; // El sol no es un nodo repetidor de antena
                const btn = document.createElement('button');
                btn.className = 'btn-militar';
                btn.id = `btn-${data.id}`;
                btn.innerText = data.name.split(' ')[0];
                btn.onclick = () => selectNode(data);
                grid.appendChild(btn);
            });
            selectNode(selectedNode);
        }

        function selectNode(node) {
            selectedNode = node;
            COSMIC_DATA.forEach(d => {
                const btn = document.getElementById(`btn-${d.id}`);
                if(btn) btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`btn-${node.id}`);
            if(activeBtn) activeBtn.classList.add('active');

            document.getElementById('terminal-stream').innerHTML = `
                <span style="color:var(--radar-blue)">[NODO BLOQUEADO]: ${node.name}</span><br>
                • ANÁLISIS COMPOSICIÓN CRÍTICA: ${node.comp}<br>
                • ESTADO ENLACE DE RED: Antenas alineadas. Listas para puente láser en cascada.
            `;
        }

        function fireLaserNetwork() {
            if(networkIsActive) return;
            networkIsActive = true;

            laserLines.forEach(l => scene.remove(l));
            laserLines = [];

            const stream = document.getElementById('terminal-stream');
            stream.innerHTML = `<span style="color:yellow; font-weight:bold;">[DISPARANDO PULSO REDUNDANTE EN CASCADA]</span> Avanzando por los nodos repetidores...`;

            let startIdx = COSMIC_DATA.findIndex(x => x.id === selectedNode.id);
            let earthIdx = COSMIC_DATA.findIndex(x => x.id === 'tierra');
            
            let path = [];
            if(startIdx > earthIdx) {
                for(let i = startIdx; i >= earthIdx; i--) path.push(COSMIC_DATA[i].id);
            } else {
                for(let i = startIdx; i <= earthIdx; i++) path.push(COSMIC_DATA[i].id);
            }

            for(let i = 0; i < path.length - 1; i++) {
                const laserMat = new THREE.LineBasicMaterial({ color: 0xff3333, linewidth: 2 });
                const laserGeo = new THREE.BufferGeometry();
                const line = new THREE.Line(laserGeo, laserMat);
                scene.add(line);
                laserLines.push({ line: line, from: path[i], to: path[i+1] });
            }

            setTimeout(() => {
                networkIsActive = false;
                laserLines.forEach(l => scene.remove(l));
                laserLines = [];
                
                const latency = (Math.abs(startIdx - earthIdx) * 1.1).toFixed(1);
                stream.innerHTML = `
                    <span style="color:var(--phosphor-green); font-weight:bold;">[TRANSMISIÓN DE VÍDEO CONTRALADA]</span><br>
                    • FILTRADO RED DE SONDAS: Éxito total. Contraste de Imagen: 100% íntegro.<br>
                    • TIEMPO DE RETRASO SIMULADO: ${latency} Horas. Pérdida de paquetes por viento solar: 0.00%.
                `;
            }, 2500);
        }

        function setSpeed(val) { timeMultiplier = val; }

        function updateLoop() {
            const tempV = new THREE.Vector3();

            COSMIC_DATA.forEach(data => {
                if(data.r > 0) {
                    orbitsAngles[data.id] += data.speed * timeMultiplier;
                    planets3D[data.id].pivot.rotation.y = orbitsAngles[data.id];
                    planets3D[data.id].mesh.rotation.y += 0.01; // Rotación de eje propia
                }

                // Vincular posiciones 3D exactas al plano de renderizado de etiquetas en pantalla
                planets3D[data.id].mesh.getWorldPosition(tempV);
                tempV.project(camera);

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                const label = document.getElementById(`tag-${data.id}`);
                if(label) {
                    if(tempV.z > 1) { label.style.display = 'none'; }
                    else {
                        label.style.display = 'block';
                        label.style.left = `${x}px`;
                        label.style.top = `${y - 8}px`;
                        label.style.borderColor = (data.id === selectedNode.id) ? '#ff3333' : '#00ff41';
                    }
                }
            });

            // Recalcular trayectorias del haz láser dinámico
            if(laserLines.length > 0) {
                laserLines.forEach(item => {
                    const pFrom = new THREE.Vector3();
                    const pTo = new THREE.Vector3();
                    
                    if(item.from === 'sun') planets3D[item.from].mesh.getWorldPosition(pFrom);
                    else planets3D[item.from].probe.getWorldPosition(pFrom);

                    planets3D[item.to].probe.getWorldPosition(pTo);
                    item.line.geometry.setFromPoints([pFrom, pTo]);
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function run() {
            requestAnimationFrame(run);
            updateLoop();
            renderer.render(scene, camera);
            document.getElementById('sub-timer').innerText = new Date().toTimeString().split(' ')[0];
        }

        window.onload = () => {
            initEngine();
            run();
        };
    </script>
</body>
</html>
