<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSN Deep Space Terminal - Telemetría Avanzada</title>
    <style>
        :root {
            --matrix-glow: #00ffaa;
            --radar-blue: #00bfff;
            --alert-red: #ff3344;
            --dark-hull: #030712;
            --panel-border: rgba(0, 255, 170, 0.25);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #010206;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            color: #e0e7ff;
            user-select: none;
            touch-action: none;
        }

        #webgl-viewport {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* INTERFAZ HUD MILITAR / CIENTÍFICA */
        .hud-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100;
            pointer-events: none;
            display: grid;
            grid-template-rows: 60px 1fr auto;
            box-sizing: border-box;
        }

        .hud-container * { pointer-events: auto; }

        header {
            background: linear-gradient(to bottom, rgba(3, 7, 18, 0.95), rgba(3, 7, 18, 0.7));
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            backdrop-filter: blur(8px);
        }

        .header-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--matrix-glow);
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.4);
        }

        /* CONSOLA DE CONTROL INFERIOR OPTIMIZADA PARA MÓVIL */
        .control-deck {
            background: rgba(3, 7, 18, 0.95);
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 12px;
            backdrop-filter: blur(12px);
        }

        @media(min-width: 768px) {
            .control-deck { grid-template-columns: 1.2fr 1fr; }
        }

        .terminal-readout {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 170, 0.15);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
        }

        .data-stream {
            height: 80px;
            overflow-y: auto;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .action-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn-core {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 255, 170, 0.4);
            color: var(--matrix-glow);
            font-size: 10px;
            font-weight: 600;
            padding: 8px 4px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-core:active, .btn-core.active {
            background: var(--matrix-glow);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.4);
        }

        .btn-telemetry {
            border-color: var(--radar-blue);
            color: var(--radar-blue);
        }

        /* REJILLA DE SELECCIÓN PLANETARIA */
        .planet-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn-planet {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            font-size: 9px;
            font-weight: bold;
            padding: 10px 2px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
        }

        .btn-planet.active {
            border-color: var(--radar-blue);
            color: #fff;
            background: rgba(0, 191, 255, 0.2);
            box-shadow: 0 0 8px rgba(0, 191, 255, 0.3);
        }

        /* ETIQUETAS HUD EN ESPACIO 3D */
        .space-tag {
            position: absolute;
            color: #ffffff;
            font-size: 9px;
            font-weight: 600;
            background: rgba(3, 7, 18, 0.9);
            border-left: 2px solid var(--matrix-glow);
            padding: 4px 8px;
            pointer-events: none;
            transform: translate(-50%, -130%);
            white-space: nowrap;
            z-index: 50;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-viewport"></div>
    <div id="hud-labels-container"></div>

    <div class="hud-container">
        <header>
            <div class="header-title">🛰️ DSN DEEP SPACE MONITOR // LUIS DUQUE</div>
            <div style="font-family: monospace; font-size: 12px; color: var(--radar-blue);" id="sub-timer">00:00:00</div>
        </header>

        <div></div>

        <footer class="control-deck">
            <div class="terminal-readout">
                <div id="terminal-stream" class="data-stream">
                    SISTEMA INICIALIZADO. Descargando cartografía planetaria de alta resolución. Nodos ópticos estables.
                </div>
                <div class="action-bar">
                    <button class="btn-core" onclick="setSpeed(0)">⏸ PAUSA</button>
                    <button class="btn-core" onclick="setSpeed(0.05)">⏳ ORBITA</button>
                    <button class="btn-core" onclick="setSpeed(0.4)">⚡ AVANCE</button>
                    <button class="btn-core btn-telemetry" onclick="fireLaserNetwork()">🛰️ RETRANSMISIÓN</button>
                </div>
            </div>

            <div class="planet-matrix" id="target-grid"></div>
        </footer>
    </div>

    <script>
        // BASE DE DATOS DETALLADA CON DISTANCIAS REALES DE SIMULACIÓN Y COMPOSICIÓN
        const COSMIC_DATA = [
            { id: 'sun', name: 'SOL', r: 0, size: 22, speed: 0, color: 0xffaa00, map: 'https://i.imgur.com/b76g0dm.jpeg', comp: '92.1% Hidrógeno, 7.8% Helio. Fusión nuclear activa.', dist: '0.0 UA (Centro de masa)' },
            { id: 'mercurio', name: 'MERCURIO', r: 42, size: 1.8, speed: 0.015, color: 0x8a8d8f, map: 'https://i.imgur.com/7b16pY4.jpeg', comp: '70% metales (núcleo de hierro denso), 30% silicatos.', dist: '0.39 UA del Sol' },
            { id: 'venus', name: 'VENUS', r: 60, size: 2.8, speed: 0.011, color: 0xe3974d, map: 'https://i.imgur.com/u0fBt78.jpeg', comp: 'Atmósfera de CO2 densa, nubes de Ácido Sulfúrico.', dist: '0.72 UA del Sol' },
            { id: 'tierra', name: 'TIERRA', r: 84, size: 3.0, speed: 0.008, color: 0x2b82c9, map: 'https://i.imgur.com/71E4caH.jpeg', comp: '78% Nitrógeno, 21% Oxígeno. Agua líquida superficial.', dist: '1.00 UA (Nodo Base)' },
            { id: 'marte', name: 'MARTE', r: 108, size: 2.2, speed: 0.006, color: 0xc1440e, map: 'https://i.imgur.com/ChYycda.jpeg', comp: 'Corteza de Óxido de Hierro, atmósfera delgada de CO2.', dist: '1.52 UA del Sol' },
            { id: 'jupiter', name: 'JÚPITER', r: 150, size: 7.5, speed: 0.003, color: 0xb07f35, map: 'https://i.imgur.com/GZ0Z9V3.jpeg', comp: 'Gigante gaseoso. Hidrógeno molecular líquido y helio.', dist: '5.20 UA del Sol' },
            { id: 'saturno', name: 'SATURNO', r: 195, size: 6.2, speed: 0.002, color: 0xe2bf7d, map: 'https://i.imgur.com/9Q6EwT5.jpeg', comp: 'Hidrógeno, helio, metano. Sistema de anillos de hielo.', dist: '9.58 UA del Sol', hasRings: true },
            { id: 'urano', name: 'URANO', r: 240, size: 4.2, speed: 0.001, color: 0x4b70dd, map: 'https://i.imgur.com/ZInshX7.jpeg', comp: 'Atmósfera de Hidrógeno/Helio, mantos de hielo de Metano.', dist: '19.22 UA del Sol' },
            { id: 'neptuno', name: 'NEPTUNO', r: 285, size: 4.0, speed: 0.0008, color: 0x274687, map: 'https://i.imgur.com/H99E6bJ.jpeg', comp: 'Núcleo rocoso envuelto en agua, amoníaco y metano.', dist: '30.05 UA del Sol' }
        ];

        let scene, camera, renderer;
        let planets3D = {};
        let orbitsAngles = {};
        let timeMultiplier = 0.05;
        let selectedNode = COSMIC_DATA[3]; // Tierra por defecto
        let laserLines = [];
        let networkIsActive = false;
        
        // Variables para la interpolación del Zoom de cámara
        let targetCamPosition = new THREE.Vector3(0, 180, 250);
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let currentLookAt = new THREE.Vector3(0, 0, 0);

        const textureLoader = new THREE.TextureLoader();

        function initEngine() {
            const container = document.getElementById('webgl-viewport');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010206, 0.0015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(targetCamPosition.x, targetCamPosition.y, targetCamPosition.z);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Luces equilibradas para realzar las texturas esféricas
            const ambient = new THREE.AmbientLight(0x333333);
            scene.add(ambient);

            const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
            scene.add(sunLight);

            // Campo Estelar de Fondo Complejo
            const starsGeo = new THREE.BufferGeometry();
            const starPositions = new Float32Array(1500 * 3);
            for(let i=0; i<4500; i++) starPositions[i] = (Math.random() - 0.5) * 1200;
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(starsGeo, starsMat));

            buildCosmos3D();
            buildBunkerInterface();
            window.addEventListener('resize', onWindowResize);
        }

        function buildCosmos3D() {
            COSMIC_DATA.forEach(data => {
                orbitsAngles[data.id] = Math.random() * Math.PI * 2;

                // Líneas de órbita finas y elegantes
                if(data.r > 0) {
                    const points = [];
                    for (let i = 0; i <= 128; i++) {
                        const theta = (i / 128) * Math.PI * 2;
                        points.push(new THREE.Vector3(Math.cos(theta) * data.r, 0, Math.sin(theta) * data.r));
                    }
                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.05 });
                    scene.add(new THREE.Line(orbitGeo, orbitMat));
                }

                const pivot = new THREE.Group();
                scene.add(pivot);

                const geo = new THREE.SphereGeometry(data.size, 32, 32);
                let mat;

                // Carga de Textura desde la red con Fallback de color sólido en caso de fallo de red
                if(data.id === 'sun') {
                    mat = new THREE.MeshBasicMaterial({
                        map: textureLoader.load(data.map, undefined, undefined, () => {
                            mat.color.setHex(data.color);
                        })
                    });
                } else {
                    mat = new THREE.MeshStandardMaterial({
                        map: textureLoader.load(data.map, undefined, undefined, () => {
                            mat.color.setHex(data.color);
                        }),
                        roughness: 0.8,
                        metalness: 0.1
                    });
                }

                const mesh = new THREE.Mesh(geo, mat);
                if(data.r > 0) mesh.position.x = data.r;
                pivot.add(mesh);

                // Anillos cinemáticos para Saturno
                if(data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size + 2, data.size + 6, 64);
                    ringGeo.rotateX(Math.PI / 2);
                    const ringMat = new THREE.MeshStandardMaterial({ 
                        color: 0xbc9b6a, 
                        side: THREE.DoubleSide, 
                        transparent: true, 
                        opacity: 0.6 
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.x = data.r;
                    pivot.add(ringMesh);
                }

                // Sonda espacial acoplada a cada planeta
                let probeMesh = null;
                if(data.r > 0) {
                    const probeGeo = new THREE.ConeGeometry(0.4, 1, 4);
                    probeGeo.rotateX(Math.PI / 2);
                    const probeMat = new THREE.MeshBasicMaterial({ color: 0x00bfff });
                    probeMesh = new THREE.Mesh(probeGeo, probeMat);
                    probeMesh.position.set(data.r, data.size + 1.5, 0);
                    pivot.add(probeMesh);
                }

                planets3D[data.id] = { pivot: pivot, mesh: mesh, probe: probeMesh, data: data };

                // Etiqueta flotante en la interfaz HTML
                const label = document.createElement('div');
                label.className = 'space-tag';
                label.id = `tag-${data.id}`;
                label.innerText = data.name;
                document.getElementById('hud-labels-container').appendChild(label);
            });
        }

        function buildBunkerInterface() {
            const grid = document.getElementById('target-grid');
            COSMIC_DATA.forEach(data => {
                const btn = document.createElement('button');
                btn.className = 'btn-planet';
                btn.id = `btn-${data.id}`;
                btn.innerText = data.name;
                btn.onclick = () => selectNode(data);
                grid.appendChild(btn);
            });
            selectNode(selectedNode);
        }

        function selectNode(node) {
            selectedNode = node;
            COSMIC_DATA.forEach(d => {
                const btn = document.getElementById(`btn-${d.id}`);
                if(btn) btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`btn-${node.id}`);
            if(activeBtn) activeBtn.classList.add('active');

            // Actualización de datos serios en pantalla
            document.getElementById('terminal-stream').innerHTML = `
                <span style="color:var(--radar-blue); font-weight:bold;">[TELEMETRÍA ENFOQUE]: ${node.name}</span><br>
                • DISTANCIA RADIAL: ${node.dist}<br>
                • COMPOSICIÓN: ${node.comp}<br>
                • ESTADO SONDA: Sincronizada. Buscando vector de señal óptimo.
            `;
        }

        function fireLaserNetwork() {
            if(networkIsActive) return;
            networkIsActive = true;

            laserLines.forEach(l => scene.remove(l));
            laserLines = [];

            const stream = document.getElementById('terminal-stream');
            stream.innerHTML = `<span style="color:#ff3344; font-weight:bold;">[EMISIÓN LÁSER]</span> Estableciendo enlace cuántico con la antena repetidora...`;

            let startIdx = COSMIC_DATA.findIndex(x => x.id === selectedNode.id);
            let earthIdx = COSMIC_DATA.findIndex(x => x.id === 'tierra');
            
            let path = [];
            if(startIdx > earthIdx) {
                for(let i = startIdx; i >= earthIdx; i--) path.push(COSMIC_DATA[i].id);
            } else {
                for(let i = startIdx; i <= earthIdx; i++) path.push(COSMIC_DATA[i].id);
            }

            for(let i = 0; i < path.length - 1; i++) {
                const laserMat = new THREE.LineBasicMaterial({ color: 0x00ffaa, linewidth: 3 });
                const laserGeo = new THREE.BufferGeometry();
                const line = new THREE.Line(laserGeo, laserMat);
                scene.add(line);
                laserLines.push({ line: line, from: path[i], to: path[i+1] });
            }

            setTimeout(() => {
                networkIsActive = false;
                laserLines.forEach(l => scene.remove(l));
                laserLines = [];
                
                const latency = (Math.abs(startIdx - earthIdx) * 8.3).toFixed(2);
                stream.innerHTML = `
                    <span style="color:var(--matrix-glow); font-weight:bold;">[DATOS DESCARGADOS]</span><br>
                    • CONEXIÓN DSN: Éxito completo.<br>
                    • COBERTURA DE SEÑAL: 99.81% Estable.<br>
                    • LATENCIA SIMULADA DE RED: ${latency} Minutos luz.
                `;
            }, 3000);
        }

        function setSpeed(val) { timeMultiplier = val; }

        function updateLoop() {
            const tempV = new THREE.Vector3();

            COSMIC_DATA.forEach(data => {
                if(data.r > 0) {
                    orbitsAngles[data.id] += data.speed * timeMultiplier;
                    planets3D[data.id].pivot.rotation.y = orbitsAngles[data.id];
                    planets3D[data.id].mesh.rotation.y += 0.005; 
                }

                // Obtener posición del mundo real del objeto 3D
                planets3D[data.id].mesh.getWorldPosition(tempV);

                // Si el objeto es el seleccionado, calcular la cámara para que haga ZOOM encima de él
                if (data.id === selectedNode.id) {
                    targetLookAt.copy(tempV);
                    
                    if (data.id === 'sun') {
                        targetCamPosition.set(0, data.size * 2.5, data.size * 3.5);
                    } else {
                        // Coloca la cámara siguiendo al planeta de cerca de forma suave
                        targetCamPosition.set(
                            tempV.x + Math.cos(orbitsAngles[data.id] * 0.2) * (data.size * 4),
                            tempV.y + data.size * 2,
                            tempV.z + Math.sin(orbitsAngles[data.id] * 0.2) * (data.size * 4)
                        );
                    }
                }

                // Mapeo tridimensional a coordenadas HUD de pantalla
                tempV.project(camera);
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                const label = document.getElementById(`tag-${data.id}`);
                if(label) {
                    if(tempV.z > 1) { label.style.display = 'none'; }
                    else {
                        label.style.display = 'block';
                        label.style.left = `${x}px`;
                        label.style.top = `${y - 10}px`;
                        label.style.borderColor = (data.id === selectedNode.id) ? '#00bfff' : 'rgba(0, 255, 170, 0.3)';
                    }
                }
            });

            // Interpolaciones matemáticas suaves (Lerp) para el Zoom de la Cámara
            camera.position.lerp(targetCamPosition, 0.05);
            currentLookAt.lerp(targetLookAt, 0.05);
            camera.lookAt(currentLookAt);

            // Renderizado de las trayectorias de los vectores láser
            if(laserLines.length > 0) {
                laserLines.forEach(item => {
                    const pFrom = new THREE.Vector3();
                    const pTo = new THREE.Vector3();
                    
                    if(item.from === 'sun') planets3D[item.from].mesh.getWorldPosition(pFrom);
                    else planets3D[item.from].probe.getWorldPosition(pFrom);

                    planets3D[item.to].probe.getWorldPosition(pTo);
                    item.line.geometry.setFromPoints([pFrom, pTo]);
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function run() {
            requestAnimationFrame(run);
            updateLoop();
            renderer.render(scene, camera);
            document.getElementById('sub-timer').innerText = new Date().toTimeString().split(' ')[0] + " UTC";
        }

        window.onload = () => {
            initEngine();
            run();
        };
    </script>
</body>
</html>
