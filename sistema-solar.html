<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Système Solaire</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle, #111 60%, #000 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Conteneur de l'espace */
        .universe {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Le Soleil */
        .sun {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fffa73 20%, #ff5100 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #ff5100;
            z-index: 10;
        }

        /* Orbites de base */
        .orbit {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin linear infinite;
        }

        /* Définition des planètes */
        .planet {
            position: absolute;
            border-radius: 50%;
            top: 0;
            transform: translateY(-50%);
        }

        /* Spécificités des orbites et tailles (échelles non réelles pour la visibilité) */
        .mercury-orbit { width: 120px; height: 120px; animation-duration: 3s; }
        .mercury { width: 10px; height: 10px; background: #9c9c9c; }

        .venus-orbit { width: 180px; height: 180px; animation-duration: 6s; }
        .venus { width: 16px; height: 16px; background: #e3bb76; }

        .earth-orbit { width: 260px; height: 260px; animation-duration: 10s; }
        .earth { width: 18px; height: 18px; background: #4b70dd; }

        .mars-orbit { width: 340px; height: 340px; animation-duration: 14s; }
        .mars { width: 14px; height: 14px; background: #c1440e; }

        .jupiter-orbit { width: 460px; height: 460px; animation-duration: 25s; }
        .jupiter { width: 30px; height: 30px; background: #b07f35; }

        /* Animation de rotation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Titre */
        .info {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div class="info">
        <h1>Le Système Solaire</h1>
        <p>Modèle d'animation CSS (les échelles et distances ne sont pas réelles)</p>
    </div>

    <div class="universe">
        <div class="sun"></div>

        <div class="orbit mercury-orbit">
            <div class="planet mercury"></div>
        </div>

        <div class="orbit venus-orbit">
            <div class="planet venus"></div>
        </div>

        <div class="orbit earth-orbit">
            <div class="planet earth"></div>
        </div>

        <div class="orbit mars-orbit">
            <div class="planet mars"></div>
        </div>

        <div class="orbit jupiter-orbit">
            <div class="planet jupiter"></div>
        </div>
    </div>

</body>
</html>
