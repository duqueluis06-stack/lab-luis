<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSN Quantum Lab 3D - Luis Duque</title>
    <style>
        :root {
            --phosphor-green: #00ff41;
            --radar-blue: #00d2ff;
            --alert-orange: #ff9900;
            --hull-black: #020408;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            color: var(--phosphor-green);
            user-select: none;
            touch-action: none;
        }

        /* HUD DE MANDOS MILITARES (ESTILO SUBMARINO) */
        .bunker-hud {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100;
            pointer-events: none;
            display: grid;
            grid-template-rows: 50px 1fr 170px;
            box-sizing: border-box;
        }

        .bunker-hud * { pointer-events: auto; }

        header {
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid var(--phosphor-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .btn-abort {
            background: #ff2222;
            color: #fff;
            border: 1px solid #fff;
            padding: 5px 10px;
            font-size: 10px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 3px;
        }

        #webgl-viewport {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        .deck-console {
            background: rgba(2, 4, 8, 0.95);
            border-top: 2px solid var(--phosphor-green);
            display: grid;
            grid-template-columns: 1fr 95px;
            gap: 8px;
            padding: 8px;
        }

        .crt-terminal {
            background: #000;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            padding: 6px;
            font-size: 10px;
            line-height: 1.3;
        }

        .joy-container {
            background: #050a14;
            border: 1px solid var(--radar-blue);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .analog-pad {
            width: 50px; height: 50px;
            border: 2px solid var(--radar-blue);
            border-radius: 50%;
            position: relative;
            background: #000;
        }

        .analog-stick {
            width: 20px; height: 20px;
            background: var(--alert-orange);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px var(--alert-orange);
        }

        .btn-militar {
            background: #09170c;
            border: 1px solid var(--phosphor-green);
            color: var(--phosphor-green);
            font-family: inherit;
            font-size: 9px;
            font-weight: bold;
            padding: 4px;
            cursor: pointer;
            width: 100%;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 6px;
        }

        /* TEXTOS FLOTANTES SOBRE PLANETAS REALES */
        .space-tag {
            position: absolute;
            color: #fff;
            font-size: 9px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--phosphor-green);
            padding: 2px 4px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            z-index: 50;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-viewport"></div>
    <div id="hud-labels-container"></div>

    <div class="bunker-hud">
        <header>
            <div style="font-size: 11px; font-weight: bold;">🛰️ INTERFAZ DE COMANDO DSN REALISTA</div>
            <a href="index.html" class="btn-abort">DISCONNECT</a>
        </header>

        <div></div>

        <footer class="deck-console">
            <div class="crt-terminal">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid rgba(0,255,65,0.2); padding-bottom:2px; color:#fff;">
                    <span>MONITOR DE RED DE TRANSMISIÓN LÁSER</span>
                    <span id="sub-timer">00:00:00</span>
                </div>
                <div id="terminal-stream" style="margin-top:4px; height:60px; overflow-y:auto; color: #a0e0a0;">
                    TEXTURAS DE ALTA FIDELIDAD CARGADAS DE SERVIDORES DE EXPLORACIÓN PLANETARIA. SELECCIONE NODO PERIMETRAL.
                </div>
                
                <div class="btn-grid">
                    <button class="btn-militar" onclick="setOrbitSpeed(0)">⏸ PAUSA</button>
                    <button class="btn-militar" onclick="setOrbitSpeed(0.1)">🎚️ LENTO</button>
                    <button class="btn-militar" onclick="setOrbitSpeed(1)">⚡ TIEMPO R.</button>
                    <button class="btn-militar" style="border-color:var(--radar-blue); color:var(--radar-blue);" onclick="fireLaserNetwork()">🛰️ ENRUTAR LÁSER</button>
                </div>
            </div>

            <div class="joy-container">
                <span style="font-size:7px; color:var(--radar-blue); margin-bottom:2px;">ORBIT-CAM</span>
                <div class="analog-pad" id="padArea">
                    <div class="analog-stick" id="joyStick"></div>
                </div>
                <button class="btn-militar" style="font-size:7px; padding:1px; margin-top:3px;" onclick="cycleSensorMode()">MODE: VIDEO</button>
            </div>
        </footer>
    </div>

    <script>
        // TEXTURAS PLANETARIAS REALISTAS (Servidores estables de mapas esféricos libres)
        const TX_URL = "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/";
        
        const COSMIC_DATA = [
            { id: 'mercurio', name: 'MERCURIO', r: 35, size: 1.5, speed: 0.015, tx: 'https://i.imgur.com/768uVSu.jpeg', comp: 'Rocoso - Hierro denso' },
            { id: 'venus', name: 'VENUS', r: 52, size: 2.3, speed: 0.010, tx: 'https://i.imgur.com/GisLw6f.jpeg', comp: 'Atmósfera Gaseosa Ácida' },
            { id: 'tierra', name: 'TIERRA (BASE)', r: 72, size: 2.6, speed: 0.008, tx: 'https://i.imgur.com/b9U6n7s.jpeg', comp: 'Rocosa - Red de Antenas Base' },
            { id: 'marte', name: 'MARTE', r: 92, size: 1.8, speed: 0.006, tx: 'https://i.imgur.com/9QZfXw8.jpeg', comp: 'Rocoso - Sonda Óxido Férrico' },
            { id: 'jupiter', name: 'JÚPITER', r: 125, size: 5.8, speed: 0.003, tx: 'https://i.imgur.com/TofjGgU.jpeg', comp: 'Gaseoso Hidrógeno/Helio' },
            { id: 'saturno', name: 'SATURNO', r: 165, size: 4.8, speed: 0.0015, tx: 'https://i.imgur.com/orZ0L10.jpeg', comp: 'Gaseoso Anillado', hasRings: true },
            { id: 'urano', name: 'URANO', r: 200, size: 3.4, speed: 0.0008, tx: 'https://i.imgur.com/b7Oic9I.jpeg', comp: 'Gaseoso Helado - Metano' },
            { id: 'neptuno', name: 'NEPTUNO', r: 230, size: 3.2, speed: 0.0005, tx: 'https://i.imgur.com/wVfK0Z2.jpeg', comp: 'Gaseoso Dinámico Azul' },
            { id: 'pluton', name: 'PLUTÓN', r: 260, size: 1.1, speed: 0.0002, tx: 'https://i.imgur.com/Fw794lM.jpeg', comp: 'Nodo Enano Metano Sólido' }
        ];

        let scene, camera, renderer, texLoader;
        let planets3D = {};
        let orbitsAngles = {};
        let timeMultiplier = 0.1; 
        let selectedNode = COSMIC_DATA[8]; 
        let sensorModeIdx = 0;
        const SENSOR_MODES = ['VIDEO COMPLETO HD (1080P/CASCADA)', 'BARRIDO DE ENERGÍA DE GASES', 'DETECCIÓN METEORÍTICA'];

        let laserLines = [];
        let networkIsActive = false;

        function initEngine3D() {
            const container = document.getElementById('webgl-viewport');
            
            scene = new THREE.Scene();
            texLoader = new THREE.TextureLoader();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 160, 150);
            camera.lookAt(0, 0, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // FONDO DE ESTRELLAS REALISTAS (STARFIELD MATEMÁTICO 3D)
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 1200;
            const starPositions = new Float32Array(starsCount * 3);

            for(let i=0; i<starsCount*3; i++) {
                starPositions[i] = (Math.random() - 0.5) * 600;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, sizeAttenuation: true });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);

            // ILUMINACIÓN DEL COSMOS
            const ambient = new THREE.AmbientLight(0x333333); // Luz de fondo para ver el lado oscuro planetario
            scene.add(ambient);

            const sunLight = new THREE.PointLight(0xffffff, 2.5, 400); // Fuego del Sol
            scene.add(sunLight);

            buildSolarSystem3D();
            window.addEventListener('resize', onWindowResize);
        }

        function buildSolarSystem3D() {
            // SOL MASIVO REALISTA CON TEXTURA DE CORONA SOLAR
            const sunGeo = new THREE.SphereGeometry(12, 32, 32);
            // Cargamos textura realista de fuego del Sol
            const sunTex = texLoader.load('https://i.imgur.com/A6S814X.jpeg');
            const sunMat = new THREE.MeshBasicMaterial({ map: sunTex });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sunMesh);

            // CONSTRUIR CORTE DE CADA PLANETA CON SU TEXTURA RESPECTIVA
            COSMIC_DATA.forEach(data => {
                orbitsAngles[data.id] = Math.random() * Math.PI * 2;

                // Línea guía de órbita
                const points = [];
                for (let i = 0; i <= 64; i++) {
                    const theta = (i / 64) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * data.r, 0, Math.sin(theta) * data.r));
                }
                const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ff41, transparent: true, opacity: 0.08 });
                const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                scene.add(orbitLine);

                const pivot = new THREE.Group();
                scene.add(pivot);

                // Configuración de textura de alta fidelidad desde servidor
                const pTex = texLoader.load(data.tx);
                const planetGeo = new THREE.SphereGeometry(data.size, 32, 32);
                const planetMat = new THREE.MeshStandardMaterial({ 
                    map: pTex,
                    roughness: 0.8,
                    metalness: 0.1 
                });
                const planetMesh = new THREE.Mesh(planetGeo, planetMat);
                planetMesh.position.x = data.r;
                pivot.add(planetMesh);

                // Anillos texturizados para Saturno
                if(data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size + 1.5, data.size + 4.5, 32);
                    ringGeo.rotateX(Math.PI / 2);
                    const ringMat = new THREE.MeshStandardMaterial({ color: 0xbb9977, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.x = data.r;
                    pivot.add(ringMesh);
                }

                // Sonda Repetidora de Señal (Fijada sobre la órbita de cada cuerpo)
                const probeGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const probeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                const probeMesh = new THREE.Mesh(probeGeo, probeMat);
                probeMesh.position.set(data.r, data.size + 1.0, 0);
                pivot.add(probeMesh);

                planets3D[data.id] = { pivot: pivot, mesh: planetMesh, probe: probeMesh, data: data };

                // HUD de nombre flotante
                const label = document.createElement('div');
                label.className = 'space-tag';
                label.id = `tag-${data.id}`;
                label.innerText = data.name;
                document.getElementById('hud-labels-container').appendChild(label);
            });

            executeDataStreamUpdate();
        }

        function fireLaserNetwork() {
            if(networkIsActive) return;
            networkIsActive = true;

            laserLines.forEach(l => scene.remove(l));
            laserLines = [];

            const terminal = document.getElementById('terminal-stream');
            terminal.innerHTML = `<span style="color:yellow;">[DISPARO INTERPLANETARIO] Enrutando datos redundantes...</span>`;

            let startIdx = COSMIC_DATA.findIndex(x => x.id === selectedNode.id);
            let earthIdx = COSMIC_DATA.findIndex(x => x.id === 'tierra');
            
            let path = [];
            if(startIdx > earthIdx) {
                for(let i = startIdx; i >= earthIdx; i--) path.push(COSMIC_DATA[i].id);
            } else {
                for(let i = startIdx; i <= earthIdx; i++) path.push(COSMIC_DATA[i].id);
            }

            for(let i = 0; i < path.length - 1; i++) {
                const laserMat = new THREE.LineBasicMaterial({ color: 0xff0055, linewidth: 2 });
                const laserGeo = new THREE.BufferGeometry();
                const line = new THREE.Line(laserGeo, laserMat);
                scene.add(line);
                laserLines.push({ line: line, from: path[i], to: path[i+1] });
            }

            setTimeout(() => {
                networkIsActive = false;
                laserLines.forEach(l => scene.remove(l));
                laserLines = [];
                
                const latency = (Math.abs(startIdx - earthIdx) * 1.4).toFixed(1);

                terminal.innerHTML = `
                    <span style="color:#fff;">[PAQUETE HD DECODIFICADO EN SUBMARINO BASE]</span><br>
                    • MODO: ${SENSOR_MODES[sensorModeIdx]}<br>
                    • INFORME: Datos salvaguardados por puentes sucesivos.<br>
                    • TIEMPO CALCULADO HASTA LA TIERRA: ${latency} Horas-Luz. Pérdida: 0%.
                `;
            }, 2500);
        }

        function updatePositionsAndHUD() {
            const tempV = new THREE.Vector3();

            COSMIC_DATA.forEach(data => {
                orbitsAngles[data.id] += data.speed * timeMultiplier;
                planets3D[data.id].pivot.rotation.y = orbitsAngles[data.id];
                planets3D[data.id].mesh.rotation.y += 0.008; // Giro natural del eje

                planets3D[data.id].mesh.getWorldPosition(tempV);
                tempV.project(camera);

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                const label = document.getElementById(`tag-${data.id}`);
                if(label) {
                    if(tempV.z > 1) { label.style.display = 'none'; } 
                    else {
                        label.style.display = 'block';
                        label.style.left = `${x}px`;
                        label.style.top = `${y - 10}px`;
                        label.style.borderColor = (data.id === selectedNode.id) ? '#ff2222' : '#00ff41';
                    }
                }
            });

            if(laserLines.length > 0) {
                laserLines.forEach(item => {
                    const pFrom = new THREE.Vector3();
                    const pTo = new THREE.Vector3();
                    planets3D[item.from].probe.getWorldPosition(pFrom);
                    planets3D[item.to].probe.getWorldPosition(pTo);
                    item.line.geometry.setFromPoints([pFrom, pTo]);
                });
            }
        }

        function setOrbitSpeed(val) { timeMultiplier = val; }

        function cycleSensorMode() {
            sensorModeIdx = (sensorModeIdx + 1) % SENSOR_MODES.length;
            event.target.innerText = `MODE: ${SENSOR_MODES[sensorModeIdx].split(' ')[1]}`;
            executeDataStreamUpdate();
        }

        function executeDataStreamUpdate() {
            if(networkIsActive) return;
            document.getElementById('terminal-stream').innerHTML = `
                <span style="color:var(--radar-blue)">[APUNTADO]: ${selectedNode.name}</span><br>
                • COMPOSICIÓN: ${selectedNode.comp}<br>
                • RED DE REPETIDORES: Sondas listas para el cálculo de latencia.
            `;
        }

        // CONTROL DEL JOYSTICK ANALÓGICO PARA HACER GIRAR LA CÁMARA ESPACIAL
        const joyStick = document.getElementById('joyStick');
        const padArea = document.getElementById('padArea');

        function handleJoystick(clientX, clientY) {
            const rect = padArea.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let dx = clientX - cx;
            let dy = clientY - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > 15) { dx = (dx/dist)*15; dy = (dy/dist)*15; }

            joyStick.style.left = `calc(50% + ${dx}px)`;
            joyStick.style.top = `calc(50% + ${dy}px)`;

            // Rotar cámara de observación usando el pad analógico
            camera.position.x = Math.sin(dx * 0.06) * 150;
            camera.position.z = Math.cos(dx * 0.06) * 150 + (dy * 1.5);
            camera.lookAt(0, 0, -10);
        }

        joyStick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleJoystick(e.touches[0].clientX, e.touches[0].clientY);
        });
        joyStick.addEventListener('touchend', () => { joyStick.style.left = '50%'; joyStick.style.top = '50%'; });

        // Clic en pantalla cambia el foco de telemetría a un planeta aleatorio para análisis rápido
        window.addEventListener('click', (e) => {
            if(e.clientY < window.innerHeight - 170 && e.clientY > 50) {
                const rIdx = Math.floor(Math.random() * COSMIC_DATA.length);
                selectedNode = COSMIC_DATA[rIdx];
                executeDataStreamUpdate();
            }
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            updatePositionsAndHUD();
            renderer.render(scene, camera);
            document.getElementById('sub-timer').innerText = new Date().toTimeString().split(' ')[0];
        }

        window.onload = () => {
            initEngine3D();
            renderLoop();
        };
    </script>
</body>
</html>
