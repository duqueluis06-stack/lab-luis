<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSN Deep Space Terminal - Telemetría Científica Avanzada</title>
    <style>
        :root {
            --matrix-glow: #00ffaa;
            --radar-blue: #00bfff;
            --alert-red: #ff3344;
            --dark-hull: #02040a;
            --panel-border: rgba(0, 255, 170, 0.25);
            --neon-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000205;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f0f4f8;
            user-select: none;
            touch-action: none;
        }

        #webgl-viewport {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* COMPONENTE INTERFAZ HUD TÁCTICO MÓVIL/DESKTOP */
        .hud-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100;
            pointer-events: none;
            display: grid;
            grid-template-rows: 65px 1fr auto;
            box-sizing: border-box;
        }

        .hud-container * { pointer-events: auto; }

        header {
            background: linear-gradient(to bottom, rgba(2, 4, 10, 0.98), rgba(2, 4, 10, 0.75));
            border-bottom: 2px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .header-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--matrix-glow);
            text-shadow: var(--neon-shadow);
        }

        /* CONSOLA DE OPERACIONES INFERIOR REESTRUCTURADA */
        .control-deck {
            background: rgba(2, 4, 10, 0.96);
            border-top: 2px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 16px;
            backdrop-filter: blur(15px);
            box-shadow: 0 -4px 25px rgba(0,0,0,0.7);
        }

        @media(min-width: 768px) {
            .control-deck { grid-template-columns: 1.3fr 1fr; }
        }

        .terminal-readout {
            background: rgba(0, 2, 5, 0.85);
            border: 1px solid rgba(0, 255, 170, 0.2);
            border-radius: 8px;
            padding: 14px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(0,255,170,0.05);
        }

        .data-stream {
            height: 95px;
            overflow-y: auto;
            color: #e2e8f0;
            margin-bottom: 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 255, 170, 0.3) transparent;
        }

        .action-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-core {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 255, 170, 0.5);
            color: var(--matrix-glow);
            font-size: 11px;
            font-weight: 700;
            padding: 10px 6px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
        }

        .btn-core:hover {
            background: rgba(0, 255, 170, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }

        .btn-core:active, .btn-core.active {
            background: var(--matrix-glow);
            color: #02040a;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.5);
        }

        .btn-telemetry {
            border-color: var(--radar-blue);
            color: var(--radar-blue);
        }
        .btn-telemetry:hover {
            background: rgba(0, 191, 255, 0.1);
        }

        /* REJILLA MATRICIAL SISTEMA SOLAR */
        .planet-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-content: center;
        }

        .btn-planet {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.12);
            color: #94a3b8;
            font-size: 10px;
            font-weight: 800;
            padding: 14px 4px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-planet:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }

        .btn-planet.active {
            border-color: var(--radar-blue);
            color: #ffffff;
            background: rgba(0, 191, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 191, 255, 0.4);
            text-shadow: 0 0 5px #fff;
        }

        /* CONTENEDORES FLOTANTES HUD ESPACIAL REAL */
        .space-tag {
            position: absolute;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            background: rgba(2, 4, 10, 0.92);
            border-left: 3px solid var(--matrix-glow);
            padding: 5px 10px;
            pointer-events: none;
            transform: translate(-50%, -140%);
            white-space: nowrap;
            z-index: 50;
            border-radius: 0 5px 5px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            font-family: monospace;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-viewport"></div>
    <div id="hud-labels-container"></div>

    <div class="hud-container">
        <header>
            <div class="header-title">🛰️ DSN DEEP SPACE OPERATIONAL TERMINAL // LUIS DUQUE</div>
            <div style="font-family: 'Consolas', monospace; font-size: 13px; color: var(--radar-blue); font-weight: bold; letter-spacing: 1px;" id="sub-timer">00:00:00 UTC</div>
        </header>

        <div></div>

        <footer class="control-deck">
            <div class="terminal-readout">
                <div id="terminal-stream" class="data-stream">
                    SISTEMA OPERATIVO DSN ONLINE. Generando núcleos matemáticos de textura planetaria. Motores listos.
                </div>
                <div class="action-bar">
                    <button class="btn-core" id="btn-pause" onclick="setSpeed(0)">⏸ PAUSA</button>
                    <button class="btn-core active" id="btn-slow" onclick="setSpeed(0.04)">⏳ ORBITA</button>
                    <button class="btn-core" id="btn-fast" onclick="setSpeed(0.35)">⚡ AVANCE</button>
                    <button class="btn-core btn-telemetry" onclick="fireLaserNetwork()">🛰️ RETRANSMISIÓN</button>
                </div>
            </div>

            <div class="planet-matrix" id="target-grid"></div>
        </footer>
    </div>

    <script>
        // DATA CIENTÍFICA REALISTA DE LA RED INTERPLANETARIA
        const COSMIC_DATA = [
            { id: 'sun', name: 'SOL', r: 0, size: 24, speed: 0, color: '#ff6600', altColor: '#ffcc00', comp: '92.1% H, 7.8% He. Capas de plasma en fusión térmica masiva.', dist: '0.0 UA (Centro del Sistema Solar)' },
            { id: 'mercurio', name: 'MERCURIO', r: 45, size: 1.8, speed: 0.016, color: '#555555', altColor: '#888888', comp: '70% Metales ferrosos densos, 30% Silicatos refractarios.', dist: '0.39 UA de la estrella base' },
            { id: 'venus', name: 'VENUS', r: 65, size: 2.8, speed: 0.012, color: '#aa6622', altColor: '#e0a060', comp: 'Dióxido de Carbono hiper-denso, nubes de Ácido Sulfúrico.', dist: '0.72 UA de la estrella base' },
            { id: 'tierra', name: 'TIERRA', r: 90, size: 3.2, speed: 0.009, color: '#1144aa', altColor: '#22aa55', comp: '78% Nitrógeno, 21% Oxígeno. Biosfera líquida y nubes de vapor.', dist: '1.00 UA [ESTACIÓN BASE PRINCIPAL DSN]' },
            { id: 'marte', name: 'MARTE', r: 115, size: 2.3, speed: 0.007, color: '#aa3311', altColor: '#cc6644', comp: 'Óxido de Hierro superficial, atmósfera tenue de CO2.', dist: '1.52 UA de la estrella base' },
            { id: 'jupiter', name: 'JÚPITER', r: 160, size: 8.0, speed: 0.004, color: '#b87a42', altColor: '#f5d0a9', comp: 'Hidrógeno líquido metálico, Helio. Sistemas de tormentas cíclicas.', dist: '5.20 UA de la estrella base' },
            { id: 'saturno', name: 'SATURNO', r: 210, size: 6.5, speed: 0.0025, color: '#cc9955', altColor: '#eeddbb', comp: 'Envoltorio de Gas de Hidrógeno molecular masivo.', dist: '9.58 UA de la estrella base', hasRings: true },
            { id: 'urano', name: 'URANO', r: 255, size: 4.4, speed: 0.0012, color: '#4488cc', altColor: '#66aacc', comp: 'Fluidos de Hielo Cuántico, Amoníaco y Metano Atmosférico.', dist: '19.22 UA de la estrella base' },
            { id: 'neptuno', name: 'NEPTUNO', r: 300, size: 4.2, speed: 0.0009, color: '#2244aa', altColor: '#3366cc', comp: 'Núcleo Rocoso, Hielo de Metano de alta densidad energética.', dist: '30.05 UA de la estrella base' }
        ];

        let scene, camera, renderer;
        let planets3D = {};
        let orbitsAngles = {};
        let timeMultiplier = 0.04;
        let selectedNode = COSMIC_DATA[3]; // Tierra seleccionada por defecto
        let laserLines = [];
        let networkIsActive = false;
        
        // Variables matemáticas de amortiguación (Zoom cinemático avanzado)
        let targetCamPosition = new THREE.Vector3(0, 200, 260);
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let currentLookAt = new THREE.Vector3(0, 0, 0);

        // --- GENERADOR MATEMÁTICO PROCEDURAL INMUNE A CONFIGURACIONES CORS ---
        function generateProceduralTexture(id, baseColor, detailColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Capa Base Plana
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 512, 256);

            // Algoritmo matemático de ruido y diseño fotorrealista adaptado a cada astro
            if (id === 'sun') {
                // Tormentas y llamaradas solares
                for (let i = 0; i < 60; i++) {
                    let grad = ctx.createRadialGradient(Math.random()*512, Math.random()*256, 10, Math.random()*512, Math.random()*256, 90);
                    grad.addColorStop(0, detailColor);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 512, 256);
                }
            } else if (id === 'jupiter' || id === 'saturno') {
                // Bandas de gas gaseosas paralelas y el Gran Vórtice de Júpiter
                for (let y = 0; y < 256; y += 4) {
                    ctx.fillStyle = Math.random() > 0.4 ? baseColor : detailColor;
                    ctx.globalAlpha = Math.random() * 0.5;
                    ctx.fillRect(0, y, 512, Math.random()*12);
                }
                ctx.globalAlpha = 1.0;
                // Vórtice Ovalado
                ctx.fillStyle = detailColor;
                ctx.beginPath();
                ctx.ellipse(300, 160, 35, 18, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (id === 'tierra') {
                // Simulación fotorrealista de Océanos (Base), continentes verdes y nubes atmosféricas
                ctx.fillStyle = detailColor; // Verde para continentes
                for(let i=0; i<18; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*256, Math.random()*50 + 20, 0, Math.PI*2);
                    ctx.fill();
                }
                // Nubes Blancas Superpuestas
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                for(let i=0; i<25; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*256, Math.random()*30 + 10, 0, Math.PI*2);
                    ctx.fill();
                }
            } else {
                // Planetas rocosos / helados con relieve de cráteres de impacto estocásticos
                for (let i = 0; i < 150; i++) {
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*256, Math.random()*8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*256, Math.random()*4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            return texture;
        }

        function initEngine() {
            const container = document.getElementById('webgl-viewport');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x01030a, 0.0012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2500);
            camera.position.set(targetCamPosition.x, targetCamPosition.y, targetCamPosition.z);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Configuración fotométrica de iluminación global de la escena
            const ambient = new THREE.AmbientLight(0x444455);
            scene.add(ambient);

            const sunLight = new THREE.PointLight(0xffffff, 2.5, 1200);
            scene.add(sunLight);

            // Bóveda de Estrellas Matemáticas de Fondo
            const starsGeo = new THREE.BufferGeometry();
            const starPositions = new Float32Array(2000 * 3);
            for(let i=0; i<6000; i++) starPositions[i] = (Math.random() - 0.5) * 1500;
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.9 });
            scene.add(new THREE.Points(starsGeo, starsMat));

            buildCosmos3D();
            buildBunkerInterface();
            window.addEventListener('resize', onWindowResize);
        }

        function buildCosmos3D() {
            COSMIC_DATA.forEach(data => {
                orbitsAngles[data.id] = Math.random() * Math.PI * 2;

                // Trazados vectoriales de las órbitas elípticas fijas
                if(data.r > 0) {
                    const points = [];
                    for (let i = 0; i <= 180; i++) {
                        const theta = (i / 180) * Math.PI * 2;
                        points.push(new THREE.Vector3(Math.cos(theta) * data.r, 0, Math.sin(theta) * data.r));
                    }
                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.06 });
                    scene.add(new THREE.Line(orbitGeo, orbitMat));
                }

                const pivot = new THREE.Group();
                scene.add(pivot);

                const geo = new THREE.SphereGeometry(data.size, 32, 32);
                let mat;

                // Inyección de texturas procedurales calculadas nativamente por la GPU
                const dynamicTexture = generateProceduralTexture(data.id, data.color, data.altColor);

                if(data.id === 'sun') {
                    mat = new THREE.MeshBasicMaterial({ map: dynamicTexture });
                } else {
                    mat = new THREE.MeshStandardMaterial({ 
                        map: dynamicTexture,
                        roughness: 0.7,
                        metalness: 0.15
                    });
                }

                const mesh = new THREE.Mesh(geo, mat);
                if(data.r > 0) mesh.position.x = data.r;
                pivot.add(mesh);

                // Complejo de Anillos Detallados (Caso específico de Saturno)
                if(data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size + 2.5, data.size + 8, 64);
                    ringGeo.rotateX(Math.PI / 2);
                    const ringMat = new THREE.MeshStandardMaterial({ 
                        color: 0xbaa385, 
                        side: THREE.DoubleSide, 
                        transparent: true, 
                        opacity: 0.65,
                        roughness: 0.9
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.x = data.r;
                    pivot.add(ringMesh);
                }

                // Sondas Mecánicas DSN instaladas en órbita planetaria independiente
                let probeMesh = null;
                if(data.r > 0) {
                    const probeGeo = new THREE.ConeGeometry(0.5, 1.2, 4);
                    probeGeo.rotateX(Math.PI / 2);
                    const probeMat = new THREE.MeshBasicMaterial({ color: 0x00bfff });
                    probeMesh = new THREE.Mesh(probeGeo, probeMat);
                    probeMesh.position.set(data.r, data.size + 2.0, 0);
                    pivot.add(probeMesh);
                }

                planets3D[data.id] = { pivot: pivot, mesh: mesh, probe: probeMesh, data: data };

                // Generación de etiquetas HUD flotantes asociadas
                const label = document.createElement('div');
                label.className = 'space-tag';
                label.id = `tag-${data.id}`;
                label.innerText = data.name;
                document.getElementById('hud-labels-container').appendChild(label);
            });
        }

        function buildBunkerInterface() {
            const grid = document.getElementById('target-grid');
            COSMIC_DATA.forEach(data => {
                const btn = document.createElement('button');
                btn.className = 'btn-planet';
                btn.id = `btn-${data.id}`;
                btn.innerText = data.name;
                btn.onclick = () => selectNode(data);
                grid.appendChild(btn);
            });
            selectNode(selectedNode);
        }

        function selectNode(node) {
            selectedNode = node;
            COSMIC_DATA.forEach(d => {
                const btn = document.getElementById(`btn-${d.id}`);
                if(btn) btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`btn-${node.id}`);
            if(activeBtn) activeBtn.classList.add('active');

            // Salida de telemetría por consola de comandos
            document.getElementById('terminal-stream').innerHTML = `
                <span style="color:var(--radar-blue); font-weight:bold;">[NODO ADQUIRIDO]: ${node.name}</span><br>
                • DISTANCIA RADIAL AL SOL: ${node.dist}<br>
                • ANÁLISIS ESPECTROGRÁFICO: ${node.comp}<br>
                • CONEXIÓN LÁSER TRIDIMENSIONAL: Nodos alienados en órbita. Canal listo para ejecución.
            `;
        }

        function fireLaserNetwork() {
            if(networkIsActive) return;
            networkIsActive = true;

            laserLines.forEach(l => scene.remove(l));
            laserLines = [];

            const stream = document.getElementById('terminal-stream');
            stream.innerHTML = `<span style="color:var(--alert-red); font-weight:bold;">[DISPARANDO ENLACE LÁSER EN CASCADA]</span> Propagando haz óptico a través de la red de sondas...`;

            let startIdx = COSMIC_DATA.findIndex(x => x.id === selectedNode.id);
            let earthIdx = COSMIC_DATA.findIndex(x => x.id === 'tierra');
            
            let path = [];
            if(startIdx > earthIdx) {
                for(let i = startIdx; i >= earthIdx; i--) path.push(COSMIC_DATA[i].id);
            } else {
                for(let i = startIdx; i <= earthIdx; i++) path.push(COSMIC_DATA[i].id);
            }

            for(let i = 0; i < path.length - 1; i++) {
                const laserMat = new THREE.LineBasicMaterial({ color: 0x00ffaa, linewidth: 3 });
                const laserGeo = new THREE.BufferGeometry();
                const line = new THREE.Line(laserGeo, laserMat);
                scene.add(line);
                laserLines.push({ line: line, from: path[i], to: path[i+1] });
            }

            // Simulación de retraso físico de datos espaciales
            setTimeout(() => {
                networkIsActive = false;
                laserLines.forEach(l => scene.remove(l));
                laserLines = [];
                
                const latency = (Math.abs(startIdx - earthIdx) * 7.4).toFixed(2);
                stream.innerHTML = `
                    <span style="color:var(--matrix-glow); font-weight:bold;">[TRANSMISIÓN CRÍTICA COMPLETADA]</span><br>
                    • ESTADO DE DATOS: Paquetes recibidos sin corrupción en el Nodo Tierra.<br>
                    • INTEGRIDAD DE SEÑAL: 100% Sincronizada.<br>
                    • LATENCIA REAL DE RECORRIDO: ${latency} Minutos luz calculados.
                `;
            }, 2500);
        }

        function setSpeed(val) { 
            timeMultiplier = val; 
            document.getElementById('btn-pause').classList.remove('active');
            document.getElementById('btn-slow').classList.remove('active');
            document.getElementById('btn-fast').classList.remove('active');

            if (val === 0) document.getElementById('btn-pause').classList.add('active');
            else if (val < 0.1) document.getElementById('btn-slow').classList.add('active');
            else document.getElementById('btn-fast').classList.add('active');
        }

        function updateLoop() {
            const tempV = new THREE.Vector3();

            COSMIC_DATA.forEach(data => {
                if(data.r > 0) {
                    orbitsAngles[data.id] += data.speed * timeMultiplier;
                    planets3D[data.id].pivot.rotation.y = orbitsAngles[data.id];
                    planets3D[data.id].mesh.rotation.y += 0.008; // Rotación propia del planeta
                }

                // Extraer el vector posicional real tridimensional de la malla
                planets3D[data.id].mesh.getWorldPosition(tempV);

                // CÁLCULO DE ZOOM DINÁMICO TÁCTICO SEGÚN NODO SELECCIONADO
                if (data.id === selectedNode.id) {
                    targetLookAt.copy(tempV);
                    
                    if (data.id === 'sun') {
                        targetCamPosition.set(0, data.size * 2.2, data.size * 3.2);
                    } else {
                        // Enfoque cinemático acoplado a la rotación orbital del planeta seleccionado
                        targetCamPosition.set(
                            tempV.x + Math.cos(orbitsAngles[data.id] * 0.15) * (data.size * 4.2),
                            tempV.y + data.size * 1.8,
                            tempV.z + Math.sin(orbitsAngles[data.id] * 0.15) * (data.size * 4.2)
                        );
                    }
                }

                // Proyección matemática 3D a coordenadas 2D del DOM (Etiquetas flotantes)
                tempV.project(camera);
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                const label = document.getElementById(`tag-${data.id}`);
                if(label) {
                    if(tempV.z > 1) { label.style.display = 'none'; }
                    else {
                        label.style.display = 'block';
                        label.style.left = `${x}px`;
                        label.style.top = `${y - 12}px`;
                        label.style.borderColor = (data.id === selectedNode.id) ? '#00bfff' : 'rgba(0, 255, 170, 0.25)';
                    }
                }
            });

            // Interpolaciones lineales amortiguadas de precisión (Lerp) para movimiento fluido de cámara
            camera.position.lerp(targetCamPosition, 0.06);
            currentLookAt.lerp(targetLookAt, 0.06);
            camera.lookAt(currentLookAt);

            // Re-renderizado de haces y vectores de comunicación láser activos
            if(laserLines.length > 0) {
                laserLines.forEach(item => {
                    const pFrom = new THREE.Vector3();
                    const pTo = new THREE.Vector3();
                    
                    if(item.from === 'sun') planets3D[item.from].mesh.getWorldPosition(pFrom);
                    else planets3D[item.from].probe.getWorldPosition(pFrom);

                    planets3D[item.to].probe.getWorldPosition(pTo);
                    item.line.geometry.setFromPoints([pFrom, pTo]);
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function run() {
            requestAnimationFrame(run);
            updateLoop();
            renderer.render(scene, camera);
            document.getElementById('sub-timer').innerText = new Date().toTimeString().split(' ')[0] + " UTC";
        }

        window.onload = () => {
            initEngine();
            run();
        };
    </script>
</body>
</html>
