<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSN 3D Quantum Lab - Luis Duque</title>
    <style>
        :root {
            --phosphor-green: #00ff41;
            --radar-blue: #00d2ff;
            --alert-orange: #ff9900;
            --hull-black: #020408;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--hull-black);
            font-family: 'Courier New', monospace;
            color: var(--phosphor-green);
            user-select: none;
            touch-action: none;
        }

        /* --- MARCO DE PANTALLA TIPO SUBMARINO / BÚNKER CIENTÍFICO --- */
        .bunker-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            pointer-events: none;
            display: grid;
            grid-template-rows: 60px 1fr 180px;
            box-sizing: border-box;
            border: 4px solid #111827;
        }

        .bunker-hud * { pointer-events: auto; }

        header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--phosphor-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(0, 255, 65, 0.15);
        }

        .sys-title {
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--phosphor-green);
        }

        .btn-abort {
            background: #ff2222;
            color: #fff;
            border: 2px solid #fff;
            padding: 6px 14px;
            font-size: 10px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 0 10px #ff2222;
        }

        /* --- VISTA DE RENDERIZADO 3D REALISTA --- */
        #webgl-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* --- DECK DE INTERRUPTORES Y TELEMETRÍA INFERIOR --- */
        .deck-console {
            background: rgba(1, 3, 6, 0.96);
            border-top: 3px solid var(--phosphor-green);
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
            padding: 10px;
            box-shadow: 0 -5px 25px rgba(0, 255, 65, 0.2);
        }

        .crt-terminal {
            background: #000;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
            overflow-y: auto;
            line-height: 1.4;
            position: relative;
        }

        .crt-terminal::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .joy-container {
            background: #040812;
            border: 1px solid var(--radar-blue);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .analog-pad {
            width: 60px;
            height: 60px;
            border: 2px solid var(--radar-blue);
            border-radius: 50%;
            position: relative;
            background: #000;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .analog-stick {
            width: 24px;
            height: 24px;
            background: var(--alert-orange);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px var(--alert-orange);
            cursor: move;
        }

        .btn-militar {
            background: #081a0e;
            border: 1px solid var(--phosphor-green);
            color: var(--phosphor-green);
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            padding: 5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }
        .btn-militar:active { background: var(--phosphor-green); color: #000; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .status-alert {
            animation: blinker 1.2s steps(2, start) infinite;
            color: var(--alert-orange);
            font-weight: bold;
        }

        @keyframes blinker { to { opacity: 0; } }

        /* HUD flotante sobre planetas 3D */
        .space-tag {
            position: absolute;
            color: #fff;
            font-size: 9px;
            background: rgba(0,0,0,0.75);
            border: 1px solid var(--phosphor-green);
            padding: 2px 5px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            z-index: 50;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-viewport"></div>
    
    <div id="hud-labels-container"></div>

    <div class="bunker-hud">
        <header>
            <div class="sys-title">📡 TELEMETRÍA CUÁNTICA INTERPLANETARIA DSN</div>
            <a href="index.html" class="btn-abort">SYSTEM DISCONNECT</a>
        </header>

        <div></div>

        <footer class="deck-console">
            <div class="crt-terminal">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid rgba(0,255,65,0.2); padding-bottom:3px; color:#fff;">
                    <span>CONSOLA DEL SUBSISTEMA DE COMUNICACIONES</span>
                    <span id="sub-timer">00:00:00</span>
                </div>
                <div id="terminal-stream" style="margin-top:6px; height:65px; overflow-y:auto;">
                    SISTEMA INICIALIZADO. SELECCIONE NODO PERIMETRAL PARA INICIAR EL BARRIDO DE FRECUENCIAS...
                </div>
                
                <div class="btn-grid">
                    <button class="btn-militar" onclick="setOrbitSpeed(0)">⏸ PAUSA</button>
                    <button class="btn-militar" onclick="setOrbitSpeed(0.15)">🎚️ LENTO</button>
                    <button class="btn-militar" onclick="setOrbitSpeed(1)">⚡ TIEMPO REAL</button>
                    <button class="btn-militar" style="border-color:var(--radar-blue); color:var(--radar-blue);" onclick="fireLaserNetwork()">🛰️ ENRUTAR LÁSER</button>
                </div>
            </div>

            <div class="joy-container">
                <span style="font-size:8px; color:var(--radar-blue); margin-bottom:4px;">CAM-AIM</span>
                <div class="analog-pad" id="padArea">
                    <div class="analog-stick" id="joyStick"></div>
                </div>
                <button class="btn-militar" style="font-size:7px; padding:2px; margin-top:5px;" onclick="cycleSensorMode()">MODE: VIDEO</button>
            </div>
        </footer>
    </div>

    <script>
        // --- BASE DE DATOS FÍSICA KEPLERIANA ---
        const COSMIC_DATA = [
            { id: 'mercurio', name: 'MERCURIO', r: 35, size: 1.2, speed: 0.02, color: 0x888888, comp: 'Rocoso - Alta densidad de Hierro' },
            { id: 'venus', name: 'VENUS', r: 50, size: 2.2, speed: 0.014, color: 0xe3bb76, comp: 'Gaseoso Extremo - Ácido Sulfúrico' },
            { id: 'tierra', name: 'TIERRA (BASE)', r: 70, size: 2.4, speed: 0.01, color: 0x2b82c9, comp: 'Rocoso - Nitrógeno/Oxígeno/Agua' },
            { id: 'marte', name: 'MARTE', r: 90, size: 1.6, speed: 0.008, color: 0xc1440e, comp: 'Rocoso Férrico - Sondas Activas' },
            { id: 'jupiter', name: 'JÚPITER', r: 130, size: 6.5, speed: 0.004, color: 0xb07f35, comp: 'Gaseoso - Núcleo de Hidrógeno Metálico' },
            { id: 'saturno', name: 'SATURNO', r: 170, size: 5.4, speed: 0.002, color: 0ead2ac, comp: 'Gaseoso - Sistema de Anillos de Hielo', hasRings: true },
            { id: 'urano', name: 'URANO', r: 205, size: 3.8, speed: 0.0009, color: 0xaae6f0, comp: 'Gigante Helado - Envoltura de Metano' },
            { id: 'neptuno', name: 'NEPTUNO', r: 235, size: 3.6, speed: 0.0005, color: 0x4b70dd, comp: 'Gigante Helado - Atmósfera Dinámica' },
            { id: 'pluton', name: 'PLUTÓN', r: 265, size: 0.9, speed: 0.0002, color: 0xaa9988, comp: 'Planeta Enano DSN - Metano Sólido' }
        ];

        let scene, camera, renderer;
        let planets3D = {};
        let orbitsAngles = {};
        let timeMultiplier = 0.15; // Velocidad de crucero lenta inicial
        let selectedNode = COSMIC_DATA[8]; // Por defecto apuntado a Plutón
        let sensorModeIdx = 0;
        const SENSOR_MODES = ['TRANSMISIÓN VÍDEO COMPLETO HD', 'BARRIDO ESPECTRAL DE GASES', 'MONITOR DE IMPACTO DE FRAGMENTOS'];

        // Estructuras de la Red Láser
        let laserLines = [];
        let networkIsActive = false;

        // --- INICIALIZACIÓN DEL MOTOR GRÁFICO ---
        function initEngine3D() {
            const container = document.getElementById('webgl-viewport');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020408, 0.0015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Ángulo de cámara cenital tipo mapa táctico de comando militar
            camera.position.set(0, 180, 140);
            camera.lookAt(0, 0, -20);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimizado para iPhone Chrome
            container.appendChild(renderer.domElement);

            // --- LUCES DE LABORATORIO REALISTAS ---
            const ambientLight = new THREE.AmbientLight(0x111122);
            scene.add(ambientLight);

            // Luz Central emitida por el Sol que baña y sombrea un lado de cada planeta
            const sunLight = new THREE.PointLight(0xffffff, 2, 500);
            scene.add(sunLight);

            buildSolarSystem3D();
            window.addEventListener('resize', onWindowResize);
        }

        // --- CONSTRUCCIÓN REALISTA DE LOS CUERPOS CELESTES ---
        function buildSolarSystem3D() {
            // EL SOL GIGANTE REALISTA (Ø 1,400,000 KM Escala de Laboratorio)
            const sunGeo = new THREE.SphereGeometry(14, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({
                color: 0xff4500,
                wireframe: false
            });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sunMesh);

            // Brillo térmico envolvente del Sol (Simulador de Masa Coronal)
            const glowGeo = new THREE.SphereGeometry(16, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 0.25,
                side: THREE.BackSide
            });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            scene.add(glowMesh);

            // CREACIÓN DE NODOS CELESTES
            COSMIC_DATA.forEach(data => {
                orbitsAngles[data.id] = Math.random() * Math.PI * 2;

                // Generar línea física de la órbita en el plano horizontal
                const points = [];
                for (let i = 0; i <= 64; i++) {
                    const theta = (i / 64) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * data.r, 0, Math.sin(theta) * data.r));
                }
                const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ff41, transparent: true, opacity: 0.1 });
                const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                scene.add(orbitLine);

                // Pivot de rotación
                const pivot = new THREE.Group();
                scene.add(pivot);

                // Esfera del Planeta con Sombreador Realista (MeshStandardMaterial responde a la luz del Sol)
                const planetGeo = new THREE.SphereGeometry(data.size, 32, 32);
                const planetMat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.6,
                    metalness: 0.2,
                    bumpScale: 0.05
                });
                const planetMesh = new THREE.Mesh(planetGeo, planetMat);
                planetMesh.position.x = data.r;
                pivot.add(planetMesh);

                // Agregar sistema de anillos si corresponde (Saturno)
                if(data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size + 2, data.size + 6, 32);
                    // Rotar anillo para alinearlo horizontalmente
                    ringGeo.rotateX(Math.PI / 2);
                    const ringMat = new THREE.MeshStandardMaterial({ color: 0xead2ac, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.x = data.r;
                    pivot.add(ringMesh);
                }

                // Micro-Satélite Sonda Integrada (Fija sobre el polo del planeta)
                const probeGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                const probeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const probeMesh = new THREE.Mesh(probeGeo, probeMat);
                probeMesh.position.set(data.r, data.size + 1.2, 0);
                pivot.add(probeMesh);

                planets3D[data.id] = {
                    pivot: pivot,
                    mesh: planetMesh,
                    probe: probeMesh,
                    data: data
                };

                // Inyectar etiqueta HTML en el HUD
                const label = document.createElement('div');
                label.className = 'space-tag';
                label.id = `tag-${data.id}`;
                label.innerText = data.name;
                document.getElementById('hud-labels-container').appendChild(label);
            });

            executeDataStreamUpdate();
        }

        // --- SISTEMA FÍSICO DE ENRUTAMIENTO LÁSER (PUENTES EN CASCADA) ---
        function fireLaserNetwork() {
            if(networkIsActive) return;
            networkIsActive = true;

            // Limpiar trazos viejos
            laserLines.forEach(l => scene.remove(l));
            laserLines = [];

            const terminal = document.getElementById('terminal-stream');
            terminal.innerHTML = `<span class="status-alert">[ALERTA ENLACE CRÍTICO]</span> Lanzando ráfaga láser de alta frecuencia desde el nodo de control en la Tierra...`;

            // Construir vector de salto desde Plutón/Nodo seleccionado hasta la Tierra en cascada
            let startIdx = COSMIC_DATA.findIndex(x => x.id === selectedNode.id);
            let earthIdx = COSMIC_DATA.findIndex(x => x.id === 'tierra');
            
            let path = [];
            if(startIdx > earthIdx) {
                for(let i = startIdx; i >= earthIdx; i--) path.push(COSMIC_DATA[i].id);
            } else {
                for(let i = startIdx; i <= earthIdx; i++) path.push(COSMIC_DATA[i].id);
            }

            // Crear las geometrías de los láseres en el espacio 3D
            for(let i = 0; i < path.length - 1; i++) {
                const laserMat = new THREE.LineBasicMaterial({ color: 0xff0055, linewidth: 3 });
                const laserGeo = new THREE.BufferGeometry();
                const line = new THREE.Line(laserGeo, laserMat);
                scene.add(line);
                laserLines.push({ line: line, from: path[i], to: path[i+1] });
            }

            setTimeout(() => {
                // Desglosar telemetría científica matemática en pantalla al finalizar el pulso
                networkIsActive = false;
                laserLines.forEach(l => scene.remove(l));
                laserLines = [];
                
                const lossDirect = (selectedNode.id === 'pluton' || selectedNode.id === 'neptuno') ? '45% (Ruido estelar crítico)' : '12% (Dispersión)';
                const latency = (Math.abs(startIdx - earthIdx) * 1.2).toFixed(1);

                terminal.innerHTML = `
                    <span style="color:#fff;">[RECEPCIÓN COMPLETA DESDE LA RED DE SONDAS]</span><br>
                    • MODO DE SENSOR: ${SENSOR_MODES[sensorModeIdx]}<br>
                    • ANÁLISIS DE ENRUTAMIENTO: Éxito en ${path.length - 1} puentes satelitales.<br>
                    • PÉRDIDA DE SEÑAL DIRECTA (ANTENA BASE): ${lossDirect} - Contraste de vídeo arruinado.<br>
                    • RETRASO DE PROPAGACIÓN SIMULADO EN CASCADA: ${latency} Segundos. Pérdida de bits: 0.00%.
                `;
            }, 3000);
        }

        // --- ACTUALIZACIÓN DINÁMICA DE VECTORES EN PANTALLA ---
        function updatePositionsAndHUD() {
            const tempV = new THREE.Vector3();

            COSMIC_DATA.forEach(data => {
                // Avanzar órbita matemática heliocéntrica
                orbitsAngles[data.id] += data.speed * timeMultiplier;
                planets3D[data.id].pivot.rotation.y = orbitsAngles[data.id];

                // Rotación propia del planeta sobre su propio eje (Realismo rotacional)
                planets3D[data.id].mesh.rotation.y += 0.01;

                // Mapear coordenadas 3D al espacio de la pantalla 2D del iPhone
                planets3D[data.id].mesh.getWorldPosition(tempV);
                tempV.project(camera);

                // Convertir a píxeles CSS
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                const label = document.getElementById(`tag-${data.id}`);
                if(label) {
                    // Si el objeto queda detrás de la cámara ocultar etiqueta
                    if(tempV.z > 1) {
                        label.style.display = 'none';
                    } else {
                        label.style.display = 'block';
                        label.style.left = `${x}px`;
                        label.style.top = `${y - 12}px`;
                    }
                }
            });

            // Actualizar trayectorias dinámicas del láser si está encendido
            if(laserLines.length > 0) {
                laserLines.forEach(item => {
                    const pFrom = new THREE.Vector3();
                    const pTo = new THREE.Vector3();
                    
                    planets3D[item.from].probe.getWorldPosition(pFrom);
                    planets3D[item.to].probe.getWorldPosition(pTo);

                    const points = [pFrom, pTo];
                    item.line.geometry.setFromPoints(points);
                });
            }
        }

        // --- INTERFAZ COMANDOS INTERACTIVOS ---
        function setOrbitSpeed(val) {
            timeMultiplier = val;
        }

        function cycleSensorMode() {
            sensorModeIdx = (sensorModeIdx + 1) % SENSOR_MODES.length;
            event.target.innerText = `MODE: ${SENSOR_MODES[sensorModeIdx].split(' ')[1]}`;
            executeDataStreamUpdate();
        }

        function executeDataStreamUpdate() {
            if(networkIsActive) return;
            const terminal = document.getElementById('terminal-stream');
            terminal.innerHTML = `
                <span style="color:var(--radar-blue)">[NODO BAJO ESCANEO CORREGIDO]: ${selectedNode.name}</span><br>
                • ANÁLISIS SENSOR: Mapeando composición gaseosa/rocosa y fragmentos orbitales.<br>
                • ESTADO DEL PUENTE SATELITAL: <span style="color:var(--phosphor-green)">ONLINE (LISTO PARA DISPARO LÁSER)</span>
            `;
        }

        // --- CONTROL ADAPTATIVO JOYSTICK TÁCTIL ---
        const joyStick = document.getElementById('joyStick');
        const padArea = document.getElementById('padArea');

        function handleJoystickMovement(clientX, clientY) {
            const rect = padArea.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let dx = clientX - cx;
            let dy = clientY - cy;
            const distance = Math.sqrt(dx*dx + dy*dy);
            const maxRadius = 18;

            if(distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joyStick.style.left = `calc(50% + ${dx}px)`;
            joyStick.style.top = `calc(50% + ${dy}px)`;

            // Vincular movimiento del joystick analógico a la rotación orbital de la cámara espacial 3D
            camera.position.x = Math.sin(dx * 0.05) * 140;
            camera.position.z = Math.cos(dx * 0.05) * 140 + (dy * 2);
            camera.lookAt(0, 0, -20);
        }

        joyStick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleJoystickMovement(e.touches[0].clientX, e.touches[0].clientY);
        });

        joyStick.addEventListener('touchend', () => {
            joyStick.style.left = '50%';
            joyStick.style.top = '50%';
        });

        // Permitir también clics en pantallas de escritorio para desarrollo cómodo
        window.addEventListener('click', (e) => {
            // Lógica básica para saltar de planeta en el visor haciendo clic en la interfaz
            if(e.clientY < window.innerHeight - 180 && e.clientY > 60) {
                const idx = Math.floor(Math.random() * COSMIC_DATA.length);
                selectedNode = COSMIC_DATA[idx];
                COSMIC_DATA.forEach(d => {
                    const tag = document.getElementById(`tag-${d.id}`);
                    if(tag) tag.style.borderColor = (d.id === selectedNode.id) ? '#ff2222' : '#00ff41';
                });
                executeDataStreamUpdate();
            }
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- BUCLE PRINCIPAL DE RENDERIZADO (ANIMATION LOOP) ---
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            updatePositionsAndHUD();
            renderer.render(scene, camera);

            // Reloj militar en el deck
            document.getElementById('sub-timer').innerText = new Date().toTimeString().split(' ')[0];
        }

        window.onload = () => {
            initEngine3D();
            renderLoop();
        };
    </script>
</body>
</html>
