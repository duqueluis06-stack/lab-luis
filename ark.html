<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Primera Persona Real</title>
    <!-- Motor core de A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      <!-- Ponemos un cielo gris claro para saber que el motor está vivo y esperando el mapa -->
      <a-sky color="#ECECEC"></a-sky>

      <!-- EL MAPA DEL PUEBLO: Lo cargamos directo aquí para que no congele la pantalla -->
      <a-gltf-model src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/village.glb" position="0 0 0"></a-gltf-model>

      <!-- TU AVATAR: También directo -->
      <a-gltf-model src="luis-camina.glb" position="0 3.4 19.5" rotation="0 180 0"></a-gltf-model>

      <!-- LUCES: Iluminación total -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- CÁMARA: Te mueves con W, A, S, D y miras arrastrando el mouse -->
      <a-entity camera look-controls wasd-controls="acceleration: 50; fly: false;" position="0 5 20"></a-entity>

    </a-scene>

  </body>
</html>
