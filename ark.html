<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Primera Persona Real</title>
    <!-- Motor core de A-Frame estable -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      
      <a-assets>
        <!-- Tu mapa pesado de 272 MB desde Hugging Face (CORS abierto y descarga libre) -->
        <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/village.glb"></a-asset-item>
        <!-- Tu avatar local desde tu repositorio de GitHub -->
        <a-asset-item id="mi-avatar" src="luis-camina.glb"></a-asset-item>
      </a-assets>

      <!-- EL MAPA DEL PUEBLO -->
      <a-gltf-model src="#pueblo" position="0 0 0"></a-gltf-model>

      <!-- LUCES: Iluminación total para romper los parches negros y ver el pasto verde -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- CÁMARA EN PRIMERA PERSONA CON CONTROLES NATIVOS -->
      <!-- Te mueves con W, A, S, D en PC. Miras manteniendo click izquierdo y arrastrando -->
      <!-- Apareces elevado a 5 metros para que no te enterres en una montaña al cargar -->
      <a-entity camera look-controls wasd-controls="acceleration: 50; fly: false;" position="0 5 20">
        
        <!-- Tu avatar acoplado justo detrás de la cámara para que no te tape la vista -->
        <a-gltf-model src="#mi-avatar" position="0 -1.6 -0.5" rotation="0 180 0"></a-gltf-model>
        
      </a-entity>

    </a-scene>

  </body>
</html>
