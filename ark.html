<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK - Entorno Limpio</title>
    
    <!-- Motores Gráficos Nativos -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            user-select: none;
        }
        /* Canvas limpio a pantalla completa sin elementos web flotantes */
        a-scene {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="forest-model" src="forest2.glb"></a-asset-item>
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación del Entorno -->
        <a-entity light="type: ambient; intensity: 1.2; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="5 20 5"></a-entity>

        <!-- Escenario Fijo -->
        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0"></a-entity>

        <!-- RIG DEL JUGADOR (Pies pegados al suelo) -->
        <a-entity id="player-rig" position="0 0 0">
            
            <!-- Avatar Humano (Y corregido para eliminar la flotación) -->
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 -1.0 0" 
                      rotation="0 180 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 0;">
            </a-entity>

            <!-- Cámara Orbital Seguidora -->
            <a-entity id="camera-orbit" position="0 1.6 0">
                <a-entity id="main-camera" camera position="0 0.6 3.5"></a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');

        // Estado del Teclado
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        
        // Control de Cámara
        let mouseDragging = false;
        let prevMouseX, prevMouseY;
        let camYaw = 0;   
        let camPitch = -0.1; 
        let wasMoving = false;

        // 1. CAPTURA DE TECLADO DIRECTA
        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        // 2. CAPTURA DE RATÓN PARA ROTAR CÁMARA
        window.addEventListener('mousedown', (e) => {
            mouseDragging = true;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!mouseDragging) return;
            let deltaX = e.clientX - prevMouseX;
            let deltaY = e.clientY - prevMouseY;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
            
            camYaw -= deltaX * 0.005;
            camPitch -= deltaY * 0.004;
        });

        window.addEventListener('mouseup', () => { mouseDragging = false; });

        // 3. BUCLE DE PROCESAMIENTO NATIVO
        function engineLoop() {
            // Calcular direcciones basadas en teclado
            let moveX = 0;
            let moveY = 0;

            if (keys.w || keys.ArrowUp) moveY = -1;
            if (keys.s || keys.ArrowDown) moveY = 1;
            if (keys.a || keys.ArrowLeft) moveX = -1;
            if (keys.d || keys.ArrowRight) moveX = 1;

            // Actualizar orientación de la cámara
            camPitch = Math.max(-0.6, Math.min(0.3, camPitch));
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            let isMoving = (moveX !== 0 || moveY !== 0);

            // Control de reproducción de animación estable
            if (isMoving !== wasMoving) {
                avatarMesh.setAttribute('animation-mixer', 'timeScale', isMoving ? 1 : 0);
                wasMoving = isMoving;
            }

            if (isMoving) {
                const pos = rig.getAttribute('position');
                const speed = 0.05; 

                // Vectores de dirección relativos a la orientación de la cámara
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -moveY + rgtX * moveX) * speed;
                pos.z += (fwdZ * -moveY + rgtZ * moveX) * speed;
                rig.setAttribute('position', pos);

                // Rotación suavizada del personaje hacia la dirección de avance
                const targetAngle = camYaw + Math.atan2(moveX, -moveY) + Math.PI;
                let currentAngle = avatarMesh.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarMesh.object3D.rotation.y += deltaAngle * 0.15;
            }

            requestAnimationFrame(engineLoop);
        }
        
        // Inicializar el bucle
        engineLoop();
    </script>
</body>
</html>
