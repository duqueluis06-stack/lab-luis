<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK DEBUG</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  renderer="colorManagement:true"
  loading-screen="enabled:false"
  background="color: #000000">

  <a-assets timeout="120000">

    <!-- ENTORNO -->
    <a-asset-item
      id="forest"
      src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/forest7.glb">
    </a-asset-item>

    <!-- AVATAR -->
    <a-asset-item
      id="avatar"
      src="luis-camina.glb">
    </a-asset-item>

  </a-assets>

  <!-- LUZ BÁSICA -->
  <a-light type="ambient" intensity="1"></a-light>

  <!-- ESCENA (FOREST) -->
  <a-entity
    gltf-model="#forest"
    position="0 0 0"
    scale="1 1 1"
    id="sceneModel">
  </a-entity>

  <!-- AVATAR -->
  <a-entity
    gltf-model="#avatar"
    position="0 0 0"
    rotation="0 180 0"
    animation-mixer
    id="avatarModel">
  </a-entity>

  <!-- CÁMARA (IMPORTANTE: MÁS ATRÁS) -->
  <a-entity
    camera
    position="0 1.6 5"
    look-controls>
  </a-entity>

</a-scene>

<script>
  // DEBUG SIMPLE
  document.querySelector('#sceneModel')
    .addEventListener('model-error', e => {
      console.error("ERROR FOREST:", e);
    });

  document.querySelector('#avatarModel')
    .addEventListener('model-error', e => {
      console.error("ERROR AVATAR:", e);
    });

  console.log("ARK cargado - esperando modelos...");
</script>

</body>
</html>
