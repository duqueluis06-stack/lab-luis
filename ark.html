<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Animación Fix</title>
    <!-- Motor principal de A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- SCRIPT CRUCIAL: Este activa las animaciones de Mixamo en la web -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      <a-sky color="#ECECEC"></a-sky>

      <!-- El mapa del pueblo desde Hugging Face -->
      <a-gltf-model src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/village.glb" position="0 0 0" rotation="-90 0 0"></a-gltf-model>

      <!-- Luces generales -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- CÁMARA EN PRIMERA PERSONA (Con modo vuelo activado) -->
      <!-- Te mueves con W,A,S,D. Si miras hacia arriba y avanzas, vuelas -->
      <a-entity camera look-controls wasd-controls="acceleration: 60; fly: true;" position="0 5 20">
        
        <!-- TU AVATAR: Ahora tiene 'animation-mixer' para activar su animación de Mixamo -->
        <!-- Está posicionado justo 3 metros delante de la cámara para que lo veas caminar perfectamente -->
        <a-gltf-model src="luis-camina.glb" position="0 -1.6 -3" rotation="0 180 0" animation-mixer></a-gltf-model>
        
      </a-entity>

    </a-scene>

  </body>
</html>
