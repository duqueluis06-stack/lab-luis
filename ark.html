<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene renderer="colorManagement:true; physicallyCorrectLights:true"
         loading-screen="enabled:false">

  <a-assets>

    <a-asset-item id="forest"
      src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/forest7.glb">
    </a-asset-item>

    <a-asset-item id="avatar"
      src="luis-camina.glb">
    </a-asset-item>

  </a-assets>

  <!-- LUCES -->
  <a-light type="ambient" intensity="1"></a-light>

  <!-- ENTORNO (SIN TOCAR POSICIÓN) -->
  <a-entity gltf-model="#forest"></a-entity>

  <!-- AVATAR -->
  <a-entity gltf-model="#avatar"
            position="0 0 0"
            rotation="0 0 0"
            animation-mixer>
  </a-entity>

  <!-- CÁMARA SIMPLE -->
  <a-entity camera position="0 1.6 4" look-controls></a-entity>

</a-scene>

</body>
</html>
