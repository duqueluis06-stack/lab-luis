<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Diagnóstico Forest7</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
            -webkit-user-select: none;
        }

        /* CONSOLA DE DIAGNÓSTICO EN PANTALLA */
        #debug-console {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            max-height: 90px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 6px;
            z-index: 10000;
            overflow-y: auto;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        #arrows-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-wrapper {
            position: absolute;
            bottom: 40px; 
            right: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-container {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            position: relative;
        }

        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
            touch-action: none;
        }

        .joy-arrow {
            position: absolute;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .arrow-up { top: 0; left: 34px; }
        .arrow-down { bottom: 0; left: 34px; }
        .arrow-left { left: 0; top: 34px; }
        .arrow-right { right: 0; top: 34px; }
    </style>
</head>
<body>

    <!-- Consola visual para ver qué bloquea el teléfono -->
    <div id="debug-console">SISTEMA: Inicializando entorno 3D...</div>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false"
             loading-screen="enabled: true; dotsColor: #00f3ff; backgroundColor: #020617">
        
        <a-assets timeout="60000">
            <!-- SE AÑADE CROSSORIGIN ANONYMOUS PARA EVITAR EL BLOQUEO DE GITHUB RELEASES -->
            <a-asset-item id="forest-model" 
                          src="https://github.com/duqueluis06-stack/lab-luis/releases/download/v1/forest7.glb" 
                          crossorigin="anonymous"></a-asset-item>
            
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#0f172a"></a-sky>

        <a-entity light="type: ambient; intensity: 1.2; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="5 20 5"></a-entity>

        <!-- Escenario Real -->
        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0"></a-entity>

        <!-- RIG DE CONTROL -->
        <a-entity id="player-rig" position="0 0 0">
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 -1.0 0" 
                      rotation="0 180 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 0;">
            </a-entity>

            <a-entity id="camera-orbit" position="0 1.4 0">
                <a-entity id="main-camera" camera position="0 0 4.0"></a-entity>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        // Sistema de logs en pantalla
        const consoleDiv = document.getElementById('debug-console');
        function showLog(text, isError = false) {
            const color = isError ? '#ff0055' : '#00f3ff';
            consoleDiv.innerHTML += `<br><span style="color:${color}">${text}</span>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // Detectar si el navegador bloquea la carga del archivo
        window.addEventListener('error', function(e) {
            showLog('ERROR CRÍTICO: ' + e.message, true);
        }, true);

        document.getElementById('forest-model').addEventListener('gltf-model-error', function() {
            showLog('ERROR: GitHub rechazó la conexión del mapa (CORS o enlace roto).', true);
        });

        document.querySelector('a-scene').addEventListener('loaded', function () {
            showLog('SISTEMA: Motor A-Frame listo.');
        });

        // Capturar cuando el entorno se renderice con éxito
        document.getElementById('entorno').addEventListener('model-loaded', function() {
            showLog('ÉXITO: ¡El mapa forest7.glb de 50MB cargó correctamente!');
        });

        // Controladores de Movimiento Nativo
        const VELOCIDAD_AVANCE = 0.12;   
        const VELOCIDAD_PIERNAS = 0.65;  

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');
        const mainCamera = document.getElementById('main-camera');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let mouseDragging = false; let prevMouseX, prevMouseY;
        let camYaw = 0; let camPitch = -0.25; let camDist = 4.0;
        let arrowCam = { up: false, down: false, left: false, right: false };
        let wasMoving = false;

        // ZOOM TÁCTIL
        let initialTouchDist = 0;
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (initialTouchDist === 0) { initialTouchDist = dist; } 
                else {
                    let delta = initialTouchDist - dist;
                    camDist += delta * 0.01;
                    camDist = Math.max(2.0, Math.min(8.0, camDist));
                    mainCamera.setAttribute('position', `0 0 ${camDist}`);
                    initialTouchDist = dist;
                }
            }
        }, { passive: true });
        window.addEventListener('touchend', (e) => { if (e.touches.length < 2) initialTouchDist = 0; });

        // BOTONES DE CÁMARA
        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); e.stopPropagation(); arrowCam[direction] = true; };
            const end = (e) => { if(e) e.preventDefault(); arrowCam[direction] = false; };
            btn.addEventListener('touchstart', start, {passive: false});
            btn.addEventListener('touchend', end, {passive: false});
        };
        setupArrowCamera('btn-up', 'up'); setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left'); setupArrowCamera('btn-right', 'right');

        // JOYSTICK TÁCTIL
        knob.addEventListener('touchstart', (e) => {
            joyDragging = true; const touch = e.touches[0];
            joyStartX = touch.clientX; joyStartY = touch.clientY;
            e.preventDefault();
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if (!joyDragging) return;
            const touch = e.touches[0];
            let dx = touch.clientX - joyStartX; let dy = touch.clientY - joyStartY;
            const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen;
            e.preventDefault();
        }, {passive: false});

        window.addEventListener('touchend', () => {
            joyDragging = false; knob.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        });

        // ROTACIÓN DE CÁMARA CON UN DEDO
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper')) return;
            const touch = e.touches[0]; mouseDragging = true;
            prevMouseX = touch.clientX; prevMouseY = touch.clientY;
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (!mouseDragging || e.touches.length > 1) return;
            const touch = e.touches[0];
            let deltaX = touch.clientX - prevMouseX; let deltaY = touch.clientY - prevMouseY;
            prevMouseX = touch.clientX; prevMouseY = touch.clientY;
            camYaw -= deltaX * 0.005; camPitch -= deltaY * 0.004;
        }, {passive: true});
        window.addEventListener('touchend', () => { mouseDragging = false; });

        // BUCLE DEL MOTOR
        function engineLoop() {
            if (arrowCam.left) camYaw += 0.02;
            if (arrowCam.right) camYaw -= 0.02;
            if (arrowCam.up) camPitch += 0.01;
            if (arrowCam.down) camPitch -= 0.01;

            camPitch = Math.max(-0.6, Math.min(0.0, camPitch));
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            let inputX = moveX; let inputY = moveY;
            let isMoving = (inputX !== 0 || inputY !== 0);

            if (isMoving !== wasMoving) {
                avatarMesh.setAttribute('animation-mixer', 'timeScale', isMoving ? VELOCIDAD_PIERNAS : 0);
                wasMoving = isMoving;
            }

            if (isMoving) {
                const pos = rig.getAttribute('position');
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_AVANCE;
                rig.setAttribute('position', pos);

                const targetAngle = camYaw + Math.atan2(inputX, -inputY) + Math.PI;
                let currentAngle = avatarMesh.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarMesh.object3D.rotation.y += deltaAngle * 0.15;
            }
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
