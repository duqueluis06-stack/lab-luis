<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Luis Camina</title>
    <!-- Motor 3D A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Componente para controles y animaciones (Mixamo) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene environment="preset: forest; lighting: none;">
      
      <a-assets>
        <!-- El mapa pesado desde Dropbox -->
        <a-asset-item id="pueblo" src="https://dl.dropboxusercontent.com/scl/fi/fa396gg86x36ejbbsm464/village.glb?rlkey=ru270ryy28g52w0ibnhysvx8o&st=b6ggnijs"></a-asset-item>
        
        <!-- TU AVATAR (Ruta local directa de tu repositorio) -->
        <a-asset-item id="mi-avatar" src="luis-camina.glb"></a-asset-item>
      </a-assets>

      <!-- El mapa del pueblo -->
      <a-gltf-model src="#pueblo" position="0 0 0"></a-gltf-model>

      <!-- Iluminación para eliminar los parches negros -->
      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 4 2"></a-light>

      <!-- JUGADOR (Controles de Teclado, Mando y Joystick táctil en móviles) -->
      <!-- Ajusta 'position' si necesitas aparecer exactamente en una calle del mapa -->
      <a-entity id="player" movement-controls="controls: keyboard, gamepad, touch;" position="0 0 0">
        
        <!-- EL AVATAR VISIBLE -->
        <!-- 'animation-mixer' activa las animaciones de Mixamo que tenga el archivo -->
        <a-gltf-model src="#mi-avatar" position="0 0 0" rotation="0 180 0" animation-mixer></a-gltf-model>
        
        <!-- LA CÁMARA (Ubicada arriba y atrás del avatar para ver el entorno) -->
        <a-entity camera look-controls position="0 2.5 4" rotation="-15 0 0"></a-entity>
        
      </a-entity>

    </a-scene>

  </body>
</html>
