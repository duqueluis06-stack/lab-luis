<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK - Sistema de Navegación</title>
    
    <!-- Componentes de renderizado 3D y animación -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #020617;
            user-select: none;
        }

        /* HUD Holográfico Privado (Sin datos de archivos) */
        #ark-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .panel-cyber {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            color: #f8fafc;
            width: 220px;
            backdrop-filter: blur(12px);
        }

        .hud-header {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f3ff;
            margin-bottom: 5px;
        }

        .hud-sub {
            font-size: 11px;
            color: #94a3b8;
        }

        /* Joystick Virtual en Pantalla (Universal para Móvil y Escritorio) */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 110px;
            height: 110px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            z-index: 100;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Interfaz de pantalla limpia -->
    <div id="ark-hud">
        <div class="panel-cyber">
            <div class="hud-header">SISTEMA EN LÍNEA</div>
            <div class="hud-sub">Entorno Virtual Activo</div>
        </div>
    </div>

    <!-- Joystick en pantalla -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <!-- Escena 3D -->
    <a-scene renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;">
        
        <!-- Carga interna de recursos en el repositorio -->
        <a-assets>
            <a-asset-item id="env-mesh" src="forest2.glb"></a-asset-item>
            <a-asset-item id="char-mesh" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación estable -->
        <a-entity light="type: ambient; intensity: 0.8; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 1.0;" position="10 20 10"></a-entity>

        <!-- Escenario base fijo -->
        <a-entity id="escenario" gltf-model="#env-mesh" position="0 0 0"></a-entity>

        <!-- SISTEMA UNIFICADO: El Avatar y la Cámara se mueven juntos -->
        <a-entity id="rig" position="0 0 0">
            
            <!-- Avatar centrado en el Rig (mirando hacia el frente en dirección de marcha) -->
            <a-entity id="avatar-player" 
                      gltf-model="#char-mesh" 
                      position="0 0 0" 
                      rotation="0 0 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>

            <!-- Cámara de tercera persona: ubicada permanentemente detrás y arriba del personaje -->
            <a-entity camera position="0 2.2 3.8" rotation="-15 0 0"></a-entity>
            
        </a-entity>

    </a-scene>

    <script>
        const knob = document.getElementById('joystick-knob');
        const container = document.getElementById('joystick-container');
        const rig = document.getElementById('rig');

        let dragging = false;
        let startX, startY;
        let moveX = 0, moveY = 0;

        // Gestión de pulsación (Soporta ratón y pantallas táctiles)
        function onStart(e) {
            dragging = true;
            const point = e.touches ? e.touches[0] : e;
            startX = point.clientX;
            startY = point.clientY;
        }

        function onMove(e) {
            if (!dragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - startX;
            let dy = point.clientY - startY;

            const maxDistance = 35; // Límite físico del joystick
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // Valores normalizados (-1 a 1)
            moveX = dx / maxDistance;
            moveY = dy / maxDistance;
        }

        function onEnd() {
            dragging = false;
            knob.style.transform = 'translate(0px, 0px)';
            moveX = 0;
            moveY = 0;
        }

        // Eventos Táctiles (Móviles)
        knob.addEventListener('touchstart', onStart);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);

        // Eventos de Ratón (Escritorio)
        knob.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        // Bucle continuo de movimiento de precisión en tercera persona
        function processFrame() {
            if (moveX !== 0 || moveY !== 0) {
                const pos = rig.getAttribute('position');
                const speed = 0.07; // Velocidad de desplazamiento modificable

                // Al estar la cámara fija detrás, el eje X del joystick mueve de forma lateral
                // y el eje Y mueve hacia adelante/atrás de manera intuitiva
                pos.x += moveX * speed;
                pos.z += moveY * speed;

                rig.setAttribute('position', pos);
            }
            requestAnimationFrame(processFrame);
        }
        processFrame();
    </script>
</body>
</html>
