<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Navegación Profesional</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Prevención absoluta de selección visual o recuadros al tocar en móviles */
        button, .joy-arrow, .audio-btn, #btn-exit, #btn-center, #joystick-container, #joystick-knob {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        /* Botón salir circular optimizado */
        #btn-exit {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ef4444;
            color: #ef4444;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            backdrop-filter: blur(4px);
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        /* Botón centralizar estilizado */
        #btn-center {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #00ffaa;
            color: #00ffaa;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        /* Consola de música ULTRA COMPACTA (No obstruye los botones laterales) */
        #audio-container {
            position: absolute;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-radius: 20px;
            height: 34px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.1);
        }

        .audio-btn {
            background: none;
            border: none;
            color: #f43f5e;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            transition: transform 0.1s ease, color 0.2s ease;
        }

        .audio-btn:active {
            transform: scale(0.9);
        }

        #track-title {
            color: #cbd5e1;
            font-size: 9px;
            max-width: 65px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* VUMeter semitransparente con diseño RGB reactivo */
        #vu-meter {
            width: 32px;
            height: 12px;
            display: block;
            opacity: 0.85;
        }

        #arrows-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-wrapper {
            position: absolute;
            bottom: 40px; 
            right: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-container {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
            touch-action: none;
        }

        .joy-arrow {
            position: absolute;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .arrow-up { top: 0; left: 34px; }
        .arrow-down { bottom: 0; left: 34px; }
        .arrow-left { left: 0; top: 34px; }
        .arrow-right { right: 0; top: 34px; }
    </style>
</head>
<body>

    <button id="btn-exit">SALIR</button>
    <button id="btn-center">👤</button>

    <div id="audio-container">
        <button class="audio-btn" id="btn-play" title="Reproducir">▶</button>
        <button class="audio-btn" id="btn-pause" title="Pausar">⏸</button>
        <button class="audio-btn" id="btn-next" title="Siguiente">⏭</button>
        <div id="track-title">Cargando...</div>
        <canvas id="vu-meter"></canvas>
    </div>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false"
             loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="forest-model" src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/forest7.glb"></a-asset-item>
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#020408"></a-sky>

        <a-sphere id="luna-brillante" 
                  position="-60 160 -220" 
                  radius="14" 
                  color="#f1f5f9" 
                  material="shader: flat; fog: false">
        </a-sphere>

        <a-entity light="type: ambient; intensity: 1.5; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 1.0;" position="10 50 10"></a-entity>

        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0" rotation="0 0 0"></a-entity>

        <a-entity id="player-rig" position="12 500 -15">
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 0.02 0" 
                      rotation="0 0 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 0;">
            </a-entity>

            <a-entity id="camera-orbit" position="0 1.8 0">
                <a-entity id="main-camera" camera position="0 0 5.0"></a-entity>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const SPAWN_X = 12;
        const SPAWN_Z = -15;

        const VELOCIDAD_AVANCE = 0.08;   
        const VELOCIDAD_PIERNAS = 1.3;   

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');
        const mainCamera = document.getElementById('main-camera');
        const sceneEl = document.querySelector('a-scene');
        const entornoEntity = document.getElementById('entorno');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0;   
        let camPitch = -0.25; 
        let camDist = 5.0; 
        let arrowCam = { up: false, down: false, left: false, right: false };
        let wasMoving = false;
        let inicializado = false;

        // --- SISTEMA MULTIMEDIA INTEGRADO ---
        const playlist = ['Camino-Nocturno.mp3', 'Sin-Mirar.mp3'];
        let currentTrackIndex = 0;
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let audioIniciado = false;

        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnNext = document.getElementById('btn-next');
        const trackTitle = document.getElementById('track-title');
        const canvasVU = document.getElementById('vu-meter');
        const ctxVU = canvasVU.getContext('2d');

        function loadTrack(index) {
            audio.src = playlist[index];
            const cleanName = playlist[index].replace('.mp3', '').replace('-', ' ');
            trackTitle.textContent = cleanName;
        }
        loadTrack(currentTrackIndex);

        function initAudioEngine() {
            if (audioIniciado) return;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 32;
            
            sourceNode = audioCtx.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            
            audioIniciado = true;
            drawVUMeter();
        }

        function triggerAutoplay() {
            if (!audioIniciado) {
                initAudioEngine();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (audio.paused) {
                audio.play().catch(err => console.log("Interacción detectada. Audio cargado."));
            }
        }

        btnPlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!audioIniciado) initAudioEngine();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audio.play();
        });

        btnPause.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.pause();
        });

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audio.play();
        }

        btnNext.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!audioIniciado) initAudioEngine();
            nextTrack();
        });

        audio.addEventListener('ended', () => {
            nextTrack();
        });

        function drawVUMeter() {
            requestAnimationFrame(drawVUMeter);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctxVU.clearRect(0, 0, canvasVU.width, canvasVU.height);

            const barCount = 5;
            const barWidth = (canvasVU.width / barCount) - 2;
            
            for (let i = 0; i < barCount; i++) {
                const value = dataArray[i * 2] || 0; 
                const percent = value / 255;
                const barHeight = percent * canvasVU.height * 0.9;

                // Gradiente RGB sutil y elegante
                const grad = ctxVU.createLinearGradient(0, canvasVU.height, 0, 0);
                grad.addColorStop(0, '#e11d48');
                grad.addColorStop(1, '#f43f5e');

                ctxVU.fillStyle = grad;
                
                const x = i * (barWidth + 2);
                const y = canvasVU.height - barHeight;
                
                ctxVU.fillRect(x, y, barWidth, barHeight);
            }
        }
        // -------------------------------------------------------------

        rig.setAttribute('position', `${SPAWN_X} 500 ${SPAWN_Z}`);

        sceneEl.addEventListener('loaded', () => {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 1000;
            const positions = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i += 3) {
                const r = 300;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i] = r * Math.sin(phi) * Math.cos(theta);
                positions[i+1] = Math.abs(r * Math.sin(phi) * Math.sin(theta)) + 1;
                positions[i+2] = r * Math.cos(phi);
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 1.5, sizeAttenuation: false});
            sceneEl.object3D.add(new THREE.Points(starsGeometry, starsMat));
        });

        document.getElementById('btn-exit').addEventListener('click', () => { window.location.href = 'index.html'; });

        document.getElementById('btn-center').addEventListener('click', () => {
            triggerAutoplay();
            inicializado = false;
            rig.setAttribute('position', `${SPAWN_X} 500 ${SPAWN_Z}`);
            camYaw = 0;
            camPitch = -0.25;
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;
        });

        window.addEventListener('wheel', (e) => {
            camDist += e.deltaY * 0.05;
            camDist = Math.max(2.5, Math.min(30.0, camDist));
            mainCamera.setAttribute('position', `0 0 ${camDist}`);
        }, { passive: true });

        function onJoyStart(e) {
            triggerAutoplay();
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX; joyStartY = point.clientY;
            e.stopPropagation();
        }
        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX; let dy = point.clientY - joyStartY;
            const maxLen = 35;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; 
            moveY = dy / maxLen;
            e.stopPropagation();
        }
        function onJoyEnd() {
            joyDragging = false; knob.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        window.addEventListener('keydown', (e) => { 
            triggerAutoplay();
            const k = e.key.toLowerCase(); 
            if (k in keys) keys[k] = true; 
        });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        function onScreenStart(e) {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.closest('#audio-container') || e.target.tagName === 'BUTTON') return;
            triggerAutoplay();
            screenDragging = true;
            const point = e.touches ? e.touches[0] : e;
            prevScreenX = point.clientX;
            prevScreenY = point.clientY;
        }
        function onScreenMove(e) {
            if (!screenDragging) return;
            const point = e.touches ? e.touches[0] : e;
            const clientX = point.clientX;
            const clientY = point.clientY;
            
            camYaw -= (clientX - prevScreenX) * 0.005;  
            camPitch += (clientY - prevScreenY) * 0.004; 
            
            prevScreenX = clientX; 
            prevScreenY = clientY;
        }
        function onScreenEnd() {
            screenDragging = false;
        }

        window.addEventListener('mousedown', onScreenStart);
        window.addEventListener('mousemove', onScreenMove);
        window.addEventListener('mouseup', onScreenEnd);
        window.addEventListener('touchstart', onScreenStart, {passive: true});
        window.addEventListener('touchmove', onScreenMove, {passive: true});
        window.addEventListener('touchend', onScreenEnd);

        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => { triggerAutoplay(); arrowCam[direction] = true; });
            btn.addEventListener('mouseup', () => { arrowCam[direction] = false; });
            btn.addEventListener('mouseleave', () => { arrowCam[direction] = false; });
            btn.addEventListener('touchstart', () => { triggerAutoplay(); arrowCam[direction] = true; });
            btn.addEventListener('touchend', () => { arrowCam[direction] = false; });
        };
        setupArrowCamera('btn-up', 'up'); setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left'); setupArrowCamera('btn-right', 'right');

        function engineLoop() {
            // Manejo fluido de las flechas dedicadas exclusivamente a la visión orbital
            if (arrowCam.left) camYaw += 0.02;
            if (arrowCam.right) camYaw -= 0.02;
            if (arrowCam.up) camPitch -= 0.015;   
            if (arrowCam.down) camPitch += 0.015;  

            camPitch = Math.max(-0.6, Math.min(0.05, camPitch)); 
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            const mesh = entornoEntity.object3D;
            if (!mesh) {
                requestAnimationFrame(engineLoop);
                return;
            }

            const pos = rig.getAttribute('position');

            if (!inicializado) {
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                const intersects = raycaster.intersectObject(mesh, true);
                if (intersects.length > 0) {
                    pos.y = intersects[0].point.y;
                    rig.setAttribute('position', pos);
                    inicializado = true; 
                }
                requestAnimationFrame(engineLoop);
                return;
            }
            
            let oldX = pos.x;
            let oldZ = pos.z;
            let oldY = pos.y;

            let inputX = 0; let inputY = 0;
            if (keys.w) inputY = -1; 
            if (keys.s) inputY = 1;  
            if (keys.a) inputX = -1; 
            if (keys.d) inputX = 1;  

            if (joyDragging) {
                inputX = moveX;
                inputY = moveY;
            }

            let isMoving = (inputX !== 0 || inputY !== 0);

            // Se preserva tu lógica original de animación de piernas intacta
            if (isMoving !== wasMoving) {
                avatarMesh.setAttribute('animation-mixer', 'timeScale', isMoving ? VELOCIDAD_PIERNAS : 0);
                wasMoving = isMoving;
            }

            if (isMoving) {
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_AVANCE;

                const targetAngle = camYaw + Math.atan2(inputX, inputY);
                let currentAngle = avatarMesh.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarMesh.object3D.rotation.y += deltaAngle * 0.25;
            }

            const raycaster = new THREE.Raycaster();
            raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
            
            const intersects = raycaster.intersectObject(mesh, true);
            if (intersects.length > 0) {
                let groundY = intersects[0].point.y;
                if ((groundY - oldY) > 0.8) {
                    pos.x = oldX;
                    pos.z = oldZ;
                    pos.y = oldY;
                } else {
                    pos.y += (groundY - pos.y) * 0.2;
                }
            } else {
                pos.x = oldX;
                pos.z = oldZ;
                pos.y = oldY;
            }

            rig.setAttribute('position', pos);
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
