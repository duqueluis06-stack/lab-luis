<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entorno 3D - Pruebas Nocturnas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <!-- Carga de Three.js y GLTFLoader desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<script>
    // --- VARIABLES GLOBALES ---
    let scene, camera, renderer, clock;
    let avatar = null;
    let escenarioSuelo = null;
    let mixer = null;
    let accionCaminar = null;
    
    // Configuración física de movimiento
    const velocidadMovimiento = 5.0; 
    const velocidadRotacion = 3.0;
    const raycaster = new THREE.Raycaster();
    const abajo = new THREE.Vector3(0, -1, 0);

    // Estado del teclado (fácil de conectar a los inputs de tu joystick)
    const teclas = { adelante: false, atras: false, izquierda: false, derecha: false };

    // --- 1. INICIALIZACIÓN DE LA ESCENA ---
    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();

        // Cámara en tercera persona inicial
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Iluminación básica
        const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(luzAmbiental);

        const luzSol = new THREE.DirectionalLight(0xffffff, 1.2);
        luzSol.position.set(20, 40, 20);
        luzSol.castShadow = true;
        luzSol.shadow.mapSize.width = 2048;
        luzSol.shadow.mapSize.height = 2048;
        luzSol.shadow.camera.near = 0.5;
        luzSol.shadow.camera.far = 150;
        const d = 40;
        luzSol.shadow.camera.left = -d;
        luzSol.shadow.camera.right = d;
        luzSol.shadow.camera.top = d;
        luzSol.shadow.camera.bottom = -d;
        scene.add(luzSol);

        // --- 2. CARGA DE ENTORNO (forest2.glb) ---
        const loader = new THREE.GLTFLoader();

        loader.load('forest2.glb', (gltf) => {
            escenarioSuelo = gltf.scene;
            scene.add(escenarioSuelo);
            
            escenarioSuelo.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                    child.castShadow = true;
                }
            });
            console.log('Entorno forest2.glb listo.');
        }, undefined, (error) => {
            console.error('Error cargando forest2.glb:', error);
        });

        // --- 3. CARGA DEL AVATAR ---
        // Cambia 'avatar.glb' por el nombre exacto de tu archivo de Mixamo/Avaturn
        loader.load('avatar.glb', (gltf) => {
            avatar = gltf.scene;
            avatar.scale.set(1, 1, 1); // Ajusta la escala si tu personaje es gigante o enano
            avatar.position.set(0, 0, 0);
            scene.add(avatar);

            avatar.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            // Configuración de animaciones
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(avatar);
                // Asumimos que la primera animación ([0]) es caminar. Ajusta el índice si es otra.
                accionCaminar = mixer.clipAction(gltf.animations[0]);
            }
            console.log('Avatar listo.');
        }, undefined, (error) => {
            console.error('Error cargando el avatar:', error);
        });

        // Eventos de control
        window.addEventListener('keydown', (e) => gestionarTeclado(e, true));
        window.addEventListener('keyup', (e) => gestionarTeclado(e, false));
        window.addEventListener('resize', onWindowResize);

        // Arrancar bucle
        animate();
    }

    // --- 4. GESTIÓN DE INPUTS ---
    function gestionarTeclado(evento, estadotecla) {
        switch (evento.code) {
            case 'ArrowUp':
            case 'KeyW':
                teclas.adelante = estadotecla;
                break;
            case 'ArrowDown':
            case 'KeyS':
                teclas.atras = estadotecla;
                break;
            case 'ArrowLeft':
            case 'KeyA':
                teclas.izquierda = estadotecla;
                break;
            case 'ArrowRight':
            case 'KeyD':
                teclas.derecha = estadotecla;
                break;
        }
    }

    // --- 5. LÓGICA DE MOVIMIENTO Y ADAPTACIÓN AL SUELO ---
    function actualizarMovimiento(delta) {
        if (!avatar) return;

        let moviendose = false;

        // Rotación (Girar sobre su propio eje)
        if (teclas.izquierda) avatar.rotation.y += velocidadRotacion * delta;
        if (teclas.derecha) avatar.rotation.y -= velocidadRotacion * delta;

        // Traslación (Avanzar o retroceder)
        if (teclas.adelante) {
            avatar.translateZ(velocidadMovimiento * delta);
            moviendose = true;
        }
        if (teclas.atras) {
            avatar.translateZ(-velocidadMovimiento * delta * 0.5); // Más lento hacia atrás
            moviendose = true;
        }

        // Control de reproducción de la animación de caminata
        if (accionCaminar) {
            if (moviendose) {
                if (!accionCaminar.isRunning()) accionCaminar.play();
            } else {
                accionCaminar.stop();
            }
        }

        // Sistema Raycaster para morder el suelo (Evita flotación y hundimiento)
        if (escenarioSuelo) {
            const origenRayo = avatar.position.clone();
            origenRayo.y += 2.0; // Elevamos el origen para asegurar la intersección desde arriba

            raycaster.set(origenRayo, abajo);
            const intersecciones = raycaster.intersectObject(escenarioSuelo, true);

            if (intersecciones.length > 0) {
                const puntoSuelo = intersecciones[0].point;
                avatar.position.y = puntoSuelo.y; // Copia la altura exacta de la colina
            }
        }
    }

    // --- 6. CÁMARA EN TERCERA PERSONA (SEGUIMIENTO SUAVE) ---
    function actualizarCamara() {
        if (!avatar) return;

        // Definimos la distancia ideal detrás (Z) y arriba (Y) del avatar
        const offsetIdeal = new THREE.Vector3(0, 2.5, -4.5);
        offsetIdeal.applyQuaternion(avatar.quaternion); // Sigue la rotación del personaje
        
        const posicionObjetivoCamara = avatar.position.clone().add(offsetIdeal);

        // Interpolación lineal (Lerp) para que la cámara no dé tirones bruscos
        camera.position.lerp(posicionObjetivoCamara, 0.1);
        
        // La cámara siempre mira un punto ligeramente elevado sobre el centro del avatar
        const objetivoMirada = avatar.position.clone();
        objetivoMirada.y += 1.2;
        camera.lookAt(objetivoMirada);
    }

    // --- 7. BUCLE DE RENDERIZADO ---
    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        // Actualizar mixer de animaciones de Mixamo
        if (mixer) mixer.update(delta);

        // Procesar físicas y posiciones
        actualizarMovimiento(delta);
        actualizarCamara();

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Arrancar todo al cargar la página
    window.onload = init;
</script>

</body>
</html>
