<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Despliegue Real</title>
    <!-- Motor principal de A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Script para activar las animaciones de tu avatar de Mixamo -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      <a-sky color="#ECECEC"></a-sky>

      <!-- EL MAPA: Con tu enlace de Hugging Face + el bypass forzado para Xet (?download=true) -->
      <a-gltf-model src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/village.glb?download=true" position="0 0 0" rotation="-90 0 0"></a-gltf-model>

      <!-- TU AVATAR: Con 'animation-mixer' para que camine y no se quede rígido en pose de T -->
      <a-gltf-model src="luis-camina.glb" position="0 1.6 19.5" rotation="0 180 0" animation-mixer></a-gltf-model>

      <!-- Iluminación completa -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- CÁMARA: Altura normal, controles WASD y modo vuelo activo por si necesitas buscar el terreno -->
      <a-entity camera look-controls wasd-controls="acceleration: 60; fly: true;" position="0 5 20"></a-entity>

    </a-scene>

  </body>
</html>
