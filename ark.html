<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK - Control de Navegación</title>
    
    <!-- Librerías de alto rendimiento 3D y sistemas de animación -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
        }

        /* Pantalla HUD limpia y privada */
        #ark-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .panel-cyber {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f3ff;
            padding: 12px 20px;
            border-radius: 8px;
            color: #f8fafc;
            width: 160px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
        }

        .hud-header {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f3ff;
        }

        /* Contenedor del Joystick con Flechas Periféricas */
        #joystick-wrapper {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            z-index: 100;
        }

        #joystick-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
            z-index: 105;
        }

        /* Flechas direccionales exteriores */
        .joy-arrow {
            position: absolute;
            color: #00f3ff;
            font-size: 16px;
            font-weight: bold;
            opacity: 0.7;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .arrow-up { top: 4px; left: 50%; transform: translateX(-50%); }
        .arrow-down { bottom: 4px; left: 50%; transform: translateX(-50%); }
        .arrow-left { left: 6px; top: 50%; transform: translateY(-50%); }
        .arrow-right { right: 6px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>

    <!-- HUD Genérico sin exposición de datos -->
    <div id="ark-hud">
        <div class="panel-cyber">
            <div class="hud-header">SISTEMA CONTROL: ON</div>
        </div>
    </div>

    <!-- Joystick con Flechas de Dirección Integradas -->
    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div class="joy-arrow arrow-up">▲</div>
            <div class="joy-arrow arrow-down">▼</div>
            <div class="joy-arrow arrow-left">◀</div>
            <div class="joy-arrow arrow-right">▶</div>
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- Escena 3D configurada para rendimiento fluido -->
    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" loading-screen="enabled: false">
        
        <a-assets>
            <!-- Inyección directa de tus archivos del repositorio -->
            <a-asset-item id="forest-model" src="forest2.glb"></a-asset-item>
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación global omnidireccional -->
        <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="10 20 10"></a-entity>

        <!-- Entorno / Bosque -->
        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0"></a-entity>

        <!-- SISTEMA DE SEGUIMIENTO (PLAYER RIG) -->
        <a-entity id="player-rig" position="0 0.05 0">
            
            <!-- El Avatar se sitúa en la raíz del movimiento -->
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 0 0" 
                      rotation="0 180 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>

            <!-- CÁMARA ORBITAL ESTILO GTA V: Pivota en torno al personaje -->
            <a-entity id="camera-orbit" position="0 1.6 0">
                <a-entity id="main-camera" camera position="0 0.6 3.5" look-controls="enabled: false"></a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const mainCamera = document.getElementById('main-camera');
        const avatarMesh = document.getElementById('avatar-mesh');

        // VARIABLES DE CONTROL DE MOVIMIENTO
        let joyDragging = false;
        let joyStartX, joyStartY;
        let moveX = 0, moveY = 0;

        // VARIABLES DE CÁMARA ORBITAL (RATÓN)
        let mouseDragging = false;
        let prevMouseX, prevMouseY;
        let camYaw = 0;   // Rotación horizontal
        let camPitch = 0; // Rotación vertical (Mirar arriba/abajo)

        // 1. SISTEMA DEL JOYSTICK CON INTERFAZ TÁCTIL Y RATÓN
        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX;
            joyStartY = point.clientY;
            e.stopPropagation();
        }

        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX;
            let dy = point.clientY - joyStartY;

            const maxDistance = 40; // Rango límite del movimiento
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            moveX = dx / maxDistance;
            moveY = dy / maxDistance;
            e.stopPropagation();
        }

        function onJoyEnd() {
            joyDragging = false;
            knob.style.transform = 'translate(0px, 0px)';
            moveX = 0;
            moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove);
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        // 2. SISTEMA DE CONTROL DE CÁMARA CON RATÓN (CLICK Y ARRASTRAR PANTALLA)
        window.addEventListener('mousedown', (e) => {
            if (e.target.id === 'joystick-knob') return;
            mouseDragging = true;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!mouseDragging) return;
            let deltaX = e.clientX - prevMouseX;
            let deltaY = e.clientY - prevMouseY;

            prevMouseX = e.clientX;
            prevMouseY = e.clientY;

            // Sensibilidad orbital estilo shooter / GTA
            camYaw -= deltaX * 0.005;
            camPitch -= deltaY * 0.005;

            // Limitación de ángulo vertical para evitar que la cámara se rompa por completo
            camPitch = Math.max(-0.6, Math.min(0.3, camPitch));

            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;
        });

        window.addEventListener('mouseup', () => {
            mouseDragging = false;
        });

        // 3. BUCLE DE ACTUALIZACIÓN EN TIEMPO REAL (60 FPS)
        function gameLoop() {
            if (moveX !== 0 || moveY !== 0) {
                const pos = rig.getAttribute('position');
                const speed = 0.09; // Velocidad de avance optimizada

                // Vectores de dirección calculados según la orientación de la cámara orbital
                const forwardX = -Math.sin(camYaw);
                const forwardZ = -Math.cos(camYaw);
                const rightX = Math.cos(camYaw);
                const rightZ = -Math.sin(camYaw);

                // Movimiento coordinado relativo a la vista
                pos.x += (forwardX * -moveY + rightX * moveX) * speed;
                pos.z += (forwardZ * -moveY + rightZ * moveX) * speed;
                rig.setAttribute('position', pos);

                // Rotación del avatar hacia el vector de avance de la marcha
                const targetAngle = Math.atan2(moveX, -moveY);
                avatarMesh.object3D.rotation.y = camYaw + targetAngle + Math.PI;
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
