<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK - Sistema de Control Profesional</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
        }

        #ark-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 110;
            pointer-events: none;
        }

        .panel-cyber {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00f3ff;
            padding: 12px 20px;
            border-radius: 8px;
            color: #f8fafc;
            width: 160px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .hud-header {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f3ff;
        }

        #control-wrapper {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 160px;
            height: 160px;
            z-index: 110;
        }

        #joystick-container {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 90px;
            height: 90px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        #joystick-knob {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 36px;
            height: 36px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
            z-index: 120;
        }

        .joy-arrow {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            z-index: 115;
        }

        .joy-arrow:active {
            background: #00f3ff;
            color: #020617;
            box-shadow: 0 0 10px #00f3ff;
        }

        .arrow-up { top: 0; left: 64px; }
        .arrow-down { bottom: 0; left: 64px; }
        .arrow-left { left: 0; top: 64px; }
        .arrow-right { right: 0; top: 64px; }
    </style>
</head>
<body>

    <div id="ark-hud">
        <div class="panel-cyber">
            <div class="hud-header">SISTEMA DIAGNÓSTICO</div>
        </div>
    </div>

    <div id="control-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
        
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="forest-model" src="forest2.glb"></a-asset-item>
            <!-- NOTA: Asegúrate de que en GitHub esté escrito exactamente en minúsculas: luis-camina.glb -->
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1.2; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="5 20 5"></a-entity>

        <!-- Entorno Fijo -->
        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0"></a-entity>

        <!-- RIG CENTRAL -->
        <a-entity id="player-rig" position="0 0.15 0">
            
            <!-- Indicador Celeste Base -->
            <a-ring color="#00f3ff" rotation="-90 0 0" radius-inner="0.4" radius-outer="0.5" position="0 0.02 0" material="shader: flat; transparent: true; opacity: 0.9;"></a-ring>

            <!-- CUBO ROJO DE SEGURIDAD: Si ves este cubo, el motor funciona y el problema es la escala del avatar -->
            <a-box id="test-cube" color="#ff0055" position="0 0.5 0" scale="0.4 0.8 0.4" material="wireframe: false;"></a-box>

           <!-- Entidad del Avatar modificada con escala Mixamo -->
<a-entity id="avatar-mesh" 
          gltf-model="#avatar-model" 
          position="0 0 0" 
          rotation="0 180 0" 
          scale="0.01 0.01 0.01"
          animation-mixer="clip: *; loop: repeat; timeScale: 1;">
</a-entity>

            <!-- Cámara Orbital -->
            <a-entity id="camera-orbit" position="0 1.6 0">
                <a-entity id="main-camera" camera position="0 0.6 3.5"></a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');
        const testCube = document.getElementById('test-cube');

        let moveX = 0, moveY = 0;
        let joyDragging = false;
        let joyStartX, joyStartY;

        let mouseDragging = false;
        let prevMouseX, prevMouseY;
        let camYaw = 0;   
        let camPitch = -0.1; 

        // 1. MANDOS POR FLECHAS
        const arrowConfig = {
            'btn-up': { x: 0, y: -1 },
            'btn-down': { x: 0, y: 1 },
            'btn-left': { x: -1, y: 0 },
            'btn-right': { x: 1, y: 0 }
        };

        Object.keys(arrowConfig).forEach(id => {
            const btn = document.getElementById(id);
            const data = arrowConfig[id];

            const startPress = (e) => {
                e.stopPropagation();
                moveX = data.x;
                moveY = data.y;
            };

            const endPress = () => { moveX = 0; moveY = 0; };

            btn.addEventListener('mousedown', startPress);
            btn.addEventListener('touchstart', startPress);
            btn.addEventListener('mouseup', endPress);
            btn.addEventListener('touchend', endPress);
            btn.addEventListener('mouseleave', endPress);
        });

        // 2. JOYSTICK CENTRAL
        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX;
            joyStartY = point.clientY;
            e.stopPropagation();
        }

        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX;
            let dy = point.clientY - joyStartY;

            const maxLen = 30;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > maxLen) {
                dx = (dx / dist) * maxLen;
                dy = (dy / dist) * maxLen;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen;
            moveY = dy / maxLen;
            e.stopPropagation();
        }

        function onJoyEnd() {
            joyDragging = false;
            knob.style.transform = 'translate(0px, 0px)';
            moveX = 0;
            moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove);
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        // 3. ROTACIÓN DE ESCENA
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#control-wrapper') || e.target.closest('#ark-hud')) return;
            mouseDragging = true;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!mouseDragging) return;
            let deltaX = e.clientX - prevMouseX;
            let deltaY = e.clientY - prevMouseY;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;

            camYaw -= deltaX * 0.005;
            camPitch -= deltaY * 0.004;
            camPitch = Math.max(-0.5, Math.min(0.2, camPitch));

            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;
        });

        window.addEventListener('mouseup', () => { mouseDragging = false; });

        // 4. BUCLE DE MOVIMIENTO
        function engineLoop() {
            if (moveX !== 0 || moveY !== 0) {
                const pos = rig.getAttribute('position');
                const speed = 0.08; 

                const fwdX = -Math.sin(camYaw);
                const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw);
                const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -moveY + rgtX * moveX) * speed;
                pos.z += (fwdZ * -moveY + rgtZ * moveX) * speed;
                rig.setAttribute('position', pos);

                const angle = Math.atan2(moveX, -moveY);
                const targetRotation = camYaw + angle + Math.PI;
                
                // Rotar tanto el avatar como el cubo testigo hacia donde caminan
                avatarMesh.object3D.rotation.y = targetRotation;
                testCube.object3D.rotation.y = targetRotation;
            }
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
