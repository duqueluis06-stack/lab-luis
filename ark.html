<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Entorno Enderezado</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      <a-sky color="#ECECEC"></a-sky>

      <!-- EL MAPA ENDEREZADO: Le metemos rotation="-90 0 0" para levantarlo del suelo -->
      <a-gltf-model src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/village.glb" position="0 0 0" rotation="-90 0 0"></a-gltf-model>

      <!-- Tu avatar -->
      <a-gltf-model src="luis-camina.glb" position="0 1.6 19.5" rotation="0 180 0"></a-gltf-model>

      <!-- Luces en orden -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- Cámara en Primera Persona: Altura estándar de ojos (1.6) -->
      <a-entity camera look-controls wasd-controls="acceleration: 50; fly: false;" position="0 1.6 20"></a-entity>

    </a-scene>

  </body>
</html>
