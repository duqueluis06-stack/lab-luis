<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Motor Corregido</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
            -webkit-user-select: none;
        }

        /* BOTÓN DE SALIR */
        #btn-exit {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.8);
            border: 1px solid #ef4444;
            color: white;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            touch-action: none;
        }

        /* BOTONES CÁMARA - IZQUIERDA */
        #arrows-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        /* JOYSTICK - DERECHA */
        #joystick-wrapper {
            position: absolute;
            bottom: 40px; 
            right: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-container {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            position: relative;
            backdrop-filter: blur(4px);
        }

        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
            touch-action: none;
        }

        .joy-arrow {
            position: absolute;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .joy-arrow:active { background: #00f3ff; color: #020617; }
        .arrow-up { top: 0; left: 34px; }
        .arrow-down { bottom: 0; left: 34px; }
        .arrow-left { left: 0; top: 34px; }
        .arrow-right { right: 0; top: 34px; }
    </style>
</head>
<body>

    <button id="btn-exit">SALIR</button>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false"
             loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="forest-model" src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/forest7.glb"></a-asset-item>
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación mejorada para disimular texturas cuadriculadas -->
        <a-entity light="type: ambient; intensity: 1.0; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="10 30 10"></a-entity>

        <!-- ENTORNO GENERADO Y ROTADO -->
        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0" rotation="180 0 0"></a-entity>

        <!-- RIG DEL JUGADOR (CÁMARA + AVATAR) -->
        <a-entity id="player-rig" position="0 0 0">
            
            <!-- Avatar con rotación calibrada para evitar deslizamientos raros -->
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 0 0" 
                      rotation="0 0 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 0;">
            </a-entity>

            <!-- Cámara Orbital con pivote limpio -->
            <a-entity id="camera-orbit" position="0 1.2 0">
                <a-entity id="main-camera" camera position="0 0 5.0"></a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const VELOCIDAD_AVANCE = 0.06;   
        const VELOCIDAD_PIERNAS = 1.2;   

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');
        const mainCamera = document.getElementById('main-camera');
        const sceneEl = document.querySelector('a-scene');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let mouseDragging = false; let prevMouseX, prevMouseY;
        
        let camYaw = 0;   
        let camPitch = -0.15; 
        let camDist = 5.0; 
        let arrowCam = { up: false, down: false, left: false, right: false };
        let wasMoving = false;

        // Generador automático de estrellas reales en el espacio
        sceneEl.addEventListener('loaded', () => {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 1200;
            const starPositions = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i += 3) {
                const u = Math.random(); const v = Math.random();
                const theta = u * 2.0 * Math.PI; const phi = Math.acos(2.0 * v - 1.0);
                const r = 350; // Distancia en la bóveda celeste
                starPositions[i] = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i+1] = Math.abs(r * Math.sin(phi) * Math.sin(theta)) + 10; 
                starPositions[i+2] = r * Math.cos(phi);
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 1.5, sizeAttenuation: false});
            const starField = new THREE.Points(starsGeometry, starsMaterial);
            sceneEl.object3D.add(starField);
        });

        document.getElementById('btn-exit').addEventListener('click', () => { window.location.href = 'index.html'; });

        // ZOOM ILIMITADO (Para poder alejarte y ver toda la maqueta)
        window.addEventListener('wheel', (e) => {
            camDist += e.deltaY * 0.01;
            camDist = Math.max(2.0, Math.min(180.0, camDist)); // Ampliado hasta 180 metros
            mainCamera.setAttribute('position', `0 0 ${camDist}`);
        }, { passive: true });

        // JOYSTICK CORREGIDO (Inversión solucionada multiplicando por -1)
        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX; joyStartY = point.clientY;
        }
        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX; let dy = point.clientY - joyStartY;
            const maxLen = 35;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = -1 * (dx / maxLen); // Corrección de espejo horizontal
            moveY = dy / maxLen;
        }
        function onJoyEnd() {
            joyDragging = false; knob.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

        // ROTACIÓN DE CÁMARA SUAVE
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.id === 'btn-exit') return;
            mouseDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!mouseDragging) return;
            let deltaX = e.clientX - prevMouseX; let deltaY = e.clientY - prevMouseY;
            prevMouseX = e.clientX; prevMouseY = e.clientY;
            camYaw -= deltaX * 0.002;  
            camPitch += deltaY * 0.002; 
        });
        window.addEventListener('mouseup', () => { mouseDragging = false; });

        // CONFIGURACIÓN BOTONES CÁMARA EXTRA
        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => { arrowCam[direction] = true; });
            btn.addEventListener('mouseup', () => { arrowCam[direction] = false; });
            btn.addEventListener('mouseleave', () => { arrowCam[direction] = false; });
        };
        setupArrowCamera('btn-up', 'up'); setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left'); setupArrowCamera('btn-right', 'right');

        // BUCLE DE RENDERIZADO Y CONTROL EN TIEMPO REAL
        function engineLoop() {
            // Rotaciones de cámara controladas
            if (arrowCam.left) camYaw += 0.015;
            if (arrowCam.right) camYaw -= 0.015;
            if (arrowCam.up) camPitch -= 0.01;   
            if (arrowCam.down) camPitch += 0.01;  

            camPitch = Math.max(-0.6, Math.min(0.3, camPitch)); // Bloqueo de balancín brusco
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            // Procesar entradas de teclado limpias (WASD DIRECCIONAL REAL)
            let inputX = -moveX; 
            let inputY = moveY;
            
            if (keys.w) inputY = -1;
            if (keys.s) inputY = 1;
            if (keys.a) inputX = -1; // Izquierda real
            if (keys.d) inputX = 1;  // Derecha real

            let isMoving = (inputX !== 0 || inputY !== 0);

            // Control de animación deslizante
            if (isMoving !== wasMoving) {
                avatarMesh.setAttribute('animation-mixer', 'timeScale', isMoving ? VELOCIDAD_PIERNAS : 0);
                wasMoving = isMoving;
            }

            if (isMoving) {
                const pos = rig.getAttribute('position');
                
                // Vectores de dirección basados de verdad en la vista de cámara
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_AVANCE;
                
                // ==========================================
                // ESCÁNER DE MONTAÑAS (ANTI-HUNDIMIENTO)
                // ==========================================
                const entornoMesh = document.getElementById('entorno').object3D;
                if (entornoMesh) {
                    const raycaster = new THREE.Raycaster();
                    const origin = new THREE.Vector3(pos.x, 2000, pos.z); // Dispara desde el cielo
                    const direction = new THREE.Vector3(0, -1, 0);
                    raycaster.set(origin, direction);
                    
                    const intersects = raycaster.intersectObject(entornoMesh, true);
                    if (intersects.length > 0) {
                        pos.y = intersects[0].point.y; // Ajusta la altura exacta de la montaña
                    }
                }

                rig.setAttribute('position', pos);

                // Rotar malla interna del avatar hacia donde camina
                const targetAngle = camYaw + Math.atan2(-inputX, inputY) + Math.PI;
                let currentAngle = avatarMesh.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarMesh.object3D.rotation.y += deltaAngle * 0.2;
            }
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
