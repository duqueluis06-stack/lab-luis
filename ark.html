<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Primera Persona Fijo</title>
    <!-- Solo el motor core de A-Frame, sin añadidos que rompan la carga -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      
      <a-assets>
        <!-- Tu mapa de Dropbox -->
        <a-asset-item id="pueblo" src="https://dl.dropboxusercontent.com/scl/fi/fa396gg86x36ejbbsm464/village.glb?rlkey=ru270ryy28g52w0ibnhysvx8o&st=b6ggnijs"></a-asset-item>
        <!-- Tu avatar local de GitHub -->
        <a-asset-item id="mi-avatar" src="luis-camina.glb"></a-asset-item>
      </a-assets>

      <!-- EL MAPA DEL PUEBLO -->
      <a-gltf-model src="#pueblo" position="0 0 0"></a-gltf-model>

      <!-- LUCES DIRECTAS: Iluminación total para erradicar el negro de Capture.jpg -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- CÁMARA EN PRIMERA PERSONA CON CONTROLES NATIVOS (No fallan) -->
      <!-- Te mueves con W, A, S, D en PC. Miras manteniendo click izquierdo y arrastrando -->
      <!-- Apareces elevado a 5 metros para evitar colisiones iniciales con rocas -->
      <a-entity camera look-controls wasd-controls="acceleration: 50; fly: false;" position="0 5 20">
        
        <!-- Tu avatar va anclado justo debajo de la cámara -->
        <!-- Oculto un poco hacia atrás para que no te tape tu propia visión -->
        <a-gltf-model src="#mi-avatar" position="0 -1.6 -0.5" rotation="0 180 0"></a-gltf-model>
        
      </a-entity>

    </a-scene>

  </body>
</html>
