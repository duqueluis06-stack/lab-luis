<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK - Sistema de Control Profesional</title>
    
    <!-- Motores Gráficos y de Animación -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
        }

        /* HUD Técnico Limpio */
        #ark-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 110;
            pointer-events: none;
        }

        .panel-cyber {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00f3ff;
            padding: 10px 16px;
            border-radius: 8px;
            color: #f8fafc;
            width: 150px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .hud-header {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f3ff;
        }

        /* Cruceta de Flechas de Cámara - ABAJO IZQUIERDA */
        #arrows-wrapper {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 100px;
            height: 100px;
            z-index: 110;
        }

        /* Joystick de Movimiento de Avatar - DERECHA ELEVADO */
        #joystick-wrapper {
            position: absolute;
            bottom: 140px; 
            right: 40px;
            width: 90px;
            height: 90px;
            z-index: 110;
        }

        #joystick-container {
            width: 90px;
            height: 90px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            position: relative;
        }

        #joystick-knob {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 36px;
            height: 36px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
        }

        .joy-arrow {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 6px;
            width: 30px;
            height: 30px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .joy-arrow:active {
            background: #00f3ff;
            color: #020617;
            box-shadow: 0 0 10px #00f3ff;
        }

        .arrow-up { top: 0; left: 35px; }
        .arrow-down { bottom: 0; left: 35px; }
        .arrow-left { left: 0; top: 35px; }
        .arrow-right { right: 0; top: 35px; }
    </style>
</head>
<body>

    <div id="ark-hud">
        <div class="panel-cyber">
            <div class="hud-header">SISTEMA CONTROL</div>
        </div>
    </div>

    <!-- Controles de Rastreo de Cámara (Izquierda) -->
    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <!-- Mando de Movimiento del Avatar (Derecha) -->
    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="forest-model" src="forest2.glb"></a-asset-item>
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1.2; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="5 20 5"></a-entity>

        <!-- Escenario Fijo -->
        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0"></a-entity>

        <!-- RIG CENTRAL (Bajado a nivel 0 para evitar flotación) -->
        <a-entity id="player-rig" position="0 0 0">
            
            <!-- Avatar Humano -->
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 0 0" 
                      rotation="0 180 0" 
                      scale="1 1 1">
            </a-entity>

            <!-- Sistema de Cámara Orbital Seguidora -->
            <a-entity id="camera-orbit" position="0 1.6 0">
                <a-entity id="main-camera" camera position="0 0.6 3.5"></a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');

        // Variables de Movimiento (Joystick)
        let moveX = 0, moveY = 0;
        let joyDragging = false;
        let joyStartX, joyStartY;

        // Variables de Cámara (Ratón / Táctil / Flechas)
        let mouseDragging = false;
        let prevMouseX, prevMouseY;
        let camYaw = 0;   
        let camPitch = -0.1; 

        // Estado de animación
        let wasMoving = false;

        // Estado de botones de rastreo de cámara
        let arrowCam = { up: false, down: false, left: false, right: false };

        // 1. CONFIGURACIÓN DE CRUCETA PARA RASTREO CONTROLADO DE CÁMARA
        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.stopPropagation(); arrowCam[direction] = true; };
            const end = () => { arrowCam[direction] = false; };
            
            btn.addEventListener('mousedown', start);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mouseleave', end);
        };

        setupArrowCamera('btn-up', 'up');
        setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left');
        setupArrowCamera('btn-right', 'right');

        // 2. LÓGICA DEL JOYSTICK (MOVIMIENTO AVATAR)
        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX; joyStartY = point.clientY;
            e.stopPropagation();
        }

        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX; let dy = point.clientY - joyStartY;
            const maxLen = 30;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen;
            e.stopPropagation();
        }

        function onJoyEnd() {
            joyDragging = false; knob.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove);
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        // 3. ROTACIÓN DE CÁMARA POR ARRASTRE DIRECTO
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.closest('#ark-hud')) return;
            mouseDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!mouseDragging) return;
            let deltaX = e.clientX - prevMouseX; let deltaY = e.clientY - prevMouseY;
            prevMouseX = e.clientX; prevMouseY = e.clientY;
            camYaw -= deltaX * 0.005; camPitch -= deltaY * 0.004;
        });

        window.addEventListener('mouseup', () => { mouseDragging = false; });

        // 4. BUCLE GENERAL DEL MOTOR (FÍSICAS, SUAVIZADO Y RASTREO)
        function engineLoop() {
            // A. Gestionar rotación de cámara controlada por flechas
            if (arrowCam.left) camYaw += 0.02;
            if (arrowCam.right) camYaw -= 0.02;
            if (arrowCam.up) camPitch += 0.01;
            if (arrowCam.down) camPitch -= 0.01;

            // Limitar inclinación vertical de cámara
            camPitch = Math.max(-0.6, Math.min(0.3, camPitch));
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            // B. Gestionar movimiento y animación del Avatar
            let isMoving = (moveX !== 0 || moveY !== 0);

            if (isMoving !== wasMoving) {
                if (isMoving) {
                    // Activa la caminata
                    avatarMesh.setAttribute('animation-mixer', {clip: '*', loop: 'repeat', timeScale: 1});
                } else {
                    // Elimina el mixer al frenar para que regrese instantáneamente a la pose recta neutra
                    avatarMesh.removeAttribute('animation-mixer');
                }
                wasMoving = isMoving;
            }

            if (isMoving) {
                const pos = rig.getAttribute('position');
                const speed = 0.06; // Ajuste de velocidad estable

                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -moveY + rgtX * moveX) * speed;
                pos.z += (fwdZ * -moveY + rgtZ * moveX) * speed;
                rig.setAttribute('position', pos);

                // SISTEMA INTERPOLADO DE ORIENTACIÓN (Evita giros bruscos e incontrolables)
                const targetAngle = camYaw + Math.atan2(moveX, -moveY) + Math.PI;
                let currentAngle = avatarMesh.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                
                // Normalizar ángulo para evitar rotaciones infinitas de 360°
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarMesh.object3D.rotation.y += deltaAngle * 0.15; // Factor de amortiguación
            }
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
