<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Vista Satélite</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene>
      <a-sky color="#ECECEC"></a-sky>

      <!-- El mapa del pueblo original -->
      <a-gltf-model src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/village.glb?download=true" position="0 0 0" rotation="-90 0 0"></a-gltf-model>

      <!-- Tu avatar -->
      <a-gltf-model src="luis-camina.glb" position="0 1.6 19.5" rotation="0 180 0" animation-mixer></a-gltf-model>

      <!-- Luces potentes -->
      <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 5 1"></a-light>

      <!-- NUEVA CÁMARA: Te sube a 120 metros de altura y te aleja a 250 metros para ver todo el mapa desde arriba -->
      <a-entity camera look-controls wasd-controls="acceleration: 100; fly: true;" position="0 120 250"></a-entity>

    </a-scene>

  </body>
</html>
