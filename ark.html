<!doctype html>
<html>
<head>
  <title>GLB Test</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Estilo para avisarte que el archivo se está descargando */
    #mensaje-carga {
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
    }
  </style>
</head>
<body style="margin:0">

<model-viewer
  src="https://github.com/duqueluis06-stack/lab-luis/releases/download/v1/village.glb"
  camera-controls
  auto-rotate
  style="width:100vw;height:100vh;background:#222">
  
  <!-- Esto se mostrará en pantalla MIENTRAS se descargan los 256MB -->
  <div id="mensaje-carga" slot="poster">
    Descargando entorno GLB (256 MB)...<br>
    Esto puede tardar un minuto dependiendo de tu internet.
  </div>

</model-viewer>

</body>
</html>
