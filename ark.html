<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Sistema Anticolisión y Cámara Fija</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #030712;
            user-select: none;
            -webkit-user-select: none;
        }

        #btn-exit {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.8);
            border: 1px solid #ef4444;
            color: white;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        #btn-center {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        #arrows-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-wrapper {
            position: absolute;
            bottom: 40px; 
            right: 40px;
            width: 100px;
            height: 100px;
            z-index: 999;
        }

        #joystick-container {
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            touch-action: none;
            position: relative;
        }

        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff;
            cursor: pointer;
            touch-action: none;
        }

        .joy-arrow {
            position: absolute;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .arrow-up { top: 0; left: 34px; }
        .arrow-down { bottom: 0; left: 34px; }
        .arrow-left { left: 0; top: 34px; }
        .arrow-right { right: 0; top: 34px; }
    </style>
</head>
<body>

    <button id="btn-exit">SALIR</button>
    <button id="btn-center">CENTRALIZAR AVATAR</button>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" 
             vr-mode-ui="enabled: false" 
             loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="forest-model" src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/forest7.glb"></a-asset-item>
            <a-asset-item id="avatar-model" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#020408"></a-sky>

        <a-entity light="type: ambient; intensity: 1.5; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 1.0;" position="10 50 10"></a-entity>

        <a-entity id="entorno" gltf-model="#forest-model" position="0 0 0" rotation="0 0 0"></a-entity>

        <!-- Se inicia el Rig en una altura aérea segura (Y=60) en el centro de la carretera para que caiga limpiamente encima -->
        <a-entity id="player-rig" position="0 60 0">
            <a-entity id="avatar-mesh" 
                      gltf-model="#avatar-model" 
                      position="0 0.02 0" 
                      rotation="0 0 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 0;">
            </a-entity>

            <!-- Órbita de la cámara elevada y protegida contra el subsuelo -->
            <a-entity id="camera-orbit" position="0 2.0 0">
                <a-entity id="main-camera" camera position="0 0 5.0"></a-entity>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const VELOCIDAD_AVANCE = 0.09;   
        const VELOCIDAD_PIERNAS = 1.3;   

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarMesh = document.getElementById('avatar-mesh');
        const mainCamera = document.getElementById('main-camera');
        const sceneEl = document.querySelector('a-scene');
        const entornoEntity = document.getElementById('entorno');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let mouseDragging = false; let prevMouseX, prevMouseY;
        
        let camYaw = 0;   
        let camPitch = -0.25; 
        let camDist = 5.0; 
        let arrowCam = { up: false, down: false, left: false, right: false };
        let wasMoving = false;
        let isFirstFrame = true;

        sceneEl.addEventListener('loaded', () => {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 1500;
            const positions = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i += 3) {
                const r = 400;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i] = r * Math.sin(phi) * Math.cos(theta);
                positions[i+1] = Math.abs(r * Math.sin(phi) * Math.sin(theta)) + 2;
                positions[i+2] = r * Math.cos(phi);
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 2.0, sizeAttenuation: false});
            sceneEl.object3D.add(new THREE.Points(starsGeometry, starsMat));
        });

        document.getElementById('btn-exit').addEventListener('click', () => { window.location.href = 'index.html'; });

        // Función de centralización y rescate total a zona segura superior de la avenida
        document.getElementById('btn-center').addEventListener('click', () => {
            const pos = rig.getAttribute('position');
            pos.x = 0;
            pos.z = 0;
            pos.y = 60; // Forzar arriba para re-escanear desde el cielo
            
            const entornoMesh = entornoEntity.object3D;
            if (entornoMesh) {
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(0, 2000, 0), new THREE.Vector3(0, -1, 0));
                const intersects = raycaster.intersectObject(entornoMesh, true);
                if (intersects.length > 0) {
                    pos.y = intersects[0].point.y; 
                } else {
                    pos.y = 0;
                }
            } else {
                pos.y = 0;
            }
            
            rig.setAttribute('position', pos);

            camYaw = 0;
            camPitch = -0.25;
            camDist = 5.0;
            mainCamera.setAttribute('position', `0 0 ${camDist}`);
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;
        });

        window.addEventListener('wheel', (e) => {
            camDist += e.deltaY * 0.08;
            camDist = Math.max(2.0, Math.min(40.0, camDist));
            mainCamera.setAttribute('position', `0 0 ${camDist}`);
        }, { passive: true });

        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX; joyStartY = point.clientY;
        }
        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX; let dy = point.clientY - joyStartY;
            const maxLen = 35;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; 
            moveY = dy / maxLen;
        }
        function onJoyEnd() {
            joyDragging = false; knob.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.id === 'btn-exit' || e.target.id === 'btn-center') return;
            mouseDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!mouseDragging) return;
            camYaw -= (e.clientX - prevMouseX) * 0.003;  
            camPitch += (e.clientY - prevMouseY) * 0.002; 
            prevMouseX = e.clientX; prevMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => { mouseDragging = false; });

        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => { arrowCam[direction] = true; });
            btn.addEventListener('mouseup', () => { arrowCam[direction] = false; });
            btn.addEventListener('mouseleave', () => { arrowCam[direction] = false; });
        };
        setupArrowCamera('btn-up', 'up'); setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left'); setupArrowCamera('btn-right', 'right');

        function engineLoop() {
            if (arrowCam.left) camYaw += 0.02;
            if (arrowCam.right) camYaw -= 0.02;
            if (arrowCam.up) camPitch -= 0.015;   
            if (arrowCam.down) camPitch += 0.015;  

            // Límites estrictos de inclinación para impedir que la cámara perfore el suelo o se hunda
            camPitch = Math.max(-0.55, Math.min(0.05, camPitch)); 
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            const pos = rig.getAttribute('position');
            
            // Guardar posición anterior para bloqueo físico (Anticolisión)
            let oldX = pos.x;
            let oldZ = pos.z;
            let oldY = pos.y;

            let inputX = 0; let inputY = 0;
            if (keys.w) inputY = -1; 
            if (keys.s) inputY = 1;  
            if (keys.a) inputX = -1; 
            if (keys.d) inputX = 1;  

            if (joyDragging) {
                inputX = moveX;
                inputY = moveY;
            }

            let isMoving = (inputX !== 0 || inputY !== 0);

            if (isMoving !== wasMoving) {
                avatarMesh.setAttribute('animation-mixer', 'timeScale', isMoving ? VELOCIDAD_PIERNAS : 0);
                wasMoving = isMoving;
            }

            if (isMoving) {
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_AVANCE;

                const targetAngle = camYaw + Math.atan2(inputX, inputY);
                let currentAngle = avatarMesh.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarMesh.object3D.rotation.y += deltaAngle * 0.25;
            }

            // SISTEMA ANTICOLISIÓN INTELIGENTE Y DETECTOR DE ALTURA DE CARRETERA
            const entornoMesh = entornoEntity.object3D;
            if (entornoMesh) {
                const raycaster = new THREE.Raycaster();
                // Escaneo desde una altura aérea controlada
                raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                
                const intersects = raycaster.intersectObject(entornoMesh, true);
                if (intersects.length > 0) {
                    let targetY = intersects[0].point.y;
                    
                    if (isFirstFrame) {
                        pos.y = targetY;
                        isFirstFrame = false;
                    } else {
                        // Filtro de colisión: Si el cambio de altura vertical es abrupto (> 1.4 metros), significa que chocó contra un pino, montaña vertical o límite de la maqueta
                        let alturaDelta = Math.abs(targetY - oldY);
                        if (alturaDelta > 1.4) {
                            // Detener el avance fantasma y rebotar la posición
                            pos.x = oldX;
                            pos.z = oldZ;
                            pos.y = oldY;
                        } else {
                            // Caminado fluido sobre la avenida o pendientes suaves
                            pos.y = targetY;
                        }
                    }
                } else {
                    // Si se sale de los límites de la maqueta, bloquear movimiento por completo
                    pos.x = oldX;
                    pos.z = oldZ;
                    pos.y = oldY;
                }
            }

            rig.setAttribute('position', pos);
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
