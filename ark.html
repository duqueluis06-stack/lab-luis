<!DOCTYPE html>
<html>
  <head>
    <title>Ark Project - Primera Persona</title>
    <!-- Motor 3D A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Componente para controles de movimiento y joystick táctil -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Activamos la escena -->
    <a-scene environment="preset: forest; lighting: none;">
      
      <a-assets>
        <!-- El mapa pesado desde Dropbox -->
        <a-asset-item id="pueblo" src="https://dl.dropboxusercontent.com/scl/fi/fa396gg86x36ejbbsm464/village.glb?rlkey=ru270ryy28g52w0ibnhysvx8o&st=b6ggnijs"></a-asset-item>
        <!-- Tu avatar local desde el repositorio -->
        <a-asset-item id="mi-avatar" src="luis-camina.glb"></a-asset-item>
      </a-assets>

      <!-- El mapa del pueblo -->
      <a-gltf-model src="#pueblo" position="0 0 0"></a-gltf-model>

      <!-- Iluminación global para que no se vea oscuro como en Capture.jpg -->
      <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 4 2"></a-light>

      <!-- JUGADOR (Contenedor del Avatar + Cámara) -->
      <!-- ¡AQUÍ MANDAS TÚ! Si apareces muy lejos, cambia el tercer número (Z) o el primero (X) -->
      <!-- Ejemplo: prueba con "0 0 20" o "0 0 -50" hasta que aparezcas al lado de una casa -->
      <a-entity id="player" movement-controls="controls: keyboard, gamepad, touch; speed: 0.3;" position="0 0 10">
        
        <!-- EL AVATAR (Hijo del jugador, se mueve contigo) -->
        <!-- Lo movemos un pelo hacia atrás (z: -0.2) para que la cámara no mire dentro de su cabeza -->
        <a-gltf-model src="#mi-avatar" position="0 0 -0.2" rotation="0 180 0" animation-mixer></a-gltf-model>
        
        <!-- CÁMARA EN PRIMERA PERSONA (A la altura de los ojos) -->
        <!-- 'look-controls' te permite girar la cabeza con el ratón o moviendo el dedo en el móvil -->
        <a-entity camera look-controls position="0 1.6 0"></a-entity>
        
      </a-entity>

    </a-scene>

  </body>
</html>
