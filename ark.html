<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene renderer="colorManagement:true; physicallyCorrectLights:true" loading-screen="enabled:false">

    <a-assets timeout="600000">

        <!-- ENTORNO (HUGGING FACE) -->
        <a-asset-item
            id="forest"
            src="https://huggingface.co/datasets/Luis-Fernando/ark-assets/resolve/main/forest7.glb">
        </a-asset-item>

        <!-- AVATAR (GITHUB) -->
        <a-asset-item
            id="avatar"
            src="luis-camina.glb">
        </a-asset-item>

    </a-assets>

    <!-- LUZ -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" intensity="1" position="2 4 1"></a-light>

    <!-- ESCENARIO -->
    <a-entity
        gltf-model="#forest"
        position="0 0 0"
        scale="1 1 1">
    </a-entity>

    <!-- AVATAR -->
    <a-entity
        id="player"
        gltf-model="#avatar"
        position="0 0 0"
        rotation="0 180 0"
        animation-mixer>
    </a-entity>

    <!-- CÁMARA -->
    <a-entity
        camera
        position="0 1.6 3"
        look-controls>
    </a-entity>

</a-scene>

</body>
</html>
