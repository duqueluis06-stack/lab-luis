<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ARK - Sistema de Control</title>
    
    <!-- Motores principales optimizados de A-Frame y Animación -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #020617;
            user-select: none;
        }

        /* HUD limpio y privado */
        #ark-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .panel-cyber {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f3ff;
            padding: 12px 20px;
            border-radius: 8px;
            color: #f8fafc;
            width: 180px;
            backdrop-filter: blur(8px);
        }

        .hud-header {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f3ff;
        }

        /* Joystick Virtual Universal (Mouse y Táctil) */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            z-index: 100;
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f3ff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Interfaz de Usuario -->
    <div id="ark-hud">
        <div class="panel-cyber">
            <div class="hud-header">SISTEMA CORE ACTIVO</div>
        </div>
    </div>

    <!-- Joystick de Navegación -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <!-- Escena 3D con perfil de alto rendimiento gráfico (Sin sombras lentas) -->
    <a-scene renderer="antialias: true; precision: medium; powerPreference: high-performance; colorManagement: true;">
        
        <a-assets>
            <a-asset-item id="bosque" src="forest2.glb"></a-asset-item>
            <a-asset-item id="avatar" src="luis-camina.glb"></a-asset-item>
        </a-assets>

        <!-- Iluminación ambiental optimizada pre-renderizada -->
        <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="5 15 5"></a-entity>

        <!-- Escenario de Fondo -->
        <a-entity id="mapa" gltf-model="#bosque" position="0 0 0"></a-entity>

        <!-- RIG CENTRAL DE MOVIMIENTO -->
        <a-entity id="rig" position="0 0 0">
            
            <!-- Avatar posicionado en el origen exacto del Rig para evitar pérdidas de tracking -->
            <a-entity id="avatar-player" 
                      gltf-model="#avatar" 
                      position="0 0 0" 
                      rotation="0 180 0" 
                      scale="1 1 1"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>

            <!-- Cámara Orbital: Reacciona al arrastrar el mouse en pantalla -->
            <a-entity id="camera-container" look-controls="pointerLockEnabled: false">
                <a-entity camera position="0 2.0 3.5" rotation="-12 0 0"></a-entity>
            </a-entity>
            
        </a-entity>

    </a-scene>

    <script>
        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('rig');
        const camContainer = document.getElementById('camera-container');
        const avatar = document.getElementById('avatar-player');

        let dragging = false;
        let startX, startY;
        let moveX = 0, moveY = 0;

        function onStart(e) {
            dragging = true;
            const point = e.touches ? e.touches[0] : e;
            startX = point.clientX;
            startY = point.clientY;
        }

        function onMove(e) {
            if (!dragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - startX;
            let dy = point.clientY - startY;

            const maxDistance = 30;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            moveX = dx / maxDistance;
            moveY = dy / maxDistance; // Negativo = Adelante, Positivo = Atrás
        }

        function onEnd() {
            dragging = false;
            knob.style.transform = 'translate(0px, 0px)';
            moveX = 0;
            moveY = 0;
        }

        // Registro de interacciones táctiles y mouse para el Joystick
        knob.addEventListener('touchstart', onStart);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);
        knob.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        // Bucle de renderizado de movimiento relativo a la orientación de la cámara
        function updateLoop() {
            if (moveX !== 0 || moveY !== 0) {
                const pos = rig.getAttribute('position');
                const speed = 0.08; // Velocidad fluida de traslación

                // Captura la orientación actual que el usuario le da con el mouse a la escena
                const cameraRotation = camContainer.getAttribute('rotation');
                const yaw = cameraRotation.y * (Math.PI / 180);

                // Cálculo de vectores de movimiento en relación directa a la cámara de tercera persona
                const forwardX = -Math.sin(yaw);
                const forwardZ = -Math.cos(yaw);
                const rightX = Math.cos(yaw);
                const rightZ = -Math.sin(yaw);

                // Desplazamiento del Rig completo
                pos.x += (forwardX * -moveY + rightX * moveX) * speed;
                pos.z += (forwardZ * -moveY + rightZ * moveX) * speed;
                rig.setAttribute('position', pos);

                // Rotación del avatar hacia la dirección de avance
                const moveAngle = Math.atan2(moveX, -moveY);
                avatar.object3D.rotation.y = yaw + moveAngle + Math.PI; 
            }
            requestAnimationFrame(updateLoop);
        }
        updateLoop();
    </script>
</body>
</html>
