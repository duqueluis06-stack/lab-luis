<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inter 3D Scene</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

/* 🌐 ESCENA */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

/* 📏 GRID (SIEMPRE VISIBLE → evita “pantalla negra falsa”) */
scene.add(new THREE.GridHelper(20, 20));

/* 📷 CÁMARA */
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 2, 6);

/* 🎮 RENDER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* 💡 LUCES */
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const directional = new THREE.DirectionalLight(0xffffff, 1);
directional.position.set(5, 10, 5);
scene.add(directional);

/* 🎮 CONTROLES */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* 📦 LOADER */
const loader = new GLTFLoader();

/* 🌐 URLS (TU RELEASE) */
const CITY_URL = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/city.glb";
const ADAN_URL = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/adan.glb";
const JON_URL  = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/jon.glb";

/* 🧠 FUNCIÓN SEGURA DE CARGA */
function loadModel(url, onLoad) {
  loader.load(
    url,
    (gltf) => {
      const model = gltf.scene;

      /* 🔧 ESCALA SEGURA (evita invisibles) */
      model.scale.set(0.01, 0.01, 0.01);

      /* 🔧 CENTRAR AUTOMÁTICO */
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);

      onLoad(model);
      scene.add(model);
    },
    undefined,
    (err) => {
      console.error("❌ ERROR CARGANDO:", url, err);
    }
  );
}

/* 🌆 CITY */
loadModel(CITY_URL, (city) => {
  city.position.set(0, 0, 0);
});

/* 👤 ADÁN (izquierda) */
loadModel(ADAN_URL, (adan) => {
  adan.position.set(-1.5, 0, 0);
  adan.rotation.y = Math.PI / 2;
});

/* 👤 JON (derecha) */
loadModel(JON_URL, (jon) => {
  jon.position.set(1.5, 0, 0);
  jon.rotation.y = -Math.PI / 2;
});

/* 🔄 LOOP */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

/* 📱 RESPONSIVE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
