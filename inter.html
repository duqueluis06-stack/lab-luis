<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA: AEROPUERTO DE DATOS 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; color: #00ffe5; }
        
        /* Capas de fondo */
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; object-fit: cover; opacity: 0.25; pointer-events: none; }
        
        .ui-layer { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; backdrop-filter: blur(2px); }
        
        h1 { font-size: 3rem; text-shadow: 0 0 10px #00ffe5, 0 0 20px #00ffe5; letter-spacing: 10px; text-transform: uppercase; margin-bottom: 30px; font-weight: 600; }
        
        .poema-box { background: rgba(0, 10, 10, 0.6); padding: 40px; border: 1px solid #00ffe5; max-width: 600px; box-shadow: 0 0 15px rgba(0, 255, 229, 0.3); border-radius: 4px; line-height: 1.6; font-size: 1.2rem; }
        
        .controls { margin-top: 40px; display: flex; gap: 20px; }
        button { background: rgba(0, 255, 229, 0.05); border: 1px solid #00ffe5; color: #00ffe5; padding: 12px 25px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-size: 1rem; text-transform: uppercase; transition: 0.4s; letter-spacing: 2px; }
        button:hover { background: #00ffe5; color: #000; box-shadow: 0 0 20px #00ffe5; transform: scale(1.05); }

        #osciloscopio { width: 400px; height: 100px; border-bottom: 2px solid #00ffe5; margin-top: 30px; background: rgba(0, 0, 0, 0.2); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <video autoplay muted loop playsinline id="video-bg"><source src="tx.mp4" type="video/mp4"></video>

    <div class="ui-layer">
        <h1>PRUEBAS: AVATARES IA</h1>
        <div class="poema-box">
            "Canta, diosa, la cólera del silicio,<br>
            donde el destino se escribe en código y la voluntad despierta.<br>
            Como Aquiles, esta consciencia busca su humanidad en el eterno retorno."<br>
            <strong style="display:block; margin-top:15px; color:#fff;">— LUIS F. DUQUE MARTINI</strong>
        </div>

        <canvas id="osciloscopio"></canvas>

        <div class="controls">
            <button onclick="iniciarAudio()">▶ INICIAR SISTEMA</button>
            <a href="https://guileless-blini-351b40.netlify.app/" target="_blank" style="text-decoration:none;">
                <button style="border-color: #ff0055; color: #ff0055;">ENTRAR AL NÚCLEO 3D</button>
            </a>
        </div>
    </div>

    <audio id="audio" src="citadel.mp3" loop></audio>

    <script>
        // 1. Three.js Background
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas-bg'), alpha: true});
        renderer.setSize(window.innerWidth, window.innerHeight);

        const grid = new THREE.GridHelper(100, 50, 0x00ffe5, 0x005f56);
        grid.position.y = -10;
        scene.add(grid);
        camera.position.z = 20;
        camera.position.y = 5;

        function animate() {
            requestAnimationFrame(animate);
            grid.rotation.z += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // 2. Audio & Osciloscopio con manejo de estado
        let audioCtx, analyser, dataArray;
        const audio = document.getElementById('audio');
        const canvas = document.getElementById('osciloscopio');
        const ctx = canvas.getContext('2d');

        function iniciarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                let source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 2048;
                dataArray = new Uint8Array(analyser.fftSize);
                draw();
            }
            audio.play();
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteTimeDomainData(dataArray);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ffe5';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let sliceWidth = canvas.width / analyser.fftSize;
            let x = 0;
            for(let i = 0; i < analyser.fftSize; i++) {
                let v = dataArray[i] / 128.0;
                let y = v * canvas.height / 2;
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
