<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inter - Scene 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

/* 🌐 ESCENA */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

/* 📷 CÁMARA */
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 2, 6);

/* 🎮 RENDER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* 💡 LUCES */
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

/* 🎮 CONTROLES */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* 📦 LOADER */
const loader = new GLTFLoader();

/* 🌐 URLS (GitHub Releases) */
const CITY_URL = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/city.glb";
const ADAN_URL = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/adan.glb";
const JOHN_URL = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/jon.glb";

/* 🌆 CITY */
loader.load(CITY_URL, (gltf) => {
  const city = gltf.scene;
  city.scale.set(1, 1, 1);
  scene.add(city);
});

/* 👤 ADÁN (izquierda) */
loader.load(ADAN_URL, (gltf) => {
  const adan = gltf.scene;

  adan.position.set(-1.5, 0, 0);
  adan.rotation.y = Math.PI / 2;

  scene.add(adan);
});

/* 👤 JOHN (derecha) */
loader.load(JOHN_URL, (gltf) => {
  const john = gltf.scene;

  john.position.set(1.5, 0, 0);
  john.rotation.y = -Math.PI / 2;

  scene.add(john);
});

/* 🔄 LOOP */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

/* 📱 RESPONSIVE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
