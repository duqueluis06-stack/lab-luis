<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Test City GLB</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

/* 🌐 ESCENA */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

/* 📏 REFERENCIA VISUAL */
scene.add(new THREE.GridHelper(20, 20));

/* 📷 CÁMARA */
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 2, 6);

/* 🎮 RENDER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* 💡 LUCES */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

/* 🎮 CONTROLES */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* 📦 LOADER */
const loader = new GLTFLoader();

/* 🌆 SOLO CITY */
const CITY_URL = "https://github.com/duqueluis06-stack/lab-luis/releases/download/V1/city.glb";

loader.load(
  CITY_URL,
  (gltf) => {
    const city = gltf.scene;

    /* 🔧 FIX UNIVERSAL */
    city.scale.set(0.01, 0.01, 0.01);

    /* 🔧 CENTRAR */
    const box = new THREE.Box3().setFromObject(city);
    const center = box.getCenter(new THREE.Vector3());
    city.position.sub(center);

    scene.add(city);

    console.log("✔ CITY CARGADA");
  },
  undefined,
  (err) => {
    console.error("❌ ERROR CITY:", err);
  }
);

/* 🔄 LOOP */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* 📱 RESPONSIVE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
