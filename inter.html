<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lab Luis - Inter 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .btn-exit {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 24px;
      background: rgba(255, 0, 50, 0.2);
      color: #ff3333;
      border: 2px solid #ff3333;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(255, 0, 50, 0.5);
      z-index: 1100;
      font-size: 14px;
      letter-spacing: 2px;
    }
    #ui-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: #00ff66;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 1px solid #00ff66;
      border-radius: 4px;
      pointer-events: none;
      font-size: 12px;
      z-index: 90;
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: #00ff66;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0,255,102,0.2);
      border-top: 3px solid #00ff66;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #error-log {
      position: absolute;
      top: 80px;
      left: 20px;
      color: #ff3333;
      background: rgba(0,0,0,0.9);
      padding: 15px;
      font-size: 12px;
      max-width: 85%;
      border: 2px solid #ff3333;
      display: none;
      z-index: 2000;
      overflow-y: auto;
      max-height: 200px;
    }
  </style>

  <script>
    window.addEventListener('error', function(e) {
      setTimeout(() => {
        const log = document.getElementById("error-log");
        const loader = document.getElementById("loading-screen");
        if(log) {
          log.style.display = "block";
          log.innerHTML += `<div>🚨 ERROR CRÍTICO: ${e.message}</div>`;
        }
        if(loader) loader.style.display = "none";
      }, 100);
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <a href="index.html" class="btn-exit">◀ SALIR</a>

  <div id="error-log"><b>CONSOLA DE DIAGNÓSTICO:</b><br></div>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">CARGANDO ENTORNO LABORATÓRIO...</div>
  </div>

  <div id="ui-overlay">
    <div>SISTEMA: EN LÍNEA</div>
    <div id="model-status">PROCESANDO RENDER...</div>
  </div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const errorLog = document.getElementById("error-log");
function forceScreenError(msg) {
  errorLog.style.display = "block";
  errorLog.innerHTML += `<div>⚠️ ALERTA: ${msg}</div>`;
  document.getElementById("loading-screen").style.display = "none";
}

/* 🌐 ESCENA Y REJILLA */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const grid = new THREE.GridHelper(40, 40, 0x00ff66, 0x113311);
scene.add(grid);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* 💡 ILUMINACIÓN */
scene.add(new THREE.AmbientLight(0xffffff, 1.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* 📦 ENLACES DE TUS MODELOS */
const loader = new GLTFLoader();
loader.setCrossOrigin('anonymous'); 

// 🛑 REEMPLAZA ÚNICAMENTE ESTOS TRES ENLACES CON TUS ENLACES DIRECTOS DE DROPBOX:
const CITY_URL = "https://dl.dropboxusercontent.com/s/TU_CODIGO_AQUI/city.glb"; 
const ADAN_URL = "https://dl.dropboxusercontent.com/s/TU_CODIGO_AQUI/adan.glb";
const JON_URL  = "https://dl.dropboxusercontent.com/s/TU_CODIGO_AQUI/jon.glb";

let totalModels = 3;
let loadedCount = 0;
let mixers = []; 
const clock = new THREE.Clock();

function updateProgress() {
  loadedCount++;
  if (loadedCount >= totalModels) {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("model-status").innerText = "SISTEMA VIRTUAL: OPERACIONAL";
  }
}

/* 🧠 PROCESADOR DE ENTORNOS Y ANIMACIONES SKINNED */
function safeLoad(url, posX, posY, posZ, rotY) {
  loader.load(
    url,
    (gltf) => {
      try {
        const model = gltf.scene;
        const group = new THREE.Group();
        group.add(model);

        // Centrado inteligente
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        group.position.set(posX, posY, posZ);
        group.rotation.y = rotY;
        scene.add(group);

        // 🎬 ACTIVACIÓN DE LOS MOVIMIENTOS/DIÁLOGOS GLB
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(gltf.animations[0]); 
          action.play();
          mixers.push(mixer);
        }

        updateProgress();
      } catch (processingError) {
        forceScreenError(`Error de procesamiento: ${processingError.message}`);
        updateProgress();
      }
    },
    (xhr) => {
      if (xhr.total) {
        const p = Math.round((xhr.loaded / xhr.total) * 100);
        document.getElementById("loading-text").innerText = `DESCARGANDO ${url.split('/').pop().split('?')[0]}: ${p}%`;
      }
    },
    (networkError) => {
      forceScreenError(`Error de red al conectar con el servidor del asset.`);
      updateProgress();
    }
  );
}

/* 🚀 DISPARO DE CARGA COORDENADA */
safeLoad(CITY_URL, 0, 0, 0, 0);
safeLoad(ADAN_URL, -3, 0, 0, Math.PI / 2);  
safeLoad(JON_URL, 3, 0, 0, -Math.PI / 2);   

/* 🔄 BUCLE DE RENDERIZADO (FPS REFRESH) */
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  for (const mixer of mixers) {
    mixer.update(delta);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
