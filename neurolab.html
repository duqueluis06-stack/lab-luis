<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v11.0</title>

  <!-- Librerías Gráficas de Alto Rendimiento -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-gold: #ffb703;
      --neon-red: #ff0055;
      --hud-bg: rgba(6, 3, 14, 0.94);
      --matrix-glow: 0 0 10px rgba(0, 255, 229, 0.4);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #010003;
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    /* Capa de InterfazHUD Inteligente */
    .hud-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box; padding: 12px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    /* Panel Superior Táctico */
    .top-matrix-panel {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.3);
      padding: 8px; text-align: center;
      box-shadow: var(--matrix-glow);
      position: relative;
    }
    
    .exit-btn {
      position: absolute; left: 10px; top: 6px;
      background: #000; border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 4px 10px;
      cursor: pointer; font-size: 11px; font-weight: bold;
      font-family: monospace;
    }
    .exit-btn:hover { background: var(--neon-red); color: #000; }

    .greek-stream {
      font-size: 12px; color: var(--neon-cyan);
      white-space: nowrap; letter-spacing: 5px;
      text-shadow: 0 0 5px var(--neon-cyan);
    }

    /* Terminal de Comunicación Inferior Blindada */
    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
      width: 100%; max-width: calc(100% - 24px);
      box-sizing: border-box;
      margin-bottom: env(safe-area-inset-bottom, 2px);
    }

    /* Visor de Historial con Altura Controlada Estricta */
    .log-view {
      font-size: 12px; 
      height: 130px; 
      overflow-y: auto; 
      color: #ffffff;
      line-height: 1.4; padding: 10px;
      background: rgba(0, 0, 0, 0.9);
      border-left: 3px solid var(--neon-gold);
      word-wrap: break-word; 
      white-space: pre-wrap;
    }

    .sumerian-bar {
      font-size: 10px; color: var(--neon-gold);
      opacity: 0.6; text-align: center;
      letter-spacing: 3px;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group { display: flex; gap: 8px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.95);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 12px; font-family: monospace; font-size: 13px;
      outline: none; min-width: 0;
    }
    input:focus { box-shadow: var(--matrix-glow); }

    button.action-btn {
      background: #000; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 12px 16px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 12px; flex-shrink: 0;
    }
    button.action-btn:hover { background: var(--neon-cyan); color: #000; }
    
    button.audio-btn { border-color: var(--neon-gold); color: var(--neon-gold); }
    button.audio-btn.active { background: var(--neon-gold); color: #000; box-shadow: 0 0 8px var(--neon-gold); }

    @media (min-width: 768px) {
      .log-view { height: 180px; font-size: 14px; }
      .greek-stream { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Contenedor del Renderizado 3D -->
  <div id="canvas-container"></div>

  <!-- Capa de Interfaz de Usuario -->
  <div class="hud-overlay">
    <div class="top-matrix-panel interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 INDEX</button>
      <div class="greek-stream">Ω α β γ Luis_Core_v11.0 // HYBRID_LIP_SYNC // COGNITIVE_SPACE</div>
    </div>

    <div class="console-hud interactive">
      <div id="log-display" class="log-view">>>> Entorno inteligente renderizado correctamente. Campo estelar matemático activo. Listo para procesar tus comandos, Luis.</div>
      
      <div class="sumerian-bar">𓎳 𒀀 𒀁 𒀂 𒀃 𒀄 𒀅 𒀆 檻 𓊰 項目</div>

      <div class="input-group">
        <button id="mute-btn" class="action-btn audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe tu mensaje aquí, Luis..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" class="action-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    // Variables de Control de Escena
    let scene, camera, renderer, avatarModel, animationMixer, navigationControls;
    let starParticles, nebulaMesh, starCount = 1500;
    let clock = new THREE.Clock();
    
    // Variables de Control Biométrico y Conversación
    let speakingActive = false;
    let audioOutputEnabled = false;
    let conversationHistory = []; 
    
    // Nodos de Referencia Óptica
    let targetFaceMeshes = []; 
    const speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    if (speechEngine.onvoiceschanged !== undefined) {
      speechEngine.onvoiceschanged = () => { speechEngine.getVoices(); };
    }

    // Activar/Desactivar Canal de Audio Principal
    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    // Flujo de Ejecución del Chat Inteligente
    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;
      
      // Persistencia estricta del historial (Memoria Fluida)
      conversationHistory.push({ role: "user", content: query });
      if (conversationHistory.length > 10) conversationHistory.shift(); 
      renderLogHistory();

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, context: conversationHistory })
        });

        const data = await res.json();
        const replyText = data.reply || "Error interno: Núcleo no responde.";

        // Acoplar respuesta al búfer histórico
        conversationHistory.push({ role: "assistant", content: replyText });
        if (conversationHistory.length > 10) conversationHistory.shift();
        renderLogHistory();

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = 'es-ES';
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.95;

          speakingActive = true;
          globalUtterance.onend = () => { resetControls(inputEl, execBtn); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn); };
          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn);
        }

      } catch (err) {
        logDisplay.innerHTML += "\n<span style='color:var(--neon-red)'>>>> FALLO CRÍTICO EN EL CANAL DE DATOS.</span>";
        resetControls(inputEl, execBtn);
      }
      inputEl.value = "";
    }

    // Render de Historial sin pérdidas verticales
    function renderLogHistory() {
      const logDisplay = document.getElementById("log-display");
      let htmlBuffer = "";
      conversationHistory.forEach(msg => {
        if(msg.role === "user") {
          htmlBuffer += `<b style="color:var(--neon-cyan)">Luis:</b> ${msg.content}\n`;
        } else {
          htmlBuffer += `<b style="color:var(--neon-gold)">AI:</b> ${msg.content}\n\n`;
        }
      });
      logDisplay.innerHTML = htmlBuffer;
      logDisplay.scrollTop = logDisplay.scrollHeight; 
    }

    function resetControls(input, btn) {
      input.disabled = false; btn.disabled = false;
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      // Restauración Geométrica Inmediata al silenciar
      targetFaceMeshes.forEach(target => {
        if (target.hasMorphs) {
          // Si tiene morph targets nativos, los ponemos a 0
          target.morphKeys.forEach(key => target.mesh.morphTargetInfluences[key] = 0);
        } else if (target.mesh.geometry.attributes.position) {
          // Si fue modificado por deformación espacial, restauramos los vértices originales
          target.mesh.geometry.attributes.position.copy(target.originalPositionBuffer);
          target.mesh.geometry.attributes.position.needsUpdate = true;
        }
      });
    }

    // Inicialización del Motor de Renderizado Correcto
    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020106); // Espacio Profundo Puro

      /* 🌌 COMPONENTE 1: SISTEMA ESTELAR MATEMÁTICO */
      const starsGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 20;
        starPositions[i+1] = (Math.random() - 0.5) * 20;
        starPositions[i+2] = (Math.random() - 0.5) * 20;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.02, transparent: true, opacity: 0.9});
      starParticles = new THREE.Points(starsGeometry, starMaterial);
      scene.add(starParticles);

      /* 🌌 COMPONENTE 2: NEBULOSA DINÁMICA PROCEDURAL (Relleno Galáctico Chulo) */
      const nebulaGeo = new THREE.PlaneGeometry(12, 12, 4, 4);
      const nebulaMat = new THREE.MeshBasicMaterial({
        color: 0x1c0a35,
        wireframe: false,
        transparent: true,
        opacity: 0.25,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      nebulaMesh = new THREE.Mesh(nebulaGeo, nebulaMat);
      nebulaMesh.position.set(0, 0, -4);
      scene.add(nebulaMesh);

      // Configuración Lumínica de Escena
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.1, 1.6);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Controles de Cámara Flexibles
      navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
      navigationControls.enableDamping = true;
      navigationControls.dampingFactor = 0.05;
      navigationControls.maxDistance = 3.5;
      navigationControls.minDistance = 0.5;
      navigationControls.target.set(0, 0.1, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const tacticalLight = new THREE.DirectionalLight(0x00ffe5, 1.3);
      tacticalLight.position.set(0, 1, 3);
      scene.add(tacticalLight);

      /* 🤖 LOADING Y MAPEO AVANZADO DEL AVATAR COGNITIVO */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        avatarModel.position.set(0, -0.85, 0);
        
        // Normalización de escala para pantallas móviles y PCs
        const scaleFactor = window.innerWidth < 600 ? 0.78 : 0.92;
        avatarModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
        scene.add(avatarModel);

        /* 🔬 ESCANEO E INYECCIÓN LIP-SYNC AUTOMÁTICA */
        avatarModel.traverse((child) => {
          if (child.isMesh) {
            const name = child.name.toLowerCase();
            
            // Verificación A: ¿El modelo tiene Morph Targets incorporados en Blender?
            if (child.morphTargetDictionary) {
              let morphKeysFound = [];
              for (let key in child.morphTargetDictionary) {
                const kLower = key.toLowerCase();
                if (kLower.includes("open") || kLower.includes("mouth") || kLower.includes("lip") || kLower.includes("jaw") || kLower.includes("viseme")) {
                  morphKeysFound.push(child.morphTargetDictionary[key]);
                }
              }
              if (morphKeysFound.length > 0) {
                targetFaceMeshes.push({ mesh: child, hasMorphs: true, morphKeys: morphKeysFound });
                return; // Si tiene morph targets nativos, saltamos el método de deformación manual
              }
            }

            // Verificación B: Inyector Geométrico Ponderado (Para mallas sin morphs fijos)
            // Si la malla corresponde a la cabeza o rostro, guardamos sus coordenadas tridimensionales
            if (name.includes("head") || name.includes("face") || name.includes("mesh") || name.includes("avatar")) {
              targetFaceMeshes.push({
                mesh: child,
                hasMorphs: false,
                originalPositionBuffer: child.geometry.attributes.position.clone(),
                currentPositionBuffer: child.geometry.attributes.position
              });
            }
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* BUCLE DE ANIMACIÓN Y RENDERIZADO DEFINITIVO */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);
      if (navigationControls) navigationControls.update();

      // Animación sutil de los componentes de fondo cósmico
      if (starParticles) starParticles.rotation.y += 0.0003;
      if (nebulaMesh) {
        nebulaMesh.rotation.z = Math.sin(timeNow * 0.0001) * 0.1;
      }

      /* 👄 ALGORITMO INTEGRAL DE HABLA COGNITIVA */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          // Genera una frecuencia armónica limpia que imita el movimiento silábico real (evita vibración/temblor brusco)
          const SpeechPulse = Math.abs(Math.sin(timeNow * 0.035) * 0.7 + Math.cos(timeNow * 0.015) * 0.3);

          targetFaceMeshes.forEach(target => {
            // RUTA NATIVA: Animación mediante morph targets del avatar
            if (target.hasMorphs) {
              target.morphKeys.forEach(key => {
                target.mesh.morphTargetInfluences[key] = SpeechPulse * 0.85;
              });
            } 
            // RUTA CRUDA: Deformador de vértices optimizado basado en el centroide del modelo
            else if (target.mesh.geometry.attributes.position) {
              const posAttr = target.currentPositionBuffer;
              const origAttr = target.originalPositionBuffer;
              
              // Buscamos dinámicamente los vértices que se encuentran en el cuadrante inferior-frontal de la malla (la boca)
              for (let i = 0; i < posAttr.count; i++) {
                const origY = origAttr.getY(i);
                const origZ = origAttr.getZ(i);

                // Si los vértices corresponden a la zona de la mandíbula inferior, los modulamos verticalmente
                if (origY > 0.1 && origY < 0.6 && origZ > 0.08) {
                  posAttr.setY(i, origY - (SpeechPulse * 0.035));
                }
              }
              posAttr.needsUpdate = true; // Notificación forzada al motor gráfico para renderizar el cambio de labios
            }
          });
        } else {
          // Respiración orgánica pasiva del avatar en estado de espera
          avatarModel.position.y = -0.85 + Math.sin(timeNow * 0.0012) * 0.012;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
