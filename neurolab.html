<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v10.0</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-gold: #ffb703;
      --neon-red: #ff0055;
      --hud-bg: rgba(4, 2, 8, 0.93);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #020105;
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    .hud-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box; padding: 10px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    .top-matrix-panel {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.25);
      padding: 6px; text-align: center;
      position: relative;
    }
    
    .exit-btn {
      position: absolute; left: 8px; top: 5px;
      background: #000; border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 3px 8px;
      cursor: pointer; font-size: 11px; font-weight: bold;
    }

    .greek-stream {
      font-size: 11px; color: var(--neon-cyan);
      white-space: nowrap; letter-spacing: 4px;
    }

    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 10px; display: flex; flex-direction: column; gap: 8px;
      width: 100%; max-width: calc(100% - 20px);
      box-sizing: border-box;
      margin-bottom: env(safe-area-inset-bottom, 5px);
    }

    .log-view {
      font-size: 12px; 
      height: 120px; 
      overflow-y: scroll; 
      color: #ffffff;
      line-height: 1.4; padding: 8px;
      background: rgba(0, 0, 0, 0.85);
      border-left: 3px solid var(--neon-gold);
      word-wrap: break-word; 
      white-space: pre-wrap;
    }

    .sumerian-bar {
      font-size: 10px; color: var(--neon-gold);
      opacity: 0.7; text-align: center;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group { display: flex; gap: 8px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.95);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 10px; font-family: monospace; font-size: 13px;
      outline: none; min-width: 0;
    }

    button.action-btn {
      background: #000; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 10px 14px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 12px; flex-shrink: 0;
    }
    
    button.audio-btn { border-color: var(--neon-gold); color: var(--neon-gold); }
    button.audio-btn.active { background: var(--neon-gold); color: #000; }

    @media (min-width: 768px) {
      .log-view { height: 160px; font-size: 13px; }
      .greek-stream { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <div class="top-matrix-panel interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 INDEX</button>
      <div class="greek-stream">Ψ Ω α β γ Luis_Core_v10.0 // LIP_SYNC_FORCED</div>
    </div>

    <div class="console-hud interactive">
      <div id="log-display" class="log-view">>>> Enlace neuronal completado. Sistema de habla forzado por hardware óseo. Listo para interactuar.</div>
      
      <div class="sumerian-bar">𓎳 𒀀 𒀁 𒀂 𒀃 𒀄 𒀅 𒀆 檻 𓊰 項目</div>

      <div class="input-group">
        <button id="mute-btn" class="action-btn audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe aquí, Luis..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" class="action-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, avatarModel, animationMixer, navigationControls;
    let starsGeometry, starParticles, starCount = 1500;
    let clock = new THREE.Clock();
    
    let speakingActive = false;
    let audioOutputEnabled = false;
    
    /* NODOS DE RASTREO ÓSEO Y ANATÓMICO */
    let jawBoneNode = null;
    let headBoneNode = null;
    let faceMeshNode = null;
    let conversationHistory = [];

    const speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    if (speechEngine.onvoiceschanged !== undefined) {
      speechEngine.onvoiceschanged = () => { speechEngine.getVoices(); };
    }

    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;
      conversationHistory.push({ role: "user", content: query });
      if (conversationHistory.length > 10) conversationHistory.shift(); 

      renderLogHistory();

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, context: conversationHistory })
        });

        const data = await res.json();
        const replyText = data.reply || "Respuesta nula del servidor.";

        conversationHistory.push({ role: "assistant", content: replyText });
        if (conversationHistory.length > 10) conversationHistory.shift();

        renderLogHistory();

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = 'es-ES';
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.9;

          speakingActive = true;
          globalUtterance.onend = () => { resetControls(inputEl, execBtn); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn); };
          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn);
        }

      } catch (err) {
        logDisplay.innerHTML += "\n<span style='color:var(--neon-red)'>>>> ERROR EN ENLACE INTEGRAL.</span>";
        resetControls(inputEl, execBtn);
      }
      inputEl.value = "";
    }

    function renderLogHistory() {
      const logDisplay = document.getElementById("log-display");
      let htmlBuffer = "";
      conversationHistory.forEach(msg => {
        if(msg.role === "user") {
          htmlBuffer += `<b style="color:var(--neon-cyan)">Luis:</b> ${msg.content}\n`;
        } else {
          htmlBuffer += `<b style="color:var(--neon-gold)">AI:</b> ${msg.content}\n\n`;
        }
      });
      logDisplay.innerHTML = htmlBuffer;
      logDisplay.scrollTop = logDisplay.scrollHeight;
    }

    function resetControls(input, btn) {
      input.disabled = false; btn.disabled = false;
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      // Reseteo estricto de transformaciones mecánicas de respaldo
      if (jawBoneNode) jawBoneNode.rotation.x = 0;
      if (headBoneNode) headBoneNode.rotation.x = 0;
      if (faceMeshNode) faceMeshNode.scale.set(1, 1, 1);
    }

    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020205);

      /* ENTRAMADO ESTELAR TRIDIMENSIONAL MATEMÁTICO */
      starsGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 15;
        starPositions[i+1] = (Math.random() - 0.5) * 15;
        starPositions[i+2] = (Math.random() - 0.5) * 15;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.022, transparent: true, opacity: 0.85});
      starParticles = new THREE.Points(starsGeometry, starMaterial);
      scene.add(starParticles);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.15, 1.8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
      navigationControls.enableDamping = true;
      navigationControls.dampingFactor = 0.05;
      navigationControls.maxDistance = 4;
      navigationControls.minDistance = 0.6;
      navigationControls.target.set(0, 0.1, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const frontLight = new THREE.DirectionalLight(0x00ffe5, 1.4);
      frontLight.position.set(0, 1, 2); scene.add(frontLight);

      /* CARGA DEL MODELO Y ESCANEO ESTRUCTURAL DE ESQUELETO (BONES) */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        avatarModel.position.set(0, -0.85, 0);
        
        if (window.innerWidth < 600) {
          avatarModel.scale.set(0.75, 0.75, 0.75);
        } else {
          avatarModel.scale.set(0.9, 0.9, 0.9);
        }
        scene.add(avatarModel);

        /* 🧠 RASTREADOR RECURSIVO AUTOMÁTICO DE ESQUELETO ANIMADO */
        avatarModel.traverse((child) => {
          const name = child.name.toLowerCase();
          
          // Buscar mallas faciales principales
          if (child.isMesh && (name.includes("head") || name.includes("face") || name.includes("mesh") || name.includes("avatar"))) {
            faceMeshNode = child;
          }
          
          // Buscar huesos del aparato fonador (Mandíbula o boca)
          if (child.isBone) {
            if (name.includes("jaw") || name.includes("boca") || name.includes("mandibula") || name.includes("mouth")) {
              jawBoneNode = child;
            }
            // Hueso secundario de la cabeza como respaldo macro
            if (name.includes("head") || name.includes("cabeza")) {
              headBoneNode = child;
            }
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);
      if (navigationControls) navigationControls.update();

      if (starParticles) {
        starParticles.rotation.y += 0.0004;
      }

      /* 👄 INYECTOR CINEMÁTICO INTEGRAL DE HABLA (SIMULACIÓN DE LABIOS/MAXILAR) */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          // Generamos una onda senoidal caótica y rápida que emula la modulación de las sílabas
          const talkWave = Math.abs(Math.sin(timeNow * 0.045)) * 0.25; 

          // Método Principal: Si el esqueleto expone el hueso de la mandíbula, lo rotamos físicamente
          if (jawBoneNode) {
            jawBoneNode.rotation.x = talkWave * 0.8; 
          } 
          // Método Secundario (Simultáneo): Si no hay hueso mandibular, modulamos levemente el cabeceo de habla
          else if (headBoneNode) {
            headBoneNode.rotation.x = talkWave * 0.15;
          }

          // Método de Respaldo Absoluto (Modulación de Escala Facial Estricta):
          // Comprime de forma sutil el rostro en el eje vertical (Y) y lo expande en profundidad (Z)
          // emulando la gesticulación al proyectar aire y palabras. ¡Se moverá sí o sí!
          if (faceMeshNode) {
            faceMeshNode.scale.y = 1.0 - (talkWave * 0.06);
            faceMeshNode.scale.z = 1.0 + (talkWave * 0.04);
          }

        } else {
          // Reposo orgánico en ingravidez
          avatarModel.position.y = -0.85 + Math.sin(timeNow * 0.001) * 0.01;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
