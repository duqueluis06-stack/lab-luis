<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v9.0</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-gold: #ffb703;
      --neon-red: #ff0055;
      --hud-bg: rgba(4, 2, 8, 0.93);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #020105;
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    .hud-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box; padding: 10px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    /* Barra Superior Reducida para ahorrar espacio */
    .top-matrix-panel {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.25);
      padding: 6px; text-align: center;
      position: relative;
    }
    
    .exit-btn {
      position: absolute; left: 8px; top: 5px;
      background: #000; border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 3px 8px;
      cursor: pointer; font-size: 11px; font-weight: bold;
    }

    .greek-stream {
      font-size: 11px; color: var(--neon-cyan);
      white-space: nowrap; letter-spacing: 4px;
    }

    /* Consola Inferior Anti-Desborde Rigorosa */
    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 10px; display: flex; flex-direction: column; gap: 8px;
      width: 100%; max-width: calc(100% - 20px);
      box-sizing: border-box;
      margin-bottom: env(safe-area-inset-bottom, 5px); /* Evita cortes en pantallas de iPhone nuevos */
    }

    /* Caja de visualización con scroll forzado y tamaño adaptivo estricto */
    .log-view {
      font-size: 12px; 
      height: 120px; /* Tamaño estricto fijo para que no empuje nada hacia abajo */
      overflow-y: scroll; 
      color: #ffffff;
      line-height: 1.4; padding: 8px;
      background: rgba(0, 0, 0, 0.85);
      border-left: 3px solid var(--neon-gold);
      word-wrap: break-word; 
      white-space: pre-wrap;
    }

    .sumerian-bar {
      font-size: 10px; color: var(--neon-gold);
      opacity: 0.7; text-align: center;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group { display: flex; gap: 8px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.95);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 10px; font-family: monospace; font-size: 13px;
      outline: none; min-width: 0; /* Evita que el input rompa el flexbox en móviles */
    }

    button.action-btn {
      background: #000; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 10px 14px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 12px; flex-shrink: 0;
    }
    
    button.audio-btn { border-color: var(--neon-gold); color: var(--neon-gold); }
    button.audio-btn.active { background: var(--neon-gold); color: #000; }

    /* Desactivamos jeroglíficos flotantes en móviles para limpiar la vista */
    @media (min-width: 768px) {
      .log-view { height: 160px; font-size: 13px; }
      .greek-stream { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <div class="top-matrix-panel interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 INDEX</button>
      <div class="greek-stream">Ψ Ω α β γ Luis_Core_v9.0 // COGNITIVE CONNECT</div>
    </div>

    <div class="console-hud interactive">
      <!-- Contenedor con altura protegida -->
      <div id="log-display" class="log-view">>>> Sistema inicializado de forma nativa. Historial listo y protegido contra desbordes de pantalla.</div>
      
      <div class="sumerian-bar">𓎳 𒀀 𒀁 𒀂 𒀃 𒀄 𒀅 𒀆 檻 𓊰 項目</div>

      <div class="input-group">
        <button id="mute-btn" class="action-btn audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe aquí, Luis..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" class="action-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, avatarModel, animationMixer, navigationControls;
    let starsGeometry, starParticles, starCount = 1800;
    let clock = new THREE.Clock();
    
    let speakingActive = false;
    let audioOutputEnabled = false;
    let fallbackMeshTargets = []; // Objetos 3D del rostro para manipulación cruda de vértices
    let conversationHistory = []; // Estructura de persistencia indexada

    const speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    // Inicializador del búfer de voz local
    if (speechEngine.onvoiceschanged !== undefined) {
      speechEngine.onvoiceschanged = () => { speechEngine.getVoices(); };
    }

    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    /* CONTROL DE CONTINUIDAD - ENVÍO COMPLETO DE CONTEXTO */
    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;

      // Forzamos la inyección en el array histórico para asegurar memoria
      conversationHistory.push({ role: "user", content: query });
      if (conversationHistory.length > 10) conversationHistory.shift(); 

      // Render inmediato del texto del usuario en pantalla
      renderLogHistory();

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, context: conversationHistory })
        });

        const data = await res.json();
        const replyText = data.reply || "Núcleo sin respuesta.";

        // Añadimos la respuesta para mantener el hilo lógico en la próxima vuelta
        conversationHistory.push({ role: "assistant", content: replyText });
        if (conversationHistory.length > 10) conversationHistory.shift();

        renderLogHistory();

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = 'es-ES';
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.9;

          speakingActive = true;
          globalUtterance.onend = () => { resetControls(inputEl, execBtn); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn); };
          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn);
        }

      } catch (err) {
        logDisplay.innerHTML += "\n<span style='color:var(--neon-red)'>>>> ERROR EN ENLACE COGNITIVO.</span>";
        resetControls(inputEl, execBtn);
      }
      inputEl.value = "";
    }

    // Renderizador exclusivo que mantiene fijas las palabras enteras sin perderlas abajo
    function renderLogHistory() {
      const logDisplay = document.getElementById("log-display");
      let htmlBuffer = "";
      conversationHistory.forEach(msg => {
        if(msg.role === "user") {
          htmlBuffer += `<b style="color:var(--neon-cyan)">Luis:</b> ${msg.content}\n`;
        } else {
          htmlBuffer += `<b style="color:var(--neon-gold)">AI:</b> ${msg.content}\n\n`;
        }
      });
      logDisplay.innerHTML = htmlBuffer;
      logDisplay.scrollTop = logDisplay.scrollHeight; // Auto-scroll forzado al final
    }

    function resetControls(input, btn) {
      input.disabled = false; btn.disabled = false;
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      // Revertir cualquier deformación geométrica aplicada
      fallbackMeshTargets.forEach(target => {
        if(target.mesh.geometry.attributes.position) {
          target.mesh.geometry.attributes.position.copy(target.originalGeo);
          target.mesh.geometry.attributes.position.needsUpdate = true;
        }
      });
    }

    /* MOTOR GRÁFICO CON ESPACIO PROCEDURAL Y AJUSTES BIOMÉTRICOS */
    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020205); // Fondo oscuro profundo base

      /* 🌌 GENERADOR PROCEDURAL DE ESTRELLAS (Adiós imágenes caídas) */
      starsGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 15;
        starPositions[i+1] = (Math.random() - 0.5) * 15;
        starPositions[i+2] = (Math.random() - 0.5) * 15;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.02, transparent: true, opacity: 0.8});
      starParticles = new THREE.Points(starsGeometry, starMaterial);
      scene.add(starParticles);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.15, 1.8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
      navigationControls.enableDamping = true;
      navigationControls.dampingFactor = 0.05;
      navigationControls.maxDistance = 4;
      navigationControls.minDistance = 0.6;
      navigationControls.target.set(0, 0.1, 0);

      // Iluminación Cósmica Estable
      scene.add(new THREE.AmbientLight(0xffffff, 1.0));
      const frontLight = new THREE.DirectionalLight(0x00ffe5, 1.5);
      frontLight.position.set(0, 1, 2); scene.add(frontLight);

      /* CARGA Y ESCANEO DIRECTO DE VÉRTICES DEL AVATAR */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        avatarModel.position.set(0, -0.85, 0);
        
        if (window.innerWidth < 600) {
          avatarModel.scale.set(0.75, 0.75, 0.75);
        } else {
          avatarModel.scale.set(0.9, 0.9, 0.9);
        }
        scene.add(avatarModel);

        /* 🛠️ INYECTOR DE ANIMACIÓN GEOMÉTRICA DIRECTA */
        avatarModel.traverse((child) => {
          if (child.isMesh) {
            // Guardamos un clon de la posición de los vértices originales de la cabeza/boca
            const name = child.name.toLowerCase();
            if (name.includes("head") || name.includes("face") || name.includes("avatar") || name.includes("mesh")) {
              fallbackMeshTargets.push({
                mesh: child,
                originalGeo: child.geometry.attributes.position.clone(),
                currentGeo: child.geometry.attributes.position
              });
            }
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* BUCLE DE ANIMACIÓN COGNITIVA */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);
      if (navigationControls) navigationControls.update();

      // Rotación pasiva del campo estelar de fondo
      if (starParticles) {
        starParticles.rotation.y += 0.0005;
        starParticles.rotation.x += 0.0002;
      }

      /* 👄 DEFORMADOR MATEMÁTICO REAL DE LABIOS / MANDÍBULA */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          const wave = Math.abs(Math.sin(timeNow * 0.04)) * 0.05; // Frecuencia de habla óptima
          
          fallbackMeshTargets.forEach(target => {
            const positionAttribute = target.currentGeo;
            const originalPosition = target.originalGeo;
            
            // Recorremos los vértices del modelo en tiempo real
            for (let i = 0; i < positionAttribute.count; i++) {
              const origY = originalPosition.getY(i);
              const origZ = originalPosition.getZ(i);
              
              // Filtro Biométrico: Detectamos los vértices que componen la parte baja del rostro (boca y mentón)
              if (origY > 0.8 && origY < 1.3 && origZ > 0.05) {
                // Desplazamos los vértices hacia abajo simulando la apertura física de la boca
                positionAttribute.setY(i, origY - wave);
              }
            }
            positionAttribute.needsUpdate = true; // Forzamos a Three.js a re-renderizar los labios moviéndose
          });
        } else {
          // Micro balanceo de descanso espacial
          avatarModel.position.y = -0.85 + Math.sin(timeNow * 0.001) * 0.01;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
