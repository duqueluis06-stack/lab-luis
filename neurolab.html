<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v8.0</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-gold: #ffb703;
      --neon-red: #ff0055;
      --hud-bg: rgba(6, 4, 12, 0.85);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #030207;
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    .hud-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box; padding: 15px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    /* Barra Superior */
    .top-matrix-panel {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.25);
      padding: 10px; text-align: center;
      position: relative; overflow: hidden;
    }
    
    .exit-btn {
      position: absolute; left: 10px; top: 8px;
      background: #000; border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 5px 12px;
      cursor: pointer; font-size: 11px; font-weight: bold;
    }
    .exit-btn:hover { background: var(--neon-red); color: #000; }

    .greek-stream {
      font-size: 14px; color: var(--neon-cyan);
      white-space: nowrap; letter-spacing: 6px;
      display: inline-block; animation: streamMove 25s linear infinite;
    }

    /* Jeroglíficos Laterales */
    .side-hieroglyphs {
      position: absolute; top: 120px;
      display: flex; flex-direction: column; gap: 15px;
      font-size: 22px; color: rgba(255, 183, 3, 0.5);
      text-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
    }
    .left-glyphs { left: 20px; }
    .right-glyphs { right: 20px; }

    /* Terminal Inferior Modular */
    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 15px; display: flex; flex-direction: column; gap: 10px;
    }

    .log-view {
      font-size: 13px; max-height: 160px; min-height: 90px;
      overflow-y: auto; color: #ffffff;
      line-height: 1.5; padding: 10px;
      background: rgba(0, 0, 0, 0.75);
      border-left: 3px solid var(--neon-gold);
      word-wrap: break-word; white-space: pre-wrap;
    }

    .sumerian-bar {
      font-size: 12px; color: var(--neon-gold);
      opacity: 0.7; letter-spacing: 4px; text-align: center;
      border-top: 1px dashed rgba(255, 183, 3, 0.3);
      padding-top: 5px;
    }

    .input-group { display: flex; gap: 10px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 12px; font-family: monospace; font-size: 14px;
      outline: none;
    }

    button.action-btn {
      background: #000; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 12px 20px;
      font-family: monospace; cursor: pointer; font-weight: bold;
    }
    button.action-btn:hover { background: var(--neon-cyan); color: #000; }
    
    button.audio-btn { border-color: var(--neon-gold); color: var(--neon-gold); }
    button.audio-btn.active { background: var(--neon-gold); color: #000; }

    @keyframes streamMove {
      0% { transform: translateX(20%); }
      100% { transform: translateX(-20%); }
    }

    @media (max-width: 600px) {
      .side-hieroglyphs { display: none; }
      .log-view { max-height: 110px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <div class="top-matrix-panel interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 INDEX</button>
      <div class="greek-stream">
        Ψ Ω α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ Luis_Core_v8.0 // UNIVERSAL COSMOS ENVIRONMENT
      </div>
    </div>

    <div class="side-hieroglyphs left-glyphs">
      <div>𓀀</div><div>𓁐</div><div>𓃠</div><div>𓅃</div><div>𓆗</div>
    </div>
    <div class="side-hieroglyphs right-glyphs">
      <div>𓊝</div><div>𓋹</div><div>𓌔</div><div>𓎵</div><div>𓏃</div>
    </div>

    <div class="console-hud interactive">
      <div id="log-display" class="log-view">>>> Entorno galáctico cargado. Arrastra con el ratón o pantalla táctil para mover a Luis libremente en el espacio.</div>
      
      <div class="sumerian-bar">
         𓎳 𒀀 𒀁 𒀂 𒀃 𒀄 𒀅 𒀆 檻 𓊰 項目
      </div>

      <div class="input-group">
        <button id="mute-btn" class="action-btn audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe un mensaje interactivo..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" class="action-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, avatarModel, animationMixer, navigationControls;
    let clock = new THREE.Clock();
    
    /* INTERACTIVIDAD Y SEGUIMIENTO TÁCTICO */
    let speakingActive = false;
    let audioOutputEnabled = false;
    let facialNodes = [];        // Nodos del rostro para inyección de escala forzada
    let discoveredFaceMeshes = []; // Claves de forma clásicas
    let conversationHistory = []; // Almacén de contexto para continuidad real del chat

    const speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    /* ENVIAR PETICIÓN CON MANTENIMIENTO DE CONTEXTO RECOBRADO */
    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;

      // Guardamos la memoria inmediata del diálogo
      conversationHistory.push({ role: "user", content: query });
      if (conversationHistory.length > 8) conversationHistory.shift(); 

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, context: conversationHistory })
        });

        const data = await res.json();
        const replyText = data.reply || "Núcleo desconectado de la red.";

        // Añadimos la respuesta al historial para garantizar la continuidad mínima
        conversationHistory.push({ role: "assistant", content: replyText });

        logDisplay.innerText = `Luis: ${query}\n\nAI: ${replyText}`;
        logDisplay.scrollTop = logDisplay.scrollHeight;

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = 'es-ES';
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.92;

          speakingActive = true;

          globalUtterance.onend = () => { resetControls(inputEl, execBtn); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn); };

          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn);
        }

      } catch (err) {
        logDisplay.innerText = ">>> ERROR DE ENLACE INTERACTIVO EN EL CHAT.";
        resetControls(inputEl, execBtn);
      }
      inputEl.value = "";
    }

    function resetControls(input, btn) {
      input.disabled = false; btn.disabled = false;
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      // Reseteo de Morph Targets
      discoveredFaceMeshes.forEach(mesh => {
        if (mesh.morphTargetInfluences) {
          forceMorph(mesh, 'mouth', 0); forceMorph(mesh, 'open', 0);
        }
      });
      // Reseteo de Escala de Respaldo Forzada
      facialNodes.forEach(node => { node.scale.set(1, 1, 1); });
    }

    /* INICIALIZACIÓN DEL MOTOR CON ENTORNO CÓSMICO */
    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();

      /* 🌌 DESCARGA AUTOMÁTICA DE FONDO CÓSMICO CHULO (NASA APOD / DEEP SPACE) */
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(
        "https://images-api.nasa.gov/asset/as11-44-6551~orig", // Imagen espacial real de alta velocidad
        (texture) => {
          scene.background = texture;
        },
        undefined,
        (err) => {
          // Servidor de respaldo si falla el enlace principal
          scene.background = new THREE.Color(0x0a0518);
        }
      );

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.2, 2.0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // CONTROLES DE RATÓN ACTIVADOS (OrbitControls)
      navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
      navigationControls.enableDamping = true;
      navigationControls.dampingFactor = 0.05;
      navigationControls.maxDistance = 5;
      navigationControls.minDistance = 0.7;
      navigationControls.target.set(0, 0.1, 0);

      // Luces ambientales y puntuales equilibradas
      scene.add(new THREE.AmbientLight(0xffffff, 1.2)); // Luz de relleno espacial
      const goldLight = new THREE.PointLight(0xffb703, 3, 15);
      goldLight.position.set(2, 2, 1); scene.add(goldLight);
      const cyanLight = new THREE.PointLight(0x00ffe5, 3, 15);
      cyanLight.position.set(-2, 1, 1); scene.add(cyanLight);

      /* CARGA DEL AVATAR COGNITIVO */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        avatarModel.position.set(0, -0.9, 0);
        
        // Adaptación milimétrica para móviles
        if (window.innerWidth < 600) {
          avatarModel.scale.set(0.72, 0.72, 0.72);
        } else {
          avatarModel.scale.set(0.88, 0.88, 0.88);
        }
        scene.add(avatarModel);

        /* 🔍 ESCANEO AGRESIVO PARA FORZAR INTERACCIÓN DE LABIOS */
        avatarModel.traverse((child) => {
          if (child.isMesh) {
            if (child.morphTargetDictionary) {
              discoveredFaceMeshes.push(child);
            }
            // Mapeo por Software: si el objeto se llama head, face, mouth, lips o jaw, lo capturamos
            const name = child.name.toLowerCase();
            if (name.includes('head') || name.includes('face') || name.includes('mouth') || name.includes('lip') || name.includes('mesh')) {
              facialNodes.push(child);
            }
          }
          if (child.isBone && (child.name.toLowerCase().includes('jaw') || child.name.toLowerCase().includes('mouth'))) {
            facialNodes.push(child); // Inclusión de huesos maxilares al buffer
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function forceMorph(mesh, term, val) {
      const dict = mesh.morphTargetDictionary;
      for (let name in dict) {
        if (name.toLowerCase().includes(term.toLowerCase())) {
          mesh.morphTargetInfluences[dict[name]] = val;
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* BUCLE DE ANIMACIÓN INTEGRAL */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);
      if (navigationControls) navigationControls.update();

      /* SISTEMA DE INTERACCIÓN DE LABIOS FORZADO POR SOFTWARE */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          // Onda matemática pura que simula modulación de voz humana
          const vocalWave = Math.abs(Math.sin(timeNow * 0.038));
          
          // Ruta A: Morph Targets Tradicionales
          if (discoveredFaceMeshes.length > 0) {
            discoveredFaceMeshes.forEach(mesh => {
              forceMorph(mesh, 'mouth', vocalWave * 0.9);
              forceMorph(mesh, 'open', vocalWave * 0.9);
              forceMorph(mesh, 'viseme', vocalWave * 0.9);
            });
          }
          
          // Ruta B: Forzado por Escala Mecánica (Garantiza movimiento de boca/rostro pase lo que pase)
          facialNodes.forEach(node => {
            // Genera una micro-compresión vertical en el eje Y imitando la articulación al hablar
            node.scale.y = 1.0 - (vocalWave * 0.04);
          });

        } else {
          // Estado de reposo fluido e ingrávido
          avatarModel.position.y = -0.9 + Math.sin(timeNow * 0.001) * 0.015;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
