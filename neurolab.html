<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-purple: #9d4edd;
      --hud-bg: rgba(4, 2, 8, 0.8);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #000;
      color: var(--neon-cyan);
      font-family: monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    /* HUD Periférico Adaptable a Teléfonos y Escritorio */
    .interface-wrapper {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 10px; pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    .header-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(157, 78, 221, 0.3);
      padding: 10px; display: flex;
      justify-content: space-between; align-items: center;
      font-size: 11px; box-shadow: 0 0 15px rgba(0,255,229,0.1);
    }

    .main-title {
      color: #fff; font-weight: bold; letter-spacing: 2px;
    }

    /* Consola Inferior Compacta */
    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.3);
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }

    .log-view {
      font-size: 12px; max-height: 80px;
      overflow-y: auto; color: #fff;
      line-height: 1.4; padding-left: 4px;
      border-left: 2px solid var(--neon-purple);
    }

    .input-group { display: flex; gap: 8px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 10px; font-family: monospace; font-size: 13px;
      outline: none;
    }

    button {
      background: #000; border: 1px solid var(--neon-purple);
      color: var(--neon-purple); padding: 10px 14px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 11px; transition: all 0.2s;
    }

    button:hover {
      background: var(--neon-purple); color: #000;
      box-shadow: 0 0 10px var(--neon-purple);
    }

    button.audio-btn { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    button.audio-btn.active { background: var(--neon-cyan); color: #000; }

    /* Estilos responsivos específicos para pantallas pequeñas */
    @media (max-width: 600px) {
      .header-hud { flex-direction: column; gap: 4px; align-items: flex-start; }
      .log-view { max-height: 60px; font-size: 11px; }
      input { padding: 8px; font-size: 11px; }
      button { padding: 8px 10px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="interface-wrapper">
    <!-- TOP BAR -->
    <div class="header-hud interactive">
      <span class="main-title">CORE INTERFACE: LUIS</span>
      <span id="lang-indicator">LANG: AUTO (ES/EN)</span>
      <span id="status-field">STATUS: READY</span>
    </div>

    <!-- BOTTOM TERMINAL -->
    <div class="console-hud interactive">
      <div id="log-display" class="log-view">>>> Conexión establecida con éxito. Sistema de memoria activado.</div>
      
      <div class="input-group">
        <button id="mute-btn" class="audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe un mensaje..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    /* MOTOR GRÁFICO GLOBAL */
    let scene, camera, renderer, avatarModel, animationMixer;
    let particleVortex, vortexGeometry, particleCount = 1500;
    let clock = new THREE.Clock();
    
    /* ESTADOS DE DIÁLOGO Y VOZ */
    let speakingActive = false;
    let audioOutputEnabled = false;
    let dialogueMemory = [];
    let discoveredFaceMeshes = [];
    let speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    // Precarga e inicialización rápida del bus de voz para evitar demoras/delays
    if (speechEngine.onvoiceschanged !== undefined) {
      speechEngine.onvoiceschanged = () => { speechEngine.getVoices(); };
    }

    /* ==========================================================================
       1. SISTEMA DE MEMORIA Y LOGICA DE IDIOMA
       ========================================================================== */
    function loadLocalMemory() {
      try {
        const stored = localStorage.getItem("luis_ai_memory");
        if (stored) {
          dialogueMemory = JSON.parse(stored);
          const lastInteraction = dialogueMemory[dialogueMemory.length - 1];
          document.getElementById("log-display").innerText = `MEMORIA RECOBRADA:\nLuis: ${lastInteraction.user}\nAI: ${lastInteraction.ai}`;
        }
      } catch (e) { console.warn("No se pudo cargar la memoria local."); }
    }

    function saveToMemory(userText, aiText) {
      dialogueMemory.push({ user: userText, ai: aiText });
      if (dialogueMemory.length > 5) dialogueMemory.shift(); // Mantiene solo los últimos 5 diálogos para ligereza
      localStorage.setItem("luis_ai_memory", JSON.stringify(dialogueMemory));
    }

    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    function autoDetectLanguage(text) {
      const enPatterns = /\b(the|you|is|are|hello|thanks|processing|system|mode)\b/i;
      if (enPatterns.test(text)) {
        document.getElementById("lang-indicator").innerText = "LANG: EN-US";
        return 'en-US';
      }
      document.getElementById("lang-indicator").innerText = "LANG: ES-ES";
      return 'es-ES';
    }

    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");
      const statusField = document.getElementById("status-field");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;
      statusField.innerText = "STATUS: PROCESSING";
      statusField.style.color = "var(--neon-purple)";

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query })
        });

        const data = await res.json();
        const replyText = data.reply || "Error: Respuesta vacía.";

        logDisplay.innerText = `Luis: ${query}\nAI: ${replyText}`;
        logDisplay.scrollTop = logDisplay.scrollHeight;

        saveToMemory(query, replyText);
        const langMode = autoDetectLanguage(replyText);

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = langMode;
          globalUtterance.rate = 1.0; // Velocidad óptima humana
          globalUtterance.pitch = 0.85;

          speakingActive = true;
          statusField.innerText = "STATUS: SPEAKING";
          statusField.style.color = "var(--neon-cyan)";

          globalUtterance.onend = () => { resetControls(inputEl, execBtn, statusField); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn, statusField); };

          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn, statusField);
        }

      } catch (err) {
        logDisplay.innerText = ">>> ERROR DE ENLACE COGNITIVO.";
        resetControls(inputEl, execBtn, statusField);
      }
      inputEl.value = "";
    }

    function resetControls(input, btn, status) {
      input.disabled = false; btn.disabled = false;
      status.innerText = "STATUS: READY"; status.style.color = "var(--neon-cyan)";
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      discoveredFaceMeshes.forEach(mesh => {
        if (mesh.morphTargetInfluences) {
          forceMorph(mesh, 'mouthOpen', 0);
          forceMorph(mesh, 'viseme', 0);
        }
      });
      if(avatarModel) avatarModel.rotation.x = 0; // Resetea cabeceo alternativo
    }

    /* ==========================================================================
       2. MOTOR GRÁFICO THREE.JS - AGUJERÓ NEGRO E INTERFAZ RESPONSIVA
       ========================================================================== */
    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020005);
      scene.fog = new THREE.FogExp2(0x020005, 0.1);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      adjustCameraView();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Iluminación Cósmica
      scene.add(new THREE.AmbientLight(0x110a25, 2.5));
      const purpleLight = new THREE.PointLight(0x9d4edd, 4, 20);
      purpleLight.position.set(2, 2, 2); scene.add(purpleLight);
      const cyanLight = new THREE.PointLight(0x00ffe5, 3, 20);
      cyanLight.position.set(-2, 1, 2); scene.add(cyanLight);

      /* 🌪️ CREACIÓN DEL TORBELLINO / AGUJERÓ NEGRO INTERDIMENSIONAL */
      vortexGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const angleOffsets = [];
      const radii = [];

      for (let i = 0; i < particleCount; i++) {
        const radius = 0.4 + Math.random() * 4.5; // Concentración hacia el centro
        const angle = Math.random() * Math.PI * 2;
        radii.push(radius);
        angleOffsets.push(angle);

        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 0.5; // Espesor del disco
        positions[i * 3 + 2] = Math.sin(angle) * radius;
      }

      vortexGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0x00ffe5, size: 0.035, transparent: true, opacity: 0.75,
        blending: THREE.AdditiveBlending
      });

      particleVortex = new THREE.Points(vortexGeometry, particleMat);
      particleVortex.userData = { angleOffsets: angleOffsets, radii: radii };
      scene.add(particleVortex);

      /* 🤖 CARGA Y ENCUADRE AUTOMÁTICO DE LUIS-AVATAR */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        
        // Posicionamiento de cuerpo entero
        avatarModel.position.set(0, -1.0, 0);
        applyResponsiveModelScale();
        scene.add(avatarModel);

        // Mapeo adaptivo para rastrear morfología de labios
        avatarModel.traverse((child) => {
          if (child.isMesh) {
            if (child.morphTargetDictionary) discoveredFaceMeshes.push(child);
            // Asegura que los materiales brillen bajo las luces del agujero negro
            if (child.material) child.material.roughness = 0.4;
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      loadLocalMemory();
      animate();
    }

    function forceMorph(mesh, term, val) {
      const dict = mesh.morphTargetDictionary;
      for (let name in dict) {
        if (name.toLowerCase().includes(term.toLowerCase())) {
          mesh.morphTargetInfluences[dict[name]] = val;
        }
      }
    }

    /* ENCUADRES ADAPTABLES (MÓVIL VS ESCRITORIO) */
    function adjustCameraView() {
      if (window.innerWidth < 600) {
        camera.position.set(0, 0.2, 3.2); // Más lejos en teléfonos para capturar cuerpo entero
      } else {
        camera.position.set(0, 0.1, 2.2); // Plano estándar en PC
      }
      camera.lookAt(0, -0.1, 0);
    }

    function applyResponsiveModelScale() {
      if (!avatarModel) return;
      if (window.innerWidth < 600) {
        avatarModel.scale.set(0.65, 0.65, 0.65); // Ajuste fino para pantallas verticales
      } else {
        avatarModel.scale.set(0.8, 0.8, 0.8);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      adjustCameraView();
      applyResponsiveModelScale();
    }

    /* ==========================================================================
       3. BUCLE DE ANIMACIÓN DE ALTO RENDIMIENTO
       ========================================================================== */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);

      /* Simulación del Vórtice / Torbellino del Agujero Negro */
      if (particleVortex) {
        const positions = particleVortex.geometry.attributes.position.array;
        const offsets = particleVortex.userData.angleOffsets;
        const radii = particleVortex.userData.radii;

        for (let i = 0; i < particleCount; i++) {
          // Velocidad inversamente proporcional al radio (física de agujeros negros)
          offsets[i] += (0.015 + (0.02 / radii[i])); 
          
          positions[i * 3] = Math.cos(offsets[i]) * radii[i];
          // Añade una distorsión cuántica ondulante vertical en el torbellino
          positions[i * 3 + 1] = Math.sin(timeNow * 0.002 + radii[i]) * 0.15;
          positions[i * 3 + 2] = Math.sin(offsets[i]) * radii[i];
        }
        particleVortex.geometry.attributes.position.needsUpdate = true;
        particleVortex.rotation.y += 0.002; // Rotación lenta del conjunto completo
      }

      /* Animación de Habla Híbrida Inteligente (Cero Temblores) */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          const wave = Math.abs(Math.sin(timeNow * 0.03)) * 0.8;
          
          if (discoveredFaceMeshes.length > 0) {
            // Intentar interactuar con los morph targets nativos de los labios
            discoveredFaceMeshes.forEach(mesh => {
              forceMorph(mesh, 'mouth', wave);
              forceMorph(mesh, 'open', wave);
              forceMorph(mesh, 'viseme', wave);
            });
          } else {
            // MÉTODO DE RESPALDO: Si el modelo no tiene claves de labios instaladas,
            // genera un cabeceo mecánico sutil alternado para que nunca se vea estático.
            avatarModel.rotation.x = Math.sin(timeNow * 0.02) * 0.04;
          }
        } else {
          // Balanceo gravitatorio pasivo mientras flota en el agujero negro
          avatarModel.position.y = -1.0 + Math.sin(timeNow * 0.0015) * 0.04;
          avatarModel.rotation.y = Math.cos(timeNow * 0.001) * 0.03;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
