<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NeuroLab AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #00ffe5;
  font-family: Arial;
  text-align: center;
  overflow-x: hidden;
}

.topbar {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
}

button {
  background: black;
  border: 1px solid #00ffe5;
  color: #00ffe5;
  padding: 10px 14px;
  cursor: pointer;
  box-shadow: 0 0 10px #00ffe5;
}

h1 {
  margin-top: 20px;
  text-shadow: 0 0 10px #00ffe5;
}

input {
  width: 60%;
  padding: 12px;
  margin-top: 10px;
  background: #111;
  border: 1px solid #00ffe5;
  color: #00ffe5;
  outline: none;
}

#response {
  margin-top: 20px;
  min-height: 80px;
  white-space: pre-wrap;
  text-shadow: 0 0 6px #00ffe5;
}

/* AVATAR */
#avatar-container {
  width: 100%;
  height: 360px;
  margin-top: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="location.href='index.html'">⬅ Volver</button>
</div>

<h1>NEUROLAB AI SYSTEM</h1>

<div id="avatar-container"></div>

<input id="input" placeholder="Habla con la IA..." />
<br>
<button onclick="send()">Enviar</button>

<div id="response"></div>

<script>

/* ================= IA ================= */
let isSpeaking = false;

async function send() {
  const text = document.getElementById("input").value;

  const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  const reply = data.reply || "Sin respuesta";

  document.getElementById("response").innerText = reply;

  const speech = new SpeechSynthesisUtterance(reply);
  speech.lang = "es-ES";
  speech.rate = 1;

  isSpeaking = true;
  speech.onend = () => isSpeaking = false;

  window.speechSynthesis.speak(speech);
}

/* ================= THREE.JS ================= */
let scene, camera, renderer, model;

function initAvatar() {

  scene = new THREE.Scene();

  // 🌌 fondo negro limpio
  scene.background = new THREE.Color(0x000000);

  camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);

  // 📌 cámara más lejos (evita cabeza cortada)
  camera.position.set(0, 0.6, 3);

  renderer = new THREE.WebGLRenderer({
    alpha: false,
    antialias: true
  });

  renderer.setSize(360, 360);

  document.getElementById("avatar-container").appendChild(renderer.domElement);

  // 💡 luces correctas
  const ambient = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambient);

  const directional = new THREE.DirectionalLight(0xffffff, 0.6);
  directional.position.set(2, 2, 2);
  scene.add(directional);

  // 🤖 carga modelo
  const loader = new THREE.GLTFLoader();

  loader.load("luis-avatar2.glb", function (gltf) {

    model = gltf.scene;

    // 📏 CORRECCIÓN CRÍTICA DE POSICIÓN
    model.position.set(0, -1.0, 0);

    // 📏 escala correcta (evita “sin cabeza” o gigante)
    model.scale.set(1.5, 1.5, 1.5);

    scene.add(model);
  });

  animate();
}

/* ================= ANIMACIÓN ================= */
function animate() {
  requestAnimationFrame(animate);

  if (model) {

    // 🌬 respiración suave
    const breathe = 1 + Math.sin(Date.now() * 0.0015) * 0.02;
    model.scale.set(breathe, breathe, breathe);

    // 🔄 rotación mínima
    model.rotation.y += 0.003;

    // 🤖 reacción al hablar
    if (isSpeaking) {
      model.rotation.y += 0.01;
    }
  }

  renderer.render(scene, camera);
}

initAvatar();

</script>

</body>
</html>
