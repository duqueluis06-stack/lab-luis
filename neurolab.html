<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NeuroLab AI</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #05070f, #000);
  color: #00ffe5;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}

.topbar {
  position: absolute;
  top: 10px;
  left: 10px;
}

button {
  background: black;
  border: 1px solid #00ffe5;
  color: #00ffe5;
  padding: 10px;
  cursor: pointer;
}

h1 {
  margin-top: 60px;
  text-shadow: 0 0 10px #00ffe5;
}

input {
  width: 60%;
  padding: 12px;
  margin-top: 20px;
  background: #111;
  border: 1px solid #00ffe5;
  color: #00ffe5;
}

#response {
  margin-top: 30px;
  padding: 10px;
  min-height: 100px;
  white-space: pre-wrap;
  text-shadow: 0 0 5px #00ffe5;
}

.glow {
  position: absolute;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, #00ffe5, transparent);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(60px);
  opacity: 0.2;
  z-index: -1;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="topbar">
  <button onclick="location.href='index.html'">⬅ Volver</button>
</div>

<h1>NEUROLAB AI SYSTEM</h1>

<input id="input" placeholder="Habla con la IA..." />
<br>
<button onclick="send()">Enviar</button>

<div id="response"></div>

<script>
async function send() {
  const text = document.getElementById("input").value;

  const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  const reply = data.reply;
  document.getElementById("response").innerText = reply;

  // 🔊 VOZ
  const speech = new SpeechSynthesisUtterance(reply);
  speech.lang = "es-ES";
  speech.rate = 1;
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
