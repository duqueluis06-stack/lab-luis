<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v6.0</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-purple: #9d4edd;
      --neon-red: #ff0055;
      --hud-bg: rgba(4, 2, 8, 0.85);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #020106;
      color: var(--neon-cyan);
      font-family: monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    /* Interfaz HUD Adaptable */
    .interface-wrapper {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 12px; pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    .header-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(157, 78, 221, 0.3);
      padding: 10px 15px; display: flex;
      justify-content: space-between; align-items: center;
      font-size: 11px; box-shadow: 0 0 15px rgba(0,255,229,0.1);
    }

    .main-title {
      color: #fff; font-weight: bold; letter-spacing: 2px;
    }

    /* Consola de Comunicación Inferior */
    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.3);
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }

    .log-view {
      font-size: 12px; max-height: 80px;
      overflow-y: auto; color: #fff;
      line-height: 1.4; padding-left: 6px;
      border-left: 2px solid var(--neon-purple);
    }

    .input-group { display: flex; gap: 8px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 10px; font-family: monospace; font-size: 13px;
      outline: none;
    }

    button {
      background: #000; border: 1px solid var(--neon-purple);
      color: var(--neon-purple); padding: 10px 14px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 11px; transition: all 0.2s;
    }

    button:hover {
      background: var(--neon-purple); color: #000;
      box-shadow: 0 0 10px var(--neon-purple);
    }

    button.exit-btn {
      border-color: var(--neon-red); color: var(--neon-red);
    }
    button.exit-btn:hover {
      background: var(--neon-red); color: #000;
      box-shadow: 0 0 10px var(--neon-red);
    }

    button.audio-btn { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    button.audio-btn.active { background: var(--neon-cyan); color: #000; }

    @media (max-width: 600px) {
      .header-hud { flex-direction: column; gap: 6px; align-items: stretch; text-align: center; }
      .log-view { max-height: 60px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="interface-wrapper">
    <!-- BARRA SUPERIOR CON BOTÓN DE SALIDA -->
    <div class="header-hud interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 DISCONNECT</button>
      <span class="main-title">CORE INTERFACE: LUIS</span>
      <span id="status-field">STATUS: READY</span>
    </div>

    <!-- TERMINAL INFERIOR -->
    <div class="console-hud interactive">
      <div id="log-display" class="log-view">>>> Conexión establecida de forma segura. Torbellino estabilizado en plano de fondo.</div>
      
      <div class="input-group">
        <button id="mute-btn" class="audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe un comando a enviar..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    /* COMPONENTES DEL MOTOR GRÁFICO */
    let scene, camera, renderer, avatarModel, animationMixer;
    let particleVortex, vortexGeometry, particleCount = 1200;
    let clock = new THREE.Clock();
    
    /* CONTROL DE AUDIO Y SINCRO */
    let speakingActive = false;
    let audioOutputEnabled = false;
    let discoveredFaceMeshes = [];
    let speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    if (speechEngine.onvoiceschanged !== undefined) {
      speechEngine.onvoiceschanged = () => { speechEngine.getVoices(); };
    }

    /* CONTROL DE COMUNICACIÓN E IDIOMA */
    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    function autoDetectLanguage(text) {
      const enPatterns = /\b(the|you|is|are|hello|thanks|processing|system|mode)\b/i;
      return enPatterns.test(text) ? 'en-US' : 'es-ES';
    }

    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");
      const statusField = document.getElementById("status-field");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;
      statusField.innerText = "STATUS: COMPUTING";
      statusField.style.color = "var(--neon-purple)";

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query })
        });

        const data = await res.json();
        const replyText = data.reply || "Respuesta del sistema vacía.";

        logDisplay.innerText = `Luis: ${query}\nAI: ${replyText}`;
        logDisplay.scrollTop = logDisplay.scrollHeight;

        const langMode = autoDetectLanguage(replyText);

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = langMode;
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.85;

          speakingActive = true;
          statusField.innerText = "STATUS: SPEAKING";
          statusField.style.color = "var(--neon-cyan)";

          globalUtterance.onend = () => { resetControls(inputEl, execBtn, statusField); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn, statusField); };

          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn, statusField);
        }

      } catch (err) {
        logDisplay.innerText = ">>> ERROR AL CONECTAR CON EL NÚCLEO.";
        resetControls(inputEl, execBtn, statusField);
      }
      inputEl.value = "";
    }

    function resetControls(input, btn, status) {
      input.disabled = false; btn.disabled = false;
      status.innerText = "STATUS: READY"; status.style.color = "var(--neon-cyan)";
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      discoveredFaceMeshes.forEach(mesh => {
        if (mesh.morphTargetInfluences) {
          forceMorph(mesh, 'mouth', 0);
          forceMorph(mesh, 'open', 0);
          forceMorph(mesh, 'viseme', 0);
        }
      });
    }

    /* INITIALIZE MOTOR THREE.JS */
    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x010003);
      scene.fog = new THREE.FogExp2(0x010003, 0.08);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      adjustCameraView();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Esquema de Iluminación
      scene.add(new THREE.AmbientLight(0x0f0b1e, 2.2));
      const purpleLight = new THREE.PointLight(0x9d4edd, 5, 25);
      purpleLight.position.set(2.5, 2, 2); scene.add(purpleLight);
      const cyanLight = new THREE.PointLight(0x00ffe5, 4, 25);
      cyanLight.position.set(-2.5, 1, 2); scene.add(cyanLight);

      /* 🌪️ TORBELLINO INTERDIMENSIONAL (DESPLAZADO AL FONDO) */
      vortexGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const angleOffsets = [];
      const radii = [];

      for (let i = 0; i < particleCount; i++) {
        // Incrementamos el radio interno mínimo (1.5) para que no toquen el centro donde está el avatar
        const radius = 1.5 + Math.random() * 4.5; 
        const angle = Math.random() * Math.PI * 2;
        radii.push(radius);
        angleOffsets.push(angle);

        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
        // Desplazamiento nativo hacia atrás en el plano Z para evitar que manche el rostro
        positions[i * 3 + 2] = (Math.sin(angle) * radius) - 1.8; 
      }

      vortexGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0x00ffe5, size: 0.032, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending
      });

      particleVortex = new THREE.Points(vortexGeometry, particleMat);
      particleVortex.userData = { angleOffsets: angleOffsets, radii: radii };
      scene.add(particleVortex);

      /* 🤖 CARGA Y AJUSTE DE MATERIALES DE LUIS-AVATAR */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        
        // Colocación limpia de cuerpo entero en primer plano (Z = 0)
        avatarModel.position.set(0, -1.0, 0);
        applyResponsiveModelScale();
        scene.add(avatarModel);

        avatarModel.traverse((child) => {
          if (child.isMesh) {
            if (child.morphTargetDictionary) discoveredFaceMeshes.push(child);
            // Optimizamos propiedades para que el sombreado reaccione al contraste interdimensional
            if (child.material) {
              child.material.roughness = 0.5;
              child.material.metalness = 0.2;
            }
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function forceMorph(mesh, term, val) {
      const dict = mesh.morphTargetDictionary;
      for (let name in dict) {
        if (name.toLowerCase().includes(term.toLowerCase())) {
          mesh.morphTargetInfluences[dict[name]] = val;
        }
      }
    }

    function adjustCameraView() {
      if (window.innerWidth < 600) {
        camera.position.set(0, 0.1, 3.2); // Vista alejada para encuadre vertical en teléfonos
      } else {
        camera.position.set(0, 0.0, 2.1); // Vista en escritorio
      }
      camera.lookAt(0, -0.1, 0);
    }

    function applyResponsiveModelScale() {
      if (!avatarModel) return;
      if (window.innerWidth < 600) {
        avatarModel.scale.set(0.68, 0.68, 0.68);
      } else {
        avatarModel.scale.set(0.85, 0.85, 0.85);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      adjustCameraView();
      applyResponsiveModelScale();
    }

    /* BUCLE DE RENDER (ANIMATE) */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);

      /* Dinámica del Torbellino en Segundo Plano */
      if (particleVortex) {
        const positions = particleVortex.geometry.attributes.position.array;
        const offsets = particleVortex.userData.angleOffsets;
        const radii = particleVortex.userData.radii;

        for (let i = 0; i < particleCount; i++) {
          offsets[i] += (0.012 + (0.015 / radii[i])); 
          positions[i * 3] = Math.cos(offsets[i]) * radii[i];
          positions[i * 3 + 1] = Math.sin(timeNow * 0.0018 + radii[i]) * 0.12;
          // Mantiene el desplazamiento hacia atrás fijo
          positions[i * 3 + 2] = (Math.sin(offsets[i]) * radii[i]) - 1.8;
        }
        particleVortex.geometry.attributes.position.needsUpdate = true;
        particleVortex.rotation.z += 0.001;
      }

      /* Gesticulación Facial Pura (Cuerpo Estoniano Fijo) */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled && discoveredFaceMeshes.length > 0) {
          // Genera oscilaciones exclusivas para las mallas que tengan morphs de labios
          const mouthWave = Math.abs(Math.sin(timeNow * 0.032)) * 0.85;
          discoveredFaceMeshes.forEach(mesh => {
            forceMorph(mesh, 'mouth', mouthWave);
            forceMorph(mesh, 'open', mouthWave);
            forceMorph(mesh, 'viseme', mouthWave);
          });
        }
        
        // Micro balanceo pasivo del cuerpo entero simulando ingravidez cuántica (Cero sacudidas)
        if (!speakingActive) {
          avatarModel.position.y = -1.0 + Math.sin(timeNow * 0.0012) * 0.03;
          avatarModel.rotation.y = Math.cos(timeNow * 0.0008) * 0.02;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
