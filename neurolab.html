<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v12.0</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-gold: #ffb703;
      --neon-red: #ff0055;
      --hud-bg: rgba(6, 3, 14, 0.94);
      --matrix-glow: 0 0 10px rgba(0, 255, 229, 0.4);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #010003;
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    .hud-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box; padding: 12px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    .top-matrix-panel {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.3);
      padding: 8px; text-align: center;
      box-shadow: var(--matrix-glow);
      position: relative;
    }
    
    .exit-btn {
      position: absolute; left: 10px; top: 6px;
      background: #000; border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 4px 10px;
      cursor: pointer; font-size: 11px; font-weight: bold;
      font-family: monospace;
    }

    .greek-stream {
      font-size: 12px; color: var(--neon-cyan);
      white-space: nowrap; letter-spacing: 5px;
      text-shadow: 0 0 5px var(--neon-cyan);
    }

    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
      width: 100%; max-width: calc(100% - 24px);
      box-sizing: border-box;
      margin-bottom: env(safe-area-inset-bottom, 2px);
    }

    .log-view {
      font-size: 12px; 
      height: 130px; 
      overflow-y: auto; 
      color: #ffffff;
      line-height: 1.4; padding: 10px;
      background: rgba(0, 0, 0, 0.9);
      border-left: 3px solid var(--neon-gold);
      word-wrap: break-word; 
      white-space: pre-wrap;
    }

    .sumerian-bar {
      font-size: 10px; color: var(--neon-gold);
      opacity: 0.6; text-align: center;
      letter-spacing: 3px;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group { display: flex; gap: 8px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.95);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 12px; font-family: monospace; font-size: 13px;
      outline: none; min-width: 0;
    }
    input:focus { box-shadow: var(--matrix-glow); }

    button.action-btn {
      background: #000; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 12px 16px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 12px; flex-shrink: 0;
    }
    button.action-btn:hover { background: var(--neon-cyan); color: #000; }
    
    button.audio-btn { border-color: var(--neon-gold); color: var(--neon-gold); }
    button.audio-btn.active { background: var(--neon-gold); color: #000; box-shadow: 0 0 8px var(--neon-gold); }

    @media (min-width: 768px) {
      .log-view { height: 160px; font-size: 14px; }
      .greek-stream { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <div class="top-matrix-panel interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 INDEX</button>
      <div class="greek-stream">Ω α β γ Luis_Core_v12.0 // STABLE_PROPORTIONS // LIP_SYNC</div>
    </div>

    <div class="console-hud interactive">
      <div id="log-display" class="log-view">>>> Escala del avatar estabilizada correctamente. Encuadre óptico optimizado para gesticulación natural. listo, Luis.</div>
      
      <div class="sumerian-bar">𓎳 𒀀 𒀁 𒀂 𒀃 𒀄 𒀅 𒀆 檻 𓊰 項目</div>

      <div class="input-group">
        <button id="mute-btn" class="action-btn audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe tu mensaje aquí, Luis..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" class="action-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, avatarModel, animationMixer, navigationControls;
    let starParticles, nebulaMesh, starCount = 1200;
    let clock = new THREE.Clock();
    
    let speakingActive = false;
    let audioOutputEnabled = false;
    let conversationHistory = []; 
    let targetFaceMeshes = []; 

    const speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    if (speechEngine.onvoiceschanged !== undefined) {
      speechEngine.onvoiceschanged = () => { speechEngine.getVoices(); };
    }

    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;
      conversationHistory.push({ role: "user", content: query });
      if (conversationHistory.length > 10) conversationHistory.shift(); 
      renderLogHistory();

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: query, context: conversationHistory })
        });

        const data = await res.json();
        const replyText = data.reply || "Error: Núcleo sin respuesta.";

        conversationHistory.push({ role: "assistant", content: replyText });
        if (conversationHistory.length > 10) conversationHistory.shift();
        renderLogHistory();

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          globalUtterance.lang = 'es-ES';
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.95;

          speakingActive = true;
          globalUtterance.onend = () => { resetControls(inputEl, execBtn); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn); };
          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn);
        }

      } catch (err) {
        logDisplay.innerHTML += "\n<span style='color:var(--neon-red)'>>>> FALLO EN EL ENLACE DE DATOS.</span>";
        resetControls(inputEl, execBtn);
      }
      inputEl.value = "";
    }

    function renderLogHistory() {
      const logDisplay = document.getElementById("log-display");
      let htmlBuffer = "";
      conversationHistory.forEach(msg => {
        if(msg.role === "user") {
          htmlBuffer += `<b style="color:var(--neon-cyan)">Luis:</b> ${msg.content}\n`;
        } else {
          htmlBuffer += `<b style="color:var(--neon-gold)">AI:</b> ${msg.content}\n\n`;
        }
      });
      logDisplay.innerHTML = htmlBuffer;
      logDisplay.scrollTop = logDisplay.scrollHeight; 
    }

    function resetControls(input, btn) {
      input.disabled = false; btn.disabled = false;
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      targetFaceMeshes.forEach(target => {
        if (target.hasMorphs) {
          target.morphKeys.forEach(key => target.mesh.morphTargetInfluences[key] = 0);
        } else if (target.mesh.geometry.attributes.position) {
          target.mesh.geometry.attributes.position.copy(target.originalPositionBuffer);
          target.mesh.geometry.attributes.position.needsUpdate = true;
        }
      });
    }

    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020106);

      /* FONDO ESTELAR MATEMÁTICO */
      const starsGeometry = new THREE.BufferGeometry();
      const starPositions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 20;
        starPositions[i+1] = (Math.random() - 0.5) * 20;
        starPositions[i+2] = (Math.random() - 0.5) * 20;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.02, transparent: true, opacity: 0.85});
      starParticles = new THREE.Points(starsGeometry, starMaterial);
      scene.add(starParticles);

      /* NEBULOSA PROCEDURAL DE FONDO */
      const nebulaGeo = new THREE.PlaneGeometry(14, 14, 2, 2);
      const nebulaMat = new THREE.MeshBasicMaterial({
        color: 0x16082e,
        transparent: true,
        opacity: 0.3,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
      nebulaMesh = new THREE.Mesh(nebulaGeo, nebulaMat);
      nebulaMesh.position.set(0, 0, -5);
      scene.add(nebulaMesh);

      // CONFIGURACIÓN ÓPTICA PROTEGIDA (Aleja la cámara para evitar que el avatar se vea gigante)
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.25, 2.3); // Mayor distancia focal base

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
      navigationControls.enableDamping = true;
      navigationControls.dampingFactor = 0.05;
      navigationControls.maxDistance = 4.5;
      navigationControls.minDistance = 1.0;
      navigationControls.target.set(0, 0.2, 0); // Apunta directamente al pecho/rostro

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const tacticalLight = new THREE.DirectionalLight(0x00ffe5, 1.5);
      tacticalLight.position.set(0, 1, 3);
      scene.add(tacticalLight);

      /* CARGA Y CALIBRACIÓN DE ESCALA RIGUROSA */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        
        // Posicionamiento anatómico en la parte inferior del visor
        avatarModel.position.set(0, -0.65, 0);
        
        // ESCALA CONTROLADA: Valores normalizados para evitar gigantismo en cualquier pantalla
        const currentRatio = window.innerWidth / window.innerHeight;
        let modelScale = 0.65; // Escala óptima estándar para PC
        
        if (currentRatio < 1) { 
          modelScale = 0.52; // Escala protectora compacta para pantallas verticales/móviles
        }
        
        avatarModel.scale.set(modelScale, modelScale, modelScale);
        scene.add(avatarModel);

        /* MAPEO BIOMÉTRICO PARA LIP-SYNC ESTABLE */
        avatarModel.traverse((child) => {
          if (child.isMesh) {
            const name = child.name.toLowerCase();
            
            if (child.morphTargetDictionary) {
              let morphKeysFound = [];
              for (let key in child.morphTargetDictionary) {
                const kLower = key.toLowerCase();
                if (kLower.includes("open") || kLower.includes("mouth") || kLower.includes("lip") || kLower.includes("jaw") || kLower.includes("viseme")) {
                  morphKeysFound.push(child.morphTargetDictionary[key]);
                }
              }
              if (morphKeysFound.length > 0) {
                targetFaceMeshes.push({ mesh: child, hasMorphs: true, morphKeys: morphKeysFound });
                return;
              }
            }

            if (name.includes("head") || name.includes("face") || name.includes("mesh") || name.includes("avatar")) {
              targetFaceMeshes.push({
                mesh: child,
                hasMorphs: false,
                originalPositionBuffer: child.geometry.attributes.position.clone(),
                currentPositionBuffer: child.geometry.attributes.position
              });
            }
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      // Recalibración dinámica de dimensiones en tiempo de ejecución
      if (avatarModel) {
        const currentRatio = window.innerWidth / window.innerHeight;
        const dynamicScale = currentRatio < 1 ? 0.52 : 0.65;
        avatarModel.scale.set(dynamicScale, dynamicScale, dynamicScale);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);
      if (navigationControls) navigationControls.update();

      if (starParticles) starParticles.rotation.y += 0.0002;
      if (nebulaMesh) nebulaMesh.rotation.z = Math.sin(timeNow * 0.00008) * 0.05;

      /* GESTICULACIÓN Y MODULACIÓN LABIAL FILTRADA */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          // Onda fluida senoidal amortiguada para evitar el temblor de la cabeza y centrarse en la boca
          const SpeechPulse = Math.abs(Math.sin(timeNow * 0.032) * 0.7 + Math.cos(timeNow * 0.012) * 0.3);

          targetFaceMeshes.forEach(target => {
            if (target.hasMorphs) {
              target.morphKeys.forEach(key => {
                target.mesh.morphTargetInfluences[key] = SpeechPulse * 0.8;
              });
            } 
            else if (target.mesh.geometry.attributes.position) {
              const posAttr = target.currentPositionBuffer;
              const origAttr = target.originalPositionBuffer;
              
              // Localizador geométrico estricto basado en la escala normalizada del entorno
              for (let i = 0; i < posAttr.count; i++) {
                const origY = origAttr.getY(i);
                const origZ = origAttr.getZ(i);

                // Afecta exclusivamente a los vértices de la boca sin generar vibraciones parasitarias en el cráneo
                if (origY > 0.2 && origY < 0.55 && origZ > 0.06) {
                  posAttr.setY(i, origY - (SpeechPulse * 0.025));
                }
              }
              posAttr.needsUpdate = true;
            }
          });
        } else {
          // Balanceo inercial orgánico suave
          avatarModel.position.y = -0.65 + Math.sin(timeNow * 0.001) * 0.008;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
