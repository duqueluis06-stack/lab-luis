<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NeuroLab AI - T-800 Interface</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
body {
  margin: 0;
  background: #050508;
  color: #00ffe5;
  font-family: 'Courier New', Courier, monospace;
  overflow: hidden;
  user-select: none;
}

/* Capa de interfaz de usuario de ciencia ficción (HUD) */
.hud-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
  padding: 20px;
  pointer-events: none;
}

.interactive {
  pointer-events: auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px dashed #ff0055;
  padding-bottom: 10px;
  background: rgba(0, 0, 0, 0.6);
}

h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 3px;
  text-shadow: 0 0 15px #ff0055;
  color: #ff0055;
}

.system-status {
  font-size: 12px;
  color: #00ffe5;
  text-shadow: 0 0 5px #00ffe5;
}

/* Contenedor central del Avatar */
#avatar-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Panel Inferior de Control */
.bottom-panel {
  background: rgba(5, 5, 10, 0.85);
  border: 1px solid #00ffe5;
  box-shadow: 0 0 20px rgba(0, 255, 229, 0.2);
  padding: 20px;
  border-radius: 6px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}

.controls-grid {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}

button {
  background: rgba(0, 0, 0, 0.8);
  border: 1px solid #00ffe5;
  color: #00ffe5;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Courier New', Courier, monospace;
  font-weight: bold;
  transition: all 0.3s ease;
  text-transform: uppercase;
}

button:hover {
  background: #00ffe5;
  color: #000;
  box-shadow: 0 0 15px #00ffe5;
}

button.danger {
  border-color: #ff0055;
  color: #ff0055;
}

button.danger:hover {
  background: #ff0055;
  color: #000;
  box-shadow: 0 0 15px #ff0055;
}

.input-group {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  background: rgba(0, 0, 0, 0.8);
  border: 1px solid #ff0055;
  color: #fff;
  font-family: 'Courier New', Courier, monospace;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #00ffe5;
  box-shadow: 0 0 10px rgba(0, 255, 229, 0.5);
}

#response {
  margin-top: 15px;
  font-size: 14px;
  min-height: 40px;
  max-height: 80px;
  overflow-y: auto;
  text-align: left;
  border-left: 3px solid #00ffe5;
  padding-left: 10px;
  color: #ffffff;
  text-shadow: 0 0 5px rgba(0, 255, 229, 0.5);
}

.scanlines {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  background-size: 100% 4px, 6px 100%;
  z-index: 20;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="scanlines"></div>
<div id="avatar-container"></div>

<div class="hud-container">
  
  <div class="topbar interactive">
    <button onclick="location.href='index.html'" class="danger">🗙 TERMINAR CONEXIÓN</button>
    <h1>NEUROLAB T-800 SYSTEM v4.26</h1>
    <div class="system-status" id="status-text">ESTADO: OPERATIVO // NÚCLEO ESTABLE</div>
  </div>

  <div class="bottom-panel interactive">
    
    <div class="controls-grid">
      <button onclick="changePose('defecto')">Vista Estándar</button>
      <button onclick="changePose('analisis')">Escanear Rostro</button>
      <button onclick="changePose('combate')">Modo Alerta</button>
      <button onclick="changePose('orbita')">Cámara Libre</button>
    </div>

    <div class="input-group">
      <input id="input" placeholder="SYS_REQ: Escribe un comando o pregunta al T-800..." onkeydown="if(event.key === 'Enter') send()"/>
      <button onclick="send()">EJECUTAR</button>
    </div>

    <div id="response">>>> Esperando transmisión de datos...</div>
  </div>

</div>

<script>

/* ================= VARIABLES GLOBALES ================= */
let scene, camera, renderer, model, mixer;
let clock = new THREE.Clock(); // Necesario para calcular el tiempo de las animaciones del GLB
let stars, starGeo, starCount = 1200; 
let lightningLight; 
let isSpeaking = false;
let currentPose = 'defecto';

const synth = window.speechSynthesis;
let speechUtterance = null;

/* ================= ASYNCHRONOUS DATA BUS (IA) ================= */
async function send() {
  const inputEl = document.getElementById("input");
  const text = inputEl.value.trim();
  if(!text) return;

  const responseEl = document.getElementById("response");
  const statusEl = document.getElementById("status-text");
  
  responseEl.innerHTML = ">>> PROCESANDO ENTRADA EN NÚCLEO INTEGRADO...";
  statusEl.innerText = "ESTADO: GENERANDO RESPUESTA COGNITIVA";
  statusEl.style.color = "#ff0055";
  
  inputEl.value = "";

  try {
    const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    const reply = data.reply || "ERROR: Sin respuesta del servidor remoto.";

    responseEl.innerText = `T-800: ${reply}`;
    
    if(synth.speaking) {
      synth.cancel();
    }

    speechUtterance = new SpeechSynthesisUtterance(reply);
    speechUtterance.lang = "es-ES";
    speechUtterance.rate = 0.95; 
    speechUtterance.pitch = 0.7; 

    isSpeaking = true;
    statusEl.innerText = "ESTADO: TRANSMITIENDO AUDIO // PROCESANDO LABIOS";
    statusEl.style.color = "#00ffe5";

    speechUtterance.onend = () => {
      isSpeaking = false;
      statusEl.innerText = "ESTADO: OPERATIVO // NÚCLEO ESTABLE";
    };

    speechUtterance.onerror = () => {
      isSpeaking = false;
      statusEl.innerText = "ESTADO: OPERATIVO // NÚCLEO ESTABLE";
    };

    synth.speak(speechUtterance);

  } catch (error) {
    responseEl.innerText = ">>> CONFIG_ERROR: Fallo de enlace con la Red de Datos.";
    statusEl.innerText = "ESTADO: CRÍTICO // ERROR DE RED";
    isSpeaking = false;
  }
}

/* ================= SISTEMA 3D (THREE.JS) ================= */
function init() {
  const container = document.getElementById("avatar-container");
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020205);
  scene.fog = new THREE.FogExp2(0x020205, 0.15);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  setCameraPose('defecto');

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0x0f2027, 1.8);
  scene.add(ambientLight);

  const cyanLight = new THREE.PointLight(0x00ffe5, 2, 50);
  cyanLight.position.set(-3, 2, 3);
  scene.add(cyanLight);

  const redLight = new THREE.PointLight(0xff0055, 3, 50);
  redLight.position.set(3, 1, 2);
  scene.add(redLight);

  lightningLight = new THREE.DirectionalLight(0xffffff, 0);
  lightningLight.position.set(-1, 5, -2);
  scene.add(lightningLight);

  /* 🌌 FONDO DE PARTÍCULAS */
  starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  const starVelocity = [];

  for (let i = 0; i < starCount; i++) {
    starPositions[i * 3] = (Math.random() - 0.5) * 15;
    starPositions[i * 3 + 1] = (Math.random() - 0.5) * 15;
    starPositions[i * 3 + 2] = Math.random() * -40; 
    starVelocity.push(0.2 + Math.random() * 0.4);
  }

  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  
  const pMaterial = new THREE.PointsMaterial({
    color: 0x00ffe5,
    size: 0.06,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });

  stars = new THREE.Points(starGeo, pMaterial);
  stars.userData = { velocities: starVelocity };
  scene.add(stars);

  /* 🤖 CARGA DEL AVATAR GLTF CON CORRECCIÓN DE ESCALA Y ANIMACIONES */
  const loader = new THREE.GLTFLoader();
  loader.load("luis-avatar2.glb", function (gltf) {
    model = gltf.scene;
    
    // ⬇️ REDUCCIÓN DE ESCALA CRÍTICA (Evita que se vea gigante)
    model.position.set(0, -0.65, 0); 
    model.scale.set(0.6, 0.6, 0.6); 
    
    scene.add(model);

    // 🏃‍♂️ CONTROLADOR DE ANIMACIONES NATIVAS DEL ARCHIVO GLB (Quita los brazos abiertos)
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      // Ejecuta la primera animación que encuentre (suele ser el Idle/Reposo)
      const action = mixer.clipAction(gltf.animations[0]);
      action.play();
    }
  }, undefined, function(err) {
    console.error("No se pudo ubicar el archivo 'luis-avatar2.glb'");
  });

  window.addEventListener('resize', onWindowResize);
  animate();
}

/* ================= INTERACTIVOS: POSTURAS Y CÁMARA ================= */
function changePose(pose) {
  currentPose = pose;
  setCameraPose(pose);
}

function setCameraPose(pose) {
  if(!camera) return;
  
  // Ajuste de encuadre según la nueva escala reducida
  if (pose === 'defecto') {
    camera.position.set(0, 0.2, 1.4);
    camera.lookAt(0, 0.1, 0);
  } else if (pose === 'analisis') {
    camera.position.set(0, 0.25, 0.7); 
    camera.lookAt(0, 0.2, 0);
  } else if (pose === 'combate') {
    camera.position.set(-0.4, 0.1, 1.2); 
    camera.lookAt(0, 0.15, 0);
  } else if (pose === 'orbita') {
    camera.position.set(1.0, 0.4, 1.5); 
    camera.lookAt(0, 0.0, 0);
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ================= LOOP DE ANIMACIÓN ================= */
function animate() {
  requestAnimationFrame(animate);
  const time = Date.now();
  const delta = clock.getDelta(); // Obtiene el tiempo transcurrido para los fotogramas de animación

  // Actualizar los movimientos del esqueleto del GLB
  if (mixer) mixer.update(delta);

  /* 🌌 1. Partículas del espacio */
  const positions = stars.geometry.attributes.position.array;
  const vels = stars.userData.velocities;

  for (let i = 0; i < starCount; i++) {
    positions[i * 3 + 2] += vels[i];
    if (positions[i * 3 + 2] > 5) {
      positions[i * 3 + 2] = -40;
      positions[i * 3] = (Math.random() - 0.5) * 15;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 15;
    }
  }
  stars.geometry.attributes.position.needsUpdate = true;

  /* ⚡ 2. Relámpagos intermitentes */
  if (Math.random() > 0.97) {
    lightningLight.intensity = 2.5 + Math.random() * 2;
    if(stars) stars.material.color.setHex(0xffffff);
  } else {
    lightningLight.intensity *= 0.8;
    if(stars && Math.random() > 0.8) stars.material.color.setHex(0x00ffe5);
  }

  /* 🤖 3. Deformación de gesticulación del chasis */
  if (model) {
    const breathe = 1 + Math.sin(time * 0.0015) * 0.01;
    
    if (isSpeaking) {
      const lipSyncY = breathe * (1 + Math.sin(time * 0.035) * 0.03);
      const lipSyncZ = breathe * (1 + Math.cos(time * 0.028) * 0.02);
      
      // Aplicamos la deformación sobre la nueva escala controlada (0.6)
      model.scale.set(0.6 * breathe, 0.6 * lipSyncY, 0.6 * lipSyncZ);
      model.rotation.x = Math.sin(time * 0.05) * 0.01;
    } else {
      model.scale.set(0.6, 0.6 * breathe, 0.6);
      model.rotation.x = 0;
      
      if (currentPose === 'orbita') {
        model.rotation.y = time * 0.0004;
      } else if (currentPose === 'combate') {
        model.rotation.y = -0.2 + Math.sin(time * 0.001) * 0.03;
      } else {
        model.rotation.y = Math.sin(time * 0.0008) * 0.04;
      }
    }
  }

  renderer.render(scene, camera);
}

window.onload = () => {
  init();
};

</script>

</body>
</html>
