<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroLab AI - Luis Core v7.0</title>

  <!-- Tres librerías críticas: Three.js, GLTFLoader y OrbitControls para el ratón -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --neon-cyan: #00ffe5;
      --neon-gold: #ffb703;
      --neon-red: #ff0055;
      --hud-bg: rgba(6, 4, 12, 0.9);
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #030207;
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
    }

    /* CAPA DEL HUD DE DECORACIÓN HISTÓRICA / CIENTÍFICA */
    .hud-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box; padding: 15px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    /* Barra Superior: Panel Alfanumérico y Griego Flotante */
    .top-matrix-panel {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 255, 229, 0.25);
      padding: 10px; text-align: center;
      position: relative; overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 229, 0.1);
    }
    
    .exit-btn {
      position: absolute; left: 10px; top: 8px;
      background: #000; border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 5px 12px;
      cursor: pointer; font-size: 11px; font-weight: bold;
    }
    .exit-btn:hover { background: var(--neon-red); color: #000; }

    .greek-stream {
      font-size: 14px; color: var(--neon-cyan);
      white-space: nowrap; letter-spacing: 6px;
      display: inline-block; animation: streamMove 25s linear infinite;
    }

    /* Decoraciones Laterales: Jeroglíficos */
    .side-hieroglyphs {
      position: absolute; top: 120px;
      display: flex; flex-direction: column; gap: 15px;
      font-size: 22px; color: rgba(255, 183, 3, 0.4);
      text-shadow: 0 0 8px rgba(255, 183, 3, 0.2);
    }
    .left-glyphs { left: 20px; }
    .right-glyphs { right: 20px; }

    /* Contenedor de la Terminal Inferior Expandida */
    .console-hud {
      background: var(--hud-bg);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 15px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 0 20px rgba(255, 183, 3, 0.05);
    }

    /* Caja de texto inteligente para que la información larga NO se pierda */
    .log-view {
      font-size: 13px; max-height: 160px; min-height: 90px;
      overflow-y: auto; color: #ffffff;
      line-height: 1.5; padding: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-left: 3px solid var(--neon-gold);
      word-wrap: break-word; white-space: pre-wrap;
    }

    /* Base Sumeria Cuneiforme decorativa justo debajo del texto */
    .sumerian-bar {
      font-size: 12px; color: var(--neon-gold);
      opacity: 0.6; letter-spacing: 4px; text-align: center;
      border-top: 1px dashed rgba(255, 183, 3, 0.3);
      padding-top: 5px; margin-top: 2px;
    }

    .input-group { display: flex; gap: 10px; }

    input {
      flex: 1; background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--neon-cyan); color: #fff;
      padding: 12px; font-family: monospace; font-size: 14px;
      outline: none;
    }

    button.action-btn {
      background: #000; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); padding: 12px 20px;
      font-family: monospace; cursor: pointer; font-weight: bold;
      font-size: 12px; transition: all 0.2s;
    }
    button.action-btn:hover { background: var(--neon-cyan); color: #000; }
    
    button.audio-btn { border-color: var(--neon-gold); color: var(--neon-gold); }
    button.audio-btn.active { background: var(--neon-gold); color: #000; }

    @keyframes streamMove {
      0% { transform: translateX(30%); }
      100% { transform: translateX(-30%); }
    }

    @media (max-width: 600px) {
      .side-hieroglyphs { display: none; } /* Ocultar jeroglíficos en móvil para no saturar */
      .log-view { max-height: 110px; font-size: 11px; }
      .greek-stream { font-size: 11px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <!-- PANEL SUPERIOR: LETRAS ALFANUMÉRICAS Y GRIEGAS -->
    <div class="top-matrix-panel interactive">
      <button class="exit-btn" onclick="location.href='index.html'">🗙 INDEX</button>
      <div class="greek-stream">
        Ψ Ω α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ Luis_Core_v7.0 // 010110029 AΞ98-Γ717 ΔΘX88
      </div>
    </div>

    <!-- SIMBOLOGÍA JEROGLÍFICA LATERAL -->
    <div class="side-hieroglyphs left-glyphs">
      <div>𓀀</div><div>𓁐</div><div>𓃠</div><div>𓅃</div><div>𓆗</div><div>𓉔</div>
    </div>
    <div class="side-hieroglyphs right-glyphs">
      <div>𓊝</div><div>𓋹</div><div>𓌔</div><div>𓎵</div><div>𓏃</div><div>𓐍</div>
    </div>

    <!-- TERMINAL DE COMUNICACIÓN INFERIOR -->
    <div class="console-hud interactive">
      <!-- Visor de Log con Scroll para textos masivos -->
      <div id="log-display" class="log-view">>>> Enlace activo. Usa el ratón sobre la pantalla central para rotar, hacer zoom o desplazar la perspectiva visual de Luis.</div>
      
      <!-- Escritura Sumeria Cuneiforme Base -->
      <div class="sumerian-bar">
         Hanging_Garden_Core: 項目 𓎳 𒀀 𒀁 𒀂 𒀃 𒀄 𒀅 𒀆 檻 𓊰 項目
      </div>

      <div class="input-group">
        <button id="mute-btn" class="action-btn audio-btn" onclick="toggleAudioMaster()">🔇 MUTE</button>
        <input id="query-input" placeholder="Escribe tu consulta al sistema..." onkeydown="if(event.key === 'Enter' && !this.disabled) executeQuery()"/>
        <button id="exec-btn" class="action-btn" onclick="executeQuery()">ENVIAR</button>
      </div>
    </div>
  </div>

  <script>
    /* COMPONENTES DEL MOTOR GRÁFICO */
    let scene, camera, renderer, avatarModel, animationMixer, navigationControls;
    let clock = new THREE.Clock();
    
    /* CONTROL DE FLUJO, HISTORIAL Y SINCRO */
    let speakingActive = false;
    let audioOutputEnabled = false;
    let discoveredFaceMeshes = [];
    let jawBoneInstance = null; // Instancia directa para mover la mandíbula de respaldo
    let conversationContext = []; // Historial de memoria local interna para dar continuidad mínima
    
    const speechEngine = window.speechSynthesis;
    let globalUtterance = null;

    function toggleAudioMaster() {
      audioOutputEnabled = !audioOutputEnabled;
      const btn = document.getElementById("mute-btn");
      if (audioOutputEnabled) {
        btn.innerText = "🔊 AUDIO"; btn.classList.add("active");
      } else {
        btn.innerText = "🔇 MUTE"; btn.classList.remove("active");
        if (speechEngine.speaking) speechEngine.cancel();
        stopSpeechMouthCycle();
      }
    }

    /* CONTROLADORES DE HISTORIAL CONTINUO */
    async function executeQuery() {
      const inputEl = document.getElementById("query-input");
      const execBtn = document.getElementById("exec-btn");
      const logDisplay = document.getElementById("log-display");

      const query = inputEl.value.trim();
      if (!query) return;

      inputEl.disabled = true; execBtn.disabled = true;

      // Almacenamos los últimos diálogos para enviárselos al Worker y lograr continuidad
      conversationContext.push({ role: "user", content: query });
      if (conversationContext.length > 6) conversationContext.shift(); // Evitamos desbordes de memoria

      try {
        const res = await fetch("https://little-salad-1611.duqueluis06.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // Enviamos el historial completo para que el bot entienda el contexto de la conversación previa
          body: JSON.stringify({ message: query, context: conversationContext })
        });

        const data = await res.json();
        const replyText = data.reply || "Sin respuesta del núcleo.";

        conversationContext.push({ role: "assistant", content: replyText });

        // Pintamos el texto sin riesgo de que se corte (Scroll automático al fondo)
        logDisplay.innerText = `Luis: ${query}\n\nAI: ${replyText}`;
        logDisplay.scrollTop = logDisplay.scrollHeight;

        if (speechEngine.speaking) speechEngine.cancel();

        if (audioOutputEnabled) {
          globalUtterance = new SpeechSynthesisUtterance(replyText);
          // Forzado estricto de idioma dependiendo de la entrada
          globalUtterance.lang = /\b(the|you|is|hello)\b/i.test(replyText) ? 'en-US' : 'es-ES';
          globalUtterance.rate = 1.0;
          globalUtterance.pitch = 0.9;

          speakingActive = true;

          globalUtterance.onend = () => { resetControls(inputEl, execBtn); };
          globalUtterance.onerror = () => { resetControls(inputEl, execBtn); };

          speechEngine.speak(globalUtterance);
        } else {
          resetControls(inputEl, execBtn);
        }

      } catch (err) {
        logDisplay.innerText = ">>> ERROR AL RECOPILAR LOS DATOS CONTINUOS.";
        resetControls(inputEl, execBtn);
      }
      inputEl.value = "";
    }

    function resetControls(input, btn) {
      input.disabled = false; btn.disabled = false;
      stopSpeechMouthCycle();
    }

    function stopSpeechMouthCycle() {
      speakingActive = false;
      // Reseteo absoluto de morfologías
      discoveredFaceMeshes.forEach(mesh => {
        if (mesh.morphTargetInfluences) {
          forceMorph(mesh, 'mouth', 0);
          forceMorph(mesh, 'open', 0);
          forceMorph(mesh, 'jaw', 0);
        }
      });
      if (jawBoneInstance) jawBoneInstance.rotation.x = 0; // Cierre de hueso mandibular
    }

    /* INICIALIZACIÓN DEL ENTORNO DE GRÁFICOS 3D */
    function initEngine() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020106);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.2, 2.2); // Cámara equilibrada en altura del rostro

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Activación del ratón (OrbitControls) - Permite rotar, mover y hacer zoom
      navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
      navigationControls.enableDamping = true;
      navigationControls.dampingFactor = 0.05;
      navigationControls.maxDistance = 6;
      navigationControls.minDistance = 0.8;
      navigationControls.target.set(0, 0, 0);

      // Luces cinemáticas estables
      scene.add(new THREE.AmbientLight(0x111125, 2.5));
      const goldLight = new THREE.PointLight(0xffb703, 3.5, 20);
      goldLight.position.set(3, 2, 2); scene.add(goldLight);
      const cyanLight = new THREE.PointLight(0x00ffe5, 3.5, 20);
      cyanLight.position.set(-3, 1, 2); scene.add(cyanLight);

      /* CARGA DEL AVATAR CON MAPEO AVANZADO DE MANDÍBULA */
      const loader = new THREE.GLTFLoader();
      loader.load("luis-avatar2.glb", (gltf) => {
        avatarModel = gltf.scene;
        
        // Centrar y ajustar el tamaño del avatar dinámicamente
        avatarModel.position.set(0, -0.9, 0);
        if (window.innerWidth < 600) {
          avatarModel.scale.set(0.7, 0.7, 0.7);
        } else {
          avatarModel.scale.set(0.85, 0.85, 0.85);
        }
        scene.add(avatarModel);

        // Escaneo profundo de la estructura del modelo
        avatarModel.traverse((child) => {
          if (child.isMesh && child.morphTargetDictionary) {
            discoveredFaceMeshes.push(child);
          }
          // Si el avatar tiene esqueleto articulado (Huesos), buscamos el de la mandíbula
          if (child.isBone && (child.name.toLowerCase().includes('jaw') || child.name.toLowerCase().includes('mouth'))) {
            jawBoneInstance = child;
          }
        });

        if (gltf.animations && gltf.animations.length > 0) {
          animationMixer = new THREE.AnimationMixer(avatarModel);
          animationMixer.clipAction(gltf.animations[0]).play();
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function forceMorph(mesh, term, val) {
      const dict = mesh.morphTargetDictionary;
      for (let name in dict) {
        if (name.toLowerCase().includes(term.toLowerCase())) {
          mesh.morphTargetInfluences[dict[name]] = val;
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* BUCLE PRINCIPAL DE ANIMACIÓN */
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const timeNow = Date.now();

      if (animationMixer) animationMixer.update(delta);
      if (navigationControls) navigationControls.update(); // Mantiene fluido el control del ratón

      /* ARTICULACIÓN DETALLADA DE LABIOS (CERO TEMBLORES) */
      if (avatarModel) {
        if (speakingActive && audioOutputEnabled) {
          // Genera un movimiento oscilatorio orgánico exclusivo de boca
          const mouthWave = Math.abs(Math.sin(timeNow * 0.035)) * 0.9;
          
          if (discoveredFaceMeshes.length > 0) {
            // Caso 1: Si tiene claves de forma facial, altera solo mallas internas de boca
            discoveredFaceMeshes.forEach(mesh => {
              forceMorph(mesh, 'mouth', mouthWave);
              forceMorph(mesh, 'open', mouthWave);
              forceMorph(mesh, 'jaw', mouthWave);
            });
          } 
          
          if (jawBoneInstance) {
            // Caso 2: Forzado anatómico sobre el hueso maxilar inferior (Garantiza apertura física)
            jawBoneInstance.rotation.x = mouthWave * 0.15;
          }
        } else {
          // Inactividad: Micro movimientos gravitatorios lentos y fluidos en el espacio
          avatarModel.position.y = -0.9 + Math.sin(timeNow * 0.001) * 0.02;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = initEngine;
  </script>
</body>
</html>
