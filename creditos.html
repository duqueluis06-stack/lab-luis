<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, follow">

<title>Créditos & Atribuciones</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #0ff;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 0;
    box-sizing: border-box;
  }

  .box {
    width: 90%;
    max-width: 650px;
    padding: 20px;
    border: 1px solid #0ff;
    background: rgba(0,0,0,0.7);
    text-align: center;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
  }

  a {
    color: #0ff;
    text-decoration: none;
  }
  
  a:hover {
    text-shadow: 0 0 5px #0ff;
  }

  .btn {
    margin-top: 25px;
    padding: 10px;
    border: 1px solid #0ff;
    cursor: pointer;
    background: transparent;
    color: #0ff;
    width: 100%;
    max-width: 280px;
    font-weight: bold;
    text-transform: uppercase;
    font-family: monospace;
  }

  .btn:hover {
    background: #0ff;
    color: #000;
    box-shadow: 0 0 10px #0ff;
  }

  .asset {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(0, 245, 255, 0.2);
  }

  .license {
    font-size: 11px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div class="box">

  <h2>Créditos & Atribuciones</h2>

  <!-- 🌌 GRUPO: BLACK HOLE -->
  <div class="credito-item" data-scene="blackhole">
    <p><strong>Black Hole 3D Model</strong></p>
    <p>
      Autor: rubykamen | Plataforma: Sketchfab<br>
      <span class="license">Licencia: <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a></span>
    </p>
    <p>
      <a href="https://sketchfab.com/3d-models/blackhole-74cbeaeae2174a218fe9455d77902b5c" target="_blank">
        [ Abrir modelo original ]
      </a>
    </p>
    <p style="font-size: 11px; opacity: 0.6;">Uso mediante embed externo.</p>
  </div>

  <!-- BOTÓN ÚNICO -->
  <button class="btn" id="btn-back">⬅ Volver a Experimentos</button>

</div>

<script>
  const botonVolver = document.getElementById('btn-back');

  botonVolver.onclick = () => {
    if (document.referrer.includes('experimentos.html')) {
      window.location.href = 'experimentos.html';
    } else {
      history.back();
    }
  };
</script>

</body>
</html>
