<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lab Luis - Gemini Avatar</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>

body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.header-container{
    width:100%;
    max-width:500px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    color:#ff00ff;
    text-shadow:0 0 10px #ff00ff;
    margin:0;
}

.btn-salir{
    color:#ff4444;
    text-decoration:none;
    border:2px solid #ff4444;
    padding:8px 15px;
    border-radius:8px;
}

#contenedor-avatar{
    width:100%;
    max-width:500px;
    height:450px;
    border-radius:15px;
    overflow:hidden;
    border:3px solid #ff00ff;
    background:radial-gradient(circle,#220022 0%,#000000 100%);
    box-shadow:0 0 20px rgba(255,0,255,0.3);
}

model-viewer{
    width:100%;
    height:100%;
    background:transparent;
}

#interaccion{
    width:100%;
    max-width:500px;
    margin-top:20px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:2px solid #00ffff;
    background:#111;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

.botones{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#btn-preguntar{
    background:#ff00ff;
    color:white;
}

#btn-bailar{
    background:#00ffff;
    color:black;
}

#respuesta{
    margin-top:15px;
    background:#111;
    padding:15px;
    border-left:4px solid #ff00ff;
    border-radius:5px;
    min-height:50px;
    line-height:1.5;
}

</style>
</head>

<body>

<div class="header-container">
    <h1>Lab Luis IA</h1>
    <a href="index.html" class="btn-salir">🏠 Salir</a>
</div>

<div id="contenedor-avatar">

<model-viewer
id="avatar"
src="luis-avatar2.glb"
autoplay
camera-controls
shadow-intensity="1"
environment-image="neutral"
interaction-prompt="none">
</model-viewer>

</div>

<div id="interaccion">

<input
type="text"
id="pregunta"
placeholder="Haz una pregunta a Gemini...">

<div class="botones">

<button id="btn-preguntar">
Preguntar
</button>

<button id="btn-bailar">
🕺 Bailar
</button>

</div>

<div id="respuesta">
Esperando pregunta...
</div>

</div>

<script>

const avatar = document.getElementById("avatar");
const respuesta = document.getElementById("respuesta");
const preguntaInput = document.getElementById("pregunta");
const btnPreguntar = document.getElementById("btn-preguntar");
const btnBailar = document.getElementById("btn-bailar");
const contenedor = document.getElementById("contenedor-avatar");


// =======================
// PREGUNTAR A GEMINI
// =======================

btnPreguntar.addEventListener("click", enviarPregunta);

async function enviarPregunta(){

    const pregunta = preguntaInput.value.trim();

    if(!pregunta){
        respuesta.innerHTML = "⚠️ Escribe una pregunta.";
        return;
    }

    respuesta.innerHTML = "🧠 Pensando...";

    console.log("Enviando pregunta...");

    try{

        const response = await fetch("/api/api-gemini",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                contents:[
                    {
                        parts:[
                            {
                                text:pregunta
                            }
                        ]
                    }
                ]
            })

        });

        console.log("STATUS:",response.status);

        if(!response.ok){

            throw new Error(
                "Error servidor: " + response.status
            );
        }

        const data = await response.json();

        console.log(data);

        let texto = "No hubo respuesta.";

        if(
            data.candidates &&
            data.candidates[0] &&
            data.candidates[0].content &&
            data.candidates[0].content.parts &&
            data.candidates[0].content.parts[0]
        ){

            texto =
            data.candidates[0]
            .content.parts[0].text;
        }

        respuesta.innerHTML = texto;

        hablar(texto);

    }catch(error){

        console.error(error);

        respuesta.innerHTML = `
        ❌ Error de conexión con Gemini.<br><br>
        Verifica:<br>
        ✅ API Key en Vercel<br>
        ✅ Redeploy realizado<br>
        ✅ Archivo /api/api-gemini.js existente
        `;
    }
}



// =======================
// VOZ
// =======================

function hablar(texto){

    if(!window.speechSynthesis) return;

    window.speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(texto);

    speech.lang = "es-ES";

    speech.rate = 1;

    window.speechSynthesis.speak(speech);
}



// =======================
// BAILE
// =======================

btnBailar.addEventListener("click", activarBaile);

function activarBaile(){

    window.speechSynthesis.cancel();

    respuesta.innerHTML =
    "🕺 Avatar 3 activado.";

    contenedor.style.background =
    "radial-gradient(circle,#002222 0%,#000000 100%)";

    // FORZAR RECARGA
    avatar.src =
    "luis-avatar3.glb?v=" + Date.now();

    setTimeout(()=>{

        respuesta.innerHTML =
        "🔬 Regresando al laboratorio.";

        contenedor.style.background =
        "radial-gradient(circle,#220022 0%,#000000 100%)";

        avatar.src =
        "luis-avatar2.glb?v=" + Date.now();

    },12000);
}

</script>

</body>
</html>
