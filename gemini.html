<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio IA - Avatar Gemini</title>
    <!-- Visor 3D estándar de Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Encabezado y barra superior */
        .header-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin: 0;
            font-size: 24px;
        }
        
        /* Botón Salir */
        .btn-salir {
            background-color: transparent;
            color: #ff3333;
            border: 2px solid #ff3333;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }
        .btn-salir:hover {
            background-color: #ff3333;
            color: white;
            box-shadow: 0 0 15px #ff3333;
        }

        /* Contenedor del Avatar 3D */
        #contenedor-avatar {
            width: 100%;
            max-width: 500px;
            height: 450px;
            background: radial-gradient(circle, #220022 0%, #000000 100%);
            border: 3px solid #ff00ff;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }

        /* Zona de interacción */
        #interaccion {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #00ffcc;
            background-color: #111;
            color: white;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
        }
        .botones-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        #btn-preguntar {
            background-color: #ff00ff;
            color: white;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.4);
        }
        #btn-bailar {
            background-color: #00ffff;
            color: black;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
        }
        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        #respuesta-texto {
            margin-top: 15px;
            padding: 15px;
            background-color: #111;
            border-left: 4px solid #ff00ff;
            border-radius: 4px;
            min-height: 40px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Lab Luis - IA</h1>
        <a href="index.html" class="btn-salir">🏠 Salir</a>
    </div>

    <div id="contenedor-avatar">
        <!-- Forzamos que cargue las animaciones desde el principio -->
        <model-viewer id="avatar-view" 
            src="luis-avatar2.glb" 
            autoplay 
            camera-controls 
            interaction-prompt="none"
            shadow-intensity="1" 
            environment-image="neutral">
        </model-viewer>
    </div>

    <div id="interaccion">
        <input type="text" id="usuario-pregunta" placeholder="Pregúntame sobre física, vacío, láseres...">
        
        <div class="botones-container">
            <button id="btn-preguntar" onclick="enviarPregunta()">Preguntar a Gemini</button>
            <button id="btn-bailar" onclick="activarBaile()">¡A bailar!</button>
        </div>

        <div id="respuesta-texto">El avatar está esperando tu pregunta...</div>
    </div>

    <script>
        const visor = document.getElementById('avatar-view');
        const respuestaDiv = document.getElementById('respuesta-texto');
        let intervaloBoca = null;

        async function enviarPregunta() {
            const pregunta = document.getElementById('usuario-pregunta').value;
            if(!pregunta) return;

            respuestaDiv.innerText = "Pensando...";
            detenerLipsync();
            
            try {
                // Modificamos la ruta de llamada directa absoluta para evitar fallos de reescritura de Vercel
                const response = await fetch('/api/api.js', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pregunta: pregunta })
                });
                
                if (!response.ok) {
                    throw new Error("Respuesta del servidor fallida");
                }
                
                const data = await response.json();
                respuestaDiv.innerText = data.respuesta;
                
                hacerHablarAvatar(data.respuesta);

            } catch (error) {
                respuestaDiv.innerText = "Sin respuesta de la IA. Revisa tus variables de entorno en Vercel.";
                console.error(error);
            }
        }

        function hacerHablarAvatar(texto) {
            const sintentizador = window.speechSynthesis;
            if (!sintentizador) return;
            
            const lectura = new SpeechSynthesisUtterance(texto);
            
            lectura.onstart = () => {
                intervaloBoca = setInterval(() => {
                    if (visor.model) {
                        const apertura = Math.random() * 0.6; 
                        visor.queryGraph('//jawOpen').forEach(node => node.weight = apertura);
                        visor.queryGraph('//mouthOpen').forEach(node => node.weight = apertura);
                    }
                }, 120);
            };
            
            lectura.onend = () => detenerLipsync();
            lectura.onerror = () => detenerLipsync();
            
            sintentizador.speak(lectura);
        }

        function detenerLipsync() {
            if (intervaloBoca) {
                clearInterval(intervaloBoca);
                intervaloBoca = null;
            }
            if (visor.model) {
                visor.queryGraph('//jawOpen').forEach(node => node.weight = 0);
                visor.queryGraph('//mouthOpen').forEach(node => node.weight = 0);
            }
        }

        function activarBaile() {
            detenerLipsync();
            if(window.speechSynthesis) window.speechSynthesis.cancel();
            
            respuestaDiv.innerText = "Cargando avatar de baile...";
            
            // Cambiamos la fuente al avatar 3
            visor.src = "luis-avatar3.glb";
            
            // ESCUCHADOR CLAVE: Esperamos de forma segura a que el archivo termine de cargar en el navegador
            visor.addEventListener('load', () => {
                respuestaDiv.innerText = "¡A bailar!";
            }, { once: true }); // 'once: true' evita que este evento se quede pegado para siempre
            
            // Regresar al avatar original tras 10 segundos
            setTimeout(() => {
                respuestaDiv.innerText = "Regresando al estado normal...";
                visor.src = "luis-avatar2.glb";
            }, 10000);
        }
    </script>
</body>
</html>
