<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Luigi's Mansion 3D</title>
    <meta http-equiv="refresh" content="0;url=https://huggingface.co/spaces/Luis-Fernando/luiyiart3d">
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff66; /* Tu verde neón */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-shadow: 0 0 10px #00ff66;
        }
        .loader {
            border: 4px solid #1a1a1a;
            border-top: 4px solid #00ff66;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px #00ff66;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #00ffff; /* Azul cian neón */
            text-shadow: 0 0 8px #00ffff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h1>Conectando al mundo virtual...</h1>
    <p>Si no eres redirigido automáticamente, <a href="https://huggingface.co/spaces/Luis-Fernando/luiyiart3d">haz clic aquí para jugar</a>.</p>

</body>
</html>
