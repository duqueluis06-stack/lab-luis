<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cementerio - Nivel 1</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 20;
      display: none;
    }
  </style>
</head>

<body>

<div id="loading">Cargando cementerio...</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// CONFIGURACIÓN Y PARÁMETROS
// --------------------------------------------------

const ESCALA_AVATAR = 3.2; // Avatar más grande
const OFFSET_PIES = 0.12;   // Elevación sobre veredas y adoquines

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

const LUIS_HORA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-hora.glb";

// --------------------------------------------------
// ESCENA, CÁMARA Y RENDERER
// --------------------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

renderer.domElement.addEventListener('click', (e) => e.preventDefault());
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// --------------------------------------------------
// LUCES
// --------------------------------------------------

const ambientLight = new THREE.HemisphereLight(0x8899aa, 0x111111, 1.2);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffffff, 1.0);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// --------------------------------------------------
// LOADERS
// --------------------------------------------------

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// VARIABLES GLOBALES Y CACHÉ
// --------------------------------------------------

let cementerio = null;
let cementerioMixer = null;
const colisionablesCache = [];
const todasLasAcciones = []; // Registro de animaciones activas

const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

let avatarHora = null;
let avatarCamina = null;

let mixerHora = null;
let mixerCamina = null;
let accionHora = null;
let accionCamina = null;

let estaCaminando = false;

const clock = new THREE.Clock();
const raycasterPiso = new THREE.Raycaster();
const raycasterPared = new THREE.Raycaster();
const dirAbajo = new THREE.Vector3(0, -1, 0);

const cameraTarget = new THREE.Vector3();

// Vectores reutilizables
const vecOrigenPiso = new THREE.Vector3();
const vecOrigenPared = new THREE.Vector3();
const vecDirPared = new THREE.Vector3();
const vecMovimiento = new THREE.Vector3();
const vecForward = new THREE.Vector3();
const vecRight = new THREE.Vector3();

// Control de cámara
let arrastrandoMouse = false;
let anteriorMouseX = 0;
let anteriorMouseY = 0;
let anguloCamaraY = 0;
let anguloCamaraX = 20;

// --------------------------------------------------
// EVENTOS DE MOUSE PARA CONTROL DE CÁMARA
// --------------------------------------------------

window.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    arrastrandoMouse = true;
    anteriorMouseX = e.clientX;
    anteriorMouseY = e.clientY;
  }
});

window.addEventListener('mouseup', () => { arrastrandoMouse = false; });

window.addEventListener('mousemove', (e) => {
  if (!arrastrandoMouse) return;

  const deltaX = e.clientX - anteriorMouseX;
  const deltaY = e.clientY - anteriorMouseY;

  anguloCamaraY -= deltaX * 0.25;
  anguloCamaraX += deltaY * 0.18;

  anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));

  anteriorMouseX = e.clientX;
  anteriorMouseY = e.clientY;
});

// --------------------------------------------------
// FILTRO DE OBJETOS SÓLIDOS (VEREDAS, PISOS Y MUROS)
// --------------------------------------------------

function esObjetoSolido(obj) {
  if (!obj || !obj.isMesh) return false;

  const nombre = (obj.name || "").toLowerCase();

  if (
    nombre.includes("neblina") ||
    nombre.includes("fog") ||
    nombre.includes("cielo") ||
    nombre.includes("sky") ||
    nombre.includes("cloud") ||
    nombre.includes("humo") ||
    nombre.includes("smoke") ||
    nombre.includes("particle")
  ) {
    return false;
  }

  if (
    nombre.includes("piso") ||
    nombre.includes("suelo") ||
    nombre.includes("vereda") ||
    nombre.includes("camino") ||
    nombre.includes("ground") ||
    nombre.includes("road") ||
    nombre.includes("stone") ||
    nombre.includes("adoquin")
  ) {
    return true;
  }

  if (obj.material) {
    const materiales = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const mat of materiales) {
      if (mat.depthWrite === false) return false;
      if (mat.transparent && mat.opacity < 0.5) return false;
    }
  }

  return true;
}

// --------------------------------------------------
// CARGAR CEMENTERIO
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    cementerio = gltf.scene;
    scene.add(cementerio);

    cementerio.updateMatrixWorld(true);

    colisionablesCache.length = 0;
    cementerio.traverse((child) => {
      if (child.isMesh && esObjetoSolido(child)) {
        colisionablesCache.push(child);
      }
    });

    if (gltf.animations && gltf.animations.length > 0) {
      cementerioMixer = new THREE.AnimationMixer(cementerio);

      gltf.animations.forEach((clip) => {
        const action = cementerioMixer.clipAction(clip);
        action.reset();
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.clampWhenFinished = false;
        action.enabled = true;
        action.play();
        todasLasAcciones.push(action);
      });
    }

    cargarAvatares();
  },
  function(xhr) {
    if (xhr.total) {
      const porcentaje = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById("loading").textContent = "Cargando cementerio... " + porcentaje + "%";
    }
  },
  function(error) {
    mostrarError("Error cargando cementerio: " + error);
  }
);

// --------------------------------------------------
// CARGAR AVATARES
// --------------------------------------------------

function cargarAvatares() {
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      avatarHora = gltfHora.scene;
      avatarHora.rotation.y = Math.PI;
      
      if (gltfHora.animations.length > 0) {
        mixerHora = new THREE.AnimationMixer(avatarHora);
        accionHora = mixerHora.clipAction(gltfHora.animations[0]);
        accionHora.setLoop(THREE.LoopRepeat, Infinity);
        accionHora.clampWhenFinished = false;
        accionHora.play();
        todasLasAcciones.push(accionHora);
      }

      avatarGroup.add(avatarHora);

      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          avatarCamina = gltfCamina.scene;
          avatarCamina.rotation.y = Math.PI;

          if (gltfCamina.animations.length > 0) {
            mixerCamina = new THREE.AnimationMixer(avatarCamina);
            accionCamina = mixerCamina.clipAction(gltfCamina.animations[0]);
            accionCamina.setLoop(THREE.LoopRepeat, Infinity);
            accionCamina.clampWhenFinished = false;
            accionCamina.play();
            todasLasAcciones.push(accionCamina);
          }

          avatarCamina.visible = false;
          avatarGroup.add(avatarCamina);

          avatarGroup.scale.setScalar(ESCALA_AVATAR);
          avatarGroup.position.set(0, 0, 0);

          cameraTarget.copy(avatarGroup.position);
          camera.position.set(0, 2, 5);

          document.getElementById("loading").style.display = "none";
        },
        undefined,
        function(error) {
          mostrarError("Error cargando luis-camina.glb: " + error);
        }
      );
    },
    undefined,
    function(error) {
      mostrarError("Error cargando luis-hora.glb: " + error);
    }
  );
}

// --------------------------------------------------
// TECLADO
// --------------------------------------------------

const teclas = {};

window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

// --------------------------------------------------
// ADAPTACIÓN MULTI-RAYO A VEREDAS Y ESCALERAS
// --------------------------------------------------

function ajustarAlturaSuelo() {
  if (colisionablesCache.length === 0 || !avatarGroup) return;

  const radioPie = 0.25 * ESCALA_AVATAR;
  const offsets = [
    { x: 0, z: 0 },
    { x: radioPie, z: 0 },
    { x: -radioPie, z: 0 },
    { x: 0, z: radioPie },
    { x: 0, z: -radioPie }
  ];

  let alturaMaximaEncontrada = -Infinity;

  for (let i = 0; i < offsets.length; i++) {
    vecOrigenPiso.copy(avatarGroup.position);
    vecOrigenPiso.x += offsets[i].x;
    vecOrigenPiso.z += offsets[i].z;
    vecOrigenPiso.y += 1.8 * ESCALA_AVATAR;

    raycasterPiso.set(vecOrigenPiso, dirAbajo);
    raycasterPiso.far = 12.0 * ESCALA_AVATAR;

    const impactos = raycasterPiso.intersectObjects(colisionablesCache, false);

    for (let j = 0; j < impactos.length; j++) {
      const impacto = impactos[j];

      if (impacto.point.y > avatarGroup.position.y + 1.2 * ESCALA_AVATAR) continue;

      if (impacto.face && impacto.face.normal.y > 0.05) {
        if (impacto.point.y > alturaMaximaEncontrada) {
          alturaMaximaEncontrada = impacto.point.y;
        }
        break;
      }
    }
  }

  if (alturaMaximaEncontrada !== -Infinity) {
    const alturaObjetivo = alturaMaximaEncontrada + OFFSET_PIES;
    if (Math.abs(avatarGroup.position.y - alturaObjetivo) < 2.5) {
      avatarGroup.position.y = THREE.MathUtils.lerp(avatarGroup.position.y, alturaObjetivo, 0.45);
    } else {
      avatarGroup.position.y = alturaObjetivo;
    }
  }
}

// --------------------------------------------------
// DETECCIÓN DE COLISIONES FRONTALES Y LATERALES
// --------------------------------------------------

function hayColisionPared(dirMovimiento, pasoDistancia) {
  if (colisionablesCache.length === 0 || !avatarGroup) return false;

  const angulos = [-0.4, 0, 0.4];
  const alturas = [0.4 * ESCALA_AVATAR, 1.2 * ESCALA_AVATAR];

  for (const alt of alturas) {
    vecOrigenPared.copy(avatarGroup.position);
    vecOrigenPared.y += alt;

    for (const ang of angulos) {
      vecDirPared.copy(dirMovimiento).applyAxisAngle(new THREE.Vector3(0, 1, 0), ang);
      
      raycasterPared.set(vecOrigenPared, vecDirPared);
      raycasterPared.far = pasoDistancia + 0.6;

      const impactos = raycasterPared.intersectObjects(colisionablesCache, false);

      for (let i = 0; i < impactos.length; i++) {
        const impacto = impactos[i];
        if (impacto.face && Math.abs(impacto.face.normal.y) > 0.7) continue;

        if (impacto.distance < pasoDistancia + 0.5) {
          return true;
        }
      }
    }
  }

  return false;
}

// --------------------------------------------------
// MOVIMIENTO BASADO EN LA DIRECCIÓN DE LA CÁMARA
// --------------------------------------------------

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const radCamY = THREE.MathUtils.degToRad(anguloCamaraY);

  // Vectores de dirección en el plano horizontal (XZ)
  vecForward.set(-Math.sin(radCamY), 0, -Math.cos(radCamY));
  vecRight.set(Math.cos(radCamY), 0, -Math.sin(radCamY));

  vecMovimiento.set(0, 0, 0);

  if (teclas["KeyW"] || teclas["ArrowUp"]) vecMovimiento.add(vecForward);
  if (teclas["KeyS"] || teclas["ArrowDown"]) vecMovimiento.addScaledVector(vecForward, -1);
  if (teclas["KeyD"] || teclas["ArrowRight"]) vecMovimiento.add(vecRight);
  if (teclas["KeyA"] || teclas["ArrowLeft"]) vecMovimiento.addScaledVector(vecRight, -1);

  const moviendo = vecMovimiento.lengthSq() > 0.001;

  if (moviendo) {
    vecMovimiento.normalize();
    const velocidadMov = 4.8;

    // Giro suave hacia la dirección de avance
    const anguloObjetivo = Math.atan2(vecMovimiento.x, vecMovimiento.z);
    let diff = anguloObjetivo - avatarGroup.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    avatarGroup.rotation.y += diff * 0.25;

    const paso = velocidadMov * delta;

    if (!hayColisionPared(vecMovimiento, paso)) {
      avatarGroup.position.addScaledVector(vecMovimiento, paso);
    }

    if (!estaCaminando) {
      if (avatarHora) avatarHora.visible = false;
      if (avatarCamina) avatarCamina.visible = true;
      if (accionCamina) accionCamina.reset().play();
      estaCaminando = true;
    }
    if (mixerCamina) mixerCamina.update(delta);

  } else {
    if (estaCaminando) {
      if (avatarHora) avatarHora.visible = true;
      if (avatarCamina) avatarCamina.visible = false;
      if (accionHora) accionHora.reset().play();
      estaCaminando = false;
    }
    if (mixerHora) mixerHora.update(delta);
  }

  ajustarAlturaSuelo();
}

// --------------------------------------------------
// CÁMARA TERCERA PERSONA
// --------------------------------------------------

function seguirAvatar() {
  if (!avatarGroup) return;

  const objetivoPunto = avatarGroup.position.clone();
  objetivoPunto.y += 1.3 * ESCALA_AVATAR;

  const distancia = 3.8 * ESCALA_AVATAR;
  const radY = THREE.MathUtils.degToRad(anguloCamaraY);
  const radX = THREE.MathUtils.degToRad(anguloCamaraX);

  const offset = new THREE.Vector3(
    distancia * Math.sin(radY) * Math.cos(radX),
    distancia * Math.sin(radX),
    distancia * Math.cos(radY) * Math.cos(radX)
  );

  const posicionDeseada = avatarGroup.position.clone().add(offset);

  camera.position.lerp(posicionDeseada, 0.15);
  cameraTarget.lerp(objetivoPunto, 0.2);
  camera.lookAt(cameraTarget);
}

// --------------------------------------------------
// MOSTRAR ERROR
// --------------------------------------------------

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE PRINCIPAL
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.1);

  if (cementerioMixer) cementerioMixer.update(delta);

  moverAvatar(delta);
  seguirAvatar();

  // Forzar la ejecución continua de animaciones que hayan llegado al final de su clip
  for (let i = 0; i < todasLasAcciones.length; i++) {
    const act = todasLasAcciones[i];
    if (act && act.enabled && !act.isRunning()) {
      act.reset().play();
    }
  }

  renderer.render(scene, camera);
}

animate();

// --------------------------------------------------
// REDIMENSIONADO DE VENTANA
// --------------------------------------------------

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
