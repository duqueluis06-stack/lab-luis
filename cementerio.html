<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cementerio - Nivel 1</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 20;
      display: none;
    }
  </style>
</head>

<body>

<div id="loading">Cargando cementerio...</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// URLs
// --------------------------------------------------

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

const LUIS_HORA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-hora.glb";

// --------------------------------------------------
// ESCENA, CÁMARA Y RENDERER
// --------------------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// --------------------------------------------------
// LUCES
// --------------------------------------------------

const ambientLight = new THREE.HemisphereLight(0x8899aa, 0x111111, 1.2);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffffff, 1.0);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// --------------------------------------------------
// LOADERS
// --------------------------------------------------

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// VARIABLES GLOBALES
// --------------------------------------------------

let cementerio = null;
let cementerioMixer = null;

// Grupo contenedor principal del avatar (mantiene posición y rotación compartida)
const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

let avatarHora = null;
let avatarCamina = null;

let mixerHora = null;
let mixerCamina = null;

const clock = new THREE.Clock();
const raycasterColision = new THREE.Raycaster();

// --------------------------------------------------
// CARGAR CEMENTERIO
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    cementerio = gltf.scene;
    scene.add(cementerio);

    // Activar animaciones del entorno/escenario si existen
    if (gltf.animations && gltf.animations.length > 0) {
      cementerioMixer = new THREE.AnimationMixer(cementerio);
      gltf.animations.forEach((clip) => {
        cementerioMixer.clipAction(clip).play();
      });
    }

    cargarAvatares();
  },
  function(xhr) {
    if (xhr.total) {
      const porcentaje = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById("loading").textContent = "Cargando cementerio... " + porcentaje + "%";
    }
  },
  function(error) {
    mostrarError("Error cargando cementerio: " + error);
  }
);

// --------------------------------------------------
// CARGAR AVATARES (ESTÁTICO Y CAMINANDO)
// --------------------------------------------------

function cargarAvatares() {
  // 1. Cargar avatar reposo (luis-hora.glb)
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      avatarHora = gltfHora.scene;
      
      if (gltfHora.animations.length > 0) {
        mixerHora = new THREE.AnimationMixer(avatarHora);
        const accionHora = mixerHora.clipAction(gltfHora.animations[0]);
        accionHora.play();
      }

      avatarGroup.add(avatarHora);

      // 2. Cargar avatar caminata (luis-camina.glb)
      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          avatarCamina = gltfCamina.scene;

          if (gltfCamina.animations.length > 0) {
            mixerCamina = new THREE.AnimationMixer(avatarCamina);
            const accionCamina = mixerCamina.clipAction(gltfCamina.animations[0]);
            accionCamina.play();
          }

          avatarCamina.visible = false; // Oculto al inicio
          avatarGroup.add(avatarCamina);

          // Configuración de escala y altura en el grupo principal
          avatarGroup.scale.setScalar(2.2);
          avatarGroup.position.set(0, 0.15, 0);

          camera.position.set(0, 3, 7);
          document.getElementById("loading").style.display = "none";
        },
        undefined,
        function(error) {
          mostrarError("Error cargando luis-camina.glb: " + error);
        }
      );
    },
    undefined,
    function(error) {
      mostrarError("Error cargando luis-hora.glb: " + error);
    }
  );
}

// --------------------------------------------------
// TECLADO
// --------------------------------------------------

const teclas = {};

window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

// --------------------------------------------------
// DETECCIÓN DE COLISIONES
// --------------------------------------------------

function hayColision(paso) {
  if (!cementerio || !avatarGroup) return false;

  const dir = new THREE.Vector3();
  avatarGroup.getWorldDirection(dir);
  
  if (paso < 0) dir.negate(); // Invertir si va hacia adelante (translateZ negativo)

  const origen = avatarGroup.position.clone();
  origen.y += 0.8; 

  raycasterColision.set(origen, dir);
  const impactos = raycasterColision.intersectObjects(cementerio.children, true);

  if (impactos.length > 0 && impactos[0].distance < Math.abs(paso) + 0.6) {
    return true;
  }

  return false;
}

// --------------------------------------------------
// MOVIMIENTO Y CONMUTACIÓN DE ANIMACIÓN
// --------------------------------------------------

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const velocidad = 3.5;
  let moviendo = false;

  if (teclas["KeyA"] || teclas["ArrowLeft"]) {
    avatarGroup.rotation.y += velocidad * delta;
  }

  if (teclas["KeyD"] || teclas["ArrowRight"]) {
    avatarGroup.rotation.y -= velocidad * delta;
  }

  if (teclas["KeyW"] || teclas["ArrowUp"]) {
    const paso = -velocidad * delta;
    if (!hayColision(paso)) {
      avatarGroup.translateZ(paso);
    }
    moviendo = true;
  }

  if (teclas["KeyS"] || teclas["ArrowDown"]) {
    const paso = velocidad * delta;
    if (!hayColision(paso)) {
      avatarGroup.translateZ(paso);
    }
    moviendo = true;
  }

  // Alternar visibilidad y actualización de mixers según el estado
  if (moviendo) {
    if (avatarHora) avatarHora.visible = false;
    if (avatarCamina) avatarCamina.visible = true;
    if (mixerCamina) mixerCamina.update(delta);
  } else {
    if (avatarHora) avatarHora.visible = true;
    if (avatarCamina) avatarCamina.visible = false;
    if (mixerHora) mixerHora.update(delta);
  }
}

// --------------------------------------------------
// CÁMARA SIGUE AL AVATAR
// --------------------------------------------------

function seguirAvatar() {
  if (!avatarGroup) return;

  const objetivo = new THREE.Vector3();
  avatarGroup.getWorldPosition(objetivo);
  objetivo.y += 2.0;

  const posicionCamara = new THREE.Vector3();
  posicionCamara.copy(objetivo);
  
  const offset = new THREE.Vector3(0, 1.5, 6);
  offset.applyQuaternion(avatarGroup.quaternion);
  
  posicionCamara.add(offset);

  camera.position.lerp(posicionCamara, 0.1);
  camera.lookAt(objetivo);
}

// --------------------------------------------------
// ERROR
// --------------------------------------------------

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE PRINCIPAL
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (cementerioMixer) cementerioMixer.update(delta);

  moverAvatar(delta);
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
