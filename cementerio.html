<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego 3D - Bforartists / Three.js</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 20;
      display: none;
    }
  </style>
</head>

<body>

<div id="loading">Cargando escenario y personajes...</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// CONFIGURACIÓN Y PARÁMETROS GENERALES
// --------------------------------------------------

const ESCALA_AVATAR = 2.2;
const OFFSET_PIES = 0.08;

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

const LUIS_HORA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-hora.glb";

// --------------------------------------------------
// ESCENA, CÁMARA Y RENDERER
// --------------------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

renderer.domElement.addEventListener('click', (e) => e.preventDefault());
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// --------------------------------------------------
// LUCES DE LA ESCENA
// --------------------------------------------------

const ambientLight = new THREE.HemisphereLight(0x8899aa, 0x111111, 1.2);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffffff, 1.0);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// --------------------------------------------------
// CARGADORES GLTF / DRACO
// --------------------------------------------------

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// VARIABLES GLOBALES Y FISICAS
// --------------------------------------------------

let cementerio = null;
let cementerioMixer = null;

const pisoColisionables = [];
const paredColisionables = [];

const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

let avatarHora = null;
let avatarCamina = null;

let mixerHora = null;
let mixerCamina = null;
let accionHora = null;
let accionCamina = null;

let estaCaminando = false;

const clock = new THREE.Clock();
const raycasterPiso = new THREE.Raycaster();
const raycasterPared = new THREE.Raycaster();
const dirAbajo = new THREE.Vector3(0, -1, 0);

const cameraTarget = new THREE.Vector3();

// Vectores reutilizables para optimización
const vecOrigenPiso = new THREE.Vector3();
const vecOrigenPared = new THREE.Vector3();
const vecDirPared = new THREE.Vector3();
const vecMovimiento = new THREE.Vector3();
const vecForward = new THREE.Vector3();
const vecRight = new THREE.Vector3();

// Control de cámara
let arrastrandoMouse = false;
let anteriorMouseX = 0;
let anteriorMouseY = 0;
let anguloCamaraY = 0;
let anguloCamaraX = 20;

// --------------------------------------------------
// EVENTOS DE MOUSE PARA CONTROL DE CÁMARA
// --------------------------------------------------

window.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    arrastrandoMouse = true;
    anteriorMouseX = e.clientX;
    anteriorMouseY = e.clientY;
  }
});

window.addEventListener('mouseup', () => { arrastrandoMouse = false; });

window.addEventListener('mousemove', (e) => {
  if (!arrastrandoMouse) return;

  const deltaX = e.clientX - anteriorMouseX;
  const deltaY = e.clientY - anteriorMouseY;

  anguloCamaraY -= deltaX * 0.25;
  anguloCamaraX += deltaY * 0.18;

  anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));

  anteriorMouseX = e.clientX;
  anteriorMouseY = e.clientY;
});

// --------------------------------------------------
// FILTRADO DE OBJETOS DE LA ESCENA
// --------------------------------------------------

function obtenerNombreJerarquia(obj) {
  let cadenaNombres = "";
  let actual = obj;
  while (actual) {
    if (actual.name) cadenaNombres += " " + actual.name;
    actual = actual.parent;
  }
  return cadenaNombres.toLowerCase();
}

function clasificarObjeto(obj) {
  if (!obj || !obj.isMesh) return;

  const jerarquia = obtenerNombreJerarquia(obj);

  // Exclusiones absolutas: elementos etéreos o invisibles
  if (
    jerarquia.includes("niebla") ||
    jerarquia.includes("neblina") ||
    jerarquia.includes("fog") ||
    jerarquia.includes("cielo") ||
    jerarquia.includes("sky") ||
    jerarquia.includes("cloud") ||
    jerarquia.includes("humo") ||
    jerarquia.includes("smoke") ||
    jerarquia.includes("particle") ||
    jerarquia.includes("light") ||
    jerarquia.includes("trigger") ||
    jerarquia.includes("esfera") ||
    jerarquia.includes("grid") ||
    jerarquia.includes("vacío") ||
    jerarquia.includes("vacio") ||
    jerarquia.includes("imagen")
  ) {
    return;
  }

  if (obj.material) {
    if (Array.isArray(obj.material)) {
      obj.material.forEach(m => { m.side = THREE.DoubleSide; });
    } else {
      obj.material.side = THREE.DoubleSide;
    }
  }

  // Estructuras sólidas que bloquean el paso (se excluyen árboles para evitar congelamiento de CPU)
  if (
    jerarquia.includes("backrooms") ||
    jerarquia.includes("cerca") ||
    jerarquia.includes("rejas") ||
    jerarquia.includes("mausoleo") ||
    jerarquia.includes("tumba") ||
    jerarquia.includes("estatua") ||
    jerarquia.includes("pared") ||
    jerarquia.includes("wall") ||
    jerarquia.includes("muro")
  ) {
    paredColisionables.push(obj);
  } else {
    pisoColisionables.push(obj);
  }
}

// --------------------------------------------------
// CARGAR ESCENARIO Y ANIMACIONES
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    cementerio = gltf.scene;
    scene.add(cementerio);

    cementerio.updateMatrixWorld(true);

    pisoColisionables.length = 0;
    paredColisionables.length = 0;

    cementerio.traverse((child) => {
      clasificarObjeto(child);
    });

    if (gltf.animations && gltf.animations.length > 0) {
      cementerioMixer = new THREE.AnimationMixer(cementerio);
      gltf.animations.forEach((clip) => {
        const action = cementerioMixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
      });
    }

    cargarAvatares();
  },
  function() {
    document.getElementById("loading").textContent = "Cargando escenario...";
  },
  function(error) {
    mostrarError("Error cargando el escenario: " + error);
  }
);

// --------------------------------------------------
// CARGAR Y CONFIGURAR AVATARES
// --------------------------------------------------

function cargarAvatares() {
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      avatarHora = gltfHora.scene;
      
      if (gltfHora.animations.length > 0) {
        mixerHora = new THREE.AnimationMixer(avatarHora);
        accionHora = mixerHora.clipAction(gltfHora.animations[0]);
        accionHora.setLoop(THREE.LoopRepeat, Infinity);
        accionHora.play();
      }

      avatarGroup.add(avatarHora);

      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          avatarCamina = gltfCamina.scene;

          if (gltfCamina.animations.length > 0) {
            mixerCamina = new THREE.AnimationMixer(avatarCamina);
            accionCamina = mixerCamina.clipAction(gltfCamina.animations[0]);
            accionCamina.setLoop(THREE.LoopRepeat, Infinity);
            accionCamina.play();
          }

          avatarCamina.visible = false;
          avatarGroup.add(avatarCamina);

          avatarGroup.scale.setScalar(ESCALA_AVATAR);
          avatarGroup.position.set(0, 0, 0);

          cameraTarget.copy(avatarGroup.position);
          camera.position.set(0, 2, 5);

          document.getElementById("loading").style.display = "none";
        },
        undefined,
        function(error) {
          mostrarError("Error cargando avatar de movimiento: " + error);
        }
      );
    },
    undefined,
    function(error) {
      mostrarError("Error cargando avatar estático: " + error);
    }
  );
}

// --------------------------------------------------
// CONTROL DE TECLADO
// --------------------------------------------------

const teclas = {};

window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

// --------------------------------------------------
// DETECCIÓN DE SUELO Y ESCALERAS
// --------------------------------------------------

function ajustarAlturaSuelo() {
  if (pisoColisionables.length === 0 || !avatarGroup) return;

  vecOrigenPiso.copy(avatarGroup.position);
  vecOrigenPiso.y += 1.2 * ESCALA_AVATAR;

  raycasterPiso.set(vecOrigenPiso, dirAbajo);
  raycasterPiso.far = 15.0 * ESCALA_AVATAR;

  const impactos = raycasterPiso.intersectObjects(pisoColisionables, false);

  if (impactos.length > 0) {
    const limiteSuperiorHip = avatarGroup.position.y + 0.8 * ESCALA_AVATAR;

    for (let i = 0; i < impactos.length; i++) {
      const impacto = impactos[i];

      if (impacto.point.y <= limiteSuperiorHip) {
        const alturaObjetivo = impacto.point.y + OFFSET_PIES;
        
        if (Math.abs(avatarGroup.position.y - alturaObjetivo) < 3.0) {
          avatarGroup.position.y = THREE.MathUtils.lerp(avatarGroup.position.y, alturaObjetivo, 0.35);
        } else {
          avatarGroup.position.y = alturaObjetivo;
        }
        break;
      }
    }
  }
}

// --------------------------------------------------
// DETECCIÓN DE PAREDES OPTIMIZADA
// --------------------------------------------------

function hayColisionPared(dirMovimiento, pasoDistancia) {
  if (paredColisionables.length === 0 || !avatarGroup) return false;

  const radioCuerpo = 0.28 * ESCALA_AVATAR; 
  const distanciaLimite = radioCuerpo + pasoDistancia + 0.1;

  // Reducido a 4 direcciones principales para máxima velocidad de procesamiento
  const angulos = [0, 1.57, 3.1415, -1.57];
  const alturas = [0.4 * ESCALA_AVATAR, 1.0 * ESCALA_AVATAR];

  for (let h = 0; h < alturas.length; h++) {
    vecOrigenPared.copy(avatarGroup.position);
    vecOrigenPared.y += alturas[h];

    for (let a = 0; a < angulos.length; a++) {
      vecDirPared.copy(dirMovimiento).applyAxisAngle(new THREE.Vector3(0, 1, 0), angulos[a]);
      
      raycasterPared.set(vecOrigenPared, vecDirPared);
      raycasterPared.far = distanciaLimite;

      const impactos = raycasterPared.intersectObjects(paredColisionables, false);

      if (impactos.length > 0) {
        if (impactos[0].distance < distanciaLimite) {
          return true;
        }
      }
    }
  }

  return false;
}

// --------------------------------------------------
// DESPLAZAMIENTO Y CAMBIO DE ESTADO
// --------------------------------------------------

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const radCamY = THREE.MathUtils.degToRad(anguloCamaraY);

  vecForward.set(-Math.sin(radCamY), 0, -Math.cos(radCamY));
  vecRight.set(Math.cos(radCamY), 0, -Math.sin(radCamY));

  vecMovimiento.set(0, 0, 0);

  if (teclas["KeyW"] || teclas["ArrowUp"]) vecMovimiento.add(vecForward);
  if (teclas["KeyS"] || teclas["ArrowDown"]) vecMovimiento.addScaledVector(vecForward, -1);
  if (teclas["KeyD"] || teclas["ArrowRight"]) vecMovimiento.add(vecRight);
  if (teclas["KeyA"] || teclas["ArrowLeft"]) vecMovimiento.addScaledVector(vecRight, -1);

  const moviendo = vecMovimiento.lengthSq() > 0.001;

  if (moviendo) {
    vecMovimiento.normalize();
    const velocidadMov = 4.8;

    const anguloObjetivo = Math.atan2(vecMovimiento.x, vecMovimiento.z);
    let diff = anguloObjetivo - avatarGroup.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    avatarGroup.rotation.y += diff * 0.25;

    const paso = velocidadMov * delta;

    if (!hayColisionPared(vecMovimiento, paso)) {
      avatarGroup.position.addScaledVector(vecMovimiento, paso);
    }

    if (!estaCaminando) {
      if (avatarHora) avatarHora.visible = false;
      if (avatarCamina) avatarCamina.visible = true;
      estaCaminando = true;
    }

  } else {
    if (estaCaminando) {
      if (avatarHora) avatarHora.visible = true;
      if (avatarCamina) avatarCamina.visible = false;
      estaCaminando = false;
    }
  }

  ajustarAlturaSuelo();
}

// --------------------------------------------------
// CÁMARA TERCERA PERSONA
// --------------------------------------------------

function seguirAvatar() {
  if (!avatarGroup) return;

  const objetivoPunto = avatarGroup.position.clone();
  objetivoPunto.y += 1.2 * ESCALA_AVATAR;

  const distancia = 3.4 * ESCALA_AVATAR;
  const radY = THREE.MathUtils.degToRad(anguloCamaraY);
  const radX = THREE.MathUtils.degToRad(anguloCamaraX);

  const offset = new THREE.Vector3(
    distancia * Math.sin(radY) * Math.cos(radX),
    distancia * Math.sin(radX),
    distancia * Math.cos(radY) * Math.cos(radX)
  );

  const posicionDeseada = avatarGroup.position.clone().add(offset);

  camera.position.lerp(posicionDeseada, 0.15);
  cameraTarget.lerp(objetivoPunto, 0.2);
  camera.lookAt(cameraTarget);
}

// --------------------------------------------------
// CONTROL DE ERRORES
// --------------------------------------------------

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE PRINCIPAL DE RENDERIZADO
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.033);

  if (cementerioMixer) cementerioMixer.update(delta);
  if (estaCaminando && mixerCamina) mixerCamina.update(delta);
  if (!estaCaminando && mixerHora) mixerHora.update(delta);

  moverAvatar(delta);
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

// --------------------------------------------------
// REAJUSTE DE VENTANA
// --------------------------------------------------

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
