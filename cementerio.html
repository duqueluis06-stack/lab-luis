<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego 3D - Cementerio con Querubín</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 1.2rem;
      z-index: 30;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #start-btn {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 1rem;
      background: #334455;
      color: #fff;
      border: 1px solid #667788;
      border-radius: 6px;
      display: none;
      cursor: pointer;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 40;
      display: none;
    }

    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      touch-action: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.05s linear;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="loading">
  <div id="loading-text">Cargando escenario, querubín y animaciones...</div>
  <button id="start-btn">▶ HACER CLIC PARA ENTRAR AL JUEGO</button>
</div>

<div id="error"></div>

<div id="joystick-zone">
  <div id="joystick-knob"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// CONFIGURACIÓN Y RUTAS
// --------------------------------------------------

const ESCALA_AVATAR = 2.2;
const OFFSET_PIES = 0.08;

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const QUERUBIN_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/querubin.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

const LUIS_HORA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-hora.glb";

const MUSICA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/audio/music-cementerio.mp3";

// --------------------------------------------------
// AUDIO CON SOPORTE PARA PC
// --------------------------------------------------

const bgMusic = new Audio(MUSICA_URL);
bgMusic.loop = true;
bgMusic.volume = 0.45;

function iniciarJuego() {
  bgMusic.play().catch(() => {});
  document.getElementById("loading").style.display = "none";
}

document.getElementById("loading").addEventListener("click", iniciarJuego);

// --------------------------------------------------
// ESCENA
// --------------------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.HemisphereLight(0x8899aa, 0x111111, 1.2);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffffff, 1.0);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// --------------------------------------------------
// CARGADORES
// --------------------------------------------------

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// CONTROL DE OBJETOS
// --------------------------------------------------

let cementerio = null;
let cementerioMixer = null;

const querubinGroup = new THREE.Group();
scene.add(querubinGroup);
querubinGroup.position.set(-32, 18, -10); // Ubicación en lateral del mapa

let querubinMesh = null;
let mixerQuerubin = null;
let luzOjoInterna = null;
let focoOjoProyectado = null;

const pisoColisionables = [];
const paredColisionables = [];
const cercaPiso = [];
const cercaPared = [];

const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

let avatarHora = null;
let avatarCamina = null;

let mixerHora = null;
let mixerCamina = null;

let estaCaminando = false;

const clock = new THREE.Clock();
const raycasterPiso = new THREE.Raycaster();
const raycasterPared = new THREE.Raycaster();
const dirAbajo = new THREE.Vector3(0, -1, 0);

const cameraTarget = new THREE.Vector3();

const vecOrigenPiso = new THREE.Vector3();
const vecOrigenPared = new THREE.Vector3();
const vecDirPared = new THREE.Vector3();
const vecMovimiento = new THREE.Vector3();
const vecForward = new THREE.Vector3();
const vecRight = new THREE.Vector3();
const vecNormalMundo = new THREE.Vector3();
const vecPosObj = new THREE.Vector3();

let anguloCamaraY = 0;
let anguloCamaraX = 20;

const joystickInput = { x: 0, y: 0 };

// --------------------------------------------------
// CONTROLES TECLADO Y TOUCH
// --------------------------------------------------

const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

let joystickTouchId = null;
let cameraTouchId = null;
let touchStartX = 0;
let touchStartY = 0;

joystickZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (joystickTouchId === null) {
      joystickTouchId = touch.identifier;
      actualizarJoystick(touch);
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      actualizarJoystick(touch);
    } else if (touch.identifier === cameraTouchId) {
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      anguloCamaraY -= deltaX * 0.35;
      anguloCamaraX += deltaY * 0.25;
      anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));

      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joystickInput.x = 0;
      joystickInput.y = 0;
      joystickKnob.style.transform = `translate(0px, 0px)`;
    } else if (touch.identifier === cameraTouchId) {
      cameraTouchId = null;
    }
  }
});

window.addEventListener('touchstart', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.clientX > window.innerWidth / 2 && cameraTouchId === null) {
      cameraTouchId = touch.identifier;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
  }
});

function actualizarJoystick(touch) {
  const rect = joystickZone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = touch.clientX - centerX;
  let dy = touch.clientY - centerY;

  const maxRadio = rect.width / 2;
  const dist = Math.hypot(dx, dy);

  if (dist > maxRadio) {
    dx = (dx / dist) * maxRadio;
    dy = (dy / dist) * maxRadio;
  }

  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joystickInput.x = dx / maxRadio;
  joystickInput.y = dy / maxRadio;
}

let arrastrandoMouse = false;
let anteriorMouseX = 0;
let anteriorMouseY = 0;

window.addEventListener('mousedown', (e) => {
  if (e.clientX > 180 || e.clientY < window.innerHeight - 180) {
    arrastrandoMouse = true;
    anteriorMouseX = e.clientX;
    anteriorMouseY = e.clientY;
  }
});
window.addEventListener('mouseup', () => { arrastrandoMouse = false; });
window.addEventListener('mousemove', (e) => {
  if (!arrastrandoMouse) return;
  anguloCamaraY -= (e.clientX - anteriorMouseX) * 0.25;
  anguloCamaraX += (e.clientY - anteriorMouseY) * 0.18;
  anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));
  anteriorMouseX = e.clientX;
  anteriorMouseY = e.clientY;
});

// --------------------------------------------------
// CLASIFICACIÓN DE OBJETOS
// --------------------------------------------------

function obtenerNombreJerarquia(obj) {
  let cadena = "";
  let actual = obj;
  while (actual) {
    if (actual.name) cadena += " " + actual.name;
    actual = actual.parent;
  }
  return cadena.toLowerCase();
}

function clasificarObjeto(obj) {
  if (!obj || !obj.isMesh) return;

  const jerarquia = obtenerNombreJerarquia(obj);

  const esIgnorable = (
    jerarquia.includes("niebla") ||
    jerarquia.includes("fog") ||
    jerarquia.includes("cielo") ||
    jerarquia.includes("sky") ||
    jerarquia.includes("humo") ||
    jerarquia.includes("particle")
  );

  if (esIgnorable) return;

  if (obj.material) {
    if (Array.isArray(obj.material)) {
      obj.material.forEach(m => { m.side = THREE.DoubleSide; });
    } else {
      obj.material.side = THREE.DoubleSide;
    }
  }

  const esParedEspecial = (
    jerarquia.includes("pared") ||
    jerarquia.includes("wall") ||
    jerarquia.includes("cerca") ||
    jerarquia.includes("reja") ||
    jerarquia.includes("muro") ||
    jerarquia.includes("mausoleo")
  );

  const esSueloPuro = (
    jerarquia.includes("suelo") ||
    jerarquia.includes("piso") ||
    jerarquia.includes("ground") ||
    jerarquia.includes("terrain") ||
    jerarquia.includes("terreno") ||
    jerarquia.includes("camino")
  );

  if (esSueloPuro && !esParedEspecial) {
    pisoColisionables.push(obj);
  } else {
    const esVegetacion = jerarquia.includes("arbol") || jerarquia.includes("tree") || jerarquia.includes("hoja");
    if (!esVegetacion) {
      paredColisionables.push(obj);
    }
  }
}

// --------------------------------------------------
// SISTEMA DE ANIMACIÓN
// --------------------------------------------------

function crearYEjecutarMixer(gltf, rootObject, velocidadAnimacion = 1.0) {
  rootObject.traverse((child) => {
    if (child.isMesh) child.frustumCulled = false;
  });

  if (!gltf.animations || gltf.animations.length === 0) return null;

  const mixer = new THREE.AnimationMixer(rootObject);
  mixer.actionsList = [];

  gltf.animations.forEach((clip) => {
    const action = mixer.clipAction(clip);
    action.reset();
    action.setLoop(THREE.LoopRepeat, Infinity);
    action.clampWhenFinished = false;
    action.timeScale = velocidadAnimacion;
    action.play();
    mixer.actionsList.push(action);
  });

  return mixer;
}

function actualizarMixerForzado(mixer, delta) {
  if (!mixer) return;
  mixer.update(delta);

  if (mixer.actionsList) {
    for (let i = 0; i < mixer.actionsList.length; i++) {
      const action = mixer.actionsList[i];
      const duration = action.getClip().duration;
      if (duration > 0 && action.time >= duration) {
        action.time = action.time % duration;
      }
    }
  }
}

// --------------------------------------------------
// FILTRO DE PROXIMIDAD
// --------------------------------------------------

function obtenerCercanos(origen, destino, radioMaximo) {
  destino.length = 0;
  const radioSq = radioMaximo * radioMaximo;
  const posAvatar = avatarGroup.position;

  for (let i = 0; i < origen.length; i++) {
    const obj = origen[i];
    obj.getWorldPosition(vecPosObj);
    if (vecPosObj.distanceToSquared(posAvatar) < radioSq) {
      destino.push(obj);
    }
  }

  if (destino.length === 0) {
    for (let i = 0; i < origen.length; i++) {
      destino.push(origen[i]);
    }
  }
}

// --------------------------------------------------
// CARGA DE MODELOS CON LUCES Y ORIENTACIÓN
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    try {
      cementerio = gltf.scene;
      scene.add(cementerio);
      cementerio.updateMatrixWorld(true);

      pisoColisionables.length = 0;
      paredColisionables.length = 0;

      cementerio.traverse((child) => { clasificarObjeto(child); });

      if (gltf.animations && gltf.animations.length > 0) {
        cementerioMixer = crearYEjecutarMixer(gltf, cementerio, 1.0);
      }
    } catch (e) {
      console.warn("Aviso en cementerio:", e);
    }

    cargarQuerubin();
  },
  undefined,
  function(error) { mostrarError("Error cargando escenario principal: " + error); }
);

function cargarQuerubin() {
  loader.load(
    QUERUBIN_URL,
    function(gltfQuerubin) {
      try {
        querubinMesh = gltfQuerubin.scene;
        
        // Inclinación interna para alinear la cara/ojo frontalmente
        querubinMesh.rotation.x = Math.PI / 2;

        querubinMesh.traverse((child) => {
          if (child.isMesh) {
            child.frustumCulled = false;
            if (child.material) {
              child.material.emissive = new THREE.Color(0x331100);
            }
          }
        });

        querubinGroup.add(querubinMesh);

        // 💡 Luz Interna en el Ojo (Brillo Dorado)
        luzOjoInterna = new THREE.PointLight(0xffaa22, 12, 30);
        luzOjoInterna.position.set(0, 0, 0);
        querubinGroup.add(luzOjoInterna);

        // 🔦 Foco de Luz Proyectado hacia el jugador
        focoOjoProyectado = new THREE.SpotLight(0xffdd88, 20, 70, Math.PI / 5, 0.4);
        focoOjoProyectado.position.set(0, 0, 0);
        focoOjoProyectado.target = avatarGroup;
        querubinGroup.add(focoOjoProyectado);

        if (gltfQuerubin.animations && gltfQuerubin.animations.length > 0) {
          mixerQuerubin = crearYEjecutarMixer(gltfQuerubin, querubinMesh, 1.0);
        }
      } catch (e) {
        console.warn("Aviso cargando querubín:", e);
      }

      cargarAvatares();
    },
    undefined,
    function(error) {
      console.warn("No se pudo cargar querubín, continuando:", error);
      cargarAvatares();
    }
  );
}

function cargarAvatares() {
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      try {
        avatarHora = gltfHora.scene;
        mixerHora = crearYEjecutarMixer(gltfHora, avatarHora, 1.0);
        avatarGroup.add(avatarHora);
      } catch (e) {
        console.warn("Aviso en avatar reposo:", e);
      }

      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          try {
            avatarCamina = gltfCamina.scene;
            mixerCamina = crearYEjecutarMixer(gltfCamina, avatarCamina, 1.05);

            avatarCamina.visible = false;
            avatarGroup.add(avatarCamina);

            avatarGroup.scale.setScalar(ESCALA_AVATAR);
            avatarGroup.position.set(0, 0, 0);

            cameraTarget.copy(avatarGroup.position);
            camera.position.set(0, 2, 5);
          } catch (e) {
            console.warn("Aviso en avatar marcha:", e);
          }

          document.getElementById("loading-text").textContent = "¡Carga Completa!";
          document.getElementById("start-btn").style.display = "inline-block";
        },
        undefined,
        function(error) { mostrarError("Error en avatar marcha: " + error); }
      );
    },
    undefined,
    function(error) { mostrarError("Error en avatar reposo: " + error); }
  );
}

// --------------------------------------------------
// FÍSICAS Y SEGUIMIENTO DEL QUERUBÍN
// --------------------------------------------------

const teclas = {};
window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

function ajustarAlturaSuelo() {
  if (pisoColisionables.length === 0 || !avatarGroup) return;

  obtenerCercanos(pisoColisionables, cercaPiso, 35.0);

  vecOrigenPiso.copy(avatarGroup.position);
  vecOrigenPiso.y += 1.2;

  raycasterPiso.set(vecOrigenPiso, dirAbajo);
  raycasterPiso.far = 25.0;

  const impactos = raycasterPiso.intersectObjects(cercaPiso, false);

  for (let i = 0; i < impactos.length; i++) {
    const imp = impactos[i];
    if (imp.point.y <= avatarGroup.position.y + 0.8) {
      if (imp.face) {
        vecNormalMundo.copy(imp.face.normal).transformDirection(imp.object.matrixWorld);
      } else {
        vecNormalMundo.set(0, 1, 0);
      }

      if (vecNormalMundo.y > 0.2) {
        const alturaObjetivo = imp.point.y + OFFSET_PIES;
        avatarGroup.position.y = THREE.MathUtils.lerp(avatarGroup.position.y, alturaObjetivo, 0.35);
        break;
      }
    }
  }
}

function hayColisionPared(dirMovimiento, pasoDistancia) {
  if (paredColisionables.length === 0 || !avatarGroup) return false;

  obtenerCercanos(paredColisionables, cercaPared, 12.0);

  const radioCuerpo = 0.35 * ESCALA_AVATAR; 
  const distanciaLimite = radioCuerpo + pasoDistancia;

  vecOrigenPared.copy(avatarGroup.position);
  vecOrigenPared.y += 0.8 * ESCALA_AVATAR;

  const angulos = [-0.3, 0, 0.3];

  for (let a = 0; a < angulos.length; a++) {
    vecDirPared.copy(dirMovimiento).applyAxisAngle(new THREE.Vector3(0, 1, 0), angulos[a]);
    
    raycasterPared.set(vecOrigenPared, vecDirPared);
    raycasterPared.far = distanciaLimite;

    const impactos = raycasterPared.intersectObjects(cercaPared, false);

    if (impactos.length > 0 && impactos[0].distance < distanciaLimite) {
      return true;
    }
  }

  return false;
}

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const radCamY = THREE.MathUtils.degToRad(anguloCamaraY);

  vecForward.set(-Math.sin(radCamY), 0, -Math.cos(radCamY));
  vecRight.set(Math.cos(radCamY), 0, -Math.sin(radCamY));

  vecMovimiento.set(0, 0, 0);

  if (Math.abs(joystickInput.x) > 0.05 || Math.abs(joystickInput.y) > 0.05) {
    vecMovimiento.addScaledVector(vecRight, joystickInput.x);
    vecMovimiento.addScaledVector(vecForward, -joystickInput.y);
  }

  if (teclas["KeyW"] || teclas["ArrowUp"]) vecMovimiento.add(vecForward);
  if (teclas["KeyS"] || teclas["ArrowDown"]) vecMovimiento.addScaledVector(vecForward, -1);
  if (teclas["KeyD"] || teclas["ArrowRight"]) vecMovimiento.addScaledVector(vecRight, 1);
  if (teclas["KeyA"] || teclas["ArrowLeft"]) vecMovimiento.addScaledVector(vecRight, -1);

  const moviendo = vecMovimiento.lengthSq() > 0.001;

  if (moviendo) {
    vecMovimiento.normalize();
    const velocidadMov = 6.2;

    const anguloObjetivo = Math.atan2(vecMovimiento.x, vecMovimiento.z);
    let diff = anguloObjetivo - avatarGroup.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    avatarGroup.rotation.y += diff * Math.min(1.0, delta * 15.0);

    const paso = velocidadMov * delta;

    if (!hayColisionPared(vecMovimiento, paso)) {
      avatarGroup.position.addScaledVector(vecMovimiento, paso);
    }

    if (!estaCaminando) {
      if (avatarHora) avatarHora.visible = false;
      if (avatarCamina) avatarCamina.visible = true;
      estaCaminando = true;
    }

  } else {
    if (estaCaminando) {
      if (avatarHora) avatarHora.visible = true;
      if (avatarCamina) avatarCamina.visible = false;
      estaCaminando = false;
    }
  }

  ajustarAlturaSuelo();
}

function actualizarQuerubin() {
  if (!querubinGroup || !avatarGroup) return;

  // Seguimiento dinámico: El ojo del Querubín mira directamente al personaje
  const posMirada = avatarGroup.position.clone();
  posMirada.y += 1.5;
  querubinGroup.lookAt(posMirada);
}

function seguirAvatar() {
  if (!avatarGroup) return;

  const objetivoPunto = avatarGroup.position.clone();
  objetivoPunto.y += 1.2 * ESCALA_AVATAR;

  const distancia = 3.4 * ESCALA_AVATAR;
  const radY = THREE.MathUtils.degToRad(anguloCamaraY);
  const radX = THREE.MathUtils.degToRad(anguloCamaraX);

  const offset = new THREE.Vector3(
    distancia * Math.sin(radY) * Math.cos(radX),
    distancia * Math.sin(radX),
    distancia * Math.cos(radY) * Math.cos(radX)
  );

  const posicionDeseada = avatarGroup.position.clone().add(offset);

  camera.position.lerp(posicionDeseada, 0.2);
  cameraTarget.lerp(objetivoPunto, 0.25);
  camera.lookAt(cameraTarget);
}

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// LOOP DE RENDERIZADO
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.033);

  actualizarMixerForzado(cementerioMixer, delta);
  actualizarMixerForzado(mixerQuerubin, delta);
  actualizarMixerForzado(mixerCamina, delta);
  actualizarMixerForzado(mixerHora, delta);

  moverAvatar(delta);
  actualizarQuerubin();
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
