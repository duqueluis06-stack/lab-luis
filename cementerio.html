<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cementerio - Nivel 1</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 20;
      display: none;
    }
  </style>
</head>

<body>

<div id="loading">Cargando cementerio...</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// CONFIGURACIÓN Y PARÁMETROS
// --------------------------------------------------

const ESCALA_AVATAR = 3.5.0; // Cambiar si se requiere ajustar el tamaño de Luis

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

const LUIS_HORA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-hora.glb";

// --------------------------------------------------
// ESCENA, CÁMARA Y RENDERER
// --------------------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Bloquear interacciones accidentales fuera del canvas
renderer.domElement.addEventListener('click', (e) => e.preventDefault());
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// --------------------------------------------------
// LUCES
// --------------------------------------------------

const ambientLight = new THREE.HemisphereLight(0x8899aa, 0x111111, 1.2);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffffff, 1.0);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// --------------------------------------------------
// LOADERS
// --------------------------------------------------

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// VARIABLES GLOBALES
// --------------------------------------------------

let cementerio = null;
let cementerioMixer = null;

const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

let avatarHora = null;
let avatarCamina = null;

let mixerHora = null;
let mixerCamina = null;

const clock = new THREE.Clock();
const raycasterColision = new THREE.Raycaster();
const cameraTarget = new THREE.Vector3();

// Control de cámara con mouse
let arrastrandoMouse = false;
let anteriorMouseX = 0;
let anteriorMouseY = 0;
let anguloCamaraY = 0;
let anguloCamaraX = 15; // Elevación inicial en grados

// --------------------------------------------------
// EVENTOS DE MOUSE PARA CÁMARA
// --------------------------------------------------

window.addEventListener('mousedown', (e) => {
  if (e.button === 0) { // Clic izquierdo
    arrastrandoMouse = true;
    anteriorMouseX = e.clientX;
    anteriorMouseY = e.clientY;
  }
});

window.addEventListener('mouseup', () => {
  arrastrandoMouse = false;
});

window.addEventListener('mousemove', (e) => {
  if (!arrastrandoMouse) return;

  const deltaX = e.clientX - anteriorMouseX;
  const deltaY = e.clientY - anteriorMouseY;

  anguloCamaraY -= deltaX * 0.4;
  anguloCamaraX += deltaY * 0.3;

  // Limitar inclinación vertical
  anguloCamaraX = Math.max(-10, Math.min(75, anguloCamaraX));

  anteriorMouseX = e.clientX;
  anteriorMouseY = e.clientY;
});

// --------------------------------------------------
// CARGAR CEMENTERIO
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    cementerio = gltf.scene;
    scene.add(cementerio);

    // Cargar y reproducir en bucle continuo TODAS las animaciones presentes
    if (gltf.animations && gltf.animations.length > 0) {
      cementerioMixer = new THREE.AnimationMixer(cementerio);
      gltf.animations.forEach((clip) => {
        const action = cementerioMixer.clipAction(clip);
        action.reset();
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.repetitions = Infinity;
        action.clampWhenFinished = false;
        action.enabled = true;
        action.play();
      });
    }

    cargarAvatares();
  },
  function(xhr) {
    if (xhr.total) {
      const porcentaje = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById("loading").textContent = "Cargando cementerio... " + porcentaje + "%";
    }
  },
  function(error) {
    mostrarError("Error cargando cementerio: " + error);
  }
);

// --------------------------------------------------
// CARGAR AVATARES
// --------------------------------------------------

function cargarAvatares() {
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      avatarHora = gltfHora.scene;
      avatarHora.rotation.y = Math.PI; // Corregir dirección frontal
      
      if (gltfHora.animations.length > 0) {
        mixerHora = new THREE.AnimationMixer(avatarHora);
        const accionHora = mixerHora.clipAction(gltfHora.animations[0]);
        accionHora.setLoop(THREE.LoopRepeat, Infinity);
        accionHora.play();
      }

      avatarGroup.add(avatarHora);

      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          avatarCamina = gltfCamina.scene;
          avatarCamina.rotation.y = Math.PI; // Corregir dirección frontal

          if (gltfCamina.animations.length > 0) {
            mixerCamina = new THREE.AnimationMixer(avatarCamina);
            const accionCamina = mixerCamina.clipAction(gltfCamina.animations[0]);
            accionCamina.setLoop(THREE.LoopRepeat, Infinity);
            accionCamina.play();
          }

          avatarCamina.visible = false;
          avatarGroup.add(avatarCamina);

          avatarGroup.scale.setScalar(ESCALA_AVATAR);
          avatarGroup.position.set(0, 0.15, 0);

          cameraTarget.copy(avatarGroup.position);
          camera.position.set(0, 3, 7);

          document.getElementById("loading").style.display = "none";
        },
        undefined,
        function(error) {
          mostrarError("Error cargando luis-camina.glb: " + error);
        }
      );
    },
    undefined,
    function(error) {
      mostrarError("Error cargando luis-hora.glb: " + error);
    }
  );
}

// --------------------------------------------------
// TECLADO
// --------------------------------------------------

const teclas = {};

window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

// --------------------------------------------------
// DETECCIÓN DE COLISIONES
// --------------------------------------------------

function hayColision(paso) {
  if (!cementerio || !avatarGroup) return false;

  const dir = new THREE.Vector3();
  avatarGroup.getWorldDirection(dir);
  dir.negate(); 

  if (paso > 0) dir.negate(); 

  const origen = avatarGroup.position.clone();
  origen.y += 1.2; 

  raycasterColision.set(origen, dir);
  const impactos = raycasterColision.intersectObjects(cementerio.children, true);

  for (let i = 0; i < impactos.length; i++) {
    const impacto = impactos[i];

    // Ignorar suelos/techos
    if (impacto.face && Math.abs(impacto.face.normal.y) > 0.6) {
      continue;
    }

    if (impacto.distance < 1.0) {
      return true;
    }
  }

  return false;
}

// --------------------------------------------------
// MOVIMIENTO
// --------------------------------------------------

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const velocidadMov = 4.5;
  const velocidadRot = 2.5;
  let moviendo = false;

  if (teclas["KeyA"] || teclas["ArrowLeft"]) {
    avatarGroup.rotation.y += velocidadRot * delta;
  }

  if (teclas["KeyD"] || teclas["ArrowRight"]) {
    avatarGroup.rotation.y -= velocidadRot * delta;
  }

  if (teclas["KeyW"] || teclas["ArrowUp"]) {
    const paso = -velocidadMov * delta;
    if (!hayColision(paso)) {
      avatarGroup.translateZ(paso);
    }
    moviendo = true;
  }

  if (teclas["KeyS"] || teclas["ArrowDown"]) {
    const paso = velocidadMov * delta;
    if (!hayColision(paso)) {
      avatarGroup.translateZ(paso);
    }
    moviendo = true;
  }

  if (moviendo) {
    if (avatarHora) avatarHora.visible = false;
    if (avatarCamina) avatarCamina.visible = true;
    if (mixerCamina) mixerCamina.update(delta);
  } else {
    if (avatarHora) avatarHora.visible = true;
    if (avatarCamina) avatarCamina.visible = false;
    if (mixerHora) mixerHora.update(delta);
  }
}

// --------------------------------------------------
// CÁMARA CON ORBITADO POR MOUSE
// --------------------------------------------------

function seguirAvatar() {
  if (!avatarGroup) return;

  const objetivoPunto = avatarGroup.position.clone();
  objetivoPunto.y += 2.0;

  const distancia = 8.0;
  const radY = THREE.MathUtils.degToRad(anguloCamaraY);
  const radX = THREE.MathUtils.degToRad(anguloCamaraX);

  // Calcular la posición orbital alrededor del avatar
  const offset = new THREE.Vector3(
    distancia * Math.sin(radY) * Math.cos(radX),
    distancia * Math.sin(radX),
    distancia * Math.cos(radY) * Math.cos(radX)
  );

  // Orientar offset relativo a la rotación del avatar
  offset.applyQuaternion(avatarGroup.quaternion);

  const posicionDeseada = avatarGroup.position.clone().add(offset);

  camera.position.lerp(posicionDeseada, 0.1);
  cameraTarget.lerp(objetivoPunto, 0.1);
  camera.lookAt(cameraTarget);
}

// --------------------------------------------------
// MOSTRAR ERROR
// --------------------------------------------------

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE PRINCIPAL
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (cementerioMixer) cementerioMixer.update(delta);

  moverAvatar(delta);
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

// --------------------------------------------------
// REDIMENSIONADO DE VENTANA
// --------------------------------------------------

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
