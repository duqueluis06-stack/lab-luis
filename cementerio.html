<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --------------------------------------------------
// CONFIGURACIÓN Y CONSTANTES
// --------------------------------------------------

const ESCALA_AVATAR = 2.0;
const OFFSET_PIES = 0.0; 

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const QUERUBIN_URL =

  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/audio/music-cementerio.mp3";

// --------------------------------------------------
// INICIALIZACIÓN
// --------------------------------------------------

const bgMusic = new Audio(MUSICA_URL);
bgMusic.loop = true;
bgMusic.volume = 0.45;

function iniciarJuego() {
  bgMusic.play().catch(() => {});

document.getElementById("loading").addEventListener("click", iniciarJuego);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d14);

const camera = new THREE.PerspectiveCamera(

const renderer = new THREE.WebGLRenderer({

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));

// ILUMINACIÓN GENERAL Y LUNAR

let avatarCamina = null;

let mixerCamina = null;

let actionCamina = null;

const raycasterPiso = new THREE.Raycaster();
const raycasterPared = new THREE.Raycaster();
const raycasterCamara = new THREE.Raycaster();
const dirAbajo = new THREE.Vector3(0, -1, 0);

const cameraTarget = new THREE.Vector3();

// Vectores reutilizables globales
const vecOrigenPiso = new THREE.Vector3();
const vecOrigenPared = new THREE.Vector3();
const vecMovimiento = new THREE.Vector3();
const vecForward = new THREE.Vector3();
const vecRight = new THREE.Vector3();
const targetQuerubin = new THREE.Vector3();
const vecRayDir = new THREE.Vector3();
const normalMundo = new THREE.Vector3();
const vecEjeY = new THREE.Vector3(0, 1, 0);
const vecSlideX = new THREE.Vector3();
const vecSlideZ = new THREE.Vector3();
const vecObjetivoPunto = new THREE.Vector3();
const vecOffsetCam = new THREE.Vector3();
const vecPosDeseadaCam = new THREE.Vector3();

let anguloCamaraY = 0;
let anguloCamaraX = 20;

const joystickInput = { x: 0, y: 0 };

// --------------------------------------------------
// CONTROLES
// --------------------------------------------------

const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

let joystickTouchId = null;
let cameraTouchId = null;
let touchStartX = 0;
let touchStartY = 0;

joystickZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (joystickTouchId === null) {
      joystickTouchId = touch.identifier;
      actualizarJoystick(touch);
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      actualizarJoystick(touch);
    } else if (touch.identifier === cameraTouchId) {
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      anguloCamaraY -= deltaX * 0.35;
      anguloCamaraX += deltaY * 0.25;
      anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));

      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joystickInput.x = 0;
      joystickInput.y = 0;
      joystickKnob.style.transform = `translate(0px, 0px)`;
    } else if (touch.identifier === cameraTouchId) {
      cameraTouchId = null;
    }
  }
});

window.addEventListener('touchstart', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.clientX > window.innerWidth / 2 && cameraTouchId === null) {
      cameraTouchId = touch.identifier;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
  }
});

function actualizarJoystick(touch) {
  const rect = joystickZone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = touch.clientX - centerX;
  let dy = touch.clientY - centerY;

  const maxRadio = rect.width / 2;
  const dist = Math.hypot(dx, dy);

  if (dist > maxRadio) {
    dx = (dx / dist) * maxRadio;
    dy = (dy / dist) * maxRadio;
  }

  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joystickInput.x = dx / maxRadio;
  joystickInput.y = dy / maxRadio;
}

let arrastrandoMouse = false;
let anteriorMouseX = 0;
let anteriorMouseY = 0;

window.addEventListener('mousedown', (e) => {
  if (e.clientX > 180 || e.clientY < window.innerHeight - 180) {
    arrastrandoMouse = true;
    anteriorMouseX = e.clientX;
    anteriorMouseY = e.clientY;
  }
});
window.addEventListener('mouseup', () => { arrastrandoMouse = false; });
window.addEventListener('mousemove', (e) => {
  if (!arrastrandoMouse) return;
  anguloCamaraY -= (e.clientX - anteriorMouseX) * 0.25;
  anguloCamaraX += (e.clientY - anteriorMouseY) * 0.18;
  anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));
  anteriorMouseX = e.clientX;
  anteriorMouseY = e.clientY;
});

// --------------------------------------------------
// FILTRADO ESPACIAL Y COLISIONES AJUSTADAS
// --------------------------------------------------

function obtenerNombreJerarquia(obj) {
  let cadena = "";
  let actual = obj;
  while (actual) {
    if (actual.name) cadena += " " + actual.name;
    actual = actual.parent;
  }
  return cadena.toLowerCase();
}

function registrarMeshesEscenario(root) {
  root.updateMatrixWorld(true);
  const worldScale = new THREE.Vector3();

  root.traverse((child) => {
    if (child.isMesh) {
      const jer = obtenerNombreJerarquia(child);
      
      const esVegetacion = jer.includes("planta") || jer.includes("palmera") || jer.includes("hoja") || jer.includes("plant");

      if (!jer.includes("niebla") && !jer.includes("fog") && !jer.includes("cielo") && !jer.includes("sky") && !esVegetacion) {
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => { m.side = THREE.DoubleSide; });
          } else {
            child.material.side = THREE.DoubleSide;
          }
        }
        
        if (!child.geometry.boundingSphere) {
          child.geometry.computeBoundingSphere();
        }

        const localCenter = child.geometry.boundingSphere.center.clone();
        child.userData.worldCenter = localCenter.applyMatrix4(child.matrixWorld);

        child.getWorldScale(worldScale);
        const maxScale = Math.max(worldScale.x, worldScale.y, worldScale.z);
        child.userData.radius = (child.geometry.boundingSphere.radius || 10) * maxScale;

        todosLosMeshes.push(child);
      }
    }
  });
}

function obtenerMeshesCercanos(posicion, radio = 25) {
  candidatosCercanos.length = 0;
  for (let i = 0; i < todosLosMeshes.length; i++) {
    const mesh = todosLosMeshes[i];
    const center = mesh.userData.worldCenter;
    const r = mesh.userData.radius || 10;
    const maxDistSq = (radio + r) * (radio + r);
    if (posicion.distanceToSquared(center) <= maxDistSq) {
      candidatosCercanos.push(mesh);
    }
  }
  return candidatosCercanos;
}

function posicionarEnPasilloGotico() {
  if (!cementerio) return;

  let pasilloObj = null;

  cementerio.traverse((child) => {
    const jer = obtenerNombreJerarquia(child);
    if ((jer.includes("gotico") || jer.includes("pasillo")) && child.isMesh) {
      if (!pasilloObj) pasilloObj = child;
    }
  });

  if (pasilloObj) {
    pasilloObj.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(pasilloObj);
    const center = new THREE.Vector3();
    box.getCenter(center);

    avatarGroup.position.set(center.x, box.min.y + 0.1, center.z);
    avatarGroup.rotation.y = Math.PI; 

    ajustarAlturaSuelo();
  }
}

// --------------------------------------------------
// BUCLE CONTINUO DE ANIMACIONES
// --------------------------------------------------

function crearYEjecutarMixer(gltf, rootObject, velocidadAnimacion = 1.0, esAvatar = false) {
  if (esAvatar) {
    rootObject.traverse((child) => {
      if (child.isMesh) child.frustumCulled = false;
    });
  }

  if (!gltf.animations || gltf.animations.length === 0) return { mixer: null, action: null };

  const mixer = new THREE.AnimationMixer(rootObject);
  
  gltf.animations.forEach((clip) => {
    const action = mixer.clipAction(clip);
    action.stop();
    action.reset();
    action.setLoop(THREE.LoopRepeat, Infinity);
    action.clampWhenFinished = false;
    action.zeroSlopeAtEnd = false;
    action.enabled = true;
    action.timeScale = velocidadAnimacion;
    action.play();
  });

  const primeraAction = mixer.clipAction(gltf.animations[0]);
  return { mixer, action: primeraAction };
}

// --------------------------------------------------
// CARGA DE MODELOS
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    try {
      cementerio = gltf.scene;
      scene.add(cementerio);
      cementerio.updateMatrixWorld(true);

      todosLosMeshes.length = 0;
      registrarMeshesEscenario(cementerio);

      if (gltf.animations && gltf.animations.length > 0) {
        const res = crearYEjecutarMixer(gltf, cementerio, 1.0, false);
        cementerioMixer = res.mixer;
      }
    } catch (e) {
      console.warn("Aviso cementerio:", e);
    }

    cargarQuerubin();
  },
  undefined,
  function(error) { mostrarError("Error en inframundo: " + error); }
);

function cargarQuerubin() {
  loader.load(
    QUERUBIN_URL,
    function(gltfQuerubin) {
      try {
        querubinMesh = gltfQuerubin.scene;
        querubinMesh.scale.setScalar(3.5);
        querubinMesh.rotation.set(0, -Math.PI / 2, 0);

        querubinMesh.traverse((child) => {
          if (child.isMesh) {
            child.frustumCulled = false;
            if (child.material) {
              child.material.roughness = 0.35;
              child.material.metalness = 0.3;

              if (child.material.emissive) {
                child.material.emissive.setHex(0x3a0d05);
                child.material.emissiveIntensity = 0.5;
              }
            }
          }
        });

        querubinGroup.add(querubinMesh);

        const luzCoreOjo = new THREE.PointLight(0xff3300, 3.5, 20);
        luzCoreOjo.position.set(0, 0, 0);
        querubinGroup.add(luzCoreOjo);

        const luzAuraAnillos = new THREE.PointLight(0xff9900, 2.0, 35);
        luzAuraAnillos.position.set(0, 1, 0);
        querubinGroup.add(luzAuraAnillos);

        if (gltfQuerubin.animations && gltfQuerubin.animations.length > 0) {
          const res = crearYEjecutarMixer(gltfQuerubin, querubinMesh, 1.0, true);
          mixerQuerubin = res.mixer;
        }
      } catch (e) {
        console.warn("Aviso querubin:", e);
      }

      cargarAvatares();
    },
    undefined,
    function(error) {
      console.warn("Error querubin:", error);
      cargarAvatares();
    }
  );
}

function cargarAvatares() {
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      try {
        avatarHora = gltfHora.scene;
        const resH = crearYEjecutarMixer(gltfHora, avatarHora, 1.0, true);
        mixerHora = resH.mixer;
        actionHora = resH.action;
        avatarGroup.add(avatarHora);
      } catch (e) {
        console.warn("Aviso avatar hora:", e);
      }

      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          try {
            avatarCamina = gltfCamina.scene;
            const resC = crearYEjecutarMixer(gltfCamina, avatarCamina, 1.1, true);
            mixerCamina = resC.mixer;
            actionCamina = resC.action;

            avatarCamina.visible = false;
            avatarGroup.add(avatarCamina);

            avatarGroup.scale.setScalar(ESCALA_AVATAR);
            
            posicionarEnPasilloGotico();

            cameraTarget.copy(avatarGroup.position);
            camera.position.set(0, 2, 5);
          } catch (e) {
            console.warn("Aviso avatar camina:", e);
          }

          document.getElementById("loading-text").textContent = "> CONEXIÓN ESTABLECIDA: Viaje al Inframundo Listo";
          document.getElementById("start-btn").style.display = "inline-block";
        },
        undefined,
        function(error) { mostrarError("Error avatar camina: " + error); }
      );
    },
    undefined,
    function(error) { mostrarError("Error avatar hora: " + error); }
  );
}

// --------------------------------------------------
// FÍSICAS Y CAÍDA POR GRAVEDAD
// --------------------------------------------------

const teclas = {};
window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

function ajustarAlturaSuelo() {
  if (todosLosMeshes.length === 0 || !avatarGroup) return;

  // Evaluamos directamente todosLosMeshes para detectar siempre el piso inferior
  vecOrigenPiso.copy(avatarGroup.position);
  vecOrigenPiso.y += 2.0;

  raycasterPiso.set(vecOrigenPiso, dirAbajo);
  raycasterPiso.far = 300.0; // Largo alcance para caídas de gran altura

  const impactos = raycasterPiso.intersectObjects(todosLosMeshes, false);

  let mejorY = -Infinity;
  let encontrado = false;

  for (let i = 0; i < impactos.length; i++) {
    const hit = impactos[i];
    if (!hit.face) continue;

    normalMundo.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);

    // Considerar planos caminables
    if (normalMundo.y > 0.2) {
      if (hit.point.y <= avatarGroup.position.y + 2.2) {
        if (hit.point.y > mejorY) {
          mejorY = hit.point.y;
          encontrado = true;
        }
      }
    }
  }

  if (encontrado) {
    const alturaObjetivo = mejorY + OFFSET_PIES;
    const diff = alturaObjetivo - avatarGroup.position.y;
    
    if (Math.abs(diff) > 0.005) {
      // Si la distancia es grande (precipicio), cae rápidamente
      const factorLerp = diff < -0.8 ? 0.6 : (diff > 0 ? 0.4 : 0.25); 
      avatarGroup.position.y += diff * factorLerp;
    }
  } else {
    // Si camina hacia el vacío total (sin mesh debajo), la gravedad lo hace caer
    avatarGroup.position.y -= 0.5;
    if (avatarGroup.position.y < 0) avatarGroup.position.y = 0;
  }
}

function hayColisionPared(dirMovimiento, pasoDistancia) {
  if (todosLosMeshes.length === 0 || !avatarGroup) return false;

  const candidatos = obtenerMeshesCercanos(avatarGroup.position, 5);
  if (candidatos.length === 0) return false;

  const posAv = avatarGroup.position;
  const alturas = [0.8, 1.6];
  const angulosRayos = [0, -0.35, 0.35];

  for (let h = 0; h < alturas.length; h++) {
    vecOrigenPared.copy(posAv);
    vecOrigenPared.y += alturas[h];

    for (let i = 0; i < angulosRayos.length; i++) {
      vecRayDir.copy(dirMovimiento).applyAxisAngle(vecEjeY, angulosRayos[i]);
      raycasterPared.set(vecOrigenPared, vecRayDir);
      
      raycasterPared.far = 0.38 + pasoDistancia;

      const impactos = raycasterPared.intersectObjects(candidatos, false);
      for (let j = 0; j < impactos.length; j++) {
        const hit = impactos[j];
        if (!hit.face) continue;

        normalMundo.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);

        if (Math.abs(normalMundo.y) < 0.65) {
          return true;
        }
      }
    }
  }

  return false;
}

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const radCamY = THREE.MathUtils.degToRad(anguloCamaraY);

  vecForward.set(-Math.sin(radCamY), 0, -Math.cos(radCamY));
  vecRight.set(Math.cos(radCamY), 0, -Math.sin(radCamY));

  vecMovimiento.set(0, 0, 0);

  if (Math.abs(joystickInput.x) > 0.05 || Math.abs(joystickInput.y) > 0.05) {
    vecMovimiento.addScaledVector(vecRight, joystickInput.x);
    vecMovimiento.addScaledVector(vecForward, -joystickInput.y);
  }

  if (teclas["KeyW"] || teclas["ArrowUp"]) vecMovimiento.add(vecForward);
  if (teclas["KeyS"] || teclas["ArrowDown"]) vecMovimiento.addScaledVector(vecForward, -1);
  if (teclas["KeyD"] || teclas["ArrowRight"]) vecMovimiento.addScaledVector(vecRight, 1);
  if (teclas["KeyA"] || teclas["ArrowLeft"]) vecMovimiento.addScaledVector(vecRight, -1);

  const moviendo = vecMovimiento.lengthSq() > 0.001;

  if (moviendo) {
    vecMovimiento.normalize();
    const velocidadMov = 6.2;

    const anguloObjetivo = Math.atan2(vecMovimiento.x, vecMovimiento.z);
    let diff = anguloObjetivo - avatarGroup.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    avatarGroup.rotation.y += diff * Math.min(1.0, delta * 15.0);

    const paso = velocidadMov * delta;

    if (!hayColisionPared(vecMovimiento, paso)) {
      avatarGroup.position.addScaledVector(vecMovimiento, paso);
    } else {
      vecSlideX.set(vecMovimiento.x, 0, 0).normalize();
      if (Math.abs(vecMovimiento.x) > 0.1 && !hayColisionPared(vecSlideX, paso * Math.abs(vecMovimiento.x))) {
        avatarGroup.position.addScaledVector(vecSlideX, paso * Math.abs(vecMovimiento.x));
      } else {
        vecSlideZ.set(0, 0, vecMovimiento.z).normalize();
        if (Math.abs(vecMovimiento.z) > 0.1 && !hayColisionPared(vecSlideZ, paso * Math.abs(vecMovimiento.z))) {
          avatarGroup.position.addScaledVector(vecSlideZ, paso * Math.abs(vecMovimiento.z));
        }
      }
    }

    if (!estaCaminando) {
      if (avatarHora) avatarHora.visible = false;
      if (avatarCamina) avatarCamina.visible = true;
      if (actionCamina) { actionCamina.reset(); actionCamina.play(); }
      estaCaminando = true;
    }

  } else {
    if (estaCaminando) {
      if (avatarHora) avatarHora.visible = true;
      if (avatarCamina) avatarCamina.visible = false;
      if (actionHora) { actionHora.reset(); actionHora.play(); }
      estaCaminando = false;
    }
  }

  ajustarAlturaSuelo();
}

function actualizarQuerubin() {
  if (!querubinGroup || !avatarGroup) return;

  avatarGroup.getWorldPosition(targetQuerubin);
  targetQuerubin.y += 1.0; 

  querubinGroup.lookAt(targetQuerubin);
}

function seguirAvatar() {
  if (!avatarGroup) return;

  vecObjetivoPunto.copy(avatarGroup.position);
  vecObjetivoPunto.y += 1.2 * ESCALA_AVATAR;

  let distancia = 3.5 * ESCALA_AVATAR;
  const radY = THREE.MathUtils.degToRad(anguloCamaraY);
  const radX = THREE.MathUtils.degToRad(anguloCamaraX);

  vecOffsetCam.set(
    distancia * Math.sin(radY) * Math.cos(radX),
    distancia * Math.sin(radX),
    distancia * Math.cos(radY) * Math.cos(radX)
  );

  vecPosDeseadaCam.copy(avatarGroup.position).add(vecOffsetCam);

  const dirCamara = new THREE.Vector3().subVectors(vecPosDeseadaCam, vecObjetivoPunto).normalize();
  raycasterCamara.set(vecObjetivoPunto, dirCamara);
  raycasterCamara.far = distancia;

  const candidatos = obtenerMeshesCercanos(avatarGroup.position, 15);
  const impactos = raycasterCamara.intersectObjects(candidatos, false);

  if (impactos.length > 0) {
    const distColision = impactos[0].distance - 0.3;
    if (distColision > 0.5) {
      vecPosDeseadaCam.copy(vecObjetivoPunto).addScaledVector(dirCamara, distColision);
    }
  }

  camera.position.lerp(vecPosDeseadaCam, 0.25);
  cameraTarget.lerp(vecObjetivoPunto, 0.3);
  camera.lookAt(cameraTarget);
}

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE DE RENDER
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.1);

  if (cementerioMixer) {
    cementerioMixer.update(delta);
    if (cementerioMixer.time > 35.0) cementerioMixer.setTime(0);
  }
  if (mixerQuerubin) {
    mixerQuerubin.update(delta);
    if (mixerQuerubin.time > 35.0) mixerQuerubin.setTime(0);
  }
  if (mixerCamina && estaCaminando) mixerCamina.update(delta);
  if (mixerHora && !estaCaminando) mixerHora.update(delta);

  moverAvatar(delta);
  actualizarQuerubin();
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
