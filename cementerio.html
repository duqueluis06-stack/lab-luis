<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inframundo</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 1.2rem;
      z-index: 30;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    #start-btn {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 1rem;
      background: #2a3d52;
      color: #fff;
      border: 1px solid #4a6585;
      border-radius: 6px;
      display: none;
      cursor: pointer;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 40;
      display: none;
    }

    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      touch-action: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #joystick-knob {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.05s linear;
      pointer-events: none;
    }

    @media (pointer: fine) {
      #joystick-zone {
        display: none !important;
      }
    }
  </style>
</head>

<body>

<div id="loading">
  <div id="loading-text">Viajando al Inframundo...</div>
  <button id="start-btn">▶ ENTRAR AL INFRAMUNDO</button>
</div>

<div id="error"></div>

<div id="joystick-zone">
  <div id="joystick-knob"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// CONFIGURACIÓN Y CONSTANTES
// --------------------------------------------------

const ESCALA_AVATAR = 2.0;
const OFFSET_PIES = 0.0; 

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const QUERUBIN_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/querubin.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

const LUIS_HORA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-hora.glb";

const MUSICA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/audio/music-cementerio.mp3";

// --------------------------------------------------
// INICIALIZACIÓN
// --------------------------------------------------

const bgMusic = new Audio(MUSICA_URL);
bgMusic.loop = true;
bgMusic.volume = 0.45;

function iniciarJuego() {
  bgMusic.play().catch(() => {});
  document.getElementById("loading").style.display = "none";
}

document.getElementById("loading").addEventListener("click", iniciarJuego);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040408);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  2500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.HemisphereLight(0x8899bb, 0x222233, 1.6);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xddeeff, 1.4);
moonLight.position.set(50, 150, 50);
scene.add(moonLight);

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// OBJETOS Y GRUPOS
// --------------------------------------------------

let cementerio = null;
let cementerioMixer = null;

const querubinGroup = new THREE.Group();
scene.add(querubinGroup);
querubinGroup.position.set(-170, 140, -170);

let querubinMesh = null;
let mixerQuerubin = null;

const pisoColisionables = [];
const paredColisionables = [];

const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

let avatarHora = null;
let avatarCamina = null;

let mixerHora = null;
let mixerCamina = null;
let actionHora = null;
let actionCamina = null;

let estaCaminando = false;

const clock = new THREE.Clock();
const raycasterPiso = new THREE.Raycaster();
const raycasterPared = new THREE.Raycaster();
const dirAbajo = new THREE.Vector3(0, -1, 0);

const cameraTarget = new THREE.Vector3();

const vecOrigenPiso = new THREE.Vector3();
const vecOrigenPared = new THREE.Vector3();
const vecMovimiento = new THREE.Vector3();
const vecForward = new THREE.Vector3();
const vecRight = new THREE.Vector3();
const targetQuerubin = new THREE.Vector3();
const vecRayDir = new THREE.Vector3();

let anguloCamaraY = 0;
let anguloCamaraX = 20;

const joystickInput = { x: 0, y: 0 };

// --------------------------------------------------
// INTERFAZ Y CONTROLES
// --------------------------------------------------

const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

let joystickTouchId = null;
let cameraTouchId = null;
let touchStartX = 0;
let touchStartY = 0;

joystickZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (joystickTouchId === null) {
      joystickTouchId = touch.identifier;
      actualizarJoystick(touch);
    }
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      actualizarJoystick(touch);
    } else if (touch.identifier === cameraTouchId) {
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      anguloCamaraY -= deltaX * 0.35;
      anguloCamaraX += deltaY * 0.25;
      anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));

      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joystickInput.x = 0;
      joystickInput.y = 0;
      joystickKnob.style.transform = `translate(0px, 0px)`;
    } else if (touch.identifier === cameraTouchId) {
      cameraTouchId = null;
    }
  }
});

window.addEventListener('touchstart', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.clientX > window.innerWidth / 2 && cameraTouchId === null) {
      cameraTouchId = touch.identifier;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }
  }
});

function actualizarJoystick(touch) {
  const rect = joystickZone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = touch.clientX - centerX;
  let dy = touch.clientY - centerY;

  const maxRadio = rect.width / 2;
  const dist = Math.hypot(dx, dy);

  if (dist > maxRadio) {
    dx = (dx / dist) * maxRadio;
    dy = (dy / dist) * maxRadio;
  }

  joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joystickInput.x = dx / maxRadio;
  joystickInput.y = dy / maxRadio;
}

let arrastrandoMouse = false;
let anteriorMouseX = 0;
let anteriorMouseY = 0;

window.addEventListener('mousedown', (e) => {
  if (e.clientX > 180 || e.clientY < window.innerHeight - 180) {
    arrastrandoMouse = true;
    anteriorMouseX = e.clientX;
    anteriorMouseY = e.clientY;
  }
});
window.addEventListener('mouseup', () => { arrastrandoMouse = false; });
window.addEventListener('mousemove', (e) => {
  if (!arrastrandoMouse) return;
  anguloCamaraY -= (e.clientX - anteriorMouseX) * 0.25;
  anguloCamaraX += (e.clientY - anteriorMouseY) * 0.18;
  anguloCamaraX = Math.max(5, Math.min(70, anguloCamaraX));
  anteriorMouseX = e.clientX;
  anteriorMouseY = e.clientY;
});

// --------------------------------------------------
// CLASIFICACIÓN DE OBJETOS Y POSICIONAMIENTO
// --------------------------------------------------

function obtenerNombreJerarquia(obj) {
  let cadena = "";
  let actual = obj;
  while (actual) {
    if (actual.name) cadena += " " + actual.name;
    actual = actual.parent;
  }
  return cadena.toLowerCase();
}

function clasificarObjeto(obj) {
  if (!obj || !obj.isMesh) return;

  const jerarquia = obtenerNombreJerarquia(obj);

  if (jerarquia.includes("niebla") || jerarquia.includes("fog") || jerarquia.includes("cielo") || jerarquia.includes("sky")) {
    return;
  }

  if (obj.material) {
    if (Array.isArray(obj.material)) {
      obj.material.forEach(m => { m.side = THREE.DoubleSide; });
    } else {
      obj.material.side = THREE.DoubleSide;
    }
  }

  const esTecho = jerarquia.includes("techo") || jerarquia.includes("roof") || jerarquia.includes("ceiling");

  const esSueloPuro = !esTecho && (
    jerarquia.includes("base-cesped") ||
    jerarquia.includes("cesped") ||
    jerarquia.includes("grid") ||
    jerarquia.includes("vereda") ||
    jerarquia.includes("camino") ||
    jerarquia.includes("pasto") ||
    jerarquia.includes("terreno") ||
    jerarquia.includes("suelo") ||
    jerarquia.includes("piso") ||
    jerarquia.includes("baldosa") ||
    jerarquia.includes("tile") ||
    jerarquia.includes("escalera") ||
    jerarquia.includes("escalon") ||
    jerarquia.includes("stair") ||
    jerarquia.includes("step") ||
    jerarquia.includes("floor") ||
    jerarquia.includes("ground") ||
    jerarquia.includes("gotico") ||
    jerarquia.includes("pasillo")
  );

  if (esSueloPuro) {
    pisoColisionables.push(obj);
  }

  const esParedEstructura = !jerarquia.includes("base-cesped") && !jerarquia.includes("cesped") && !jerarquia.includes("pasto");

  if (esParedEstructura) {
    obj.updateMatrixWorld(true);
    obj.userData.boxWorld = new THREE.Box3().setFromObject(obj);
    paredColisionables.push(obj);
  }
}

function posicionarEnPasilloGotico() {
  if (!cementerio) return;

  let pasilloObj = null;

  cementerio.traverse((child) => {
    const jer = obtenerNombreJerarquia(child);
    if ((jer.includes("gotico") || jer.includes("pasillo")) && child.isMesh) {
      if (!pasilloObj) pasilloObj = child;
    }
  });

  if (pasilloObj) {
    const box = new THREE.Box3().setFromObject(pasilloObj);
    const center = new THREE.Vector3();
    box.getCenter(center);

    // Posicionamiento en el fondo inferior de las escaleras (extremo Z min)
    avatarGroup.position.set(center.x, box.min.y + 0.1, box.min.z + 4.0);
    avatarGroup.rotation.y = Math.PI; // Mirando hacia la subida de las escaleras

    ajustarAlturaSuelo();
  }
}

// --------------------------------------------------
// BUCLE CONTINUO DE ANIMACIONES
// --------------------------------------------------

function crearYEjecutarMixer(gltf, rootObject, velocidadAnimacion = 1.0) {
  rootObject.traverse((child) => {
    if (child.isMesh) child.frustumCulled = false;
  });

  if (!gltf.animations || gltf.animations.length === 0) return { mixer: null, action: null };

  const mixer = new THREE.AnimationMixer(rootObject);
  
  gltf.animations.forEach((clip) => {
    const action = mixer.clipAction(clip);
    action.stop();
    action.reset();
    action.setLoop(THREE.LoopRepeat, Infinity);
    action.clampWhenFinished = false;
    action.zeroSlopeAtEnd = false;
    action.enabled = true;
    action.timeScale = velocidadAnimacion;
    action.play();
  });

  const primeraAction = mixer.clipAction(gltf.animations[0]);
  return { mixer, action: primeraAction };
}

// --------------------------------------------------
// CARGA DE MODELOS
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    try {
      cementerio = gltf.scene;
      scene.add(cementerio);
      cementerio.updateMatrixWorld(true);

      pisoColisionables.length = 0;
      paredColisionables.length = 0;

      cementerio.traverse((child) => { clasificarObjeto(child); });

      if (gltf.animations && gltf.animations.length > 0) {
        const res = crearYEjecutarMixer(gltf, cementerio, 1.0);
        cementerioMixer = res.mixer;
      }
    } catch (e) {
      console.warn("Aviso cementerio:", e);
    }

    cargarQuerubin();
  },
  undefined,
  function(error) { mostrarError("Error en inframundo: " + error); }
);

function cargarQuerubin() {
  loader.load(
    QUERUBIN_URL,
    function(gltfQuerubin) {
      try {
        querubinMesh = gltfQuerubin.scene;
        querubinMesh.scale.setScalar(3.5);

        querubinMesh.rotation.set(0, -Math.PI / 2, 0);

        querubinMesh.traverse((child) => {
          if (child.isMesh) {
            child.frustumCulled = false;
            if (child.material) {
              child.material.roughness = 0.3;
              child.material.metalness = 0.1;
            }
          }
        });

        querubinGroup.add(querubinMesh);

        const ojoMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const ojoGeometria = new THREE.SphereGeometry(0.5, 16, 16);
        const ojoUnico = new THREE.Mesh(ojoGeometria, ojoMaterial);
        ojoUnico.position.set(0, -0.2, 1.2); 
        querubinGroup.add(ojoUnico);

        const luzIrisUnica = new THREE.PointLight(0x00ffff, 12, 30);
        luzIrisUnica.position.copy(ojoUnico.position);
        querubinGroup.add(luzIrisUnica);

        if (gltfQuerubin.animations && gltfQuerubin.animations.length > 0) {
          const res = crearYEjecutarMixer(gltfQuerubin, querubinMesh, 1.0);
          mixerQuerubin = res.mixer;
        }
      } catch (e) {
        console.warn("Aviso querubin:", e);
      }

      cargarAvatares();
    },
    undefined,
    function(error) {
      console.warn("Error querubin:", error);
      cargarAvatares();
    }
  );
}

function cargarAvatares() {
  loader.load(
    LUIS_HORA_URL,
    function(gltfHora) {
      try {
        avatarHora = gltfHora.scene;
        const resH = crearYEjecutarMixer(gltfHora, avatarHora, 1.0);
        mixerHora = resH.mixer;
        actionHora = resH.action;
        avatarGroup.add(avatarHora);
      } catch (e) {
        console.warn("Aviso avatar hora:", e);
      }

      loader.load(
        LUIS_CAMINA_URL,
        function(gltfCamina) {
          try {
            avatarCamina = gltfCamina.scene;
            const resC = crearYEjecutarMixer(gltfCamina, avatarCamina, 1.1);
            mixerCamina = resC.mixer;
            actionCamina = resC.action;

            avatarCamina.visible = false;
            avatarGroup.add(avatarCamina);

            avatarGroup.scale.setScalar(ESCALA_AVATAR);
            
            posicionarEnPasilloGotico();

            cameraTarget.copy(avatarGroup.position);
            camera.position.set(0, 2, 5);
          } catch (e) {
            console.warn("Aviso avatar camina:", e);
          }

          document.getElementById("loading-text").textContent = "Viaje al Inframundo Listo";
          document.getElementById("start-btn").style.display = "inline-block";
        },
        undefined,
        function(error) { mostrarError("Error avatar camina: " + error); }
      );
    },
    undefined,
    function(error) { mostrarError("Error avatar hora: " + error); }
  );
}

// --------------------------------------------------
// FÍSICAS Y COLISIONES DE PARED
// --------------------------------------------------

const teclas = {};
window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

function ajustarAlturaSuelo() {
  if (pisoColisionables.length === 0 || !avatarGroup) return;

  vecOrigenPiso.copy(avatarGroup.position);
  vecOrigenPiso.y += 1.8; 

  raycasterPiso.set(vecOrigenPiso, dirAbajo);
  raycasterPiso.far = 6.0;

  const impactos = raycasterPiso.intersectObjects(pisoColisionables, false);

  let mejorImpacto = null;
  for (let i = 0; i < impactos.length; i++) {
    const hitY = impactos[i].point.y;
    if (hitY <= avatarGroup.position.y + 1.2) {
      if (!mejorImpacto || hitY > mejorImpacto.point.y) {
        mejorImpacto = impactos[i];
      }
    }
  }

  if (mejorImpacto) {
    const alturaObjetivo = mejorImpacto.point.y + OFFSET_PIES;
    avatarGroup.position.y = THREE.MathUtils.lerp(avatarGroup.position.y, alturaObjetivo, 0.35);
  }
}

function hayColisionPared(dirMovimiento, pasoDistancia) {
  if (paredColisionables.length === 0 || !avatarGroup) return false;

  const posAv = avatarGroup.position;
  const paredesCercanas = [];

  // Detección por proximidad exacta de la caja de colisión del muro
  for (let i = 0; i < paredColisionables.length; i++) {
    const p = paredColisionables[i];
    if (p.userData.boxWorld && p.userData.boxWorld.distanceToPoint(posAv) < 2.5) {
      paredesCercanas.push(p);
    }
  }

  if (paredesCercanas.length === 0) return false;

  const alturas = [0.5, 1.2];
  const angulosRayos = [0, -0.5, 0.5, -1.0, 1.0];

  for (let h = 0; h < alturas.length; h++) {
    vecOrigenPared.copy(posAv);
    vecOrigenPared.y += alturas[h];

    for (let i = 0; i < angulosRayos.length; i++) {
      vecRayDir.copy(dirMovimiento).applyAxisAngle(new THREE.Vector3(0, 1, 0), angulosRayos[i]);
      raycasterPared.set(vecOrigenPared, vecRayDir);
      raycasterPared.far = 0.85 + pasoDistancia;

      const impactos = raycasterPared.intersectObjects(paredesCercanas, false);
      if (impactos.length > 0) return true;
    }
  }

  return false;
}

function moverAvatar(delta) {
  if (!avatarGroup || (!avatarHora && !avatarCamina)) return;

  const radCamY = THREE.MathUtils.degToRad(anguloCamaraY);

  vecForward.set(-Math.sin(radCamY), 0, -Math.cos(radCamY));
  vecRight.set(Math.cos(radCamY), 0, -Math.sin(radCamY));

  vecMovimiento.set(0, 0, 0);

  if (Math.abs(joystickInput.x) > 0.05 || Math.abs(joystickInput.y) > 0.05) {
    vecMovimiento.addScaledVector(vecRight, joystickInput.x);
    vecMovimiento.addScaledVector(vecForward, -joystickInput.y);
  }

  if (teclas["KeyW"] || teclas["ArrowUp"]) vecMovimiento.add(vecForward);
  if (teclas["KeyS"] || teclas["ArrowDown"]) vecMovimiento.addScaledVector(vecForward, -1);
  if (teclas["KeyD"] || teclas["ArrowRight"]) vecMovimiento.addScaledVector(vecRight, 1);
  if (teclas["KeyA"] || teclas["ArrowLeft"]) vecMovimiento.addScaledVector(vecRight, -1);

  const moviendo = vecMovimiento.lengthSq() > 0.001;

  if (moviendo) {
    vecMovimiento.normalize();
    const velocidadMov = 6.2;

    const anguloObjetivo = Math.atan2(vecMovimiento.x, vecMovimiento.z);
    let diff = anguloObjetivo - avatarGroup.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    avatarGroup.rotation.y += diff * Math.min(1.0, delta * 15.0);

    const paso = velocidadMov * delta;

    if (!hayColisionPared(vecMovimiento, paso)) {
      avatarGroup.position.addScaledVector(vecMovimiento, paso);
    }

    if (!estaCaminando) {
      if (avatarHora) avatarHora.visible = false;
      if (avatarCamina) avatarCamina.visible = true;
      if (actionCamina) { actionCamina.reset(); actionCamina.play(); }
      estaCaminando = true;
    }

  } else {
    if (estaCaminando) {
      if (avatarHora) avatarHora.visible = true;
      if (avatarCamina) avatarCamina.visible = false;
      if (actionHora) { actionHora.reset(); actionHora.play(); }
      estaCaminando = false;
    }
  }

  ajustarAlturaSuelo();
}

function actualizarQuerubin() {
  if (!querubinGroup || !avatarGroup) return;

  avatarGroup.getWorldPosition(targetQuerubin);
  targetQuerubin.y += 1.0; 

  querubinGroup.lookAt(targetQuerubin);
}

function seguirAvatar() {
  if (!avatarGroup) return;

  const objetivoPunto = avatarGroup.position.clone();
  objetivoPunto.y += 1.2 * ESCALA_AVATAR;

  const distancia = 3.5 * ESCALA_AVATAR;
  const radY = THREE.MathUtils.degToRad(anguloCamaraY);
  const radX = THREE.MathUtils.degToRad(anguloCamaraX);

  const offset = new THREE.Vector3(
    distancia * Math.sin(radY) * Math.cos(radX),
    distancia * Math.sin(radX),
    distancia * Math.cos(radY) * Math.cos(radX)
  );

  const posicionDeseada = avatarGroup.position.clone().add(offset);

  camera.position.lerp(posicionDeseada, 0.2);
  cameraTarget.lerp(objetivoPunto, 0.25);
  camera.lookAt(cameraTarget);
}

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE DE RENDER
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.033);

  if (cementerioMixer) {
    cementerioMixer.update(delta);
    if (cementerioMixer.time > 35.0) cementerioMixer.setTime(0);
  }
  if (mixerQuerubin) {
    mixerQuerubin.update(delta);
    if (mixerQuerubin.time > 35.0) mixerQuerubin.setTime(0);
  }
  if (mixerCamina && estaCaminando) mixerCamina.update(delta);
  if (mixerHora && !estaCaminando) mixerHora.update(delta);

  moverAvatar(delta);
  actualizarQuerubin();
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
