<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cementerio - Nivel 1</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    #error {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 10px;
      background: rgba(120, 0, 0, 0.9);
      color: white;
      font-family: monospace;
      z-index: 20;
      display: none;
    }
  </style>
</head>

<body>

<div id="loading">Cargando cementerio...</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// --------------------------------------------------
// URLs
// --------------------------------------------------

const CEMENTERIO_URL =
  "https://huggingface.co/datasets/Luis-Fernando/Cementerio/resolve/main/cementerio.glb";

const LUIS_CAMINA_URL =
  "https://raw.githubusercontent.com/duqueluis06-stack/lab-luis/main/luis-camina.glb";

// --------------------------------------------------
// ESCENA, CÁMARA Y RENDERER
// --------------------------------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// --------------------------------------------------
// LUCES
// --------------------------------------------------

const ambientLight = new THREE.HemisphereLight(0x8899aa, 0x111111, 1.2);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xffffff, 1.0);
moonLight.position.set(50, 100, 50);
scene.add(moonLight);

// --------------------------------------------------
// LOADERS
// --------------------------------------------------

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// --------------------------------------------------
// VARIABLES GLOBALES
// --------------------------------------------------

let cementerio = null;
let avatar = null;

let avatarMixer = null;
let avatarAccion = null;

let cementerioMixer = null;

const clock = new THREE.Clock();
const raycasterColision = new THREE.Raycaster();

// --------------------------------------------------
// CARGAR CEMENTERIO
// --------------------------------------------------

loader.load(
  CEMENTERIO_URL,
  function(gltf) {
    cementerio = gltf.scene;
    scene.add(cementerio);

    // Reproducir animaciones propias del archivo cementerio.glb
    if (gltf.animations && gltf.animations.length > 0) {
      cementerioMixer = new THREE.AnimationMixer(cementerio);
      gltf.animations.forEach((clip) => {
        cementerioMixer.clipAction(clip).play();
      });
    }

    cargarAvatar();
  },
  function(xhr) {
    if (xhr.total) {
      const porcentaje = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById("loading").textContent = "Cargando cementerio... " + porcentaje + "%";
    }
  },
  function(error) {
    mostrarError("Error cargando cementerio: " + error);
  }
);

// --------------------------------------------------
// CARGAR AVATAR
// --------------------------------------------------

function cargarAvatar() {
  loader.load(
    LUIS_CAMINA_URL,
    function(gltf) {
      avatar = gltf.scene;
      scene.add(avatar);

      // Ajustes de escala y posición vertical (evita hundimiento)
      avatar.scale.setScalar(2.2); 
      avatar.position.set(0, 0.15, 0); 

      // Configuración de la animación del avatar
      if (gltf.animations.length > 0) {
        avatarMixer = new THREE.AnimationMixer(avatar);
        avatarAccion = avatarMixer.clipAction(gltf.animations[0]);
        avatarAccion.play();
        avatarAccion.paused = true; // Inicia pausado hasta que se mueva
      }

      camera.position.set(0, 3, 7);
      document.getElementById("loading").style.display = "none";
    },
    undefined,
    function(error) {
      mostrarError("Error cargando Luis-camina.glb: " + error);
    }
  );
}

// --------------------------------------------------
// TECLADO
// --------------------------------------------------

const teclas = {};

window.addEventListener("keydown", (e) => { teclas[e.code] = true; });
window.addEventListener("keyup", (e) => { teclas[e.code] = false; });

// --------------------------------------------------
// DETECCIÓN DE COLISIONES
// --------------------------------------------------

function hayColision(paso) {
  if (!cementerio || !avatar) return false;

  const dir = new THREE.Vector3();
  avatar.getWorldDirection(dir);
  
  if (paso < 0) dir.negate(); // Si va marcha atrás

  // Rayo a la altura de la cintura del avatar
  const origen = avatar.position.clone();
  origen.y += 0.8; 

  raycasterColision.set(origen, dir);
  const impactos = raycasterColision.intersectObjects(cementerio.children, true);

  // Si hay un impacto más cercano que la distancia del paso + margen de seguridad
  if (impactos.length > 0 && impactos[0].distance < Math.abs(paso) + 0.6) {
    return true;
  }

  return false;
}

// --------------------------------------------------
// MOVIMIENTO
// --------------------------------------------------

function moverAvatar(delta) {
  if (!avatar) return;

  const velocidad = 3.5;
  let moviendo = false;

  if (teclas["KeyA"] || teclas["ArrowLeft"]) {
    avatar.rotation.y += velocidad * delta;
  }

  if (teclas["KeyD"] || teclas["ArrowRight"]) {
    avatar.rotation.y -= velocidad * delta;
  }

  if (teclas["KeyW"] || teclas["ArrowUp"]) {
    const paso = -velocidad * delta;
    if (!hayColision(paso)) {
      avatar.translateZ(paso);
    }
    moviendo = true;
  }

  if (teclas["KeyS"] || teclas["ArrowDown"]) {
    const paso = velocidad * delta;
    if (!hayColision(paso)) {
      avatar.translateZ(paso);
    }
    moviendo = true;
  }

  // Controlar la reproducción de la animación de caminata
  if (avatarAccion) {
    avatarAccion.paused = !moviendo;
  }
}

// --------------------------------------------------
// CÁMARA SIGUE AL AVATAR
// --------------------------------------------------

function seguirAvatar() {
  if (!avatar) return;

  const objetivo = new THREE.Vector3();
  avatar.getWorldPosition(objetivo);
  objetivo.y += 2.0;

  const posicionCamara = new THREE.Vector3();
  posicionCamara.copy(objetivo);
  
  // Posicionar cámara detrás del avatar según su rotación
  const offset = new THREE.Vector3(0, 1.5, 6);
  offset.applyQuaternion(avatar.quaternion);
  
  posicionCamara.add(offset);

  camera.position.lerp(posicionCamara, 0.1);
  camera.lookAt(objetivo);
}

// --------------------------------------------------
// ERROR
// --------------------------------------------------

function mostrarError(mensaje) {
  console.error(mensaje);
  const elemento = document.getElementById("error");
  elemento.textContent = mensaje;
  elemento.style.display = "block";
  document.getElementById("loading").style.display = "none";
}

// --------------------------------------------------
// BUCLE PRINCIPAL
// --------------------------------------------------

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (avatarMixer) avatarMixer.update(delta);
  if (cementerioMixer) cementerioMixer.update(delta);

  moverAvatar(delta);
  seguirAvatar();

  renderer.render(scene, camera);
}

animate();

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
