<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universal Space-Time Telemetry Matrix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="canonical" href="https://duquemartini.com/experimentos.html">

    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-MB642KNJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-MB642KNJ');
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto+Mono:wght@300;700&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-main: #00ffcc;
            --neon-gold: #ffcc00;
            --bg-dark: #000000;
            --ui-bg: rgba(0, 5, 5, 0.85);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.95) 100%);
            z-index: 5; pointer-events: none;
        }

        canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1;
            filter: contrast(1.2) brightness(1.1) drop-shadow(0 0 10px rgba(0, 242, 255, 0.2));
        }

        header {
            position: fixed; top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; pointer-events: none;
            width: 100%; text-align: center;
        }

        .cinema-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(12px, 3vw, 18px);
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-cyan);
            opacity: 0.9;
        }

        .ui-left-group {
            position: fixed; top: 15px; left: 15px;
            z-index: 100; display: flex; flex-direction: column; gap: 12px;
        }

        .orb-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; color: #fff;
            transition: 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ui-right-group { position: fixed; top: 15px; right: 15px; z-index: 100; }

        .orb-blackhole {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 5px var(--neon-purple), inset 0 0 5px var(--neon-purple); }
            to { box-shadow: 0 0 25px var(--neon-purple), inset 0 0 10px var(--neon-purple); }
        }

        /* PANEL NARRATIVO AVANZADO */
        .narrative-card {
            position: fixed; bottom: 25px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 600px;
            background: var(--ui-bg);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-top: 3px solid var(--neon-cyan);
            padding: 20px;
            border-radius: 16px;
            z-index: 80;
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.95);
            transition: all 0.8s ease-in-out;
            box-sizing: border-box;
        }

        #stage-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(16px, 4vw, 24px); 
            color: var(--neon-cyan); margin: 0; 
            text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        #stage-desc { 
            font-size: clamp(11px, 2.5vw, 13px); 
            margin-top: 12px; color: rgba(255,255,255,0.85); 
            line-height: 1.6;
        }

        #btn-main-init {
            position: fixed; inset: 0; z-index: 2000;
            background: #000; color: var(--neon-main);
            border: none; font-family: 'Orbitron'; font-size: 18px;
            letter-spacing: 10px; cursor: pointer;
            transition: 0.4s;
        }
        #btn-main-init:hover { color: #fff; text-shadow: 0 0 20px var(--neon-main); background: #020202; }

        #creditos_btn {
            position: fixed; bottom: 5px; right: 10px;
            background: transparent; border: none;
            color: rgba(255,255,255,0.2); font-size: 9px; cursor: pointer;
        }

        .home-btn {
            width: auto !important; height: 45px; padding: 0 16px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 12px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--neon-cyan); color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); transition: 0.25s ease;
        }
        .home-btn:hover { transform: scale(1.05); background: rgba(0, 242, 255, 0.15); box-shadow: 0 0 25px var(--neon-cyan); }
    </style>
</head>

<body>

<button id="btn-main-init">INICIAR MATRIX MAQUINA DEL TIEMPO</button>

<div class="vignette"></div>
<canvas id="canvas-cosmos"></canvas>

<header><div class="cinema-title">TEMPORAL METRICS & GALAXIES</div></header>

<div class="ui-left-group">
    <a href="index.html" class="orb-btn orb-start home-btn" title="Centro de control">⬅️ MENU</a>
    <a href="fps-world.html" class="orb-btn home-btn" title="Entrar al mundo FPS">🚀 ENTRAR</a>
</div>

<div class="ui-right-group">
    <a href="demo-3d.html" class="orb-btn orb-blackhole" title="Simulación 3D de agujero negro" aria-label="Abrir simulación 3D">🌀</a>
</div>

<div class="narrative-card" id="narrative-box" style="opacity: 0;">
    <h2 id="stage-title">...</h2>
    <p id="stage-desc">...</p>
</div>

<button id="creditos_btn" onclick="window.location.href='creditos.html'">CORE LOG SYSTEM</button>

<script>
    const canvas = document.getElementById("canvas-cosmos");
    const ctx = canvas.getContext("2d");
    let w, h, stage = 0, particles = [], active = false;
    let audioCtx, mainGain;
    let flashOpacity = 0;

    // Reloj Holográfico Global (Parámetros mecánicos de la máquina del tiempo)
    let clockAngleSeconds = 0;
    let clockAngleMinutes = 0;
    let clockGlitch = 0;

    const timeline = [
        { t: "Espuma de Planck (Pre-Materia)", d: "Ubicación: Coordenada Cero. El tejido subatómico vibra. Nuestra máquina del tiempo calibra los motores sobre filamentos cuánticos estacionarios.", color: "#00f2ff", dur: 9000, freq: 440 },
        { t: "Galaxia de Oxidación Biológica", d: "Ubicación: Cuadrante Andrómeda B. El tiempo fluye a través de corrientes químicas nocivas. El oxígeno desgasta las células y acelera las manecillas biológicas hacia el envejecimiento.", color: "#39ff14", dur: 11000, freq: 320 },
        { t: "Pozo Gravitatorio de Virgo", d: "Ubicación: Núcleo Cúmulo de Virgo. La masa colosal de una galaxia elíptica curva la red temporal. La gravedad es tan extrema que la máquina del tiempo registra un retraso severo (Dilatación).", color: "#ffcc00", dur: 12000, freq: 200 },
        { t: "Salto Warp Espacio-Temporal", d: "Ubicación: Hiper-Espacio Intergaláctico. Activación del campo Alcubierre. Rompemos la flecha lineal del tiempo; los relojes se vuelven locos girando hacia el pasado y el futuro.", color: "#00ffcc", dur: 12000, freq: 160 },
        { t: "Singularidad de la Galaxia Oscura", d: "Ubicación: Agujero Negro Central M87*. Colapso total de la geometría métrica. Las galaxias vecinas son devoradas, el reloj de la máquina del tiempo se quiebra y el tiempo se congela.", color: "#bc13fe", dur: 13000, freq: 65 }
    ];

    const resize = () => { 
        w = canvas.width = window.innerWidth; 
        h = canvas.height = window.innerHeight; 
        initParticles();
    };
    window.addEventListener('resize', resize);

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        mainGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    }

    function playTone(f) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = stage === 3 ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4.5);
        osc.connect(g); g.connect(mainGain);
        osc.start(); osc.stop(audioCtx.currentTime + 4.5);
    }

    class Particle {
        constructor(ix, iy) {
            this.gridX = ix;
            this.gridY = iy;
            this.init();
        }

        init() {
            // Diseño orbital para simular galaxias en espiral reales
            this.angle = Math.random() * Math.PI * 2;
            this.distance = Math.random() * (Math.max(w, h) * 0.45) + 20;
            this.armOffset = (Math.random() - 0.5) * 0.4; 
            // Número de brazos de la galaxia actual
            this.arm = Math.floor(Math.random() * 3); 
            
            this.x = Math.cos(this.angle) * this.distance;
            this.y = Math.sin(this.angle) * this.distance;
            this.z = Math.random() * w;
            this.pz = this.z;
            this.size = Math.random() * 1.6 + 0.4;
            
            // Degradación metabólica celular (Fase 1)
            this.cellHealth = Math.random() * 100 + 40;
            this.maxHealth = this.cellHealth;
            this.oxidationSpeed = Math.random() * 0.6 + 0.2;
        }

        update() {
            this.pz = this.z;

            if (stage === 0) { // PLANCK ESPUMA
                this.x += Math.sin(Date.now() * 0.005 + this.gridX) * 0.5;
                this.y += Math.cos(Date.now() * 0.005 + this.gridY) * 0.5;
            } 
            else if (stage === 1) { // OXIDACIÓN CELULAR GALÁCTICA
                this.cellHealth -= this.oxidationSpeed;
                this.angle += 0.004; // Rotación lenta de la bio-galaxia
                this.x = Math.cos(this.angle) * this.distance;
                this.y = Math.sin(this.angle) * this.distance + Math.sin(Date.now() * 0.002) * 10;
                if (this.cellHealth <= 0) this.init();
            } 
            else if (stage === 2) { // POZO GRAVITATORIO DE VIRGO
                // Simulación física de brazos espirales atraídos por el pozo
                this.angle += 3 / (this.distance * 0.05 + 5); 
                let pull = 2.5 / (this.distance * 0.008 + 1);
                this.distance -= pull;
                if (this.distance < 15) this.distance = Math.random() * (w * 0.4) + 100;
                this.x = Math.cos(this.angle + (this.arm * (Math.PI * 2 / 3)) + this.armOffset) * this.distance;
                this.y = Math.sin(this.angle + (this.arm * (Math.PI * 2 / 3)) + this.armOffset) * this.distance;
            } 
            else if (stage === 3) { // SALTO WARP MOTOR
                this.z -= 40;
                if(this.z < 1) { this.z = w; this.pz = w; }
            } 
            else if (stage === 4) { // SINGULARIDAD CRÍTICA
                this.angle += 0.08;
                this.distance *= 0.985; // Colapso galáctico hacia el centro de la máquina del tiempo
                if(this.distance < 5) this.init();
                this.x = Math.cos(this.angle) * this.distance;
                this.y = Math.sin(this.angle) * this.distance;
            }
        }

        draw() {
            let s = timeline[stage];
            ctx.globalAlpha = Math.min(1, 1 - (this.z / w));

            let cx = this.x + w/2;
            let cy = this.y + h/2;

            if (stage === 1) { // Renderizado Oxidación Celular
                let hRatio = this.cellHealth / this.maxHealth;
                let r = Math.floor((1 - hRatio) * 230 + 40); 
                let g = Math.floor(hRatio * 255 + (1 - hRatio) * 50);
                let b = Math.floor((1 - hRatio) * 10);
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.beginPath(); ctx.arc(cx, cy, this.size * (hRatio * 2.5 + 0.5), 0, Math.PI * 2); ctx.fill();
            } 
            else if (stage === 3) { // Renderizado Warp (Túnel Métrico Intergaláctico)
                let k = 600 / this.z;
                let sx = (this.x * 0.1) * k + w/2;
                let sy = (this.y * 0.1) * k + h/2;
                let pk = 600 / this.pz;
                let px = (this.x * 0.1) * pk + w/2;
                let py = (this.y * 0.1) * pk + h/2;
                
                ctx.strokeStyle = s.color;
                ctx.lineWidth = (1 - this.z/w) * 5;
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
            } 
            else { // Resto de fases galácticas ordinarias
                ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(cx, cy, this.size * 1.5, 0, Math.PI * 2); ctx.fill();
            }
        }
    }

    function initParticles() {
        particles = [];
        // Población masiva para dar volumen a las galaxias
        for(let i=0; i<650; i++) {
            particles.push(new Particle(i % 25, Math.floor(i / 25)));
        }
    }

    // ACTUALIZACIÓN MECÁNICA DE LA MÁQUINA DEL TIEMPO (RELOJ HOLOGRÁFICO)
    function updateClockMechanics() {
        if (stage === 0) { 
            clockAngleSeconds += 0.02; // Ticking de calibración estándar
        } else if (stage === 1) { 
            clockAngleSeconds += 0.12; // La oxidación acelera el desgaste del tiempo biológico
        } else if (stage === 2) { 
            clockAngleSeconds += 0.003; // Dilatación: la gravedad masiva detiene el reloj
        } else if (stage === 3) { 
            clockAngleSeconds += (Math.sin(Date.now() * 0.01) * 0.8); // Warp: oscila caóticamente adelante/atrás
        } else if (stage === 4) { 
            clockAngleSeconds = Math.PI; // Singularidad: Roto, estático y colapsado
        }
        clockAngleMinutes = clockAngleSeconds / 12;
    }

    // RENDERIZADO DEL RELOJ DE LA MÁQUINA DEL TIEMPO
    function drawTimeMachineClock() {
        let s = timeline[stage];
        ctx.save();
        ctx.translate(w / 2, h / 2);
        
        let radius = Math.min(w, h) * 0.22;
        
        // Efecto glitch visual si estamos en salto Warp o singularidad
        if (stage === 3 || stage === 4) {
            ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        }

        // Esfera exterior del reloj holográfico
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = stage === 4 ? 0.2 : 0.4;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Marcas horarias intergalácticas
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 12; i++) {
            let angle = (i * Math.PI) / 6;
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, -radius + 4);
            ctx.lineTo(0, -radius + 15);
            ctx.stroke();
            ctx.rotate(-angle);
        }

        // MANECILLA: SEGUNDOS / PASO DEL TIEMPO
        ctx.save();
        ctx.rotate(clockAngleSeconds);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = stage === 4 ? 1 : 2;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(0, -radius + 25);
        ctx.stroke();
        // Detalle de flecha temporal de la máquina
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(0, -radius + 25, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // MANECILLA: MINUTOS / ERAS CÓSMICAS
        ctx.save();
        ctx.rotate(clockAngleMinutes);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -radius * 0.65);
        ctx.stroke();
        ctx.restore();

        // Núcleo cuántico central de la máquina del tiempo
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
    }

    function loop() {
        ctx.fillStyle = (stage === 3 || stage === 4) ? "rgba(0,0,0,0.25)" : "rgba(0,0,0,0.15)";
        ctx.fillRect(0, 0, w, h);

        if (active) {
            updateClockMechanics();
            particles.forEach(p => { p.update(); p.draw(); });
            drawTimeMachineClock();
        }

        // Transición cuántica (Flash cinematográfico integrado estofado)
        if (flashOpacity > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
            ctx.globalAlpha = 1;
            ctx.fillRect(0, 0, w, h);
            flashOpacity -= 0.025; 
        }

        requestAnimationFrame(loop);
    }

    function nextStage() {
        const s = timeline[stage];
        const box = document.getElementById("narrative-box");
        box.style.opacity = 0;
        box.style.transform = "translateX(-50%) translateY(15px)";
        
        setTimeout(() => {
            document.getElementById("stage-title").innerText = s.t;
            document.getElementById("stage-desc").innerText = s.d;
            document.getElementById("stage-title").style.color = s.color;
            box.style.opacity = 1;
            box.style.transform = "translateX(-50%) translateY(0px)";
            playTone(s.freq);
            flashOpacity = 0.6; 
        }, 800);

        setTimeout(() => {
            stage = (stage + 1) % timeline.length;
            nextStage();
        }, s.dur);
    }

    document.getElementById('btn-main-init').addEventListener('click', function() {
        this.style.display = 'none';
        initAudio();
        active = true;
        nextStage();
    });

    resize();
    loop();
</script>
</body>
</html>
