<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universal Space-Time: Quantum Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="canonical" href="https://duquemartini.com/experimentos.html">

    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-MB642KNJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-MB642KNJ');
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto+Mono:wght@300;700&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-main: #00ffcc;
            --neon-gold: #ffcc00;
            --neon-rust: #d9531e;
            --bg-dark: #000000;
            --ui-bg: rgba(0, 8, 8, 0.8);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.85) 100%);
            z-index: 5; pointer-events: none;
        }

        canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1;
            filter: contrast(1.15) brightness(1.1);
        }

        header {
            position: fixed; top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; pointer-events: none;
            width: 100%; text-align: center;
        }

        .cinema-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(10px, 3vw, 16px);
            letter-spacing: clamp(4px, 2vw, 10px);
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
            opacity: 0.8;
            white-space: nowrap;
        }

        .ui-left-group {
            position: fixed; top: 15px; left: 15px;
            z-index: 100; display: flex; flex-direction: column; gap: 15px;
        }

        img.logo {
            width: clamp(50px, 10vw, 70px);
            height: clamp(50px, 10vw, 70px);
            border: 1px solid var(--neon-main);
            border-radius: 50%;
            transition: 0.4s;
        }

        .orb-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; color: #fff;
            transition: 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .orb-start:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px var(--neon-cyan); }

        .ui-right-group { position: fixed; top: 15px; right: 15px; z-index: 100; }

        .orb-blackhole {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 5px var(--neon-purple); }
            to { box-shadow: 0 0 20px var(--neon-purple); }
        }

        .narrative-card {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 550px;
            background: var(--ui-bg);
            border-top: 2px solid var(--neon-cyan);
            padding: 20px;
            border-radius: 12px;
            z-index: 80;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 5px 30px rgba(0,0,0,0.9);
            transition: opacity 0.8s, transform 0.8s;
            box-sizing: border-box;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        #stage-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(16px, 4vw, 22px); 
            color: var(--neon-cyan); margin: 0; 
            text-transform: uppercase; letter-spacing: 3px;
        }

        #stage-desc { 
            font-size: clamp(11px, 2.5vw, 13px); 
            margin-top: 10px; color: rgba(255,255,255,0.8); 
            line-height: 1.5;
            font-family: 'Roboto Mono', monospace;
        }

        #btn-main-init {
            position: fixed; inset: 0; z-index: 2000;
            background: #000; color: var(--neon-main);
            border: none; font-family: 'Orbitron'; font-size: 16px;
            letter-spacing: 8px; cursor: pointer;
            transition: 0.3s;
        }
        #btn-main-init:hover { color: #fff; text-shadow: 0 0 15px var(--neon-main); }

        #creditos_btn {
            position: fixed; bottom: 5px; right: 10px;
            background: transparent; border: none;
            color: rgba(255,255,255,0.2); font-size: 9px; cursor: pointer;
        }

        @media (max-height: 600px) {
            .narrative-card { bottom: 10px; padding: 10px; }
            #stage-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        }

        .home-btn {
            width: auto !important; height: 50px; padding: 0 14px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 13px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-cyan); color: #fff;
            box-shadow: 0 0 18px rgba(0, 242, 255, 0.25); transition: 0.25s ease;
        }
        .home-btn:hover { transform: scale(1.05); background: rgba(0, 242, 255, 0.15); box-shadow: 0 0 25px var(--neon-cyan); }
    </style>
</head>

<body>

<button id="btn-main-init">INICIAR CRÓNICA ESPACIO-TEMPORAL</button>

<div class="vignette"></div>
<canvas id="canvas-cosmos"></canvas>

<header><div class="cinema-title">QUANTUM ENGINE V2.0</div></header>

<div class="ui-left-group">
    <img src="logo.jpg" class="logo" alt="Logo">
    <a href="index.html" class="orb-btn orb-start home-btn" title="Centro de control">⬅️ Control</a>
    <a href="fps-world.html" class="orb-btn home-btn" title="Entrar al mundo FPS">🚀 Simulación</a>
</div>

<div class="ui-right-group">
    <a href="demo-3d.html" class="orb-btn orb-blackhole" title="Simulación 3D de agujero negro" aria-label="Abrir simulación 3D">🌀</a>
</div>

<div class="narrative-card" id="narrative-box" style="opacity: 0;">
    <h2 id="stage-title">...</h2>
    <p id="stage-desc">...</p>
</div>

<button id="creditos_btn" onclick="window.location.href='creditos.html'">INFO SYSTEM</button>

<script>
    const canvas = document.getElementById("canvas-cosmos");
    const ctx = canvas.getContext("2d");
    let w, h, stage = 0, particles = [], active = false;
    let audioCtx, mainGain;
    let flashOpacity = 0;

    // Configuración de la línea de tiempo de Ciencia Ficción Dura
    const timeline = [
        { t: "Líneas de Planck", d: "Dimensión 10⁻³⁵m. El tejido cuántico base vibra de forma estacionaria, generando filamentos de energía pura previa a la materia.", color: "#00f2ff", dur: 8000, freq: 440 },
        { t: "Oxidación Celular", d: "Tiempo Biológico: El mismo oxígeno que alimenta la vida genera radicales libres. Las células se oxidan, erosionando los telómeros celulares en una cuenta regresiva irreversible.", color: "#39ff14", dur: 10000, freq: 294 },
        { t: "Pozo Gravitatorio", d: "Relatividad General: Un objeto hipermasivo curva el espacio-tiempo a su alrededor. El tiempo corre más lento cuanto más cerca estás de la masa crítica.", color: "#ffcc00", dur: 12000, freq: 196 },
        { t: "Motor Warp (Alcubierre)", d: "Propulsión métrica: El motor pliega el espacio contrayéndolo al frente y expandiéndolo detrás. Dentro de la burbuja, las leyes del tiempo lineal colapsan.", color: "#00ffcc", dur: 12000, freq: 147 },
        { t: "Singularidad Absoluta", d: "Colapso gravitacional masivo. Más allá del horizonte de sucesos, la densidad es infinita y la flecha del tiempo pierde cualquier sentido físico.", color: "#bc13fe", dur: 12000, freq: 73 }
    ];

    const resize = () => { 
        w = canvas.width = window.innerWidth; 
        h = canvas.height = window.innerHeight; 
        initParticles();
    };
    window.addEventListener('resize', resize);

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        mainGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    }

    function playTone(f) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = stage === 3 ? 'sawtooth' : 'sine'; // Tono más agresivo para el motor Warp
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 5);
        osc.connect(g); g.connect(mainGain);
        osc.start(); osc.stop(audioCtx.currentTime + 5);
    }

    class Particle {
        constructor(ix, iy) {
            this.gridX = ix;
            this.gridY = iy;
            this.init();
        }

        init() {
            this.x = Math.random() * w - w/2;
            this.y = Math.random() * h - h/2;
            this.z = Math.random() * w;
            this.pz = this.z;
            this.size = Math.random() * 1.5 + 0.6;
            this.ang = Math.random() * Math.PI * 2;
            this.vibrateX = 0;
            this.vibrateY = 0;
            
            // Atributos biológicos de oxidación
            this.life = Math.random() * 100 + 50; 
            this.maxLife = this.life;
            this.ageRate = Math.random() * 0.8 + 0.2;
        }

        update() {
            this.pz = this.z;

            if (stage === 0) { // PLANCK
                this.vibrateX = Math.sin(Date.now() * 0.01 + this.gridX) * 3;
                this.vibrateY = Math.cos(Date.now() * 0.01 + this.gridY) * 3;
            } 
            else if (stage === 1) { // OXIDACIÓN CELULAR
                this.life -= this.ageRate;
                this.y -= 0.5; // Movimiento errático flotante de desecho celular
                this.x += Math.sin(Date.now() * 0.005 + this.life) * 0.3;
                if (this.life <= 0) this.init();
            } 
            else if (stage === 2) { // POZO GRAVITATORIO MASIVO
                // Fuerza centrípeta hacia el centro de la pantalla (Gravedad)
                let distanceToMass = Math.sqrt(this.x * this.x + this.y * this.y);
                if (distanceToMass > 10) {
                    let gravityForce = 150 / (distanceToMass * 0.01 + 1);
                    this.x -= (this.x / distanceToMass) * gravityForce;
                    this.y -= (this.y / distanceToMass) * gravityForce;
                }
                this.z -= 1.5;
                if(this.z < 1) this.init();
            } 
            else if (stage === 3) { // MOTOR WARP
                // Efecto tunel hiperbólico (Burbuja Alcubierre)
                this.z -= 35; 
                if(this.z < 1) { this.z = w; this.pz = w; }
            } 
            else if (stage === 4) { // SINGULARIDAD
                this.ang += 0.07;
                this.z *= 0.975; // Atracción hiperbólica exponencial hacia el sumidero
                if(this.z < 8) { this.z = w; this.pz = w; }
            }
        }

        draw() {
            let s = timeline[stage];
            ctx.globalAlpha = Math.min(1, 1 - (this.z / w));
            
            if (stage === 0) { // Render Planck
                let x = (this.gridX * (w / 24)) + (w / 12) + this.vibrateX;
                let y = (this.gridY * (h / 24)) + (h / 12) + this.vibrateY;
                ctx.fillStyle = s.color;
                ctx.strokeStyle = s.color;
                ctx.beginPath(); ctx.arc(x, y, this.size * 1.8, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 0.05;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 20, y + 20); ctx.stroke();
            } 
            else if (stage === 1) { // Render Oxidación / Degradación de color
                let lifeRatio = this.life / this.maxLife;
                // Transición de verde vida a óxido celular marchito
                let r = Math.floor((1 - lifeRatio) * 217); 
                let g = Math.floor(lifeRatio * 255 + (1 - lifeRatio) * 83);
                let b = Math.floor((1 - lifeRatio) * 30);
                
                let cx = this.x + w/2;
                let cy = this.y + h/2;
                
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.beginPath(); 
                ctx.arc(cx, cy, this.size * (lifeRatio * 2 + 1), 0, Math.PI * 2); 
                ctx.fill();
            } 
            else { // Render Fases Relativistas y Warp
                let k = 600 / this.z;
                let sx = this.x * k + w/2;
                let sy = this.y * k + h/2;
                ctx.fillStyle = s.color;
                ctx.strokeStyle = s.color;

                if (stage === 3) { // Líneas Warp estiradas por la métrica espacial
                    let pk = 600 / this.pz;
                    let px = this.x * pk + w/2;
                    let py = this.y * pk + h/2;
                    ctx.lineWidth = (1 - this.z/w) * 6;
                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
                } else if (stage === 4) { // Vórtice orbital de la singularidad
                    let radius = (this.z / w) * (w / 2.2);
                    let rx = Math.cos(this.ang) * radius + w/2;
                    let ry = Math.sin(this.ang) * radius + h/2;
                    ctx.beginPath(); ctx.arc(rx, ry, this.size * k * 0.12, 0, Math.PI * 2); ctx.fill();
                } else { // Pozo gravitatorio ordinario
                    ctx.beginPath(); ctx.arc(sx, sy, this.size * k * 0.15, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
    }

    function initParticles() {
        particles = [];
        for(let i=0; i<25; i++) {
            for(let j=0; j<25; j++) {
                particles.push(new Particle(i, j));
            }
        }
        for(let i=0; i<450; i++) {
            particles.push(new Particle(Math.random()*20, Math.random()*20));
        }
    }

    function loop() {
        // En la singularidad o pozo la persistencia de luz cambia para emular distorsión óptica
        ctx.fillStyle = (stage === 4 || stage === 2) ? "rgba(0,0,0,0.3)" : "rgba(0,0,0,0.18)";
        ctx.fillRect(0, 0, w, h);

        if (active) {
            particles.forEach(p => { p.update(); p.draw(); });
        }

        // Efecto cinemático de cambio de estado cuántico
        if (flashOpacity > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
            ctx.globalAlpha = 1;
            ctx.fillRect(0, 0, w, h);
            flashOpacity -= 0.025; 
        }

        requestAnimationFrame(loop);
    }

    function nextStage() {
        const s = timeline[stage];
        const box = document.getElementById("narrative-box");
        box.style.opacity = 0;
        box.style.transform = "translateX(-50%) translateY(10px)";
        
        setTimeout(() => {
            document.getElementById("stage-title").innerText = s.t;
            document.getElementById("stage-desc").innerText = s.d;
            document.getElementById("stage-title").style.color = s.color;
            box.style.opacity = 1;
            box.style.transform = "translateX(-50%) translateY(0px)";
            playTone(s.freq);
            flashOpacity = 0.55; 
        }, 800);

        setTimeout(() => {
            stage = (stage + 1) % timeline.length;
            nextStage();
        }, s.dur);
    }

    document.getElementById('btn-main-init').addEventListener('click', function() {
        this.style.display = 'none';
        initAudio();
        active = true;
        nextStage();
    });

    resize();
    loop();
</script>
</body>
</html>
