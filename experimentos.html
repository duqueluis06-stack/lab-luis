<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universal Space-Time Telemetry Matrix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="canonical" href="https://duquemartini.com/experimentos.html">

    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-MB642KNJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'GT-MB642KNJ');
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto+Mono:wght@300;700&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-main: #00ffcc;
            --neon-gold: #ffcc00;
            --bg-dark: #020205;
            --ui-bg: rgba(2, 6, 12, 0.65);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        /* EFECTO CINEMÁTICO DE LENTE */
        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.9) 100%);
            z-index: 5; pointer-events: none;
        }

        #webgl-canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1;
            width: 100%; height: 100%;
        }

        /* ENTORNO HUD SIMÉTRICO (NUNCA TAPA EL CENTRO DE LA PANTALLA) */
        header {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; pointer-events: none;
            width: 90%; text-align: center;
        }

        .cinema-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(12px, 2.5vw, 16px);
            letter-spacing: 8px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        /* UBICACIÓN DE BOTONES EN MARGEN INFERIOR IZQUIERDO */
        .ui-controls-hud {
            position: fixed; bottom: 25px; left: 25px;
            z-index: 100; display: flex; gap: 15px;
        }

        .home-btn {
            height: 45px; padding: 0 20px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 11px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
            background: var(--ui-bg); border: 1px solid rgba(0, 242, 255, 0.4); color: #fff;
            backdrop-filter: blur(15px); text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); transition: all 0.3s ease;
        }
        .home-btn:hover { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 25px var(--neon-cyan);
            transform: translateY(-2px);
            background: rgba(0, 242, 255, 0.1);
        }

        /* UBICACIÓN DEL ACCESO AL AGUJERO NEGRO (MARGEN INFERIOR DERECHO) */
        .ui-right-hud {
            position: fixed; bottom: 25px; right: 25px; z-index: 100;
        }
        .orb-blackhole {
            width: 45px; height: 45px; border-radius: 8px;
            background: var(--ui-bg); border: 1px solid rgba(188, 19, 254, 0.4);
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            backdrop-filter: blur(15px); transition: all 0.3s;
        }
        .orb-blackhole:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px var(--neon-purple);
            transform: translateY(-2px);
        }

        /* PANEL NARRATIVO OPTIMIZADO EN EL CENTRO INFERIOR */
        .narrative-card {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 550px;
            background: rgba(3, 8, 16, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 3px solid var(--neon-cyan);
            padding: 20px; border-radius: 12px; z-index: 80;
            backdrop-filter: blur(25px); text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        #stage-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(15px, 3.5vw, 20px); 
            color: var(--neon-cyan); margin: 0; 
            text-transform: uppercase; letter-spacing: 5px;
        }

        #stage-desc { 
            font-size: clamp(11px, 2.2vw, 12.5px); 
            margin-top: 10px; color: rgba(255,255,255,0.75); 
            line-height: 1.6; letter-spacing: 0.5px;
        }

        /* INTRO SCREEN ESTILO HOLLYWOOD */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: radial-gradient(circle at center, #050b14 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }

        .spielberg-btn {
            background: transparent; border: 1px solid var(--neon-main);
            color: var(--neon-main); font-family: 'Orbitron'; font-size: 14px;
            padding: 15px 40px; letter-spacing: 6px; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); transition: all 0.4s;
        }
        .spielberg-btn:hover {
            color: #fff; background: var(--neon-main);
            box-shadow: 0 0 35px var(--neon-main);
            letter-spacing: 8px;
        }

        #creditos_btn {
            position: fixed; top: 20px; right: 20px;
            background: transparent; border: none;
            color: rgba(255,255,255,0.2); font-size: 9px; cursor: pointer; z-index: 100;
        }
    </style>
</head>

<body>

<div id="intro-overlay">
    <button class="spielberg-btn" id="btn-main-init">INICIAR SECUENCIA CÓSMICA</button>
</div>

<div class="vignette"></div>
<div id="webgl-canvas"></div>

<header><div class="cinema-title">TEMPORAL METRICS ENGINE 3D</div></header>

<div class="ui-controls-hud">
    <a href="index.html" class="home-btn" title="Centro de control">⬅ MTRX</a>
    <a href="fps-world.html" class="home-btn" title="Entrar al mundo FPS">🚀 NAV</a>
</div>

<div class="ui-right-hud">
    <a href="demo-3d.html" class="orb-blackhole" title="Simulación 3D de agujero negro">🌀</a>
</div>

<div class="narrative-card" id="narrative-box" style="opacity: 0; transform: translate(-50%, 30px);">
    <h2 id="stage-title">...</h2>
    <p id="stage-desc">...</p>
</div>

<button id="creditos_btn" onclick="window.location.href='creditos.html'">LOG SYSTEM</button>

<script>
    let scene, camera, renderer, starGeometry, starField, clockMesh, hourHand, minuteHand;
    let stage = 0, active = false, audioCtx, mainGain;
    let colors = [0x00f2ff, 0x39ff14, 0xffcc00, 0x00ffcc, 0xbc13fe];
    
    const timeline = [
        { t: "Líneas de Planck", d: "Dimensión cuántica base. Filamentos de energía pura vibran en un entorno hiperdimensional antes de la creación de la materia regular.", dur: 9000, freq: 440 },
        { t: "Oxidación Celular Galáctica", d: "Corrientes bio-químicas de oxígeno degradan las estructuras celulares. Las partículas cambian de un verde vital a tonos óxido mientras decaen.", dur: 11000, freq: 320 },
        { t: "Dilatación Gravitatoria", d: "Aproximación a un cúmulo estelar masivo. La gravedad curva el tejido de la galaxia elíptica. Las agujas del tiempo ralentizan su marcha drásticamente.", dur: 12000, freq: 200 },
        { t: "Campo Warp Métrico", d: "Activación de la burbuja Alcubierre. El espacio tridimensional se contrae violentamente frente a la nave. El tiempo exterior gira hacia el pasado.", dur: 12000, freq: 160 },
        { t: "Singularidad Espacio-Temporal", d: "Colapso gravitacional absoluto. Los brazos de la galaxia colapsan hacia el sumidero central. La geometría del reloj holográfico se quiebra.", dur: 13000, freq: 65 }
    ];

    function init3DEngine() {
        const container = document.getElementById('webgl-canvas');
        
        // 1. ESCENA Y CÁMARA CINEMÁTICA
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.0015);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 150;

        // 2. RENDERIZADOR WEBGL DE ALTA RESOLUCIÓN
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 3. CREACIÓN DE LA GALAXIA TRIDIMENSIONAL (PUNTOS VOLUMÉTRICOS)
        starGeometry = new THREE.BufferGeometry();
        const particleCount = 2500;
        const positions = new Float32Array(particleCount * 3);
        const originalData = [];

        for(let i=0; i<particleCount; i++) {
            // Brazos espirales logarítmicos reales
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.sqrt(Math.random()) * 180 + 5;
            let arm = (i % 3) * (Math.PI * 2 / 3);
            let spiralAngle = angle + arm + (distance * 0.02);

            let x = Math.cos(spiralAngle) * distance;
            let y = Math.sin(spiralAngle) * distance;
            let z = (Math.random() - 0.5) * 20;

            positions[i*3] = x;
            positions[i*3+1] = y;
            positions[i*3+2] = z;

            originalData.push({ x, y, z, angle, distance, arm, life: Math.random() * 100 });
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        // Material holográfico para las partículas
        const starMaterial = new THREE.PointsMaterial({
            size: 1.8,
            vertexColors: false,
            color: colors[0],
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        starField = new THREE.Points(starGeometry, starMaterial);
        starField.userData = originalData;
        scene.add(starField);

        // 4. MAQUINA DEL TIEMPO: RELOJ HOLOGRÁFICO EN 3D
        const clockGroup = new THREE.Group();
        const ringGeo = new THREE.RingGeometry(38, 40, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: colors[0], side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
        clockMesh = new THREE.Mesh(ringGeo, ringMat);
        clockGroup.add(clockMesh);

        // Manecillas 3D estilizadas
        const handMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
        
        const hourGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0, 22, 0)]);
        hourHand = new THREE.Line(hourGeo, handMat);
        clockGroup.add(hourHand);

        const minGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0, 32, 0)]);
        minuteHand = new THREE.Line(minGeo, new THREE.LineBasicMaterial({ color: colors[0] }));
        clockGroup.add(minuteHand);

        scene.add(clockGroup);

        window.addEventListener('resize', onWindowResize);
    }

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        mainGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    }

    function playTone(f) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = stage === 3 ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);
        osc.connect(g); g.connect(mainGain);
        osc.start(); osc.stop(audioCtx.currentTime + 4);
    }

    let clockTime = 0;
    function animate() {
        requestAnimationFrame(animate);
        if (!active) return;

        const positions = starGeometry.attributes.position.array;
        const data = starField.userData;

        // ACTUALIZACIÓN DE MECÁNICAS DE TIEMPO SEGÚN EL ESTADO
        if (stage === 0) clockTime += 0.015;
        else if (stage === 1) clockTime += 0.08;  // Oxidación celular acelera el desgaste temporal
        else if (stage === 2) clockTime += 0.002; // Dilatación: la gravedad frena el tiempo
        else if (stage === 3) clockTime -= 0.15;  // Warp: el reloj viaja hacia atrás en el hiperespacio
        else if (stage === 4) clockTime += (Math.random() - 0.5) * 0.2; // Singularidad: caótico/destruido

        minuteHand.rotation.z = -clockTime;
        hourHand.rotation.z = -clockTime * 0.1;

        // GESTIÓN DEL ENTORNO DE PARTÍCULAS 3D
        for (let i = 0; i < data.length; i++) {
            let pt = data[i];

            if (stage === 0) { // PLANCK: Fluctuación cuántica
                positions[i*3] += Math.sin(Date.now() * 0.001 + i) * 0.08;
                positions[i*3+1] += Math.cos(Date.now() * 0.001 + i) * 0.08;
            } 
            else if (stage === 1) { // OXIDACIÓN CELULAR: Pérdida de órbita y envejecimiento
                pt.life -= 0.3;
                positions[i*3+1] += 0.12; // Flotan hacia arriba como residuos degradados
                if(pt.life <= 0) {
                    positions[i*3] = pt.x;
                    positions[i*3+1] = pt.y;
                    pt.life = Math.random() * 100;
                }
            } 
            else if (stage === 2 || stage === 4) { // GRAVEDAD Y SINGULARIDAD: Atracción centrípeta masiva
                let speed = stage === 4 ? 0.06 : 0.01;
                pt.distance *= (1 - speed);
                if (pt.distance < 2) pt.distance = Math.random() * 150 + 30;
                pt.angle += stage === 4 ? 0.05 : 0.01;
                
                let spiralAngle = pt.angle + pt.arm + (pt.distance * 0.02);
                positions[i*3] = Math.cos(spiralAngle) * pt.distance;
                positions[i*3+1] = Math.sin(spiralAngle) * pt.distance;
            }
            else if (stage === 3) { // MOTOR WARP: Movimiento de túnel 3D (Efecto Spielberg Starfield)
                positions[i*3+2] += 4.5;
                if (positions[i*3+2] > 150) positions[i*3+2] = -200;
            }
        }
        
        starGeometry.attributes.position.needsUpdate = true;

        // EFECTOS DE MOVIMIENTO DE CÁMARA (DINÁMICA DE CINE)
        if (stage === 3) {
            camera.position.z = 100 + Math.sin(Date.now() * 0.003) * 10;
            starField.rotation.z += 0.015;
        } else {
            camera.position.z = 150;
            starField.rotation.z += 0.0015;
        }

        renderer.render(scene, camera);
    }

    function nextStage() {
        const s = timeline[stage];
        const box = document.getElementById("narrative-box");
        
        box.style.opacity = 0;
        box.style.transform = "translate(-50%, 25px)";
        
        setTimeout(() => {
            document.getElementById("stage-title").innerText = s.t;
            document.getElementById("stage-desc").innerText = s.d;
            document.getElementById("stage-title").style.color = "#" + colors[stage].toString(16).padStart(6, '0');
            
            // Transición limpia de colores en el motor 3D
            starField.material.color.setHex(colors[stage]);
            clockMesh.material.color.setHex(colors[stage]);
            minuteHand.material.color.setHex(colors[stage]);
            
            box.style.opacity = 1;
            box.style.transform = "translate(-50%, 0px)";
            playTone(s.freq);
        }, 800);

        setTimeout(() => {
            stage = (stage + 1) % timeline.length;
            nextStage();
        }, s.dur);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    document.getElementById('btn-main-init').addEventListener('click', function() {
        document.getElementById('intro-overlay').style.opacity = 0;
        setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 1000);
        initAudio();
        active = true;
        nextStage();
    });

    init3DEngine();
    animate();
</script>
</body>
</html>
