<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-MB642KNJ"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Roboto+Mono:wght@300;700&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-main: #00ffcc;
            --bg-dark: #010103;
            --hud-bg: rgba(2, 8, 16, 0.7);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        /* EFECTO CRISTAL CRT DE PELÍCULA (Scanlines + Viñeta) */
        .overlay-cinema {
            position: fixed; inset: 0;
            background: 
                radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.9) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 100%, 100% 4px, 6px 100%;
            z-index: 10; pointer-events: none;
        }

        #shader-canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1; width: 100%; height: 100%;
            filter: contrast(1.25) brightness(1.1) saturate(1.2);
        }

        /* TELEMETRÍA SUPERIOR HUD */
        header {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 100; pointer-events: none; width: 90%; text-align: center;
        }

        .cinema-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(11px, 2.5vw, 15px);
            letter-spacing: 10px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        /* BOTONES DEL SISTEMA EN LOS MARGENES INFERIORES */
        .ui-left-hud {
            position: fixed; bottom: 25px; left: 25px;
            z-index: 100; display: flex; gap: 15px;
        }

        .home-btn {
            height: 42px; padding: 0 22px;
            border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 11px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
            background: var(--hud-bg); border: 1px solid rgba(0, 242, 255, 0.3); color: #fff;
            backdrop-filter: blur(20px); text-decoration: none;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .home-btn:hover { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 10px rgba(0, 242, 255, 0.2);
            transform: translateY(-3px);
        }

        .ui-right-hud { position: fixed; bottom: 25px; right: 25px; z-index: 100; }
        
        .orb-blackhole {
            width: 42px; height: 42px; border-radius: 6px;
            background: var(--hud-bg); border: 1px solid rgba(188, 19, 254, 0.3);
            display: flex; align-items: center; justify-content: center; text-decoration: none;
            backdrop-filter: blur(20px); transition: all 0.3s;
        }
        .orb-blackhole:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 25px var(--neon-purple);
            transform: translateY(-3px);
        }

        /* CUADRO NARRATIVO FLOTANTE DE CINE */
        .narrative-card {
            position: fixed; bottom: 95px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 580px;
            background: rgba(2, 6, 12, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--neon-cyan);
            padding: 22px; border-radius: 8px; z-index: 80;
            backdrop-filter: blur(30px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        #stage-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(14px, 3.5vw, 19px); 
            color: var(--neon-cyan); margin: 0; 
            text-transform: uppercase; letter-spacing: 6px;
        }

        #stage-desc { 
            font-size: clamp(11px, 2.2vw, 12px); 
            margin-top: 10px; color: rgba(255,255,255,0.7); 
            line-height: 1.6; letter-spacing: 0.8px;
        }

        /* PANTALLA INICIAL DE CONTROL DE ENERGÍA */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: radial-gradient(circle at center, #030710 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease;
        }

        .spielberg-btn {
            background: transparent; border: 1px solid var(--neon-main);
            color: var(--neon-main); font-family: 'Orbitron'; font-size: 13px;
            padding: 16px 45px; letter-spacing: 7px; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.15); transition: all 0.4s ease;
        }
        .spielberg-btn:hover {
            color: #000; background: var(--neon-main);
            box-shadow: 0 0 40px var(--neon-main);
            letter-spacing: 9px; font-weight: bold;
        }

        #creditos_btn {
            position: fixed; top: 22px; right: 22px;
            background: transparent; border: none;
            color: rgba(255,255,255,0.2); font-size: 9px; cursor: pointer; z-index: 100;
        }
    </style>
</head>

<body>

<div id="intro-overlay">
    <button class="spielberg-btn" id="btn-main-init">ENGAGE QUANTUM MATRIX</button>
</div>

<div class="overlay-cinema"></div>
<div id="shader-canvas"></div>

<header><div class="cinema-title">TEMPORAL METRICS & QUANTUM WARP</div></header>

<div class="ui-left-hud">
    <a href="index.html" class="home-btn">⬅ MTRX</a>
    <a href="fps-world.html" class="home-btn">🚀 NAV</a>
</div>

<div class="ui-right-hud">
    <a href="demo-3d.html" class="orb-blackhole" title="Métrica de Singularidad">🌀</a>
</div>

<div class="narrative-card" id="narrative-box" style="opacity: 0; transform: translate(-50%, 20px);">
    <h2 id="stage-title">...</h2>
    <p id="stage-desc">...</p>
</div>

<button id="creditos_btn" onclick="window.location.href='creditos.html'">SYS.LOG</button>

<script>
    let scene, camera, renderer, shaderMaterial, mesh;
    let stage = 0, active = false, audioCtx, mainGain;
    
    // Parámetros de color y velocidad para el procesador gráfico (GLSL)
    const stageSettings = [
        { mode: 0.0, speed: 0.4, color: new THREE.Vector3(0.0, 0.95, 1.0) }, // PLANCK
        { mode: 1.0, speed: 1.8, color: new THREE.Vector3(0.22, 1.0, 0.08) }, // OXIDACIÓN CELULAR
        { mode: 2.0, speed: 0.15, color: new THREE.Vector3(1.0, 0.8, 0.0) }, // DILATACIÓN GRAVITATORIA
        { mode: 3.0, speed: 6.5, color: new THREE.Vector3(0.0, 1.0, 0.8) }, // MOTOR WARP ALCUBIERRE
        { mode: 4.0, speed: 0.9, color: new THREE.Vector3(0.73, 0.05, 1.0) } // SINGULARIDAD M87
    ];

    const timeline = [
        { t: "Matriz Cuántica de Planck", d: "Dimensión cuántica base: Fluctuaciones métricas de energía pura vibrando a frecuencias subatómicas antes del colapso de la masa.", dur: 9000, freq: 440 },
        { t: "Oxidación Celular Espacial", d: "Cinética Molecular: Corrientes reactivas de oxígeno saturan las membranas celulares acelerando la apoptosis. El tiempo biológico entra en degradación térmica.", dur: 11000, freq: 310 },
        { t: "Dilatación Gravitacional Crítica", d: "Relatividad de Einstein: La proximidad de un horizonte masivo curva el espacio-tiempo. El reloj de telemetría de la nave se ralentiza al 98%.", dur: 12000, freq: 190 },
        { t: "Distorsión Métrica Warp", d: "Campo Alcubierre activo: Contracción hiperbólica del tejido espacial delantero. La velocidad supera la luz y la flecha del tiempo colapsa hacia atrás.", dur: 12000, freq: 150 },
        { t: "Singularidad Absoluta", d: "Estructura geométrica rota. Densidad infinita. El flujo de información cuántica se detiene y los relojes físicos dejan de tener sentido.", dur: 13000, freq: 55 }
    ];

    // CÓDIGO DE SOMBREADO DE HOLLYWOOD (CORRE EN LA TARJETA GRÁFICA)
    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec3(position, 1.0).xyzw;
        }
    `;

    const fragmentShader = `
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform float u_mode;
        uniform float u_speed;
        uniform vec3 u_color;
        varying vec2 vUv;

        // Generador de ruido fractal para simular fluidos cósmicos / deformaciones temporales
        mat2 rotate2d(float angle){
            return mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
            
            float t = u_time * u_speed;
            
            // Transformaciones geométricas según la física de cada fase
            if(u_mode == 2.0) { // Pozo gravitatorio: Lente de atracción al centro
                float r = length(uv);
                uv *= 1.0 + 0.6 / (r * r + 0.1);
                uv *= rotate2d(t * 0.1);
            } else if(u_mode == 3.0) { // Warp: Efecto túnel hiperbólico hiper-estirado
                float angle = atan(uv.y, uv.x);
                float radius = length(uv);
                uv = vec2(angle * 0.318, 1.0 / (radius + 0.01) - t);
            } else if(u_mode == 4.0) { // Singularidad: Vórtice espiral infinito
                float r = length(uv);
                uv *= rotate2d(t * 0.4 + 1.0 / (r + 0.05));
            } else { // Planck y Oxidación: Ondas e interferencias fluidas
                uv *= rotate2d(t * 0.03);
            }

            // Generación de la textura volumétrica de plasma espacial
            float strength = 0.0;
            vec2 surface = uv * 2.5;
            
            for(float i = 1.0; i < 5.0; i++) {
                surface.x += sin(surface.y + t + i) * 0.4;
                surface.y += cos(surface.x + t - i) * 0.4;
                strength += abs(0.1 / (surface.x * surface.y + 0.01));
            }

            // Aplicación de color y caída de luz de cine
            vec3 finalColor = u_color * strength * 0.12;
            
            // Añadir el "reloj cuántico" central embebido por código de shader en fases 2 y 4
            float distCenter = length(gl_FragCoord.xy - u_resolution.xy*0.5);
            if(u_mode == 2.0 || u_mode == 4.0 || u_mode == 0.0) {
                float circle = abs(distCenter - min(u_resolution.x, u_resolution.y)*0.2);
                if(circle < 1.5) finalColor += u_color * 0.7;
            }

            // Viñeteado de cámara integrado
            float vignette = length(vUv - 0.5);
            finalColor *= 1.0 - vignette * vignette * 1.4;

            gl_FragColor = vec4(finalColor, 1.0);
        }
    `;

    function initEngine() {
        const container = document.getElementById('shader-canvas');
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Configuración de variables uniformes para comunicar JavaScript con la GPU
        shaderMaterial = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                u_time: { value: 0 },
                u_mode: { value: 0.0 },
                u_speed: { value: 0.4 },
                u_color: { value: stageSettings[0].color }
            },
            depthWrite: false,
            depthTest: false
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        mesh = new THREE.Mesh(geometry, shaderMaterial);
        scene.add(mesh);

        window.addEventListener('resize', onResize);
    }

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        mainGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    }

    function playTone(f) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = stage === 3 ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.5);
        osc.connect(g); g.connect(mainGain);
        osc.start(); osc.stop(audioCtx.currentTime + 3.5);
    }

    const clock = new THREE.Clock();
    function renderLoop() {
        requestAnimationFrame(renderLoop);
        if (!active) return;
        
        shaderMaterial.uniforms.u_time.value = clock.getElapsedTime();
        renderer.render(scene, camera);
    }

    function nextStage() {
        const s = timeline[stage];
        const settings = stageSettings[stage];
        const box = document.getElementById("narrative-box");
        
        box.style.opacity = 0;
        box.style.transform = "translate(-50%, 15px)";
        
        setTimeout(() => {
            document.getElementById("stage-title").innerText = s.t;
            document.getElementById("stage-desc").innerText = s.d;
            document.getElementById("stage-title").style.color = `rgb(${Math.floor(settings.color.x*255)}, ${Math.floor(settings.color.y*255)}, ${Math.floor(settings.color.z*255)})`;
            
            // Inyección instantánea de parámetros de física al driver de la GPU
            shaderMaterial.uniforms.u_mode.value = settings.mode;
            shaderMaterial.uniforms.u_speed.value = settings.speed;
            shaderMaterial.uniforms.u_color.value = settings.color;
            
            box.style.opacity = 1;
            box.style.transform = "translate(-50%, 0px)";
            playTone(s.freq);
        }, 700);

        setTimeout(() => {
            stage = (stage + 1) % timeline.length;
            nextStage();
        }, s.dur);
    }

    function onResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        shaderMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    }

    document.getElementById('btn-main-init').addEventListener('click', function() {
        document.getElementById('intro-overlay').style.opacity = 0;
        setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 1200);
        initAudio();
        active = true;
        nextStage();
    });

    initEngine();
    renderLoop();
</script>
</body>
</html>
