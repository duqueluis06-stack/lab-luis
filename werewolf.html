<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Werewolf 3D Universe - Fixed Mobile</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; background: #080810; }
        #custom-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #080810; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; color: #fff; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Joystick Miniatura */
        #joystick-wrapper { position: fixed; bottom: 30px; left: 30px; width: 70px; height: 70px; background: rgba(15, 15, 25, 0.6); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 999; touch-action: none; backdrop-filter: blur(4px); }
        #joystick-knob { width: 30px; height: 30px; background: linear-gradient(135deg, #dc2626, #991b1b); border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.5); touch-action: none; }
        
        /* HUD Superior */
        #coordenadas-hud { position: fixed; top: 10px; left: 10px; background: rgba(10, 10, 15, 0.85); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 6px; padding: 8px; color: #fff; font-size: 11px; z-index: 999; display: flex; flex-direction: column; gap: 6px; width: 160px; }
        .coord-row { display: flex; justify-content: space-between; font-family: monospace; }
        .coord-val { color: #00ffaa; font-weight: bold; }
        .hud-btn { background: rgba(220, 38, 38, 0.3); border: 1px solid #dc2626; color: #fff; border-radius: 4px; padding: 4px; font-size: 10px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div style="font-size: 14px; font-weight: bold; letter-spacing: 1px;">CARGANDO MUNDO ESTABLE...</div>
    </div>

    <div id="coordenadas-hud">
        <div class="coord-row">
            <span>X:<span id="valX" class="coord-val">10.00</span></span>
            <span>Y:<span id="valY" class="coord-val">1.02</span></span>
            <span>Z:<span id="valZ" class="coord-val">10.00</span></span>
        </div>
        <button id="btn-copy" class="hud-btn">Copiar Ubicación</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-knob"></div>
    </div>

    <!-- vr-mode-ui="enabled: false" -> Elimina carteles y botones VR basura del móvil -->
    <a-scene vr-mode-ui="enabled: false" shadow="type: pcfsoft" renderer="colorManagement: true; antialias: false; precision: mediump;">
        <a-assets>
            <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="avatar-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="werewolf-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/werewolf.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; color: #1e1e2d; intensity: 0.7;"></a-entity>
        <a-entity light="type: directional; color: #a1b0d4; intensity: 0.7; castShadow: true;" position="10 30 15"></a-entity>

        <a-entity id="entorno" gltf-model="#pueblo" position="0 0 0" shadow="receive: true; cast: false;"></a-entity>

        <!-- WEREWOLF (Merodeador del bosque periférico) -->
        <a-entity id="werewolf-beast" gltf-model="#werewolf-src" position="-18 1.02 -18" shadow="cast: true" animation-mixer="clip: *; timeScale: 1.0; loop: repeat;"></a-entity>

        <!-- RIG DEL JUGADOR (Posicionado dentro de la casa por defecto) -->
        <a-entity id="player-rig" position="10.00 1.02 10.00">
            <!-- Un solo modelo de Avatar fijo que nunca se desvincula -->
            <a-entity id="luis-avatar" gltf-model="#avatar-src" shadow="cast: true" animation-mixer="clip: *; timeScale: 0; loop: repeat;"></a-entity>
            
            <a-entity id="camera-orbit" position="0 1.6 0">
                <a-entity id="main-camera" camera position="0 0 3.5"></a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        // COORDENADAS INTERIORES DE CONTROL
        const SPAWN_X = 10.00;
        const SPAWN_Y = 1.02;
        const SPAWN_Z = 10.00;
        const VELOCIDAD_AVANCE = 0.08; 

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarEntity = document.getElementById('luis-avatar');
        const entornoEntity = document.getElementById('entorno');
        const wolfEntity = document.getElementById('werewolf-beast');

        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valZ = document.getElementById('valZ');
        const btnCopy = document.getElementById('btn-copy');

        let moveX = 0, moveY = 0;
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0; let camPitch = 0.1;
        let wasMoving = false; let entornoCargado = false;
        let optimizadorFrames = 0; // Reduce ejecuciones pesadas de CPU

        // Variables de IA Lobo
        let wolfX = -18, wolfZ = -18, wolfY = 1.02;
        let wolfAngle = Math.random() * Math.PI * 2;
        let wolfTimer = 0;
        const wolfSpeed = 0.03;

        entornoEntity.addEventListener('model-loaded', () => { 
            entornoCargado = true; 
            const loader = document.getElementById('custom-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }
        });

        rig.setAttribute('position', `${SPAWN_X} ${SPAWN_Y} ${SPAWN_Z}`);

        // Control de cámara táctil ultra-limpio sin botones molestos
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#joystick-wrapper') || e.target.tagName === 'BUTTON') return;
            screenDragging = true; prevScreenX = e.touches[0].clientX; prevScreenY = e.touches[0].clientY;
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (!screenDragging) return;
            camYaw -= (e.touches[0].clientX - prevScreenX) * 0.005;
            camPitch = Math.max(-0.5, Math.min(1.0, camPitch - (e.touches[0].clientY - prevScreenY) * 0.004));
            prevScreenX = e.touches[0].clientX; prevScreenY = e.touches[0].clientY;
        }, {passive: true});

        window.addEventListener('touchend', () => screenDragging = false);

        // Lógica del Joystick Miniatura Móvil
        knob.addEventListener('touchstart', (e) => { 
            joyDragging = true; 
            joyStartX = e.touches[0].clientX; 
            joyStartY = e.touches[0].clientY; 
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (!joyDragging) return;
            let dx = e.touches[0].clientX - joyStartX;
            let dy = e.touches[0].clientY - joyStartY;
            const maxLen = 22; 
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen;
        }, {passive: true});

        window.addEventListener('touchend', () => { 
            joyDragging = false; 
            knob.style.transform = 'translate(0px,0px)'; 
            moveX = 0; moveY = 0; 
        });

        btnCopy.addEventListener('click', () => {
            const pos = rig.getAttribute('position');
            navigator.clipboard.writeText(`position="${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}"`).then(() => {
                btnCopy.textContent = "¡Copiado!"; setTimeout(() => btnCopy.textContent = "Copiar Ubicación", 1200);
            });
        });

        function esVegetacion(object) {
            let current = object;
            while (current) {
                const n = (current.name || "").toLowerCase();
                if (n.includes('tree') || n.includes('arbol') || n.includes('leaf') || n.includes('branch') || n.includes('grass')) return true;
                current = current.parent;
            }
            return false;
        }

        function filtrarSuelo(intersects) {
            for (let i = 0; i < intersects.length; i++) {
                if (!esVegetacion(intersects[i].object)) return intersects[i];
            }
            return null;
        }

        // BUCLE PRINCIPAL DE RENDERIZADO OPTIMIZADO
        function loopGamer() {
            cameraOrbit.object3D.rotation.set(camPitch, camYaw, 0);
            const meshMundo = entornoEntity.object3D;

            if (!meshMundo || !entornoCargado || !meshMundo.children || meshMundo.children.length === 0) {
                requestAnimationFrame(loopGamer); return;
            }

            optimizadorFrames++;

            const pos = rig.getAttribute('position');
            let oldX = pos.x; let oldZ = pos.z; let oldY = pos.y;
            
            let isMoving = (joyDragging && (moveX !== 0 || moveY !== 0));

            // CAMBIO DE ANIMACIÓN SEGURO (Modifica el multiplicador de tiempo sin destruir el esqueleto)
            if (isMoving !== wasMoving) {
                if (isMoving) {
                    avatarEntity.setAttribute('animation-mixer', 'timeScale: 1.15'); // Camina
                } else {
                    avatarEntity.setAttribute('animation-mixer', 'timeScale: 0');    // Se congela de inmediato al frenar
                }
                wasMoving = isMoving;
            }

            if (isMoving) {
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);
                
                pos.x += (fwdX * -moveY + rgtX * moveX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -moveY + rgtZ * moveX) * VELOCIDAD_AVANCE;

                const angleTarget = camYaw + Math.atan2(moveX, moveY);
                let angleCurrent = avatarEntity.object3D.rotation.y;
                avatarEntity.object3D.rotation.y += Math.atan2(Math.sin(angleTarget - angleCurrent), Math.cos(angleTarget - angleCurrent)) * 0.25;
            }

            // OPTIMIZACIÓN SALVAVIDAS: El Raycaster del jugador solo se ejecuta si se está moviendo
            if (isMoving) {
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                const hit = filtrarSuelo(raycaster.intersectObject(meshMundo, true));
                if (hit) {
                    let groundY = hit.point.y;
                    if ((groundY - oldY) > 0.7) { pos.x = oldX; pos.z = oldZ; pos.y = oldY; } 
                    else { pos.y += (groundY - pos.y) * 0.3; }
                } else { pos.x = oldX; pos.z = oldZ; pos.y = oldY; }
            }

            // IA DEL WEREWOLF OPTIMIZADA: Solo calcula terreno 1 de cada 3 frames para proteger la CPU
            if (wolfEntity && optimizadorFrames % 3 === 0) {
                wolfTimer -= 3;
                if (wolfTimer <= 0) {
                    wolfAngle = Math.random() * Math.PI * 2;
                    wolfTimer = Math.floor(Math.random() * 120) + 90;
                }
                let nextWolfX = wolfX + Math.sin(wolfAngle) * wolfSpeed;
                let nextWolfZ = wolfZ + Math.cos(wolfAngle) * wolfSpeed;

                // Zona perimetral segura del bosque (No entra al pueblo de golpe)
                if (nextWolfX > -6 && nextWolfX < 20 && nextWolfZ > -6 && nextWolfZ < 20) {
                    wolfAngle += Math.PI;
                } else {
                    const wolfRay = new THREE.Raycaster();
                    wolfRay.set(new THREE.Vector3(nextWolfX, 2000, nextWolfZ), new THREE.Vector3(0, -1, 0));
                    const wolfHit = filtrarSuelo(wolfRay.intersectObject(meshMundo, true));
                    if (wolfHit) {
                        wolfX = nextWolfX; wolfZ = nextWolfZ; wolfY = wolfHit.point.y;
                        wolfEntity.setAttribute('position', `${wolfX} ${wolfY} ${wolfZ}`);
                        wolfEntity.object3D.rotation.y = wolfAngle + Math.PI;
                    }
                }
            }

            valX.textContent = pos.x.toFixed(2);
            valY.textContent = pos.y.toFixed(2);
            valZ.textContent = pos.z.toFixed(2);
            rig.setAttribute('position', pos);

            requestAnimationFrame(loopGamer);
        }
        loopGamer();
    </script>
</body>
</html>
