<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Werewolf 3D Universe - Edición Final</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        #custom-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #080810; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease, visibility 0.6s; color: #fff; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Controles e Interfaz UI */
        #joystick-wrapper { position: fixed; bottom: 30px; left: 30px; width: 110px; height: 110px; background: rgba(15, 15, 25, 0.4); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 999; touch-action: none; backdrop-filter: blur(4px); }
        #joystick-knob { width: 45px; height: 45px; background: linear-gradient(135deg, #dc2626, #991b1b); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; touch-action: none; transition: transform 0.05s ease-out; }
        
        #arrows-wrapper { position: fixed; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 5px; z-index: 999; }
        .arrow-btn { background: rgba(15, 15, 25, 0.6); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 16px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; user-select: none; }
        .arrow-btn:active { background: #dc2626; border-color: #ff4545; }
        
        #coordenadas-hud { position: fixed; top: 15px; left: 15px; background: rgba(10, 10, 15, 0.85); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 13px; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: flex; flex-direction: column; gap: 8px; }
        .coord-row { display: flex; gap: 15px; font-family: monospace; font-size: 14px; }
        .coord-val { color: #00ffaa; font-weight: bold; }
        
        .hud-actions { display: flex; gap: 8px; margin-top: 4px; }
        .hud-btn { flex: 1; background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; color: #fff; border-radius: 4px; padding: 5px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-weight: 600; text-transform: uppercase; }
        .hud-btn:hover { background: rgba(220, 38, 38, 0.3); }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div style="font-size: 18px; font-weight: bold; tracking-wider; margin-bottom: 5px;">CARGANDO ENTORNO</div>
        <div style="font-size: 12px; color: #888;">Generando colisiones y mapeo de terreno...</div>
    </div>

    <div id="coordenadas-hud">
        <div class="coord-row">
            <span>X: <span id="valX" class="coord-val">7.14</span></span>
            <span>Y: <span id="valY" class="coord-val">2.24</span></span>
            <span>Z: <span id="valZ" class="coord-val">13.99</span></span>
        </div>
        <div class="hud-actions">
            <button id="btn-center" class="hud-btn">Reaparecer</button>
            <button id="btn-copy" class="hud-btn">Copiar Vector3</button>
        </div>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-knob"></div>
    </div>

    <div id="arrows-wrapper">
        <div></div>
        <button id="btn-up" class="arrow-btn">▲</button>
        <div></div>
        <button id="btn-left" class="arrow-btn">◀</button>
        <div class="arrow-btn" style="background:none; border:none; font-size:11px; opacity:0.3;">CAM</div>
        <button id="btn-right" class="arrow-btn">▶</button>
        <div></div>
        <button id="btn-down" class="arrow-btn">▼</button>
        <div></div>
    </div>

    <a-scene shadow="type: pcfsoft" renderer="colorManagement: true; antialias: true;">
        <a-assets>
            <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="avatar-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="avatar-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; color: #1e1e2d; intensity: 0.6;"></a-entity>
        <a-entity light="type: directional; color: #a1b0d4; intensity: 0.8; castShadow: true; shadowMapHeight: 1024; shadowMapWidth: 1024;" position="10 25 15"></a-entity>

        <a-entity id="entorno" gltf-model="#pueblo" position="0 0 0" shadow="receive: true; cast: false;"></a-entity>

        <a-entity id="player-rig" position="20 500 8">
            
            <a-entity id="avatar-container" position="0 0 0">
                <a-entity id="mesh-walk" gltf-model="#avatar-walk-src" shadow="cast: true" animation-mixer="timeScale: 1.1;" visible="false" position="0 0 0"></a-entity>
                <a-entity id="mesh-idle" gltf-model="#avatar-idle-src" shadow="cast: true" animation-mixer="timeScale: 1.0;" visible="true" position="0 0 0"></a-entity>
            </a-entity>

            <a-entity id="camera-orbit" position="0 2.5 0">
                <a-entity id="main-camera" camera position="0 0 4.5"></a-entity>
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        // Configuración de tu Spawn Point exacto
        const SPAWN_X = 10;
        const SPAWN_Z = 12;
        const VELOCIDAD_AVANCE = 0.09;   

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarContainer = document.getElementById('avatar-container');
        
        const meshIdle = document.getElementById('mesh-idle');
        const meshWalk = document.getElementById('mesh-walk');
        
        const mainCamera = document.getElementById('main-camera');
        const sceneEl = document.querySelector('a-scene');
        const entornoEntity = document.getElementById('entorno');

        // UI HUD
        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valZ = document.getElementById('valZ');
        const btnCopy = document.getElementById('btn-copy');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0;   
        let camPitch = 0.1; // Ángulo inicial óptimo mirando levemente hacia abajo
        let camDist = 4.5; 
        let arrowCam = { up: false, down: false, left: false, right: false };
        let wasMoving = false;
        
        let inicializado = false;
        let entornoCargado = false;

        entornoEntity.addEventListener('model-loaded', () => {
            entornoCargado = true;
        });

        function ocultarLoader() {
            const loader = document.getElementById('custom-loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                setTimeout(() => loader.remove(), 600);
            }
        }

        // Posicionamiento de seguridad inicial (en el aire, sobre tu Spawn)
        rig.setAttribute('position', `${SPAWN_X} 500 ${SPAWN_Z}`);

        // Botón de reaparición rápida
        document.getElementById('btn-center').addEventListener('click', () => {
            inicializado = false;
            rig.setAttribute('position', `${SPAWN_X} 500 ${SPAWN_Z}`);
            camYaw = 0;
            camPitch = 0.1;
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;
            
            meshWalk.setAttribute('visible', 'false');
            meshIdle.setAttribute('visible', 'true');
            detenerAnimacion(meshIdle);
            wasMoving = false;
        });

        // Zoom de cámara
        window.addEventListener('wheel', (e) => {
            camDist += e.deltaY * 0.05;
            camDist = Math.max(2.0, Math.min(25.0, camDist));
            mainCamera.setAttribute('position', `0 0 ${camDist}`);
        }, { passive: true });

        // Eventos de Joystick Virtual (Móvil y Escritorio)
        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX; joyStartY = point.clientY;
            e.stopPropagation();
        }
        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX; let dy = point.clientY - joyStartY;
            const maxLen = 35;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; 
            moveY = dy / maxLen;
            e.stopPropagation();
        }
        function onJoyEnd() {
            joyDragging = false; knob.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        }

        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        // Teclado WASD
        window.addEventListener('keydown', (e) => { 
            const k = e.key.toLowerCase(); 
            if (k in keys) keys[k] = true; 
        });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        // Arrastrar pantalla para orbitar cámara
        function onScreenStart(e) {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.closest('#coordenadas-hud') || e.target.tagName === 'BUTTON') return;
            screenDragging = true;
            const point = e.touches ? e.touches[0] : e;
            prevScreenX = point.clientX;
            prevScreenY = point.clientY;
        }
        function onScreenMove(e) {
            if (!screenDragging) return;
            const point = e.touches ? e.touches[0] : e;
            const clientX = point.clientX;
            const clientY = point.clientY;
            camYaw -= (clientX - prevScreenX) * 0.012;
            camPitch += (clientY - prevScreenY) * 0.009; 
            prevScreenX = clientX; 
            prevScreenY = clientY;
        }
        function onScreenEnd() { screenDragging = false; }

        window.addEventListener('mousedown', onScreenStart);
        window.addEventListener('mousemove', onScreenMove);
        window.addEventListener('mouseup', onScreenEnd);
        window.addEventListener('touchstart', onScreenStart, {passive: true});
        window.addEventListener('touchmove', onScreenMove, {passive: true});
        window.addEventListener('touchend', onScreenEnd);

        // Configurar botones táctiles de la cámara
        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => { arrowCam[direction] = true; });
            btn.addEventListener('mouseup', () => { arrowCam[direction] = false; });
            btn.addEventListener('mouseleave', () => { arrowCam[direction] = false; });
            btn.addEventListener('touchstart', () => { arrowCam[direction] = true; });
            btn.addEventListener('touchend', () => { arrowCam[direction] = false; });
        };
        setupArrowCamera('btn-up', 'up'); setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left'); setupArrowCamera('btn-right', 'right');

        // Portapapeles para almacenar coordenadas rápidamente
        btnCopy.addEventListener('click', () => {
            const pos = rig.getAttribute('position');
            const formatted = `position="${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}"`;
            navigator.clipboard.writeText(formatted).then(() => {
                btnCopy.textContent = "¡Copiado!";
                btnCopy.style.background = "rgba(0, 255, 170, 0.2)";
                btnCopy.style.borderColor = "#00ffaa";
                setTimeout(() => {
                    btnCopy.textContent = "Copiar Vector3";
                    btnCopy.style.background = "rgba(220, 38, 38, 0.15)";
                    btnCopy.style.borderColor = "#dc2626";
                }, 1500);
            });
        });

        // ALGORITMO RECURSIVO DE FILTRADO: Analiza objetos y padres para ignorar cualquier vegetación/árboles de forma absoluta
        function esVegetacion(object) {
            let current = object;
            while (current) {
                const nombre = (current.name || "").toLowerCase();
                if (nombre.includes('grass') || nombre.includes('hierba') || 
                    nombre.includes('pasto') || nombre.includes('weed') || 
                    nombre.includes('foliage') || nombre.includes('bush') || 
                    nombre.includes('matorral') || nombre.includes('plant') ||
                    nombre.includes('flor') || nombre.includes('flower') ||
                    nombre.includes('tree') || nombre.includes('arbol') ||
                    nombre.includes('hoja') || nombre.includes('leaf') ||
                    nombre.includes('leaves') || nombre.includes('rama') ||
                    nombre.includes('branch') || nombre.includes('tronco') ||
                    nombre.includes('trunk') || nombre.includes('wood') ||
                    nombre.includes('pine') || nombre.includes('pino') ||
                    nombre.includes('foresta') || nombre.includes('forest') ||
                    nombre.includes('vegeta')) {
                    return true; // Es vegetación o parte de un árbol, ignorar física
                }
                current = current.parent; // Sube en la jerarquía del GLTF
            }
            return false;
        }

        function filtrarInterseccionSuelo(intersects) {
            for (let i = 0; i < intersects.length; i++) {
                if (esVegetacion(intersects[i].object)) {
                    continue; // Pasa de largo si es árbol/hierba para buscar el suelo de abajo
                }
                return intersects[i]; // Retorna la colisión firme (suelo/casa)
            }
            return null;
        }

        // Control dinámico de animaciones con el mixer de A-Frame
        function reproducirAnimacion(entity) {
            if (entity.components && entity.components['animation-mixer']) {
                entity.components['animation-mixer'].play();
            }
        }

        function detenerAnimacion(entity) {
            if (entity.components && entity.components['animation-mixer']) {
                entity.components['animation-mixer'].pause();
            }
        }

        // Forzar congelamiento inicial en cuanto los modelos 3D carguen
        meshIdle.addEventListener('model-loaded', () => {
            setTimeout(() => detenerAnimacion(meshIdle), 100);
        });
        meshWalk.addEventListener('model-loaded', () => {
            setTimeout(() => detenerAnimacion(meshWalk), 100);
        });

        // Bucle Principal de Renderizado y Física
        function engineLoop() {
            if (arrowCam.left) camYaw += 0.02;
            if (arrowCam.right) camYaw -= 0.02;
            if (arrowCam.up) camPitch -= 0.015;   
            if (arrowCam.down) camPitch += 0.015;  

            // CLAMP DE SEGURIDAD PARA LA CÁMARA: Evita que se sumerja bajo el suelo (-0.05 mínimo)
            camPitch = Math.max(-1.5, Math.min(1.5, camPitch)); 
            cameraOrbit.object3D.rotation.y = camYaw;
            cameraOrbit.object3D.rotation.x = camPitch;

            const mesh = entornoEntity.object3D;

            if (!mesh || !entornoCargado || !mesh.children || mesh.children.length === 0) {
                requestAnimationFrame(engineLoop);
                return;
            }

            const pos = rig.getAttribute('position');

            // --- FASE DE ENTRADA INICIAL (Fijado al suelo firme) ---
            if (!inicializado) {
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                
                const intersects = raycaster.intersectObject(mesh, true);
                const hitValido = filtrarInterseccionSuelo(intersects);
                
                if (hitValido) {
                    pos.y = hitValido.point.y;
                    rig.setAttribute('position', pos);
                    inicializado = true; 
                    detenerAnimacion(meshIdle);
                    ocultarLoader();
                }
                requestAnimationFrame(engineLoop);
                return;
            }
            
            let oldX = pos.x;
            let oldZ = pos.z;
            let oldY = pos.y;

            let inputX = 0; let inputY = 0;
            if (keys.w) inputY = -1; 
            if (keys.s) inputY = 1;  
            if (keys.a) inputX = -1; 
            if (keys.d) inputX = 1;  

            if (joyDragging) {
                inputX = moveX;
                inputY = moveY;
            }

            let isMoving = (inputX !== 0 || inputY !== 0);

            // Control Dinámico de Animaciones (Alterna visible y pausa)
            if (isMoving !== wasMoving) {
                if (isMoving) {
                    meshIdle.setAttribute('visible', 'false');
                    meshWalk.setAttribute('visible', 'true');
                    reproducirAnimacion(meshWalk);
                } else {
                    meshWalk.setAttribute('visible', 'false');
                    meshIdle.setAttribute('visible', 'true');
                    detenerAnimacion(meshIdle);
                }
                wasMoving = isMoving;
            }

            // Desplazar rig según el giro de la cámara
            if (isMoving) {
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_AVANCE;

                // CORRECCIÓN DE ORIENTACIÓN: Apuntar cara de Luis al sentido exacto de avance (Se elimina desfase de 180 grados)
                const targetAngle = camYaw + Math.atan2(inputX, inputY);
                let currentAngle = avatarContainer.object3D.rotation.y;
                let deltaAngle = targetAngle - currentAngle;
                deltaAngle = Math.atan2(Math.sin(deltaAngle), Math.cos(deltaAngle));
                avatarContainer.object3D.rotation.y += deltaAngle * 0.25;
            }

            // Raycaster para el relieve del suelo
            const raycaster = new THREE.Raycaster();
            raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
            
            const intersects = raycaster.intersectObject(mesh, true);
            const hitValido = filtrarInterseccionSuelo(intersects);
            
            if (hitValido) {
                let groundY = hitValido.point.y;
                // Si la diferencia de nivel supera los 0.8m (pared/casa), colisiona y frena.
                if ((groundY - oldY) > 0.8) {
                    pos.x = oldX;
                    pos.z = oldZ;
                    pos.y = oldY;
                } else {
                    pos.y += (groundY - pos.y) * 0.25; // Sube/baja rampas suavemente
                }
            } else {
                pos.x = oldX;
                pos.z = oldZ;
                pos.y = oldY;
            }

            // HUD
            valX.textContent = pos.x.toFixed(2);
            valY.textContent = pos.y.toFixed(2);
            valZ.textContent = pos.z.toFixed(2);

            rig.setAttribute('position', pos);
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
