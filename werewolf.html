<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Werewolf 3D Universe - Mobile Pro</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        #custom-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #080810; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease, visibility 0.6s; color: #fff; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Joystick Miniatura Optimizado para Teléfono */
        #joystick-wrapper { position: fixed; bottom: 25px; left: 25px; width: 75px; height: 75px; background: rgba(15, 15, 25, 0.6); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 999; touch-action: none; backdrop-filter: blur(4px); }
        #joystick-knob { width: 32px; height: 32px; background: linear-gradient(135deg, #dc2626, #991b1b); border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.5); cursor: pointer; touch-action: none; }
        
        /* HUD Discreto de Coordenadas */
        #coordenadas-hud { position: fixed; top: 12px; left: 12px; background: rgba(10, 10, 15, 0.85); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 6px; padding: 10px; color: #fff; font-size: 11px; z-index: 999; backdrop-filter: blur(4px); display: flex; flex-direction: column; gap: 6px; width: 180px; }
        .coord-row { display: flex; justify-content: space-between; font-family: monospace; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 3px; }
        .coord-val { color: #00ffaa; font-weight: bold; }
        .hud-btn { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #fff; border-radius: 4px; padding: 5px; font-size: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div style="font-size: 15px; font-weight: bold;">ENTRANDO A LA CASA...</div>
    </div>

    <div id="coordenadas-hud">
        <div class="coord-row">
            <span>X:<span id="valX" class="coord-val">10.00</span></span>
            <span>Y:<span id="valY" class="coord-val">1.02</span></span>
            <span>Z:<span id="valZ" class="coord-val">10.00</span></span>
        </div>
        <button id="btn-copy" class="hud-btn">Copiar Ubicación</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-knob"></div>
    </div>

    <a-scene vr-mode-ui="enabled: false" shadow="type: pcfsoft" renderer="colorManagement: true; antialias: true;">
        <a-assets>
            <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="avatar-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="avatar-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="werewolf-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/werewolf.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; color: #1e1e2d; intensity: 0.6;"></a-entity>
        <a-entity light="type: directional; color: #a1b0d4; intensity: 0.8; castShadow: true;" position="10 25 15"></a-entity>

        <a-entity id="entorno" gltf-model="#pueblo" position="0 0 0" shadow="receive: true; cast: false;"></a-entity>

        <a-entity id="werewolf-beast" gltf-model="#werewolf-src" position="-15 1.02 -15" shadow="cast: true" animation-mixer="clip: *; timeScale: 1.0;"></a-entity>

        <a-entity id="player-rig" position="10.00 1.02 10.00">
            <a-entity id="avatar-container" position="0 0 0">
                <a-entity id="mesh-walk" gltf-model="#avatar-walk-src" shadow="cast: true" visible="false"></a-entity>
                <a-entity id="mesh-idle" gltf-model="#avatar-idle-src" shadow="cast: true" visible="true"></a-entity>
            </a-entity>

            <a-entity id="camera-orbit" position="0 1.6 0">
                <a-entity id="main-camera" camera position="0 0 4.0"></a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        // CONFIGURA AQUÍ LAS COORDENADAS EXACTAS DE TU CASA
        const SPAWN_X = 10.00;
        const SPAWN_Y = 1.02;
        const SPAWN_Z = 10.00;
        const VELOCIDAD_AVANCE = 0.09; // Velocidad prudente para interiores

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarContainer = document.getElementById('avatar-container');
        const meshIdle = document.getElementById('mesh-idle');
        const meshWalk = document.getElementById('mesh-walk');
        const mainCamera = document.getElementById('main-camera');
        const entornoEntity = document.getElementById('entorno');
        const wolfEntity = document.getElementById('werewolf-beast');

        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valZ = document.getElementById('valZ');
        const btnCopy = document.getElementById('btn-copy');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0; let camPitch = 0.1; let camDist = 4.0;
        let wasMoving = false; let entornoCargado = false;

        // Variables de IA para el Hombre Lobo
        let wolfX = -15, wolfZ = -20, wolfY = 1.02;
        let wolfAngle = Math.random() * Math.PI * 2;
        let wolfTimer = 0;
        const wolfSpeed = 0.035; // Estilo Beast continuo

        entornoEntity.addEventListener('model-loaded', () => { 
            entornoCargado = true; 
            const loader = document.getElementById('custom-loader');
            if (loader) { loader.style.opacity = '0'; loader.style.visibility = 'hidden'; setTimeout(() => loader.remove(), 600); }
        });

        rig.setAttribute('position', `${SPAWN_X} ${SPAWN_Y} ${SPAWN_Z}`);

        // Arrastre libre de vista en pantalla (Suave, sin botones molestos)
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#joystick-wrapper') || e.target.tagName === 'BUTTON') return;
            screenDragging = true; prevScreenX = e.clientX; prevScreenY = e.clientY;
        });
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#joystick-wrapper') || e.target.tagName === 'BUTTON') return;
            screenDragging = true; prevScreenX = e.touches[0].clientX; prevScreenY = e.touches[0].clientY;
        }, {passive: true});

        window.addEventListener('mousemove', (e) => {
            if (!screenDragging) return;
            camYaw -= (e.clientX - prevScreenX) * 0.005;
            camPitch = Math.max(-0.6, Math.min(1.2, camPitch - (e.clientY - prevScreenY) * 0.005));
            prevScreenX = e.clientX; prevScreenY = e.clientY;
        });
        window.addEventListener('touchmove', (e) => {
            if (!screenDragging) return;
            camYaw -= (e.touches[0].clientX - prevScreenX) * 0.005;
            camPitch = Math.max(-0.6, Math.min(1.2, camPitch - (e.touches[0].clientY - prevScreenY) * 0.005));
            prevScreenX = e.touches[0].clientX; prevScreenY = e.touches[0].clientY;
        }, {passive: true});

        window.addEventListener('mouseup', () => screenDragging = false);
        window.addEventListener('touchend', () => screenDragging = false);

        // Control del Joystick Miniatura
        knob.addEventListener('touchstart', (e) => { joyDragging = true; joyStartX = e.touches[0].clientX; joyStartY = e.touches[0].clientY; });
        knob.addEventListener('mousedown', (e) => { joyDragging = true; joyStartX = e.clientX; joyStartY = e.clientY; });

        window.addEventListener('touchmove', (e) => {
            if (!joyDragging) return;
            let dx = e.touches[0].clientX - joyStartX; let dy = e.touches[0].clientY - joyStartY;
            const maxLen = 20; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen;
        }, {passive: false});

        window.addEventListener('mousemove', (e) => {
            if (!joyDragging) return;
            let dx = e.clientX - joyStartX; let dy = e.clientY - joyStartY;
            const maxLen = 20; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen;
        });

        window.addEventListener('mouseup', () => { joyDragging = false; knob.style.transform = 'translate(0px,0px)'; moveX = 0; moveY = 0; });
        window.addEventListener('touchend', () => { joyDragging = false; knob.style.transform = 'translate(0px,0px)'; moveX = 0; moveY = 0; });

        // Teclado opcional PC
        window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        btnCopy.addEventListener('click', () => {
            const pos = rig.getAttribute('position');
            navigator.clipboard.writeText(`position="${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}"`).then(() => {
                btnCopy.textContent = "¡Copiado!"; setTimeout(() => btnCopy.textContent = "Copiar Ubicación", 1200);
            });
        });

        function esVegetacion(object) {
            let current = object;
            while (current) {
                const n = (current.name || "").toLowerCase();
                if (n.includes('tree') || n.includes('arbol') || n.includes('leaf') || n.includes('branch') || n.includes('foliage') || n.includes('grass')) return true;
                current = current.parent;
            }
            return false;
        }

        function filtrarInterseccionSuelo(intersects) {
            for (let i = 0; i < intersects.length; i++) {
                if (!esVegetacion(intersects[i].object)) return intersects[i];
            }
            return null;
        }

        // LOOP MOTOR GRÁFICO
        function engineLoop() {
            cameraOrbit.object3D.rotation.set(camPitch, camYaw, 0);
            const mesh = entornoEntity.object3D;

            if (!mesh || !entornoCargado || !mesh.children || mesh.children.length === 0) {
                requestAnimationFrame(engineLoop); return;
            }

            const pos = rig.getAttribute('position');
            let oldX = pos.x; let oldZ = pos.z; let oldY = pos.y;
            let inputX = 0; let inputY = 0;
            if (keys.w) inputY = -1; if (keys.s) inputY = 1;
            if (keys.a) inputX = -1; if (keys.d) inputX = 1;
            if (joyDragging) { inputX = moveX; inputY = moveY; }

            let isMoving = (inputX !== 0 || inputY !== 0);

            // DETENER EL BUCLE DE CAMINAR DE FORMA IMPLACABLE CUANDO FRENA
            if (isMoving !== wasMoving) {
                if (isMoving) {
                    meshIdle.removeAttribute('animation-mixer');
                    meshIdle.setAttribute('visible', 'false'); 
                    meshWalk.setAttribute('visible', 'true');
                    meshWalk.setAttribute('animation-mixer', 'clip: *; timeScale: 1.1; loop: repeat;');
                } else {
                    // Quitamos el componente para que no se quede la acción de caminar encendida de fondo
                    meshWalk.removeAttribute('animation-mixer');
                    meshWalk.setAttribute('visible', 'false'); 
                    meshIdle.setAttribute('visible', 'true');
                    meshIdle.setAttribute('animation-mixer', 'clip: *; timeScale: 1.0; loop: repeat;');
                }
                wasMoving = isMoving;
            }

            if (isMoving) {
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);
                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;

                const targetAngle = camYaw + Math.atan2(inputX, inputY);
                let currentAngle = avatarContainer.object3D.rotation.y;
                avatarContainer.object3D.rotation.y += Math.atan2(Math.sin(targetAngle - currentAngle), Math.cos(targetAngle - currentAngle)) * 0.25;
            }

            // Colisiones e inclinación del suelo del avatar
            const raycaster = new THREE.Raycaster();
            raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
            const hit = filtrarInterseccionSuelo(raycaster.intersectObject(mesh, true));
            if (hit) {
                let groundY = hit.point.y;
                if ((groundY - oldY) > 0.8) { pos.x = oldX; pos.z = oldZ; pos.y = oldY; } 
                else { pos.y += (groundY - pos.y) * 0.3; }
            } else { pos.x = oldX; pos.z = oldZ; pos.y = oldY; }

            // LÓGICA DE IA DEL WEREWOLF (Vagando solo por el bosque continuo)
            if (wolfEntity) {
                wolfTimer -= 1;
                if (wolfTimer <= 0) {
                    wolfAngle = Math.random() * Math.PI * 2;
                    wolfTimer = Math.floor(Math.random() * 160) + 100; // cambia rumbo cada 3-5 segundos
                }
                let nextWolfX = wolfX + Math.sin(wolfAngle) * wolfSpeed;
                let nextWolfZ = wolfZ + Math.cos(wolfAngle) * wolfSpeed;

                // Forzar al lobo a mantenerse en los límites del bosque/periferia
                if(nextWolfX > -5 && nextWolfX < 25 && nextWolfZ > -5 && nextWolfZ < 25) {
                    // Si intenta entrar al pueblo, lo redirigimos hacia afuera
                    wolfAngle += Math.PI;
                } else {
                    const wolfRay = new THREE.Raycaster();
                    wolfRay.set(new THREE.Vector3(nextWolfX, 2000, nextWolfZ), new THREE.Vector3(0, -1, 0));
                    const wolfHit = filtrarInterseccionSuelo(wolfRay.intersectObject(mesh, true));
                    if (wolfHit) {
                        wolfX = nextWolfX; wolfZ = nextWolfZ; wolfY = wolfHit.point.y;
                        wolfEntity.setAttribute('position', `${wolfX} ${wolfY} ${wolfZ}`);
                        wolfEntity.object3D.rotation.y = wolfAngle + Math.PI;
                    }
                }
            }

            valX.textContent = pos.x.toFixed(2);
            valY.textContent = pos.y.toFixed(2);
            valZ.textContent = pos.z.toFixed(2);
            rig.setAttribute('position', pos);

            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
