<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Werewolf Escape Simulator v4.1</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, sans-serif; background-color: #010103; user-select: none; -webkit-user-select: none; }
        #custom-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #010103; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
        .spinner { width: 45px; height: 45px; border: 3px solid rgba(239, 68, 68, 0.1); border-top-color: #ef4444; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        .loader-title { color: #ef4444; font-size: 13px; font-weight: bold; letter-spacing: 2px; margin-bottom: 6px; }
        .loader-msg { color: #94a3b8; font-size: 11px; max-width: 250px; text-align: center; line-height: 1.5; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #fade-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; z-index: 99990; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

        #ui-top-bar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; z-index: 1000; pointer-events: none; gap: 8px; }
        .ui-row { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; }
        #btn-center { pointer-events: auto; background: rgba(15, 23, 42, 0.85); border: 2px solid #00ffaa; color: #00ffaa; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #alert-ui { flex-grow: 1; text-align: center; background: rgba(15, 23, 42, 0.9); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; max-width: 60%; box-sizing: border-box; }
        #btn-sprint { pointer-events: auto; background: rgba(15, 23, 42, 0.85); border: 2px solid #ef4444; color: #ffffff; padding: 12px 14px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; min-width: 90px; text-align: center; }

        #stamina-container { width: 100%; max-width: 320px; height: 6px; background: rgba(15, 23, 42, 0.6); border-radius: 3px; overflow: hidden; border: 1px solid rgba(239, 68, 68, 0.3); pointer-events: none; }
        #stamina-bar { width: 100%; height: 100%; background: #00ffaa; transition: width 0.1s linear, background-color 0.3s ease; }

        #joystick-wrapper { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; z-index: 999; }
        #joystick-container { width: 100px; height: 100px; background: rgba(15, 23, 42, 0.6); border: 2px solid #ef4444; border-radius: 50%; position: relative; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #ef4444; border-radius: 50%; cursor: pointer; }

        #arrows-wrapper { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; z-index: 999; }
        .joy-arrow { position: absolute; background: rgba(15, 23, 42, 0.7); border: 1px solid #ef4444; color: #ef4444; border-radius: 8px; width: 34px; height: 34px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .arrow-up { top: 0; left: 33px; } .arrow-down { bottom: 0; left: 33px; } .arrow-left { left: 0; top: 33px; } .arrow-right { right: 0; top: 33px; }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div class="loader-title">ARK: Simulador v4.1</div>
        <div class="loader-msg">Acoplando animaciones dinámicas 'luis-hora' y calibrando micro-cámara en primera persona...</div>
    </div>

    <div id="fade-screen"></div>

    <div id="ui-top-bar">
        <div class="ui-row">
            <button id="btn-center">🔄</button>
            <div id="alert-ui">⚠️ El Werewolf acecha. Busca el refugio 🏡</div>
            <button id="btn-sprint">🏃‍♂️ CORRER</button>
        </div>
        <div id="stamina-container">
            <div id="stamina-bar"></div>
        </div>
    </div>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene id="escena-principal" fog="type: exponential; color: #030307; density: 0.025;" renderer="antialias: false; colorManagement: true; powerPreference: high-performance;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
        <a-assets>
            <a-asset-item id="pueblo-model" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="ww-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Idle.glb"></a-asset-item>
            <a-asset-item id="ww-howl-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Howl.glb"></a-asset-item>
            <a-asset-item id="ww-beast-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Beast.glb"></a-asset-item>
            <a-asset-item id="luis-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="luis-llama-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-llama.glb"></a-asset-item>
            <a-asset-item id="luis-run-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-corre.glb"></a-asset-item>
            <!-- NUEVO ASSET DE POSE NATURAL -->
            <a-asset-item id="luis-hora-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-hora.glb"></a-asset-item>
        </a-assets>

        <a-sky id="cielo" color="#030307"></a-sky>
        <a-sphere position="30 60 -90" radius="5" color="#e5efff" material="shader: flat; fog: false"></a-sphere>
        <a-entity light="type: directional; intensity: 0.45; color: #7da5f5;" position="30 60 -90"></a-entity>
        <a-entity id="luz-ambiental" light="type: ambient; intensity: 0.45; color: #20204c"></a-entity>

        <a-entity id="entorno" gltf-model="#pueblo-model" position="0 0 0"></a-entity>

        <!-- RIG DE LUIS -->
        <a-entity id="player-rig" position="0 0 12">
            <a-entity id="avatar-container" position="0 0 0" scale="0.38 0.38 0.38">
                <a-entity id="luis-mesh-walk" gltf-model="#luis-walk-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 1.15;"></a-entity>
                <a-entity id="luis-mesh-run" gltf-model="#luis-run-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 1.25;"></a-entity>
                <a-entity id="luis-mesh-llama" gltf-model="#luis-llama-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
                <!-- ENTIDAD PARA MOVIMIENTOS NATURALES ESTÁTICOS -->
                <a-entity id="luis-mesh-hora" gltf-model="#luis-hora-src" visible="true" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
            </a-entity>

            <a-entity id="camera-yaw">
                <a-entity id="camera-pitch">
                    <a-entity id="main-camera" camera="fov: 60" position="0 1.6 3.0">
                        <a-entity light="type: spot; intensity: 2.2; distance: 20; angle: 45; penumbra: 0.5; color: #fffdec;" position="0 0 0"></a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- RIG DEL WEREWOLF -->
        <a-entity id="werewolf-rig" position="5 0 -4" scale="0.68 0.68 0.68">
            <a-entity id="ww-idle" gltf-model="#ww-idle-src" visible="true" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
            <a-entity id="ww-howl" gltf-model="#ww-howl-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 1.1;"></a-entity>
            <a-entity id="ww-beast" gltf-model="#ww-beast-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 0.95;"></a-entity>
        </a-entity>

    </a-scene>

    <script>
        window.addEventListener('contextmenu', e => e.preventDefault());

        const SPAWN_X = 0; const SPAWN_Z = 12;
        const CASA_FACHADA_X = 17.44; const CASA_FACHADA_Z = 17.78;
        const RADIO_DISPARADOR = 2.4; 
        const CASA_INTERIOR_X = 17.44; const CASA_INTERIOR_Z = 16.10;
        
        const VEL_CAMINAR = 0.045; const VEL_CORRER = 0.082;

        const CASA_COLLIDER = { xMin: 14.5, xMax: 20.3, zMin: 11.5, zMax: 17.0 };

        const escena = document.getElementById('escena-principal');
        const cielo = document.getElementById('cielo');
        const fadeScreen = document.getElementById('fade-screen');
        const luzAmbiental = document.getElementById('luz-ambiental');
        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const werewolfRig = document.getElementById('werewolf-rig');
        
        const camYawEl = document.getElementById('camera-yaw');
        const camPitchEl = document.getElementById('camera-pitch');
        const mainCamera = document.getElementById('main-camera');
        
        const avatarContainer = document.getElementById('avatar-container');
        const alertUI = document.getElementById('alert-ui');
        const btnSprint = document.getElementById('btn-sprint');
        const staminaBar = document.getElementById('stamina-bar');
        
        const luisWalk = document.getElementById('luis-mesh-walk');
        const luisRun = document.getElementById('luis-mesh-run');
        const luisLlama = document.getElementById('luis-mesh-llama');
        const luisHora = document.getElementById('luis-mesh-hora');

        const wwModels = { idle: document.getElementById('ww-idle'), howl: document.getElementById('ww-howl'), beast: document.getElementById('ww-beast') };

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0; let camPitch = -0.05;
        let arrowCam = { up: false, down: false, left: false, right: false };
        
        let loaderEliminado = false;
        let jugadorEstado = "EXPLORANDO";
        let modoCorrer = false; let stamina = 100; let cooldowntimer = false;
        
        // DECLARACIÓN INTEGRAL DE VARIABLES DE IA (EVITA CONGELAMIENTOS EN CHROME)
        let loboEstadoIA = "acechando"; 
        let loboAullidoContador = 0;
        let loboTimerIA = 0;
        let loboAturdidoTimer = 0;
        let wwPoseActual = "idle";
        
        const raycasterSuelo = new THREE.Raycaster();
        const vectorAbajo = new THREE.Vector3(0, -1, 0);

        function ocultarLoader() { if (loaderEliminado) return; loaderEliminado = true; document.getElementById('custom-loader').style.opacity = '0'; setTimeout(() => document.getElementById('custom-loader').remove(), 500); }
        document.getElementById('entorno').addEventListener('model-loaded', ocultarLoader);
        setTimeout(ocultarLoader, 4000);

        function onScreenStart(e) { if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.closest('#ui-top-bar')) return; screenDragging = true; const point = e.touches ? e.touches[0] : e; prevScreenX = point.clientX; prevScreenY = point.clientY; }
        function onScreenMove(e) { if (!screenDragging) return; const point = e.touches ? e.touches[0] : e; camYaw -= (point.clientX - prevScreenX) * 0.008; camPitch -= (point.clientY - prevScreenY) * 0.006; camPitch = Math.max(-0.65, Math.min(0.55, camPitch)); prevScreenX = point.clientX; prevScreenY = point.clientY; }
        window.addEventListener('mousedown', onScreenStart); window.addEventListener('mousemove', onScreenMove); window.addEventListener('mouseup', () => screenDragging = false);
        window.addEventListener('touchstart', onScreenStart, {passive: true}); window.addEventListener('touchmove', onScreenMove, {passive: true}); window.addEventListener('touchend', () => screenDragging = false);

        function onJoyStart(e) { joyDragging = true; const pt = e.touches ? e.touches[0] : e; joyStartX = pt.clientX; joyStartY = pt.clientY; }
        function onJoyMove(e) { if (!joyDragging) return; const pt = e.touches ? e.touches[0] : e; let dx = pt.clientX - joyStartX; let dy = pt.clientY - joyStartY; const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy); if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; } knob.style.transform = `translate(${dx}px, ${dy}px)`; moveX = dx / maxLen; moveY = dy / maxLen; }
        knob.addEventListener('touchstart', onJoyStart); window.addEventListener('touchmove', onJoyMove, {passive: true}); window.addEventListener('touchend', () => { joyDragging = false; knob.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });
        knob.addEventListener('mousedown', onJoyStart); window.addEventListener('mousemove', onJoyMove); window.addEventListener('mouseup', () => { joyDragging = false; knob.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });

        window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        const setArrowCam = (id, dir) => { const btn = document.getElementById(id); btn.addEventListener('touchstart', () => arrowCam[dir] = true); btn.addEventListener('touchend', () => arrowCam[dir] = false); btn.addEventListener('mousedown', () => arrowCam[dir] = true); btn.addEventListener('mouseup', () => arrowCam[dir] = false); };
        setArrowCam('btn-up', 'up'); setArrowCam('btn-down', 'down'); setArrowCam('btn-left', 'left'); setArrowCam('btn-right', 'right');

        btnSprint.addEventListener('click', () => { if (jugadorEstado !== "EXPLORANDO" || cooldowntimer) return; modoCorrer = !modoCorrer; actualizarBotonSprintVisual(); });
        function actualizarBotonSprintVisual() { if (cooldowntimer) { btnSprint.textContent = "⏳ AGOTADO"; btnSprint.style.borderColor = "#64748b"; staminaBar.style.backgroundColor = "#ef4444"; } else { btnSprint.textContent = modoCorrer ? "🚶‍♂️ CAMINAR" : "🏃‍♂️ CORRER"; btnSprint.style.borderColor = modoCorrer ? "#00ffaa" : "#ef4444"; staminaBar.style.backgroundColor = modoCorrer ? "#38bdf8" : "#00ffaa"; } }

        function cambiarPoseLobo(nuevaPose) { wwPoseActual = nuevaPose; Object.keys(wwModels).forEach(key => { if(wwModels[key]) wwModels[key].setAttribute('visible', key === nuevaPose); }); }

        function engineLoop() {
            requestAnimationFrame(engineLoop);

            if (!rig.object3D || !camYawEl.object3D || !camPitchEl.object3D || !avatarContainer.object3D || !werewolfRig.object3D) return;

            if (arrowCam.left) camYaw += 0.04; if (arrowCam.right) camYaw -= 0.04;
            if (arrowCam.up) camPitch += 0.03; if (arrowCam.down) camPitch -= 0.03;
            camPitch = Math.max(-0.65, Math.min(0.55, camPitch));
            
            camYawEl.object3D.rotation.y = camYaw;
            camPitchEl.object3D.rotation.x = camPitch;

            let pos = rig.object3D.position;
            let loboPos = werewolfRig.object3D.position;

            let distLoboJugador = Math.sqrt(Math.pow(pos.x - loboPos.x, 2) + Math.pow(pos.z - loboPos.z, 2));

            // CONTROL DE ATMÓSFERA
            if (distLoboJugador < 15.0 && jugadorEstado === "EXPLORANDO") {
                escena.setAttribute('fog', 'type: exponential; color: #080614; density: 0.13;');
                cielo.setAttribute('color', '#080614');
                luzAmbiental.setAttribute('light', 'type: ambient; intensity: 0.18; color: #441437');
                
                if (distLoboJugador < 1.5 && loboEstadoIA === "atacando") {
                    if (loboAturdidoTimer === 0) {
                        alertUI.innerHTML = "🚨 ¡ATAQUE DEL WEREWOLF! 🚨<br>¡Huye mientras ruge!";
                        loboAturdidoTimer = 140; 
                        cambiarPoseLobo('howl');
                    }
                } else { alertUI.innerHTML = "🚨 LA NIEBLA SE OSCURECE... ¡EL LOBO TE ACECHA! 🐺"; }
            } else if (jugadorEstado === "EXPLORANDO") {
                escena.setAttribute('fog', 'type: exponential; color: #030307; density: 0.025;');
                cielo.setAttribute('color', '#030307');
                luzAmbiental.setAttribute('light', 'type: ambient; intensity: 0.45; color: #20204c');
                alertUI.innerHTML = "🏡 Dirígete a la casa segura rápido.";
            }

            // GESTIÓN SISTEMA DE STAMINA BLINDADO
            let isMoving = (keys.w || keys.s || keys.a || keys.d || joyDragging);
            if (modoCorrer && isMoving && jugadorEstado === "EXPLORANDO") {
                stamina -= 0.40; 
                if (stamina <= 0) { stamina = 0; modoCorrer = false; cooldowntimer = true; actualizarBotonSprintVisual(); }
            } else { 
                if (stamina < 100) { 
                    stamina += 0.25; 
                    if (stamina >= 100) { stamina = 100; if (cooldowntimer) { cooldowntimer = false; actualizarBotonSprintVisual(); } } 
                } 
            }
            staminaBar.style.width = `${stamina}%`;

            // MÁQUINA DE ESTADOS HOMBRE LOBO CORREGIDA
            switch (loboEstadoIA) {
                case "acechando":
                    if (distLoboJugador < 5.0 && jugadorEstado === "EXPLORANDO") {
                        loboEstadoIA = "atacando";
                    } else if (distLoboJugador < 20.0 && jugadorEstado === "EXPLORANDO") {
                        cambiarPoseLobo('idle');
                        let tdx = pos.x - loboPos.x; let tdz = pos.z - loboPos.z;
                        werewolfRig.object3D.rotation.y = Math.atan2(tdx, tdz);
                    } else { cambiarPoseLobo('idle'); }
                    break;

                case "atacando":
                    if (loboAturdidoTimer > 0) {
                        loboAturdidoTimer--;
                        if (loboAturdidoTimer === 0) cambiarPoseLobo('beast');
                    } else if (distLoboJugador > 12.0 || jugadorEstado === "SALVADO") {
                        loboEstadoIA = "acechando"; 
                    } else {
                        cambiarPoseLobo('beast');
                        let tdx = pos.x - loboPos.x; let tdz = pos.z - loboPos.z;
                        loboPos.x += (tdx / distLoboJugador) * 0.048; 
                        loboPos.z += (tdz / distLoboJugador) * 0.048;
                        werewolfRig.object3D.rotation.y = Math.atan2(tdx, tdz);
                        ajustarAlturaLoboSuelo();
                    }
                    break;

                case "exterior_casa":
                    loboTimerIA++;
                    let fdx = CASA_FACHADA_X - loboPos.x; let fdz = CASA_FACHADA_Z - loboPos.z;
                    werewolfRig.object3D.rotation.y = Math.atan2(fdx, fdz);

                    if (wwPoseActual !== 'howl') {
                        cambiarPoseLobo('howl'); 
                        loboAullidoContador++;
                        alertUI.innerHTML = `🚨 ¡A salvo adentro! El lobo aúlla afuera [${loboAullidoContador}/5]`;
                        loboTimerIA = 0; 
                    } else {
                        if (loboTimerIA > 110) {
                            if (loboAullidoContador >= 5) {
                                loboEstadoIA = "merodeando_casa";
                                loboTimerIA = 0;
                            } else { cambiarPoseLobo('idle'); loboTimerIA = -50; }
                        }
                    }
                    break;

                case "merodeando_casa":
                    cambiarPoseLobo('beast');
                    alertUI.innerHTML = "🚨 El lobo merodea frustrado buscando una entrada...";
                    loboTimerIA++;
                    
                    let f_circ_x = CASA_FACHADA_X - 10 * Math.sin(loboTimerIA * 0.018);
                    let f_circ_z = CASA_FACHADA_Z - 10 * Math.cos(loboTimerIA * 0.018);
                    
                    let mdx = f_circ_x - loboPos.x; let mdz = f_circ_z - loboPos.z;
                    let distMerodeo = Math.sqrt(mdx*mdx + mdz*mdz);
                    
                    loboPos.x += (mdx / distMerodeo) * 0.040; 
                    loboPos.z += (mdz / distMerodeo) * 0.040;
                    werewolfRig.object3D.rotation.y = Math.atan2(mdx, mdz);
                    ajustarAlturaLoboSuelo();

                    if (loboTimerIA > 450) { 
                        loboEstadoIA = "marchado";
                        alertUI.textContent = "🎉 ¡Felicidades! Sobreviviste a la noche. El hombre lobo se retiró.";
                    }
                    break;

                case "marchado":
                    werewolfRig.setAttribute('visible', 'false');
                    loboPos.set(0, -50, 0); 
                    break;
            }

            function ajustarAlturaLoboSuelo() {
                let rayLobo = new THREE.Vector3(loboPos.x, loboPos.y + 5, loboPos.z);
                raycasterSuelo.set(rayLobo, vectorAbajo);
                let intLobo = raycasterSuelo.intersectObject(document.getElementById('entorno').object3D, true);
                if(intLobo.length > 0 && Math.abs(intLobo[0].point.y - loboPos.y) < 1.5) { loboPos.y = intLobo[0].point.y; }
            }

            // GESTIÓN DE MOVIMIENTO Y ANIMACIONES ADAPTATIVAS (CON LUIS-HORA)
            if (jugadorEstado === "EXPLORANDO" || jugadorEstado === "SALVADO") {
                let inputX = 0; let inputY = 0;
                if (keys.w) inputY = -1; if (keys.s) inputY = 1;
                if (keys.a) inputX = -1; if (keys.d) inputX = 1;
                if (joyDragging) { inputX = moveX; inputY = moveY; }

                let moviendo = (inputX !== 0 || inputY !== 0);
                
                if (moviendo) {
                    // INTERCAMBIO DE MALLAS EN MOVIMIENTO
                    if (modoCorrer && jugadorEstado === "EXPLORANDO") {
                        luisRun.setAttribute('visible', 'true'); luisWalk.setAttribute('visible', 'false');
                        luisLlama.setAttribute('visible', 'false'); luisHora.setAttribute('visible', 'false');
                    } else {
                        luisWalk.setAttribute('visible', 'true'); luisRun.setAttribute('visible', 'false');
                        luisLlama.setAttribute('visible', 'false'); luisHora.setAttribute('visible', 'false');
                    }

                    let viejoX = pos.x; let viejoZ = pos.z;
                    const velActual = (modoCorrer && jugadorEstado === "EXPLORANDO") ? VEL_CORRER : VEL_CAMINAR;

                    const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                    const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                    pos.x += (fwdX * -inputY + rgtX * inputX) * velActual;
                    pos.z += (fwdZ * -inputY + rgtX * inputX) * velActual; 

                    let chocaConCasa = (pos.x >= CASA_COLLIDER.xMin && pos.x <= CASA_COLLIDER.xMax &&
                                        pos.z >= CASA_COLLIDER.zMin && pos.z <= CASA_COLLIDER.zMax);

                    if (chocaConCasa && jugadorEstado === "EXPLORANDO") { pos.x = viejoX; pos.z = viejoZ; }
                    if (Math.abs(pos.x) > 125 || Math.abs(pos.z) > 125) { pos.x = viejoX; pos.z = viejoZ; }

                    // EVITAR ROTAR EL AVATAR EN PRIMERA PERSONA (HACE QUE LA CÁMARA NO SE VUELVA LOCA)
                    if (jugadorEstado === "EXPLORANDO") {
                        const anguloGiro = camYaw + Math.atan2(inputX, inputY);
                        let diffAngle = Math.atan2(Math.sin(anguloGiro - avatarContainer.object3D.rotation.y), Math.cos(anguloGiro - avatarContainer.object3D.rotation.y));
                        avatarContainer.object3D.rotation.y += diffAngle * 0.25;
                    }
                } else {
                    // SI ESTÁ ESTÁTICO: SE ACTIVA LUIS-HORA CON RESPIRACIÓN Y MOVIMIENTO NATURAL
                    if(jugadorEstado !== "LLAMANDO") {
                        luisHora.setAttribute('visible', jugadorEstado === "EXPLORANDO" ? "true" : "false"); 
                        luisWalk.setAttribute('visible', 'false');
                        luisRun.setAttribute('visible', 'false');
                        luisLlama.setAttribute('visible', 'false');
                    }
                }

                // SUBIR ESCALERAS (CON RAYCASTING ELEVADO DE CINTURA)
                let inicioRaySuelo = new THREE.Vector3(pos.x, pos.y + 1.2, pos.z);
                raycasterSuelo.set(inicioRaySuelo, vectorAbajo);
                let colisionesSuelo = raycasterSuelo.intersectObject(document.getElementById('entorno').object3D, true);
                if (colisionesSuelo.length > 0) {
                    let alturaSueloDetectada = colisionesSuelo[0].point.y;
                    let diferenciaAltura = alturaSueloDetectada - pos.y;
                    if (Math.abs(diferenciaAltura) < 0.4) { pos.y += diferenciaAltura * 0.3; }
                }

                // DETECTOR DE PUERTA SEGURA
                if (jugadorEstado === "EXPLORANDO") {
                    let distA_Casa = Math.sqrt(Math.pow(pos.x - CASA_FACHADA_X, 2) + Math.pow(pos.z - CASA_FACHADA_Z, 2));
                    if (distA_Casa <= RADIO_DISPARADOR) {
                        jugadorEstado = "LLAMANDO";
                        
                        // CORRECCIÓN: EL LOBO SE TELETRANSPORTA INMEDIATAMENTE AL FRONTIS DE LA CASA
                        werewolfRig.object3D.position.set(CASA_FACHADA_X - 1.5, 0, CASA_FACHADA_Z + 4.5);
                        loboEstadoIA = "exterior_casa"; 
                        loboAullidoContador = 0;
                        loboTimerIA = -20; 
                        
                        luisWalk.setAttribute('visible', 'false'); luisRun.setAttribute('visible', 'false');
                        luisHora.setAttribute('visible', 'false'); luisLlama.setAttribute('visible', 'true');
                        luisLlama.setAttribute('animation-mixer', {clip: '*', loop: 'repeat', timeScale: 1});
                        
                        fadeScreen.style.opacity = '1';

                        setTimeout(() => {
                            jugadorEstado = "SALVADO";
                            pos.x = CASA_INTERIOR_X; pos.z = CASA_INTERIOR_Z; pos.y = 0;
                            
                            // MEJORA INTERIOR ABSOLUTA: OCULTAR AVATAR PARA IMPEDIR CÁMARA LOCA CLIPEADA
                            avatarContainer.setAttribute('visible', 'false');
                            mainCamera.setAttribute('position', '0 1.6 0'); // Posición limpia de ojos
                            camPitch = 0; camYaw = 3.14; // Mirando hacia adentro de la casa
                            
                            escena.setAttribute('fog', 'type: exponential; color: #030307; density: 0.01;');
                            cielo.setAttribute('color', '#030307');

                            setTimeout(() => { fadeScreen.style.opacity = '0'; }, 300);
                        }, 1800); 
                    }
                }
            }
        }
        
        // REINICIAR SIMULADOR
        document.getElementById('btn-center').addEventListener('click', () => {
            if (!rig.object3D) return;
            jugadorEstado = "EXPLORANDO"; modoCorrer = false; stamina = 100; cooldowntimer = false; actualizarBotonSprintVisual();
            
            avatarContainer.setAttribute('visible', 'true');
            mainCamera.setAttribute('position', '0 1.6 3.0');
            fadeScreen.style.opacity = '0';
            
            rig.object3D.position.set(SPAWN_X, 0, SPAWN_Z);
            
            werewolfRig.setAttribute('visible', 'true');
            werewolfRig.object3D.position.set(5, 0, -4);
            loboEstadoIA = "acechando"; loboAullidoContador = 0; loboTimerIA = 0; loboAturdidoTimer = 0;

            luisHora.setAttribute('visible', 'true'); luisWalk.setAttribute('visible', 'false');
            luisRun.setAttribute('visible', 'false'); luisLlama.setAttribute('visible', 'false');
            
            alertUI.innerHTML = "⚠️ El Werewolf acecha. Busca el refugio 🏡";
        });

        engineLoop();
    </script>
</body>
</html>
