<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Werewolf 3D Universe - Localizador Pro</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        #custom-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #080810; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.6s ease, visibility 0.6s; color: #fff; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Controles e Interfaz UI */
        #joystick-wrapper { position: fixed; bottom: 30px; left: 30px; width: 110px; height: 110px; background: rgba(15, 15, 25, 0.4); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 999; touch-action: none; backdrop-filter: blur(4px); }
        #joystick-knob { width: 45px; height: 45px; background: linear-gradient(135deg, #dc2626, #991b1b); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; touch-action: none; }
        
        #arrows-wrapper { position: fixed; bottom: 30px; right: 30px; display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 5px; z-index: 999; }
        .arrow-btn { background: rgba(15, 15, 25, 0.6); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 16px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; user-select: none; }
        .arrow-btn:active { background: #dc2626; border-color: #ff4545; }
        
        #coordenadas-hud { position: fixed; top: 15px; left: 15px; background: rgba(10, 10, 15, 0.9); border: 1px solid rgba(220, 38, 38, 0.4); border-radius: 8px; padding: 14px; color: #fff; font-size: 13px; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; width: 220px; }
        .coord-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 4px; }
        .coord-val { color: #00ffaa; font-weight: bold; }
        
        .hud-actions { display: flex; gap: 6px; }
        .hud-btn { flex: 1; background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; color: #fff; border-radius: 4px; padding: 7px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-weight: 600; text-transform: uppercase; text-align: center; }
        .hud-btn:hover { background: rgba(220, 38, 38, 0.3); }
    </style>
</head>
<body>

    <!-- Loader Personalizado -->
    <div id="custom-loader">
        <div class="spinner"></div>
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">CARGANDO ENTORNO</div>
        <div style="font-size: 12px; color: #888;">Estabilizando controles de cámara...</div>
    </div>

    <!-- HUD de Estado, Modos y Teletransporte -->
    <div id="coordenadas-hud">
        <div class="coord-row">
            <span>X:<span id="valX" class="coord-val">7.14</span></span>
            <span>Y:<span id="valY" class="coord-val">2.24</span></span>
            <span>Z:<span id="valZ" class="coord-val">13.99</span></span>
        </div>
        <div class="hud-actions">
            <button id="btn-mode" class="hud-btn" style="background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; flex: 1.3;">Modo: Caminar</button>
            <button id="btn-center" class="hud-btn">Respawn</button>
        </div>
        <!-- Controles de elevación exclusivos para el Modo Dron -->
        <div class="hud-actions" id="drone-height-controls" style="display: none;">
            <button id="btn-fly-up" class="hud-btn" style="background: rgba(16, 185, 129, 0.2); border-color: #10b981;">▲ Subir Alto</button>
            <button id="btn-fly-down" class="hud-btn" style="background: rgba(16, 185, 129, 0.2); border-color: #10b981;">▼ Bajar Nivel</button>
        </div>
        <div class="hud-actions">
            <button id="btn-copy" class="hud-btn" style="width: 100%; background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2);">Copiar Vector3</button>
        </div>
    </div>

    <!-- Controles táctiles/ratón secundarios -->
    <div id="joystick-wrapper">
        <div id="joystick-knob"></div>
    </div>

    <div id="arrows-wrapper">
        <div></div>
        <button id="btn-up" class="arrow-btn">▲</button>
        <div></div>
        <button id="btn-left" class="arrow-btn">◀</button>
        <div class="arrow-btn" style="background:none; border:none; font-size:10px; opacity:0.4;">VISTA</div>
        <button id="btn-right" class="arrow-btn">▶</button>
        <div></div>
        <button id="btn-down" class="arrow-btn">▼</button>
        <div></div>
    </div>

    <a-scene shadow="type: pcfsoft" renderer="colorManagement: true; antialias: true;">
        <a-assets>
            <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="avatar-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="avatar-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; color: #1e1e2d; intensity: 0.6;"></a-entity>
        <a-entity light="type: directional; color: #a1b0d4; intensity: 0.8; castShadow: true; shadowMapHeight: 1024; shadowMapWidth: 1024;" position="10 25 15"></a-entity>

        <a-entity id="entorno" gltf-model="#pueblo" position="0 0 0" shadow="receive: true; cast: false;"></a-entity>

        <!-- Rig del Jugador -->
        <a-entity id="player-rig" position="7.14 500 13.99">
            <a-entity id="avatar-container" position="0 0 0">
                <a-entity id="mesh-walk" gltf-model="#avatar-walk-src" shadow="cast: true" animation-mixer="timeScale: 1.1;" visible="false"></a-entity>
                <a-entity id="mesh-idle" gltf-model="#avatar-idle-src" shadow="cast: true" animation-mixer="timeScale: 1.0;" visible="true"></a-entity>
            </a-entity>

            <!-- Sistema de Órbita Corregido (Altura base óptima) -->
            <a-entity id="camera-orbit" position="0 1.8 0">
                <a-entity id="main-camera" camera position="0 0 5.5"></a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const SPAWN_X = 30;
        const SPAWN_Z = 13.99;
        let VELOCIDAD_AVANCE = 0.12;

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarContainer = document.getElementById('avatar-container');
        const meshIdle = document.getElementById('mesh-idle');
        const meshWalk = document.getElementById('mesh-walk');
        const mainCamera = document.getElementById('main-camera');
        const entornoEntity = document.getElementById('entorno');

        // UI Elementos
        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valZ = document.getElementById('valZ');
        const btnCopy = document.getElementById('btn-copy');
        const btnMode = document.getElementById('btn-mode');
        const droneControlsUI = document.getElementById('drone-height-controls');

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        // Valores de cámara iniciales equilibrados
        let camYaw = 0;   
        let camPitch = 0.2; 
        let camDist = 5.5; 
        let arrowCam = { up: false, down: false, left: false, right: false };
        let wasMoving = false;
        
        let inicializado = false;
        let entornoCargado = false;
        
        // Control de Modos (Caminar vs Volar/Dron)
        let modoDron = false;
        let flyUpActive = false;
        let flyDownActive = false;

        entornoEntity.addEventListener('model-loaded', () => { entornoCargado = true; });

        function ocultarLoader() {
            const loader = document.getElementById('custom-loader');
            if (loader) {
                loader.style.opacity = '0'; loader.style.visibility = 'hidden';
                setTimeout(() => loader.remove(), 600);
            }
        }

        // Conmutador de modo de movimiento
        btnMode.addEventListener('click', () => {
            modoDron = !modoDron;
            if (modoDron) {
                btnMode.textContent = "Modo: Dron Vuelo";
                btnMode.style.background = "rgba(16, 185, 129, 0.3)";
                btnMode.style.borderColor = "#10b981";
                droneControlsUI.style.display = "flex"; // Muestra botones subir/bajar
                VELOCIDAD_AVANCE = 0.25; // Volar es más rápido
            } else {
                btnMode.textContent = "Modo: Caminar";
                btnMode.style.background = "rgba(59, 130, 246, 0.2)";
                btnMode.style.borderColor = "#3b82f6";
                droneControlsUI.style.display = "none";
                VELOCIDAD_AVANCE = 0.12;
                inicializado = false; // Fuerza re-ajuste al suelo firme
            }
        });

        // Botón Respawn
        document.getElementById('btn-center').addEventListener('click', () => {
            inicializado = false;
            rig.setAttribute('position', `${SPAWN_X} 500 ${SPAWN_Z}`);
            camYaw = 0; camPitch = 0.2;
            cameraOrbit.object3D.rotation.set(camPitch, camYaw, 0);
            meshWalk.setAttribute('visible', 'false');
            meshIdle.setAttribute('visible', 'true');
            wasMoving = false;
        });

        // Zoom rueda del ratón
        window.addEventListener('wheel', (e) => {
            camDist += e.deltaY * 0.005;
            camDist = Math.max(2.0, Math.min(30.0, camDist));
            mainCamera.setAttribute('position', `0 0 ${camDist}`);
        }, { passive: true });

        // Captura de arrastre de pantalla (CÁMARA SUAVE Y SIN TRABAS)
        function onScreenStart(e) {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.closest('#coordenadas-hud') || e.target.tagName === 'BUTTON') return;
            screenDragging = true;
            const point = e.touches ? e.touches[0] : e;
            prevScreenX = point.clientX;
            prevScreenY = point.clientY;
        }
        
        function onScreenMove(e) {
            if (!screenDragging) return;
            const point = e.touches ? e.touches[0] : e;
            
            // Sensibilidad calibrada
            const deltaX = point.clientX - prevScreenX;
            const deltaY = point.clientY - prevScreenY;
            
            camYaw -= deltaX * 0.005;  
            camPitch -= deltaY * 0.005; // Dirección de arrastre natural e intuitiva
            
            // LÍMITES AMPLIADOS: Permite mirar libremente casi en vertical sin atrancarse
            camPitch = Math.max(-0.8, Math.min(1.4, camPitch)); 
            
            prevScreenX = point.clientX;
            prevScreenY = point.clientY;
        }
        function onScreenEnd() { screenDragging = false; }

        window.addEventListener('mousedown', onScreenStart);
        window.addEventListener('mousemove', onScreenMove);
        window.addEventListener('mouseup', onScreenEnd);
        window.addEventListener('touchstart', onScreenStart, {passive: true});
        window.addEventListener('touchmove', onScreenMove, {passive: true});
        window.addEventListener('touchend', onScreenEnd);

        // Joystick Virtual
        function onJoyStart(e) {
            joyDragging = true;
            const point = e.touches ? e.touches[0] : e;
            joyStartX = point.clientX; joyStartY = point.clientY;
        }
        function onJoyMove(e) {
            if (!joyDragging) return;
            const point = e.touches ? e.touches[0] : e;
            let dx = point.clientX - joyStartX; let dy = point.clientY - joyStartY;
            const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen;
        }
        function onJoyEnd() { joyDragging = false; knob.style.transform = 'translate(0px, 0px)'; moveX = 0; moveY = 0; }
        knob.addEventListener('touchstart', onJoyStart);
        window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', onJoyEnd);
        knob.addEventListener('mousedown', onJoyStart);
        window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', onJoyEnd);

        // Teclado completo (WASD + Espacio/Shift para modo vuelo)
        window.addEventListener('keydown', (e) => { 
            const k = e.key.toLowerCase(); 
            if (k in keys) keys[k] = true; 
            if (e.key === ' ') keys['space'] = true;
            if (e.key === 'Shift') keys['shift'] = true;
        });
        window.addEventListener('keyup', (e) => { 
            const k = e.key.toLowerCase(); 
            if (k in keys) keys[k] = false; 
            if (e.key === ' ') keys['space'] = false;
            if (e.key === 'Shift') keys['shift'] = false;
        });

        // Botones UI de elevación de Dron
        const bUp = document.getElementById('btn-fly-up');
        const bDown = document.getElementById('btn-fly-down');
        bUp.addEventListener('mousedown', () => flyUpActive = true); bUp.addEventListener('mouseup', () => flyUpActive = false);
        bUp.addEventListener('touchstart', () => flyUpActive = true); bUp.addEventListener('touchend', () => flyUpActive = false);
        bDown.addEventListener('mousedown', () => flyDownActive = true); bDown.addEventListener('mouseup', () => flyDownActive = false);
        bDown.addEventListener('touchstart', () => flyDownActive = true); bDown.addEventListener('touchend', () => flyDownActive = false);

        // Botones de cámara direccionales (Alternativa al ratón)
        const setupArrowCamera = (id, direction) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => { arrowCam[direction] = true; });
            btn.addEventListener('mouseup', () => { arrowCam[direction] = false; });
            btn.addEventListener('touchstart', () => { arrowCam[direction] = true; });
            btn.addEventListener('touchend', () => { arrowCam[direction] = false; });
        };
        setupArrowCamera('btn-up', 'up'); setupArrowCamera('btn-down', 'down');
        setupArrowCamera('btn-left', 'left'); setupArrowCamera('btn-right', 'right');

        // Copiar coordenadas
        btnCopy.addEventListener('click', () => {
            const pos = rig.getAttribute('position');
            const formatted = `position="${pos.x.toFixed(2)} ${pos.y.toFixed(2)} ${pos.z.toFixed(2)}"`;
            navigator.clipboard.writeText(formatted).then(() => {
                btnCopy.textContent = "¡Copiado!"; btnCopy.style.borderColor = "#00ffaa";
                setTimeout(() => { btnCopy.textContent = "Copiar Vector3"; btnCopy.style.borderColor = "rgba(255,255,255,0.2)"; }, 1500);
            });
        });

        // Filtro estricto anti-árboles
        function esVegetacion(object) {
            let current = object;
            while (current) {
                const n = (current.name || "").toLowerCase();
                if (n.includes('tree') || n.includes('arbol') || n.includes('leaf') || n.includes('leaves') || n.includes('branch') || n.includes('hoja') || n.includes('rama') || n.includes('wood') || n.includes('foliage') || n.includes('pino') || n.includes('pine') || n.includes('grass')) return true;
                current = current.parent;
            }
            return false;
        }

        function filtrarInterseccionSuelo(intersects) {
            for (let i = 0; i < intersects.length; i++) {
                if (!esVegetacion(intersects[i].object)) return intersects[i];
            }
            return null;
        }

        // BUCLE DE RENDERIZADO Y LÓGICA DE MOVIMIENTO
        function engineLoop() {
            // Rotación por botones HUD si se usan
            if (arrowCam.left) camYaw += 0.025;
            if (arrowCam.right) camYaw -= 0.025;
            if (arrowCam.up) camPitch += 0.02;   
            if (arrowCam.down) camPitch -= 0.02;  
            camPitch = Math.max(-0.8, Math.min(1.4, camPitch)); 

            // Aplicar matriz de rotación limpia a la cámara
            cameraOrbit.object3D.rotation.set(camPitch, camYaw, 0);

            const mesh = entornoEntity.object3D;
            if (!mesh || !entornoCargado || !mesh.children || mesh.children.length === 0) {
                requestAnimationFrame(engineLoop); return;
            }

            const pos = rig.getAttribute('position');

            // Caída inicial controlada al cargar
            if (!inicializado && !modoDron) {
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                const hit = filtrarInterseccionSuelo(raycaster.intersectObject(mesh, true));
                if (hit) {
                    pos.y = hit.point.y; rig.setAttribute('position', pos);
                    inicializado = true; ocultarLoader();
                }
                requestAnimationFrame(engineLoop); return;
            } else if (modoDron) {
                ocultarLoader(); // Quita el loader si entras en modo dron directamente
            }

            let oldX = pos.x; let oldZ = pos.z; let oldY = pos.y;
            let inputX = 0; let inputY = 0;
            if (keys.w) inputY = -1; if (keys.s) inputY = 1;
            if (keys.a) inputX = -1; if (keys.d) inputX = 1;
            if (joyDragging) { inputX = moveX; inputY = moveY; }

            let isMoving = (inputX !== 0 || inputY !== 0);

            // Gestión de animación de caminata
            if (isMoving !== wasMoving) {
                if (isMoving && !modoDron) {
                    meshIdle.setAttribute('visible', 'false'); meshWalk.setAttribute('visible', 'true');
                    if(meshWalk.components['animation-mixer']) meshWalk.components['animation-mixer'].play();
                } else {
                    meshWalk.setAttribute('visible', 'false'); meshIdle.setAttribute('visible', 'true');
                    if(meshIdle.components['animation-mixer']) meshIdle.components['animation-mixer'].pause();
                }
                wasMoving = isMoving;
            }

            // Traslación en el espacio orientada a la cámara
            if (isMoving) {
                const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_AVANCE;
                pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_AVANCE;

                if (!modoDron) {
                    const targetAngle = camYaw + Math.atan2(inputX, inputY);
                    let currentAngle = avatarContainer.object3D.rotation.y;
                    let deltaAngle = Math.atan2(Math.sin(targetAngle - currentAngle), Math.cos(targetAngle - currentAngle));
                    avatarContainer.object3D.rotation.y += deltaAngle * 0.25;
                }
            }

            // --- GESTIÓN DE ALTURA SEGÚN EL MODO ACTIVO ---
            if (modoDron) {
                // Control vertical del dron sin restricciones físicas
                if (keys['space'] || flyUpActive) pos.y += 0.3;
                if (keys['shift'] || flyDownActive) pos.y -= 0.3;
            } else {
                // Modo caminar: pegado al relieve real de la calle
                const raycaster = new THREE.Raycaster();
                raycaster.set(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                const hit = filtrarInterseccionSuelo(raycaster.intersectObject(mesh, true));
                
                if (hit) {
                    let groundY = hit.point.y;
                    if ((groundY - oldY) > 0.9) { // Colisión contra una pared real del pueblo
                        pos.x = oldX; pos.z = oldZ; pos.y = oldY;
                    } else {
                        pos.y += (groundY - pos.y) * 0.35; // Adaptación suave a rampas/suelo
                    }
                } else {
                    pos.x = oldX; pos.z = oldZ; pos.y = oldY;
                }
            }

            // Actualizar textos en el HUD en tiempo real
            valX.textContent = pos.x.toFixed(2);
            valY.textContent = pos.y.toFixed(2);
            valZ.textContent = pos.z.toFixed(2);

            rig.setAttribute('position', pos);
            requestAnimationFrame(engineLoop);
        }
        engineLoop();
    </script>
</body>
</html>
