<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calibración - Luis y el Pueblo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- A-Frame y Extras para animación -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body>

  <!-- Escena de calibración con luz de día completa para ver todo con claridad -->
  <a-scene gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;">
    
    <a-assets timeout="60000">
      <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
      <a-asset-item id="luis-camina" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
    </a-assets>

    <!-- Cielo de día para no perder la vista en la oscuridad de la noche -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Iluminación fuerte y clara para debugging -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="-1 2 1"></a-light>

    <!-- REFERENCIA VISUAL: Una plataforma roja en el centro absoluto (0, 0, 0) -->
    <!-- Si Luis está bien posicionado, debería tener los pies justo sobre este cuadro rojo -->
    <a-box position="0 -0.05 0" width="2" height="0.1" depth="2" color="#ff0000"></a-box>

    <!-- Luis principal en el origen (0, 0, 0) y ESTÁTICO (timeScale: 0) -->
    <a-entity id="ent-luis-camina" 
              gltf-model="#luis-camina" 
              position="0 0 0" 
              rotation="0 180 0" 
              scale="1 1 1"
              animation-mixer="clip: *; loop: repeat; timeScale: 0;">
    </a-entity>

    <!-- El Pueblo en el origen (0, 0, 0) para detectar su desfase real -->
    <a-entity id="ent-pueblo" 
              gltf-model="#pueblo" 
              position="0 0 0" 
              scale="1 1 1">
    </a-entity>

    <!-- CÁMARA CON MODO VUELO (fly: true) -->
    <!-- Te permite volar usando WASD hacia donde apuntes con la mirada/ratón. -->
    <!-- Ideal para buscar el pueblo si se ha ido hacia arriba o hacia abajo. -->
    <a-entity id="rig" position="0 0 4">
      <a-camera look-controls wasd-controls="fly: true; acceleration: 20;" position="0 1.6 0"></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
