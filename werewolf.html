<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de Posición</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene>
    <a-assets>
      <a-asset-item id="pueblo" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
      <a-asset-item id="luis-camina" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
    </a-assets>

    <!-- Luces -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" position="5 10 5" intensity="0.5"></a-light>

    <!-- Pueblo (Ajusta la altura Y aquí) -->
    <a-entity id="ent-pueblo" gltf-model="#pueblo" position="0 -10 0"></a-entity>

    <!-- Rig de Cámara y Avatar vinculados -->
    <a-entity id="rig" position="0 0 0" wasd-controls="acceleration: 20;">
      <a-camera look-controls position="0 1.6 0"></a-camera>
      
      <!-- Avatar Luis -->
      <a-entity id="avatar-luis" 
                gltf-model="#luis-camina" 
                position="0 0 -2.5" 
                rotation="0 180 0" 
                animation-mixer>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
