<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Werewolf Escape Simulator</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #030206; user-select: none; -webkit-user-select: none;
        }

        #custom-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #030206; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(239, 68, 68, 0.1);
            border-top-color: #ef4444; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        .loader-title {
            color: #ef4444; font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
        }

        .loader-msg { color: #94a3b8; font-size: 11px; max-width: 260px; text-align: center; line-height: 1.5; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* INTERFAZ SUPERIOR ADAPTATIVA EN FILA - EVITA SOLAPAMIENTOS */
        #ui-top-bar {
            position: fixed; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; pointer-events: none; gap: 12px;
        }

        #btn-center {
            pointer-events: auto; flex-shrink: 0;
            background: rgba(15, 23, 42, 0.85); border: 2px solid #00ffaa;
            color: #00ffaa; border-radius: 50%; width: 44px; height: 44px;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(4px);
        }

        #alert-ui {
            flex-grow: 1; text-align: center;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #ef4444;
            color: #fca5a5; padding: 10px 12px; border-radius: 8px;
            font-size: 11px; font-weight: bold; letter-spacing: 0.5px;
            text-transform: uppercase; backdrop-filter: blur(4px);
            box-sizing: border-box; max-width: 60%;
        }

        #btn-sprint {
            pointer-events: auto; flex-shrink: 0;
            background: rgba(15, 23, 42, 0.85); border: 2px solid #ef4444;
            color: #ffffff; padding: 12px 14px; border-radius: 8px;
            font-size: 10px; font-weight: bold; letter-spacing: 1px;
            cursor: pointer; backdrop-filter: blur(4px);
        }

        #joystick-wrapper {
            position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; z-index: 999;
        }

        #joystick-container {
            width: 100px; height: 100px; background: rgba(15, 23, 42, 0.6);
            border: 2px solid #ef4444; border-radius: 50%; touch-action: none; position: relative;
        }

        #joystick-knob {
            position: absolute; top: 30px; left: 30px; width: 40px; height: 40px;
            background: #ef4444; border-radius: 50%; box-shadow: 0 0 15px #ef4444;
            cursor: pointer; touch-action: none;
        }

        #arrows-wrapper {
            position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; z-index: 999;
        }

        .joy-arrow {
            position: absolute; background: rgba(15, 23, 42, 0.7);
            border: 1px solid #ef4444; color: #ef4444; border-radius: 8px;
            width: 32px; height: 32px; font-size: 14px;
            display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        .arrow-up { top: 0; left: 34px; }
        .arrow-down { bottom: 0; left: 34px; }
        .arrow-left { left: 0; top: 34px; }
        .arrow-right { right: 0; top: 34px; }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div class="loader-title">Optimizando Rendimiento</div>
        <div class="loader-msg">Compilando geometría nativa del pueblo y generando entorno seguro de ejecución...</div>
    </div>

    <div id="ui-top-bar">
        <button id="btn-center">👤</button>
        <div id="alert-ui">⚠️ ¡Huye! Busca el refugio 🏡</div>
        <button id="btn-sprint">🏃‍♂️ CORRER</button>
    </div>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- ESCENA CONFIGURADA PARA MÁXIMA VELOCIDAD GRÁFICA -->
    <a-scene id="escena-principal" fog="type: exponential; color: #030206; density: 0.015;"
             renderer="antialias: false; colorManagement: true; powerPreference: high-performance;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="pueblo-model" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="ww-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Idle.glb"></a-asset-item>
            <a-asset-item id="ww-howl-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Howl.glb"></a-asset-item>
            <a-asset-item id="ww-beast-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Beast.glb"></a-asset-item>
            <a-asset-item id="luis-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="luis-llama-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-llama.glb"></a-asset-item>
            <a-asset-item id="luis-run-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-corre.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#030206"></a-sky>

        <a-sphere id="luna-llena" position="20 70 -80" radius="5" color="#ddf0ff" material="shader: flat; fog: false"></a-sphere>
        <a-entity light="type: directional; intensity: 0.5; color: #8cb7f5;" position="20 70 -80"></a-entity>
        <a-entity id="luz-ambiental" light="type: ambient; intensity: 0.45; color: #28255c"></a-entity>

        <a-plane position="0 -0.02 0" rotation="-90 0 0" width="300" height="300" color="#0b0f19" material="roughness: 1"></a-plane>

        <a-entity id="entorno" gltf-model="#pueblo-model" position="0 0 0"></a-entity>

        <!-- RIG DEL AVATAR CON ESCALA AJUSTADA (0.38) -->
        <a-entity id="player-rig" position="0 0 12">
            <a-entity id="avatar-container" position="0 0.02 0" scale="0.38 0.38 0.38">
                <a-entity id="luis-mesh-walk" gltf-model="#luis-walk-src" visible="true"
                          animation-mixer="clip: *; loop: repeat; timeScale: 0;">
                </a-entity>
                <a-entity id="luis-mesh-run" gltf-model="#luis-run-src" visible="false"
                          animation-mixer="clip: *; loop: repeat; timeScale: 0;">
                </a-entity>
                <a-entity id="luis-mesh-llama" gltf-model="#luis-llama-src" visible="false"
                          animation-mixer="clip: *; loop: repeat; timeScale: 0;">
                </a-entity>
            </a-entity>

            <!-- ARQUITECTURA DE CÁMARA ANTI-DOBLADO DE HORIZONTE -->
            <a-entity id="camera-yaw">
                <a-entity id="camera-pitch">
                    <a-entity id="main-camera" camera="fov: 60" position="0 1.5 2.5">
                        <a-entity light="type: spot; intensity: 1.8; distance: 20; angle: 45; penumbra: 0.5; color: #fffdec;" position="0 0 0"></a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- LOBO UBICADO EN ZONA VISIBLE CON SU ESCALA MAJESTUOSA (0.68) -->
        <a-entity id="werewolf-rig" position="0 0 -5" scale="0.68 0.68 0.68">
            <a-entity id="ww-idle" gltf-model="#ww-idle-src" visible="true"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>
            <a-entity id="ww-howl" gltf-model="#ww-howl-src" visible="false"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>
            <a-entity id="ww-beast" gltf-model="#ww-beast-src" visible="false"
                      animation-mixer="clip: *; loop: repeat; timeScale: 0.8;">
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        window.addEventListener('contextmenu', e => e.preventDefault());

        const SPAWN_X = 0; const SPAWN_Z = 12;
        const CASA_FACHADA_X = 17.44; const CASA_FACHADA_Z = 17.78;
        const RADIO_DISPARADOR = 1.4; 
        const CASA_INTERIOR_X = 17.50; const CASA_INTERIOR_Z = 15.50;
        
        const VEL_CAMINAR = 0.038;
        const VEL_CORRER = 0.072; 

        // MATRIZ DE COLISIONES MATEMÁTICAS PREDETERMINADAS (EVITA USAR EL PROCESADOR EN EXCESO)
        const limitesEstructurales = [
            {x: 17.44, z: 16.8, r: 2.5}, // Área de la casa principal
            {x: -6, z: 4, r: 2.2}, {x: 6, z: -4, r: 2.0},
            {x: -12, z: 12, r: 2.4}, {x: 14, z: 5, r: 2.1},
            {x: 0, z: -10, r: 3.0}, {x: -15, z: -5, r: 2.5}
        ];

        const escena = document.getElementById('escena-principal');
        const luzAmbiental = document.getElementById('luz-ambiental');
        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const werewolfRig = document.getElementById('werewolf-rig');
        
        const camYawEl = document.getElementById('camera-yaw');
        const camPitchEl = document.getElementById('camera-pitch');
        
        const avatarContainer = document.getElementById('avatar-container');
        const alertUI = document.getElementById('alert-ui');
        const btnSprint = document.getElementById('btn-sprint');
        
        const luisWalk = document.getElementById('luis-mesh-walk');
        const luisRun = document.getElementById('luis-mesh-run');
        const luisLlama = document.getElementById('luis-mesh-llama');

        const wwModels = {
            idle: document.getElementById('ww-idle'),
            howl: document.getElementById('ww-howl'),
            beast: document.getElementById('ww-beast')
        };

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0; let camPitch = -0.10;
        let arrowCam = { up: false, down: false, left: false, right: false };
        
        let loaderEliminado = false;
        let jugadorEstado = "EXPLORANDO"; 
        let loboEstado = "idle"; 
        let modoCorrer = false;
        
        let loboTimer = 0;
        let ultimoAullido = 0;

        btnSprint.addEventListener('click', () => {
            if (jugadorEstado !== "EXPLORANDO") return;
            modoCorrer = !modoCorrer;
            btnSprint.textContent = modoCorrer ? "🚶‍♂️ CAMINAR" : "🏃‍♂️ CORRER";
            btnSprint.style.borderColor = modoCorrer ? "#00ffaa" : "#ef4444";
        });

        function ocultarLoader() {
            if (loaderEliminado) return;
            loaderEliminado = true;
            const loader = document.getElementById('custom-loader');
            if (loader) {
                loader.style.opacity = '0'; loader.style.visibility = 'hidden';
                setTimeout(() => { loader.remove(); }, 600);
            }
        }

        document.getElementById('entorno').addEventListener('model-loaded', ocultarLoader);
        setTimeout(ocultarLoader, 4500); // Forzar apertura si la red va lenta

        function onScreenStart(e) {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.closest('#ui-top-bar')) return;
            screenDragging = true; const point = e.touches ? e.touches[0] : e;
            prevScreenX = point.clientX; prevScreenY = point.clientY;
        }
        function onScreenMove(e) {
            if (!screenDragging) return; const point = e.touches ? e.touches[0] : e;
            camYaw -= (point.clientX - prevScreenX) * 0.005;
            camPitch += (point.clientY - prevScreenY) * 0.004;
            prevScreenX = point.clientX; prevScreenY = point.clientY;
        }
        window.addEventListener('mousedown', onScreenStart); window.addEventListener('mousemove', onScreenMove);
        window.addEventListener('mouseup', () => screenDragging = false);
        window.addEventListener('touchstart', onScreenStart, {passive: true}); window.addEventListener('touchmove', onScreenMove, {passive: true});
        window.addEventListener('touchend', () => screenDragging = false);

        function onJoyStart(e) { joyDragging = true; const pt = e.touches ? e.touches[0] : e; joyStartX = pt.clientX; joyStartY = pt.clientY; e.stopPropagation(); }
        function onJoyMove(e) {
            if (!joyDragging) return; const pt = e.touches ? e.touches[0] : e;
            let dx = pt.clientX - joyStartX; let dy = pt.clientY - joyStartY;
            const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen; e.stopPropagation();
        }
        knob.addEventListener('touchstart', onJoyStart); window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', () => { joyDragging = false; knob.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });
        knob.addEventListener('mousedown', onJoyStart); window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', () => { joyDragging = false; knob.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });

        window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        const setArrowCam = (id, dir) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => arrowCam[dir] = true); btn.addEventListener('mouseup', () => arrowCam[dir] = false);
            btn.addEventListener('touchstart', () => arrowCam[dir] = true); btn.addEventListener('touchend', () => arrowCam[dir] = false);
        };
        setArrowCam('btn-up', 'up'); setArrowCam('btn-down', 'down'); setArrowCam('btn-left', 'left'); setArrowCam('btn-right', 'right');

        function cambiarPoseLobo(nuevaPose) {
            loboEstado = nuevaPose;
            Object.keys(wwModels).forEach(key => {
                if(wwModels[key]) wwModels[key].setAttribute('visible', key === nuevaPose);
            });
        }

        function engineLoop() {
            requestAnimationFrame(engineLoop);

            if (!rig.object3D || !camYawEl.object3D || !camPitchEl.object3D || !avatarContainer.object3D || !werewolfRig.object3D) return;

            // ROTACIÓN DE CÁMARA ESTABILIZADA POR COMPONENTES SEPARADOS
            if (arrowCam.left) camYaw += 0.025; if (arrowCam.right) camYaw -= 0.025;
            if (arrowCam.up) camPitch -= 0.015; if (arrowCam.down) camPitch += 0.015;
            camPitch = Math.max(-0.40, Math.min(0.06, camPitch));
            camYawEl.object3D.rotation.y = camYaw;
            camPitchEl.object3D.rotation.x = camPitch;

            let pos = rig.object3D.position;
            let loboPos = werewolfRig.object3D.position;
            let ahora = Date.now();

            let distLoboJugador = Math.sqrt(Math.pow(pos.x - loboPos.x, 2) + Math.pow(pos.z - loboPos.z, 2));

            // SISTEMA NATIVO DE BRUMA DE PESADILLA (MÁXIMO RENDIMIENTO)
            if (distLoboJugador < 8.0 && jugadorEstado === "EXPLORANDO") {
                // Modificación en tiempo real del mapa de niebla de la escena sin crear objetos pesados
                escena.setAttribute('fog', 'type: exponential; color: #080312; density: 0.055;');
                luzAmbiental.setAttribute('light', 'type: ambient; intensity: 0.2; color: #320f26');
                
                if (distLoboJugador < 1.2) {
                    alertUI.innerHTML = "🚨 ¡EL LOBO TE ATACÓ! 🚨<br>¡Muévete rápido!";
                    let repelerX = (pos.x - loboPos.x) / distLoboJugador;
                    let repelerZ = (pos.z - loboPos.z) / distLoboJugador;
                    pos.x += repelerX * 0.08; pos.z += repelerZ * 0.08;
                } else {
                    alertUI.innerHTML = "⚠️ LA BRUMA DE PESADILLA SE ESPESA... ¡CORRE! 🐺";
                }
            } else if (jugadorEstado === "EXPLORANDO") {
                escena.setAttribute('fog', 'type: exponential; color: #030206; density: 0.015;');
                luzAmbiental.setAttribute('light', 'type: ambient; intensity: 0.45; color: #28255c');
                alertUI.innerHTML = "⚠️ ¡Huye! Busca el refugio 🏡";
            }

            // INTELIGENCIA ARTIFICIAL DEL HOMBRE LOBO (CON PERSECUCIÓN ACTIVA)
            if (loboEstado === 'howl') {
                loboTimer++;
                if (loboTimer > 150) { cambiarPoseLobo('idle'); loboTimer = 0; }
            } else {
                // Si el jugador está en rango, el lobo entra en modo acecho directo
                if (distLoboJugador < 15.0 && jugadorEstado === "EXPLORANDO") {
                    cambiarPoseLobo('beast');
                    let tdx = pos.x - loboPos.x; let tdz = pos.z - loboPos.z;
                    loboPos.x += (tdx / distLoboJugador) * 0.035;
                    loboPos.z += (tdz / distLoboJugador) * 0.035;
                    werewolfRig.object3D.rotation.y = Math.atan2(tdx, tdz);
                } else {
                    // Modo aullido aleatorio en reposo
                    if (ahora - ultimoAullido > 40000 && Math.random() < 0.002) {
                        cambiarPoseLobo('howl'); ultimoAullido = ahora; loboTimer = 0;
                    } else {
                        cambiarPoseLobo('idle');
                    }
                }
            }

            // SISTEMA DE MOVIMIENTO RE-OPTIMIZADO CON COLISIONES MATEMÁTICAS LIGERAS
            if (jugadorEstado === "EXPLORANDO") {
                let inputX = 0; let inputY = 0;
                if (keys.w) inputY = -1; if (keys.s) inputY = 1;
                if (keys.a) inputX = -1; if (keys.d) inputX = 1;
                if (joyDragging) { inputX = moveX; inputY = moveY; }

                let moviendo = (inputX !== 0 || inputY !== 0);
                
                if (moviendo) {
                    if (modoCorrer) {
                        luisRun.setAttribute('visible', 'true'); luisWalk.setAttribute('visible', 'false');
                        luisRun.setAttribute('animation-mixer', 'timeScale', 1.2);
                    } else {
                        luisWalk.setAttribute('visible', 'true'); luisRun.setAttribute('visible', 'false');
                        luisWalk.setAttribute('animation-mixer', 'timeScale', 1.1);
                    }

                    let oldX = pos.x; let oldZ = pos.z;
                    const velActual = modoCorrer ? VEL_CORRER : VEL_CAMINAR;

                    const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                    const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                    pos.x += (fwdX * -inputY + rgtX * inputX) * velActual;
                    pos.z += (fwdZ * -inputY + rgtZ * inputX) * velActual; 

                    // VERIFICACIÓN MATEMÁTICA RÁPIDA DE COLISIÓN (EVITA EL ATRAVESADO)
                    let colisionDetectada = false;
                    for (let obs of limitesEstructurales) {
                        let distanciaEstructura = Math.sqrt(Math.pow(pos.x - obs.x, 2) + Math.pow(pos.z - obs.z, 2));
                        if (distanciaEstructura < obs.r) {
                            // Si choca con la casa pero no está en la puerta, se bloquea
                            let distA_Puerta = Math.sqrt(Math.pow(pos.x - CASA_FACHADA_X, 2) + Math.pow(pos.z - CASA_FACHADA_Z, 2));
                            if (distA_Puerta > RADIO_DISPARADOR) {
                                colisionDetectada = true;
                                break;
                            }
                        }
                    }

                    if (colisionDetectada) { pos.x = oldX; pos.z = oldZ; } // Detiene el movimiento sólidamente

                    if (Math.abs(pos.x) > 140 || Math.abs(pos.z) > 140) { pos.x = oldX; pos.z = oldZ; }

                    const angleDestino = camYaw + Math.atan2(inputX, inputY);
                    let diffAngle = Math.atan2(Math.sin(angleDestino - avatarContainer.object3D.rotation.y), Math.cos(angleDestino - avatarContainer.object3D.rotation.y));
                    avatarContainer.object3D.rotation.y += diffAngle * 0.25;
                } else {
                    luisWalk.setAttribute('visible', 'true');
                    luisRun.setAttribute('visible', 'false');
                    luisLlama.setAttribute('visible', 'false');
                    luisWalk.setAttribute('animation-mixer', 'timeScale', 0);
                }
                pos.y = 0;
                
                // CONTROLADOR DEL DISPARADOR DEL REFUGIO
                let distA_Casa = Math.sqrt(Math.pow(pos.x - CASA_FACHADA_X, 2) + Math.pow(pos.z - CASA_FACHADA_Z, 2));
                if (distA_Casa <= RADIO_DISPARADOR) {
                    jugadorEstado = "LLAMANDO";
                    luisWalk.setAttribute('visible', 'false'); luisRun.setAttribute('visible', 'false');
                    luisLlama.setAttribute('visible', 'true'); 
                    luisLlama.setAttribute('animation-mixer', 'timeScale', 1);
                    alertUI.textContent = "🔊 ¡Entrando a la casa segura!...";

                    setTimeout(() => {
                        jugadorEstado = "SALVADO";
                        pos.x = CASA_INTERIOR_X; pos.z = CASA_INTERIOR_Z; pos.y = 0;
                        escena.setAttribute('fog', 'type: exponential; color: #030206; density: 0.015;');
                        luzAmbiental.setAttribute('light', 'type: ambient; intensity: 0.45; color: #28255c');
                        
                        luisLlama.setAttribute('visible', 'false');
                        luisWalk.setAttribute('visible', 'true'); 
                        luisWalk.setAttribute('animation-mixer', 'timeScale', 0);
                        alertUI.textContent = "🎉 ¡A salvo! El hombre lobo ha perdido tu rastro.";
                    }, 2000); 
                }
            }
        }
        
        document.getElementById('btn-center').addEventListener('click', () => {
            if (!rig.object3D) return;
            jugadorEstado = "EXPLORANDO";
            modoCorrer = false;
            btnSprint.textContent = "🏃‍♂️ CORRER";
            btnSprint.style.borderColor = "#ef4444";
            rig.object3D.position.set(SPAWN_X, 0, SPAWN_Z);
            luisWalk.setAttribute('visible', 'true');
            luisRun.setAttribute('visible', 'false');
            luisLlama.setAttribute('visible', 'false');
            luisWalk.setAttribute('animation-mixer', 'timeScale', 0);
        });

        engineLoop();
    </script>
