<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Werewolf Nightmare v10.5 (Production Audio & Load Fix)</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/idea-space/aframe-particle-system-component@v1.1.3/dist/aframe-particle-system-component.min.js"></script>
    
    <style>
        :root {
            --ui-red: #ff2a2a;
            --ui-green: #00ffaa;
            --ui-blue: #38bdf8;
            --bg-dark: #04040a;
            --pane-bg: rgba(6, 10, 20, 0.9);
        }

        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-dark); user-select: none; 
            -webkit-user-select: none; color: #fff;
        }

        #custom-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); z-index: 99999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.8s ease, visibility 0.8s ease; 
        }
        #custom-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .spinner-container { position: relative; width: 80px; height: 80px; margin-bottom: 25px; }
        .spinner { 
            width: 100%; height: 100%; border: 4px solid rgba(255, 42, 42, 0.1); 
            border-top-color: var(--ui-red); border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        .spinner-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: var(--ui-red); animation: pulse 2s infinite; }

        .loader-text-group { text-align: center; }
        .loader-title { color: var(--ui-red); font-size: 18px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
        .load-progress { width: 200px; height: 3px; background: rgba(255,255,255,0.1); margin: 15px auto; border-radius: 2px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--ui-red); transition: width 0.2s ease; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #ui-top-bar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; z-index: 1000; pointer-events: none; gap: 8px; }
        .ui-row { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; pointer-events: auto; }
        
        .ui-btn { 
            background: var(--pane-bg); border: 1px solid rgba(255,255,255,0.15); 
            color: #fff; border-radius: 8px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }
        .ui-btn:active { transform: scale(0.95); background: rgba(15, 23, 42, 0.9); }

        #btn-reset { width: 50px; height: 44px; font-size: 20px; border-color: var(--ui-blue); color: var(--ui-blue); flex-shrink: 0; }
        #btn-exit { padding: 0 16px; height: 44px; font-size: 11px; font-weight: bold; letter-spacing: 1px; border-color: rgba(255, 42, 42, 0.4); color: #fca5a5; text-transform: uppercase; flex-shrink: 0; }
        #btn-exit:active { border-color: var(--ui-red); background: rgba(255, 42, 42, 0.2); }
        
        #alert-ui { 
            flex-grow: 1; text-align: center; background: var(--pane-bg); 
            border: 1px solid var(--ui-red); color: #fca5a5; padding: 12px; border-radius: 8px; 
            font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #btn-sprint { 
            position: fixed; bottom: 30px; left: 30px; width: 68px; height: 68px; 
            border-radius: 50%; font-size: 10px; font-weight: 900; letter-spacing: 0.5px;
            text-transform: uppercase; border: 3px solid transparent; background: #070a14;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); z-index: 1000; pointer-events: auto;
            animation: rgbNeonAnimation 4s linear infinite; color: #fff; cursor: pointer;
        }
        #btn-sprint:active { transform: scale(0.92); }
        #btn-sprint.active { background: #111827; box-shadow: 0 0 25px #00ffaa !important; border-color: #00ffaa !important; animation: none; }
        #btn-sprint.cooldown { animation: none; border-color: #334155; color: #475569; background: #0f172a; cursor: not-allowed; box-shadow: none; }

        #stamina-container { width: 100%; max-width: 320px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; pointer-events: none; }
        #stamina-bar { width: 100%; height: 100%; background: var(--ui-green); }

        #damage-vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(255,0,0,0.85) 100%); z-index: 9998; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
        #damage-vignette.active { opacity: 1; animation: bloodPulse 0.6s infinite alternate; }
        #damage-vignette.grabbed { opacity: 1; background: radial-gradient(circle, rgba(15,0,0,0.4) 20%, rgba(255,0,0,0.95) 100%); animation: screenShake 0.08s infinite; }
        
        #jumpscare-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0000; z-index: 9999; opacity: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity 0.1s ease; }
        #jumpscare-screen.active { opacity: 1; animation: screenShake 0.1s infinite; }
        #jumpscare-text { color: var(--ui-red); font-size: 40px; font-weight: 900; letter-spacing: 10px; text-shadow: 0 0 30px #ff0000; text-transform: uppercase; }

        #fade-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9990; opacity: 0; pointer-events: none; transition: opacity 0.5s; }

        .control-wrapper { position: absolute; z-index: 999; pointer-events: auto; }
        #joystick-wrapper { bottom: 30px; right: 30px; width: 100px; height: 100px; }
        #joystick-container { width: 100%; height: 100%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; touch-action: none; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: var(--ui-red); border-radius: 50%; box-shadow: 0 0 12px rgba(255, 42, 42, 0.5); touch-action: none; cursor: grab; }
        #joystick-knob:active { cursor: grabbing; }

        @keyframes rgbNeonAnimation {
            0% { border-color: #ff0055; box-shadow: 0 0 12px rgba(255, 0, 85, 0.5); }
            33% { border-color: #00ffaa; box-shadow: 0 0 12px rgba(0, 255, 170, 0.5); }
            66% { border-color: #00bfff; box-shadow: 0 0 12px rgba(0, 191, 255, 0.5); }
            100% { border-color: #ff0055; box-shadow: 0 0 12px rgba(255, 0, 85, 0.5); }
        }
        @keyframes bloodPulse { from { opacity: 0.4; } to { opacity: 0.9; } }
        @keyframes screenShake { 0% { transform: translate(3px, 3px) rotate(0deg); } 50% { transform: translate(-3px, -2px) rotate(1deg); } 100% { transform: translate(2px, -3px) rotate(-1deg); } }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner-container">
            <div class="spinner"></div>
            <div class="spinner-icon">🐺</div>
        </div>
        <div class="loader-text-group">
            <div class="loader-title">ARK SIMULATOR</div>
            <div class="load-progress"><div id="progress-bar"></div></div>
        </div>
    </div>

    <div id="damage-vignette"></div>
    <div id="jumpscare-screen"><div id="jumpscare-text">CAZADO</div></div>
    <div id="fade-screen"></div>

    <div id="ui-top-bar">
        <div class="ui-row">
            <button id="btn-reset" class="ui-btn" title="Reposicionar Avatar">🎯👤</button>
            <div id="alert-ui">⚠️ CARGANDO ENTRAMADO...</div>
            <button id="btn-exit" class="ui-btn" title="Regresar al Menú Principal">🚪 Salir</button>
        </div>
        <div id="stamina-container">
            <div id="stamina-bar"></div>
        </div>
    </div>

    <button id="btn-sprint">SPRINT</button>

    <div id="joystick-wrapper" class="control-wrapper">
        <div id="joystick-container"><div id="joystick-knob"></div></div>
    </div>

    <a-scene id="escena-principal" 
             fog="type: linear; color: #04040a; near: 8; far: 45;" 
             renderer="colorManagement: true; antialias: false; powerPreference: high-performance; precision: medium;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false" 
             loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="pueblo-model" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-beast-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Beast.glb" crossorigin="anonymous"></a-asset-item>
            
            <a-asset-item id="luis-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-run-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-corre.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-atento-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-atento.glb" crossorigin="anonymous"></a-asset-item>
        </a-assets>

        <a-sky color="#04040a"></a-sky>
        
        <a-entity id="luna-completa" position="15 35 -40">
            <a-sphere radius="2.2" color="#e2e8f0" material="shader: flat; fog: false;"></a-sphere>
            <a-entity light="type: directional; intensity: 0.35; color: #556a9e; castShadow: false;"></a-entity>
        </a-entity>
        
        <a-entity particle-system="preset: rain; color: #333; particleCount: 600; size: 0.25; velocityValue: 0 18 0; opacity: 0.15;"></a-entity>
        
        <a-entity id="luz-ambiental" light="type: ambient; intensity: 0.25; color: #1a2238"></a-entity>
        <a-entity id="luz-relampago" light="type: directional; intensity: 0; color: #ffffff;" position="0 80 0"></a-entity>

        <a-entity id="entorno" gltf-model="#pueblo-model" position="0 0 0"></a-entity>
        
        <a-entity id="luz-interior-cocina" light="type: point; intensity: 1.4; distance: 8; color: #ffbc73;" position="4.5 1.1 -3.2"></a-entity>
        <a-entity id="luz-interior-salon" light="type: point; intensity: 1.0; distance: 10; color: #9bb7f0;" position="-2.0 1.1 -1.5"></a-entity>

        <!-- RIG JUGADOR -->
        <a-entity id="player-rig" position="0 0 25">
            <a-entity id="avatar-container" position="0 0 0">
                <a-entity id="luis-mesh-walk" gltf-model="#luis-walk-src" scale="0 0 0" animation-mixer="clip: *; loop: repeat;"></a-entity>
                <a-entity id="luis-mesh-run" gltf-model="#luis-run-src" scale="0 0 0" animation-mixer="clip: *; loop: repeat;"></a-entity>
                <a-entity id="luis-mesh-atento" gltf-model="#luis-atento-src" scale="0.38 0.38 0.38" animation-mixer="clip: *; loop: repeat;"></a-entity>
            </a-entity>

            <a-entity id="camera-yaw" rotation="0 0 0">
                <a-entity id="camera-pitch" rotation="0 0 0">
                    <a-entity id="main-camera" camera="fov: 70; near: 0.1; far: 300;" position="0 1.5 2.2">
                        <a-entity id="flashlight" light="type: spot; intensity: 2.8; distance: 40; angle: 38; penumbra: 0.5; color: #fffde6;" position="0 -0.2 -0.2"></a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- ENEMIGO -->
        <a-entity id="werewolf-rig" position="60 0 -60">
            <a-entity id="ww-mesh-beast" gltf-model="#ww-beast-src" scale="0.8 0.8 0.8" visible="true" animation-mixer="clip: *; loop: repeat;"></a-entity>
            <a-entity light="type: point; intensity: 1.2; distance: 3; color: #ff0000;" position="0 1.8 0.4"></a-entity>
        </a-entity>

    </a-scene>

    <script>
        window.addEventListener('contextmenu', e => e.preventDefault(), false);

        const V_POOL = {
            dirALugar: new THREE.Vector3(),
            dirAlBosque: new THREE.Vector3(),
            dirHaciaTi: new THREE.Vector3(),
            rayOrigin: new THREE.Vector3(),
            rayDir: new THREE.Vector3(0, -1, 0)
        };
        const RAYCASTER_REUTILIZABLE = new THREE.Raycaster();
        let entornoMeshCache = null;

        const Pistas = {
            limbo: new Audio("audio/limbo.mp3"),
            enojado: new Audio("audio/werewolf-enojado.mp3"),
            stalk: new Audio("audio/wolf-stalk.mp3"),
            aullido: new Audio("audio/werewolf-aullido.mp3")
        };

        Pistas.limbo.loop = true;
        Pistas.limbo.volume = 0.45;
        Pistas.stalk.loop = true;
        Pistas.stalk.volume = 0.0;
        Pistas.enojado.loop = true;
        Pistas.enojado.volume = 0.0;

        const AudioController = {
            reproducirMusicaFondo() {
                Pistas.limbo.play().catch(e => console.log("Audio en espera."));
                Pistas.stalk.play().catch(() => {});
                Pistas.enojado.play().catch(() => {});
            },
            // CORRECCIÓN INCONSISTENCIA 1: Filtrado acústico por distancia real estricta
            actualizarProximidad(estado, distancia) {
                if (estado === 'GRACIA_INICIAL' || estado === 'BOSQUE' || distancia > 35) {
                    this.fadeTo(Pistas.enojado, 0.0);
                    this.fadeTo(Pistas.stalk, 0.0);
                    return;
                }
                
                if (estado === 'MERODEANDO_CASA') {
                    this.fadeTo(Pistas.stalk, 0.35); // Eco amortiguado tras cristales
                    this.fadeTo(Pistas.enojado, 0.10);
                    return;
                }

                if (estado === 'FORCEJEO' || estado === 'ATAQUE') {
                    this.fadeTo(Pistas.enojado, 0.95);
                    this.fadeTo(Pistas.stalk, 0.90);
                } else if (estado === 'ACECHO') {
                    // El lobo te rastrea en el bosque, pero solo suena si rompe el umbral de cercanía
                    if (distancia < 30) {
                        let factorStalk = Math.max(0, Math.min(0.85, (30 - distancia) / 18));
                        this.fadeTo(Pistas.stalk, factorStalk);
                        
                        // El gruñido pesado solo entra si está a tiro de piedra
                        if (distancia < 15) {
                            let factorEnojado = Math.max(0, Math.min(0.65, (15 - distancia) / 10));
                            this.fadeTo(Pistas.enojado, factorEnojado);
                        } else {
                            this.fadeTo(Pistas.enojado, 0.0);
                        }
                    } else {
                        this.fadeTo(Pistas.enojado, 0.0);
                        this.fadeTo(Pistas.stalk, 0.0);
                    }
                }
            },
            fadeTo(audio, targetVolume) {
                let diff = targetVolume - audio.volume;
                if (Math.abs(diff) > 0.05) {
                    audio.volume += Math.sign(diff) * 0.05;
                } else {
                    audio.volume = targetVolume;
                }
            },
            dispararAullidoMinuto() {
                Pistas.aullido.currentTime = 0;
                Pistas.aullido.volume = 0.95;
                Pistas.aullido.play().catch(() => {});
            },
            detenerTodo() {
                Object.values(Pistas).forEach(p => { try { p.pause(); } catch(e){} });
            }
        };

        const CONFIG = {
            velCaminar: 2.1,           
            velCorrer: 4.5,            
            suavizadoGiroAvatar: 0.25,
            staminaMax: 200, 
            staminaGasto: 15.0,        
            staminaRecuperacion: 20.0,  
            wwVelAcecho: 0.85,  
            wwVelAtaque: 2.3,   
            distDeteccionLobo: 85, 
            distAtaqueLobo: 14,
            tiempoForcejeoMax: 2.5     
        };

        const GAME_STATE = {
            assetsCargados: 0, totalAssets: 0, escenaIniciada: false, juegoActivo: false,
            introCompletada: false, // Blindaje anti-jumpscare durante la pantalla negra
            pos: new THREE.Vector3(0, 0, 25), stamina: 200,
            modoCorrerActive: false, enCooldownSprint: false, inputMoviendo: false, isDead: false,
            loboEstado: 'GRACIA_INICIAL', lastFrameTime: 0,
            esInterior: false, camPerspectiveState: 'NONE', frameTicks: 0, cachedAlturaSuelo: 0,
            aiTimer: 0, aiPuntoObjetivo: new THREE.Vector3(60, 0, -60), tiempoUltimoAullido: 0,
            tiempoContactoFisico: 0, tiempoGraciaInicial: 10.0 // Ampliado a 10s seguros
        };

        const CASA_BOUNDS = { xMin: -5.5, xMax: 5.5, zMin: -6.0, zMax: 2.5 };

        const PUNTOS_MERODEO_CASA = [
            new THREE.Vector3(0, 0, 5.0),    
            new THREE.Vector3(-7.0, 0, -2),  
            new THREE.Vector3(7.0, 0, -2),   
            new THREE.Vector3(0, 0, -7.5)    
        ];

        const UI = {
            loader: document.getElementById('custom-loader'), bar: document.getElementById('progress-bar'),
            fade: document.getElementById('fade-screen'), alert: document.getElementById('alert-ui'), 
            btnReset: document.getElementById('btn-reset'), btnExit: document.getElementById('btn-exit'),
            btnSprint: document.getElementById('btn-sprint'), staminaBar: document.getElementById('stamina-bar'), 
            damage: document.getElementById('damage-vignette'), jumpscare: document.getElementById('jumpscare-screen')
        };

        const ENT = {
            scene: document.getElementById('escena-principal'), luzRelampago: document.getElementById('luz-relampago'),
            rig: document.getElementById('player-rig'), avatar: document.getElementById('avatar-container'), entorno: document.getElementById('entorno'),
            camYaw: document.getElementById('camera-yaw'), camPitch: document.getElementById('camera-pitch'),
            meshes: { walk: document.getElementById('luis-mesh-walk'), run: document.getElementById('luis-mesh-run'), atento: document.getElementById('luis-mesh-atento') },
            wwRig: document.getElementById('werewolf-rig'),
            wwMeshes: { beast: document.getElementById('ww-mesh-beast') }
        };

        const INPUT = { keys: { w: false, a: false, s: false, d: false }, joyMove: { x: 0, y: 0 }, camYaw: 0, camPitch: 0, isDraggingCam: false, lastMouseX: 0, lastMouseY: 0 };

        function initLoader() {
            const assets = document.querySelectorAll('a-asset-item');
            GAME_STATE.totalAssets = assets.length;
            if (GAME_STATE.totalAssets === 0) { showStartButton(); return; }
            assets.forEach(asset => {
                asset.addEventListener('loaded', onAssetLoaded);
                asset.addEventListener('error', onAssetLoaded);
            });
            setTimeout(() => { if (!GAME_STATE.escenaIniciada) showStartButton(); }, 5000);
        }

        function onAssetLoaded() {
            GAME_STATE.assetsCargados++;
            const percent = Math.floor((GAME_STATE.assetsCargados / GAME_STATE.totalAssets) * 100);
            UI.bar.style.width = percent + '%';
            if (GAME_STATE.assetsCargados >= GAME_STATE.totalAssets) { setTimeout(showStartButton, 300); }
        }

        function showStartButton() {
            if (GAME_STATE.escenaIniciada) return;
            GAME_STATE.escenaIniciada = true;
            
            ENT.rig.object3D.position.set(0, 0, 25);
            ENT.wwRig.object3D.position.set(60, 0, -60);
            GAME_STATE.pos.set(0, 0, 25);
            
            if (ENT.entorno) {
                ENT.entorno.addEventListener('model-loaded', () => {
                    entornoMeshCache = ENT.entorno.getObject3D('mesh');
                });
            }
            
            UI.loader.innerHTML = `<button id="btn-play-engine" style="background: var(--ui-red); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 13px; letter-spacing: 2px; box-shadow: 0 0 20px rgba(239,42,42,0.5); text-transform: uppercase;">¡ENTRAR AL SUEÑO!</button>`;
            
            document.getElementById('btn-play-engine').addEventListener('click', () => {
                UI.loader.classList.add('hidden');
                AudioController.reproducirMusicaFondo();
                initControls();
                
                if(!entornoMeshCache && ENT.entorno) {
                    entornoMeshCache = ENT.entorno.getObject3D('mesh');
                }
                
                // CORRECCIÓN INCONSISTENCIA 2: Cierre forzado de físicas hasta fin de transición visual
                GAME_STATE.introCompletada = false; 
                GAME_STATE.juegoActivo = true;
                GAME_STATE.lastFrameTime = performance.now();
                GAME_STATE.tiempoUltimoAullido = performance.now();
                GAME_STATE.tiempoGraciaInicial = 10.0; 
                GAME_STATE.loboEstado = 'GRACIA_INICIAL';
                
                setTimeout(() => {
                    GAME_STATE.introCompletada = true;
                    GAME_STATE.lastFrameTime = performance.now(); // Resetear Delta para ignorar tirones de carga
                }, 1200);
                
                requestAnimationFrame(engineLoop);
                setInterval(triggerThunder, 13000);
            });
        }

        function initControls() {
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if(['w','arrowup'].includes(k)) INPUT.keys.w = true;
                if(['s','arrowdown'].includes(k)) INPUT.keys.s = true;
                if(['a','arrowleft'].includes(k)) INPUT.keys.a = true;
                if(['d','arrowright'].includes(k)) INPUT.keys.d = true;
                if(e.key === ' ' || e.key === 'Shift') { e.preventDefault(); toggleSprint(true); }
            });
            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if(['w','arrowup'].includes(k)) INPUT.keys.w = false;
                if(['s','arrowdown'].includes(k)) INPUT.keys.s = false;
                if(['a','arrowleft'].includes(k)) INPUT.keys.a = false;
                if(['d','arrowright'].includes(k)) INPUT.keys.d = false;
                if(e.key === ' ' || e.key === 'Shift') { toggleSprint(false); }
            });

            window.addEventListener('pointerdown', e => {
                if (e.target.id === 'btn-sprint' || e.target.closest('.ui-btn') || e.target.closest('.control-wrapper') || e.target.closest('#alert-ui')) return;
                INPUT.isDraggingCam = true; INPUT.lastMouseX = e.clientX; INPUT.lastMouseY = e.clientY;
            });
            window.addEventListener('pointermove', e => {
                if (!INPUT.isDraggingCam) return;
                let dx = e.clientX - INPUT.lastMouseX; let dy = e.clientY - INPUT.lastMouseY;
                INPUT.camYaw -= dx * 0.0035; INPUT.camPitch -= dy * 0.0035;
                INPUT.camPitch = Math.max(-0.4, Math.min(0.4, INPUT.camPitch));
                INPUT.lastMouseX = e.clientX; INPUT.lastMouseY = e.clientY;
            });
            window.addEventListener('pointerup', () => INPUT.isDraggingCam = false);

            UI.btnReset.addEventListener('click', resetGame);
            UI.btnExit.addEventListener('click', () => { AudioController.detenerTodo(); window.location.href = 'index.html'; });
            
            UI.btnSprint.addEventListener('click', () => {
                if (GAME_STATE.enCooldownSprint) return;
                toggleSprint(!GAME_STATE.modoCorrerActive);
            });

            const knob = document.getElementById('joystick-knob');
            const container = document.getElementById('joystick-container');
            let joyActive = false; let jStartX = 0, jStartY = 0;

            knob.addEventListener('pointerdown', (e) => { joyActive = true; const rect = container.getBoundingClientRect(); jStartX = rect.left + rect.width / 2; jStartY = rect.top + rect.height / 2; });
            window.addEventListener('pointermove', e => {
                if (!joyActive) return;
                let dx = e.clientX - jStartX; let dy = e.clientY - jStartY;
                const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                INPUT.joyMove.x = dx / maxLen; INPUT.joyMove.y = dy / maxLen;
            });
            window.addEventListener('pointerup', () => { joyActive = false; knob.style.transform = 'translate(0px,0px)'; INPUT.joyMove.x = 0; INPUT.joyMove.y = 0; });
        }

        function toggleSprint(active) {
            if (active && GAME_STATE.stamina > 20 && !GAME_STATE.enCooldownSprint) {
                GAME_STATE.modoCorrerActive = true; UI.btnSprint.classList.add('active');
            } else {
                GAME_STATE.modoCorrerActive = false; UI.btnSprint.classList.remove('active');
            }
        }

        function gestionarPerspectivaYAvatar() {
            const camara = document.getElementById('main-camera');
            if (!camara) return;

            if (GAME_STATE.esInterior) {
                if (GAME_STATE.camPerspectiveState !== 'FIRST_PERSON') {
                    camara.object3D.position.set(0, 1.1, -0.3);
                    camara.setAttribute('camera', 'fov', 48);
                    GAME_STATE.camPerspectiveState = 'FIRST_PERSON';
                }
                for (let key in ENT.meshes) { ENT.meshes[key].setAttribute('scale', '0 0 0'); }
            } else {
                if (GAME_STATE.camPerspectiveState !== 'THIRD_PERSON') {
                    camara.object3D.position.set(0, 1.5, 2.2);
                    camara.setAttribute('camera', 'fov', 70);
                    GAME_STATE.camPerspectiveState = 'THIRD_PERSON';
                }
                let meshActivo = GAME_STATE.modoCorrerActive && GAME_STATE.inputMoviendo ? 'run' : (GAME_STATE.inputMoviendo ? 'walk' : 'atento');
                for (let key in ENT.meshes) {
                    if (key === meshActivo) ENT.meshes[key].setAttribute('scale', '0.38 0.38 0.38');
                    else ENT.meshes[key].setAttribute('scale', '0 0 0');
                }
            }
        }

        function triggerJumpscare() {
            if (GAME_STATE.isDead || !GAME_STATE.introCompletada || GAME_STATE.tiempoGraciaInicial > 0 || GAME_STATE.esInterior) return; 
            
            GAME_STATE.isDead = true;
            GAME_STATE.juegoActivo = false;
            AudioController.detenerTodo();
            UI.jumpscare.classList.add('active');
            
            setTimeout(() => {
                UI.fade.style.opacity = "1";
                setTimeout(() => { UI.jumpscare.classList.remove('active'); resetGame(); }, 4000);
            }, 1500);
        }

        function engineLoop(time) {
            requestAnimationFrame(engineLoop);
            
            let dt = (time - GAME_STATE.lastFrameTime) / 1000;
            GAME_STATE.lastFrameTime = time;
            if (dt > 0.1) dt = 0.1; 

            if (!GAME_STATE.juegoActivo || GAME_STATE.isDead) return;

            try {
                GAME_STATE.frameTicks++;
                const ejecutarRaycast = (GAME_STATE.frameTicks % 2 === 0);

                if (time - GAME_STATE.tiempoUltimoAullido > 60000) {
                    AudioController.dispararAullidoMinuto();
                    GAME_STATE.tiempoUltimoAullido = time;
                }

                ENT.camYaw.object3D.rotation.y = INPUT.camYaw;
                ENT.camPitch.object3D.rotation.x = INPUT.camPitch;

                let mx = 0; let mz = 0;
                if (INPUT.keys.w) mz = -1; if (INPUT.keys.s) mz = 1;
                if (INPUT.keys.a) mx = -1; if (INPUT.keys.d) mx = 1;
                if (Math.abs(INPUT.joyMove.x) > 0.05 || Math.abs(INPUT.joyMove.y) > 0.05) { mx = INPUT.joyMove.x; mz = INPUT.joyMove.y; }

                GAME_STATE.inputMoviendo = (Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05);
                let speed = GAME_STATE.modoCorrerActive ? CONFIG.velCorrer : CONFIG.velCaminar;
                let angle = INPUT.camYaw;
                let dx = mx * Math.cos(angle) + mz * Math.sin(angle);
                let dz = mz * Math.cos(angle) - mx * Math.sin(angle);

                let siguienteX = GAME_STATE.pos.x + dx * speed * dt;
                let siguienteZ = GAME_STATE.pos.z + dz * speed * dt;

                const estabaDentro = GAME_STATE.pos.x > CASA_BOUNDS.xMin && GAME_STATE.pos.x < CASA_BOUNDS.xMax && GAME_STATE.pos.z > CASA_BOUNDS.zMin && GAME_STATE.pos.z < CASA_BOUNDS.zMax;
                const quiereEntrar = siguienteX > CASA_BOUNDS.xMin && siguienteX < CASA_BOUNDS.xMax && siguienteZ > CASA_BOUNDS.zMin && siguienteZ < CASA_BOUNDS.zMax;

                if (estabaDentro) {
                    if (siguienteZ > CASA_BOUNDS.zMax) { if (siguienteX < -1.2 || siguienteX > 1.2) siguienteZ = CASA_BOUNDS.zMax; }
                    siguienteX = Math.max(CASA_BOUNDS.xMin + 0.25, Math.min(CASA_BOUNDS.xMax - 0.25, siguienteX));
                    siguienteZ = Math.max(CASA_BOUNDS.zMin + 0.25, Math.min(CASA_BOUNDS.zMax + 0.45, siguienteZ));

                    if (siguienteX > 1.5 && siguienteX < 3.5 && siguienteZ > -4.5 && siguienteZ < -1.0) {
                        let pctSubida = (-1.0 - siguienteZ) / (-1.0 - (-4.5)); GAME_STATE.cachedAlturaSuelo = pctSubida * 3.0; 
                    } else if (siguienteZ <= -4.5 && siguienteX > 1.5) { GAME_STATE.cachedAlturaSuelo = 3.0; }
                    else if (GAME_STATE.pos.y > 1.5) { GAME_STATE.cachedAlturaSuelo = 3.0; }
                    else { GAME_STATE.cachedAlturaSuelo = 0.0; }
                } else {
                    if (quiereEntrar) {
                        if (GAME_STATE.pos.z > CASA_BOUNDS.zMax && siguienteX >= -1.2 && siguienteX <= 1.2) {} 
                        else { siguienteX = GAME_STATE.pos.x; siguienteZ = GAME_STATE.pos.z; }
                    }
                    if (ejecutarRaycast && entornoMeshCache && GAME_STATE.inputMoviendo) {
                        V_POOL.rayOrigin.set(siguienteX, 50.0, siguienteZ); RAYCASTER_REUTILIZABLE.set(V_POOL.rayOrigin, V_POOL.rayDir);
                        const colisiones = RAYCASTER_REUTILIZABLE.intersectObject(entornoMeshCache, true);
                        let sueloEncontrado = false;
                        if (colisiones.length > 0) {
                            for (let i = 0; i < colisiones.length; i++) {
                                const hit = colisiones[i];
                                if (hit.face && hit.face.normal.y > 0.85 && hit.point.y < 2.2) { GAME_STATE.cachedAlturaSuelo = hit.point.y; sueloEncontrado = true; break; }
                            }
                        }
                        if (!sueloEncontrado) GAME_STATE.cachedAlturaSuelo = 0.0;
                    }
                }

                GAME_STATE.esInterior = siguienteX > CASA_BOUNDS.xMin && siguienteX < CASA_BOUNDS.xMax && siguienteZ > CASA_BOUNDS.zMin && siguienteZ < CASA_BOUNDS.zMax;
                if (GAME_STATE.inputMoviendo) { GAME_STATE.pos.x = siguienteX; GAME_STATE.pos.z = siguienteZ; }

                let factorSuavizado = GAME_STATE.esInterior ? 0.25 : 0.4;
                GAME_STATE.pos.y += (GAME_STATE.cachedAlturaSuelo - GAME_STATE.pos.y) * factorSuavizado;
                ENT.rig.object3D.position.set(GAME_STATE.pos.x, GAME_STATE.pos.y, GAME_STATE.pos.z);

                if (GAME_STATE.inputMoviendo) {
                    let targetAngle = Math.atan2(dx, dz);
                    let diff = targetAngle - ENT.avatar.object3D.rotation.y;
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                    ENT.avatar.object3D.rotation.y += diff * CONFIG.suavizadoGiroAvatar;
                }

                gestionarPerspectivaYAvatar();

                if (GAME_STATE.modoCorrerActive && GAME_STATE.inputMoviendo) {
                    GAME_STATE.stamina = Math.max(0, GAME_STATE.stamina - (CONFIG.staminaGasto * dt));
                    if (GAME_STATE.stamina <= 0) { toggleSprint(false); GAME_STATE.enCooldownSprint = true; UI.btnSprint.classList.add('cooldown'); }
                } else {
                    GAME_STATE.stamina = Math.min(CONFIG.staminaMax, GAME_STATE.stamina + (CONFIG.staminaRecuperacion * dt));
                    if (GAME_STATE.stamina >= 50 && GAME_STATE.enCooldownSprint) { GAME_STATE.enCooldownSprint = false; UI.btnSprint.classList.remove('cooldown'); }
                }
                UI.staminaBar.style.width = ((GAME_STATE.stamina / CONFIG.staminaMax) * 100) + '%';

                let loboPos = ENT.wwRig.object3D.position;
                let distJugadorLobo = GAME_STATE.pos.distanceTo(loboPos);

                // CORRECCIÓN INCONSISTENCIA 2: Cierre estricto de IA de ataque si la carga o la gracia están activas
                if (!GAME_STATE.introCompletada || GAME_STATE.tiempoGraciaInicial > 0) {
                    if (GAME_STATE.tiempoGraciaInicial > 0 && GAME_STATE.introCompletada) {
                        GAME_STATE.tiempoGraciaInicial -= dt;
                    }
                    GAME_STATE.loboEstado = 'GRACIA_INICIAL';
                    loboPos.set(60, 0, -60); // Anclado firmemente en el extremo del mapa
                    UI.alert.textContent = "👁️ PREPARANDO SUEÑO... CORRE A REFUGO";
                    UI.damage.className = '';
                    GAME_STATE.tiempoContactoFisico = 0;
                    
                    // Asegurar mutear ruidos de peligro durante la carga
                    AudioController.fadeTo(Pistas.enojado, 0.0);
                    AudioController.fadeTo(Pistas.stalk, 0.0);
                } else if (GAME_STATE.esInterior) {
                    GAME_STATE.tiempoContactoFisico = 0;
                    UI.damage.className = '';
                    
                    if (GAME_STATE.loboEstado !== 'MERODEANDO_CASA' && GAME_STATE.loboEstado !== 'RETIRADA') {
                        GAME_STATE.loboEstado = 'MERODEANDO_CASA';
                        GAME_STATE.aiPuntoObjetivo = PUNTOS_MERODEO_CASA[Math.floor(Math.random() * PUNTOS_MERODEO_CASA.length)];
                        UI.alert.textContent = "🔊 Ruidos pesados rodean las ventanas...";
                    }

                    if (GAME_STATE.loboEstado === 'MERODEANDO_CASA') {
                        V_POOL.dirALugar.subVectors(GAME_STATE.aiPuntoObjetivo, loboPos); V_POOL.dirALugar.y = 0;
                        let distAlPunto = V_POOL.dirALugar.length();
                        if (distAlPunto > 0.5) {
                            V_POOL.dirALugar.normalize();
                            loboPos.x += V_POOL.dirALugar.x * CONFIG.wwVelAcecho * dt;
                            loboPos.z += V_POOL.dirALugar.z * CONFIG.wwVelAcecho * dt;
                            ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirALugar.x, V_POOL.dirALugar.z);
                        } else {
                            if (GAME_STATE.frameTicks % 200 === 0) GAME_STATE.aiPuntoObjetivo = PUNTOS_MERODEO_CASA[Math.floor(Math.random() * PUNTOS_MERODEO_CASA.length)];
                            GAME_STATE.aiTimer += dt;
                            if (GAME_STATE.aiTimer > 25) {
                                GAME_STATE.loboEstado = 'RETIRADA'; GAME_STATE.aiPuntoObjetivo.set(60, 0, -60);
                                UI.alert.textContent = "🔊 Los gruñidos se desvanecen en el bosque...";
                            }
                        }
                    } else if (GAME_STATE.loboEstado === 'RETIRADA') {
                        V_POOL.dirAlBosque.subVectors(GAME_STATE.aiPuntoObjetivo, loboPos); V_POOL.dirAlBosque.y = 0;
                        if (V_POOL.dirAlBosque.length() > 1.0) {
                            V_POOL.dirAlBosque.normalize();
                            loboPos.x += V_POOL.dirAlBosque.x * CONFIG.wwVelAcecho * dt;
                            loboPos.z += V_POOL.dirAlBosque.z * CONFIG.wwVelAcecho * dt;
                            ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirAlBosque.x, V_POOL.dirAlBosque.z);
                        } else { GAME_STATE.loboEstado = 'BOSQUE'; GAME_STATE.aiTimer = 0; }
                    }
                } else {
                    GAME_STATE.aiTimer = 0;
                    if (distJugadorLobo >= CONFIG.distDeteccionLobo) {
                        GAME_STATE.loboEstado = 'BOSQUE';
                        V_POOL.dirHaciaTi.subVectors(GAME_STATE.pos, loboPos); V_POOL.dirHaciaTi.y = 0; V_POOL.dirHaciaTi.normalize();
                        loboPos.x += V_POOL.dirHaciaTi.x * CONFIG.wwVelAcecho * dt;
                        loboPos.z += V_POOL.dirHaciaTi.z * CONFIG.wwVelAcecho * dt;
                        ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirHaciaTi.x, V_POOL.dirHaciaTi.z);
                        UI.alert.textContent = "🔊 Gruñidos profundos resuenan en la niebla...";
                    } else {
                        V_POOL.dirHaciaTi.subVectors(GAME_STATE.pos, loboPos); V_POOL.dirHaciaTi.y = 0; V_POOL.dirHaciaTi.normalize();
                        let velocidadLobo = (distJugadorLobo < CONFIG.distAtaqueLobo) ? CONFIG.wwVelAtaque : CONFIG.wwVelAcecho;
                        loboPos.x += V_POOL.dirHaciaTi.x * velocidadLobo * dt;
                        loboPos.z += V_POOL.dirHaciaTi.z * velocidadLobo * dt;
                        ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirHaciaTi.x, V_POOL.dirHaciaTi.z);

                        if (distJugadorLobo < 1.6) {
                            GAME_STATE.loboEstado = 'FORCEJEO'; GAME_STATE.tiempoContactoFisico += dt;
                            UI.damage.className = 'grabbed';
                            let tiempoRestante = Math.max(0, CONFIG.tiempoForcejeoMax - GAME_STATE.tiempoContactoFisico);
                            UI.alert.textContent = `🚨 ¡LA BESTIA TE SUJETA! ¡SPRINT ACTIVO! (${tiempoRestante.toFixed(1)}s)`;
                            if (GAME_STATE.tiempoContactoFisico >= CONFIG.tiempoForcejeoMax) triggerJumpscare();
                        } else if (distJugadorLobo < CONFIG.distAtaqueLobo) {
                            GAME_STATE.loboEstado = 'ATAQUE'; GAME_STATE.tiempoContactoFisico = 0;
                            UI.alert.textContent = "⚠️ ¡HUYE A LA CASA!"; UI.damage.className = 'active';
                        } else {
                            GAME_STATE.loboEstado = 'ACECHO'; GAME_STATE.tiempoContactoFisico = 0;
                            UI.alert.textContent = "⚠️ El Hombre Lobo sigue tu rastro..."; UI.damage.className = '';
                        }
                    }
                }

                AudioController.actualizarProximidad(GAME_STATE.loboEstado, distJugadorLobo);

            } catch (err) { console.warn("Error del bucle:", err); }
        }

        function triggerThunder() {
            if (!GAME_STATE.juegoActivo) return;
            try {
                const luz = ENT.luzRelampago.object3D.element;
                if(luz) {
                    luz.setAttribute('light', 'intensity', '2.5');
                    setTimeout(() => {
                        luz.setAttribute('light', 'intensity', '0');
                        setTimeout(() => {
                            luz.setAttribute('light', 'intensity', '1.8');
                            setTimeout(() => luz.setAttribute('light', 'intensity', '0'), 90);
                        }, 50);
                    }, 120);
                }
            } catch(e){}
        }

        function resetGame() {
            AudioController.detenerTodo();
            GAME_STATE.stamina = CONFIG.staminaMax;
            GAME_STATE.modoCorrerActive = false; GAME_STATE.enCooldownSprint = false; GAME_STATE.esInterior = false;
            GAME_STATE.isDead = false; GAME_STATE.aiTimer = 0; GAME_STATE.tiempoContactoFisico = 0;
            GAME_STATE.cachedAlturaSuelo = 0; GAME_STATE.camPerspectiveState = 'NONE';
            
            ENT.rig.object3D.position.set(0, 0, 25);
            ENT.wwRig.object3D.position.set(60, 0, -60);
            GAME_STATE.pos.set(0, 0, 25);
            
            INPUT.camYaw = 0; INPUT.camPitch = 0;
            UI.btnSprint.classList.remove('active', 'cooldown');
            UI.fade.style.opacity = "0"; UI.damage.className = ''; UI.jumpscare.classList.remove('active');

            for (let key in ENT.meshes) ENT.meshes[key].setAttribute('scale', '0 0 0');
            if (ENT.meshes.atento) ENT.meshes.atento.setAttribute('scale', '0.38 0.38 0.38');
            
            GAME_STATE.introCompletada = false;
            AudioController.reproducirMusicaFondo();
            GAME_STATE.juegoActivo = true;
            GAME_STATE.lastFrameTime = performance.now();
            GAME_STATE.tiempoUltimoAullido = performance.now();
            GAME_STATE.tiempoGraciaInicial = 10.0;
            GAME_STATE.loboEstado = 'GRACIA_INICIAL';

            setTimeout(() => { GAME_STATE.introCompletada = true; GAME_STATE.lastFrameTime = performance.now(); }, 1200);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') { initLoader(); }
        else { window.addEventListener('DOMContentLoaded', initLoader); }
    </script>
