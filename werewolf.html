<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Werewolf Escape Simulator v7.0 Full Game Experience</title>
    
    <!-- Librerías estables de A-Frame y Extras de Animación -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/idea-space/aframe-particle-system-component@v1.1.3/dist/aframe-particle-system-component.min.js"></script>
    
    <style>
        :root {
            --ui-red: #ef4444;
            --ui-green: #00ffaa;
            --ui-blue: #38bdf8;
            --bg-dark: #05050a;
            --pane-bg: rgba(10, 15, 30, 0.85);
        }

        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-dark); user-select: none; 
            -webkit-user-select: none; color: #fff;
        }

        /* --- Pantalla de Carga de Videojuego --- */
        #custom-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); z-index: 99999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.8s ease, visibility 0.8s ease; 
        }
        #custom-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .spinner-container { position: relative; width: 80px; height: 80px; margin-bottom: 25px; }
        .spinner { 
            width: 100%; height: 100%; border: 4px solid rgba(239, 68, 68, 0.1); 
            border-top-color: var(--ui-red); border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        .spinner-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: var(--ui-red); animation: pulse 2s infinite; }

        .loader-text-group { text-align: center; }
        .loader-title { color: var(--ui-red); font-size: 18px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
        .loader-msg { color: #94a3b8; font-size: 12px; max-width: 300px; margin: 0 auto; }
        .load-progress { width: 200px; height: 3px; background: rgba(255,255,255,0.1); margin: 15px auto; border-radius: 2px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--ui-red); transition: width 0.2s ease; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- UI Superior --- */
        #ui-top-bar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; z-index: 1000; pointer-events: none; gap: 8px; }
        .ui-row { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; pointer-events: auto; }
        
        .ui-btn { 
            background: var(--pane-bg); border: 1px solid rgba(255,255,255,0.15); 
            color: #fff; border-radius: 8px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }
        .ui-btn:active { transform: scale(0.95); background: rgba(15, 23, 42, 0.9); }

        #btn-reset { width: 44px; height: 44px; font-size: 18px; border-color: var(--ui-blue); color: var(--ui-blue); border-radius: 50%; }
        #alert-ui { 
            flex-grow: 1; text-align: center; background: var(--pane-bg); 
            border: 1px solid var(--ui-red); color: #fca5a5; padding: 12px; border-radius: 8px; 
            font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
        }

        #btn-sprint { padding: 0 20px; height: 44px; font-size: 11px; font-weight: bold; border-color: var(--ui-red); text-transform: uppercase; border-radius: 8px;}
        #btn-sprint.active { background: var(--ui-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
        #btn-sprint.cooldown { border-color: #475569; color: #475569; cursor: not-allowed; }

        #stamina-container { width: 100%; max-width: 320px; height: 5px; background: rgba(0,0,0,0.4); border-radius: 3px; overflow: hidden; pointer-events: none; }
        #stamina-bar { width: 100%; height: 100%; background: var(--ui-green); }

        /* --- Capas de efectos de pantalla --- */
        #damage-vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,0,0,0) 40%, rgba(180,0,0,0.5) 100%); z-index: 9998; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        #damage-vignette.active { opacity: 1; }
        #fade-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9990; opacity: 0; pointer-events: none; transition: opacity 0.5s; }

        /* --- Controles de Pantalla --- */
        .control-wrapper { position: absolute; z-index: 999; pointer-events: auto; }
        #joystick-wrapper { bottom: 30px; right: 30px; width: 100px; height: 100px; }
        #joystick-container { width: 100%; height: 100%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; touch-action: none; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: var(--ui-red); border-radius: 50%; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); touch-action: none; }

        #arrows-wrapper { bottom: 30px; left: 30px; display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 4px; }
        .joy-arrow { background: var(--pane-bg); border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .arrow-up { grid-row: 1; grid-column: 2; }
        .arrow-down { grid-row: 3; grid-column: 2; }
        .arrow-left { grid-row: 2; grid-column: 1; }
        .arrow-right { grid-row: 2; grid-column: 3; }
        
        #pc-instruction { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px; font-size: 11px; letter-spacing: 1px; color: #a7f3d0; pointer-events: none; z-index: 1000; text-transform: uppercase; border: 1px solid rgba(0,255,170,0.2); }
    </style>
</head>
<body>

    <!-- Pantalla de Carga Integrada -->
    <div id="custom-loader">
        <div class="spinner-container">
            <div class="spinner"></div>
            <div class="spinner-icon">🐺</div>
        </div>
        <div class="loader-text-group">
            <div class="loader-title">ARK SIMULATOR</div>
            <div class="load-progress"><div id="progress-bar"></div></div>
            <div class="loader-msg" id="loader-status">Iniciando simulación virtual de escape protegida...</div>
        </div>
    </div>

    <div id="damage-vignette"></div>
    <div id="fade-screen"></div>
    <div id="pc-instruction">💻 Controles: WASD | Shift para Sprint | Arrastrar pantalla para mirar</div>

    <!-- UI Superior -->
    <div id="ui-top-bar">
        <div class="ui-row">
            <button id="btn-reset" class="ui-btn">🔄</button>
            <div id="alert-ui">⚠️ NOCHE 1: SOBREVIVE. ¡Corre por tu vida y evade al Hombre Lobo! 🐺</div>
            <button id="btn-sprint" class="ui-btn">SPRINT</button>
        </div>
        <div id="stamina-container">
            <div id="stamina-bar"></div>
        </div>
    </div>

    <!-- Controles en pantalla -->
    <div id="arrows-wrapper" class="control-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
    </div>

    <div id="joystick-wrapper" class="control-wrapper">
        <div id="joystick-container"><div id="joystick-knob"></div></div>
    </div>

    <!-- ESCENA A-FRAME -->
    <a-scene id="escena-principal" 
             fog="type: linear; color: #080812; near: 15; far: 75;" 
             renderer="colorManagement: true; antialias: false; powerPreference: high-performance; precision: medium;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false" 
             loading-screen="enabled: false">
        
        <a-assets>
            <!-- Modelos 3D del repositorio Hugging Face -->
            <a-asset-item id="pueblo-model" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Idle.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-howl-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Howl.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-beast-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Beast.glb" crossorigin="anonymous"></a-asset-item>
            
            <a-asset-item id="luis-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-llama-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-llama.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-run-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-corre.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-atento-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-atento.glb" crossorigin="anonymous"></a-asset-item>

            <!-- Tus 4 Audios Personalizados -->
            <audio id="sonido-limbo" src="audio/limbo.mp3" preload="auto"></audio>
            <audio id="sonido-stalk" src="audio/wolf-stalk.mp3" preload="auto"></audio>
            <audio id="sonido-enojado" src="audio/werewolf-enojado.mp3" preload="auto"></audio>
            <audio id="sonido-aullido" src="audio/werewolf-aullido.mp3" preload="auto"></audio>
        </a-assets>

        <!-- Entidades de Audio del Motor Nativo -->
        <a-entity id="audio-global-limbo" sound="src: #sonido-limbo; loop: true; volume: 0.5; positional: false"></a-entity>
        <a-entity id="audio-local-stalk" sound="src: #sonido-stalk; loop: true; volume: 0; positional: false"></a-entity>
        <a-entity id="audio-local-enojado" sound="src: #sonido-enojado; loop: true; volume: 0; positional: false"></a-entity>
        <a-entity id="audio-global-aullido" sound="src: #sonido-aullido; loop: false; volume: 0.95; positional: false"></a-entity>

        <a-sky color="#05050b"></a-sky>
        
        <!-- Luna Llena -->
        <a-sphere id="luna-visual" position="20 55 -45" radius="4.5" color="#e2ebff" material="shader: flat; fog: false"></a-sphere>
        
        <!-- Efecto de Lluvia -->
        <a-entity particle-system="preset: rain; color: #444; particleCount: 1500; size: 0.4; velocityValue: 0 15 0; opacity: 0.25;"></a-entity>
        
        <!-- Iluminación Exterior -->
        <a-entity id="luz-ambiental" light="type: ambient; intensity: 0.45; color: #2a3550"></a-entity>
        <a-entity id="luz-luna" light="type: directional; intensity: 0.75; color: #9abaff;" position="20 55 -45"></a-entity>
        <a-entity id="luz-relampago" light="type: directional; intensity: 0; color: #ffffff;" position="0 80 0"></a-entity>

        <!-- El Mapa/Entorno Virtual Completo -->
        <a-entity id="entorno" gltf-model="#pueblo-model" position="0 0 0"></a-entity>
        
        <!-- Iluminación de Interior (Cámara baja a 1.20m para realismo de techos) -->
        <a-entity id="luz-interior-cocina" light="type: point; intensity: 1.4; distance: 8; color: #ffbc73;" position="4.5 1.1 -3.2"></a-entity>
        <a-entity id="luz-interior-salon" light="type: point; intensity: 1.0; distance: 10; color: #9bb7f0;" position="-2.0 1.1 -1.5"></a-entity>

        <!-- FOGATA DECORATIVA (SÓLO LUZ Y PROYECCIÓN VISUAL) -->
        <a-entity id="refugio-decorativo" position="17.4 0.05 16.5">
            <a-entity light="type: point; intensity: 3.5; distance: 12; color: #ff5500;" 
                      animation="property: light.intensity; from: 2.7; to: 3.8; dur: 110; dir: alternate; loop: true"></a-entity>
            
            <a-cylinder radius="0.08" height="0.9" color="#4a2e1b" rotation="20 45 30" position="0 0.05 0"></a-cylinder>
            <a-cylinder radius="0.08" height="0.9" color="#3d2516" rotation="25 -45 -20" position="0 0.05 0"></a-cylinder>
            <a-cylinder radius="0.08" height="0.9" color="#5c3a21" rotation="-30 90 10" position="0 0.05 0"></a-cylinder>
            
            <a-cone radius-bottom="0.35" radius-top="0.01" height="0.8" color="#ff6a00" material="shader: flat; transparent: true; opacity: 0.85" position="0 0.35 0"
                    animation="property: scale; from: 1 1 1; to: 1.15 1.3 1.15; dir: alternate; loop: true; dur: 220"></a-cone>
            <a-cone radius-bottom="0.22" radius-top="0.01" height="0.65" color="#ffcc00" material="shader: flat; transparent: true; opacity: 0.95" position="0 0.38 0"
                    animation="property: scale; from: 0.9 1 0.9; to: 1.2 1.4 1.2; dir: alternate; loop: true; dur: 160"></a-cone>
            
            <a-circle radius="0.6" color="#1a1a1a" rotation="-90 0 0" position="0 0.01 0"></a-circle>
        </a-entity>

        <!-- RIG JUGADOR -->
        <a-entity id="player-rig" position="0 0 25">
            <a-entity id="avatar-container" position="0 0 0">
                <a-entity id="luis-mesh-walk" gltf-model="#luis-walk-src" scale="0 0 0" animation-mixer="clip: *; loop: repeat;"></a-entity>
                <a-entity id="luis-mesh-run" gltf-model="#luis-run-src" scale="0 0 0" animation-mixer="clip: *; loop: repeat;"></a-entity>
                <a-entity id="luis-mesh-llama" gltf-model="#luis-llama-src" scale="0 0 0" animation-mixer="clip: *; loop: repeat;"></a-entity>
                <a-entity id="luis-mesh-atento" gltf-model="#luis-atento-src" scale="0.38 0.38 0.38" animation-mixer="clip: *; loop: repeat;"></a-entity>
            </a-entity>

            <a-entity id="camera-yaw" rotation="0 0 0">
                <a-entity id="camera-pitch" rotation="0 0 0">
                    <a-entity id="main-camera" camera="fov: 70; near: 0.1; far: 300;" position="0 1.5 2.2">
                        <a-entity id="flashlight" light="type: spot; intensity: 2.5; distance: 45; angle: 40; penumbra: 0.4; color: #fffee0;" position="0 -0.2 -0.2"></a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- ENEMIGO (HOMBRE LOBO) -->
        <a-entity id="werewolf-rig" position="15 0 -10">
            <a-entity id="ww-mesh-idle" gltf-model="#ww-idle-src" scale="0.8 0.8 0.8" visible="true" animation-mixer="clip: *; loop: repeat;"></a-entity>
            <a-entity id="ww-mesh-howl" gltf-model="#ww-howl-src" scale="0 0 0" visible="false" animation-mixer="clip: *; loop: repeat;"></a-entity>
            <a-entity id="ww-mesh-beast" gltf-model="#ww-beast-src" scale="0 0 0" visible="false" animation-mixer="clip: *; loop: repeat;"></a-entity>
            <a-entity light="type: point; intensity: 1.2; distance: 3; color: #ff0000;" position="0 1.8 0.4"></a-entity>
        </a-entity>

    </a-scene>

    <script>
        // --- ESCUDO ANTI-COPIA: SISTEMA DE BLOQUEO DE CLIC DERECHO ---
        window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);

        const CONFIG = {
            velCaminar: 0.06,
            velCorrer: 0.13,
            suavizadoGiroAvatar: 0.25,
            staminaMax: 200,
            staminaGasto: 0.22,
            staminaRecuperacion: 0.4,
            wwVelAcecho: 0.022,
            wwVelAtaque: 0.055,
            distDeteccionLobo: 30,
            distAtaqueLobo: 14,
            distMeleeLobo: 2.3
        };

        const GAME_STATE = {
            assetsCargados: 0, totalAssets: 0, escenaIniciada: false, juegoActivo: false,
            pos: new THREE.Vector3(0, 0, 25), salud: 100, stamina: 200,
            modoCorrerActive: false, enCooldownSprint: false, inputMoviendo: false, isDead: false,
            loboPos: new THREE.Vector3(15, 0, -10), loboEstado: 'idle', lastFrameTime: 0,
            esInterior: false, audioStalkPlaying: false, audioEnojadoPlaying: false,
            frameTicks: 0, cachedAlturaSuelo: 0
        };

        const UI = {
            loader: document.getElementById('custom-loader'), bar: document.getElementById('progress-bar'), status: document.getElementById('loader-status'),
            fade: document.getElementById('fade-screen'), alert: document.getElementById('alert-ui'), btnReset: document.getElementById('btn-reset'),
            btnSprint: document.getElementById('btn-sprint'), staminaBar: document.getElementById('stamina-bar'), damage: document.getElementById('damage-vignette')
        };

        const ENT = {
            scene: document.getElementById('escena-principal'), luzRelampago: document.getElementById('luz-relampago'),
            rig: document.getElementById('player-rig'), avatar: document.getElementById('avatar-container'), entorno: document.getElementById('entorno'),
            camYaw: document.getElementById('camera-yaw'), camPitch: document.getElementById('camera-pitch'),
            meshes: { walk: document.getElementById('luis-mesh-walk'), run: document.getElementById('luis-mesh-run'), llama: document.getElementById('luis-mesh-llama'), atento: document.getElementById('luis-mesh-atento'), activeName: 'atento' },
            wwRig: document.getElementById('werewolf-rig'),
            wwMeshes: { idle: document.getElementById('ww-mesh-idle'), howl: document.getElementById('ww-mesh-howl'), beast: document.getElementById('ww-mesh-beast'), activeName: 'idle' }
        };

        const INPUT = {
            keys: { w: false, a: false, s: false, d: false },
            joyMove: { x: 0, y: 0 },
            camYaw: 0, camPitch: 0,
            isDraggingCam: false, lastMouseX: 0, lastMouseY: 0
        };

        function initLoader() {
            const assets = document.querySelectorAll('a-asset-item, audio');
            GAME_STATE.totalAssets = assets.length;
            if (GAME_STATE.totalAssets === 0) { showStartButton(); return; }
            assets.forEach(asset => {
                asset.addEventListener('loaded', onAssetLoaded);
                asset.addEventListener('error', onAssetLoaded);
            });
            setTimeout(() => { if (!GAME_STATE.escenaIniciada) showStartButton(); }, 8000);
        }

        function onAssetLoaded() {
            GAME_STATE.assetsCargados++;
            const percent = Math.floor((GAME_STATE.assetsCargados / GAME_STATE.totalAssets) * 100);
            UI.bar.style.width = percent + '%';
            if (GAME_STATE.assetsCargados >= GAME_STATE.totalAssets) { setTimeout(showStartButton, 300); }
        }

        function showStartButton() {
            if (GAME_STATE.escenaIniciada) return;
            GAME_STATE.escenaIniciada = true;
            
            // CAMBIO EXCLUSIVO UX: El botón ahora es inmersivo e incita a jugar de inmediato
            UI.status.innerHTML = `<button id="btn-play-engine" style="background: var(--ui-red); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 13px; letter-spacing: 2px; margin-top: 15px; box-shadow: 0 0 20px rgba(239,68,68,0.5); text-transform: uppercase;">¡CORRER POR TU VIDA! (INICIAR JUEGO)</button>`;
            
            document.getElementById('btn-play-engine').addEventListener('click', () => {
                UI.loader.classList.add('hidden');
                
                if(document.getElementById('audio-global-limbo').components.sound) {
                    document.getElementById('audio-global-limbo').components.sound.playSound();
                }

                setInterval(() => {
                    if (GAME_STATE.juegoActivo && !GAME_STATE.isDead) {
                        const sAullido = document.getElementById('audio-global-aullido').components.sound;
                        if(sAullido) sAullido.playSound();
                    }
                }, 60000);

                initControls();
                GAME_STATE.juegoActivo = true;
                GAME_STATE.lastFrameTime = performance.now();
                requestAnimationFrame(engineLoop);
                setInterval(triggerThunder, 11000);
            });
        }

        function initControls() {
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'arrowup') INPUT.keys.w = true;
                if(k === 's' || k === 'arrowdown') INPUT.keys.s = true;
                if(k === 'a' || k === 'arrowleft') INPUT.keys.a = true;
                if(k === 'd' || k === 'arrowright') INPUT.keys.d = true;
                if(e.key === 'Shift') { e.preventDefault(); toggleSprint(!GAME_STATE.modoCorrerActive); }
            });
            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'arrowup') INPUT.keys.w = false;
                if(k === 's' || k === 'arrowdown') INPUT.keys.s = false;
                if(k === 'a' || k === 'arrowleft') INPUT.keys.a = false;
                if(k === 'd' || k === 'arrowright') INPUT.keys.d = false;
            });

            window.addEventListener('pointerdown', e => {
                if (e.target.closest('.ui-btn') || e.target.closest('.control-wrapper') || e.target.closest('#alert-ui')) return;
                INPUT.isDraggingCam = true;
                INPUT.lastMouseX = e.clientX; INPUT.lastMouseY = e.clientY;
            });
            window.addEventListener('pointermove', e => {
                if (!INPUT.isDraggingCam) return;
                let dx = e.clientX - INPUT.lastMouseX; let dy = e.clientY - INPUT.lastMouseY;
                INPUT.camYaw -= dx * 0.0035; INPUT.camPitch -= dy * 0.0035;
                INPUT.camPitch = Math.max(-0.4, Math.min(0.4, INPUT.camPitch));
                INPUT.lastMouseX = e.clientX; INPUT.lastMouseY = e.clientY;
            });
            window.addEventListener('pointerup', () => INPUT.isDraggingCam = false);

            UI.btnReset.addEventListener('click', resetGame);
            UI.btnSprint.addEventListener('click', () => { if (!GAME_STATE.enCooldownSprint) toggleSprint(!GAME_STATE.modoCorrerActive); });

            const knob = document.getElementById('joystick-knob');
            const container = document.getElementById('joystick-container');
            let joyActive = false; let jStartX = 0, jStartY = 0;

            const handleJoyStart = (e) => { joyActive = true; const rect = container.getBoundingClientRect(); jStartX = rect.left + rect.width / 2; jStartY = rect.top + rect.height / 2; };
            const handleJoyMove = (e) => {
                if (!joyActive) return;
                let dx = e.clientX - jStartX; let dy = e.clientY - jStartY;
                const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                INPUT.joyMove.x = dx / maxLen; INPUT.joyMove.y = dy / maxLen;
            };
            const handleJoyEnd = () => { joyActive = false; knob.style.transform = 'translate(0px,0px)'; INPUT.joyMove.x = 0; INPUT.joyMove.y = 0; };

            knob.addEventListener('pointerdown', handleJoyStart);
            window.addEventListener('pointermove', e => { if(joyActive) handleJoyMove(e); });
            window.addEventListener('pointerup', handleJoyEnd);

            const bindArrow = (id, k, val) => {
                const btn = document.getElementById(id);
                btn.addEventListener('pointerdown', () => INPUT.keys[k] = val);
                btn.addEventListener('pointerup', () => INPUT.keys[k] = !val);
            };
            bindArrow('btn-up','w', true); bindArrow('btn-down','s', true);
            bindArrow('btn-left','a', true); bindArrow('btn-right','d', true);
        }

        function toggleSprint(active) {
            if (active && GAME_STATE.stamina > 20 && !GAME_STATE.enCooldownSprint) {
                GAME_STATE.modoCorrerActive = true; UI.btnSprint.classList.add('active');
            } else {
                GAME_STATE.modoCorrerActive = false; UI.btnSprint.classList.remove('active');
            }
        }

        function switchMesh(target) {
            if (GAME_STATE.esInterior) {
                ENT.meshes[ENT.meshes.activeName].setAttribute('scale', '0 0 0');
                ENT.meshes.activeName = target;
                return;
            }
            if (ENT.meshes.activeName === target) return;
            ENT.meshes[ENT.meshes.activeName].setAttribute('scale', '0 0 0');
            ENT.meshes[target].setAttribute('scale', '0.38 0.38 0.38');
            ENT.meshes.activeName = target;
        }

        function switchWwMesh(target) {
            if (ENT.wwMeshes.activeName === target) return;
            ENT.wwMeshes[ENT.wwMeshes.activeName].setAttribute('scale', '0 0 0');
            ENT.wwMeshes[ENT.wwMeshes.activeName].setAttribute('visible', 'false');
            ENT.wwMeshes[target].setAttribute('scale', '0.8 0.8 0.8');
            ENT.wwMeshes[target].setAttribute('visible', 'true');
            ENT.wwMeshes.activeName = target;
        }

        function engineLoop(time) {
            const dt = (time - GAME_STATE.lastFrameTime) / 1000;
            GAME_STATE.lastFrameTime = time;

            if (!GAME_STATE.juegoActivo) { requestAnimationFrame(engineLoop); return; }

            if (ENT.rig.object3D) {
                GAME_STATE.frameTicks++;
                const ejecutarRaycastPesado = (GAME_STATE.frameTicks % 6 === 0);

                // --- PROCESAMIENTO ACTIVO DEL JUGADOR SI NO ESTÁ MUERTO ---
                if (!GAME_STATE.isDead) {
                    ENT.camYaw.object3D.rotation.y = INPUT.camYaw;
                    ENT.camPitch.object3D.rotation.x = INPUT.camPitch;

                    let mx = 0; let mz = 0;
                    if (INPUT.keys.w) mz = -1; if (INPUT.keys.s) mz = 1;
                    if (INPUT.keys.a) mx = -1; if (INPUT.keys.d) mx = 1;
                    if (Math.abs(INPUT.joyMove.x) > 0.1 || Math.abs(INPUT.joyMove.y) > 0.1) { mx = INPUT.joyMove.x; mz = INPUT.joyMove.y; }

                    GAME_STATE.inputMoviendo = (Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05);

                    if (GAME_STATE.inputMoviendo) {
                        let speed = GAME_STATE.modoCorrerActive ? CONFIG.velCorrer : CONFIG.velCaminar;
                        let angle = INPUT.camYaw;
                        
                        let dx = mx * Math.cos(angle) + mz * Math.sin(angle);
                        let dz = mz * Math.cos(angle) - mx * Math.sin(angle);

                        GAME_STATE.pos.x += dx * speed;
                        GAME_STATE.pos.z += dz * speed;

                        // RASTREADOR DE SUELO OPTIMIZADO CON FILTRADO DE ÁRBOLES
                        if (ejecutarRaycastPesado && ENT.entorno && ENT.entorno.getObject3D('mesh')) {
                            const rayoCaida = new THREE.Raycaster(
                                new THREE.Vector3(GAME_STATE.pos.x, GAME_STATE.pos.y + 1.2, GAME_STATE.pos.z),
                                new THREE.Vector3(0, -1, 0)
                            );
                            const colisionesSuelo = rayoCaida.intersectObject(ENT.entorno.getObject3D('mesh'), true);
                            
                            if (colisionesSuelo.length > 0) {
                                let mejorImpacto = null;
                                let menorDiferencia = Infinity;
                                
                                for (let i = 0; i < colisionesSuelo.length; i++) {
                                    let obj = colisionesSuelo[i].object;
                                    let nombreMesh = obj.name ? obj.name.toLowerCase() : "";
                                    
                                    if (nombreMesh.includes('tree') || nombreMesh.includes('arbol') || 
                                        nombreMesh.includes('leaf') || nombreMesh.includes('hoja') || 
                                        nombreMesh.includes('branch') || nombreMesh.includes('rama') || 
                                        nombreMesh.includes('trunk') || nombreMesh.includes('foliage') || 
                                        nombreMesh.includes('wood')) {
                                        continue; 
                                    }
                                    
                                    let difActual = Math.abs(colisionesSuelo[i].point.y - GAME_STATE.pos.y);
                                    if (difActual < menorDiferencia) {
                                        menorDiferencia = difActual;
                                        mejorImpacto = colisionesSuelo[i];
                                    }
                                }
                                
                                if (mejorImpacto && menorDiferencia < 0.55) {
                                    GAME_STATE.cachedAlturaSuelo = mejorImpacto.point.y;
                                }
                            }
                        }
                        
                        GAME_STATE.pos.y = GAME_STATE.cachedAlturaSuelo;
                        ENT.rig.object3D.position.set(GAME_STATE.pos.x, GAME_STATE.pos.y, GAME_STATE.pos.z);

                        let targetAngle = Math.atan2(dx, dz);
                        let diff = targetAngle - ENT.avatar.object3D.rotation.y;
                        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                        ENT.avatar.object3D.rotation.y += diff * CONFIG.suavizadoGiroAvatar;

                        switchMesh(GAME_STATE.modoCorrerActive ? 'run' : 'walk');
                    } else {
                        switchMesh('atento');
                    }

                    // Stamina
                    if (GAME_STATE.modoCorrerActive && GAME_STATE.inputMoviendo) {
                        GAME_STATE.stamina = Math.max(0, GAME_STATE.stamina - CONFIG.staminaGasto);
                        if (GAME_STATE.stamina <= 0) {
                            toggleSprint(false); GAME_STATE.enCooldownSprint = true;
                            UI.btnSprint.classList.add('cooldown');
                        }
                    } else {
                        GAME_STATE.stamina = Math.min(CONFIG.staminaMax, GAME_STATE.stamina + CONFIG.staminaRecuperacion);
                        if (GAME_STATE.stamina >= 50 && GAME_STATE.enCooldownSprint) {
                            GAME_STATE.enCooldownSprint = false; UI.btnSprint.classList.remove('cooldown');
                        }
                    }
                    UI.staminaBar.style.width = ((GAME_STATE.stamina / CONFIG.staminaMax) * 100) + '%';
                } else {
                    // Si murió, detener inmediatamente movimiento residual para evitar congelamientos mecánicos
                    GAME_STATE.inputMoviendo = false;
                    switchMesh('atento');
                }

                // RASTREADOR DE TECHO OPTIMIZADO (Sigue procesando para estabilizar cámara)
                if (ejecutarRaycastPesado && ENT.entorno && ENT.entorno.getObject3D('mesh')) {
                    const rayoTecho = new THREE.Raycaster(
                        new THREE.Vector3(GAME_STATE.pos.x, GAME_STATE.pos.y + 0.2, GAME_STATE.pos.z),
                        new THREE.Vector3(0, 1, 0)
                    );
                    const colisionesTecho = rayoTecho.intersectObject(ENT.entorno.getObject3D('mesh'), true);
                    GAME_STATE.esInterior = (colisionesTecho.length > 0 && colisionesTecho[0].distance < 3.5);
                }

                const camaraElemento = document.getElementById('main-camera');
                if (GAME_STATE.esInterior) {
                    camaraElemento.setAttribute('position', '0 1.20 0');
                    if (!GAME_STATE.isDead) ENT.meshes[ENT.meshes.activeName].setAttribute('scale', '0 0 0');
                } else {
                    camaraElemento.setAttribute('position', '0 1.5 2.2');
                }

                // --- IA DEL LOBO INDEPENDIENTE (EVITA CONGELAR LA ESCENA) ---
                let loboPos = ENT.wwRig.object3D.position;
                let dist = GAME_STATE.pos.distanceTo(loboPos);
                
                const soundStalk = document.getElementById('audio-local-stalk').components.sound;
                const soundEnojado = document.getElementById('audio-local-enojado').components.sound;

                if (!GAME_STATE.isDead) {
                    if (dist < CONFIG.distDeteccionLobo && dist > CONFIG.distMeleeLobo) {
                        switchWwMesh('beast');
                        
                        let dir = new THREE.Vector3().subVectors(GAME_STATE.pos, loboPos);
                        dir.y = 0; 
                        dir.normalize();
                        
                        let vLobo = dist < CONFIG.distAtaqueLobo ? CONFIG.wwVelAtaque : CONFIG.wwVelAcecho;
                        
                        loboPos.x += dir.x * vLobo; 
                        loboPos.z += dir.z * vLobo;
                        ENT.wwRig.object3D.rotation.y = Math.atan2(dir.x, dir.z);

                        if (dist < CONFIG.distAtaqueLobo) {
                            GAME_STATE.loboEstado = 'ataque'; UI.damage.classList.add('active');
                            
                            if (!GAME_STATE.audioEnojadoPlaying && soundEnojado) {
                                soundEnojado.playSound(); GAME_STATE.audioEnojadoPlaying = true;
                            }
                            if(soundEnojado) soundEnojado.setVolume(1.0);
                            if(soundStalk) soundStalk.setVolume(0.15);
                        } else {
                            GAME_STATE.loboEstado = 'acecho'; UI.damage.classList.remove('active');
                            
                            if (!GAME_STATE.audioStalkPlaying && soundStalk) {
                                soundStalk.playSound(); GAME_STATE.audioStalkPlaying = true;
                            }
                            if (GAME_STATE.audioEnojadoPlaying && soundEnojado) {
                                soundEnojado.stopSound(); GAME_STATE.audioEnojadoPlaying = false;
                            }
                            let volMix = 1 - ((dist - CONFIG.distAtaqueLobo) / (CONFIG.distDeteccionLobo - CONFIG.distAtaqueLobo));
                            if(soundStalk) soundStalk.setVolume(Math.max(0, volMix));
                        }
                    } else if (dist <= CONFIG.distMeleeLobo) {
                        if (GAME_STATE.loboEstado !== 'melee') {
                            GAME_STATE.loboEstado = 'melee'; 
                            switchWwMesh('howl'); 
                            ejecutarDaño();
                        }
                    } else {
                        switchWwMesh('idle'); GAME_STATE.loboEstado = 'idle'; UI.damage.classList.remove('active');
                        if (GAME_STATE.audioStalkPlaying && soundStalk) { soundStalk.stopSound(); GAME_STATE.audioStalkPlaying = false; }
                        if (GAME_STATE.audioEnojadoPlaying && soundEnojado) { soundEnojado.stopSound(); GAME_STATE.audioEnojadoPlaying = false; }
                    }
                } else {
                    // SI EL JUGADOR MUERE, EL LOBO NO SE DETIENE: Celebra su victoria aullando de forma fluida
                    switchWwMesh('howl');
                    UI.damage.classList.remove('active');
                }
            }
            requestAnimationFrame(engineLoop);
        }

        // --- SISTEMA CORREGIDO DE DAÑO Y EMPUJE (ANTI-CONGELACIÓN) ---
        function ejecutarDaño() {
            if (GAME_STATE.isDead) return;
            GAME_STATE.salud -= 25;
            UI.alert.textContent = `🚨 ¡TE HA ALCANZADO! SALUD: ${GAME_STATE.salud}% 🚨`;
            
            let loboPos = ENT.wwRig.object3D.position;
            let dirKnockback = new THREE.Vector3().subVectors(GAME_STATE.pos, loboPos);
            dirKnockback.y = 0;
            
            // ESCUDO DE VECTORES NULOS: Si estás exactamente superpuesto al lobo, te expulsa hacia atrás en Z por defecto
            if (dirKnockback.lengthSq() < 0.001) {
                dirKnockback.set(0, 0, 1);
            } else {
                dirKnockback.normalize();
            }
            
            // Empuje de colisión limpio de 3.5 metros
            GAME_STATE.pos.addScaledVector(dirKnockback, 3.5);
            ENT.rig.object3D.position.set(GAME_STATE.pos.x, GAME_STATE.pos.y, GAME_STATE.pos.z);
            
            toggleSprint(false);

            if (GAME_STATE.salud <= 0) {
                GAME_STATE.isDead = true; 
                UI.alert.textContent = "💥 SIMULACIÓN FALLIDA. REINICIANDO... 💥";
                UI.fade.style.opacity = "1"; 
                setTimeout(resetGame, 2500); // El entorno sigue vivo 2.5 segundos antes de reiniciar de golpe
            } else {
                setTimeout(() => { if (GAME_STATE.loboEstado === 'melee') GAME_STATE.loboEstado = 'idle'; }, 800);
            }
        }

        function triggerThunder() {
            if (GAME_STATE.isDead || !GAME_STATE.juegoActivo) return;
            const luz = ENT.luzRelampago.object3D.element;
            if(luz) {
                luz.setAttribute('light', 'intensity', '2.0');
                setTimeout(() => {
                    luz.setAttribute('light', 'intensity', '0');
                    setTimeout(() => {
                        luz.setAttribute('light', 'intensity', '1.5');
                        setTimeout(() => luz.setAttribute('light', 'intensity', '0'), 80);
                    }, 60);
                }, 100);
            }
        }

        function resetGame() {
            GAME_STATE.salud = 100; GAME_STATE.stamina = CONFIG.staminaMax; GAME_STATE.isDead = false; GAME_STATE.loboEstado = 'idle';
            GAME_STATE.modoCorrerActive = false; GAME_STATE.enCooldownSprint = false; GAME_STATE.esInterior = false;
            GAME_STATE.audioStalkPlaying = false; GAME_STATE.audioEnojadoPlaying = false;
            GAME_STATE.pos.set(0, 0, 25); GAME_STATE.cachedAlturaSuelo = 0;
            ENT.rig.object3D.position.set(0, 0, 25);
            ENT.wwRig.object3D.position.set(15, 0, -10);
            INPUT.camYaw = 0; INPUT.camPitch = 0;
            UI.btnSprint.classList.remove('active', 'cooldown');
            UI.alert.textContent = "⚠️ NOCHE 1: SOBREVIVE. ¡Corre por tu vida y evade al Hombre Lobo! 🐺";
            UI.alert.style.borderColor = "var(--ui-red)"; UI.alert.style.color = "#fca5a5";
            UI.fade.style.opacity = "0"; UI.damage.classList.remove('active');
            
            try {
                document.getElementById('audio-local-stalk').components.sound.stopSound();
                document.getElementById('audio-local-enojado').components.sound.stopSound();
            } catch(e){}

            Object.keys(ENT.meshes).forEach(k => { if(k !== 'activeName') ENT.meshes[k].setAttribute('scale', '0 0 0'); });
            
            ENT.wwMeshes.idle.setAttribute('scale', '0.8 0.8 0.8');
            ENT.wwMeshes.idle.setAttribute('visible', 'true');
            ENT.wwMeshes.howl.setAttribute('scale', '0 0 0');
            ENT.wwMeshes.howl.setAttribute('visible', 'false');
            ENT.wwMeshes.beast.setAttribute('scale', '0 0 0');
            ENT.wwMeshes.beast.setAttribute('visible', 'false');
            ENT.wwMeshes.activeName = 'idle';

            if (!GAME_STATE.esInterior) {
                ENT.meshes.atento.setAttribute('scale', '0.38 0.38 0.38');
            }
            ENT.meshes.activeName = 'atento';
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') { initLoader(); }
        else { window.addEventListener('DOMContentLoaded', initLoader); }
    </script>
