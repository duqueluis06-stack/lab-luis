    <script>
        AFRAME.registerComponent('fix-animacion', {
            schema: {
                clip: { type: 'string', default: '*' },
                loop: { type: 'string', default: 'repeat' },
                timeScale: { type: 'number', default: 1 }
            },
            init: function () {
                const el = this.el;
                const data = this.data;

                const activarMixer = () => {
                    el.setAttribute('animation-mixer', {
                        clip: data.clip,
                        loop: data.loop,
                        timeScale: data.timeScale,
                        crossFadeDuration: 0.2
                    });
                };

                if (el.getObject3D('mesh')) {
                    activarMixer();
                } else {
                    el.addEventListener('model-loaded', activarMixer);
                }
            }
        });
    </script>

    <style>
        :root {
            --ui-red: #ff2a2a;
            --ui-green: #00ffaa;
            --ui-blue: #38bdf8;
            --bg-dark: #04040a;
            --pane-bg: rgba(6, 10, 20, 0.9);
        }

        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-dark); user-select: none; 
            -webkit-user-select: none; color: #fff;
        }

        #custom-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('were.jpg') no-repeat center center / cover; 
            z-index: 99999; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            box-shadow: inset 0 0 120px #ff0000;
            padding: 40px 20px;
            box-sizing: border-box;
            transition: opacity 0.8s ease, visibility 0.8s ease; 
        }
        #custom-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .overlay-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, rgba(4, 4, 10, 0.85) 90%);
            pointer-events: none; z-index: 1;
        }

        .loader-top-container { z-index: 2; text-align: center; margin-top: 20px; }
        .spinner-container { position: relative; width: 70px; height: 70px; margin: 0 auto 15px auto; }
        .spinner { 
            width: 100%; height: 100%; border: 4px solid rgba(255, 42, 42, 0.2); 
            border-top-color: var(--ui-red); border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        .spinner-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: var(--ui-red); }

        .loader-text-group { text-align: center; }
        .loader-title { 
            color: #ffffff; font-size: 28px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px; 
            text-shadow: 0 0 5px #ff0033, 0 0 10px #ff0033, 0 0 20px #ff0000, 0 0 40px #ff0000;
            animation: neon-pulse 1.5s infinite alternate;
        }
        .load-progress { width: 220px; height: 4px; background: rgba(255,255,255,0.15); margin: 15px auto; border-radius: 2px; overflow: hidden; box-shadow: 0 0 8px rgba(255, 0, 0, 0.5); }
        #progress-bar { width: 0%; height: 100%; background: var(--ui-red); transition: width 0.2s ease; }

        .author-tag {
            z-index: 2; color: #ffffff; font-family: monospace; font-size: 1.3rem; font-weight: bold;
            letter-spacing: 2px; text-shadow: 0 0 4px #ff0000, 0 0 12px #ff0000, 0 0 25px #ff0000;

        @keyframes neon-pulse {
            0% { opacity: 0.9; text-shadow: 0 0 5px #ff0033, 0 0 10px #ff0033, 0 0 20px #ff0000; }
            100% { opacity: 1; text-shadow: 0 0 8px #ff0033, 0 0 15px #ff0033, 0 0 30px #ff0000, 0 0 60px #ff0000; }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #ui-top-bar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; z-index: 1000; pointer-events: none; gap: 8px; }
        .ui-row { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; pointer-events: auto; }

            color: #fff; border-radius: 8px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);

        .control-wrapper { position: absolute; z-index: 999; pointer-events: auto; }
        #joystick-wrapper { bottom: 30px; right: 30px; width: 100px; height: 100px; }
        #joystick-container { width: 100%; height: 100%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: relative; touch-action: none; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: var(--ui-red); border-radius: 50%; box-shadow: 0 0 12px rgba(255, 42, 42, 0.5); touch-action: none; }

        #telemetry-hud {

            border: 1px solid var(--ui-green);

            z-index: 10000; 
            pointer-events: none; 
            text-align: center; 
            letter-spacing: 1px;
            white-space: nowrap;
        }

        @keyframes bloodPulse { from { opacity: 0.4; } to { opacity: 0.9; } }
        @keyframes screenShake { 0% { transform: translate(3px, 3px) rotate(0deg); } 50% { transform: translate(-3px, -2px) rotate(1deg); } 100% { transform: translate(2px, -3px) rotate(-1deg); } }
    </style>
</head>

    <script>
        window.addEventListener('contextmenu', e => e.preventDefault(), false);

        let ZONAS_REFUGIO = [];
        let PUNTOS_MERODEO_CASA = [
            new THREE.Vector3(0, 0, 6.0),    
            new THREE.Vector3(-8.0, 0, -2),  
            new THREE.Vector3(8.0, 0, -2),   
            new THREE.Vector3(0, 0, -9.5)    
        ];

        const V_POOL = {
            dirALugar: new THREE.Vector3(),
            dirAlBosque: new THREE.Vector3(),
            dirHaciaTi: new THREE.Vector3(),
            rayOrigin: new THREE.Vector3(),
            rayDir: new THREE.Vector3(0, -1, 0),
            dirAvance: new THREE.Vector3()
        };
        const RAYCASTER_REUTILIZABLE = new THREE.Raycaster();
        
        let sueloMeshCache = []; 
        let colisionBarrioCache = [];

        const Pistas = {
            limbo: new Audio("audio/limbo.mp3"),
            enojado: new Audio("audio/werewolf-enojado.mp3"),
            stalk: new Audio("audio/wolf-stalk.mp3"),
            aullido: new Audio("audio/werewolf-aullido.mp3")
        };

        Pistas.limbo.loop = true;
        Pistas.limbo.customVol = 0.45;
        Pistas.stalk.loop = true;
        Pistas.stalk.customVol = 0.0;
        Pistas.enojado.loop = true;
        Pistas.enojado.customVol = 0.0;
        Pistas.aullido.customVol = 0.95;

        let audioCtx = null;
        const PistasGains = {};

        const AudioController = {
            async reproducirMusicaFondo() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        Object.keys(Pistas).forEach(key => {
                            const source = audioCtx.createMediaElementSource(Pistas[key]);
                            const gainNode = audioCtx.createGain();
                            source.connect(gainNode);
                            gainNode.connect(audioCtx.destination);
                            PistasGains[key] = gainNode;
                            
                            Pistas[key].volume = 1.0; 
                            gainNode.gain.setValueAtTime(Pistas[key].customVol, audioCtx.currentTime);
                        });
                    }
                    if (audioCtx && audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }

                    for (let key of Object.keys(Pistas)) {
                        try {
                            await Pistas[key].play();
                            if (key !== 'limbo' && key !== 'stalk' && key !== 'enojado') {
                                Pistas[key].pause();
                                Pistas[key].currentTime = 0;
                            }
                        } catch(e) { console.log("Canal diferido: " + key); }
                    }

                    Object.keys(Pistas).forEach(key => {
                        if (PistasGains[key]) {
                            let volOriginal = (key === 'limbo') ? 0.45 : ((key === 'aullido') ? 0.95 : 0.0);
                            Pistas[key].customVol = volOriginal;
                            PistasGains[key].gain.setValueAtTime(volOriginal, audioCtx.currentTime);
                        }
                    });

                } catch(err) { console.warn("Audio Engine Err:", err); }
            },
            actualizarProximidad(estado, distancia) {
                if (estado === 'GRACIA_INICIAL' || estado === 'BOSQUE' || distancia > 35 || GAME_STATE.esInterior) {
                    this.fadeTo('enojado', 0.0);
                    this.fadeTo('stalk', 0.0);
                    return;
                }
                
                if (estado === 'MERODEANDO_CASA') {
                    this.fadeTo('stalk', 0.35);
                    this.fadeTo('enojado', 0.10);
                    return;
                }

                if (estado === 'FORCEJEO' || estado === 'ATAQUE') {
                    this.fadeTo('enojado', 0.95);
                    this.fadeTo('stalk', 0.90);
                } else if (estado === 'ACECHO') {
                    if (distancia < 30) {
                        let factorStalk = Math.max(0, Math.min(0.85, (30 - distancia) / 18));
                        this.fadeTo('stalk', factorStalk);
                        
                        if (distancia < 15) {
                            let factorEnojado = Math.max(0, Math.min(0.65, (15 - distancia) / 10));
                            this.fadeTo('enojado', factorEnojado);
                        } else {
                            this.fadeTo('enojado', 0.0);
                        }
                    } else {
                        this.fadeTo('enojado', 0.0);
                        this.fadeTo('stalk', 0.0);
                    }
                }
            },
            fadeTo(key, targetVolume) {
                const audio = Pistas[key];
                const gainNode = PistasGains[key];
                if (!audio || !gainNode) return;

                let diff = targetVolume - audio.customVol;
                if (Math.abs(diff) > 0.01) {
                    audio.customVol += Math.sign(diff) * 0.06;
                    if ((diff > 0 && audio.customVol > targetVolume) || (diff < 0 && audio.customVol < targetVolume)) {
                        audio.customVol = targetVolume;
                    }
                } else {
                    audio.customVol = targetVolume;
                }
                
                try {
                    if (audioCtx) {
                        gainNode.gain.setValueAtTime(audio.customVol, audioCtx.currentTime);
                    }
                } catch(e){}
            },
            dispararAullidoMinuto() {
                try {
                    Pistas.aullido.currentTime = 0;
                    Pistas.aullido.customVol = 0.95;
                    if (PistasGains['aullido'] && audioCtx) {
                        PistasGains['aullido'].gain.setValueAtTime(0.95, audioCtx.currentTime);
                    }
                    Pistas.aullido.play().catch(e => console.log("Aullido postergado:", e));
                } catch(e){}
            },
            detenerTodo() {
                Object.values(Pistas).forEach(p => { try { p.pause(); } catch(e){} });
                try {
                    Object.keys(PistasGains).forEach(k => {
                        if(audioCtx) PistasGains[k].gain.setValueAtTime(0, audioCtx.currentTime);
                    });
                } catch(e){}
            }
        };

        const unlockAudioContext = () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        };
        window.addEventListener('pointerdown', unlockAudioContext);
        window.addEventListener('touchstart', unlockAudioContext);
        window.addEventListener('keydown', unlockAudioContext);

        const CONFIG = {
            velCaminar: 2.1,           
            velCorrer: 4.5,            
            suavizadoGiroAvatar: 0.25,
            staminaMax: 200, 
            staminaGasto: 15.0,        
            staminaRecuperacion: 20.0,  
            wwVelAcecho: 0.85,  
            wwVelAtaque: 2.3,   
            distDeteccionLobo: 85, 
            distAtaqueLobo: 14,
            tiempoForcejeoMax: 2.5     
        };

        const GAME_STATE = {
            assetsCargados: 0, totalAssets: 0, escenaIniciada: false, juegoActivo: false,
            introCompletada: false,
            pos: new THREE.Vector3(0, 0, 25), stamina: 200,
            velY: 0, enElSuelo: true,
            modoCorrerActive: false, enCooldownSprint: false, inputMoviendo: false, isDead: false,
            loboEstado: 'GRACIA_INICIAL', lastFrameTime: 0,
            esInterior: false, refugioActualNombre: '', camPerspectiveState: 'NONE', frameTicks: 0, cachedAlturaSuelo: 0,
            aiTimer: 0, aiPuntoObjetivo: new THREE.Vector3(60, 0, -60), tiempoUltimoAullido: 0,
            tiempoContactoFisico: 0, tiempoGraciaInicial: 10.0
        };

        const UI = {
            loader: document.getElementById('custom-loader'), bar: document.getElementById('progress-bar'),
            loaderAction: document.getElementById('loader-action-area'),
            fade: document.getElementById('fade-screen'), alert: document.getElementById('alert-ui'), 
            btnReset: document.getElementById('btn-reset'), btnExit: document.getElementById('btn-exit'),
            btnSprint: document.getElementById('btn-sprint'), staminaBar: document.getElementById('stamina-bar'), 
            damage: document.getElementById('damage-vignette'), jumpscare: document.getElementById('jumpscare-screen'),
            telemetry: document.getElementById('telemetry-hud')
        };

        const ENT = {
            scene: document.getElementById('escena-principal'), luzRelampago: document.getElementById('luz-relampago'),
            rig: document.getElementById('player-rig'), avatar: document.getElementById('avatar-container'), entorno: document.getElementById('entorno'),
            camYaw: document.getElementById('camera-yaw'), camPitch: document.getElementById('camera-pitch'),
            meshes: { walk: document.getElementById('luis-mesh-walk'), run: document.getElementById('luis-mesh-run'), atento: document.getElementById('luis-mesh-atento') },
            wwRig: document.getElementById('werewolf-rig'),
            wwMeshes: { beast: document.getElementById('ww-mesh-beast') }
        };

        const INPUT = { keys: { w: false, a: false, s: false, d: false }, joyMove: { x: 0, y: 0 }, camYaw: 0, camPitch: 0, isDraggingCam: false, lastMouseX: 0, lastMouseY: 0 };

        function extraerMallasSuelo(objetoRaiz) {
            if (!objetoRaiz) return;
            sueloMeshCache = [];
            colisionBarrioCache = [];

            objetoRaiz.updateMatrixWorld(true);

            objetoRaiz.traverse(child => {
                if (child.isMesh) {
                    colisionBarrioCache.push(child);
                    if (child.geometry) {
                        if (!child.geometry.boundingSphere) child.geometry.computeBoundingSphere();
                        child.userData.worldSphereCenter = child.geometry.boundingSphere.center.clone().applyMatrix4(child.matrixWorld);
                        child.userData.worldRadius = child.geometry.boundingSphere.radius;
                    }
                    sueloMeshCache.push(child);
                }
            });
        }

        function obtenerColisionesCercanas(pos, maxDist = 8) {
            let cercanas = [];
            for (let i = 0; i < colisionBarrioCache.length; i++) {
                let mesh = colisionBarrioCache[i];
                if (mesh.userData && mesh.userData.worldSphereCenter) {
                    let d = pos.distanceTo(mesh.userData.worldSphereCenter);
                    if (d < maxDist + mesh.userData.worldRadius) {
                        cercanas.push(mesh);
                    }
                } else {
                    cercanas.push(mesh);
                }
            }
            return cercanas;
        }

        // UNICAMENTE SE ESCANEA CASA-ARQUITECTO
        function escanearCasasAutomaticas(rootNode) {
            if (!rootNode) return;
            ZONAS_REFUGIO = [];
            
            rootNode.traverse(child => {
                let n = (child.name || "").toLowerCase();
                if (n.includes('casa-arquitecto') || n.includes('casa_arquitecto') || n.includes('arquitecto')) {
                    let caja = new THREE.Box3().setFromObject(child);
                    
                    caja.min.x += 0.5;
                    caja.max.x -= 0.5;
                    caja.min.z += 0.5;
                    caja.max.z -= 0.5;
                    caja.min.y -= 0.1;
                    caja.max.y += 3.5;
                    
                    ZONAS_REFUGIO.push({
                        nombre: 'casa-arquitecto',
                        box: caja
                    });
                }
            });

            if (ZONAS_REFUGIO.length === 0) {
                let defaultBox = new THREE.Box3(
                    new THREE.Vector3(-4.0, -1.0, -4.0),
                    new THREE.Vector3(4.0, 3.5, 4.0)
                );
                ZONAS_REFUGIO.push({ nombre: 'default', box: defaultBox });
            }
        }

        function hayColisionPared(posOriginal, posX, posZ) {
            let dx = posX - posOriginal.x;
            let dz = posZ - posOriginal.z;
            let dist = Math.sqrt(dx * dx + dz * dz);
            if (dist < 0.0001) return false;

            V_POOL.dirAvance.set(dx, 0, dz).normalize();
            let cerca = obtenerColisionesCercanas(posOriginal, 5);
            if (cerca.length === 0) return false;

            V_POOL.rayOrigin.set(posOriginal.x, posOriginal.y + 0.5, posOriginal.z);
            RAYCASTER_REUTILIZABLE.set(V_POOL.rayOrigin, V_POOL.dirAvance);
            RAYCASTER_REUTILIZABLE.far = dist + 0.45;
            if (RAYCASTER_REUTILIZABLE.intersectObjects(cerca, false).length > 0) return true;

            V_POOL.rayOrigin.set(posOriginal.x, posOriginal.y + 1.2, posOriginal.z);
            RAYCASTER_REUTILIZABLE.set(V_POOL.rayOrigin, V_POOL.dirAvance);
            RAYCASTER_REUTILIZABLE.far = dist + 0.45;
            if (RAYCASTER_REUTILIZABLE.intersectObjects(cerca, false).length > 0) return true;

            return false;
        }

        function moverLoboConColision(loboPos, dirVector, velocidad, dt) {
            if (!dirVector || (dirVector.x === 0 && dirVector.z === 0)) return;

            let dx = dirVector.x;
            let dz = dirVector.z;

            let pasoLoboPermitido = true;
            let colisionesCercanas = obtenerColisionesCercanas(loboPos, 8);
            
            if (colisionesCercanas.length > 0) {
                V_POOL.rayOrigin.set(loboPos.x, loboPos.y + 0.9, loboPos.z);
                V_POOL.dirAvance.set(dx, 0, dz).normalize();

                RAYCASTER_REUTILIZABLE.set(V_POOL.rayOrigin, V_POOL.dirAvance);
                RAYCASTER_REUTILIZABLE.far = 1.2; 

                const choquesLobo = RAYCASTER_REUTILIZABLE.intersectObjects(colisionesCercanas, false);
                if (choquesLobo.length > 0) {
                    pasoLoboPermitido = false;
                }
            }

            if (pasoLoboPermitido) {
                loboPos.x += dx * velocidad * dt;
                loboPos.z += dz * velocidad * dt;
            } else {
                loboPos.x += dz * (velocidad * 0.5) * dt;
                loboPos.z -= dx * (velocidad * 0.5) * dt;
            }
        }

        function initLoader() {
            const assets = document.querySelectorAll('a-asset-item');
            GAME_STATE.totalAssets = assets.length;
            if (GAME_STATE.totalAssets === 0) { showStartButton(); return; }
            assets.forEach(asset => {
                asset.addEventListener('loaded', onAssetLoaded);
                asset.addEventListener('error', onAssetLoaded);
            });
            setTimeout(() => { if (!GAME_STATE.escenaIniciada) showStartButton(); }, 5000);
        }

        function onAssetLoaded() {
            GAME_STATE.assetsCargados++;
            const percent = Math.floor((GAME_STATE.assetsCargados / GAME_STATE.totalAssets) * 100);
            UI.bar.style.width = percent + '%';
            if (GAME_STATE.assetsCargados >= GAME_STATE.totalAssets) { setTimeout(showStartButton, 300); }
        }

        function showStartButton() {
            if (GAME_STATE.escenaIniciada) return;
            GAME_STATE.escenaIniciada = true;
            
            ENT.rig.object3D.position.set(0, 0, 25);
            ENT.wwRig.object3D.position.set(60, 0, -60);
            GAME_STATE.pos.set(0, 0, 25);
            
            if (ENT.entorno) {
                ENT.entorno.addEventListener('model-loaded', () => {
                    let mesh = ENT.entorno.getObject3D('mesh');
                    if (mesh) {
                        extraerMallasSuelo(mesh);
                        escanearCasasAutomaticas(mesh);
                    }
                });
            }
            
            UI.loaderAction.innerHTML = `<button id="btn-play-engine" style="background: var(--ui-red); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 16px 32px; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 14px; letter-spacing: 3px; box-shadow: 0 0 25px rgba(239,42,42,0.8); text-transform: uppercase;">¡ENTRAR AL SUEÑO!</button>`;
            
            document.getElementById('btn-play-engine').addEventListener('click', () => {
                UI.loader.classList.add('hidden');
                AudioController.reproducirMusicaFondo();
                initControls();
                
                if (ENT.scene && ENT.scene.renderer) {
                    ENT.scene.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
                }

                let mesh = ENT.entorno ? ENT.entorno.getObject3D('mesh') : null;
                if(mesh) {
                    extraerMallasSuelo(mesh);
                    escanearCasasAutomaticas(mesh);
                }
                
                GAME_STATE.introCompletada = false; 
                GAME_STATE.juegoActivo = true;
                GAME_STATE.lastFrameTime = performance.now();
                GAME_STATE.tiempoUltimoAullido = performance.now();
                GAME_STATE.tiempoGraciaInicial = 10.0; 
                GAME_STATE.loboEstado = 'GRACIA_INICIAL';
                
                setTimeout(() => {
                    GAME_STATE.introCompletada = true;
                    GAME_STATE.lastFrameTime = performance.now();
                }, 1200);
                
                requestAnimationFrame(engineLoop);
                setInterval(triggerThunder, 13000);
            });
        }

        function initControls() {
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if(['w','arrowup'].includes(k)) INPUT.keys.w = true;
                if(['s','arrowdown'].includes(k)) INPUT.keys.s = true;
                if(['a','arrowleft'].includes(k)) INPUT.keys.a = true;
                if(['d','arrowright'].includes(k)) INPUT.keys.d = true;
                
                if(e.key === 'Shift') { 
                    e.preventDefault(); 
                    toggleSprint(true); 
                }
                
                if(e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    if (GAME_STATE.enElSuelo && !GAME_STATE.esInterior) {
                        GAME_STATE.velY = 5.2;
                        GAME_STATE.enElSuelo = false;
                    }
                }
            });

            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if(['w','arrowup'].includes(k)) INPUT.keys.w = false;
                if(['s','arrowdown'].includes(k)) INPUT.keys.s = false;
                if(['a','arrowleft'].includes(k)) INPUT.keys.a = false;
                if(['d','arrowright'].includes(k)) INPUT.keys.d = false;
                
                if(e.key === 'Shift') { 
                    toggleSprint(false); 
                }
            });

            window.addEventListener('pointerdown', e => {
                if (e.target.id === 'btn-sprint' || e.target.closest('.ui-btn') || e.target.closest('.control-wrapper') || e.target.closest('#alert-ui')) return;
                INPUT.isDraggingCam = true; INPUT.lastMouseX = e.clientX; INPUT.lastMouseY = e.clientY;
            });
            window.addEventListener('pointermove', e => {
                if (!INPUT.isDraggingCam) return;
                let dx = e.clientX - INPUT.lastMouseX; let dy = e.clientY - INPUT.lastMouseY;
                INPUT.camYaw -= dx * 0.0035; INPUT.camPitch -= dy * 0.0035;
                INPUT.camPitch = Math.max(-0.4, Math.min(0.4, INPUT.camPitch));
                INPUT.lastMouseX = e.clientX; INPUT.lastMouseY = e.clientY;
            });
            window.addEventListener('pointerup', () => INPUT.isDraggingCam = false);

            UI.btnReset.addEventListener('click', resetGame);
            UI.btnExit.addEventListener('click', () => { AudioController.detenerTodo(); window.location.href = 'index.html'; });
            
            UI.btnSprint.addEventListener('click', () => {
                if (GAME_STATE.enCooldownSprint) return;
                toggleSprint(!GAME_STATE.modoCorrerActive);
            });

            const knob = document.getElementById('joystick-knob');
            const container = document.getElementById('joystick-container');
            let joyActive = false; let jStartX = 0, jStartY = 0;

            knob.addEventListener('pointerdown', (e) => { joyActive = true; const rect = container.getBoundingClientRect(); jStartX = rect.left + rect.width / 2; jStartY = rect.top + rect.height / 2; });
            window.addEventListener('pointermove', e => {
                if (!joyActive) return;
                let dx = e.clientX - jStartX; let dy = e.clientY - jStartY;
                const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                INPUT.joyMove.x = dx / maxLen; INPUT.joyMove.y = dy / maxLen;
            });
            window.addEventListener('pointerup', () => { joyActive = false; knob.style.transform = 'translate(0px,0px)'; INPUT.joyMove.x = 0; INPUT.joyMove.y = 0; });
        }

        function toggleSprint(active) {
            if (active && GAME_STATE.stamina > 20 && !GAME_STATE.enCooldownSprint) {
                GAME_STATE.modoCorrerActive = true; UI.btnSprint.classList.add('active');
            } else {
                GAME_STATE.modoCorrerActive = false; UI.btnSprint.classList.remove('active');
            }
        }

        function gestionarPerspectivaYAvatar() {
            const camara = document.getElementById('main-camera');
            if (!camara) return;

            let meshActivo = GAME_STATE.modoCorrerActive && GAME_STATE.inputMoviendo ? 'run' : (GAME_STATE.inputMoviendo ? 'walk' : 'atento');

            if (GAME_STATE.esInterior) {
                if (GAME_STATE.camPerspectiveState !== 'INTERIOR_OTS') {
                    camara.object3D.position.set(0.3, 1.4, 1.2); 
                    camara.setAttribute('camera', 'fov', 70);
                    camara.setAttribute('camera', 'near', 0.05);
                    GAME_STATE.camPerspectiveState = 'INTERIOR_OTS';
                }
                for (let key in ENT.meshes) {
                    if (key === meshActivo) ENT.meshes[key].setAttribute('scale', '0.38 0.38 0.38');
                    else ENT.meshes[key].setAttribute('scale', '0 0 0');
                }
            } else {
                if (GAME_STATE.camPerspectiveState !== 'THIRD_PERSON') {
                    camara.object3D.position.set(0, 1.6, 2.0); 
                    camara.setAttribute('camera', 'fov', 70);
                    camara.setAttribute('camera', 'near', 0.1);
                    GAME_STATE.camPerspectiveState = 'THIRD_PERSON';
                }
                for (let key in ENT.meshes) {
                    if (key === meshActivo) ENT.meshes[key].setAttribute('scale', '0.38 0.38 0.38');
                    else ENT.meshes[key].setAttribute('scale', '0 0 0');
                }
            }
        }

        function triggerJumpscare() {
            if (GAME_STATE.isDead || !GAME_STATE.introCompletada || GAME_STATE.tiempoGraciaInicial > 0 || GAME_STATE.esInterior) return; 
            
            GAME_STATE.isDead = true;
            GAME_STATE.juegoActivo = false;
            AudioController.detenerTodo();
            UI.jumpscare.classList.add('active');
            
            setTimeout(() => {
                UI.fade.style.opacity = "1";
                setTimeout(() => { UI.jumpscare.classList.remove('active'); resetGame(); }, 4000);
            }, 1500);
        }

        function engineLoop(time) {
            requestAnimationFrame(engineLoop);
            
            let dt = (time - GAME_STATE.lastFrameTime) / 1000;
            GAME_STATE.lastFrameTime = time;
            if (dt > 0.1) dt = 0.1; 

            if (!GAME_STATE.juegoActivo || GAME_STATE.isDead) return;

            try {
                GAME_STATE.frameTicks++;

                if (time - GAME_STATE.tiempoUltimoAullido > 60000) {
                    AudioController.dispararAullidoMinuto();
                    GAME_STATE.tiempoUltimoAullido = time;
                }

                ENT.camYaw.object3D.rotation.y = INPUT.camYaw;
                ENT.camPitch.object3D.rotation.x = INPUT.camPitch;

                let mx = 0; let mz = 0;
                if (INPUT.keys.w) mz = -1; if (INPUT.keys.s) mz = 1;
                if (INPUT.keys.a) mx = -1; if (INPUT.keys.d) mx = 1;
                if (Math.abs(INPUT.joyMove.x) > 0.05 || Math.abs(INPUT.joyMove.y) > 0.05) { mx = INPUT.joyMove.x; mz = INPUT.joyMove.y; }

                GAME_STATE.inputMoviendo = (Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05);
                let speed = GAME_STATE.modoCorrerActive ? CONFIG.velCorrer : CONFIG.velCaminar;
                let angle = INPUT.camYaw;
                let dx = mx * Math.cos(angle) + mz * Math.sin(angle);
                let dz = mz * Math.cos(angle) - mx * Math.sin(angle);

                let siguienteX = GAME_STATE.pos.x + dx * speed * dt;
                let siguienteZ = GAME_STATE.pos.z + dz * speed * dt;

                let deVerdadEstaDentro = false;
                GAME_STATE.refugioActualNombre = '';

                for (let i = 0; i < ZONAS_REFUGIO.length; i++) {
                    if (ZONAS_REFUGIO[i].box.containsPoint(GAME_STATE.pos)) {
                        deVerdadEstaDentro = true;
                        GAME_STATE.refugioActualNombre = ZONAS_REFUGIO[i].nombre;
                        break;
                    }
                }
                GAME_STATE.esInterior = deVerdadEstaDentro;

                if (GAME_STATE.inputMoviendo) {
                    let choqueTotal = hayColisionPared(GAME_STATE.pos, siguienteX, siguienteZ);
                    if (!choqueTotal) {
                        GAME_STATE.pos.x = siguienteX;
                        GAME_STATE.pos.z = siguienteZ;
                    } else {
                        let choqueX = hayColisionPared(GAME_STATE.pos, siguienteX, GAME_STATE.pos.z);
                        if (!choqueX) {
                            GAME_STATE.pos.x = siguienteX;
                        }
                        let choqueZ = hayColisionPared(GAME_STATE.pos, GAME_STATE.pos.x, siguienteZ);
                        if (!choqueZ) {
                            GAME_STATE.pos.z = siguienteZ;
                        }
                    }
                }

                if (GAME_STATE.frameTicks % 2 === 0 && sueloMeshCache.length > 0) { 
                    V_POOL.rayOrigin.set(GAME_STATE.pos.x, GAME_STATE.pos.y + 1.5, GAME_STATE.pos.z); 
                    RAYCASTER_REUTILIZABLE.set(V_POOL.rayOrigin, V_POOL.rayDir);
                    RAYCASTER_REUTILIZABLE.far = 4.0;
                    
                    const colisiones = RAYCASTER_REUTILIZABLE.intersectObjects(sueloMeshCache, false);
                    let mejorAltura = null; 
                    let maxPuntoY = -Infinity;

                    const OFFSET_PIES = 0.05; 
                    const ALTURA_BASE_MAPA = 0.0;

                    for (let i = 0; i < colisiones.length; i++) {
                        const hit = colisiones[i];
                        if (hit.point.y > maxPuntoY && hit.point.y <= (GAME_STATE.pos.y + 1.0)) { 
                            maxPuntoY = hit.point.y; 
                            mejorAltura = hit.point.y; 
                        }
                    }
                    
                    if (mejorAltura !== null) {
                        GAME_STATE.cachedAlturaSuelo = mejorAltura + OFFSET_PIES;
                    } else {
                        GAME_STATE.cachedAlturaSuelo = ALTURA_BASE_MAPA;
                    }
                }

                if (!GAME_STATE.enElSuelo) {
                    GAME_STATE.velY -= 15.0 * dt;
                    GAME_STATE.pos.y += GAME_STATE.velY * dt;

                    if (GAME_STATE.pos.y <= GAME_STATE.cachedAlturaSuelo) {
                        GAME_STATE.pos.y = GAME_STATE.cachedAlturaSuelo;
                        GAME_STATE.velY = 0;
                        GAME_STATE.enElSuelo = true;
                    }
                } else {
                    let deltaY = GAME_STATE.cachedAlturaSuelo - GAME_STATE.pos.y;
                    if (Math.abs(deltaY) > 0.5) {
                        GAME_STATE.pos.y = GAME_STATE.cachedAlturaSuelo;
                    } else {
                        let factorSuavizado = 0.4;
                        GAME_STATE.pos.y += deltaY * factorSuavizado;
                    }
                }

                ENT.rig.object3D.position.set(GAME_STATE.pos.x, GAME_STATE.pos.y, GAME_STATE.pos.z);

                UI.telemetry.textContent = `📡 RADAR // X[${GAME_STATE.pos.x.toFixed(1)}] Y[${GAME_STATE.pos.y.toFixed(1)}] Z[${GAME_STATE.pos.z.toFixed(1)}] | SAFE_ZONE: ${GAME_STATE.esInterior ? GAME_STATE.refugioActualNombre.toUpperCase() : 'NONE'}`;

                if (GAME_STATE.inputMoviendo) {
                    let targetAngle = Math.atan2(dx, dz);
                    let diff = targetAngle - ENT.avatar.object3D.rotation.y;
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                    ENT.avatar.object3D.rotation.y += diff * CONFIG.suavizadoGiroAvatar;
                }

                gestionarPerspectivaYAvatar();

                if (GAME_STATE.modoCorrerActive && GAME_STATE.inputMoviendo) {
                    GAME_STATE.stamina = Math.max(0, GAME_STATE.stamina - (CONFIG.staminaGasto * dt));
                    if (GAME_STATE.stamina <= 0) { toggleSprint(false); GAME_STATE.enCooldownSprint = true; UI.btnSprint.classList.add('cooldown'); }
                } else {
                    GAME_STATE.stamina = Math.min(CONFIG.staminaMax, GAME_STATE.stamina + (CONFIG.staminaRecuperacion * dt));
                    if (GAME_STATE.stamina >= 50 && GAME_STATE.enCooldownSprint) { GAME_STATE.enCooldownSprint = false; UI.btnSprint.classList.remove('cooldown'); }
                }
                UI.staminaBar.style.width = ((GAME_STATE.stamina / CONFIG.staminaMax) * 100) + '%';

                let loboPos = ENT.wwRig.object3D.position;
                let distJugadorLobo = GAME_STATE.pos.distanceTo(loboPos);

                if (!GAME_STATE.introCompletada || GAME_STATE.tiempoGraciaInicial > 0) {
                    if (GAME_STATE.tiempoGraciaInicial > 0 && GAME_STATE.introCompletada) {
                        GAME_STATE.tiempoGraciaInicial -= dt;
                    }
                    GAME_STATE.loboEstado = 'GRACIA_INICIAL';
                    loboPos.set(60, 0, -60); 
                    UI.alert.textContent = "👁️ PREPARANDO SUEÑO... CORRE A REFUGIO";
                    UI.damage.className = '';
                    GAME_STATE.tiempoContactoFisico = 0;
                    AudioController.fadeTo('enojado', 0.0);
                    AudioController.fadeTo('stalk', 0.0);
                } else if (GAME_STATE.esInterior) {
                    GAME_STATE.tiempoContactoFisico = 0;
                    UI.damage.className = '';
                    
                    if (GAME_STATE.loboEstado !== 'MERODEANDO_CASA' && GAME_STATE.loboEstado !== 'RETIRADA') {
                        GAME_STATE.loboEstado = 'MERODEANDO_CASA';
                        GAME_STATE.aiPuntoObjetivo = PUNTOS_MERODEO_CASA[Math.floor(Math.random() * PUNTOS_MERODEO_CASA.length)];
                        UI.alert.textContent = "🔊 Ruidos pesados rodean las ventanas...";
                    }

                    if (GAME_STATE.loboEstado === 'MERODEANDO_CASA') {
                        V_POOL.dirALugar.subVectors(GAME_STATE.aiPuntoObjetivo, loboPos); V_POOL.dirALugar.y = 0;
                        let distAlPunto = V_POOL.dirALugar.length();
                        if (distAlPunto > 0.5) {
                            V_POOL.dirALugar.normalize();
                            moverLoboConColision(loboPos, V_POOL.dirALugar, CONFIG.wwVelAcecho, dt);
                            ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirALugar.x, V_POOL.dirALugar.z);
                        } else {
                            if (GAME_STATE.frameTicks % 200 === 0) GAME_STATE.aiPuntoObjetivo = PUNTOS_MERODEO_CASA[Math.floor(Math.random() * PUNTOS_MERODEO_CASA.length)];
                            GAME_STATE.aiTimer += dt;
                            if (GAME_STATE.aiTimer > 25) {
                                GAME_STATE.loboEstado = 'RETIRADA'; GAME_STATE.aiPuntoObjetivo.set(60, 0, -60);
                                UI.alert.textContent = "🔊 Los gruñidos se desvanecen en el bosque...";
                            }
                        }
                    } else if (GAME_STATE.loboEstado === 'RETIRADA') {
                        V_POOL.dirAlBosque.subVectors(GAME_STATE.aiPuntoObjetivo, loboPos); V_POOL.dirAlBosque.y = 0;
                        if (V_POOL.dirAlBosque.length() > 1.0) {
                            V_POOL.dirAlBosque.normalize();
                            moverLoboConColision(loboPos, V_POOL.dirAlBosque, CONFIG.wwVelAcecho, dt);
                            ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirAlBosque.x, V_POOL.dirAlBosque.z);
                        } else { GAME_STATE.loboEstado = 'BOSQUE'; GAME_STATE.aiTimer = 0; }
                    }
                } else {
                    GAME_STATE.aiTimer = 0;
                    if (distJugadorLobo >= CONFIG.distDeteccionLobo) {
                        GAME_STATE.loboEstado = 'BOSQUE';
                        V_POOL.dirHaciaTi.subVectors(GAME_STATE.pos, loboPos); V_POOL.dirHaciaTi.y = 0; V_POOL.dirHaciaTi.normalize();
                        moverLoboConColision(loboPos, V_POOL.dirHaciaTi, CONFIG.wwVelAcecho, dt);
                        ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirHaciaTi.x, V_POOL.dirHaciaTi.z);
                        UI.alert.textContent = "🔊 Gruñidos profundos resuenan en la niebla...";
                    } else {
                        V_POOL.dirHaciaTi.subVectors(GAME_STATE.pos, loboPos); V_POOL.dirHaciaTi.y = 0; V_POOL.dirHaciaTi.normalize();
                        let velocidadLobo = (distJugadorLobo < CONFIG.distAtaqueLobo) ? CONFIG.wwVelAtaque : CONFIG.wwVelAcecho;
                        
                        moverLoboConColision(loboPos, V_POOL.dirHaciaTi, velocidadLobo, dt);
                        ENT.wwRig.object3D.rotation.y = Math.atan2(V_POOL.dirHaciaTi.x, V_POOL.dirHaciaTi.z);

                        if (distJugadorLobo < 1.6) {
                            GAME_STATE.loboEstado = 'FORCEJEO'; GAME_STATE.tiempoContactoFisico += dt;
                            UI.damage.className = 'grabbed';
                            let tiempoRestante = Math.max(0, CONFIG.tiempoForcejeoMax - GAME_STATE.tiempoContactoFisico);
                            UI.alert.textContent = `🚨 ¡LA BESTIA TE SUJETA! ¡SPRINT ACTIVO! (${tiempoRestante.toFixed(1)}s)`;
                            if (GAME_STATE.tiempoContactoFisico >= CONFIG.tiempoForcejeoMax) triggerJumpscare();
                        } else if (distJugadorLobo < CONFIG.distAtaqueLobo) {
                            GAME_STATE.loboEstado = 'ATAQUE'; GAME_STATE.tiempoContactoFisico = 0;
                            UI.alert.textContent = "⚠️ ¡HUYE A LA CASA!"; UI.damage.className = 'active';
                        } else {
                            GAME_STATE.loboEstado = 'ACECHO'; GAME_STATE.tiempoContactoFisico = 0;
                            UI.alert.textContent = "⚠️ El Hombre Lobo sigue tu rastro..."; UI.damage.className = '';
                        }
                    }
                }

                AudioController.actualizarProximidad(GAME_STATE.loboEstado, distJugadorLobo);

            } catch (err) { console.warn("Loop Err:", err); }
        }

        function triggerThunder() {
            if (!GAME_STATE.juegoActivo) return;
            try {
                const luz = ENT.luzRelampago.object3D.element;
                if(luz) {
                    luz.setAttribute('light', 'intensity', '2.5');
                    setTimeout(() => {
                        luz.setAttribute('light', 'intensity', '0');
                        setTimeout(() => {
                            luz.setAttribute('light', 'intensity', '1.8');
                            setTimeout(() => luz.setAttribute('light', 'intensity', '0'), 90);
                        }, 50);
                    }, 120);
                }
            } catch(e){}
        }

        function resetGame() {
            AudioController.detenerTodo();
            GAME_STATE.stamina = CONFIG.staminaMax;
            GAME_STATE.modoCorrerActive = false; GAME_STATE.enCooldownSprint = false; GAME_STATE.esInterior = false;
            GAME_STATE.isDead = false; GAME_STATE.aiTimer = 0; GAME_STATE.tiempoContactoFisico = 0;
            GAME_STATE.cachedAlturaSuelo = 0; GAME_STATE.camPerspectiveState = 'NONE';
            GAME_STATE.refugioActualNombre = '';
            GAME_STATE.velY = 0; GAME_STATE.enElSuelo = true;
            
            ENT.rig.object3D.position.set(0, 0, 25);
            ENT.wwRig.object3D.position.set(60, 0, -60);
            GAME_STATE.pos.set(0, 0, 25);
            
            INPUT.camYaw = 0; INPUT.camPitch = 0;
            UI.btnSprint.classList.remove('active', 'cooldown');
            UI.fade.style.opacity = "0"; UI.damage.className = ''; UI.jumpscare.classList.remove('active');

            for (let key in ENT.meshes) ENT.meshes[key].setAttribute('scale', '0 0 0');
            if (ENT.meshes.atento) ENT.meshes.atento.setAttribute('scale', '0.38 0.38 0.38');
            
            GAME_STATE.introCompletada = false;
            AudioController.reproducirMusicaFondo();
            GAME_STATE.juegoActivo = true;
            GAME_STATE.lastFrameTime = performance.now();
            GAME_STATE.tiempoUltimoAullido = performance.now();
            GAME_STATE.tiempoGraciaInicial = 10.0;
            GAME_STATE.loboEstado = 'GRACIA_INICIAL';

            setTimeout(() => { GAME_STATE.introCompletada = true; GAME_STATE.lastFrameTime = performance.now(); }, 1200);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') { initLoader(); }
        else { window.addEventListener('DOMContentLoaded', initLoader); }
    </script>
</body>
</html>
