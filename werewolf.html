<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Werewolf Escape Simulator</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: system-ui, sans-serif;
            background-color: #02040a; user-select: none; -webkit-user-select: none;
        }

        #custom-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #02040a; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .spinner {
            width: 45px; height: 45px;
            border: 3px solid rgba(239, 68, 68, 0.1);
            border-top-color: #ef4444; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        .loader-title {
            color: #ef4444; font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
        }

        .loader-msg { color: #94a3b8; font-size: 11px; max-width: 280px; text-align: center; line-height: 1.5; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #btn-center {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15, 23, 42, 0.85); border: 2px solid #00ffaa;
            color: #00ffaa; border-radius: 50%; width: 46px; height: 46px;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; backdrop-filter: blur(4px);
        }

        #alert-ui {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); border: 1px solid #ef4444;
            color: #fca5a5; padding: 8px 16px; border-radius: 20px;
            font-size: 11px; font-weight: bold; letter-spacing: 1px;
            z-index: 1000; text-transform: uppercase; display: none;
            backdrop-filter: blur(4px); pointer-events: none;
        }

        #joystick-wrapper {
            position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; z-index: 999;
        }

        #joystick-container {
            width: 100px; height: 100px; background: rgba(15, 23, 42, 0.6);
            border: 2px solid #ef4444; border-radius: 50%; touch-action: none; position: relative;
        }

        #joystick-knob {
            position: absolute; top: 30px; left: 30px; width: 40px; height: 40px;
            background: #ef4444; border-radius: 50%; box-shadow: 0 0 15px #ef4444;
            cursor: pointer; touch-action: none;
        }

        #arrows-wrapper {
            position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; z-index: 999;
        }

        .joy-arrow {
            position: absolute; background: rgba(15, 23, 42, 0.7);
            border: 1px solid #ef4444; color: #ef4444; border-radius: 8px;
            width: 32px; height: 32px; font-size: 14px;
            display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        .arrow-up { top: 0; left: 34px; }
        .arrow-down { bottom: 0; left: 34px; }
        .arrow-left { left: 0; top: 34px; }
        .arrow-right { right: 0; top: 34px; }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div class="loader-title">Cargando Entorno 3D</div>
        <div class="loader-msg">Procesando estructuras complejas y preparando controles adaptativos...</div>
    </div>

    <div id="alert-ui">⚠️ ¡Huye! Entra en la casa 🏡</div>

    <button id="btn-center">👤</button>

    <div id="arrows-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <div id="joystick-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <a-scene fog="type: exponential; color: #02040a; density: 0.012;"
             gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
             renderer="antialias: true; colorManagement: true; powerPreference: high-performance;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="pueblo-model" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb"></a-asset-item>
            <a-asset-item id="ww-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Idle.glb"></a-asset-item>
            <a-asset-item id="ww-howl-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Howl.glb"></a-asset-item>
            <a-asset-item id="ww-beast-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Beast.glb"></a-asset-item>
            <a-asset-item id="luis-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb"></a-asset-item>
            <a-asset-item id="luis-llama-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-llama.glb"></a-asset-item>
        </a-assets>

        <a-sky color="#02040a"></a-sky>

        <a-sphere id="luna-llena" position="30 80 -90" radius="6" color="#e2e8f0" material="shader: flat; fog: false"></a-sphere>
        <a-entity light="type: directional; intensity: 0.7; color: #93c5fd;" position="30 80 -90"></a-entity>
        <a-entity light="type: ambient; intensity: 0.4; color: #2e2a72"></a-entity>

        <!-- PLANO DE SEGURIDAD FÍSICA CONSTANTE -->
        <a-plane position="0 -0.02 0" rotation="-90 0 0" width="400" height="400" color="#111827" material="roughness: 0.95"></a-plane>

        <!-- ENTIDAD DEL PUEBLO -->
        <a-entity id="entorno" gltf-model="#pueblo-model" position="0 0 0"></a-entity>

        <!-- ENTORNO DEL JUGADOR -->
        <a-entity id="player-rig" position="0 0 15">
            <a-entity id="avatar-container" position="0 0.02 0">
                <a-entity id="luis-mesh-walk" gltf-model="#luis-walk-src" scale="1 1 1" visible="true"
                          animation-mixer="clip: *; loop: repeat; timeScale: 0;">
                </a-entity>
                <a-entity id="luis-mesh-llama" gltf-model="#luis-llama-src" scale="1 1 1" visible="false"
                          animation-mixer="clip: *; loop: repeat; timeScale: 0;">
                </a-entity>
            </a-entity>

            <a-entity id="camera-orbit" position="0 2.1 0">
                <a-entity id="main-camera" camera position="0 0 4.5">
                    <a-entity light="type: spot; intensity: 2.0; distance: 45; angle: 40; penumbra: 0.5; color: #fffdec;" position="0 0 0"></a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- ENTORNO HOMBRE LOBO -->
        <a-entity id="werewolf-rig" position="-12 0 -8">
            <a-entity id="ww-idle" gltf-model="#ww-idle-src" scale="1 1 1" visible="true"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>
            <a-entity id="ww-howl" gltf-model="#ww-howl-src" scale="1 1 1" visible="false"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1;">
            </a-entity>
            <a-entity id="ww-beast" gltf-model="#ww-beast-src" scale="1 1 1" visible="false"
                      animation-mixer="clip: *; loop: repeat; timeScale: 1.3;">
            </a-entity>

            <!-- CONTENEDOR DINÁMICO DE OJOS -->
            <a-entity id="ww-eyes" position="0 1.75 0.35">
                <a-sphere color="#ffaa00" radius="0.04" position="-0.12 0 0" material="shader: flat; fog: false"></a-sphere>
                <a-sphere color="#ffaa00" radius="0.04" position="0.12 0 0" material="shader: flat; fog: false"></a-sphere>
                <a-entity light="type: point; intensity: 1.2; distance: 6; color: #ffaa00"></a-entity>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const SPAWN_X = 0; const SPAWN_Z = 15;
        const CASA_FACHADA_X = 17.44; const CASA_FACHADA_Z = 17.78;
        const RADIO_DISPARADOR = 2.2;
        const CASA_INTERIOR_X = 17.50; const CASA_INTERIOR_Z = 12.00;
        const VELOCIDAD_LUIS = 0.08;

        const knob = document.getElementById('joystick-knob');
        const rig = document.getElementById('player-rig');
        const werewolfRig = document.getElementById('werewolf-rig');
        const cameraOrbit = document.getElementById('camera-orbit');
        const avatarContainer = document.getElementById('avatar-container');
        const alertUI = document.getElementById('alert-ui');
        
        const luisWalk = document.getElementById('luis-mesh-walk');
        const luisLlama = document.getElementById('luis-mesh-llama');
        const wwEyes = document.getElementById('ww-eyes');

        const wwModels = {
            idle: document.getElementById('ww-idle'),
            howl: document.getElementById('ww-howl'),
            beast: document.getElementById('ww-beast')
        };

        let moveX = 0, moveY = 0;
        const keys = { w: false, a: false, s: false, d: false };
        let joyDragging = false; let joyStartX, joyStartY;
        let screenDragging = false; let prevScreenX, prevScreenY;
        
        let camYaw = 0; let camPitch = -0.15;
        let arrowCam = { up: false, down: false, left: false, right: false };
        
        let entornoCargado = false;
        let loaderEliminado = false;
        let jugadorEstado = "EXPLORANDO"; 
        let loboEstado = "idle"; 
        let loboTargetX = -12; let loboTargetZ = -8;
        let loboTimerCambio = 0;

        function ocultarLoader() {
            if (loaderEliminado) return;
            loaderEliminado = true;
            const loader = document.getElementById('custom-loader');
            if (loader) {
                loader.style.opacity = '0'; loader.style.visibility = 'hidden';
                setTimeout(() => { loader.remove(); alertUI.style.display = 'block'; }, 500);
            }
        }

        document.getElementById('entorno').addEventListener('model-loaded', () => { 
            entornoCargado = true; 
            ocultarLoader();
        });

        setTimeout(ocultarLoader, 6000);

        function onScreenStart(e) {
            if (e.target.closest('#arrows-wrapper') || e.target.closest('#joystick-wrapper') || e.target.tagName === 'BUTTON') return;
            screenDragging = true; const point = e.touches ? e.touches[0] : e;
            prevScreenX = point.clientX; prevScreenY = point.clientY;
        }
        function onScreenMove(e) {
            if (!screenDragging) return; const point = e.touches ? e.touches[0] : e;
            camYaw -= (point.clientX - prevScreenX) * 0.005;
            camPitch += (point.clientY - prevScreenY) * 0.004;
            prevScreenX = point.clientX; prevScreenY = point.clientY;
        }
        window.addEventListener('mousedown', onScreenStart); window.addEventListener('mousemove', onScreenMove);
        window.addEventListener('mouseup', () => screenDragging = false);
        window.addEventListener('touchstart', onScreenStart, {passive: true}); window.addEventListener('touchmove', onScreenMove, {passive: true});
        window.addEventListener('touchend', () => screenDragging = false);

        function onJoyStart(e) { joyDragging = true; const pt = e.touches ? e.touches[0] : e; joyStartX = pt.clientX; joyStartY = pt.clientY; e.stopPropagation(); }
        function onJoyMove(e) {
            if (!joyDragging) return; const pt = e.touches ? e.touches[0] : e;
            let dx = pt.clientX - joyStartX; let dy = pt.clientY - joyStartY;
            const maxLen = 35; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxLen) { dx = (dx / dist) * maxLen; dy = (dy / dist) * maxLen; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxLen; moveY = dy / maxLen; e.stopPropagation();
        }
        knob.addEventListener('touchstart', onJoyStart); window.addEventListener('touchmove', onJoyMove, {passive: false});
        window.addEventListener('touchend', () => { joyDragging = false; knob.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });
        knob.addEventListener('mousedown', onJoyStart); window.addEventListener('mousemove', onJoyMove);
        window.addEventListener('mouseup', () => { joyDragging = false; knob.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });

        window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
        window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

        const setArrowCam = (id, dir) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', () => arrowCam[dir] = true); btn.addEventListener('mouseup', () => arrowCam[dir] = false);
            btn.addEventListener('touchstart', () => arrowCam[dir] = true); btn.addEventListener('touchend', () => arrowCam[dir] = false);
        };
        setArrowCam('btn-up', 'up'); setArrowCam('btn-down', 'down'); setArrowCam('btn-left', 'left'); setArrowCam('btn-right', 'right');

        // AJUSTE DINÁMICO DE OJOS SEGÚN POSTURA DEL MODELO GLTF
        function cambiarPoseLobo(nuevaPose) {
            loboEstado = nuevaPose;
            Object.keys(wwModels).forEach(key => {
                if(wwModels[key]) wwModels[key].setAttribute('visible', key === nuevaPose);
            });

            if (wwEyes && wwEyes.object3D) {
                if (nuevaPose === 'idle') {
                    wwEyes.object3D.position.set(0, 1.75, 0.35);
                } else if (nuevaPose === 'howl') {
                    wwEyes.object3D.position.set(0, 1.95, 0.10);
                } else if (nuevaPose === 'beast') {
                    wwEyes.object3D.position.set(0, 1.05, 0.70); // Se encoge a 4 patas y adelanta la cabeza
                }
            }
        }

        function filtrarInterseccionSuelo(intersects) {
            for (let i = 0; i < intersects.length; i++) {
                const name = intersects[i].object.name.toLowerCase();
                if (name.includes('hierba') || name.includes('foliage') || name.includes('weed') || name.includes('bush') || name.includes('matorral')) continue;
                return intersects[i];
            }
            return intersects[0];
        }

        function engineLoop() {
            requestAnimationFrame(engineLoop);

            if (!rig.object3D || !cameraOrbit.object3D || !avatarContainer.object3D || !werewolfRig.object3D) return;

            // ROTACIÓN CÁMARA
            if (arrowCam.left) camYaw += 0.02; if (arrowCam.right) camYaw -= 0.02;
            if (arrowCam.up) camPitch -= 0.015; if (arrowCam.down) camPitch += 0.015;
            camPitch = Math.max(-0.55, Math.min(0.12, camPitch));
            cameraOrbit.object3D.rotation.y = camYaw; cameraOrbit.object3D.rotation.x = camPitch;

            let pos = rig.object3D.position;
            const meshPueblo = document.getElementById('entorno').object3D;

            // SISTEMA INTELIGENTE DE IA PARA EL LOBO
            loboTimerCambio += 1;
            if (loboTimerCambio > 180) { 
                loboTimerCambio = 0;
                const randomChance = Math.random();
                if (randomChance < 0.35) cambiarPoseLobo('idle');
                else if (randomChance < 0.65) cambiarPoseLobo('howl');
                else {
                    cambiarPoseLobo('beast');
                    loboTargetX = pos.x + (Math.random() * 20 - 10);
                    loboTargetZ = pos.z + (Math.random() * 20 - 10);
                }
            }

            if (loboEstado === 'beast') {
                let loboPos = werewolfRig.object3D.position;
                let dx = loboTargetX - loboPos.x; let dz = loboTargetZ - loboPos.z;
                let distLobo = Math.sqrt(dx*dx + dz*dz);
                if (distLobo > 0.5) {
                    loboPos.x += (dx / distLobo) * 0.05; loboPos.z += (dz / distLobo) * 0.05;
                    werewolfRig.object3D.rotation.y = Math.atan2(dx, dz);
                }
            }

            // CONTROL DE MOVIMIENTO DINÁMICO DE LUIS (CORREGIDO)
            if (jugadorEstado === "EXPLORANDO") {
                let inputX = 0; let inputY = 0;
                if (keys.w) inputY = -1; if (keys.s) inputY = 1;
                if (keys.a) inputX = -1; if (keys.d) inputX = 1;
                if (joyDragging) { inputX = moveX; inputY = moveY; }

                let moviendo = (inputX !== 0 || inputY !== 0);
                luisWalk.setAttribute('animation-mixer', 'timeScale', moviendo ? 1.2 : 0);

                if (moviendo) {
                    let oldX = pos.x; let oldZ = pos.z; let oldY = pos.y;
                    
                    // VECTORES DE MOVIMIENTO CORREGIDOS (FÓRMULA TRIGONOMÉTRICA EXACTA)
                    const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
                    const rgtX = Math.cos(camYaw); const rgtZ = -Math.sin(camYaw);

                    pos.x += (fwdX * -inputY + rgtX * inputX) * VELOCIDAD_LUIS;
                    pos.z += (fwdZ * -inputY + rgtZ * inputX) * VELOCIDAD_LUIS; 

                    const targetAngle = camYaw + Math.atan2(inputX, inputY);
                    let deltaAngle = Math.atan2(Math.sin(targetAngle - avatarContainer.object3D.rotation.y), Math.cos(targetAngle - avatarContainer.object3D.rotation.y));
                    avatarContainer.object3D.rotation.y += deltaAngle * 0.25;

                    // RAYCASTING NO BLOQUEANTE (Suelo dinámico)
                    if (entornoCargado && meshPueblo && meshPueblo.children.length > 0) {
                        const ray = new THREE.Raycaster(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                        const hits = ray.intersectObject(meshPueblo, true);
                        const hitSuelo = filtrarInterseccionSuelo(hits);
                        if (hitSuelo) {
                            let groundY = hitSuelo.point.y;
                            if ((groundY - oldY) > 0.8) { 
                                // Si choca contra una pared o desnivel insalvable, rebota a su posición previa
                                pos.x = oldX; pos.z = oldZ; pos.y = oldY; 
                            } else { 
                                pos.y += (groundY - pos.y) * 0.2; 
                            }
                        } else { 
                            // Red de seguridad: si sale de los límites del pueblo camina libre sobre Y=0
                            pos.y += (0 - pos.y) * 0.2; 
                        }
                    } else {
                        // Si el mapa aún no carga del todo en la GPU, el jugador puede moverse en Y=0 libremente
                        pos.y = 0;
                    }
                }

                // COLISIÓN CERCANÍA REFUGIO
                let distA_Casa = Math.sqrt(Math.pow(pos.x - CASA_FACHADA_X, 2) + Math.pow(pos.z - CASA_FACHADA_Z, 2));
                if (distA_Casa <= RADIO_DISPARADOR) {
                    jugadorEstado = "LLAMANDO";
                    luisWalk.setAttribute('visible', 'false');
                    luisLlama.setAttribute('visible', 'true'); 
                    luisLlama.setAttribute('animation-mixer', 'timeScale', 1);
                    alertUI.textContent = "🔊 ¡Llamando a la puerta! Esperando refugio...";

                    setTimeout(() => {
                        jugadorEstado = "SALVADO";
                        pos.x = CASA_INTERIOR_X; pos.z = CASA_INTERIOR_Z;
                        
                        if (entornoCargado && meshPueblo) {
                            const rayInt = new THREE.Raycaster(new THREE.Vector3(pos.x, 2000, pos.z), new THREE.Vector3(0, -1, 0));
                            const hitInt = rayInt.intersectObject(meshPueblo, true);
                            if (hitInt && hitInt.length > 0) pos.y = hitInt[0].point.y;
                        }
                        
                        luisLlama.setAttribute('visible', 'false');
                        luisWalk.setAttribute('visible', 'true'); 
                        luisWalk.setAttribute('animation-mixer', 'timeScale', 0);
                        alertUI.textContent = "🎉 ¡A salvo dentro! El hombre lobo no puede entrar.";
                    }, 2500); 
                }
            }
        }
        
        document.getElementById('btn-center').addEventListener('click', () => {
            if (!rig.object3D) return;
            jugadorEstado = "EXPLORANDO";
            rig.object3D.position.set(SPAWN_X, 0, SPAWN_Z);
            luisWalk.setAttribute('visible', 'true');
            luisLlama.setAttribute('visible', 'false');
            luisWalk.setAttribute('animation-mixer', 'timeScale', 0);
            alertUI.textContent = "⚠️ ¡Huye! Entra en la casa 🏡";
        });

        engineLoop();
    </script>
</body>
</html>
