<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARK - Werewolf Escape Simulator v4.5 PRO Max</title>
    
    <!-- Librerías estables de A-Frame y Extras -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <!-- Librería de partículas para efectos especiales -->
    <script src="https://cdn.jsdelivr.net/gh/idea-space/aframe-particle-system-component@v1.1.3/dist/aframe-particle-system-component.min.js"></script>
    
    <style>
        :root {
            --ui-red: #ef4444;
            --ui-green: #00ffaa;
            --ui-blue: #38bdf8;
            --bg-dark: #010103;
            --pane-bg: rgba(15, 23, 42, 0.9);
        }

        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-dark); 
            user-select: none; 
            -webkit-user-select: none; 
            color: #fff;
        }

        /* --- Pantalla de Carga Avanzada --- */
        #custom-loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); z-index: 99999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 1s ease, visibility 1s ease; 
        }
        #custom-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .spinner-container { position: relative; width: 80px; height: 80px; margin-bottom: 30px; }
        .spinner { 
            width: 100%; height: 100%; 
            border: 4px solid rgba(239, 68, 68, 0.1); 
            border-top-color: var(--ui-red); 
            border-radius: 50%; 
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite; 
        }
        .spinner-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px; color: var(--ui-red);
            animation: pulse 2s infinite;
        }

        .loader-text-group { text-align: center; }
        .loader-title { color: var(--ui-red); font-size: 18px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
        .loader-msg { color: #94a3b8; font-size: 12px; max-width: 300px; line-height: 1.6; margin: 0 auto; }
        .load-progress { width: 200px; height: 2px; background: rgba(255,255,255,0.1); margin: 15px auto; border-radius: 1px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--ui-red); transition: width 0.3s ease; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- Superposición de Fundido --- */
        #fade-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; z-index: 99990; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

        /* --- Barra Superior de UI --- */
        #ui-top-bar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; z-index: 1000; pointer-events: none; gap: 8px; }
        .ui-row { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; pointer-events: auto; }
        
        .ui-btn { 
            background: var(--pane-bg); border: 1px solid rgba(255,255,255,0.2); 
            color: #fff; border-radius: 8px; cursor: pointer; 
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }
        .ui-btn:active { transform: scale(0.95); background: rgba(30, 41, 59, 0.9); }

        #btn-reset { width: 44px; height: 44px; font-size: 18px; border-color: var(--ui-green); color: var(--ui-green); border-radius: 50%; }
        #btn-reset:hover { background: rgba(0, 255, 170, 0.1); box-shadow: 0 0 10px rgba(0, 255, 170, 0.2); }

        #alert-ui { 
            flex-grow: 1; text-align: center; background: var(--pane-bg); 
            border: 1px solid var(--ui-red); color: #fca5a5; 
            padding: 12px; border-radius: 8px; font-size: 11px; font-weight: bold; 
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #btn-sprint { padding: 12px 18px; font-size: 10px; font-weight: bold; border-color: var(--ui-red); min-width: 100px; text-transform: uppercase; letter-spacing: 1px;}
        #btn-sprint.active { background: var(--ui-red); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        #btn-sprint.cooldown { border-color: #64748b; color: #64748b; opacity: 0.7; cursor: not-allowed; }

        /* --- Barra de Resistencia --- */
        #stamina-container { width: 100%; max-width: 320px; height: 4px; background: rgba(15, 23, 42, 0.5); border-radius: 2px; overflow: hidden; pointer-events: none; position: relative; margin-top: 4px;}
        #stamina-bar { width: 100%; height: 100%; background: var(--ui-green); transition: width 0.1s linear, background-color 0.3s ease; }
        #stamina-bar.low { background-color: var(--ui-red); animation: pulse-stamina 0.5s infinite; }
        @keyframes pulse-stamina { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* --- Pantalla de Daño (Vignette) --- */
        #damage-vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 40%, rgba(150,0,0,0.6) 100%);
            z-index: 99980; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
        }
        #damage-vignette.active { opacity: 1; animation: heart-beat 1.5s infinite; }
        @keyframes heart-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        /* --- Controles Móviles --- */
        .control-wrapper { position: absolute; z-index: 999; pointer-events: auto; }
        
        /* Joystick */
        #joystick-wrapper { bottom: 40px; right: 40px; width: 110px; height: 110px; }
        #joystick-container { width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); border: 2px solid var(--ui-red); border-radius: 50%; position: relative; backdrop-filter: blur(2px); touch-action: none;}
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 40px; height: 40px; background: var(--ui-red); border-radius: 50%; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); cursor: pointer; touch-action: none;}

        /* Flechas de Cámara */
        #arrows-wrapper { bottom: 40px; left: 40px; width: 110px; height: 110px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
        .joy-arrow { 
            grid-column: 2; grid-row: 2;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.2); 
            color: rgba(255,255,255,0.8); border-radius: 8px; width: 36px; height: 36px; 
            font-size: 16px; display: flex; align-items: center; justify-content: center; 
            transition: all 0.1s ease; backdrop-filter: blur(2px);
        }
        .joy-arrow:active { background: var(--ui-red); border-color: var(--ui-red); color: #fff; transform: scale(0.9); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        
        .arrow-up { grid-row: 1; grid-column: 2; }
        .arrow-down { grid-row: 3; grid-column: 2; }
        .arrow-left { grid-row: 2; grid-column: 1; }
        .arrow-right { grid-row: 2; grid-column: 3; }

    </style>
</head>
<body>

    <!-- Pantalla de Carga Avanzada -->
    <div id="custom-loader">
        <div class="spinner-container">
            <div class="spinner"></div>
            <div class="spinner-icon">🐺</div>
        </div>
        <div class="loader-text-group">
            <div class="loader-title">ARK: Simulador</div>
            <div class="load-progress"><div id="progress-bar"></div></div>
            <div class="loader-msg" id="loader-status">Cargando dependencias de la simulación...</div>
        </div>
    </div>

    <!-- Efecto de daño visual -->
    <div id="damage-vignette"></div>
    
    <!-- Fundido para transiciones -->
    <div id="fade-screen"></div>

    <!-- UI Superior -->
    <div id="ui-top-bar">
        <div class="ui-row">
            <button id="btn-reset" class="ui-btn" title="Reiniciar Simulación">🔄</button>
            <div id="alert-ui">⚠️ NOCHE 1: SOBREVIVE. Busca el refugio iluminado 🏡</div>
            <button id="btn-sprint" class="ui-btn">RUN</button>
        </div>
        <div id="stamina-container">
            <div id="stamina-bar"></div>
        </div>
    </div>

    <!-- Controles Móviles: Flechas de Cámara -->
    <div id="arrows-wrapper" class="control-wrapper">
        <button class="joy-arrow arrow-up" id="btn-up">▲</button>
        <button class="joy-arrow arrow-down" id="btn-down">▼</button>
        <button class="joy-arrow arrow-left" id="btn-left">◀</button>
        <button class="joy-arrow arrow-right" id="btn-right">▶</button>
    </div>

    <!-- Controles Móviles: Joystick de Movimiento -->
    <div id="joystick-wrapper" class="control-wrapper">
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- ESCENA A-FRAME (Con Decoder Draco inyectado de forma segura) -->
    <a-scene id="escena-principal" 
             gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
             fog="type: exponential; color: #020205; density: 0.03;" 
             renderer="antialias: true; colorManagement: true; powerPreference: high-performance; physicallyCorrectLights: true;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false" 
             loading-screen="enabled: false"
             timeout="15000">
        
        <a-assets>
            <a-asset-item id="pueblo-model" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/pueblo.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-idle-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Idle.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-howl-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Howl.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="ww-beast-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/Werewolf_Beast.glb" crossorigin="anonymous"></a-asset-item>
            
            <a-asset-item id="luis-walk-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-camina.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-llama-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-llama.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-run-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-corre.glb" crossorigin="anonymous"></a-asset-item>
            <a-asset-item id="luis-atento-src" src="https://huggingface.co/datasets/Luis-Fernando/werewolf/resolve/main/luis-atento.glb" crossorigin="anonymous"></a-asset-item>
            
            <!-- Sonidos -->
            <audio id="snd-rain" src="https://cdn.pixabay.com/audio/2022/03/19/audio_2894676648.mp3" preload="auto"></audio>
            <audio id="snd-howl" src="https://cdn.pixabay.com/audio/2023/09/11/audio_0344d9301f.mp3" preload="auto"></audio>
            <audio id="snd-heart" src="https://cdn.pixabay.com/audio/2024/02/13/audio_730222f96a.mp3" preload="auto"></audio>
            <audio id="snd-thunder" src="https://cdn.pixabay.com/audio/2022/03/15/audio_1c43f7a4df.mp3" preload="auto"></audio>
        </a-assets>

        <!-- --- ILUMINACIÓN Y ATMÓSFERA --- -->
        <a-sky id="cielo" color="#020205"></a-sky>
        
        <!-- Efecto de Lluvia -->
        <a-entity id="effect-rain" particle-system="preset: rain; color: #555; particleCount: 3000; size: 0.6; velocityValue: 0 12 0; opacity: 0.4;"></a-entity>
        
        <!-- Luz ambiental base -->
        <a-entity id="luz-ambiental" light="type: ambient; intensity: 0.15; color: #1a1a30"></a-entity>
        
        <!-- Luna distante -->
        <a-entity id="luz-luna" light="type: directional; intensity: 0.4; color: #7da5f5;" position="30 60 -90"></a-entity>
        
        <!-- Luz de Relámpago controlada por JS -->
        <a-entity id="luz-relampago" light="type: directional; intensity: 0; color: #fff;" position="0 100 0"></a-entity>

        <!-- Sonidos de ambiente -->
        <a-entity sound="src: #snd-rain; autoplay: true; loop: true; volume: 0.4;"></a-entity>
        <a-entity id="ent-snd-howl" sound="src: #snd-howl; autoplay: false; loop: false; volume: 0.9;"></a-entity>
        <a-entity id="ent-snd-thunder" sound="src: #snd-thunder; autoplay: false; loop: false; volume: 1;"></a-entity>

        <!-- Suelo Base de seguridad -->
        <a-plane rotation="-90 0 0" width="500" height="500" color="#010205" visible="false"></a-plane>

        <!-- Entorno del mapa -->
        <a-entity id="entorno" gltf-model="#pueblo-model" position="0 0 0"></a-entity>
        
        <!-- Punto de refugio (Meta) -->
        <a-entity id="refugio-target" position="17.4 0.5 16.5">
            <a-entity light="type: point; intensity: 1.5; distance: 8; color: #ffaa33;"></a-entity>
            <a-sphere radius="0.2" color="#ffaa33" material="shader: flat; fog: false" animation="property: material.opacity; from: 1; to: 0.4; dir: alternate; loop: true; dur: 1000"></a-sphere>
        </a-entity>

        <!-- --- RIG JUGADOR --- -->
        <a-entity id="player-rig" position="0 0 25">
            
            <a-entity id="avatar-container" position="0 0 0">
                <a-entity id="luis-mesh-walk" gltf-model="#luis-walk-src" visible="false" scale="0.38 0.38 0.38" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
                <a-entity id="luis-mesh-run" gltf-model="#luis-run-src" visible="false" scale="0.38 0.38 0.38" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
                <a-entity id="luis-mesh-llama" gltf-model="#luis-llama-src" visible="false" scale="0.38 0.38 0.38" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
                <a-entity id="luis-mesh-atento" gltf-model="#luis-atento-src" visible="true" scale="0.38 0.38 0.38" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
            
                <a-entity id="ent-snd-heart" sound="src: #snd-heart; autoplay: false; loop: true; volume: 0;"></a-entity>
            </a-entity>

            <!-- Sistema de Cámara -->
            <a-entity id="camera-yaw" rotation="0 0 0">
                <a-entity id="camera-pitch" rotation="-5 0 0">
                    <a-entity id="main-camera" camera="fov: 65; near: 0.1; far: 1000;" position="0 1.6 4">
                        <!-- Linterna integrada -->
                        <a-entity id="flashlight" light="type: spot; intensity: 1.5; distance: 25; angle: 35; penumbra: 0.3; color: #fffdec;" position="0.3 -0.2 -0.5">
                            <a-cylinder radius="0.03" height="0.15" color="#222" rotation="90 0 0"></a-cylinder>
                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- --- ENEMIGO: WEREWOLF --- -->
        <a-entity id="werewolf-rig" position="15 0 -10" scale="0.8 0.8 0.8">
            <a-entity id="ww-mesh-idle" gltf-model="#ww-idle-src" visible="true" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
            <a-entity id="ww-mesh-howl" gltf-model="#ww-howl-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 1;"></a-entity>
            <a-entity id="ww-mesh-beast" gltf-model="#ww-beast-src" visible="false" animation-mixer="clip: *; loop: repeat; timeScale: 1.2;"></a-entity>
            
            <a-entity id="ww-eyes-light" light="type: point; intensity: 0.8; distance: 2; color: #ff0000;" position="0 1.7 0.3"></a-entity>
            <a-entity id="ww-snd-pos" sound="src: #snd-howl; autoplay: false; loop: false; volume: 1; refDistance: 5;"></a-entity>
        </a-entity>

    </a-scene>

    <!-- ======= LÓGICA JAVASCRIPT TOTALMENTE SANEADA ======= -->
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN Y CONSTANTES DEL JUEGO
        // ==========================================
        const CONFIG = {
            velCaminar: 0.05,
            velCorrer: 0.1,
            rotacionCámaraMóvil: 0.005,
            rotacionCámaraFlechas: 0.03,
            suavizadoGiroAvatar: 0.15,
            staminaMax: 100,
            staminaGastoSprints: 0.4,
            staminaRecuperacion: 0.2,
            alturaOjos: 1.6,
            wwVelAcecho: 0.02,
            wwVelAtaque: 0.06,
            distDeteccionLobo: 25,
            distAtaqueLobo: 12,
            distMeleeLobo: 2.2,
            radioVictoria: 3.0,
            dañoMelee: 25
        };

        // ==========================================
        // 2. ESTADO GLOBAL DEL JUEGO
        // ==========================================
        const GAME_STATE = {
            assetsCargados: 0,
            totalAssets: 0,
            escenaIniciada: false,
            pos: new THREE.Vector3(0, 0, 25),
            respawnPos: new THREE.Vector3(0, 0, 25),
            salud: 100,
            stamina: 100,
            intentandoCorrer: false,
            modoCorrerActive: false,
            enCooldownSprint: false,
            inputMoviendo: false,
            isDead: false,
            loboPos: new THREE.Vector3(15, 0, -10),
            loboEstado: 'idle', 
            loboTimer: 0,
            lastFrameTime: 0
        };

        // ==========================================
        // 3. REFERENCIAS DOM / A-FRAME
        // ==========================================
        const UI = {
            loader: document.getElementById('custom-loader'),
            bar: document.getElementById('progress-bar'),
            status: document.getElementById('loader-status'),
            fade: document.getElementById('fade-screen'),
            alert: document.getElementById('alert-ui'),
            btnReset: document.getElementById('btn-reset'),
            btnSprint: document.getElementById('btn-sprint'),
            staminaBar: document.getElementById('stamina-bar'),
            damage: document.getElementById('damage-vignette')
        };

        const ENT = {
            scene: document.getElementById('escena-principal'),
            luzRelampago: document.getElementById('luz-relampago'),
            targetVictoria: document.getElementById('refugio-target'),
            rig: document.getElementById('player-rig'),
            avatar: document.getElementById('avatar-container'),
            camYaw: document.getElementById('camera-yaw'),
            camPitch: document.getElementById('camera-pitch'),
            camera: document.getElementById('main-camera'),
            meshes: {
                walk: document.getElementById('luis-mesh-walk'),
                run: document.getElementById('luis-mesh-run'),
                llama: document.getElementById('luis-mesh-llama'),
                atento: document.getElementById('luis-mesh-atento'),
                activeName: 'atento'
            },
            sndHeart: document.getElementById('ent-snd-heart'),
            sndThunder: document.getElementById('ent-snd-thunder'),
            wwRig: document.getElementById('werewolf-rig'),
            wwMeshes: {
                idle: document.getElementById('ww-mesh-idle'),
                howl: document.getElementById('ww-mesh-howl'),
                beast: document.getElementById('ww-mesh-beast'),
                activeName: 'idle'
            }
        };

        const INPUT = {
            keys: { w: false, a: false, s: false, d: false, shift: false },
            joyMove: { x: 0, y: 0 },
            arrowCam: { up: false, down: false, left: false, right: false },
            camYaw: 0,
            camPitch: -5,
            joyDragging: false,
            joyStartX: 0,
            joyStartY: 0
        };

        // ==========================================
        // 4. GESTIÓN DE CARGA (LOADER)
        // ==========================================
        function initLoader() {
            const assets = document.querySelectorAll('a-asset-item, audio');
            GAME_STATE.totalAssets = assets.length;
            
            if (GAME_STATE.totalAssets === 0) {
                setTimeout(startScene, 500);
                return;
            }

            UI.status.textContent = "Sincronizando entorno virtual...";

            assets.forEach(asset => {
                asset.addEventListener('loaded', onAssetLoaded);
                asset.addEventListener('error', onAssetLoaded);
            });

            setTimeout(() => {
                if (!GAME_STATE.escenaIniciada) startScene();
            }, 16000);
        }

        function onAssetLoaded() {
            GAME_STATE.assetsCargados++;
            const percent = Math.floor((GAME_STATE.assetsCargados / GAME_STATE.totalAssets) * 100);
            UI.bar.style.width = percent + '%';
            
            if (percent < 40) UI.status.textContent = "Cargando estructuras del mapa...";
            else if (percent < 80) UI.status.textContent = "Estabilizando mallas y animaciones...";
            else UI.status.textContent = "Preparando inicio de simulación...";

            if (GAME_STATE.assetsCargados >= GAME_STATE.totalAssets) {
                setTimeout(startScene, 600);
            }
        }

        // ==========================================
        // 5. INICIALIZACIÓN DE ESCENA Y MANEJADORES
        // ==========================================
        function startScene() {
            if (GAME_STATE.escenaIniciada) return;
            GAME_STATE.escenaIniciada = true;

            UI.loader.classList.add('hidden');
            
            initInputHandlers();
            
            GAME_STATE.lastFrameTime = performance.now();
            requestAnimationFrame(engineLoop);

            setInterval(triggerThunderstormEffect, 12000);
        }

        function initInputHandlers() {
            // Teclado PC
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'arrowup') INPUT.keys.w = true;
                if(k === 's' || k === 'arrowdown') INPUT.keys.s = true;
                if(k === 'a' || k === 'arrowleft') INPUT.keys.a = true;
                if(k === 'd' || k === 'arrowright') INPUT.keys.d = true;
                if(e.shiftKey) toggleSprint(true);
            });

            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'arrowup') INPUT.keys.w = false;
                if(k === 's' || k === 'arrowdown') INPUT.keys.s = false;
                if(k === 'a' || k === 'arrowleft') INPUT.keys.a = false;
                if(k === 'd' || k === 'arrowright') INPUT.keys.d = false;
                if(!e.shiftKey) toggleSprint(false);
            });

            UI.btnReset.addEventListener('click', resetGame);
            
            // Botón Sprint Móvil
            UI.btnSprint.addEventListener('touchstart', e => { e.preventDefault(); toggleSprint(true); });
            UI.btnSprint.addEventListener('touchend', e => { e.preventDefault(); toggleSprint(false); });

            // Configuración Joystick de Movimiento Móvil
            const knob = document.getElementById('joystick-knob');
            const container = document.getElementById('joystick-container');
            
            const handleJoyStart = (e) => {
                INPUT.joyDragging = true;
                const pageX = e.touches ? e.touches[0].pageX : e.pageX;
                const pageY = e.touches ? e.touches[0].pageY : e.pageY;
                const rect = container.getBoundingClientRect();
                INPUT.joyStartX = rect.left + rect.width / 2;
                INPUT.joyStartY = rect.top + rect.height / 2;
            };

            const handleJoyMove = (e) => {
                if (!INPUT.joyDragging) return;
                const pageX = e.touches ? e.touches[0].pageX : e.pageX;
                const pageY = e.touches ? e.touches[0].pageY : e.pageY;
                
                let dx = pageX - INPUT.joyStartX;
                let dy = pageY - INPUT.joyStartY;
                const maxLen = 40;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > maxLen) {
                    dx = (dx / dist) * maxLen;
                    dy = (dy / dist) * maxLen;
                }
                
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                INPUT.joyMove.x = dx / maxLen;
                INPUT.joyMove.y = dy / maxLen;
            };

            const handleJoyEnd = () => {
                INPUT.joyDragging = false;
                knob.style.transform = 'translate(0px, 0px)';
                INPUT.joyMove.x = 0;
                INPUT.joyMove.y = 0;
            };

            knob.addEventListener('touchstart', handleJoyStart);
            window.addEventListener('touchmove', handleJoyMove, {passive: false});
            window.addEventListener('touchend', handleJoyEnd);

            // Setup de Flechas de Cámara Móvil
            const setupArrow = (id, key) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', e => { e.preventDefault(); INPUT.arrowCam[key] = true; });
                btn.addEventListener('touchend', () => INPUT.arrowCam[key] = false);
            };
            setupArrow('btn-up', 'up'); 
            setupArrow('btn-down', 'down');
            setupArrow('btn-left', 'left'); 
            setupArrow('btn-right', 'right');
        }

        function toggleSprint(active) {
            if (active && GAME_STATE.stamina > 10 && !GAME_STATE.enCooldownSprint) {
                GAME_STATE.modoCorrerActive = true;
                UI.btnSprint.classList.add('active');
            } else {
                GAME_STATE.modoCorrerActive = false;
                UI.btnSprint.classList.remove('active');
            }
        }

        // ==========================================
        // 6. CAMBIO DINÁMICO DE MALLAS DE ANIMACIÓN
        // ==========================================
        function switchMesh(targetName) {
            if (ENT.meshes.activeName === targetName) return;
            ENT.meshes[ENT.meshes.activeName].setAttribute('visible', 'false');
            ENT.meshes[targetName].setAttribute('visible', 'true');
            ENT.meshes.activeName = targetName;
        }

        function switchWwMesh(targetName) {
            if (ENT.wwMeshes.activeName === targetName) return;
            ENT.wwMeshes[ENT.wwMeshes.activeName].setAttribute('visible', 'false');
            ENT.wwMeshes[targetName].setAttribute('visible', 'true');
            ENT.wwMeshes.activeName = targetName;
        }

        // ==========================================
        // 7. BUCLE PRINCIPAL DE RENDERIZADO Y LÓGICA
        // ==========================================
        function engineLoop(time) {
            const dt = (time - GAME_STATE.lastFrameTime) / 1000;
            GAME_STATE.lastFrameTime = time;

            if (!GAME_STATE.isDead) {
                updateCameraRotation();
                updatePlayerMovement();
                updateStamina();
                updateWerewolfAI(time);
                checkGameplayConditions();
            }

            requestAnimationFrame(engineLoop);
        }

        function updateCameraRotation() {
            if (INPUT.arrowCam.left) INPUT.camYaw += CONFIG.rotacionCámaraFlechas;
            if (INPUT.arrowCam.right) INPUT.camYaw -= CONFIG.rotacionCámaraFlechas;
            if (INPUT.arrowCam.up) INPUT.camPitch += CONFIG.rotacionCámaraFlechas * 40;
            if (INPUT.arrowCam.down) INPUT.camPitch -= CONFIG.rotacionCámaraFlechas * 40;

            INPUT.camPitch = Math.max(-45, Math.min(45, INPUT.camPitch));

            ENT.camYaw.setAttribute('rotation', `0 ${INPUT.camYaw * (180 / Math.PI)} 0`);
            ENT.camPitch.setAttribute('rotation', `${INPUT.camPitch} 0 0`);
        }

        function updatePlayerMovement() {
            let moveX = INPUT.joyMove.x;
            let moveZ = INPUT.joyMove.y;

            if (INPUT.keys.w) moveZ = -1;
            if (INPUT.keys.s) moveZ = 1;
            if (INPUT.keys.a) moveX = -1;
            if (INPUT.keys.d) moveX = 1;

            GAME_STATE.inputMoviendo = (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1);

            if (GAME_STATE.inputMoviendo) {
                let speed = GAME_STATE.modoCorrerActive ? CONFIG.velCorrer : CONFIG.velCaminar;
                
                let angle = INPUT.camYaw;
                let directionX = moveX * Math.cos(angle) + moveZ * Math.sin(angle);
                let directionZ = moveZ * Math.cos(angle) - moveX * Math.sin(angle);

                GAME_STATE.pos.x += directionX * speed;
                GAME_STATE.pos.z += directionZ * speed;
                ENT.rig.setAttribute('position', `${GAME_STATE.pos.x} 0 ${GAME_STATE.pos.z}`);

                let targetAngle = Math.atan2(directionX, directionZ) * (180 / Math.PI) + 180;
                let currentRot = ENT.avatar.getAttribute('rotation') || {x: 0, y: 0, z: 0};
                let smoothedY = currentRot.y + (targetAngle - currentRot.y) * CONFIG.suavizadoGiroAvatar;
                ENT.avatar.setAttribute('rotation', `0 ${smoothedY} 0`);

                if (GAME_STATE.modoCorrerActive) {
                    switchMesh('run');
                } else {
                    switchMesh('walk');
                }
            } else {
                switchMesh('atento');
            }
        }

        function updateStamina() {
            if (GAME_STATE.modoCorrerActive && GAME_STATE.inputMoviendo) {
                GAME_STATE.stamina = Math.max(0, GAME_STATE.stamina - CONFIG.staminaGastoSprints);
                if (GAME_STATE.stamina <= 0) {
                    toggleSprint(false);
                    GAME_STATE.enCooldownSprint = true;
                    UI.btnSprint.classList.add('cooldown');
                }
            } else {
                GAME_STATE.stamina = Math.min(CONFIG.staminaMax, GAME_STATE.stamina + CONFIG.staminaRecuperacion);
                if (GAME_STATE.stamina >= 30 && GAME_STATE.enCooldownSprint) {
                    GAME_STATE.enCooldownSprint = false;
                    UI.btnSprint.classList.remove('cooldown');
                }
            }
            UI.staminaBar.style.width = GAME_STATE.stamina + '%';
        }

        function updateWerewolfAI(time) {
            let loboRigPos = ENT.wwRig.getAttribute('position');
            GAME_STATE.loboPos.set(loboRigPos.x, loboRigPos.y, loboRigPos.z);

            let dist = GAME_STATE.pos.distanceTo(GAME_STATE.loboPos);

            if (dist < CONFIG.distDeteccionLobo && dist > CONFIG.distMeleeLobo) {
                switchWwMesh('beast');
                let dir = new THREE.Vector3().subVectors(GAME_STATE.pos, GAME_STATE.loboPos).normalize();
                let speed = dist < CONFIG.distAtaqueLobo ? CONFIG.wwVelAtaque : CONFIG.wwVelAcecho;
                
                GAME_STATE.loboPos.addScaledVector(dir, speed);
                ENT.wwRig.setAttribute('position', `${GAME_STATE.loboPos.x} 0 ${GAME_STATE.loboPos.z}`);
                
                let targetRot = Math.atan2(dir.x, dir.z) * (180 / Math.PI);
                ENT.wwRig.setAttribute('rotation', `0 ${targetRot} 0`);
            } else if (dist <= CONFIG.distMeleeLobo) {
                executeDamage();
            } else {
                switchWwMesh('idle');
            }
        }

        function checkGameplayConditions() {
            let targetPosStr = ENT.targetVictoria.getAttribute('position');
            let targetPos = new THREE.Vector3(targetPosStr.x, targetPosStr.y, targetPosStr.z);
            
            if (GAME_STATE.pos.distanceTo(targetPos) < CONFIG.radioVictoria) {
                GAME_STATE.isDead = true;
                UI.alert.style.borderColor = "var(--ui-green)";
                UI.alert.textContent = "¡SIMULACIÓN COMPLETADA! LOGRASTE ENTRAR AL REFUGIO 🏡✓";
                switchMesh('llama');
            }
        }

        function executeDamage() {
            GAME_STATE.salud = Math.max(0, GAME_STATE.salud - CONFIG.dañoMelee);
            UI.damage.classList.add('active');
            setTimeout(() => UI.damage.classList.remove('active'), 500);

            if (GAME_STATE.salud <= 0) {
                GAME_STATE.isDead = true;
                UI.alert.textContent = "💀 SINK DETECTED. HAS SIDO CAZADO. PRESIONA REINICIAR.";
            }
        }

        function triggerThunderstormEffect() {
            if (GAME_STATE.isDead) return;
            ENT.sndThunder.components.sound.playSound();
            ENT.luzRelampago.setAttribute('light', 'intensity: 3.5');
            setTimeout(() => {
                ENT.luzRelampago.setAttribute('light', 'intensity: 0');
                setTimeout(() => {
                    ENT.luzRelampago.setAttribute('light', 'intensity: 2');
                    setTimeout(() => {
                        ENT.luzRelampago.setAttribute('light', 'intensity: 0');
                    }, 150);
                }, 100);
            }, 200);
        }

        function resetGame() {
            UI.fade.style.opacity = '1';
            setTimeout(() => {
                GAME_STATE.salud = 100;
                GAME_STATE.stamina = 100;
                GAME_STATE.isDead = false;
                GAME_STATE.pos.copy(GAME_STATE.respawnPos);
                GAME_STATE.loboPos.set(15, 0, -10);
                
                ENT.rig.setAttribute('position', `${GAME_STATE.respawnPos.x} 0 ${GAME_STATE.respawnPos.z}`);
                ENT.wwRig.setAttribute('position', '15 0 -10');
                UI.alert.style.borderColor = "var(--ui-red)";
                UI.alert.textContent = "⚠️ NOCHE 1: SOBREVIVE. Busca el refugio iluminado 🏡";
                
                switchMesh('atento');
                switchWwMesh('idle');
                UI.fade.style.opacity = '0';
            }, 600);
        }

        window.addEventListener('DOMContentLoaded', initLoader);
    </script>
</body>
</html>
