<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐉 Drago 3D - Lab Luis</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#050505;
font-family:Arial,Helvetica,sans-serif;

}

/* Fondo animado */

body{

background:
radial-gradient(circle at top,#183b59,#09111d,#000000);

animation:fondo 15s linear infinite;

}

@keyframes fondo{

0%{
filter:hue-rotate(0deg);
}

100%{
filter:hue-rotate(360deg);
}

}

model-viewer{

width:100%;
height:100%;
background:transparent;

--poster-color:transparent;

}

/* Panel superior */

#panel{

position:absolute;

top:15px;

left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,.45);

backdrop-filter:blur(12px);

padding:14px 25px;

border-radius:15px;

color:white;

z-index:20;

text-align:center;

box-shadow:0 0 20px cyan;

}

#panel h1{

font-size:28px;

margin-bottom:8px;

}

#panel p{

font-size:15px;

opacity:.8;

}

/* Botones */

#botones{

position:absolute;

bottom:25px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:12px;

z-index:30;

flex-wrap:wrap;

justify-content:center;

}

button{

padding:12px 22px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:15px;

font-weight:bold;

background:#00bfff;

color:white;

transition:.3s;

}

button:hover{

background:#00ffff;

transform:scale(1.05);

}

button:active{

transform:scale(.95);

}

/* Créditos */

#creditos{

position:absolute;

bottom:10px;

right:15px;

color:white;

font-size:13px;

opacity:.7;

z-index:30;

}

</style>

</head>

<body>

<div id="panel">

<h1>🐉 Dragon 3D</h1>

<p>Modelo GLB interactivo</p>

</div>

<model-viewer

id="dragon"

src="dragon1.glb"

camera-controls

touch-action="pan-y"

shadow-intensity="2"

exposure="1.3"

environment-image="neutral"

auto-rotate

rotation-per-second="20deg"

camera-orbit="0deg 75deg 4m"

field-of-view="30deg"

min-camera-orbit="auto auto 2m"

max-camera-orbit="auto auto 10m"

interaction-prompt="auto"

loading="eager"

reveal="auto"

ar

>

</model-viewer>

<div id="botones">

<button onclick="rotar()">Rotación</button>

<button onclick="resetCam()">Reset Cámara</button>

<button onclick="fullscreen()">Pantalla completa</button>

</div>

<div id="creditos">

Lab Luis © 2026

</div>

<script>

const modelo=document.getElementById("dragon");

let girando=true;

function rotar(){

girando=!girando;

modelo.autoRotate=girando;

}

function resetCam(){

modelo.cameraOrbit="0deg 75deg 4m";

}

function fullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

</script>

</body>

</html>
