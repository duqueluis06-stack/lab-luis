<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon 3D</title>

<script type="module">
import { ModelViewerElement } from "https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js";
</script>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

model-viewer {
    width: 100%;
    height: 100%;
    background: linear-gradient(#1e293b, #020617);
}

#titulo {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    background: rgba(0, 0, 0, .5);
    color: white;
    border-radius: 15px;
    font-size: 28px;
    backdrop-filter: blur(10px);
    z-index: 100;
}

#menu {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 100;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #0ea5e9;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #38bdf8;
}
</style>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

<div id="titulo">
🐉 Dragon 3D
</div>

<model-viewer
    id="visor"
    src="dragon1.glb"
    alt="Dragon"
    camera-controls
    autoplay
    auto-rotate
    shadow-intensity="1"
    exposure="1.2"
    environment-image="neutral"
    camera-orbit="0deg 75deg 12m"
    camera-target="0m 4m 0m"
    field-of-view="45deg"
    min-camera-orbit="auto auto 2m"
    max-camera-orbit="auto auto 30m"
    interaction-prompt="auto"
    touch-action="pan-y"
    loading="eager"
    reveal="auto"
    ar>
</model-viewer>

<div id="menu">
    <button onclick="rotacion()">Rotación</button>
    <button onclick="reiniciar()">Reiniciar</button>
    <button onclick="pantallaCompleta()">Pantalla completa</button>
</div>

<script>
const visor = document.getElementById("visor");
let estado = true;

function rotacion() {
    estado = !estado;
    visor.autoRotate = estado;
}

function reiniciar() {
    // Ajustado para coincidir con la nueva distancia amplia de 12m
    visor.cameraOrbit = "0deg 75deg 12m";
    visor.cameraTarget = "0m 4m 0m";
}

function pantallaCompleta() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

visor.addEventListener("load", () => {
    console.log("Modelo cargado correctamente con animaciones habilitadas.");
});

visor.addEventListener("error", (e) => {
    console.error("No se pudo cargar dragon1.glb", e);
    alert("No se pudo cargar dragon1.glb");
});
</script>

</body>
</html>
