<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Animado 3D</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#0b1020;
}

model-viewer{
width:100%;
height:100%;
background:radial-gradient(circle,#1e293b,#020617);
}

#ui{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
padding:12px 20px;
background:rgba(0,0,0,.5);
color:white;
border-radius:12px;
backdrop-filter:blur(10px);
font-family:Arial;
z-index:10;
}
</style>
</head>

<body>

<div id="ui">🐉 Dragon Animado</div>

<model-viewer
id="dragon"
src="dragon1.glb"
camera-controls
auto-rotate
shadow-intensity="1"
environment-image="neutral"
camera-orbit="0deg 75deg 4m"
animation-name="*"
autoplay
interaction-prompt="auto"
>

</model-viewer>

<script>

const model = document.getElementById("dragon");

model.addEventListener("load", () => {

console.log("Modelo cargado");

console.log("Animaciones detectadas:", model.availableAnimations);

// 👇 reproduce la primera animación automáticamente
if (model.availableAnimations.length > 0) {
model.animationName = model.availableAnimations[0];
model.play();
}

});

</script>

</body>
</html>
