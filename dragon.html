<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor del Dragón</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Fondo transparente */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Escena y Cámara con perspectiva amplia
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // AJUSTE DE CÁMARA (PC vs MÓVIL): Aleja y posiciona la cámara para dar "aire" al vuelo
        if (window.innerWidth < 768) {
            camera.position.set(0, 6, 16); // Más cerca en móviles para que no se vea diminuto
        } else {
            camera.position.set(0, 8, 26); // Más alejado en PC para capturar las alas abiertas
        }

        // 2. Renderizador con Transparencia Habilitada (alpha: true)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 0); // Fuerza la transparencia del fondo
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 3. Controles de visualización
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // AJUSTE DEL PUNTO DE MIRA: Eleva el enfoque a la altura del vuelo (Eje Y = 5)
        // Evita que la cámara se quede mirando al suelo cuando el dragón sube
        controls.target.set(0, 5, 0); 

        // 4. Iluminación global para que el modelo se vea nítido desde cualquier ángulo
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 5. Carga limpia del archivo GLB
        let mixer;
        const loader = new GLTFLoader();

        loader.load(
            'dragon1.glb', // Tu archivo en la raíz
            (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // Posición base en el centro del escenario
                model.position.set(0, 0, 0);

                // Activar la animación de vuelo automáticamente
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            },
            undefined,
            (error) => {
                console.error("Error al cargar el modelo:", error);
            }
        );

        // 6. Bucle de renderizado continuo
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 7. Adaptación si el usuario gira el móvil o cambia el tamaño de pantalla
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            if (window.innerWidth < 768) {
                camera.position.set(0, 6, 16);
            } else {
                camera.position.set(0, 8, 26);
            }
        });
    </script>
</body>
</html>
