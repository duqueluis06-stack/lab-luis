<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador Electrónico Experimental</title>

<style>

body{
    margin:0;
    background:#0b0f14;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* Barra superior */

header{
    background:#111827;
    padding:20px;
    text-align:center;
    border-bottom:2px solid #00ffff;
}

header h1{
    margin:0;
    color:#00ffff;
    font-size:32px;
}

header p{
    color:#cbd5e1;
}

/* Panel lateral */

#panel{
    position:fixed;
    left:0;
    top:90px;
    width:220px;
    height:100%;
    background:#131a22;
    border-right:2px solid #00ffff;
    padding:15px;
}

/* Botones */

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#00ffff;
    border:none;
    color:black;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
    transition:0.3s;
}

button:hover{
    background:#00bcd4;
}

/* Área de simulación */

#workspace{
    margin-left:240px;
    padding:20px;
}

#grid{
    width:100%;
    height:700px;
    border:2px dashed #00ffff;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(#111 1px, transparent 1px),
    linear-gradient(90deg,#111 1px, transparent 1px);

    background-size:20px 20px;
}

/* Componentes */

.component{
    width:80px;
    height:40px;
    background:#1e293b;
    border:2px solid #00ffff;
    color:white;
    text-align:center;
    line-height:40px;
    border-radius:10px;
    position:absolute;
    cursor:move;
}

</style>
</head>

<body>

<header>
    <h1>⚡ Simulador Electrónico Experimental</h1>
    <p>Proyecto de laboratorio interactivo - Luis</p>
</header>

<!-- Panel -->

<div id="panel">

    <h3>Componentes</h3>

    <button onclick="crearLED()">Agregar LED</button>

    <button onclick="crearResistencia()">Agregar Resistencia</button>

</div>

<!-- Área -->

<div id="workspace">

    <h2>Área de Simulación</h2>

    <div id="grid"></div>

</div>

<script>

let contador = 0;

/* Crear LED */

function crearLED(){

    contador++;

    let led = document.createElement("div");

    led.className = "component";

    led.innerHTML = "LED";

    led.style.left = "50px";

    led.style.top = (50 + contador * 60) + "px";

    hacerMovible(led);

    document.getElementById("grid").appendChild(led);
}

/* Crear resistencia */

function crearResistencia(){

    contador++;

    let r = document.createElement("div");

    r.className = "component";

    r.innerHTML = "220Ω";

    r.style.left = "200px";

    r.style.top = (50 + contador * 60) + "px";

    hacerMovible(r);

    document.getElementById("grid").appendChild(r);
}

/* Movimiento */

function hacerMovible(elemento){

    let offsetX, offsetY, mover = false;

    elemento.addEventListener("mousedown", function(e){

        mover = true;

        offsetX = e.offsetX;

        offsetY = e.offsetY;
    });

    document.addEventListener("mousemove", function(e){

        if(mover){

            let rect = document.getElementById("grid").getBoundingClientRect();

            elemento.style.left = (e.clientX - rect.left - offsetX) + "px";

            elemento.style.top = (e.clientY - rect.top - offsetY) + "px";
        }
    });

    document.addEventListener("mouseup", function(){

        mover = false;
    });
}

</script>

</body>
</html>
