<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luiyi-Energy - Simulador Científico de Circuitos</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-panel: #0d1326;
            --bg-workspace: #0a0f1d;
            --cyan: #00ffff;
            --green: #39ff14;
            --red: #ff3131;
            --yellow: #ffde59;
            --text: #ffffff;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: var(--bg-panel);
            border-bottom: 2px solid var(--cyan);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            z-index: 100;
        }

        .logo { font-size: 22px; font-weight: bold; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
        .nav-buttons { display: flex; gap: 10px; }

        .btn {
            padding: 8px 14px;
            background: #1e293b;
            border: 1px solid var(--cyan);
            color: var(--text);
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 10px var(--cyan); }
        .btn-danger { border-color: var(--red); color: var(--red); }
        .btn-danger:hover { background: var(--red); color: #000; box-shadow: 0 0 10px var(--red); }

        #main-layout { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }

        #sidebar {
            width: 250px;
            background: var(--bg-panel);
            border-right: 2px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .comp-sect { font-size: 12px; color: var(--cyan); text-transform: uppercase; margin-bottom: 5px; }
        .comp-list { display: flex; flex-direction: column; gap: 8px; }
        
        .comp-item {
            background: #111a36;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .comp-item:hover { border-color: var(--cyan); background: #162247; }
        .comp-item svg { width: 40px; height: 25px; }

        #workspace-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #workspace {
            flex: 2;
            background-color: var(--bg-workspace);
            position: relative;
            background-image: radial-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 0);
            background-size: 25px 25px;
            overflow: hidden;
        }

        #dashboard-bottom {
            height: 220px;
            background: #090d1a;
            border-top: 2px solid var(--border);
            display: flex;
            padding: 10px;
            gap: 15px;
        }

        .panel-osc {
            flex: 1;
            background: #020408;
            border: 1px solid #1e293b;
            border-radius: 6px;
            position: relative;
            padding: 5px;
        }
        .panel-osc h5 { font-size: 11px; color: var(--green); margin-bottom: 2px; }
        .canvas-osc { width: 100%; height: calc(100% - 20px); background: #000; border: 1px solid #111c30; }

        #inspector-panel {
            background: #111a36;
            border: 1px solid var(--cyan);
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 12px;
        }
        #inspector-panel input {
            width: 100%; background: #060913; border: 1px solid var(--cyan);
            color: white; padding: 4px; margin-top: 4px;
        }

        #net-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .component {
            position: absolute; z-index: 5; cursor: move; padding: 5px;
            border: 1px solid transparent; background: rgba(13, 19, 38, 0.6);
            border-radius: 4px;
        }
        .component.selected { border: 1px solid var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        .component.burned { filter: grayscale(1) contrast(0.5); }

        .node-terminal {
            position: absolute; width: 10px; height: 10px;
            background: #475569; border: 1px solid #94a3b8;
            border-radius: 50%; cursor: crosshair; z-index: 10;
            pointer-events: auto;
        }
        .node-terminal:hover { background: var(--cyan); transform: scale(1.3); }
        .node-terminal.connected { background: var(--green); }

        .wire-path {
            stroke: #475569; stroke-width: 3; fill: none; pointer-events: stroke; cursor: pointer;
        }
        .wire-path:hover { stroke: var(--yellow); stroke-width: 4; }
        .wire-path.active-cc { stroke: var(--green); filter: drop-shadow(0 0 3px var(--green)); }
        .wire-path.active-ca { stroke: var(--cyan); stroke-dasharray: 6; animation: flow 0.5s linear infinite; }
        
        @keyframes flow { to { stroke-dashoffset: -12; } }

        .badge-val {
            position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
            font-size: 10px; background: #000; padding: 1px 4px; border-radius: 3px;
            white-space: nowrap; border: 1px solid #1e293b; color: var(--cyan);
        }
        
        .alert-box {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 49, 49, 0.9); color: black; font-weight: bold;
            padding: 8px 16px; border-radius: 4px; z-index: 500; display: none;
            box-shadow: 0 0 15px var(--red);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Luiyi-Energy <span style="font-size:11px; color:var(--yellow)">🔬 Mallas & FFT v3.2</span></div>
        <div class="nav-buttons">
            <button class="btn" onclick="undo()"><-- Deshacer</button>
            <button class="btn btn-danger" onclick="limpiarTodo()">🗑️ Limpiar</button>
            <button class="btn" onclick="window.location.href='index.html'">⬅ Salir (Index)</button>
        </div>
    </header>

    <div id="main-layout">
        <div id="sidebar">
            <div class="comp-sect">Generadores</div>
            <div class="comp-list">
                <div class="comp-item" onclick="crearComponente('bateria_cc')">⚡ Fuente CC</div>
                <div class="comp-item" onclick="crearComponente('bateria_ca')">🌊 Fuente CA</div>
            </div>
            <div class="comp-sect">Pasivos y Control</div>
            <div class="comp-list">
                <div class="comp-item" onclick="crearComponente('resistencia')">🟫 Resistencia</div>
                <div class="comp-item" onclick="crearComponente('interruptor')">🎛️ Interruptor</div>
            </div>
            <div class="comp-sect">Actuadores / Sensores</div>
            <div class="comp-list">
                <div class="comp-item" onclick="crearComponente('led')">🟢 Diodo LED</div>
                <div class="comp-item" onclick="crearComponente('motor')">⚙️ Motor CC</div>
                <div class="comp-item" onclick="crearComponente('ultrasonido')">🦇 Ultrasonido</div>
            </div>

            <div id="inspector-panel">
                <h4 style="color:var(--cyan); margin-bottom:8px;">Ajustes Nodo</h4>
                <div id="inspector-content"></div>
            </div>
        </div>

        <div id="workspace-container">
            <div id="alert-msg" class="alert-box"></div>
            
            <div id="workspace">
                <svg id="net-svg"></svg>
            </div>

            <div id="dashboard-bottom">
                <div class="panel-osc">
                    <h5>Osciloscopio (Tiempo Real)</h5>
                    <canvas id="canvas-time" class="canvas-osc"></canvas>
                </div>
                <div class="panel-osc">
                    <h5>Analizador de Espectro (FFT)</h5>
                    <canvas id="canvas-fft" class="canvas-osc"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS Y ESTADO GLOBAL ---
        let componentes = [];
        let cables = [];
        let historial = [];
        let compIdCounter = 0;
        let cableIdCounter = 0;
        
        let nodoOrigen = null;
        let cableTemporal = null;
        let compSeleccionado = null;

        const workspace = document.getElementById('workspace');
        const netSvg = document.getElementById('net-svg');

        // Configuraciones de tipo de componente
        const CONFIG_COMP = {
            bateria_cc: { name: "Fuente CC", width: 90, height: 50, bornes: [{id:'p', x:5, y:25}, {id:'n', x:85, y:25}], props: {v: 9, freq: 0}, html: `<svg viewBox="0 0 90 50"><rect x="15" y="10" width="60" height="30" fill="#1e293b" stroke="#00ffff" stroke-width="2"/><text x="25" y="28" fill="#fff" font-size="10">9V CC</text></svg>` },
            bateria_ca: { name: "Fuente CA", width: 90, height: 50, bornes: [{id:'p', x:5, y:25}, {id:'n', x:85, y:25}], props: {v: 12, freq: 50}, html: `<svg viewBox="0 0 90 50"><rect x="15" y="10" width="60" height="30" fill="#1e293b" stroke="#eab308" stroke-width="2"/><path d="M 30 25 Q 40 10 50 25 T 70 25" fill="none" stroke="#eab308" stroke-width="2"/></svg>` },
            resistencia: { name: "Resistencia", width: 100, height: 40, bornes: [{id:'1', x:5, y:20}, {id:'2', x:95, y:20}], props: {r: 220}, html: `<svg viewBox="0 0 100 40"><line x1="5" y1="20" x2="25" y2="20" stroke="#fff" stroke-width="2"/><rect x="25" y="10" width="50" height="20" fill="#b45309" stroke="#fff"/><line x1="75" y1="20" x2="95" y2="20" stroke="#fff" stroke-width="2"/></svg>` },
            interruptor: { name: "Interruptor", width: 80, height: 40, bornes: [{id:'1', x:5, y:20}, {id:'2', x:75, y:20}], props: {cerrado: false}, html: `<svg viewBox="0 0 80 40"><line x1="5" y1="20" x2="25" y2="20" stroke="#fff" stroke-width="2"/><circle cx="25" cy="20" r="3" fill="#fff"/><circle cx="55" cy="20" r="3" fill="#fff"/><line id="sw-line" x1="25" y1="20" x2="52" y2="5" stroke="#ff3131" stroke-width="3"/></svg>` },
            led: { name: "LED", width: 80, height: 50, bornes: [{id:'a', x:5, y:25}, {id:'c', x:75, y:25}], props: {color: "#39ff14", vdrop: 2.0}, html: `<svg viewBox="0 0 80 50"><line x1="5" y1="25" x2="25" y2="25" stroke="#fff"/><polygon points="25,15 45,25 25,35" fill="#475569"/><line x1="45" y1="15" x2="45" y2="35" stroke="#fff" stroke-width="2"/><line x1="45" y1="25" x2="75" y2="25" stroke="#fff"/><circle id="led-light" cx="35" cy="25" r="8" fill="none" stroke="#fff"/></svg>` },
            motor: { name: "Motor CC", width: 80, height: 60, bornes: [{id:'1', x:5, y:30}, {id:'2', x:75, y:30}], props: {r_int: 20}, html: `<svg viewBox="0 0 80 60"><circle cx="40" cy="30" r="20" fill="#1e293b" stroke="#39ff14" stroke-width="2"/><text x="33" y="36" fill="#fff" font-weight="bold">M</text></svg>` },
            ultrasonido: { name: "Ultrasonido", width: 90, height: 50, bornes: [{id:'vcc', x:5, y:15}, {id:'gnd', x:5, y:35}], props: {distancia: 100}, html: `<svg viewBox="0 0 90 50"><rect x="15" y="5" width="60" height="40" fill="#111c30" stroke="#ffde59"/><circle cx="30" cy="25" r="8" fill="#475569"/><circle cx="60" cy="25" r="8" fill="#475569"/></svg>` }
        };

        // --- INICIALIZACIÓN ---
        window.addEventListener('load', () => {
            guardarEstado();
            
            // Mouse Listeners para trazo de cables intermedios
            document.addEventListener('mousemove', arrastrarCableTemporal);
            document.addEventListener('mouseup', soltarCableTemporal);
            
            // Loop Principal de Simulación en Tiempo Real
            setInterval(motorSimulacionYGraficos, 50);
        });

        function guardarEstado() {
            if (historial.length > 20) historial.shift();
            historial.push(JSON.stringify({ componentes, cables }));
        }

        function undo() {
            if (historial.length > 1) {
                historial.pop(); // Remover estado actual
                let previo = JSON.parse(historial[historial.length - 1]);
                
                // Limpiar DOM anterior
                document.querySelectorAll('.component').forEach(e => e.remove());
                componentes = [];
                cables = previo.cables;
                
                previo.componentes.forEach(c => {
                    restaurarComponenteDOM(c);
                });
                redibujarCables();
            }
        }

        function limpiarTodo() {
            guardarEstado();
            componentes = [];
            cables = [];
            document.querySelectorAll('.component').forEach(e => e.remove());
            redibujarCables();
        }

        // --- CREACIÓN Y CONFIGURACIÓN DE COMPONENTES ---
        function crearComponente(tipo, x = 150, y = 150) {
            guardarEstado();
            compIdCounter++;
            let id = `${tipo}_${compIdCounter}`;
            let config = CONFIG_COMP[tipo];
            
            let nuevoComp = {
                id, tipo, x, y,
                props: JSON.parse(JSON.stringify(config.props)),
                v_in: 0, i_in: 0, quemado: false
            };
            
            componentes.push(nuevoComp);
            renderizarComponenteDOM(nuevoComp, config);
        }

        function restaurarComponenteDOM(c) {
            componentes.push(c);
            renderizarComponenteDOM(c, CONFIG_COMP[c.tipo]);
        }

        function renderizarComponenteDOM(comp, config) {
            let div = document.createElement('div');
            div.id = comp.id;
            div.className = 'component';
            div.style.left = comp.x + 'px';
            div.style.top = comp.y + 'px';
            div.style.width = config.width + 'px';
            div.style.height = config.height + 'px';
            div.innerHTML = config.html + `<div class="badge-val" id="val_${comp.id}"></div>`;

            // Agregar Terminales (Nodos Físicos)
            config.bornes.forEach(b => {
                let t = document.createElement('div');
                t.className = 'node-terminal';
                t.style.left = (b.x - 5) + 'px';
                t.style.top = (b.y - 5) + 'px';
                t.dataset.compId = comp.id;
                t.dataset.borneId = b.id;
                
                t.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    iniciarCable(comp.id, b.id, e);
                });
                div.appendChild(t);
            });

            workspace.appendChild(div);
            hacerArrastrable(div, comp);
            
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                seleccionarComponente(comp);
            });

            actualizarGraficosComponente(comp);
        }

        // --- INTERACCIÓN FÍSICA AVANZADA: ARRASTRE Y SNAP TO WIRE ---
        function hacerArrastrable(div, comp) {
            let arrastrando = false;
            let ox = 0, oy = 0;

            div.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('node-terminal')) return;
                arrastrando = true;
                let rect = workspace.getBoundingClientRect();
                ox = e.clientX - div.offsetLeft;
                oy = e.clientY - div.offsetTop;
                guardarEstado();
            });

            document.addEventListener('mousemove', (e) => {
                if (!arrastrando) return;
                let rect = workspace.getBoundingClientRect();
                comp.x = e.clientX - rect.left - ox;
                comp.y = e.clientY - rect.top - oy;
                
                div.style.left = comp.x + 'px';
                div.style.top = comp.y + 'px';
                
                redibujarCables();
            });

            document.addEventListener('mouseup', () => {
                if (arrastrando) {
                    arrastrando = false;
                    evaluarSnapToWire(comp);
                }
            });
        }

        // Detectar si el componente cae encima de un cable para auto-conectarlo (Snap-to-wire)
        function evaluarSnapToWire(comp) {
            let config = CONFIG_COMP[comp.tipo];
            if (config.bornes.length < 2) return;

            let compCx = comp.x + config.width/2;
            let compCy = comp.y + config.height/2;

            for (let i = 0; i < cables.length; i++) {
                let cb = cables[i];
                let p1 = obtenerPosBorne(cb.c1, cb.b1);
                let p2 = obtenerPosBorne(cb.c2, cb.b2);
                
                // Distancia del punto al segmento de recta del cable
                let dist = distPuntoALinea(compCx, compCy, p1.x, p1.y, p2.x, p2.y);
                if (dist < 20) {
                    // Cortar cable e intercalar el componente arrastrado en medio
                    let originalC2 = cb.c2;
                    let originalB2 = cb.b2;
                    
                    cb.c2 = comp.id;
                    cb.b1 = config.bornes[0].id; // Conectar terminal 1 del componente

                    cables.push({
                        id: ++cableIdCounter,
                        c1: comp.id, b1: config.bornes[1].id, // Conectar terminal 2
                        c2: originalC2, b2: originalB2
                    });

                    redibujarCables();
                    mostrarAlerta("🔌 Componente acoplado automáticamente al cable.");
                    break;
                }
            }
        }

        function distPuntoALinea(x, y, x1, y1, x2, y2) {
            let A = x - x1; let B = y - y1; let C = x2 - x1; let D = y2 - y1;
            let dot = A * C + B * D; let len_sq = C * C + D * D;
            let param = -1;
            if (len_sq != 0) param = dot / len_sq;
            let xx, yy;
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }
            let dx = x - xx; let dy = y - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // --- SISTEMA DE GESTIÓN DE CABLES (NODOS REALES) ---
        function iniciarCable(compId, borneId, e) {
            nodoOrigen = { compId, borneId };
            let pos = obtenerPosBorne(compId, borneId);
            
            cableTemporal = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            cableTemporal.setAttribute('x1', pos.x);
            cableTemporal.setAttribute('y1', pos.y);
            cableTemporal.setAttribute('x2', pos.x);
            cableTemporal.setAttribute('y2', pos.y);
            cableTemporal.setAttribute('stroke', 'var(--yellow)');
            cableTemporal.setAttribute('stroke-width', '2');
            cableTemporal.setAttribute('stroke-dasharray', '4');
            netSvg.appendChild(cableTemporal);
        }

        function arrastrarCableTemporal(e) {
            if (!cableTemporal) return;
            let rect = workspace.getBoundingClientRect();
            cableTemporal.setAttribute('x2', e.clientX - rect.left);
            cableTemporal.setAttribute('y2', e.clientY - rect.top);
        }

        function soltarCableTemporal(e) {
            if (!cableTemporal) return;
            
            let target = e.target;
            if (target.classList.contains('node-terminal')) {
                let c2 = target.dataset.compId;
                let b2 = target.dataset.borneId;
                
                if (c2 !== nodoOrigen.compId || b2 !== nodoOrigen.borneId) {
                    guardarEstado();
                    cables.push({
                        id: ++cableIdCounter,
                        c1: nodoOrigen.compId, b1: nodoOrigen.borneId,
                        c2: c2, b2: b2
                    });
                }
            }
            cableTemporal.remove();
            cableTemporal = null;
            nodoOrigen = null;
            redibujarCables();
        }

        function redibujarCables() {
            // Limpiar paths viejos
            document.querySelectorAll('.wire-path').forEach(w => w.remove());
            
            cables.forEach(c => {
                let p1 = obtenerPosBorne(c.c1, c.b1);
                let p2 = obtenerPosBorne(c.c2, c.b2);
                if (!p1 || !p2) return;

                let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                // Ruta Ortogonal Avanzada Estilo Crocodile
                let mx = (p1.x + p2.x) / 2;
                let d = `M ${p1.x} ${p1.y} L ${mx} ${p1.y} L ${mx} ${p2.y} L ${p2.x} ${p2.y}`;
                
                path.setAttribute('d', d);
                path.setAttribute('class', 'wire-path');
                
                // Mostrar flujo visual según tipo de señal activa
                let compAsociado = componentes.find(co => co.id === c.c1);
                if (compAsociado && compAsociado.i_in > 0.001) {
                    let genAC = componentes.some(g => g.tipo === 'bateria_ca');
                    path.classList.add(genAC ? 'active-ca' : 'active-cc');
                }

                // Borrar cable con clic directo
                path.addEventListener('click', (e) => {
                    e.stopPropagation();
                    guardarEstado();
                    cables = cables.filter(w => w.id !== c.id);
                    redibujarCables();
                });

                netSvg.appendChild(path);
            });
        }

        function obtenerPosBorne(compId, borneId) {
            let comp = componentes.find(c => c.id === compId);
            if (!comp) return null;
            let cfg = CONFIG_COMP[comp.tipo];
            let b = cfg.bornes.find(bo => bo.id === borneId);
            return { x: comp.x + b.x, y: comp.y + b.y };
        }

        // --- MOTOR CIENTÍFICO: RESOLUCIÓN DE LEYES DE KIRCHHOFF (MALLAS) ---
        function motorSimulacionYGraficos() {
            resolverCircuitoMallas();
            actualizarGraficadoresCientificos();
        }

        function resolverCircuitoMallas() {
            // Inicializar estados
            componentes.forEach(c => { c.v_in = 0; c.i_in = 0; });

            let fuentes = componentes.filter(c => c.tipo === 'bateria_cc' || c.tipo === 'bateria_ca');
            if (fuentes.length === 0 || cables.length === 0) return;

            // Detección simplificada de mallas unidas a fuentes de poder
            fuentes.forEach(f => {
                let rutaCerrada = encontrarLazoCerrado(f.id, 'p', f.id, 'n', new Set());
                if (rutaCerrada) {
                    // Calcular impedancia equivalente de la malla
                    let rTotal = 0;
                    let switchAbierto = false;
                    let hayAlterna = componentes.some(ca => ca.tipo === 'bateria_ca');

                    rutaCerrada.forEach(cId => {
                        let comp = componentes.find(co => co.id === cId);
                        if (comp.tipo === 'resistencia') rTotal += parseFloat(comp.props.r);
                        if (comp.tipo === 'led') rTotal += 15;
                        if (comp.tipo === 'motor') rTotal += parseFloat(comp.props.r_int);
                        if (comp.tipo === 'interruptor' && !comp.props.cerrado) switchAbierto = true;
                    });

                    if (switchAbierto) return;

                    // Manejo crítico de protección contra cortocircuitos puros
                    if (rTotal < 2) {
                        f.quemado = true;
                        rutaCerrada.forEach(cId => {
                            let comp = componentes.find(co => co.id === cId);
                            if(comp.tipo === 'led' || comp.tipo === 'motor') comp.quemado = true;
                        });
                        mostrarAlerta("💥 ¡EXPLOSIÓN POR CORTOCIRCUITO! Malla sin resistencia limitadora.");
                        return;
                    }

                    // Calcular corriente instantánea (Ohm aplicada a la malla)
                    let tGlobal = Date.now() / 1000;
                    let vInstantaneo = f.tipo === 'bateria_ca' 
                        ? parseFloat(f.props.v) * Math.sin(2 * Math.PI * parseFloat(f.props.freq) * tGlobal)
                        : parseFloat(f.props.v);

                    let corrienteCalculada = Math.abs(vInstantaneo / rTotal);

                    // Asignar variables eléctricas calculadas por mallas a los nodos
                    rutaCerrada.forEach(cId => {
                        let comp = componentes.find(co => co.id === cId);
                        comp.i_in = corrienteCalculada;
                        comp.v_in = corrienteCalculada * (comp.props.r || comp.props.r_int || 15);
                        
                        // ALERTA Y PROTECCIÓN: Uso erróneo de Motor CC en corriente alterna (CA)
                        if (comp.tipo === 'motor' && hayAlterna) {
                            comp.i_in = 0;
                            mostrarAlerta("⚠ ERROR CIENTÍFICO: El Motor CC no puede girar con Corriente Alterna (CA). Requiere rectificación.");
                        }
                    });
                }
            });
        }

        function encontrarLazoCerrado(currComp, currBorne, targetComp, targetBorne, visitados) {
            let clave = `${currComp}_${currBorne}`;
            if (visitados.has(clave)) return null;
            visitados.add(clave);

            let enlaces = cables.filter(c => (c.c1 === currComp && c.b1 === currBorne) || (c.c2 === currComp && c.b2 === currBorne));
            
            for (let i = 0; i < enlaces.length; i++) {
                let wire = enlaces[i];
                let nextComp = wire.c1 === currComp ? wire.c2 : wire.c1;
                let nextBorne = wire.c1 === currComp ? wire.b2 : wire.b1;

                if (nextComp === targetComp && nextBorne === targetBorne) {
                    return [currComp];
                }

                // Cruzar el componente internamente hacia su otro borne opuesto
                let cfg = CONFIG_COMP[componentes.find(co => co.id === nextComp).tipo];
                let otroBorne = cfg.bornes.find(b => b.id !== nextBorne);
                if (!otroBorne) continue;

                let camino = encontrarLazoCerrado(nextComp, otroBorne.id, targetComp, targetBorne, new Set(visitados));
                if (camino) {
                    return [currComp, ...camino];
                }
            }
            return null;
        }

        // --- ACTUALIZACIÓN GRÁFICA DE COMPONENTES ---
        function actualizarGraficosComponente(comp) {
            let div = document.getElementById(comp.id);
            if (!div) return;
            let badge = document.getElementById(`val_${comp.id}`);

            if (comp.quemado) {
                div.classList.add('burned');
                badge.innerHTML = "💥 FUNDIDO";
                badge.style.color = "var(--red)";
                return;
            }

            if (comp.tipo === 'led') {
                let luz = div.querySelector('#led-light');
                if (comp.i_in > 0.005) {
                    luz.setAttribute('fill', comp.props.color);
                    luz.style.filter = `drop-shadow(0 0 8px ${comp.props.color})`;
                } else {
                    luz.setAttribute('fill', 'none');
                    luz.style.filter = 'none';
                }
            }

            if (comp.tipo === 'interruptor') {
                let linea = div.querySelector('#sw-line');
                if (comp.props.cerrado) {
                    linea.setAttribute('x2', '55'); linea.setAttribute('y2', '20');
                    linea.setAttribute('stroke', 'var(--green)');
                } else {
                    linea.setAttribute('x2', '52'); linea.setAttribute('y2', '5');
                    linea.setAttribute('stroke', 'var(--red)');
                }
            }

            // Mostrar valores de telemetría en tiempo real debajo de los símbolos
            if (comp.tipo === 'resistencia') badge.innerHTML = `${comp.props.r} Ω<br>${(comp.i_in*1000).toFixed(1)}mA`;
            else if (comp.tipo === 'bateria_cc') badge.innerHTML = `${comp.props.v}V CC`;
            else if (comp.tipo === 'bateria_ca') badge.innerHTML = `${comp.props.v}V ${comp.props.freq}Hz`;
            else if (comp.tipo === 'motor') badge.innerHTML = comp.i_in > 0 ? `🔄 ${(comp.i_in*500).toFixed(0)} RPM` : "0 RPM";
            else if (comp.tipo === 'ultrasonido') badge.innerHTML = `🦇 ${comp.props.distancia} cm`;
            else badge.innerHTML = `${(comp.i_in*1000).toFixed(1)} mA`;
        }

        // --- INSPECTOR DE PROPIEDADES ---
        function seleccionarComponente(comp) {
            compSeleccionado = comp;
            document.querySelectorAll('.component').forEach(el => el.classList.remove('selected'));
            document.getElementById(comp.id).classList.add('selected');

            let panel = document.getElementById('inspector-panel');
            let content = document.getElementById('inspector-content');
            panel.style.display = 'block';

            if (comp.tipo === 'resistencia') {
                content.innerHTML = `<label>Resistencia (Ω):</label><input type="number" value="${comp.props.r}" oninput="modificarPropiedad('r', this.value)">`;
            } else if (comp.tipo === 'bateria_cc' || comp.tipo === 'bateria_ca') {
                content.innerHTML = `<label>Voltaje (V):</label><input type="number" value="${comp.props.v}" oninput="modificarPropiedad('v', this.value)">`;
                if(comp.tipo === 'bateria_ca') {
                    content.innerHTML += `<br><label>Frecuencia (Hz):</label><input type="number" value="${comp.props.freq}" oninput="modificarPropiedad('freq', this.value)">`;
                }
            } else if (comp.tipo === 'ultrasonido') {
                content.innerHTML = `<label>Distancia Eco (cm):</label><input type="range" min="10" max="400" value="${comp.props.distancia}" oninput="modificarPropiedad('distancia', this.value)">`;
            } else if (comp.tipo === 'interruptor') {
                content.innerHTML = `<button class="btn" style="width:100%" onclick="conmutarSwitch()">Cambiar Estado</button>`;
            } else {
                content.innerHTML = `<span>Nodo pasivo monitorizado sin parámetros mutables.</span>`;
            }
        }

        function modificarPropiedad(clave, valor) {
            if (compSeleccionado) {
                compSeleccionado.props[clave] = parseFloat(valor);
                actualizarGraficosComponente(compSeleccionado);
            }
        }

        function conmutarSwitch() {
            if (compSeleccionado && compSeleccionado.tipo === 'interruptor') {
                compSeleccionado.props.cerrado = !compSeleccionado.props.cerrado;
                actualizarGraficosComponente(compSeleccionado);
                redibujarCables();
            }
        }

        // --- OSCILOSCOPIO CIENTÍFICO Y SEÑALES FFT ---
        let historicoSenal = new Array(200).fill(0);

        function actualizarGraficadoresCientificos() {
            // Muestrear voltaje del componente actualmente seleccionado o del primero de la lista
            let compMuestreo = compSeleccionado || componentes[0];
            let voltajeActual = compMuestreo ? compMuestreo.v_in : 0;
            
            // Si el ultrasonido está activo, simular modulación por rebote sónico
            let ultra = componentes.find(u => u.tipo === 'ultrasonido');
            if (ultra && compMuestreo && compMuestreo.id === ultra.id) {
                let t = Date.now() / 100;
                voltajeActual = 5 * Math.sin(t) * (ultra.props.distancia / 400); 
            }

            historicoSenal.push(voltajeActual);
            if (historicoSenal.length > 200) historicoSenal.shift();

            // 1. Dibujar Gráfico del Osciloscopio (Tiempo Real)
            let cTime = document.getElementById('canvas-time');
            let ctxT = cTime.getContext('2d');
            ctxT.clearRect(0,0,cTime.width, cTime.height);
            
            // Cuadrícula
            ctxT.strokeStyle = '#051622'; ctxT.lineWidth = 1;
            for(let i=0; i<cTime.width; i+=30) { ctxT.beginPath(); ctxT.moveTo(i,0); ctxT.lineTo(i,cTime.height); ctxT.stroke(); }
            for(let j=0; j<cTime.height; j+=20) { ctxT.beginPath(); ctxT.moveTo(0,j); ctxT.lineTo(cTime.width,j); ctxT.stroke(); }

            // Trazo
            ctxT.strokeStyle = 'var(--green)'; ctxT.lineWidth = 2;
            ctxT.beginPath();
            for (let i = 0; i < historicoSenal.length; i++) {
                let x = (i / historicoSenal.length) * cTime.width;
                let y = cTime.height / 2 - (historicoSenal[i] * 4); // Escalar señal
                if (i === 0) ctxT.moveTo(x, y); else ctxT.lineTo(x, y);
            }
            ctxT.stroke();

            // 2. Dibujar Espectro de Frecuencias (Simulación FFT)
            let cFft = document.getElementById('canvas-fft');
            let ctxF = cFft.getContext('2d');
            ctxF.clearRect(0,0,cFft.width, cFft.height);
            
            ctxF.fillStyle = 'var(--cyan)';
            let fuenteCA = componentes.find(c => c.tipo === 'bateria_ca');
            let fFund = fuenteCA ? parseFloat(fuenteCA.props.freq) : 0;

            // Renderizar armónicos simulados de la FFT matemática
            for (let i = 1; i < 15; i++) {
                let barX = i * 20;
                let barH = 0;
                if (fFund > 0 && compMuestreo && compMuestreo.i_in > 0) {
                    if (i === 2) barH = cFft.height * 0.7; // Frecuencia fundamental
                    if (i === 4) barH = cFft.height * 0.2; // Segundo armónico distorsión mallas
                } else if (compMuestreo && compMuestreo.tipo === 'ultrasonido') {
                    barH = (compMuestreo.props.distancia % (i+1)) * 3; // Eco ultrasónico
                }
                ctxF.fillRect(barX, cFft.height - barH, 12, barH);
            }

            // Refrescar todos los componentes por loops asíncronos
            componentes.forEach(c => actualizarGraficosComponente(c));
        }

        // --- SISTEMA DE ALERTAS FLOTANTES ---
        function mostrarAlerta(txt) {
            let box = document.getElementById('alert-msg');
            box.innerText = txt;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }
    </script>
</body>
