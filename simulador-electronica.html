<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ SPICE MNA Engine Studio v18.0 - Professional Circuit Simulator</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-sidebar: #0d1222;
            --bg-grid: #02040a;
            --cyan: #00f2fe;
            --green: #39ff14;
            --red: #ff3131;
            --yellow: #f59e0b;
            --magenta: #f43f5e;
            --border: #1e293b;
            --text: #f3f4f6;
            --text-muted: #64748b;
            --panel-bg: rgba(13, 18, 34, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Fira Code', 'Segoe UI', monospace; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        header {
            height: 45px; background: var(--bg-sidebar); border-bottom: 2px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7); z-index: 1000;
        }
        .brand { font-size: 11px; font-weight: 900; color: var(--cyan); letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .engine-badge { font-size: 9px; background: rgba(0,242,254,0.07); padding: 2px 6px; border: 1px solid rgba(0,242,254,0.3); border-radius: 4px; color: var(--cyan); white-space: nowrap; }
        .exit-btn { background: #1e293b; border: 1px solid var(--red); color: var(--red); font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; cursor: pointer; }

        #container { display: flex; flex: 1; height: calc(100vh - 45px); overflow: hidden; position: relative; flex-direction: column; }
        
        #sidebar {
            position: absolute; bottom: 0; left: 0; width: 100%; max-height: 50%; 
            background: var(--bg-sidebar); border-top: 2px solid var(--border); border-right: none;
            padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 800;
            transition: transform 0.3s ease; transform: translateY(calc(100% - 35px));
        }
        #sidebar.open { transform: translateY(0); }
        
        .drag-handle-bar {
            width: 100%; height: 35px; background: #111827; position: absolute; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold;
            color: var(--cyan); border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .sidebar-content { margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }

        .group-title { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 2px; margin-top: 5px; }
        
        .toolbox-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 6px;
        }
        .comp-btn {
            background: #040712; border: 1px solid var(--border); padding: 8px; border-radius: 6px;
            cursor: pointer; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: space-between;
        }

        #viewport { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-grid); overflow: hidden; height: 100%; }
        
        #sandbox {
            flex: 1; position: relative; overflow: hidden; 
            background-image: linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none; 
        }
        
        #wire-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 10; overflow: visible;
        }

        .spice-node {
            position: absolute; z-index: 100; border-radius: 6px;
            background: rgba(10, 16, 32, 0.95); border: 2px solid #2e3d59; padding: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 4px;
            transform-origin: center center;
            touch-action: none;
        }
        .spice-node.selected { border-color: var(--cyan) !important; box-shadow: 0 0 15px rgba(0,242,254,0.35); }
        .spice-node.hot { border-color: var(--red) !important; background: #3b0707 !important; animation: jitter 0.1s infinite alternate; }
        .spice-node.destroyed { filter: grayscale(1) brightness(0.2); border-color: #000 !important; pointer-events: none; }
        
        @keyframes jitter { from { transform: translate(0.5px, 0.5px); } to { transform: translate(-0.5px, -0.5px); } }

        .net-pin {
            position: absolute; width: 24px; height: 24px; background: transparent;
            z-index: 500; display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }
        .net-pin::after {
            content: ''; width: 12px; height: 12px; background: #02040a;
            border: 2px solid #64748b; border-radius: 50%; display: block;
            transition: transform 0.1s;
        }
        .net-pin.linked::after { background: var(--cyan); border-color: #fff; box-shadow: 0 0 8px var(--cyan); }
        .pin-lbl { position: absolute; font-size: 8px; color: var(--text-muted); font-weight: bold; pointer-events: none; z-index: 550;}

        .node-telemetry { 
            font-size: 9px; background: #000; border: 1px solid var(--border); 
            padding: 2px 5px; border-radius: 3px; color: #fff; 
            white-space: nowrap; text-align: center; margin-top: auto;
        }

        .wire-shadow { fill: none; stroke: #1e293b; stroke-width: 4; stroke-linecap: round; }
        .wire-active { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 5px var(--green)); }
        .wire-dots { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 18; animation: moveDots 0.4s linear infinite; }
        @keyframes moveDots { to { stroke-dashoffset: -24; } }

        #console-bottom {
            height: 100px; background: var(--bg-sidebar); border-top: 2px solid var(--border);
            display: flex; padding: 6px; gap: 8px; z-index: 300;
            margin-bottom: 35px;
        }
        .console-card { background: #02050c; border: 1px solid var(--border); border-radius: 6px; padding: 6px; flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
        .console-title { font-size: 8px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #111827; padding-bottom: 2px; }
        .matrix-row { font-family: 'Fira Code', monospace; font-size: 9px; color: #a7f3d0; white-space: pre; line-height: 1.2; }

        #spice-inspector {
            position: absolute; z-index: 2000; background: var(--panel-bg); border: 2px solid var(--cyan);
            padding: 12px; border-radius: 6px; width: 280px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            left: 50% !important; top: 40% !important; transform: translate(-50%, -50%) !important;
        }
        .row-ins { margin-bottom: 8px; }
        .row-ins label { display: block; font-size: 9px; color: var(--text-muted); font-weight: bold; margin-bottom: 2px; text-transform: uppercase; }
        .row-ins input { width: 100%; background: #020408; border: 1px solid #2e3d59; color: #fff; padding: 6px; font-size: 12px; }
        .apply-btn { width: 100%; background: var(--cyan); border: none; padding: 8px; color: #000; font-weight: bold; font-size: 11px; cursor: pointer; text-transform: uppercase; border-radius: 4px; }

        .purgue-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--red); color: #fff; padding: 6px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; margin-top: 5px; width: 100%; }

        .rotor-container { border: 2px dashed var(--magenta); border-radius: 50%; margin: 2px auto; display: flex; align-items: center; justify-content: center; }
        .bulb-glass { border-radius: 50% 50% 30% 30%; border: 2px solid #475569; margin: 2px auto; position: relative; }
        .filame { position: absolute; border: 1px solid #475569; border-bottom: none; border-radius: 50% 50% 0 0; }
    </style>
</head>
<body>

    <header>
        <div class="brand">🔬 MNA-CORE v18.0</div>
        <div class="nav-right">
            <div class="engine-badge" id="engine-status">MNA: OK</div>
            <button class="exit-btn" onclick="alert('Laboratorio cerrado.');">🚪 SALIR</button>
        </div>
    </header>

    <div id="container">
        <div id="viewport">
            <div id="spice-inspector">
                <div id="inspector-fields"></div>
                <button class="apply-btn" onclick="applyNodeSettings()">Estampar Netlist</button>
            </div>

            <div id="sandbox">
                <svg id="wire-layer" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>

            <div id="console-bottom">
                <div class="console-card">
                    <div class="console-title">📁 Netlist Vectorial</div>
                    <div class="matrix-row" id="netlist-view" style="color:var(--text-muted)">Nodos...</div>
                </div>
                <div class="console-card" style="flex: 1.2;">
                    <div class="console-title">📋 Matriz [A] · [X] = [Z]</div>
                    <div class="matrix-row" id="matrix-view">Esperando lazo...</div>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <div class="drag-handle-bar" onclick="toggleSidebar()">🧰 CAJA DE COMPONENTES (TAP AQUÍ)</div>
            <div class="sidebar-content">
                <div class="group-title">Nodos de Potencial Activo</div>
                <div class="toolbox-grid">
                    <div class="comp-btn" onclick="addSpiceComponent('nice_power')"><span>📟 Fuente DC</span><b style="color:var(--cyan)">V</b></div>
                    <div class="comp-btn" onclick="addSpiceComponent('gnd_node')"><span>⏚ Tierra</span><b style="color:var(--green)">GND</b></div>
                </div>

                <div class="group-title">Conductancias Pasivas</div>
                <div class="toolbox-grid">
                    <div class="comp-btn" onclick="addSpiceComponent('resistencia')"><span>🟫 Resistor</span><b style="color:#fef08a">R</b></div>
                    <div class="comp-btn" onclick="addSpiceComponent('switch_cuchilla')"><span>🎛️ Interruptor</span><b style="color:var(--yellow)">SW</b></div>
                </div>

                <div class="group-title">Semiconductores y Cargas</div>
                <div class="toolbox-grid">
                    <div class="comp-btn" onclick="addSpiceComponent('led_verde')"><span>🟢 Diodo LED</span><b style="color:var(--green)">LED</b></div>
                    <div class="comp-btn" onclick="addSpiceComponent('motor_dc')"><span>🌀 Motor DC</span><b style="color:var(--magenta)">MOT</b></div>
                    <div class="comp-btn" onclick="addSpiceComponent('foco_edison')"><span>💡 Lámpara</span><b style="color:var(--yellow)">BULB</b></div>
                </div>

                <button class="purgue-btn" onclick="purgueNetlist()">Limpiar Todo el Circuito</button>
            </div>
        </div>
    </div>

    <script>
        // --- CORE STATE ---
        let netNodes = [];
        let conexiones = [];
        let globalId = 0;

        let activeWirePin = null;
        let svgGuide = null;
        let activeSelectedNode = null;

        const sandbox = document.getElementById('sandbox');
        const wireLayer = document.getElementById('wire-layer');
        const inspector = document.getElementById('spice-inspector');
        const sidebar = document.getElementById('sidebar');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }

        // --- ARQUETIPOS DE COMPONENTES AVANZADOS SPICE ---
        const SPICE_ARQUETYPES = {
            nice_power: { w: 140, h: 75, render: (n) => `
                <div style="font-size:8px; font-weight:bold; color:var(--cyan);">VOLTAGE_SRC (E)</div>
                <div style="background:#000; color:var(--green); font-size:12px; text-align:center; padding:2px; font-family:monospace; margin-top:2px; border-radius:3px;">${n.ajustes.v.toFixed(1)} V</div>
                <div class="net-pin" id="pin_${n.id}_p" data-pin="p" style="left:-12px; top:25px;" title="Ánodo (+)"></div>
                <div class="net-pin" id="pin_${n.id}_n" data-pin="n" style="right:-12px; top:25px;" title="Cátodo (-)"></div>
                <span class="pin-lbl" style="left:14px; top:30px; color:var(--red)">+</span><span class="pin-lbl" style="right:14px; top:30px;">-</span>
            `},
            gnd_node: { w: 90, h: 55, render: (n) => `
                <div style="font-size:8px; font-weight:bold; color:var(--green); text-align:center;">⏚ GROUND</div>
                <div style="font-size:8px; font-family:monospace; text-align:center; margin-top:4px; color:var(--text-muted)">NODE_0</div>
                <div class="net-pin" id="pin_${n.id}_g" data-pin="g" style="left:33px; top:-12px;"></div>
            `},
            resistencia: { w: 120, h: 65, render: (n) => `
                <div style="font-size:8px; font-weight:bold; color:#fef08a;">RESISTOR (G)</div>
                <div style="background:#000; text-align:center; font-size:11px; font-family:monospace; padding:2px; margin-top:3px; border-radius:3px;">${n.ajustes.r} 𝛀</div>
                <div class="net-pin" id="pin_${n.id}_a" data-pin="a" style="left:-12px; top:20px;"></div>
                <div class="net-pin" id="pin_${n.id}_b" data-pin="b" style="right:-12px; top:20px;"></div>
            `},
            switch_cuchilla: { w: 120, h: 65, render: (n) => `
                <div style="font-size:7px; font-weight:bold; color:var(--text-muted); text-transform:uppercase;">SWITCH</div>
                <div style="text-align:center; font-weight:bold; font-size:10px; margin-top:4px; color:${n.ajustes.open?'var(--red)':'var(--green)'}">${n.ajustes.open?'ABIERTO':'CERRADO'}</div>
                <div class="net-pin" id="pin_${n.id}_1" data-pin="1" style="left:-12px; top:20px;"></div>
                <div class="net-pin" id="pin_${n.id}_2" data-pin="2" style="right:-12px; top:20px;"></div>
            `},
            led_verde: { w: 120, h: 80, render: (n) => `
                <div style="font-size:7px; font-weight:bold; color:var(--green); text-align:center;">DIODE_LED</div>
                <div id="lit_${n.id}" style="width:20px; height:20px; border-radius:50%; background:rgba(57,255,20,0.02); border:2px solid #334155; margin:3px auto;"></div>
                <div class="net-pin" id="pin_${n.id}_an" data-pin="an" style="left:-12px; top:30px;"></div>
                <div class="net-pin" id="pin_${n.id}_ca" data-pin="ca" style="right:-12px; top:30px;"></div>
                <span class="pin-lbl" style="left:12px; top:32px;">A</span><span class="pin-lbl" style="right:12px; top:32px;">K</span>
            `},
            motor_dc: { w: 120, h: 85, render: (n) => `
                <div style="font-size:7px; font-weight:bold; color:var(--magenta); text-align:center;">DC_MOTOR</div>
                <div class="rotor-container" id="rot_${n.id}" style="width:28px; height:28px; transform: rotate(${n.angulo || 0}deg);">
                    <div style="width:2px; height:22px; background:var(--magenta);"></div>
                </div>
                <div class="net-pin" id="pin_${n.id}_m1" data-pin="m1" style="left:-12px; top:30px;"></div>
                <div class="net-pin" id="pin_${n.id}_m2" data-pin="m2" style="right:-12px; top:30px;"></div>
            `},
            foco_edison: { w: 120, h: 85, render: (n) => `
                <div style="font-size:7px; font-weight:bold; color:var(--yellow); text-align:center;">EDISON_BULB</div>
                <div class="bulb-glass" id="bg_${n.id}" style="width:26px; height:26px;">
                    <div class="filame" id="fil_${n.id}" style="width:10px; height:12px; top:10px; left:6px;"></div>
                </div>
                <div class="net-pin" id="pin_${n.id}_t1" data-pin="t1" style="left:-12px; top:30px;"></div>
                <div class="net-pin" id="pin_${n.id}_t2" data-pin="t2" style="right:-12px; top:30px;"></div>
            `}
        };

        // --- MANEJO DE NODOS DE CONTROL ---
        function addSpiceComponent(tipo) {
            globalId++;
            let n = {
                id: `${tipo}_${globalId}`, tipo, x: 60, y: 80, angulo: 0,
                fused: false, overheating: false, v_drop: 0, current: 0, temp: 20,
                ajustes: tipo==='nice_power' ? { v: 12 } :
                         tipo==='resistencia' ? { r: 220, max_p: 0.5 } :
                         tipo==='switch_cuchilla' ? { open: true } :
                         tipo==='motor_dc' ? { max_current: 2.0 } :
                         tipo==='foco_edison' ? { r_nominal: 15, w_max: 40 } : {}
            };
            netNodes.push(n);
            injectNodeToDOM(n);
            sidebar.classList.remove('open');
        }

        function getEventCoords(e) {
            if (e.touches && e.touches.length > 0) {
                return { cx: e.touches[0].clientX, cy: e.touches[0].clientY };
            }
            return { cx: e.clientX, cy: e.clientY };
        }

        function injectNodeToDOM(n) {
            let conf = SPICE_ARQUETYPES[n.tipo];
            let div = document.createElement('div');
            div.id = n.id; div.className = 'spice-node';
            div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
            div.style.width = conf.w + 'px'; div.style.height = conf.h + 'px';
            div.innerHTML = conf.render(n) + `<div class="node-telemetry" id="tel_${n.id}">0.00V / 0.0mA</div>`;

            div.querySelectorAll('.net-pin').forEach(pin => {
                const onPinStart = (e) => {
                    e.stopPropagation(); e.preventDefault();
                    startNetWiring(n.id, pin.dataset.pin);
                };
                pin.addEventListener('mousedown', onPinStart);
                pin.addEventListener('touchstart', onPinStart, { passive: false });
            });

            const onDragStart = (e) => {
                if(e.target.classList.contains('net-pin')) return;
                activeSelectedNode = n;
                document.querySelectorAll('.spice-node').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');

                let coords = getEventCoords(e);
                let dx = coords.cx - n.x; let dy = coords.cy - n.y;
                
                function drag(ev) {
                    let c = getEventCoords(ev);
                    n.x = c.cx - dx; n.y = c.cy - dy;
                    div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
                    drawNetlistWires();
                }
                function drop() {
                    document.removeEventListener('mousemove', drag);
                    document.removeEventListener('touchmove', drag);
                    document.removeEventListener('mouseup', drop);
                    document.removeEventListener('touchend', drop);
                    drawNetlistWires();
                    solveCircuitMNA();
                }
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', drop);
                document.addEventListener('touchend', drop);
            };

            div.addEventListener('mousedown', onDragStart);
            div.addEventListener('touchstart', onDragStart, { passive: false });

            let touchStartTime = 0;
            div.addEventListener('touchstart', () => touchStartTime = Date.now(), {passive:true});

            const triggerAction = (e) => {
                e.stopPropagation();
                if (Date.now() - touchStartTime > 250) return;
                if(n.tipo === 'switch_cuchilla') {
                    n.ajustes.open = !n.ajustes.open;
                    updateNodeGraphics(n);
                    solveCircuitMNA();
                } else {
                    openInspector(n, e);
                }
            };
            div.addEventListener('click', triggerAction);

            sandbox.appendChild(div);
            drawNetlistWires();
            solveCircuitMNA();
        }

        function updateNodeGraphics(n) {
            let div = document.getElementById(n.id); if(!div) return;
            let savedTel = div.querySelector('.node-telemetry')?.outerHTML || '';
            div.innerHTML = SPICE_ARQUETYPES[n.tipo].render(n) + savedTel;
            div.querySelectorAll('.net-pin').forEach(pin => {
                const handler = (e) => {
                    e.stopPropagation(); e.preventDefault();
                    startNetWiring(n.id, pin.dataset.pin);
                };
                pin.addEventListener('mousedown', handler);
                pin.addEventListener('touchstart', handler, { passive: false });
            });
            refreshPinStates();
        }

        function startNetWiring(compId, pinName) {
            activeWirePin = { compId, pinName };
            let coord = getPinCoords(compId, pinName);
            if(!coord) return;

            svgGuide = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            svgGuide.setAttribute('x1', coord.x); svgGuide.setAttribute('y1', coord.y);
            svgGuide.setAttribute('x2', coord.x); svgGuide.setAttribute('y2', coord.y);
            svgGuide.setAttribute('stroke', 'var(--cyan)'); svgGuide.setAttribute('stroke-width', '3');
            wireLayer.appendChild(svgGuide);

            function dragWire(e) {
                let r = sandbox.getBoundingClientRect();
                let c = getEventCoords(e);
                svgGuide.setAttribute('x2', c.cx - r.left);
                svgGuide.setAttribute('y2', c.cy - r.top);
            }
            
            function dropWire(e) {
                document.removeEventListener('mousemove', dragWire);
                document.removeEventListener('touchmove', dragWire);
                document.removeEventListener('mouseup', dropWire);
                document.removeEventListener('touchend', dropWire);
                
                let c = (e.changedTouches && e.changedTouches.length > 0) ? 
                        {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY} : 
                        {x: e.clientX, y: e.clientY};
                        
                let targetPin = document.elementFromPoint(c.x, c.y);
                if (targetPin && !targetPin.classList.contains('net-pin')) {
                    targetPin = targetPin.closest('.net-pin');
                }
                
                if(targetPin && targetPin.classList.contains('net-pin')) {
                    let targetCompId = targetPin.parentElement.id;
                    let targetPinName = targetPin.dataset.pin;
                    
                    if(targetCompId !== activeWirePin.compId) {
                        let existe = conexiones.some(w => 
                            (w.m1 === activeWirePin.compId && w.p1 === activeWirePin.pinName && w.m2 === targetCompId && w.p2 === targetPinName) ||
                            (w.m2 === activeWirePin.compId && w.p2 === activeWirePin.pinName && w.m1 === targetCompId && w.p1 === targetPinName)
                        );
                        if(!existe) {
                            conexiones.push({
                                id: `w_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
                                m1: activeWirePin.compId, p1: activeWirePin.pinName,
                                m2: targetCompId, p2: targetPinName,
                                hasCurrent: false
                            });
                        }
                    }
                }
                if(svgGuide) { svgGuide.remove(); svgGuide = null; }
                activeWirePin = null;
                drawNetlistWires();
                solveCircuitMNA();
            }
            document.addEventListener('mousemove', dragWire);
            document.addEventListener('touchmove', dragWire, { passive: false });
            document.addEventListener('mouseup', dropWire);
            document.addEventListener('touchend', dropWire);
        }

        function drawNetlistWires() {
            wireLayer.innerHTML = '';
            conexiones.forEach(w => {
                let c1 = getPinCoords(w.m1, w.p1);
                let c2 = getPinCoords(w.m2, w.p2);
                if(!c1 || !c2) return;

                let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                let pathStr = `M ${c1.x} ${c1.y} L ${c2.x} ${c2.y}`;

                let shadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                shadow.setAttribute('d', pathStr);
                shadow.setAttribute('class', w.hasCurrent ? 'wire-active' : 'wire-shadow');
                g.appendChild(shadow);

                if(w.hasCurrent) {
                    let dots = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    dots.setAttribute('d', pathStr);
                    dots.setAttribute('class', 'wire-dots');
                    g.appendChild(dots);
                }
                wireLayer.appendChild(g);
            });
            refreshPinStates();
        }

        function refreshPinStates() {
            document.querySelectorAll('.net-pin').forEach(p => p.classList.remove('linked'));
            conexiones.forEach(w => {
                let p1 = document.getElementById(`pin_${w.m1}_${w.p1}`);
                let p2 = document.getElementById(`pin_${w.m2}_${w.p2}`);
                if(p1) p1.classList.add('linked');
                if(p2) p2.classList.add('linked');
            });
        }

        function getPinCoords(nodeId, pinId) {
            let el = document.getElementById(`pin_${nodeId}_${pinId}`); if(!el) return null;
            let rect = el.getBoundingClientRect();
            let pRect = sandbox.getBoundingClientRect();
            return {
                x: rect.left - pRect.left + (rect.width / 2),
                y: rect.top - pRect.top + (rect.height / 2)
            };
        }

        function purgueNetlist() {
            conexiones = []; netNodes = [];
            wireLayer.innerHTML = '';
            document.querySelectorAll('.spice-node').forEach(el => el.remove());
            solveCircuitMNA();
            sidebar.classList.remove('open');
        }

        // --- SOLUCIONADOR MODIFICADO DE NODOS MNA (SPICE ENGINE) ---
        function solveCircuitMNA() {
            if (netNodes.length === 0) {
                printDebugInfo([], [], 0, {});
                return;
            }

            netNodes.forEach(n => {
                n.v_drop = 0; n.current = 0;
                if(!n.fused) n.overheating = false;
                let tel = document.getElementById(`tel_${n.id}`); if(tel) tel.innerText = "0.00V / 0.0mA";
            });
            conexiones.forEach(w => w.hasCurrent = false);

            let pinToNodeMap = {};
            let nodeIndexCounter = 1;

            let gndNodes = netNodes.filter(n => n.tipo === 'gnd_node' && !n.fused);
            gndNodes.forEach(g => { pinToNodeMap[`${g.id}_g`] = 0; });

            conexiones.forEach(w => {
                let k1 = `${w.m1}_${w.p1}`; let k2 = `${w.m2}_${w.p2}`;
                let n1 = pinToNodeMap[k1]; let n2 = pinToNodeMap[k2];

                if(n1 !== undefined && n2 !== undefined) {
                    if(n1 !== n2) {
                        for(let k in pinToNodeMap) { if(pinToNodeMap[k] === n2) pinToNodeMap[k] = n1; }
                    }
                } else if(n1 !== undefined) { pinToNodeMap[k2] = n1; } 
                  else if(n2 !== undefined) { pinToNodeMap[k1] = n2; } 
                  else {
                    pinToNodeMap[k1] = nodeIndexCounter; pinToNodeMap[k2] = nodeIndexCounter;
                    nodeIndexCounter++;
                }
            });

            netNodes.forEach(n => {
                let div = document.getElementById(n.id); if(!div) return;
                div.querySelectorAll('.net-pin').forEach(p => {
                    let k = `${n.id}_${p.dataset.pin}`;
                    if(pinToNodeMap[k] === undefined) pinToNodeMap[k] = nodeIndexCounter++;
                });
            });

            let numNodosElectricos = nodeIndexCounter;
            let fuentesDeVoltaje = netNodes.filter(n => n.tipo === 'nice_power' && !n.fused);
            let numFuentes = fuentesDeVoltaje.length;

            let dim = numNodosElectricos + numFuentes;
            if(dim <= 1 || netNodes.length === 0) { printDebugInfo([], [], numNodosElectricos, {}); return; }

            let A = Array.from({length: dim}, () => Array(dim).fill(0));
            let Z = Array(dim).fill(0);

            netNodes.forEach(n => {
                if(n.fused) return;
                if(n.tipo === 'resistencia') {
                    stampConductance(A, pinToNodeMap[`${n.id}_a`], pinToNodeMap[`${n.id}_b`], 1 / parseFloat(n.ajustes.r));
                }
                if(n.tipo === 'switch_cuchilla') {
                    stampConductance(A, pinToNodeMap[`${n.id}_1`], pinToNodeMap[`${n.id}_2`], n.ajustes.open ? 1e-12 : 1e5);
                }
                if(n.tipo === 'motor_dc') {
                    stampConductance(A, pinToNodeMap[`${n.id}_m1`], pinToNodeMap[`${n.id}_m2`], 1 / 12);
                }
                if(n.tipo === 'foco_edison') {
                    let rDinamica = n.ajustes.r_nominal * (1 + (n.temp - 20) * 0.005);
                    stampConductance(A, pinToNodeMap[`${n.id}_t1`], pinToNodeMap[`${n.id}_t2`], 1 / rDinamica);
                }
            });

            let ledComponents = netNodes.filter(n => n.tipo === 'led_verde' && !n.fused);
            let v_led_prev = ledComponents.map(() => 0.7);
            let converged = false;
            let X = Array(dim).fill(0);

            for(let iter = 0; iter < 20; iter++) {
                let A_iter = A.map(row => [...row]); let Z_iter = [...Z];

                ledComponents.forEach((n, idx) => {
                    let nA = pinToNodeMap[`${n.id}_an`]; let nK = pinToNodeMap[`${n.id}_ca`];
                    let Vd = v_led_prev[idx];
                    let gd = (1e-14 / 0.026) * Math.exp(Vd / 0.026);
                    if(gd < 1e-9) gd = 1e-9; if(gd > 1e4) gd = 1e4;
                    let Ieq = 1e-14 * (Math.exp(Vd / 0.026) - 1) - gd * Vd;
                    stampConductance(A_iter, nA, nK, gd); stampCurrentSource(Z_iter, nA, nK, Ieq);
                });

                fuentesDeVoltaje.forEach((f, idx) => {
                    let nP = pinToNodeMap[`${f.id}_p`]; let nN = pinToNodeMap[`${f.id}_n`];
                    let kIdx = numNodosElectricos + idx;
                    if(nP > 0) { A_iter[nP][kIdx] += 1; A_iter[kIdx][nP] += 1; }
                    if(nN > 0) { A_iter[nN][kIdx] -= 1; A_iter[kIdx][nN] -= 1; }
                    Z_iter[kIdx] = f.ajustes.v;
                });

                X = solveLinearSystem(A_iter, Z_iter);
                if(!X) {
                    document.getElementById('engine-status').innerText = "ERR: SINGULARIDAD";
                    document.getElementById('engine-status').style.color = "var(--red)";
                    return;
                }

                let err = 0;
                ledComponents.forEach((n, idx) => {
                    let nA = pinToNodeMap[`${n.id}_an`]; let nK = pinToNodeMap[`${n.id}_ca`];
                    let Vd_new = (nA > 0 ? X[nA] : 0) - (nK > 0 ? X[nK] : 0);
                    let diff = Math.abs(Vd_new - v_led_prev[idx]);
                    if(diff > err) err = diff; v_led_prev[idx] = Vd_new;
                });
                if(err < 1e-5 || ledComponents.length === 0) { converged = true; break; }
            }

            if(converged || ledComponents.length === 0) {
                document.getElementById('engine-status').innerText = "MNA: OK";
                document.getElementById('engine-status').style.color = "var(--green)";
            }

            netNodes.forEach(n => {
                if(n.fused) return;

                if(n.tipo === 'resistencia') {
                    let nA = pinToNodeMap[`${n.id}_a`]; let nB = pinToNodeMap[`${n.id}_b`];
                    n.v_drop = Math.abs((nA > 0 ? X[nA] : 0) - (nB > 0 ? X[nB] : 0));
                    n.current = n.v_drop / parseFloat(n.ajustes.r);
                    let p = n.current * n.v_drop;
                    if(p > n.ajustes.max_p) { n.overheating = true; n.temp += p * 0.8; if(n.temp > 150) n.fused = true; }
                    displayTelemetry(n, n.v_drop, n.current);
                }
                if(n.tipo === 'motor_dc') {
                    let n1 = pinToNodeMap[`${n.id}_m1`]; let n2 = pinToNodeMap[`${n.id}_m2`];
                    n.v_drop = Math.abs((n1 > 0 ? X[n1] : 0) - (n2 > 0 ? X[n2] : 0));
                    n.current = n.v_drop / 12;
                    if(n.current > n.ajustes.max_current) n.fused = true;
                    displayTelemetry(n, n.v_drop, n.current);
                }
                if(n.tipo === 'foco_edison') {
                    let n1 = pinToNodeMap[`${n.id}_t1`]; let n2 = pinToNodeMap[`${n.id}_t2`];
                    n.v_drop = Math.abs((n1 > 0 ? X[n1] : 0) - (n2 > 0 ? X[n2] : 0));
                    let rDinamica = n.ajustes.r_nominal * (1 + (n.temp - 20) * 0.005);
                    n.current = n.v_drop / rDinamica;
                    let p = n.v_drop * n.current;
                    n.temp += p * 0.4;
                    if(p > n.ajustes.w_max * 1.4) n.fused = true;
                    displayTelemetry(n, n.v_drop, n.current);
                }
                if(n.tipo === 'led_verde') {
                    let nA = pinToNodeMap[`${n.id}_an`]; let nK = pinToNodeMap[`${n.id}_ca`];
                    n.v_drop = (nA > 0 ? X[nA] : 0) - (nK > 0 ? X[nK] : 0);
                    n.current = 1e-14 * (Math.exp(n.v_drop / 0.026) - 1);
                    if(n.current > 0.08) n.fused = true;
                    displayTelemetry(n, n.v_drop, n.current);
                }
                if(n.tipo === 'nice_power') {
                    let idx = fuentesDeVoltaje.findIndex(f => f.id === n.id);
                    n.current = Math.abs(X[numNodosElectricos + idx] || 0);
                    displayTelemetry(n, n.ajustes.v, n.current);
                }
            });

            conexiones.forEach(w => {
                let pNode = pinToNodeMap[`${w.m1}_${w.p1}`];
                if(pNode !== undefined && pNode > 0 && X) w.hasCurrent = Math.abs(X[pNode]) > 0.01;
            });

            printDebugInfo(A, Z, numNodosElectricos, pinToNodeMap);
            updatePhysicalIndicators();
        }

        function stampConductance(M, nA, nB, G) {
            if(nA > 0) M[nA][nA] += G; if(nB > 0) M[nB][nB] += G;
            if(nA > 0 && nB > 0) { M[nA][nB] -= G; M[nB][nA] -= G; }
        }

        function stampCurrentSource(V, nA, nK, Ieq) {
            if(nA > 0) V[nA] -= Ieq; if(nK > 0) V[nK] += Ieq;
        }

        function solveLinearSystem(A, Z) {
            let n = Z.length;
            if (n === 0) return null;
            for (let i = 0; i < n; i++) A[i].push(Z[i]);
            for (let i = 0; i < n; i++) {
                let maxEl = Math.abs(A[i][i]); let maxRow = i;
                for (let k = i + 1; k < n; k++) { if (Math.abs(A[k][i]) > maxEl) { maxEl = Math.abs(A[k][i]); maxRow = k; } }
                for (let k = i; k < n + 1; k++) { let tmp = A[maxRow][k]; A[maxRow][k] = A[i][k]; A[i][k] = tmp; }
                if (Math.abs(A[i][i]) < 1e-12) return null;
                for (let k = 0; k < n; k++) {
                    if (k !== i) {
                        let c = -A[k][i] / A[i][i];
                        for (let j = i; j < n + 1; j++) { if (i === j) A[k][j] = 0; else A[k][j] += c * A[i][j]; }
                    }
                }
            }
            let res = Array(n).fill(0);
            for (let i = 0; i < n; i++) res[i] = A[i][n] / A[i][i];
            return res;
        }

        function displayTelemetry(n, v, i) {
            let tel = document.getElementById(`tel_${n.id}`); if(!tel) return;
            if(i < 0) i = 0;
            tel.innerText = `${v.toFixed(1)}V / ${i >= 1 ? i.toFixed(1)+'A' : (i*1000).toFixed(0)+'mA'}`;
        }

        function updatePhysicalIndicators() {
            netNodes.forEach(n => {
                let div = document.getElementById(n.id); if(!div) return;
                if(n.fused) { div.className = 'spice-node destroyed'; return; }
                if(n.overheating) div.classList.add('hot'); else div.classList.remove('hot');

                if(n.tipo === 'led_verde') {
                    let core = div.querySelector(`#lit_${n.id}`);
                    if(core) {
                        if(n.v_drop >= 1.8) {
                            let f = Math.min(1, (n.v_drop - 1.8) / 0.5);
                            core.style.background = `rgba(57, 255, 20, ${f})`; core.style.boxShadow = `0 0 ${20*f}px var(--green)`;
                        } else { core.style.background = 'none'; core.style.boxShadow = 'none'; }
                    }
                }

                if(n.tipo === 'foco_edison') {
                    let fil = div.querySelector(`#fil_${n.id}`);
                    let glass = div.querySelector(`#bg_${n.id}`);
                    if(fil && glass) {
                        if(n.v_drop > 1) {
                            let factor = Math.min(1, n.v_drop / 12);
                            fil.style.borderColor = `rgb(255, ${140 + (115*factor)}, 0)`;
                            glass.style.boxShadow = `0 0 ${25 * factor}px var(--yellow)`;
                            glass.style.background = `rgba(245, 158, 11, ${factor * 0.35})`;
                        } else { fil.style.borderColor = '#475569'; glass.style.boxShadow = 'none'; glass.style.background = 'none'; }
                    }
                }

                if(n.tipo === 'motor_dc') {
                    if(n.v_drop > 0.5) {
                        n.angulo = (n.angulo + (n.v_drop * 3.5)) % 360;
                        let rot = div.querySelector(`#rot_${n.id}`);
                        if(rot) rot.style.transform = `rotate(${n.angulo}deg)`;
                    }
                }
            });
        }

        function printDebugInfo(M, V, count, mapping) {
            let netView = document.getElementById('netlist-view');
            let matView = document.getElementById('matrix-view');
            if(!netView || !matView) return;
            if(netNodes.length === 0) { netView.innerText = "Vacío."; matView.innerText = "Nula."; return; }

            let netStr = ""; for(let k in mapping) { netStr += `[${k}]->MNA:${mapping[k]}\n`; }
            netView.innerText = netStr;

            if(!M || M.length === 0) { matView.innerText = "Esperando lazo..."; return; }
            let matStr = "";
            for(let i=0; i<M.length; i++) {
                if (M[i]) {
                    matStr += `[R_${i}] │ ${M[i].map(v => v.toExponential(1).padStart(7)).join(" ")} │ Z=${V[i] !== undefined ? V[i].toExponential(1) : 0}\n`;
                }
            }
            matView.innerText = matStr;
        }

        function openInspector(n, e) {
            activeSelectedNode = n;
            inspector.style.display = 'block';

            let fields = document.getElementById('inspector-fields');
            if(n.tipo === 'nice_power') {
                fields.innerHTML = `<div class="row-ins"><label>Voltaje DC (V):</label><input type="number" id="val_v" value="${n.ajustes.v}"></div>`;
            } else if(n.tipo === 'resistencia') {
                fields.innerHTML = `
                    <div class="row-ins"><label>Resistencia (𝛀):</label><input type="number" id="val_r" value="${n.ajustes.r}"></div>
                    <div class="row-ins"><label>Potencia Máx (W):</label><input type="number" id="val_p" value="${n.ajustes.max_p}"></div>`;
            } else if(n.tipo === 'foco_edison') {
                fields.innerHTML = `<div class="row-ins"><label>Resistencia Nominal (𝛀):</label><input type="number" id="val_rn" value="${n.ajustes.r_nominal}"></div>`;
            } else {
                fields.innerHTML = `<p style="font-size:10px; color:var(--text-muted); text-align:center; padding:10px 0;">Componente de silicio fijo.</p>`;
            }
        }

        function applyNodeSettings() {
            if(activeSelectedNode) {
                if(activeSelectedNode.tipo === 'nice_power') activeSelectedNode.ajustes.v = parseFloat(document.getElementById('val_v').value) || 0;
                if(activeSelectedNode.tipo === 'resistencia') {
                    activeSelectedNode.ajustes.r = parseFloat(document.getElementById('val_r').value) || 1;
                    activeSelectedNode.ajustes.max_p = parseFloat(document.getElementById('val_p').value) || 0.1;
                }
                if(activeSelectedNode.tipo === 'foco_edison') activeSelectedNode.ajustes.r_nominal = parseFloat(document.getElementById('val_rn').value) || 1;
                updateNodeGraphics(activeSelectedNode);
            }
            inspector.style.display = 'none'; solveCircuitMNA();
        }

        window.addEventListener('load', () => {
            sandbox.addEventListener('click', () => inspector.style.display = 'none');
            sandbox.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
            
            setInterval(() => {
                netNodes.forEach(n => { if(n.temp > 20) n.temp -= 0.5; });
                solveCircuitMNA();
            }, 50);
        });
    </script>
</body>
