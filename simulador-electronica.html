```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador Electrónico Futurista</title>

<style>

body{
    margin:0;
    background:#050816;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* TÍTULO */

header{
    height:70px;
    background:#08111f;
    border-bottom:2px solid cyan;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:cyan;
    box-shadow:0 0 20px cyan;
}

/* PANEL */

#panel{
    position:fixed;
    left:0;
    top:70px;
    width:220px;
    height:100%;
    background:#0c1422;
    border-right:2px solid cyan;
    padding:15px;
}

/* BOTONES */

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00ffcc;
    transform:scale(1.03);
}

/* ÁREA */

#workspace{
    margin-left:240px;
    margin-top:20px;
    width:calc(100% - 260px);
    height:85vh;
    border:2px solid cyan;

    background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

    background-size:25px 25px;

    position:relative;
    overflow:hidden;
}

/* COMPONENTES */

.component{
    position:absolute;
    cursor:move;
    user-select:none;
}

/* EFECTOS */

.led svg{
    filter:drop-shadow(0 0 20px lime);
}

.resistencia svg{
    filter:drop-shadow(0 0 12px orange);
}

.bateria svg{
    filter:drop-shadow(0 0 12px red);
}

</style>

</head>

<body>

<header>
⚡ Simulador Electrónico Futurista
</header>

<!-- PANEL -->

<div id="panel">

<h2>Componentes</h2>

<button onclick="crearLED()">Agregar LED</button>

<button onclick="crearResistencia()">Agregar Resistencia</button>

<button onclick="crearBateria()">Agregar Batería</button>

<button onclick="simular()">Simular Circuito</button>

</div>

<!-- ÁREA -->

<div id="workspace"></div>

<script>

let z = 1;

/* MOVER COMPONENTES */

function hacerMovible(elemento){

    let mover = false;
    let offsetX, offsetY;

    elemento.addEventListener('mousedown', function(e){

        mover = true;

        z++;

        elemento.style.zIndex = z;

        offsetX = e.offsetX;
        offsetY = e.offsetY;

    });

    document.addEventListener('mousemove', function(e){

        if(!mover) return;

        let area = document
        .getElementById('workspace')
        .getBoundingClientRect();

        elemento.style.left =
        (e.clientX - area.left - offsetX) + 'px';

        elemento.style.top =
        (e.clientY - area.top - offsetY) + 'px';

    });

    document.addEventListener('mouseup', function(){

        mover = false;

    });
}

/* LED */

function crearLED(){

    let led = document.createElement('div');

    led.className = 'component led';

    led.innerHTML = `

    <svg width="80" height="80">

        <circle
        cx="40"
        cy="40"
        r="25"
        fill="lime"
        stroke="white"
        stroke-width="3"/>

    </svg>

    `;

    led.style.left = '100px';
    led.style.top = '100px';

    document.getElementById('workspace')
    .appendChild(led);

    hacerMovible(led);
}

/* RESISTENCIA */

function crearResistencia(){

    let r = document.createElement('div');

    r.className = 'component resistencia';

    r.innerHTML = `

    <svg width="140" height="60">

        <line
        x1="0"
        y1="30"
        x2="30"
        y2="30"
        stroke="white"
        stroke-width="4"/>

        <rect
        x="30"
        y="15"
        width="80"
        height="30"
        rx="8"
        fill="#c7925b"
        stroke="#6b3e1d"
        stroke-width="3"/>

        <line
        x1="110"
        y1="30"
        x2="140"
        y2="30"
        stroke="white"
        stroke-width="4"/>

    </svg>

    `;

    r.style.left = '250px';
    r.style.top = '140px';

    document.getElementById('workspace')
    .appendChild(r);

    hacerMovible(r);
}

/* BATERÍA */

function crearBateria(){

    let b = document.createElement('div');

    b.className = 'component bateria';

    b.innerHTML = `

    <svg width="100" height="80">

        <rect
        x="20"
        y="15"
        width="60"
        height="50"
        fill="#222"
        stroke="red"
        stroke-width="3"/>

        <line
        x1="35"
        y1="5"
        x2="35"
        y2="20"
        stroke="white"
        stroke-width="4"/>

        <line
        x1="65"
        y1="0"
        x2="65"
        y2="25"
        stroke="white"
        stroke-width="4"/>

    </svg>

    `;

    b.style.left = '400px';
    b.style.top = '180px';

    document.getElementById('workspace')
    .appendChild(b);

    hacerMovible(b);
}

/* SIMULACIÓN */

function simular(){

    alert("⚡ Motor de simulación próximamente");

}

</script>

</body>
</html>
```
