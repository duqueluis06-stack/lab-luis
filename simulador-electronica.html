<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 SPICE MNA Mobile Studio v18.5</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-sidebar: #0d1222;
            --bg-grid: #02040a;
            --cyan: #00f2fe;
            --green: #39ff14;
            --red: #ff3131;
            --yellow: #f59e0b;
            --magenta: #f43f5e;
            --border: #1e293b;
            --text: #f3f4f6;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        header {
            height: 50px; background: var(--bg-sidebar); border-bottom: 2px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-size: 13px; font-weight: 900; color: var(--cyan); letter-spacing: 0.5px; }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .engine-badge { font-size: 11px; background: rgba(0,242,254,0.07); padding: 4px 8px; border: 1px solid rgba(0,242,254,0.3); border-radius: 4px; color: var(--cyan); }
        
        .exit-btn { 
            background: #111827; border: 1px solid var(--red); color: var(--red); 
            font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 6px; 
            cursor: pointer; touch-action: manipulation;
        }
        .exit-btn:active { background: rgba(255, 49, 49, 0.2); }

        #main-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        #viewport { 
            position: relative; 
            background: var(--bg-grid); 
            height: 380px; 
            width: 100%;
            border-bottom: 2px solid var(--border);
        }
        
        #sandbox {
            width: 100%;
            height: 100%;
            position: relative; 
            overflow: hidden; 
            background-image: linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 25px 25px;
            touch-action: none; 
        }
        
        #wire-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 10;
        }

        /* --- COMPONENTES --- */
        .spice-node {
            position: absolute; z-index: 100; border-radius: 8px;
            background: rgba(13, 18, 34, 0.95); border: 2px solid #2e3d59; padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 4px;
            touch-action: none;
        }
        .spice-node.selected { border-color: #475569 !important; }
        .spice-node.destroyed { filter: grayscale(1) brightness(0.3); border-color: #000 !important; }

        /* --- PINES GRANDES FÁCILES DE TOCAR CON EL PULGAR --- */
        .net-pin {
            position: absolute; width: 36px; height: 36px; background: transparent;
            z-index: 500; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
        }
        .net-pin::after {
            content: ''; width: 14px; height: 14px; background: #02040a;
            border: 2px solid #64748b; border-radius: 50%; transition: all 0.2s;
        }
        /* Estado cuando lo seleccionas para cablear */
        .net-pin.wiring-source::after {
            background: var(--cyan); border-color: #fff; box-shadow: 0 0 15px var(--cyan); transform: scale(1.3);
        }
        .net-pin.linked::after { background: var(--green); border-color: #fff; }
        .pin-lbl { position: absolute; font-size: 10px; color: var(--text-muted); font-weight: bold; pointer-events: none; }

        .node-telemetry { 
            font-size: 10px; background: #000; border: 1px solid var(--border); 
            padding: 3px; border-radius: 4px; color: #fff; text-align: center; margin-top: auto;
            font-family: monospace;
        }

        .wire-shadow { fill: none; stroke: #334155; stroke-width: 4; stroke-linecap: round; }
        .wire-active { fill: none; stroke: var(--cyan); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--cyan)); }
        .wire-dots { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 18; animation: moveDots 0.4s linear infinite; }
        @keyframes moveDots { to { stroke-dashoffset: -24; } }

        #mobile-toolbox {
            background: var(--bg-sidebar); padding: 15px; border-bottom: 2px solid var(--border);
        }
        .section-title { font-size: 11px; color: var(--cyan); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        .scroll-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-row::-webkit-scrollbar { height: 4px; }
        .scroll-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .mobile-btn {
            background: #040712; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px;
            font-size: 12px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px;
            white-space: nowrap; flex-shrink: 0; touch-action: manipulation;
        }

        #mobile-console {
            background: #02050c; padding: 12px; display: flex; flex-direction: column; gap: 12px;
        }
        .console-box {
            background: rgba(6, 9, 19, 0.7); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
        }
        .box-title { font-size: 10px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .matrix-output { font-family: monospace; font-size: 11px; color: #a7f3d0; white-space: pre; overflow-x: auto; }

        /* --- MENÚ DE INSPECCIÓN E INSTRUCCIONES --- */
        #spice-inspector {
            position: fixed; z-index: 2000; background: var(--bg-sidebar); border: 2px solid var(--cyan);
            padding: 15px; border-radius: 12px; width: 85%; max-width: 300px; display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); left: 50%; top: 40%; transform: translate(-50%, -50%);
        }
        .row-ins { margin-bottom: 12px; }
        .row-ins label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .row-ins input { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; font-size: 14px; border-radius: 6px; }
        .apply-btn { width: 100%; background: var(--cyan); border: none; padding: 12px; color: #000; font-weight: bold; font-size: 13px; border-radius: 6px; }
        .purgue-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--red); color: var(--red); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; width: 100%; margin-top: 5px; }

        .rotor-container { border: 2px dashed var(--magenta); border-radius: 50%; margin: 2px auto; display: flex; align-items: center; justify-content: center; }
        .bulb-glass { border-radius: 50% 50% 30% 30%; border: 2px solid #475569; margin: 2px auto; position: relative; }
        .filame { position: absolute; border: 1px solid #475569; border-bottom: none; border-radius: 50% 50% 0 0; }
        
        .tip-banner { background: rgba(0, 242, 254, 0.05); border: 1px dashed rgba(0, 242, 254, 0.3); padding: 8px; border-radius: 6px; font-size: 11px; color: #a7f3d0; margin-bottom: 8px; text-align: center;}
    </style>
</head>
<body>

    <header>
        <div class="brand">🔬 MNA MOBILE CORE v18.5</div>
        <div class="header-actions">
            <div class="engine-badge" id="engine-status">MNA: OK</div>
            <button class="exit-btn" onclick="exitStudio()">🚪 SALIR</button>
        </div>
    </header>

    <div id="main-layout">
        
        <div id="viewport">
            <div id="spice-inspector">
                <div id="inspector-fields"></div>
                <button class="apply-btn" onclick="applyNodeSettings()">Aplicar Cambios</button>
            </div>
            <div id="sandbox">
                <svg id="wire-layer" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </div>

        <div id="mobile-toolbox">
            <div class="tip-banner">💡 Para conectar: Toca un pin (se iluminará) y luego toca otro pin.</div>
            
            <div class="section-title">Instanciar Componentes (Desliza ➔)</div>
            <div class="scroll-row">
                <button class="mobile-btn" onclick="addSpiceComponent('nice_power')"><span style="color:var(--cyan)">🔋</span> Fuente DC</button>
                <button class="mobile-btn" onclick="addSpiceComponent('gnd_node')"><span style="color:var(--green)">⏚</span> Tierra GND</button>
                <button class="mobile-btn" onclick="addSpiceComponent('resistencia')"><span style="color:#fef08a">🟫</span> Resistor</button>
                <button class="mobile-btn" onclick="addSpiceComponent('switch_cuchilla')"><span style="color:var(--yellow)">🎛️</span> Interruptor</button>
                <button class="mobile-btn" onclick="addSpiceComponent('led_verde')"><span style="color:var(--green)">🟢</span> Diodo LED</button>
                <button class="mobile-btn" onclick="addSpiceComponent('motor_dc')"><span style="color:var(--magenta)">🌀</span> Motor DC</button>
                <button class="mobile-btn" onclick="addSpiceComponent('foco_edison')"><span style="color:var(--yellow)">💡</span> Lámpara</button>
            </div>
            <button class="purgue-btn" onclick="purgueNetlist()">🗑️ Limpiar Todo el Lienzo</button>
        </div>

        <div id="mobile-console">
            <div class="console-box">
                <div class="box-title">📁 Asignación de Nodos MNA</div>
                <div class="matrix-output" id="netlist-view" style="color:var(--text-muted)">Añade componentes...</div>
            </div>
            <div class="console-box">
                <div class="box-title">📋 Estado de la Matriz [A] · [X] = [Z]</div>
                <div class="matrix-output" id="matrix-view">Esperando circuito activo...</div>
            </div>
        </div>

    </div>

    <script>
        let netNodes = [];
        let conexiones = [];
        let globalId = 0;
        let activeSelectedNode = null;
        
        // Almacena el pin de origen seleccionado para la conexión por toques secuenciales
        let selectedSourcePin = null;

        const sandbox = document.getElementById('sandbox');
        const wireLayer = document.getElementById('wire-layer');
        const inspector = document.getElementById('spice-inspector');

        function exitStudio() {
            if(confirm("¿Estás seguro de que quieres salir? Se perderá el circuito actual.")) {
                purgueNetlist();
                window.close();
                document.body.innerHTML = `<div style="background:#060913; color:#f3f4f6; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;">
                    <h1 style="color:var(--cyan); margin-bottom:10px;">🔬 Laboratorio Cerrado</h1>
                    <button onclick="location.reload()" style="margin-top:20px; background:var(--cyan); border:none; padding:10px 20px; font-weight:bold; border-radius:6px; cursor:pointer;">Reiniciar Simulador</button>
                </div>`;
            }
        }

        const SPICE_ARQUETYPES = {
            nice_power: { w: 120, h: 70, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:var(--cyan);">FUENTE V</div>
                <div style="background:#000; color:var(--green); font-size:11px; text-align:center; padding:2px; margin-top:2px; border-radius:4px;">${n.ajustes.v.toFixed(1)} V</div>
                <div class="net-pin" id="pin_${n.id}_p" data-pin="p" style="left:-18px; top:17px;"></div>
                <div class="net-pin" id="pin_${n.id}_n" data-pin="n" style="right:-18px; top:17px;"></div>
                <span class="pin-lbl" style="left:14px; top:24px; color:var(--red)">+</span><span class="pin-lbl" style="right:14px; top:24px;">-</span>
            `},
            gnd_node: { w: 90, h: 50, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:var(--green); text-align:center;">⏚ TIERRA</div>
                <div class="net-pin" id="pin_${n.id}_g" data-pin="g" style="left:27px; top:-18px;"></div>
            `},
            resistencia: { w: 110, h: 65, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:#fef08a;">RESISTOR</div>
                <div style="background:#000; text-align:center; font-size:11px; padding:2px; margin-top:3px; border-radius:4px;">${n.ajustes.r} 𝛀</div>
                <div class="net-pin" id="pin_${n.id}_a" data-pin="a" style="left:-18px; top:14px;"></div>
                <div class="net-pin" id="pin_${n.id}_b" data-pin="b" style="right:-18px; top:14px;"></div>
            `},
            switch_cuchilla: { w: 110, h: 65, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:var(--text-muted);">SW_CONTROL</div>
                <div style="text-align:center; font-weight:bold; font-size:11px; margin-top:4px; color:${n.ajustes.open?'var(--red)':'var(--green)'}">${n.ajustes.open?'ABIERTO':'CERRADO'}</div>
                <div class="net-pin" id="pin_${n.id}_1" data-pin="1" style="left:-18px; top:14px;"></div>
                <div class="net-pin" id="pin_${n.id}_2" data-pin="2" style="right:-18px; top:14px;"></div>
            `},
            led_verde: { w: 110, h: 75, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:var(--green); text-align:center;">DIODO LED</div>
                <div id="lit_${n.id}" style="width:18px; height:18px; border-radius:50%; background:rgba(57,255,20,0.02); border:2px solid #334155; margin:3px auto;"></div>
                <div class="net-pin" id="pin_${n.id}_an" data-pin="an" style="left:-18px; top:24px;"></div>
                <div class="net-pin" id="pin_${n.id}_ca" data-pin="ca" style="right:-18px; top:24px;"></div>
            `},
            motor_dc: { w: 110, h: 80, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:var(--magenta); text-align:center;">MOTOR_DC</div>
                <div class="rotor-container" id="rot_${n.id}" style="width:24px; height:24px; transform: rotate(${n.angulo || 0}deg);">
                    <div style="width:2px; height:18px; background:var(--magenta);"></div>
                </div>
                <div class="net-pin" id="pin_${n.id}_m1" data-pin="m1" style="left:-18px; top:22px;"></div>
                <div class="net-pin" id="pin_${n.id}_m2" data-pin="m2" style="right:-18px; top:22px;"></div>
            `},
            foco_edison: { w: 110, h: 80, render: (n) => `
                <div style="font-size:9px; font-weight:bold; color:var(--yellow); text-align:center;">LÁMPARA</div>
                <div class="bulb-glass" id="bg_${n.id}" style="width:24px; height:24px;">
                    <div class="filame" id="fil_${n.id}" style="width:8px; height:10px; top:8px; left:6px;"></div>
                </div>
                <div class="net-pin" id="pin_${n.id}_t1" data-pin="t1" style="left:-18px; top:22px;"></div>
                <div class="net-pin" id="pin_${n.id}_t2" data-pin="t2" style="right:-18px; top:22px;"></div>
            `}
        };

        function addSpiceComponent(tipo) {
            globalId++;
            let viewWidth = sandbox.clientWidth || 300;
            let targetX = Math.max(25, (viewWidth / 2) - 55);
            let targetY = 100 + (globalId % 4) * 20; 

            let n = {
                id: `${tipo}_${globalId}`, tipo, x: targetX, y: targetY, angulo: 0,
                fused: false, overheating: false, v_drop: 0, current: 0, temp: 20,
                ajustes: tipo==='nice_power' ? { v: 12 } :
                         tipo==='resistencia' ? { r: 220, max_p: 0.5 } :
                         tipo==='switch_cuchilla' ? { open: true } :
                         tipo==='motor_dc' ? { max_current: 2.0 } :
                         tipo==='foco_edison' ? { r_nominal: 15, w_max: 40 } : {}
            };
            netNodes.push(n);
            injectNodeToDOM(n);
        }

        function injectNodeToDOM(n) {
            let conf = SPICE_ARQUETYPES[n.tipo];
            let div = document.createElement('div');
            div.id = n.id; div.className = 'spice-node';
            div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
            div.style.width = conf.w + 'px'; div.style.height = conf.h + 'px';
            div.innerHTML = conf.render(n) + `<div class="node-telemetry" id="tel_${n.id}">0.0V/0mA</div>`;

            // --- NUEVO SISTEMA SELECCIÓN TÁCTIL INTELIGENTE ---
            div.querySelectorAll('.net-pin').forEach(pin => {
                pin.addEventListener('click', (e) => {
                    e.stopPropagation(); // Evita que se abra el inspector del componente entero
                    handlePinSelection(n.id, pin.dataset.pin, pin);
                });
            });

            // Arrastrar el módulo completo con un dedo por el lienzo de forma fluida
            div.addEventListener('pointerdown', (e) => {
                if(e.target.classList.contains('net-pin')) return; // No mover si tocas el pin
                activeSelectedNode = n;
                document.querySelectorAll('.spice-node').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                div.setPointerCapture(e.pointerId);

                let dx = e.clientX - n.x; let dy = e.clientY - n.y;
                
                function drag(ev) {
                    n.x = ev.clientX - dx; n.y = ev.clientY - dy;
                    div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
                    drawNetlistWires();
                }
                function drop(ev) {
                    div.removeEventListener('pointermove', drag);
                    div.removeEventListener('pointerup', drop);
                    drawNetlistWires();
                    solveCircuitMNA();
                }
                div.addEventListener('pointermove', drag);
                div.addEventListener('pointerup', drop);
            });

            let touchTime = 0;
            div.addEventListener('pointerdown', () => touchTime = Date.now());
            div.addEventListener('click', (e) => {
                if(e.target.classList.contains('net-pin')) return;
                e.stopPropagation();
                if (Date.now() - touchTime > 250) return;
                if(n.tipo === 'switch_cuchilla') {
                    n.ajustes.open = !n.ajustes.open;
                    updateNodeGraphics(n);
                    solveCircuitMNA();
                } else {
                    openInspector(n, e);
                }
            });

            sandbox.appendChild(div);
            drawNetlistWires();
            solveCircuitMNA();
        }

        // CONTROLADOR DE CONEXIONES MEDIANTE TOQUES SECUENCIALES (NADA DE ARRASTRAR)
        function handlePinSelection(compId, pinName, pinElement) {
            // Si no hay ningún pin de origen seleccionado previamente, seleccionamos este como el primero
            if (!selectedSourcePin) {
                // Si este pin ya tiene un cable conectado, preguntar si quiere desconectarlo
                let cableExistente = conexiones.findIndex(w => 
                    (w.m1 === compId && w.p1 === pinName) || (w.m2 === compId && w.p2 === pinName)
                );
                if (cableExistente !== -1) {
                    if (confirm("¿Quieres eliminar el cable conectado a este pin?")) {
                        conexiones.splice(cableExistente, 1);
                        drawNetlistWires();
                        solveCircuitMNA();
                        return;
                    }
                }

                selectedSourcePin = { compId, pinName, element: pinElement };
                pinElement.classList.add('wiring-source');
            } else {
                // Si el segundo toque ocurre en el mismo componente, cancelamos la operación para evitar cortocircuitos internos
                if (selectedSourcePin.compId === compId) {
                    selectedSourcePin.element.classList.remove('wiring-source');
                    selectedSourcePin = null;
                    return;
                }

                // Verificar si ya existe una conexión idéntica en el listado
                let existe = conexiones.some(w => 
                    (w.m1 === selectedSourcePin.compId && w.p1 === selectedSourcePin.pinName && w.m2 === compId && w.p2 === pinName) ||
                    (w.m2 === selectedSourcePin.compId && w.p2 === selectedSourcePin.pinName && w.m1 === compId && w.p1 === pinName)
                );

                if (!existe) {
                    conexiones.push({
                        id: `w_${Date.now()}`,
                        m1: selectedSourcePin.compId, p1: selectedSourcePin.pinName,
                        m2: compId, p2: pinName,
                        hasCurrent: false
                    });
                }

                // Limpiar la selección y quitar los brillos de guía visual
                selectedSourcePin.element.classList.remove('wiring-source');
                selectedSourcePin = null;

                // Redibujar y recalcular la matriz MNA en tiempo real
                drawNetlistWires();
                solveCircuitMNA();
            }
        }

        function updateNodeGraphics(n) {
            let div = document.getElementById(n.id); if(!div) return;
            let savedTel = div.querySelector('.node-telemetry')?.outerHTML || '';
            div.innerHTML = SPICE_ARQUETYPES[n.tipo].render(n) + savedTel;
            
            div.querySelectorAll('.net-pin').forEach(pin => {
                pin.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handlePinSelection(n.id, pin.dataset.pin, pin);
                });
            });
            refreshPinStates();
        }

        function drawNetlistWires() {
            wireLayer.innerHTML = '';
            conexiones.forEach(w => {
                let c1 = getPinCoords(w.m1, w.p1);
                let c2 = getPinCoords(w.m2, w.p2);
                if(!c1 || !c2) return;

                let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                let pathStr = `M ${c1.x} ${c1.y} L ${c2.x} ${c2.y}`;

                let shadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                shadow.setAttribute('d', pathStr);
                shadow.setAttribute('class', w.hasCurrent ? 'wire-active' : 'wire-shadow');
                g.appendChild(shadow);

                if(w.hasCurrent) {
                    let dots = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    dots.setAttribute('d', pathStr);
                    dots.setAttribute('class', 'wire-dots');
                    g.appendChild(dots);
                }
                wireLayer.appendChild(g);
            });
            refreshPinStates();
        }

        function refreshPinStates() {
            document.querySelectorAll('.net-pin').forEach(p => p.classList.remove('linked'));
            conexiones.forEach(w => {
                let p1 = document.getElementById(`pin_${w.m1}_${w.p1}`);
                let p2 = document.getElementById(`pin_${w.m2}_${w.p2}`);
                if(p1) p1.classList.add('linked');
                if(p2) p2.classList.add('linked');
            });
        }

        function getPinCoords(nodeId, pinId) {
            let el = document.getElementById(`pin_${nodeId}_${pinId}`); if(!el) return null;
            let rect = el.getBoundingClientRect();
            let pRect = sandbox.getBoundingClientRect();
            return {
                x: rect.left - pRect.left + (rect.width / 2),
                y: rect.top - pRect.top + (rect.height / 2)
            };
        }

        function purgueNetlist() {
            conexiones = []; netNodes = [];
            if(selectedSourcePin) selectedSourcePin = null;
            wireLayer.innerHTML = '';
            document.querySelectorAll('.spice-node').forEach(el => el.remove());
            solveCircuitMNA();
        }

        // --- NÚCLEO MATRICIAL MNA SPICE ---
        function solveCircuitMNA() {
            try {
                if (netNodes.length === 0) {
                    printDebugInfo([], [], 0, {});
                    return;
                }

                netNodes.forEach(n => {
                    n.v_drop = 0; n.current = 0;
                    if(!n.fused) n.overheating = false;
                    let tel = document.getElementById(`tel_${n.id}`); if(tel) tel.innerText = "0.0V/0mA";
                });
                conexiones.forEach(w => w.hasCurrent = false);

                let pinToNodeMap = {};
                let nodeIndexCounter = 1;

                let gndNodes = netNodes.filter(n => n.tipo === 'gnd_node' && !n.fused);
                gndNodes.forEach(g => { pinToNodeMap[`${g.id}_g`] = 0; });

                conexiones.forEach(w => {
                    let k1 = `${w.m1}_${w.p1}`; let k2 = `${w.m2}_${w.p2}`;
                    let n1 = pinToNodeMap[k1]; let n2 = pinToNodeMap[k2];

                    if(n1 !== undefined && n2 !== undefined) {
                        if(n1 !== n2) {
                            for(let k in pinToNodeMap) { if(pinToNodeMap[k] === n2) pinToNodeMap[k] = n1; }
                        }
                    } else if(n1 !== undefined) { pinToNodeMap[k2] = n1; } 
                      else if(n2 !== undefined) { pinToNodeMap[k1] = n2; } 
                      else {
                        pinToNodeMap[k1] = nodeIndexCounter; pinToNodeMap[k2] = nodeIndexCounter;
                        nodeIndexCounter++;
                    }
                });

                netNodes.forEach(n => {
                    let div = document.getElementById(n.id); if(!div) return;
                    div.querySelectorAll('.net-pin').forEach(p => {
                        let k = `${n.id}_${p.dataset.pin}`;
                        if(pinToNodeMap[k] === undefined) pinToNodeMap[k] = nodeIndexCounter++;
                    });
                });

                let numNodosElectricos = nodeIndexCounter;
                let fuentesDeVoltaje = netNodes.filter(n => n.tipo === 'nice_power' && !n.fused);
                let numFuentes = fuentesDeVoltaje.length;

                let dim = numNodosElectricos + numFuentes;
                if(dim <= 1) { printDebugInfo([], [], numNodosElectricos, {}); return; }

                let A = Array.from({length: dim}, () => Array(dim).fill(0));
                let Z = Array(dim).fill(0);

                netNodes.forEach(n => {
                    if(n.fused) return;
                    if(n.tipo === 'resistencia') {
                        stampConductance(A, pinToNodeMap[`${n.id}_a`], pinToNodeMap[`${n.id}_b`], 1 / parseFloat(n.ajustes.r));
                    }
                    if(n.tipo === 'switch_cuchilla') {
                        stampConductance(A, pinToNodeMap[`${n.id}_1`], pinToNodeMap[`${n.id}_2`], n.ajustes.open ? 1e-12 : 1e5);
                    }
                    if(n.tipo === 'motor_dc') {
                        stampConductance(A, pinToNodeMap[`${n.id}_m1`], pinToNodeMap[`${n.id}_m2`], 1 / 12);
                    }
                    if(n.tipo === 'foco_edison') {
                        let rDinamica = n.ajustes.r_nominal * (1 + (n.temp - 20) * 0.005);
                        stampConductance(A, pinToNodeMap[`${n.id}_t1`], pinToNodeMap[`${n.id}_t2`], 1 / rDinamica);
                    }
                });

                let ledComponents = netNodes.filter(n => n.tipo === 'led_verde' && !n.fused);
                let v_led_prev = ledComponents.map(() => 0.7);
                let converged = false;
                let X = Array(dim).fill(0);

                for(let iter = 0; iter < 20; iter++) {
                    let A_iter = A.map(row => [...row]); let Z_iter = [...Z];

                    ledComponents.forEach((n, idx) => {
                        let nA = pinToNodeMap[`${n.id}_an`]; let nK = pinToNodeMap[`${n.id}_ca`];
                        let Vd = v_led_prev[idx];
                        let gd = (1e-14 / 0.026) * Math.exp(Vd / 0.026);
                        if(gd < 1e-9) gd = 1e-9; if(gd > 1e4) gd = 1e4;
                        let Ieq = 1e-14 * (Math.exp(Vd / 0.026) - 1) - gd * Vd;
                        stampConductance(A_iter, nA, nK, gd); stampCurrentSource(Z_iter, nA, nK, Ieq);
                    });

                    fuentesDeVoltaje.forEach((f, idx) => {
                        let nP = pinToNodeMap[`${f.id}_p`]; let nN = pinToNodeMap[`${f.id}_n`];
                        let kIdx = numNodosElectricos + idx;
                        if(nP > 0) { A_iter[nP][kIdx] += 1; A_iter[kIdx][nP] += 1; }
                        if(nN > 0) { A_iter[nN][kIdx] -= 1; A_iter[kIdx][nN] -= 1; }
                        Z_iter[kIdx] = f.ajustes.v;
                    });

                    X = solveLinearSystem(A_iter, Z_iter);
                    if(!X) {
                        document.getElementById('engine-status').innerText = "ERR_MATRIZ";
                        document.getElementById('engine-status').style.color = "var(--red)";
                        return;
                    }

                    let err = 0;
                    ledComponents.forEach((n, idx) => {
                        let nA = pinToNodeMap[`${n.id}_an`]; let nK = pinToNodeMap[`${n.id}_ca`];
                        let Vd_new = (nA > 0 ? X[nA] : 0) - (nK > 0 ? X[nK] : 0);
                        let diff = Math.abs(Vd_new - v_led_prev[idx]);
                        if(diff > err) err = diff; v_led_prev[idx] = Vd_new;
                    });
                    if(err < 1e-5 || ledComponents.length === 0) { converged = true; break; }
                }

                if(converged || ledComponents.length === 0) {
                    document.getElementById('engine-status').innerText = "MNA: OK";
                    document.getElementById('engine-status').style.color = "var(--green)";
                }

                netNodes.forEach(n => {
                    if(n.fused) return;

                    if(n.tipo === 'resistencia') {
                        let nA = pinToNodeMap[`${n.id}_a`]; let nB = pinToNodeMap[`${n.id}_b`];
                        n.v_drop = Math.abs((nA > 0 ? X[nA] : 0) - (nB > 0 ? X[nB] : 0));
                        n.current = n.v_drop / parseFloat(n.ajustes.r);
                        let p = n.current * n.v_drop;
                        if(p > n.ajustes.max_p) { n.overheating = true; n.temp += p * 0.8; if(n.temp > 150) n.fused = true; }
                        displayTelemetry(n, n.v_drop, n.current);
                    }
                    if(n.tipo === 'motor_dc') {
                        let n1 = pinToNodeMap[`${n.id}_m1`]; let n2 = pinToNodeMap[`${n.id}_m2`];
                        n.v_drop = Math.abs((n1 > 0 ? X[n1] : 0) - (n2 > 0 ? X[n2] : 0));
                        n.current = n.v_drop / 12;
                        if(n.current > n.ajustes.max_current) n.fused = true;
                        displayTelemetry(n, n.v_drop, n.current);
                    }
                    if(n.tipo === 'foco_edison') {
                        let n1 = pinToNodeMap[`${n.id}_t1`]; let n2 = pinToNodeMap[`${n.id}_t2`];
                        n.v_drop = Math.abs((n1 > 0 ? X[n1] : 0) - (n2 > 0 ? X[n2] : 0));
                        let rDinamica = n.ajustes.r_nominal * (1 + (n.temp - 20) * 0.005);
                        n.current = n.v_drop / rDinamica;
                        let p = n.v_drop * n.current;
                        n.temp += p * 0.4;
                        if(p > n.ajustes.w_max * 1.4) n.fused = true;
                        displayTelemetry(n, n.v_drop, n.current);
                    }
                    if(n.tipo === 'led_verde') {
                        let nA = pinToNodeMap[`${n.id}_an`]; let nK = pinToNodeMap[`${n.id}_ca`];
                        n.v_drop = (nA > 0 ? X[nA] : 0) - (nK > 0 ? X[nK] : 0);
                        n.current = 1e-14 * (Math.exp(n.v_drop / 0.026) - 1);
                        if(n.current > 0.08) n.fused = true;
                        displayTelemetry(n, n.v_drop, n.current);
                    }
                    if(n.tipo === 'nice_power') {
                        let idx = fuentesDeVoltaje.findIndex(f => f.id === n.id);
                        n.current = Math.abs(X[numNodosElectricos + idx] || 0);
                        displayTelemetry(n, n.ajustes.v, n.current);
                    }
                });

                conexiones.forEach(w => {
                    let pNode = pinToNodeMap[`${w.m1}_${w.p1}`];
                    // Si el nodo tiene voltaje activo, iluminamos el cable con flujo
                    if(pNode !== undefined && X) w.hasCurrent = Math.abs(X[pNode]) > 0.01;
                });

                printDebugInfo(A, Z, numNodosElectricos, pinToNodeMap);
                updatePhysicalIndicators();
            } catch(err) {
                console.error("MNA Loop Error:", err);
            }
        }

        function stampConductance(M, nA, nB, G) {
            if(nA > 0) M[nA][nA] += G; if(nB > 0) M[nB][nB] += G;
            if(nA > 0 && nB > 0) { M[nA][nB] -= G; M[nB][nA] -= G; }
        }

        function stampCurrentSource(V, nA, nK, Ieq) {
            if(nA > 0) V[nA] -= Ieq; if(nK > 0) V[nK] += Ieq;
        }

        function solveLinearSystem(A, Z) {
            let n = Z.length; if (n === 0) return null;
            for (let i = 0; i < n; i++) A[i].push(Z[i]);
            for (let i = 0; i < n; i++) {
                let maxEl = Math.abs(A[i][i]); let maxRow = i;
                for (let k = i + 1; k < n; k++) { if (Math.abs(A[k][i]) > maxEl) { maxEl = Math.abs(A[k][i]); maxRow = k; } }
                for (let k = i; k < n + 1; k++) { let tmp = A[maxRow][k]; A[maxRow][k] = A[i][k]; A[i][k] = tmp; }
                if (Math.abs(A[i][i]) < 1e-12) return null;
                for (let k = 0; k < n; k++) {
                    if (k !== i) {
                        let c = -A[k][i] / A[i][i];
                        for (let j = i; j < n + 1; j++) { if (i === j) A[k][j] = 0; else A[k][j] += c * A[i][j]; }
                    }
                }
            }
            let res = Array(n).fill(0);
            for (let i = 0; i < n; i++) res[i] = A[i][n] / A[i][i];
            return res;
        }

        function displayTelemetry(n, v, i) {
            let tel = document.getElementById(`tel_${n.id}`); if(!tel) return;
            if(i < 0) i = 0;
            tel.innerText = `${v.toFixed(1)}V / ${i >= 1 ? i.toFixed(1)+'A' : (i*1000).toFixed(0)+'mA'}`;
        }

        function updatePhysicalIndicators() {
            netNodes.forEach(n => {
                let div = document.getElementById(n.id); if(!div) return;
                if(n.fused) { div.className = 'spice-node destroyed'; return; }
                if(n.overheating) div.classList.add('hot'); else div.classList.remove('hot');

                if(n.tipo === 'led_verde') {
                    let core = div.querySelector(`#lit_${n.id}`);
                    if(core) {
                        if(n.v_drop >= 1.8) {
                            let f = Math.min(1, (n.v_drop - 1.8) / 0.5);
                            core.style.background = `rgba(57, 255, 20, ${f})`; core.style.boxShadow = `0 0 ${20*f}px var(--green)`;
                        } else { core.style.background = 'none'; core.style.boxShadow = 'none'; }
                    }
                }

                if(n.tipo === 'foco_edison') {
                    let fil = div.querySelector(`#fil_${n.id}`);
                    let glass = div.querySelector(`#bg_${n.id}`);
                    if(fil && glass) {
                        if(n.v_drop > 1) {
                            let factor = Math.min(1, n.v_drop / 12);
                            fil.style.borderColor = `rgb(255, ${140 + (115*factor)}, 0)`;
                            glass.style.boxShadow = `0 0 ${25 * factor}px var(--yellow)`;
                            glass.style.background = `rgba(245, 158, 11, ${factor * 0.35})`;
                        } else { fil.style.borderColor = '#475569'; glass.style.boxShadow = 'none'; glass.style.background = 'none'; }
                    }
                }

                if(n.tipo === 'motor_dc') {
                    if(n.v_drop > 0.5) {
                        n.angulo = (n.angulo + (n.v_drop * 4)) % 360;
                        let rot = div.querySelector(`#rot_${n.id}`);
                        if(rot) rot.style.transform = `rotate(${n.angulo}deg)`;
                    }
                }
            });
        }

        function printDebugInfo(M, V, count, mapping) {
            let netView = document.getElementById('netlist-view');
            let matView = document.getElementById('matrix-view');
            if(!netView || !matView) return;
            if(netNodes.length === 0) { netView.innerText = "Lienzo limpio."; matView.innerText = "Matriz nula."; return; }

            let netStr = ""; for(let k in mapping) { netStr += `[${k}] ➔ Nodo MNA:${mapping[k]}\n`; }
            netView.innerText = netStr;

            if(!M || M.length === 0) { matView.innerText = "A la espera de un lazo cerrado..."; return; }
            let matStr = "";
            for(let i=0; i<M.length; i++) {
                if (M[i]) {
                    matStr += `[Fila_${i}] │ ${M[i].map(v => v.toExponential(1)).join(" ")} │ Z=${V[i] !== undefined ? V[i].toExponential(1) : 0}\n`;
                }
            }
            matView.innerText = matStr;
        }

        function openInspector(n, e) {
            activeSelectedNode = n;
            inspector.style.display = 'block';
            let fields = document.getElementById('inspector-fields');
            if(n.tipo === 'nice_power') {
                fields.innerHTML = `<div class="row-ins"><label>Voltaje de Fuente DC (Voltios):</label><input type="number" id="val_v" value="${n.ajustes.v}"></div>`;
            } else if(n.tipo === 'resistencia') {
                fields.innerHTML = `
                    <div class="row-ins"><label>Valor Ohmico (𝛀):</label><input type="number" id="val_r" value="${n.ajustes.r}"></div>
                    <div class="row-ins"><label>Potencia Disipación Máx (W):</label><input type="number" id="val_p" value="${n.ajustes.max_p}"></div>`;
            } else if(n.tipo === 'foco_edison') {
                fields.innerHTML = `<div class="row-ins"><label>Resistencia del Filamento (𝛀):</label><input type="number" id="val_rn" value="${n.ajustes.r_nominal}"></div>`;
            } else {
                fields.innerHTML = `<p style="font-size:12px; color:var(--text-muted); text-align:center; padding:5px 0;">Componente electrónico no-lineal.</p>`;
            }
        }

        function applyNodeSettings() {
            if(activeSelectedNode) {
                if(activeSelectedNode.tipo === 'nice_power') activeSelectedNode.ajustes.v = parseFloat(document.getElementById('val_v').value) || 0;
                if(activeSelectedNode.tipo === 'resistencia') {
                    activeSelectedNode.ajustes.r = parseFloat(document.getElementById('val_r').value) || 1;
                    activeSelectedNode.ajustes.max_p = parseFloat(document.getElementById('val_p').value) || 0.1;
                }
                if(activeSelectedNode.tipo === 'foco_edison') activeSelectedNode.ajustes.r_nominal = parseFloat(document.getElementById('val_rn').value) || 1;
                updateNodeGraphics(activeSelectedNode);
            }
            inspector.style.display = 'none'; solveCircuitMNA();
        }

        window.addEventListener('load', () => {
            sandbox.addEventListener('click', () => {
                inspector.style.display = 'none';
                if(selectedSourcePin) {
                    selectedSourcePin.element.classList.remove('wiring-source');
                    selectedSourcePin = null;
                }
            });
            setInterval(() => {
                netNodes.forEach(n => { if(n.temp > 20) n.temp -= 0.4; });
                solveCircuitMNA();
            }, 50);
        });
    </script>
</body>
