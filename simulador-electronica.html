<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔬 CORE-SPICE CyberLab Pro v26.0</title>
    <style>
        :root {
            --bg-main: #02040a;
            --bg-sidebar: #070a16;
            --bg-grid: #010204;
            --cyan: #00f2fe;
            --green: #39ff14;
            --red: #ff073a;
            --yellow: #ffee00;
            --purple: #b026ff;
            --border: #141b36;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 40px; background: var(--bg-sidebar); border-bottom: 2px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
            flex-shrink: 0; box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }
        
        .airport-ticker { display: flex; gap: 2px; }
        .airport-char {
            background: #111; color: var(--cyan); font-weight: bold; font-size: 11px;
            padding: 2px 4px; border-radius: 3px; border: 1px solid #222;
            text-shadow: 0 0 4px var(--cyan);
        }
        
        .exit-btn { 
            background: #110307; border: 1.5px solid var(--red); color: var(--red); 
            font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; 
            cursor: pointer; text-shadow: 0 0 4px var(--red);
        }

        /* DISEÑO COMPACTO PARA EVITAR DESBORDE EN MÓVILES */
        #viewport { position: relative; background: var(--bg-grid); flex: 1; min-height: 240px; width: 100%; border-bottom: 2px solid var(--border); overflow: hidden; }
        
        #sandbox {
            width: 2000px; height: 2000px; position: absolute; top: 0; left: 0;
            background-image: linear-gradient(to right, rgba(0, 242, 254, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
            background-size: 20px 20px; touch-action: none; 
        }
        
        #wire-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        .spice-node {
            position: absolute; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: none; padding: 4px; background: transparent;
        }
        .spice-node.selected .comp-body { filter: drop-shadow(0 0 8px var(--cyan)) !important; }

        .comp-body { position: relative; display: flex; align-items: center; justify-content: center; background: transparent; }

        .close-node-btn {
            position: absolute; top: -12px; right: -12px; width: 18px; height: 18px;
            background: var(--red); color: #fff; font-size: 10px; font-weight: bold;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 600; cursor: pointer; box-shadow: 0 0 5px var(--red); border: 1px solid #fff;
        }

        .net-pin {
            position: absolute; width: 30px; height: 30px; background: transparent;
            z-index: 500; display: flex; align-items: center; justify-content: center;
        }
        .net-pin::after {
            content: ''; width: 10px; height: 10px; background: #0f1322;
            border: 2px solid #4b5563; border-radius: 50%;
        }
        .net-pin.wiring-source::after { background: #fff; border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: scale(1.1); }
        .net-pin.linked::after { background: var(--cyan); border-color: #fff; box-shadow: 0 0 6px var(--cyan); }

        .pin-node-id {
            position: absolute; font-size: 8px; color: var(--cyan); font-weight: bold;
            background: #000; padding: 0px 3px; border-radius: 2px; border: 1px solid var(--border);
            pointer-events: none; z-index: 550;
        }

        .node-telemetry { 
            font-size: 9px; color: var(--green); text-align: center; width: 100%; margin-top: 3px;
            background: rgba(0,0,0,0.9); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border);
            text-shadow: 0 0 3px var(--green);
        }

        /* CABLES NEÓN CORREGIDOS */
        .wire-shadow { fill: none; stroke: #12172e; stroke-width: 3.5; stroke-linecap: round; }
        .wire-active { fill: none; stroke: var(--cyan); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 5px var(--cyan)); }
        .wire-dots { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 10; animation: flows 0.25s linear infinite; }
        @keyframes flows { to { stroke-dashoffset: -16; } }

        @keyframes spinPropeller {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* CAJA DE BOTONES COMPACTA */
        #mobile-toolbox { background: var(--bg-sidebar); padding: 8px; border-bottom: 2px solid var(--border); flex-shrink: 0; }
        .scroll-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
        .mobile-btn {
            background: #050711; border: 1.5px solid var(--border); padding: 8px 12px; border-radius: 5px;
            font-size: 10px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 4px; flex-shrink: 0;
        }

        /* CONSOLA INFERIOR AJUSTADA */
        #mobile-console { background: #010204; padding: 6px; flex-shrink: 0; }
        .console-box { background: rgba(9, 12, 26, 0.7); border: 1.5px solid var(--border); border-radius: 6px; padding: 6px; }
        .box-title { font-size: 9px; color: #5c6c9c; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 4px; }
        
        .canvas-container { background: #010602; border: 1.5px solid #133a18; border-radius: 5px; position: relative; }
        canvas { width: 100%; height: 65px; display: block; } /* Reducido para dar espacio */

        #spice-inspector {
            position: fixed; z-index: 2000; background: var(--bg-sidebar); border: 2px solid var(--purple);
            padding: 12px; border-radius: 8px; width: 80%; max-width: 240px; display: none; 
            left: 50%; top: 40%; transform: translate(-50%, -50%); box-shadow: 0 0 20px var(--purple);
        }
        .row-ins label { display: block; font-size: 10px; color: #8fa0cc; margin-bottom: 3px; }
        .row-ins input { width: 100%; background: #000; border: 1px solid var(--border); color: var(--purple); padding: 6px; font-size: 13px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; text-align: center; }
        .apply-btn { width: 100%; background: var(--purple); border: none; padding: 8px; color: #fff; font-weight: bold; border-radius: 4px; box-shadow: 0 0 8px var(--purple); }
        .purgue-btn { background: rgba(255,7,58,0.05); border: 1.5px solid var(--red); color: var(--red); padding: 6px; border-radius: 5px; font-size: 10px; font-weight: bold; width: 100%; margin-top: 4px; text-shadow: 0 0 4px var(--red); }
        
        .probe-selector { background: #091f0e; color: var(--green); border: 1px solid #1a5223; font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="airport-ticker" id="headerTicker"></div>
        <button class="exit-btn" onclick="exitStudio()">🚪 EXIT</button>
    </header>

    <div id="viewport">
        <div id="spice-inspector">
            <div id="inspector-fields"></div>
            <button class="apply-btn" onclick="applyNodeSettings()">LOAD PARAM</button>
        </div>
        <div id="sandbox">
            <svg id="wire-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <div id="mobile-toolbox">
        <div class="scroll-row">
            <button class="mobile-btn" style="border-color:var(--green);" onclick="addSpiceComponent('nice_power')">🔋 BAT DC</button>
            <button class="mobile-btn" style="border-color:var(--red);" onclick="addSpiceComponent('switch_cuchilla')">🎛️ SW KNIFE</button>
            <button class="mobile-btn" style="border-color:var(--purple);" onclick="addSpiceComponent('condensador')">⚡ CAPACITOR</button>
            <button class="mobile-btn" style="border-color:var(--cyan);" onclick="addSpiceComponent('motor_dc')">🌀 DC MOTOR</button>
            <button class="mobile-btn" style="border-color:var(--yellow);" onclick="addSpiceComponent('resistencia')">🟫 RESISTOR</button>
            <button class="mobile-btn" style="border-color:var(--green);" onclick="addSpiceComponent('led_verde')">🟢 DIODE LED</button>
            <button class="mobile-btn" style="border-color:var(--yellow);" onclick="addSpiceComponent('foco_edison')">💡 EDISON LP</button>
        </div>
        <button class="purgue-btn" onclick="purgueNetlist()">🗑️ HARD RESET NETLIST</button>
    </div>

    <div id="mobile-console">
        <div class="console-box">
            <div class="box-title">
                <span>📟 MNA SIGNAL TRACE (ACTIVE DC WAVE)</span>
                <div>PROBE: <select id="scopeProbeNode" class="probe-selector" onchange="changeScopeProbe()"><option value="0">GND (Node 0)</option></select></div>
            </div>
            <div class="canvas-container">
                <canvas id="scopeCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let netNodes = [];
        let conexiones = [];
        let globalId = 0;
        let activeSelectedNode = null;
        let selectedSourcePin = null;

        let scopeCanvas, scopeCtx;
        let graphVoltage = 0;
        let activeProbeNodeId = 0; 
        let nodeVoltagesArray = {}; 

        const DT = 0.05;

        const sandbox = document.getElementById('sandbox');
        const wireLayer = document.getElementById('wire-layer');
        const inspector = document.getElementById('spice-inspector');

        function initAirportTicker() {
            const txt = "MNA-SPICE.V26";
            const container = document.getElementById('headerTicker');
            container.innerHTML = '';
            [...txt].forEach((char) => {
                let div = document.createElement('div');
                div.className = 'airport-char'; div.innerText = char;
                container.appendChild(div);
            });
        }

        // REDIRECCIÓN ARREGLADA COMPLETAMENTE HACIA INDEX.HTML
        function exitStudio() {
            if(confirm("¿Regresar al menú principal index?")) { 
                purgueNetlist(); 
                window.location.href = "index.html"; 
            }
        }

        const SPICE_ARQUETYPES = {
            nice_power: { w: 85, h: 65, render: (n) => `
                <div class="comp-body">
                    <svg width="75" height="35" viewBox="0 0 80 40">
                        <rect x="15" y="5" width="50" height="30" rx="4" fill="#062f15" stroke="var(--green)" stroke-width="2"/>
                        <text x="42" y="24" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">V_BAT</text>
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_p" data-pin="p" style="left:-14px; top:4px;"></div>
                    <div class="net-pin" id="pin_${n.id}_n" data-pin="n" style="right:-14px; top:4px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_p" style="left:-22px; top:-8px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_n" style="right:-22px; top:-8px;">?</div>
                </div>
            `},
            switch_cuchilla: { w: 80, h: 65, render: (n) => `
                <div class="comp-body">
                    <svg width="70" height="40" viewBox="0 0 75 45">
                        <rect x="15" y="10" width="45" height="25" rx="3" fill="#111" stroke="#222" stroke-width="2"/>
                        ${n.ajustes.open 
                            ? `<line x1="23" y1="22" x2="48" y2="3" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/>`
                            : `<line x1="23" y1="22" x2="52" y2="22" stroke="var(--green)" stroke-width="5" stroke-linecap="round"/>`
                        }
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_1" data-pin="1" style="left:-14px; top:6px;"></div>
                    <div class="net-pin" id="pin_${n.id}_2" data-pin="2" style="right:-14px; top:6px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_1" style="left:-22px; top:-8px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_2" style="right:-22px; top:-8px;">?</div>
                </div>
            `},
            condensador: { w: 80, h: 65, render: (n) => `
                <div class="comp-body">
                    <svg width="70" height="40" viewBox="0 0 70 45">
                        <rect x="20" y="5" width="30" height="35" rx="4" fill="#20053b" stroke="var(--purple)" stroke-width="2"/>
                        <text x="35" y="26" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">CAP</text>
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_a" data-pin="a" style="left:-14px; top:6px;"></div>
                    <div class="net-pin" id="pin_${n.id}_b" data-pin="b" style="right:-14px; top:6px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_a" style="left:-22px; top:-8px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_b" style="right:-22px; top:-8px;">?</div>
                </div>
            `},
            motor_dc: { w: 85, h: 80, render: (n) => `
                <div class="comp-body">
                    <svg width="70" height="70" viewBox="0 0 70 70">
                        <circle cx="35" cy="35" r="20" fill="#042330" stroke="var(--cyan)" stroke-width="2"/>
                        <g id="propeller_${n.id}" transform="translate(35,35)">
                            <path d="M -4,-22 L 4,-22 L 4,0 L -4,0 Z" fill="#e11d48"/>
                            <path d="M -4,22 L 4,22 L 4,0 L -4,0 Z" fill="#e11d48"/>
                            <circle cx="0" cy="0" r="3" fill="#fff"/>
                        </g>
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_m1" data-pin="m1" style="left:-14px; top:20px;"></div>
                    <div class="net-pin" id="pin_${n.id}_m2" data-pin="m2" style="right:-14px; top:20px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_m1" style="left:-22px; top:0px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_m2" style="right:-22px; top:0px;">?</div>
                </div>
            `},
            resistencia: { w: 85, h: 55, render: (n) => `
                <div class="comp-body">
                    <svg width="75" height="25" viewBox="0 0 80 30">
                        <rect x="20" y="7" width="40" height="16" rx="4" fill="#332402" stroke="var(--yellow)" stroke-width="1.5"/>
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_a" data-pin="a" style="left:-14px; top:0px;"></div>
                    <div class="net-pin" id="pin_${n.id}_b" data-pin="b" style="right:-14px; top:0px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_a" style="left:-22px; top:-12px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_b" style="right:-22px; top:-12px;">?</div>
                </div>
            `},
            led_verde: { w: 75, h: 65, render: (n) => `
                <div class="comp-body">
                    <svg width="60" height="40" viewBox="0 0 60 50">
                        <path id="led_bulb_${n.id}" d="M 22,23 Q 22,5 30,5 Q 38,5 38,23 Z" fill="#022c22" stroke="var(--green)" stroke-width="1.5"/>
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_an" data-pin="an" style="left:-16px; top:8px;"></div>
                    <div class="net-pin" id="pin_${n.id}_ca" data-pin="ca" style="right:-16px; top:8px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_an" style="left:-22px; top:-8px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_ca" style="right:-22px; top:-8px;">?</div>
                </div>
            `},
            foco_edison: { w: 75, h: 65, render: (n) => `
                <div class="comp-body">
                    <svg width="60" height="50" viewBox="0 0 60 60">
                        <circle id="lamp_glass_${n.id}" cx="30" cy="24" r="15" fill="rgba(255,255,255,0.01)" stroke="#555" stroke-width="1.5"/>
                    </svg>
                    <div class="net-pin" id="pin_${n.id}_t1" data-pin="t1" style="left:-14px; top:20px;"></div>
                    <div class="net-pin" id="pin_${n.id}_t2" data-pin="t2" style="right:-14px; top:20px;"></div>
                    <div class="pin-node-id" id="lbl_${n.id}_t1" style="left:-22px; top:4px;">?</div>
                    <div class="pin-node-id" id="lbl_${n.id}_t2" style="right:-22px; top:4px;">?</div>
                </div>
            `}
        };

        function addSpiceComponent(tipo) {
            globalId++;
            let targetX = 40 + (globalId % 3) * 50;
            let targetY = 30 + Math.floor(globalId / 3) * 20; 

            let n = {
                id: `${tipo}_${globalId}`, tipo, x: targetX, y: targetY, v_drop: 0,
                ajustes: tipo==='nice_power' ? { v: 12 } :
                         tipo==='resistencia' ? { r: 100 } :
                         tipo==='condensador' ? { c: 0.05, v_hist: 0 } :
                         tipo==='motor_dc' ? { max_rpm: 3000 } :
                         tipo==='switch_cuchilla' ? { open: true } : {}
            };
            netNodes.push(n);
            injectNodeToDOM(n);
        }

        function injectNodeToDOM(n) {
            let conf = SPICE_ARQUETYPES[n.tipo];
            let div = document.createElement('div');
            div.id = n.id; div.className = 'spice-node';
            div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
            div.style.width = conf.w + 'px'; div.style.height = conf.h + 'px';
            
            div.innerHTML = `<div class="close-node-btn" onclick="removeSingleComponent('${n.id}', event)">✕</div>` + 
                            conf.render(n) + 
                            `<div class="node-telemetry" id="tel_${n.id}">0.0V</div>`;

            div.querySelectorAll('.net-pin').forEach(pin => {
                pin.addEventListener('click', (e) => { e.stopPropagation(); handlePinSelection(n.id, pin.dataset.pin, pin); });
            });

            div.addEventListener('pointerdown', (e) => {
                if(e.target.classList.contains('net-pin') || e.target.classList.contains('close-node-btn')) return;
                activeSelectedNode = n;
                document.querySelectorAll('.spice-node').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                div.setPointerCapture(e.pointerId);

                let dx = e.clientX - n.x; let dy = e.clientY - n.y;
                function drag(ev) {
                    n.x = ev.clientX - dx; n.y = ev.clientY - dy;
                    div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
                    drawNetlistWires();
                }
                function drop(ev) {
                    div.removeEventListener('pointermove', drag);
                    div.removeEventListener('pointerup', drop);
                    drawNetlistWires(); solveCircuitMNA();
                }
                div.addEventListener('pointermove', drag);
                div.addEventListener('pointerup', drop);
            });

            div.addEventListener('click', (e) => {
                if(e.target.classList.contains('net-pin') || e.target.classList.contains('close-node-btn')) return;
                e.stopPropagation();
                if(n.tipo === 'switch_cuchilla') {
                    n.ajustes.open = !n.ajustes.open;
                    updateSwitchGraphics(n); solveCircuitMNA();
                } else {
                    openInspector(n, e);
                }
            });

            sandbox.appendChild(div);
            drawNetlistWires(); solveCircuitMNA();
        }

        function updateSwitchGraphics(n) {
            let div = document.getElementById(n.id); if(!div) return;
            let savedTel = div.querySelector('.node-telemetry')?.outerHTML || '';
            div.innerHTML = `<div class="close-node-btn" onclick="removeSingleComponent('${n.id}', event)">✕</div>` + 
                            SPICE_ARQUETYPES[n.tipo].render(n) + savedTel;
            div.querySelectorAll('.net-pin').forEach(pin => {
                pin.addEventListener('click', (e) => { e.stopPropagation(); handlePinSelection(n.id, pin.dataset.pin, pin); });
            });
            refreshPinStates();
        }

        function removeSingleComponent(id, event) {
            event.stopPropagation();
            conexiones = conexiones.filter(w => w.m1 !== id && w.m2 !== id);
            netNodes = netNodes.filter(n => n.id !== id);
            let el = document.getElementById(id); if(el) el.remove();
            if(selectedSourcePin && selectedSourcePin.compId === id) selectedSourcePin = null;
            drawNetlistWires(); solveCircuitMNA();
        }

        function handlePinSelection(compId, pinName, pinElement) {
            if (!selectedSourcePin) {
                let cableExistente = conexiones.findIndex(w => (w.m1 === compId && w.p1 === pinName) || (w.m2 === compId && w.p2 === pinName));
                if (cableExistente !== -1) {
                    conexiones.splice(cableExistente, 1);
                    drawNetlistWires(); solveCircuitMNA(); return;
                }
                selectedSourcePin = { compId, pinName, element: pinElement };
                pinElement.classList.add('wiring-source');
            } else {
                if (selectedSourcePin.compId === compId) {
                    selectedSourcePin.element.classList.remove('wiring-source');
                    selectedSourcePin = null; return;
                }
                conexiones.push({
                    id: `w_${Date.now()}`, m1: selectedSourcePin.compId, p1: selectedSourcePin.pinName,
                    m2: compId, p2: pinName, hasCurrent: false
                });
                selectedSourcePin.element.classList.remove('wiring-source');
                selectedSourcePin = null;
                drawNetlistWires(); solveCircuitMNA();
            }
        }

        function drawNetlistWires() {
            wireLayer.innerHTML = '';
            conexiones.forEach(w => {
                let c1 = getPinCoords(w.m1, w.p1); let c2 = getPinCoords(w.m2, w.p2);
                if(!c1 || !c2) return;
                let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                let pathStr = `M ${c1.x} ${c1.y} L ${c2.x} ${c2.y}`;

                let shadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                shadow.setAttribute('d', pathStr);
                shadow.setAttribute('class', w.hasCurrent ? 'wire-active' : 'wire-shadow');
                g.appendChild(shadow);

                if(w.hasCurrent) {
                    let dots = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    dots.setAttribute('d', pathStr);
                    dots.setAttribute('class', 'wire-dots');
                    g.appendChild(dots);
                }
                wireLayer.appendChild(g);
            });
            refreshPinStates();
        }

        function refreshPinStates() {
            document.querySelectorAll('.net-pin').forEach(p => p.classList.remove('linked'));
            conexiones.forEach(w => {
                let p1 = document.getElementById(`pin_${w.m1}_${w.p1}`);
                let p2 = document.getElementById(`pin_${w.m2}_${w.p2}`);
                if(p1) p1.classList.add('linked'); if(p2) p2.classList.add('linked');
            });
        }

        function getPinCoords(nodeId, pinId) {
            let el = document.getElementById(`pin_${nodeId}_${pinId}`); if(!el) return null;
            let rect = el.getBoundingClientRect(); let pRect = sandbox.getBoundingClientRect();
            return { x: rect.left - pRect.left + (rect.width / 2), y: rect.top - pRect.top + (rect.height / 2) };
        }

        function purgueNetlist() {
            conexiones = []; netNodes = []; selectedSourcePin = null;
            wireLayer.innerHTML = '';
            document.querySelectorAll('.spice-node').forEach(el => el.remove());
            solveCircuitMNA();
        }

        // --- CORE MATRICIAL RECALIBRADO CONTRA FLUJOS SUELTOS ---
        function solveCircuitMNA() {
            try {
                if (netNodes.length === 0) { resetOutputsZero(); return; }

                let pinToNodeMap = {}; 
                let nodeIndexCounter = 1;

                let primeraFuente = netNodes.find(n => n.tipo === 'nice_power');
                if(primeraFuente) pinToNodeMap[`${primeraFuente.id}_n`] = 0;

                conexiones.forEach(w => {
                    let k1 = `${w.m1}_${w.p1}`; let k2 = `${w.m2}_${w.p2}`;
                    let n1 = pinToNodeMap[k1]; let n2 = pinToNodeMap[k2];
                    
                    if(n1 !== undefined && n2 !== undefined) {
                        if(n1 !== n2) {
                            let oldNode = n2; let newNode = n1;
                            for(let k in pinToNodeMap) { if(pinToNodeMap[k] === oldNode) pinToNodeMap[k] = newNode; }
                        }
                    } else if(n1 !== undefined) { pinToNodeMap[k2] = n1; } 
                      else if(n2 !== undefined) { pinToNodeMap[k1] = n2; } 
                      else {
                        pinToNodeMap[k1] = nodeIndexCounter; pinToNodeMap[k2] = nodeIndexCounter;
                        nodeIndexCounter++;
                    }
                });

                netNodes.forEach(n => {
                    document.getElementById(n.id)?.querySelectorAll('.net-pin').forEach(p => {
                        let k = `${n.id}_${p.dataset.pin}`;
                        if(pinToNodeMap[k] === undefined) { pinToNodeMap[k] = nodeIndexCounter++; }
                    });
                });

                netNodes.forEach(n => {
                    document.getElementById(n.id)?.querySelectorAll('.net-pin').forEach(p => {
                        let k = `${n.id}_${p.dataset.pin}`;
                        let lbl = document.getElementById(`lbl_${n.id}_${p.dataset.pin}`);
                        if(lbl) lbl.innerText = `N${pinToNodeMap[k]}`;
                    });
                });

                updateScopeDropdown(nodeIndexCounter);

                let numNodes = nodeIndexCounter;
                let fuentesDeVoltaje = netNodes.filter(n => n.tipo === 'nice_power');
                let dim = numNodes + fuentesDeVoltaje.length;

                let A = Array.from({length: dim}, () => Array(dim).fill(0));
                let Z = Array(dim).fill(0);

                netNodes.forEach(n => {
                    if(n.tipo === 'resistencia') {
                        stampConductance(A, pinToNodeMap[`${n.id}_a`], pinToNodeMap[`${n.id}_b`], 1 / parseFloat(n.ajustes.r));
                    }
                    if(n.tipo === 'switch_cuchilla') {
                        // El aislamiento sube a 10 MegaOhmios reales para evitar fugas flotantes
                        let r_sw = n.ajustes.open ? 1e7 : 1e-2;
                        stampConductance(A, pinToNodeMap[`${n.id}_1`], pinToNodeMap[`${n.id}_2`], 1 / r_sw);
                    }
                    if(n.tipo === 'motor_dc') {
                        stampConductance(A, pinToNodeMap[`${n.id}_m1`], pinToNodeMap[`${n.id}_m2`], 1 / 30); 
                    }
                    if(n.tipo === 'foco_edison') {
                        stampConductance(A, pinToNodeMap[`${n.id}_t1`], pinToNodeMap[`${n.id}_t2`], 1 / 35); 
                    }
                    if(n.tipo === 'led_verde') {
                        stampConductance(A, pinToNodeMap[`${n.id}_an`], pinToNodeMap[`${n.id}_ca`], 1 / 50); 
                    }
                    if(n.tipo === 'condensador') {
                        let C = parseFloat(n.ajustes.c);
                        let g_cap = (2 * C) / DT;
                        let nA = pinToNodeMap[`${n.id}_a`];
                        let nB = pinToNodeMap[`${n.id}_b`];
                        stampConductance(A, nA, nB, g_cap);
                        let Ieq = g_cap * n.ajustes.v_hist;
                        stampCurrentSource(Z, nA, nB, Ieq);
                    }
                });

                fuentesDeVoltaje.forEach((f, idx) => {
                    let nP = pinToNodeMap[`${f.id}_p`]; let nN = pinToNodeMap[`${f.id}_n`];
                    let kIdx = numNodes + idx;
                    if(nP > 0) { A[nP][kIdx] += 1; A[kIdx][nP] += 1; }
                    if(nN > 0) { A[nN][kIdx] -= 1; A[kIdx][nN] -= 1; }
                    Z[kIdx] = f.ajustes.v;
                });

                let X = solveLinearSystem(A, Z);
                nodeVoltagesArray = {};
                for(let i = 0; i < numNodes; i++) {
                    nodeVoltagesArray[i] = X ? X[i] : 0;
                }

                // Si un switch está abierto, forzamos que su nodo de salida caiga a 0V si no hay capacitor alimentándolo
                netNodes.forEach(n => {
                    if (n.tipo === 'switch_cuchilla' && n.ajustes.open) {
                        let outNode = pinToNodeMap[`${n.id}_2`];
                        // Comprobación de vecindad: si no hay un capacitor cargado reteniendo tensión, se drena
                        let tieneCapacitorActivo = netNodes.some(cap => cap.tipo === 'condensador' && Math.abs(cap.ajustes.v_hist) > 0.5);
                        if (!tieneCapacitorActivo && outNode !== undefined) {
                            nodeVoltagesArray[outNode] = 0;
                        }
                    }
                });

                netNodes.forEach(n => {
                    let tel = document.getElementById(`tel_${n.id}`);
                    if(n.tipo === 'resistencia') {
                        n.v_drop = Math.abs((nodeVoltagesArray[pinToNodeMap[`${n.id}_a`]]||0) - (nodeVoltagesArray[pinToNodeMap[`${n.id}_b`]]||0));
                        if(tel) tel.innerText = `${n.v_drop.toFixed(1)}V`;
                    }
                    if(n.tipo === 'condensador') {
                        let vA = nodeVoltagesArray[pinToNodeMap[`${n.id}_a`]] || 0;
                        let vB = nodeVoltagesArray[pinToNodeMap[`${n.id}_b`]] || 0;
                        n.v_drop = vA - vB;
                        n.ajustes.v_hist = n.v_drop; 
                        if(tel) tel.innerText = `${Math.abs(n.v_drop).toFixed(1)}V [CAP]`;
                    }
                    if(n.tipo === 'switch_cuchilla') {
                        if(tel) tel.innerText = n.ajustes.open ? "ABIERTO" : "CONECTADO";
                        n.v_drop = n.ajustes.open ? 0 : 12; 
                    }
                    if(n.tipo === 'motor_dc') {
                        n.v_drop = Math.abs((nodeVoltagesArray[pinToNodeMap[`${n.id}_m1`]]||0) - (nodeVoltagesArray[pinToNodeMap[`${n.id}_m2`]]||0));
                        let current_rpm = (n.v_drop / 12) * n.ajustes.max_rpm;
                        if(tel) tel.innerText = `${current_rpm.toFixed(0)} RPM`;
                    }
                    if(n.tipo === 'foco_edison') {
                        n.v_drop = Math.abs((nodeVoltagesArray[pinToNodeMap[`${n.id}_t1`]]||0) - (nodeVoltagesArray[pinToNodeMap[`${n.id}_t2`]]||0));
                        if(tel) tel.innerText = `${n.v_drop.toFixed(1)}V`;
                    }
                    if(n.tipo === 'led_verde') {
                        n.v_drop = (nodeVoltagesArray[pinToNodeMap[`${n.id}_an`]]||0) - (nodeVoltagesArray[pinToNodeMap[`${n.id}_ca`]]||0);
                        if(tel) tel.innerText = `${Math.max(0, n.v_drop).toFixed(1)}V`;
                    }
                    if(n.tipo === 'nice_power') {
                        n.v_drop = n.ajustes.v;
                        if(tel) tel.innerText = `${n.v_drop.toFixed(1)}V`;
                    }
                });

                graphVoltage = Math.abs(nodeVoltagesArray[activeProbeNodeId] || 0);

                // CONTROL DE ENERGIZACIÓN ASOCIADO DIRECTAMENTE AL VOLTAJE ACTIVO REAL DEL NODO
                conexiones.forEach(w => {
                    let pNode = pinToNodeMap[`${w.m1}_${w.p1}`];
                    let sNode = pinToNodeMap[`${w.m2}_${w.p2}`];
                    let vMax = Math.max(Math.abs(nodeVoltagesArray[pNode]||0), Math.abs(nodeVoltagesArray[sNode]||0));
                    w.hasCurrent = vMax > 0.2; // Umbral de histéresis mínima para iluminación neón
                });

                renderFisicaComponentes();
            } catch(e) { resetOutputsZero(); }
        }

        function stampConductance(M, nA, nB, G) {
            if(nA > 0) M[nA][nA] += G; if(nB > 0) M[nB][nB] += G;
            if(nA > 0 && nB > 0) { M[nA][nB] -= G; M[nB][nA] -= G; }
        }
        function stampCurrentSource(V, nA, nB, Ieq) {
            if(nA > 0) V[nA] -= Ieq; if(nB > 0) V[nB] += Ieq;
        }

        function solveLinearSystem(A, Z) {
            let n = Z.length; if(n === 0) return null;
            for(let i=0; i<n; i++) A[i].push(Z[i]);
            for(let i=0; i<n; i++) {
                let maxEl = Math.abs(A[i][i]); let maxRow = i;
                for(let k=i+1; k<n; k++) { if(Math.abs(A[k][i])>maxEl) { maxEl=Math.abs(A[k][i]); maxRow=k; } }
                for(let k=i; k<n+1; k++) { let tmp=A[maxRow][k]; A[maxRow][k]=A[i][k]; A[i][k]=tmp; }
                if(Math.abs(A[i][i]) < 1e-9) continue;
                for(let k=0; k<n; k++) {
                    if(k!==i) {
                        let c = -A[k][i]/A[i][i];
                        for(let j=i; j<n+1; j++) { if(i===j) A[k][j]=0; else A[k][j]+=c*A[i][j]; }
                    }
                }
            }
            let res = Array(n).fill(0);
            for(let i=0; i<n; i++) { if(Math.abs(A[i][i]) > 1e-9) res[i]=A[i][n]/A[i][i]; }
            return res;
        }

        function resetOutputsZero() {
            graphVoltage = 0;
            netNodes.forEach(n => { n.v_drop = 0; let tel = document.getElementById(`tel_${n.id}`); if(tel) tel.innerText = "0.0V"; });
            renderFisicaComponentes();
        }

        function updateScopeDropdown(totalNodes) {
            let select = document.getElementById('scopeProbeNode');
            let currentSel = select.value;
            select.innerHTML = '<option value="0">GND (Node 0)</option>';
            for(let i = 1; i < totalNodes; i++) {
                let opt = document.createElement('option');
                opt.value = i; opt.innerText = `NODE CH1: ${i}`;
                if(String(i) === currentSel) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function changeScopeProbe() {
            activeProbeNodeId = parseInt(document.getElementById('scopeProbeNode').value) || 0;
            solveCircuitMNA();
        }

        function renderFisicaComponentes() {
            netNodes.forEach(n => {
                let div = document.getElementById(n.id); if(!div) return;

                if(n.tipo === 'led_verde') {
                    let bulb = div.querySelector(`#led_bulb_${n.id}`);
                    if(bulb) {
                        if(n.v_drop >= 1.5) {
                            bulb.setAttribute('fill', 'var(--green)');
                            bulb.style.filter = 'drop-shadow(0 0 8px var(--green))';
                        } else { bulb.setAttribute('fill', '#022c22'); bulb.style.filter = 'none'; }
                    }
                }

                if(n.tipo === 'foco_edison') {
                    let glass = div.querySelector(`#lamp_glass_${n.id}`);
                    if(glass) {
                        if(n.v_drop >= 1.5) {
                            glass.setAttribute('fill', 'var(--yellow)');
                            glass.style.filter = 'drop-shadow(0 0 10px var(--yellow))';
                        } else { glass.setAttribute('fill', 'rgba(255,255,255,0.01)'); glass.style.filter = 'none'; }
                    }
                }

                if(n.tipo === 'motor_dc') {
                    let prop = div.querySelector(`#propeller_${n.id}`);
                    if(prop) {
                        if(n.v_drop >= 0.5) {
                            let factorRpm = (n.v_drop / 12) * n.ajustes.max_rpm;
                            let rSpeed = Math.max(0.03, 60 / (factorRpm + 1)); 
                            prop.style.animation = `spinPropeller ${rSpeed}s linear infinite`;
                        } else { prop.style.animation = 'none'; }
                    }
                }
            });
        }

        function openInspector(n, e) {
            activeSelectedNode = n; inspector.style.display = 'block';
            let fields = document.getElementById('inspector-fields');
            if(n.tipo === 'nice_power') {
                fields.innerHTML = `<div class="row-ins"><label>Voltaje Fuente VDC:</label><input type="number" id="val_v" value="${n.ajustes.v}"></div>`;
            } else if(n.tipo === 'resistencia') {
                fields.innerHTML = `<div class="row-ins"><label>Valor Resistencia (𝛀):</label><input type="number" id="val_r" value="${n.ajustes.r}"></div>`;
            } else if(n.tipo === 'condensador') {
                fields.innerHTML = `<div class="row-ins"><label>Capacidad (Faradios):</label><input type="number" id="val_c" value="${n.ajustes.c}"></div>`;
            } else if(n.tipo === 'motor_dc') {
                fields.innerHTML = `<div class="row-ins"><label>Límite RPM Máximas:</label><input type="number" id="val_rpm" value="${n.ajustes.max_rpm}"></div>`;
            } else {
                fields.innerHTML = `<p style="font-size:10px; color:#5c6c9c; text-align:center; padding:5px 0;">Solid-State Component.</p>`;
            }
        }

        function applyNodeSettings() {
            if(activeSelectedNode) {
                if(activeSelectedNode.tipo === 'nice_power') activeSelectedNode.ajustes.v = parseFloat(document.getElementById('val_v').value) || 0;
                if(activeSelectedNode.tipo === 'resistencia') activeSelectedNode.ajustes.r = parseFloat(document.getElementById('val_r').value) || 1;
                if(activeSelectedNode.tipo === 'condensador') activeSelectedNode.ajustes.c = parseFloat(document.getElementById('val_c').value) || 0.01;
                if(activeSelectedNode.tipo === 'motor_dc') activeSelectedNode.ajustes.max_rpm = parseFloat(document.getElementById('val_rpm').value) || 1000;
            }
            inspector.style.display = 'none'; solveCircuitMNA();
        }

        // --- OSCILOSCOPIO ANALÓGICO CALIBRADO CON SEÑAL TOTALMENTE VISIBLE ---
        function initOscilloscope() {
            scopeCanvas = document.getElementById('scopeCanvas');
            scopeCtx = scopeCanvas.getContext('2d');
            
            // Forzar escalado dinámico según el contenedor para evitar visual neutra o fuera de pantalla
            scopeCanvas.width = scopeCanvas.parentElement.clientWidth;
            scopeCanvas.height = 65;

            let xTrace = 0;
            let pointsBuffer = Array(scopeCanvas.width).fill(55);

            function renderScope() {
                requestAnimationFrame(renderScope);
                
                // Persistencia del tubo de fósforo catódico
                scopeCtx.fillStyle = 'rgba(1, 6, 2, 0.2)';
                scopeCtx.fillRect(0, 0, scopeCanvas.width, scopeCanvas.height);

                // Retícula verde militar
                scopeCtx.strokeStyle = '#051b08';
                scopeCtx.lineWidth = 1;
                for(let i=0; i<scopeCanvas.width; i+=25) { scopeCtx.beginPath(); scopeCtx.moveTo(i,0); scopeCtx.lineTo(i,65); scopeCtx.stroke(); }
                for(let j=0; j<65; j+=13) { scopeCtx.beginPath(); scopeCtx.moveTo(0,j); scopeCtx.lineTo(scopeCanvas.width,j); stroke(); }

                // Ruido térmico de RF real (0.08V)
                let thermalNoise = (Math.random() - 0.5) * 0.12;
                let activeV = graphVoltage > 0.05 ? graphVoltage + thermalNoise : 0;

                // ESCALADO Y OFFSET CENTRADO COMPLEMENTARIO: 0V abajo (línea 55), 12V centro-arriba (línea 20)
                // Evita que la señal colapse arriba o abajo en visual neutra
                let calculatedY = 55 - (activeV * (35 / 12));
                if(calculatedY < 4) calculatedY = 4; 
                if(calculatedY > 60) calculatedY = 60;

                pointsBuffer[xTrace] = calculatedY;

                // Render del haz de electrones
                scopeCtx.strokeStyle = 'var(--green)';
                scopeCtx.lineWidth = 2;
                scopeCtx.shadowBlur = 4;
                scopeCtx.shadowColor = 'var(--green)';
                
                scopeCtx.beginPath();
                scopeCtx.moveTo(0, pointsBuffer[0]);
                for(let k=1; k<scopeCanvas.width; k++) {
                    scopeCtx.lineTo(k, pointsBuffer[k]);
                }
                scopeCtx.stroke();
                scopeCtx.shadowBlur = 0;

                xTrace = (xTrace + 2) % scopeCanvas.width;

                // OSD Calibrado en pantalla
                scopeCtx.fillStyle = 'var(--green)';
                scopeCtx.font = '9px monospace';
                scopeCtx.fillText(`CH1 (N${activeProbeNodeId}): ${activeV.toFixed(2)} VDC`, 10, 12);
            }
            renderScope();
        }

        window.addEventListener('load', () => {
            initAirportTicker();
            initOscilloscope();
            sandbox.addEventListener('click', () => { inspector.style.display = 'none'; });
            setInterval(() => { solveCircuitMNA(); }, 50); 
        });
    </script>
